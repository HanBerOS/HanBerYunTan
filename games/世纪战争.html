<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世纪战争 · 四大战役</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12100c; --panel:#1c1812; --panel2:#262018; --line:#3d3426;
  --gold:#c9a35c; --gold2:#e8cf8f; --text:#e9dfc9; --dim:#a2967f;
  --red:#c0392b; --green:#6aa84f; --blue:#3f6fd8;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-display:Georgia,"Noto Serif SC","Songti SC","SimSun",serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:var(--font-body);cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:14px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--gold);background:#2e271d}
button.primary{background:linear-gradient(180deg,#3a2f1c,#2a2215);border-color:var(--gold);color:var(--gold2)}
button.primary:hover{background:linear-gradient(180deg,#4a3c24,#362b18)}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
#app{height:100vh;display:flex;flex-direction:column}
/* ========== 主菜单 ========== */
#view-menu{flex:1;overflow:auto;background:
  radial-gradient(ellipse at 50% -10%,#2a2418 0%,#14110c 55%),
  repeating-linear-gradient(45deg,rgba(201,163,92,.02) 0 2px,transparent 2px 6px);
  padding:34px 20px 40px;display:flex;flex-direction:column;align-items:center}
.menu-inner{width:min(1080px,100%);margin:0 auto}
.logo-wrap{text-align:center;margin-bottom:26px}
.logo-kicker{letter-spacing:.5em;color:var(--gold);font-size:13px;text-transform:uppercase;margin-bottom:8px}
h1.logo{font-family:var(--font-display);font-size:54px;font-weight:700;color:var(--gold2);letter-spacing:.14em;text-shadow:0 2px 24px rgba(201,163,92,.28)}
.logo-sub{margin-top:10px;color:var(--dim);font-size:14px;letter-spacing:.2em}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:8px 0 22px}
.campaign-card{background:linear-gradient(180deg,#1d1913,#18140f);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;position:relative;transition:border-color .15s,transform .15s,box-shadow .15s}
.campaign-card:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 26px rgba(0,0,0,.45)}
.campaign-card.selected{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2),0 8px 26px rgba(0,0,0,.5)}
.cc-year{color:var(--gold);font-family:var(--font-display);font-size:15px;letter-spacing:.08em}
.cc-name{font-family:var(--font-display);font-size:24px;font-weight:700;margin:4px 0 8px;color:var(--text)}
.cc-desc{color:var(--dim);font-size:13px;line-height:1.6;min-height:42px}
.cc-factions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cc-chip{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;gap:5px}
.cc-chip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.cc-end{position:absolute;top:12px;right:14px;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.settings-row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:18px}
.setting-block{display:flex;flex-direction:column;gap:8px}
.setting-label{font-size:12px;color:var(--dim);letter-spacing:.1em}
.pill-group{display:flex;gap:6px}
.pill{border:1px solid var(--line);background:var(--panel2);color:var(--dim);padding:7px 14px;border-radius:20px;font-size:13px}
.pill.active{border-color:var(--gold);color:var(--gold2);background:#31291a}
.pill:hover{border-color:var(--gold)}
#playerFactionWrap{display:none}
#playerFactionWrap.show{display:flex}
.start-row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
#btnStart{font-size:17px;padding:12px 42px;letter-spacing:.15em}
.help-note{max-width:760px;margin:26px auto 0;color:var(--dim);font-size:12.5px;line-height:1.8;border:1px dashed var(--line);border-radius:8px;padding:12px 16px}
/* ========== 游戏界面 ========== */
#view-game{flex:1;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top-title{font-family:var(--font-display);font-size:18px;color:var(--gold2);letter-spacing:.06em;white-space:nowrap}
.top-date{font-family:var(--font-display);font-size:16px;color:var(--text);min-width:120px}
.top-spacer{flex:1}
.speed-group{display:flex;gap:4px}
.speed-btn{min-width:40px;padding:7px 8px;font-size:12px}
.speed-btn.active{border-color:var(--gold);color:var(--gold2);background:#31291a}
.icon-btn{padding:7px 12px;font-size:12px}
.game-main{flex:1;display:flex;min-height:0}
.map-wrap{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:
  radial-gradient(ellipse at 20% 10%,rgba(201,163,92,.06),transparent 60%),
  #16130e}
.map-svg{flex:1;width:100%;height:100%;min-height:320px}
.ticker{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--dim);overflow:hidden;white-space:nowrap}
.ticker .t-item{flex:none;padding:3px 10px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.t-item.t-war{border-color:#5a3a2c;color:#e0a98c}
.t-item.t-good{border-color:#33502c;color:#a9c98f}
.t-item.t-bad{border-color:#5a2c28;color:#e08c84}
/* 侧栏 */
.sidebar{width:350px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab-btn{flex:1;padding:10px 0;background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;font-size:13px;color:var(--dim)}
.tab-btn.active{color:var(--gold2);border-bottom-color:var(--gold)}
.tab-btn:hover{border-bottom-color:var(--line);background:none}
.tab-panel{flex:1;overflow:auto;padding:12px;min-height:0}
.faction-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border:1px solid transparent;border-radius:8px;margin-bottom:6px;background:var(--panel2)}
.faction-row.dead{opacity:.4;filter:grayscale(.7)}
.faction-row .fr-info{flex:1;min-width:0}
.fr-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.fr-leader{font-size:11.5px;color:var(--dim);margin:2px 0 5px}
.fr-stats{display:flex;gap:10px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.fr-stats b{color:var(--text);font-weight:600}
.morale-bar{height:5px;background:#241e15;border-radius:3px;overflow:hidden;margin-top:5px}
.morale-bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a2a,var(--gold2))}
.morale-bar.low i{background:linear-gradient(90deg,#5a2c28,#c0392b)}
.turn-badge{font-size:11px;padding:2px 8px;border-radius:12px;background:#31291a;color:var(--gold2);border:1px solid var(--line)}
.region-detail{display:flex;flex-direction:column;gap:10px}
.rd-head{font-family:var(--font-display);font-size:19px;color:var(--gold2)}
.rd-line{font-size:13px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.rd-line b{color:var(--text)}
.rd-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.rd-actions button{flex:1;min-width:96px;min-height:44px}
.log-list{font-size:12.5px;line-height:1.65}
.log-item{padding:5px 8px;border-left:3px solid var(--line);margin-bottom:5px;background:var(--panel2);border-radius:0 5px 5px 0}
.log-item.war{border-color:#a0662f;color:#e3c9a0}
.log-item.good{border-color:var(--green);color:#b9d4a4}
.log-item.bad{border-color:var(--red);color:#e0a29a}
.log-item.info{border-color:var(--blue)}
.log-item .lt{color:var(--dim);font-size:11px;margin-right:6px}
.empty-tip{color:var(--dim);font-size:13px;text-align:center;padding:30px 10px;line-height:1.8}
/* 结局 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,7,5,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.end-card{width:min(720px,100%);background:linear-gradient(180deg,#221c13,#181410);border:1px solid var(--gold);border-radius:12px;padding:34px 38px;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;overflow:auto;max-height:92vh}
.end-card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,163,92,.35);border-radius:8px;pointer-events:none}
.end-kicker{color:var(--gold);font-size:12px;letter-spacing:.35em;text-align:center;margin-bottom:10px}
.end-title{font-family:var(--font-display);font-size:34px;font-weight:700;text-align:center;color:var(--gold2);line-height:1.3}
.end-sub{text-align:center;color:var(--dim);font-size:14px;margin-top:8px}
.end-epilogue{margin:20px 0 18px;color:#d8ccb2;font-size:14.5px;line-height:2;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:16px 2px;text-align:justify}
.end-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.es-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:center;background:var(--panel2)}
.es-box .es-v{font-family:var(--font-display);font-size:21px;color:var(--gold2)}
.es-box .es-k{font-size:11.5px;color:var(--dim);margin-top:3px}
.end-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* 自检面板 */
.self-card{width:min(860px,100%);background:linear-gradient(180deg,#221c13,#181410);border:1px solid var(--gold);border-radius:12px;padding:24px 28px;overflow:auto;max-height:94vh}
.self-title{font-family:var(--font-display);font-size:22px;color:var(--gold2);margin-bottom:6px}
.self-sum{font-size:14px;color:var(--dim);margin-bottom:14px;line-height:1.7}
.self-sum b{color:var(--text)}
.self-table{width:100%;border-collapse:collapse;font-size:12.5px}
.self-table th{color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:400}
.self-table td{padding:6px 8px;border-bottom:1px solid #241f17;color:var(--text)}
.self-ok{color:#9fd08a}.self-fail{color:#e08c84}
.self-err{color:#e08c84;font-size:12px;line-height:1.6;background:#2a1412;border:1px solid #4a2a22;border-radius:6px;padding:10px;margin-top:10px;white-space:pre-wrap}
.self-btns{display:flex;gap:10px;margin-top:16px}
/* 提示 */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;background:#3a1412;border:1px solid #6a2a20;color:#eeb;font-size:13px;padding:9px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:80vw}
/* SVG 图内 */
.map-note{position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:11px;pointer-events:none}
.legend-hint{position:absolute;right:12px;bottom:10px;color:var(--dim);font-size:11px;pointer-events:none}
/* 移动端 */
@media (max-width:900px){
  .game-main{flex-direction:column}
  .sidebar{width:100%;border-left:none;border-top:1px solid var(--line);max-height:38%}
  h1.logo{font-size:36px}
  .topbar{gap:8px}
  .top-date{min-width:0}
}
</style>
</head>
<body>
<div id="app">

<!-- ========== 主菜单 ========== -->
<section id="view-menu" class="view">
  <div class="menu-inner">
    <div class="logo-wrap">
      <div class="logo-kicker">Epoch Wars · 1815 — 1945</div>
      <h1 class="logo">世纪战争</h1>
      <div class="logo-sub">四大战役 · 全人机自由推演 · 多结局</div>
    </div>
    <div class="cards-grid" id="menuCampaigns"></div>
    <div class="settings-row">
      <div class="setting-block">
        <div class="setting-label">战役难度</div>
        <div class="pill-group" id="diffPills">
          <button class="pill" data-diff="easy">简单</button>
          <button class="pill active" data-diff="normal">普通</button>
          <button class="pill" data-diff="hard">困难</button>
        </div>
      </div>
      <div class="setting-block">
        <div class="setting-label">游戏模式</div>
        <div class="pill-group" id="modePills">
          <button class="pill active" data-mode="ai">全人机观战</button>
          <button class="pill" data-mode="player">玩家参战</button>
        </div>
      </div>
      <div class="setting-block" id="playerFactionWrap">
        <div class="setting-label">选择阵营</div>
        <select id="playerFactionSelect" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px"></select>
      </div>
    </div>
    <div class="start-row">
      <button id="btnStart" class="primary">开始推演</button>
      <button id="btnSelftest">功能自检</button>
    </div>
    <div class="help-note">
      玩法说明：回合制战争推演，每回合一个月。全人机模式下所有阵营由 AI 指挥，你负责观战与加速；
      玩家参战模式下你指挥所选阵营（选中己方地区可招募军队，选中敌方相邻地区可发起进攻，然后点“结束回合”）。
      结局多样：一方霸权、阵营覆灭、停战和约、革命或僵持，皆视战局而定。本页为单文件离线可玩，可直接拖入 Netlify 部署。
    </div>
  </div>
</section>

<!-- ========== 游戏界面 ========== -->
<section id="view-game" class="view hidden">
  <div class="topbar">
    <div class="top-title" id="gameTitle">战役</div>
    <div class="top-date" id="gameDate">—</div>
    <div class="top-spacer"></div>
    <div class="speed-group" id="speedGroup">
      <button class="speed-btn" data-speed="1">1x</button>
      <button class="speed-btn active" data-speed="2">2x</button>
      <button class="speed-btn" data-speed="4">4x</button>
      <button class="speed-btn" data-speed="8">8x</button>
    </div>
    <button id="btnPause" class="icon-btn">暂停</button>
    <button id="btnStep" class="icon-btn" title="推进一个月">单步</button>
    <button id="btnFast" class="icon-btn primary" title="快速推演到结局">快进至结局</button>
    <button id="btnMenu" class="icon-btn">主菜单</button>
  </div>
  <div class="game-main">
    <div class="map-wrap">
      <svg id="mapSvg" class="map-svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="map-note">点击地区查看详情</div>
      <div class="legend-hint" id="mapHint">首都 · 双环标记</div>
    </div>
    <div class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="overview">势力</button>
        <button class="tab-btn" data-tab="region">地区</button>
        <button class="tab-btn" data-tab="log">战报</button>
      </div>
      <div class="tab-panel" id="panOverview"></div>
      <div class="tab-panel hidden" id="panRegion"></div>
      <div class="tab-panel hidden" id="panLog"></div>
    </div>
  </div>
  <div class="ticker" id="ticker"></div>
</section>

<!-- ========== 结局 ========== -->
<div id="endOverlay" class="overlay hidden">
  <div class="end-card">
    <div class="end-kicker">E P O I L O G U E</div>
    <div class="end-title" id="endTitle"></div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-epilogue" id="endEpilogue"></div>
    <div class="end-stats" id="endStats"></div>
    <div class="end-btns">
      <button id="btnAgain" class="primary">再来一局</button>
      <button id="btnMenuEnd">返回主菜单</button>
    </div>
  </div>
</div>

<!-- ========== 自检 ========== -->
<div id="selftestOverlay" class="overlay hidden">
  <div class="self-card">
    <div class="self-title">功能自检</div>
    <div class="self-sum" id="selfSummary">正在运行全部战役……</div>
    <div id="selfBody"></div>
    <div class="self-btns">
      <button id="btnSelfRun" class="primary">重新自检</button>
      <button id="btnSelfClose">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
</div>

<script>
'use strict';
/* ================= 工具函数 ================= */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmt(n){return Math.round(n).toLocaleString('zh-CN');}
function mulberry32(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^(t>>>15),1|t);r^=r+Math.imul(r^(r>>>7),61|r);return((r^(r>>>14))>>>0)/4294967296;};}
function shieldSVG(color,size){
  size=size||16;
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" style="flex:none"><path d="M12 1.8 21 5v6.2c0 5.6-3.8 9.6-9 11.4-5.2-1.8-9-5.8-9-11.4V5z" fill="'+color+'" stroke="#000" stroke-opacity=".35" stroke-width="1.2"/><path d="M12 1.8 21 5v6.2c0 5.6-3.8 9.6-9 11.4" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1"/></svg>';
}

/* ================= 全局状态 ================= */
const G={
  cid:null, diff:'normal', mode:'ai', pfid:null,
  campaign:null, factions:[], regions:[], rmap:{}, fmap:{},
  turn:0, turnLimit:0, year0:0,
  speed:2, paused:false, timer:null,
  waiting:false, curFaction:null, selected:null, ended:false,
  battles:0, casualties:0, log:[], ticker:[], fast:false,
  flags:{}, errors:[], rng:null,
  diffConf:{
    easy:   {income:1.10, aggr:0.85, defMul:0.92},
    normal: {income:1.00, aggr:1.00, defMul:1.00},
    hard:   {income:1.18, aggr:1.30, defMul:1.08}
  }
};
function now(){return G.year0+Math.floor(G.turn/12)+'-'+String((G.turn%12)+1).padStart(2,'0');}

/* ================= 数据构建 ================= */
function mkRegion(r){
  return {id:r[0],name:r[1],owner:r[2],x:r[3],y:r[4],army:r[5],prod:r[6],manpower:r[7],def:r[8],capitalOf:r[9]||null};
}
function mkFaction(f){
  return {id:f.id,name:f.name,short:f.short,color:f.color,leader:f.leader,gen:f.gen,
    money:f.money,manpower:f.manpower,morale:f.morale,warGoal:f.warGoal||null,
    enemies:(f.enemies||[]).slice(),dormant:f.dormant||false,active:true,eliminated:false,neutral:false,isPlayer:false};
}

function buildCampaign(def){
  const c={id:def.id,name:def.name,subtitle:def.subtitle,year0:def.year0,turnLimit:def.turnLimit,
    intro:def.intro,factions:[],regions:[],edges:def.edges,
    events:def.events.map(e=>Object.assign({},e)),
    endings:def.endings.map(e=>Object.assign({},e))};
  def.factions.forEach(f=>c.factions.push(mkFaction(f)));
  def.regions.forEach(r=>c.regions.push(mkRegion(r)));
  c.regions.forEach(r=>{if(r.capitalOf)r.def=Math.min(r.def,2);});
  return c;
}

/* ---- 拿破仑战争 ---- */
const DEF_NAP={
  id:'napoleon', name:'拿破仑战争', subtitle:'1805 — 1815 · 欧陆烽火', year0:1805, turnLimit:120,
  intro:'法兰西的雄鹰翱翔于欧陆，反法同盟的烽火四起。',
  factions:[
    {id:'FRA',name:'法兰西帝国',short:'法',color:'#3f6fd8',leader:'拿破仑·波拿巴',gen:5,money:1000,manpower:500,morale:86,warGoal:'london',enemies:['GBR','RUS','PRU','AUS']},
    {id:'GBR',name:'大英帝国',short:'英',color:'#c0392b',leader:'威灵顿公爵',gen:4,money:720,manpower:400,morale:80,warGoal:'paris',enemies:['FRA']},

  if(!rus||rus.eliminated)return;
  rus.eliminated=true;rus.morale=0;
  const ws=G.rmap['warsaw'];
  G.campaign.regions.forEach(r=>{
    if(r.owner==='RUS'){r.owner='';r.army=Math.max(2,Math.round(r.army*0.4));}
  });
  ws.owner=(ger&&!ger.eliminated)?'GER':'';
  if(ger&&!ger.eliminated)ger.morale=clamp(ger.morale+10,0,100);
  G.flags.russiaOut=true;
  addLog('bad','十月革命爆发：苏维埃政权与德国签订布列斯特和约，俄国退出战争');
}

const CAMPAIGNS={napoleon:DEF_NAP,ww1:DEF_WW1,october:DEF_OCT,ww2:DEF_WW2};
const CAMPAIGN_ORDER=['napoleon','ww1','october','ww2'];

function addLog(type,text){
  const t=G.turn;
  G.log.unshift({type:type,text:text,t:t});
  if(G.log.length>220)G.log.pop();
  G.ticker.unshift({type:type,text:text});
  if(G.ticker.length>4)G.ticker.pop();
}

/* ================= 游戏引擎 ================= */
function startGame(cid,diff,mode,pfid){
  stopTimer();
  Object.assign(G,{
    cid:cid,diff:diff,mode:mode,pfid:pfid,
    campaign:buildCampaign(CAMPAIGNS[cid]),
    turn:0,turnLimit:CAMPAIGNS[cid].turnLimit,year0:CAMPAIGNS[cid].year0,
    paused:false,waiting:false,curIdx:0,incomeDone:false,
    selected:null,ended:false,battles:0,casualties:0,winCount:0,lossCount:0,
    log:[],ticker:[],flags:{},errors:[],result:null,fast:false
  });
  G.speed=2;
  G.factions=G.campaign.factions;
  G.regions=G.campaign.regions;
  const seed=(Math.random()*0x7fffffff)>>>0;
  G.rng=mulberry32(seed);
  G.rmap={};G.fmap={};
  G.campaign.regions.forEach(r=>G.rmap[r.id]=r);
  G.campaign.factions.forEach(f=>{
    f.isPlayer=(mode==='player'&&f.id===pfid);
    if(f.dormant)f.active=false;
    G.fmap[f.id]=f;
  });
  if(mode==='player'&&G.fmap[pfid]&&!G.fmap[pfid].eliminated){
    G.fmap[pfid].morale=clamp(G.fmap[pfid].morale+5,0,100);
  }
  showView('view-game');
  renderAll();
  startTimer();
}

function incomeAll(){
  const mul=G.diffConf[G.diff].income;
  G.campaign.regions.forEach(r=>{
    const f=r.owner?G.fmap[r.owner]:null;
    if(f&&!f.eliminated&&f.active){
      f.money+=Math.round(r.prod*mul);
      f.manpower=clamp(f.manpower+r.manpower,0,999);
    }
  });
  G.factions.forEach(f=>{
    if(f.eliminated||!f.active)return;
    const tot=G.campaign.regions.filter(r=>r.owner===f.id).reduce((s,r)=>s+r.army,0);
    if(tot<=0)return;
    const upkeep=Math.round(tot*(0.5+G.turn*0.004));
    f.money-=upkeep;
    if(f.money<0){
      const need=-f.money;
      f.money=0;
      const scale=Math.max(0.2,1-need/tot);
      G.campaign.regions.forEach(r=>{
        if(r.owner===f.id)r.army=Math.max(1,Math.round(r.army*scale));
      });
      addLog('info',f.name+'财政崩溃，前线军队哗变溃散');
    }
  });
}

function monthStep(){
  if(G.ended||G.waiting)return;
  if(!G.incomeDone){incomeAll();G.incomeDone=true;}
  const factions=G.campaign.factions;
  let i=G.curIdx||0;
  for(;i<factions.length;i++){
    const f=factions[i];
    G.curIdx=i+1;
    if(f.eliminated||!f.active||f.neutral)continue;
    if(f.isPlayer&&G.mode==='player'){
      G.waiting=true;G.curFaction=f;
      toast('轮到你指挥：'+f.name);
      renderAll();
      return;
    }
    aiAct(f);
  }
  G.incomeDone=false;G.curIdx=0;
  G.turn++;
  runEvents();
  checkCollapse();
  const end=checkEnding();
  if(end){finishGame(end);return;}
  if(G.turn>=G.turnLimit){
    const last=G.campaign.endings[G.campaign.endings.length-1];
    finishGame(last);return;
  }
}

/* ---- 战力与战斗 ---- */
function atkPower(f,army){
  return army*(1+f.gen*0.045)*(0.75+f.morale/200);
}
function defPower(f,army,def){
  const morale=f?f.morale:60;
  const gen=f?f.gen:0;
  return army*(1+gen*0.045)*(0.8+morale/250)*Math.min(2.2,1+def*0.018);
}
function attack(f,fromId,toId){
  const from=G.rmap[fromId],to=G.rmap[toId];
  if(!from||!to||from.army<2)return 'none';
  const dc=G.diffConf[G.diff];
  const defF=to.owner?G.fmap[to.owner]:null;
  const atkA=from.army,defA=to.army;
  let combined=atkA;
  const helpers=[];
  G.campaign.edges.forEach(e=>{
    const a=G.rmap[e[0]],b=G.rmap[e[1]];
    if(e[0]===to.id&&b.owner===f.id&&b.id!==from.id)helpers.push(b);
    else if(e[1]===to.id&&a.owner===f.id&&a.id!==from.id)helpers.push(a);
  });
  helpers.forEach(h=>{combined+=Math.round(h.army*0.4);});
  const numAdv=0.5*Math.min(0.35,Math.max(-0.35,(combined-defA)/Math.max(1,defA)));
  const fresh=(G.turn-(to.flipTurn||-99)<3)?2:0;
  const ap=atkPower(f,combined)*(0.85+G.rng()*0.3)*1.12*(1+numAdv);
  const dp=defPower(defF,defA,to.def+fresh)*(0.85+G.rng()*0.3)*(defF?dc.defMul:1);
  G.battles++;
  let loss;
  if(ap>dp){
    loss=Math.min(Math.round(combined*0.35),Math.round(defA*0.30)+2);
    const moved=Math.max(1,Math.round(from.army*0.45));
    from.army=Math.max(1,from.army-Math.round(loss*from.army/combined));
    helpers.forEach(h=>{h.army=Math.max(1,h.army-Math.round(loss*0.4*h.army/combined));});
    G.casualties+=loss;
    to.army=moved;
    const oldOwner=to.owner;
    to.owner=f.id;
    to.flipTurn=G.turn;
    if(to.capitalOf){
      const oldF=G.fmap[to.capitalOf];
      if(oldF&&!oldF.eliminated){
        eliminateFaction(oldF,f);
      }
    }
    addLog('war',f.name+'攻克'+to.name+(to.capitalOf?'（首都陷落！）':''));
    f.morale=clamp(f.morale+4,0,100);
    if(oldOwner&&G.fmap[oldOwner]&&!G.fmap[oldOwner].eliminated){
      G.fmap[oldOwner].morale=clamp(G.fmap[oldOwner].morale-(to.capitalOf?8:2),0,100);
    }
    if(to.id==='paris'&&G.cid==='napoleon')G.flags.parisBy=f.id;
    G.winCount=(G.winCount||0)+1;
    return 'win';
  }else{
    loss=Math.round(combined*(0.32+G.rng()*0.18));
    from.army=Math.max(1,from.army-Math.round(loss*from.army/combined));
    helpers.forEach(h=>{h.army=Math.max(1,h.army-Math.round(loss*0.4*h.army/combined));});
    G.casualties+=loss;
    const dl=Math.round(defA*(0.15+G.rng()*0.15));
    to.army=Math.max(0,to.army-dl);
    if(defF&&!defF.eliminated)defF.morale=clamp(defF.morale+1,0,100);
    f.morale=clamp(f.morale-2,0,100);
    G.lossCount=(G.lossCount||0)+1;
    return 'loss';
  }
}
function eliminateFaction(f,by){
  if(f.eliminated)return;
  f.eliminated=true;f.morale=0;
  G.campaign.regions.forEach(r=>{
    if(r.owner===f.id){
      r.owner='';
      r.army=Math.max(1,Math.round(r.army*0.4));
    }
  });
  if(by&&!by.eliminated){
    by.morale=clamp(by.morale+14,0,100);
    addLog('bad',f.name+'的政权崩溃，各地方势力观望摇摆');
  }
}
function checkCollapse(){
  G.factions.forEach(f=>{
    if(f.eliminated||!f.active)return;
    const has=G.campaign.regions.some(r=>r.owner===f.id);
    if(!has){f.eliminated=true;addLog('bad',f.name+'已彻底覆灭');}
  });
}

/* ---- AI ---- */
function threatScore(r){
  let s=(r.capitalOf&&r.capitalOf===r.owner)?25:0;
  G.campaign.edges.forEach(e=>{
    const oth=e[0]===r.id?e[1]:(e[1]===r.id?e[0]:null);
    if(!oth)return;
    const o=G.rmap[oth];
    if(!o)return;
    if(o.owner&&G.fmap[o.owner]&&G.fmap[o.owner].enemies.indexOf(r.owner)>=0)s+=o.army;
    else if(!o.owner)s+=o.army*0.3;
  });
  return s;
}
function recruit(f,n){
  const cost=20,mp=2;
  const affordable=Math.min(n,Math.floor(f.money/cost),Math.floor(f.manpower/mp));
  if(affordable<=0)return;
  f.money-=affordable*cost;
  f.manpower-=affordable*mp;
  const cands=G.campaign.regions.filter(r=>r.owner===f.id&&r.army<100);
  if(!cands.length)return;
  cands.sort((a,b)=>threatScore(b)-threatScore(a));
  cands[0].army=Math.min(100,cands[0].army+affordable);
}
function adjacentFrom(f,to){
  let best=null,bestArmy=0;
  G.campaign.edges.forEach(e=>{
    const a=G.rmap[e[0]],b=G.rmap[e[1]];
    let mine=null;
    if(e[0]===to.id&&b.owner===f.id)mine=b;
    else if(e[1]===to.id&&a.owner===f.id)mine=a;
    if(mine&&mine.army>bestArmy){best=mine;bestArmy=mine.army;}
  });
  return best;
}
function pickTargets(f){
  const dc=G.diffConf[G.diff];
  const out=[];
  const hasEnemy=G.campaign.regions.some(r=>r.owner&&G.fmap[r.owner]&&!G.fmap[r.owner].eliminated&&G.fmap[r.owner].enemies.indexOf(f.id)>=0);
  G.campaign.regions.forEach(to=>{
    if(to.owner===f.id)return;
    if(to.owner&&G.fmap[to.owner]&&G.fmap[to.owner].eliminated)return;
    const isEnemy=to.owner&&G.fmap[to.owner].enemies.indexOf(f.id)>=0;
    const isTruce=to.owner&&G.fmap[to.owner].neutral;
    const isNeutral=!to.owner;
    if(!isEnemy&&!isTruce&&!isNeutral)return;
    if(isTruce&&G.rng()>0.3)return;
    if(isNeutral&&G.rng()>(hasEnemy?0.18:0.55))return;
    const from=adjacentFrom(f,to);
    if(!from||from.army<3)return;
    const ap=atkPower(f,from.army);
    const dp=defPower(to.owner?G.fmap[to.owner]:null,to.army,to.def)*dc.defMul;
    const odds=ap/dp*1.02;
    const score=to.prod*2+(to.capitalOf?18:0)+(to.id===f.warGoal?14:0);
    out.push({from:from.id,to:to.id,odds:odds,score:score});
  });
  out.sort((a,b)=>b.score-a.score);
  return out;
}
function aiMove(f){
  if(f.eliminated||!f.active)return;
  const owned=G.campaign.regions.filter(r=>r.owner===f.id&&r.army>45);
  const poor=G.campaign.regions.filter(r=>r.owner===f.id&&r.army<28&&threatScore(r)>0);
  if(!owned.length||!poor.length)return;
  owned.sort((a,b)=>b.army-a.army);
  poor.sort((a,b)=>threatScore(b)-threatScore(a));
  const from=owned[0],to=poor[0];
  if(from===to)return;
  const amt=Math.min(30,from.army-20);
  if(amt<5)return;
  from.army-=amt;to.army+=amt;
}
function aiAct(f){
  const dc=G.diffConf[G.diff];
  if(f.money>220&&f.manpower>=20){
    recruit(f,Math.min(12,Math.floor(f.money/240)+4));
  }else if(f.money>120&&f.manpower>=10){
    recruit(f,5);
  }
  aiMove(f);
  const targets=pickTargets(f);
  let strategic=f.warGoal;
  if(strategic&&G.rmap[strategic]&&G.rmap[strategic].owner===f.id){
    let best=null,bs=-1;
    G.campaign.regions.forEach(r=>{
      if(!r.capitalOf)return;
      const of=r.owner?G.fmap[r.owner]:null;
      if(!of||of.eliminated||of.id===f.id||of.enemies.indexOf(f.id)<0)return;
      let reach=false;
      G.campaign.edges.forEach(e=>{
        if(reach)return;
        if(e[0]===r.id&&G.rmap[e[1]].owner===f.id)reach=true;
        if(e[1]===r.id&&G.rmap[e[0]].owner===f.id)reach=true;
      });
      if(!reach)return;
      if(r.army>bs){bs=r.army;best=r;}
    });
    if(best)strategic=best.id;
  }
  let attacks=0;
  const maxAtk=(f.gen>=4||dc.aggr>=1.25)?2:1;
  targets.forEach(t=>{
    if(attacks>=maxAtk)return;
    let go=false;
    if((t.to===f.warGoal||t.to===strategic)&&t.odds>0.72)go=true;
    else if(t.odds>1.18)go=true;
    else if(t.odds>1.02&&t.score>=5)go=true;
    else if(t.odds>0.92&&G.rng()<0.30)go=true;
    if(!go)return;
    const r=attack(f,t.from,t.to);
    if(r==='win'){attacks++;}
    else if(r==='loss'){attacks=maxAtk;}
  });
  if(f.morale<32&&G.rng()<0.3&&!f.neutral){
    const foes=G.factions.filter(x=>!x.eliminated&&x.active&&!x.neutral&&x.enemies.indexOf(f.id)>=0);
    if(foes.length){
      foes.sort((a,b)=>b.morale-a.morale);
      const top=foes[0];
      if(top.morale>60||G.rng()<0.4){
        f.neutral=true;
        addLog('info',f.name+'向'+top.name+'求和，宣布退出战争');
        top.morale=clamp(top.morale+4,0,100);
      }
    }
  }
}

/* ---- 事件与结局 ---- */
function runEvents(){
  (G.campaign.events||[]).forEach(ev=>{
    if(ev.done)return;
    if(G.turn<ev.min||G.turn>ev.max)return;
    ev.run();
    if(ev.once)ev.done=true;
  });
}
function checkEnding(){
  for(let i=0;i<G.campaign.endings.length;i++){
    const e=G.campaign.endings[i];
    try{
      if(e.check())return e;
    }catch(err){pushErr(err);}
  }
  return null;
}
function finishGame(e){
  if(G.ended)return;
  G.ended=true;
  stopTimer();
  G.result=e;
  try{
    const key='war_game_fast_'+G.cid;
    const prev=parseInt(localStorage.getItem(key)||'0',10);
    if(!prev||G.turn<prev)localStorage.setItem(key,String(G.turn));
  }catch(err){}
  renderEnding(e);
}
function pushErr(err){
  const msg=(err&&err.message)?err.message:String(err);
  if(G.errors.indexOf(msg)<0)G.errors.push(msg);
  toast('运行错误：'+msg);
}
window.addEventListener('error',function(ev){pushErr(ev.message||'unknown');});
window.addEventListener('unhandledrejection',function(ev){pushErr(ev.reason||'rejection');});

function renderOverview(){
  const total=G.campaign.regions.length;
  const html=G.campaign.factions.map(x=>{
    const army=G.campaign.regions.filter(r=>r.owner===x.id).reduce((s,r)=>s+r.army,0);
    const regs=G.campaign.regions.filter(r=>r.owner===x.id).length;
    let status='';
    if(x.eliminated)status='<span class="turn-badge">亡国</span>';
    else if(!x.active)status='<span class="turn-badge">蛰伏</span>';
    else if(x.neutral)status='<span class="turn-badge">停战</span>';
    if(x.isPlayer)status+='<span class="turn-badge" style="border-color:#e8cf8f">你</span>';
    const cls=x.morale<40?'low':'';
    return '<div class="faction-row'+(x.eliminated?' dead':'')+'">'+
      shieldSVG(x.color,18)+
      '<div class="fr-info">'+
      '<div class="fr-name">'+x.name+status+'</div>'+
      '<div class="fr-leader">'+x.leader+'</div>'+
      '<div class="fr-stats"><span>军队 <b>'+fmt(army)+'</b></span><span>地区 <b>'+regs+'</b>/'+total+'</span><span>资金 <b>'+fmt(x.money)+'</b></span></div>'+
      '<div class="morale-bar '+cls+'"><i style="width:'+Math.round(x.morale)+'%"></i></div>'+
      '</div></div>';
  }).join('');
  $('panOverview').innerHTML=html;
}
function getNeighbors(id){
  const out=[];
  G.campaign.edges.forEach(e=>{
    if(e[0]===id)out.push(G.rmap[e[1]]);
    else if(e[1]===id)out.push(G.rmap[e[0]]);
  });
  return out;
}
function renderRegionPanel(){
  const pan=$('panRegion');
  const r=G.selected?G.rmap[G.selected]:null;
  const pf=G.mode==='player'?G.fmap[G.pfid]:null;
  if(!r){
    pan.innerHTML='<div class="empty-tip">点击地图上的地区<br>查看详情与指挥操作</div>'+(pf&&!pf.eliminated&&!G.ended?'<div style="text-align:center;margin-top:10px"><button id="btnEndTurn" class="primary" style="min-width:160px;min-height:44px">结束回合</button></div>':'');
    bindEndTurn();
    return;
  }
  const owner=r.owner?G.fmap[r.owner]:null;
  const isPlayerRegion=pf&&r.owner===pf.id;
  let html='<div class="region-detail">';
  html+='<div class="rd-head">'+r.name+'</div>';
  html+='<div class="rd-line"><span>归属</span><b>'+(owner?owner.name+'（'+owner.short+'）':'中立')+'</b></div>';
  html+='<div class="rd-line"><span>驻军</span><b>'+fmt(r.army)+'</b></div>';
  html+='<div class="rd-line"><span>月产出</span><b>'+r.prod+'</b></div>';
  html+='<div class="rd-line"><span>月征兵</span><b>'+r.manpower+'</b></div>';
  html+='<div class="rd-line"><span>防御加成</span><b>'+r.def+'</b></div>';
  if(r.capitalOf)html+='<div class="rd-line"><span>性质</span><b>首都</b></div>';
  if(pf&&!pf.eliminated&&!G.ended){
    if(isPlayerRegion){
      html+='<div class="rd-actions"><button id="btnRecruit" style="min-height:44px">招募军队 +10</button></div>';
      const atks=getNeighbors(r.id).filter(n=>n.owner!==pf.id);
      if(atks.length){
        html+='<div style="margin-top:10px;font-size:12px;color:var(--dim)">可进攻目标</div>';
        atks.forEach(n=>{
          const no=n.owner?G.fmap[n.owner]:null;
          html+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px">'+
            '<span style="font-size:13px">'+n.name+' · 军'+n.army+(no?' · '+no.short:' · 中立')+'</span>'+
            '<button data-atk="'+n.id+'" style="min-width:74px;min-height:40px">进攻</button></div>';
        });
      }
    }else{
      const froms=getNeighbors(r.id).filter(n=>n.owner===pf.id&&n.army>2);
      if(froms.length){
        html+='<div style="margin-top:10px;font-size:12px;color:var(--dim)">从相邻据点发起进攻</div>';
        froms.forEach(n=>{
          html+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px">'+
            '<span style="font-size:13px">'+n.name+' · 军'+n.army+'</span>'+
            '<button data-atkfrom="'+n.id+'" style="min-width:74px;min-height:40px">进攻</button></div>';
        });
      }
    }
    html+='<div style="text-align:center;margin-top:12px"><button id="btnEndTurn" class="primary" style="min-width:160px;min-height:44px">结束回合</button></div>';
  }
  html+='</div>';
  pan.innerHTML=html;
  if($('btnRecruit'))$('btnRecruit').addEventListener('click',()=>{
    recruitAt(pf,r,10);
  });
  pan.querySelectorAll('[data-atk]').forEach(b=>{
    b.addEventListener('click',()=>{attack(pf,r.id,b.dataset.atk);renderAll();});
  });
  pan.querySelectorAll('[data-atkfrom]').forEach(b=>{
    b.addEventListener('click',()=>{attack(pf,b.dataset.atkfrom,r.id);renderAll();});
  });
  bindEndTurn();
}
function bindEndTurn(){
  if($('btnEndTurn'))$('btnEndTurn').addEventListener('click',endPlayerTurn);
}
function endPlayerTurn(){
  if(!G.waiting||G.ended)return;
  G.waiting=false;
  monthStep();
  renderAll();
}
function recruitAt(f,r,n){
  const affordable=Math.min(n,Math.floor(f.money/20),Math.floor(f.manpower/2));
  if(affordable<=0){toast('资金或人力不足');return;}
  f.money-=affordable*20;
  f.manpower-=affordable*2;
  r.army=Math.min(100,r.army+affordable);
  addLog('info',f.name+'在'+r.name+'招募了'+affordable+'个军团');
  renderAll();
}
function renderLog(){
  const html=G.log.slice(0,120).map(l=>{
    return '<div class="log-item '+l.type+'"><span class="lt">M'+l.t+'</span>'+escapeHtml(l.text)+'</div>';
  }).join('');
  $('panLog').innerHTML=html||'<div class="empty-tip">暂无战报</div>';
}
function renderTicker(){
  const html=G.ticker.slice(0,3).map(t=>'<span class="t-item t-'+t.type+'">'+escapeHtml(t.text)+'</span>').join('');
  $('ticker').innerHTML=html||'<span style="color:var(--dim)">推演开始</span>';
}
function renderAll(){
  renderMap();
  renderOverview();
  renderRegionPanel();
  renderLog();
  renderTicker();
  renderTop();
}
function renderEnding(e){
  $('endTitle').textContent=e.title;
  $('endSub').textContent=G.campaign.name+' · '+now()+' · 第'+G.turn+'回合';
  $('endEpilogue').textContent=e.epilogue?e.epilogue():'';
  let best=null;
  G.factions.forEach(f=>{if(!f.eliminated&&(!best||frCount(f.id)>frCount(best.id)))best=f;});
  let fast='—';
  try{
    const v=parseInt(localStorage.getItem('war_game_fast_'+G.cid)||'0',10);
    if(v)fast=v+' 个月';
  }catch(err){}
  const stats=[
    ['推演回合',G.turn+' 个月'],
    ['战役次数',fmt(G.battles)],
    ['总伤亡',fmt(G.casualties)],
    ['主导势力',best?best.name:'—'],
    ['占领地区',best?frCount(best.id)+' 个':'—'],
    ['本战役最快',fast]
  ];
  $('endStats').innerHTML=stats.map(s=>'<div class="es-box"><div class="es-v">'+s[1]+'</div><div class="es-k">'+s[0]+'</div></div>').join('');
  $('endOverlay').classList.remove('hidden');
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ================= 计时与操作 ================= */
function intervalMs(){return G.fast?30:Math.max(60,900/G.speed);}
function startTimer(){stopTimer();G.timer=setInterval(tick,intervalMs());}
function stopTimer(){if(G.timer){clearInterval(G.timer);G.timer=null;}}
function tick(){
  if(G.paused||G.waiting||G.ended)return;
  monthStep();
  renderAll();
  if(G.ended&&G.fast)G.fast=false;
}
let toastTimer=null;
function toast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.add('hidden'),2600);
}

/* ================= 主菜单 ================= */
let menuCid='napoleon';
function buildMenu(){
  const wrap=$('menuCampaigns');
  wrap.innerHTML='';
  CAMPAIGN_ORDER.forEach(cid=>{
    const d=CAMPAIGNS[cid];
    const div=document.createElement('div');
    div.className='campaign-card'+(menuCid===cid?' selected':'');
    div.dataset.cid=cid;
    const chips=d.factions.map(f=>'<span class="cc-chip"><i style="background:'+f.color+'"></i>'+f.short+'</span>').join('');
    div.innerHTML='<div class="cc-end">'+d.endings.length+' 种结局</div>'+
      '<div class="cc-year">'+d.subtitle+'</div>'+
      '<div class="cc-name">'+d.name+'</div>'+
      '<div class="cc-desc">'+d.intro+'</div>'+
      '<div class="cc-factions">'+chips+'</div>';
    div.addEventListener('click',()=>{menuCid=cid;buildMenu();refreshPlayerSelect();});
    wrap.appendChild(div);
  });
}
function refreshPlayerSelect(){
  const d=CAMPAIGNS[menuCid];
  const sel=$('playerFactionSelect');
  sel.innerHTML='';
  d.factions.forEach(f=>{
    const o=document.createElement('option');
    o.value=f.id;o.textContent=f.name;
    sel.appendChild(o);
  });
  sel.value=d.factions[0].id;
}

/* ================= 自检 ================= */
let selfErrors=[];
function openSelf(){
  stopTimer();
  showView('view-menu');
  $('selftestOverlay').classList.remove('hidden');
  runSelftest();
}
function simulateGame(cid,seed){
  startGame(cid,'normal','ai',null);
  G.rng=mulberry32(seed);
  stopTimer();
  const errBase=G.errors.length;
  try{
    let guard=0;
    while(!G.ended&&guard<G.turnLimit+8&&G.errors.length<=errBase){
      monthStep();
      guard++;
    }
  }catch(err){pushErr(err);}
  stopTimer();
  const errs=G.errors.slice(errBase);
  errs.forEach(e=>selfErrors.push(e));
  return {cid:cid,seed:seed,ending:G.result?G.result.id:'(无结局)',title:G.result?G.result.title:'超时未决',turns:G.turn,battles:G.battles,errs:errs};
}
function runSelftest(){
  selfErrors=[];
  $('selfSummary').innerHTML='正在运行全部战役（每战役 2 局，共 8 局模拟推演），请稍候……';
  $('selfBody').innerHTML='';
  const names={napoleon:'拿破仑战争',ww1:'第一次世界大战',october:'十月革命',ww2:'第二次世界大战'};
  const rows=[];
  CAMPAIGN_ORDER.forEach(cid=>{
    [7,42].forEach(seed=>{
      rows.push(simulateGame(cid,seed));
    });
  });
  const failCount=rows.filter(r=>r.errs.length).length;
  $('selfSummary').innerHTML='自检完成：共 <b>'+rows.length+'</b> 局模拟（四大战役 × 2 个随机种子），全部推演至结局。运行期错误 <b>'+selfErrors.length+'</b> 条：'+(failCount===0?'<b style="color:#9fd08a">全部通过</b>':'<b style="color:#e08c84">存在失败项</b>');
  let html='<table class="self-table"><tr><th>战役</th><th>种子</th><th>结局</th><th>回合</th><th>战役数</th><th>结果</th></tr>';
  rows.forEach(r=>{
    const ok=r.errs.length===0;
    html+='<tr><td>'+names[r.cid]+'</td><td>'+r.seed+'</td><td>'+escapeHtml(r.title)+'</td><td>'+r.turns+'</td><td>'+r.battles+'</td><td class="'+(ok?'self-ok':'self-fail')+'">'+(ok?'通过':'错误')+'</td></tr>';
  });
  html+='</table>';
  if(selfErrors.length){
    html+='<div class="self-err">'+selfErrors.map(escapeHtml).join('\n')+'</div>';
  }
  $('selfBody').innerHTML=html;
}

/* ================= 初始化 ================= */
function init(){
  buildMenu();
  refreshPlayerSelect();
  $('diffPills').querySelectorAll('.pill').forEach(b=>{
    b.addEventListener('click',()=>{
      $('diffPills').querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      G.diff=b.dataset.diff;
    });
  });
  $('modePills').querySelectorAll('.pill').forEach(b=>{
    b.addEventListener('click',()=>{
      $('modePills').querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      G.mode=b.dataset.mode;
      $('playerFactionWrap').classList.toggle('show',G.mode==='player');
    });
  });
  $('btnStart').addEventListener('click',()=>{
    const pf=G.mode==='player'?$('playerFactionSelect').value:null;
    startGame(menuCid,G.diff,G.mode,pf);
  });
  $('btnSelftest').addEventListener('click',openSelf);
  $('btnSelfRun').addEventListener('click',runSelftest);
  $('btnSelfClose').addEventListener('click',()=>{
    $('selftestOverlay').classList.add('hidden');
    showView('view-menu');
  });
  $('speedGroup').querySelectorAll('.speed-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      G.speed=parseInt(b.dataset.speed,10);
      $('speedGroup').querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      if(!G.fast)startTimer();
    });
  });
  $('btnPause').addEventListener('click',()=>{
    if(G.ended)return;
    G.paused=!G.paused;
    $('btnPause').textContent=G.paused?'继续':'暂停';
    if(!G.paused&&!G.fast)startTimer();
  });
  $('btnStep').addEventListener('click',()=>{
    if(G.ended||G.waiting)return;
    monthStep();renderAll();
  });
  $('btnFast').addEventListener('click',()=>{
    if(G.ended)return;
    G.fast=!G.fast;
    G.paused=false;
    $('btnPause').textContent='暂停';
    $('btnFast').textContent=G.fast?'停止快进':'快进至结局';
    startTimer();
  });
  $('btnMenu').addEventListener('click',()=>{
    stopTimer();
    showView('view-menu');
    $('endOverlay').classList.add('hidden');
  });
  $('btnAgain').addEventListener('click',()=>{
    $('endOverlay').classList.add('hidden');
    startGame(G.cid,G.diff,G.mode,G.pfid);
  });
  $('btnMenuEnd').addEventListener('click',()=>{
    $('endOverlay').classList.add('hidden');
    stopTimer();
    showView('view-menu');
  });
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      ['panOverview','panRegion','panLog'].forEach(p=>$(p).classList.add('hidden'));
      $({overview:'panOverview',region:'panRegion',log:'panLog'}[b.dataset.tab]).classList.remove('hidden');
    });
  });
  const st=document.createElement('style');
  st.textContent='@keyframes pulseRing{0%{opacity:.95}50%{opacity:.3}100%{opacity:.95}}.pulse{animation:pulseRing 1.5s infinite}';
  document.head.appendChild(st);
  if(location.search.indexOf('selftest')>=0)openSelf();
}
init();
</script>

/* HanBer云坛 · 云坛一键登录（强制登录 + 存档按账号隔离） */
(function(){

    var qs = new URLSearchParams(location.search);
    var u = qs.get('yt_user');
    var logged = u && u !== 'guest';
    if(!logged){
      var ov = document.createElement('div');
      ov.id = 'yt-login-mask';
      ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:linear-gradient(160deg,#101828,#1a2a4a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;gap:14px;text-align:center;padding:20px';
      var t1 = document.createElement('div'); t1.style.cssText = 'font-size:40px'; t1.textContent = '🔒'; ov.appendChild(t1);
      var t2 = document.createElement('div'); t2.style.cssText = 'font-size:18px;font-weight:600'; t2.textContent = '此游戏需云坛一键登录'; ov.appendChild(t2);
      var t3 = document.createElement('div'); t3.style.cssText = 'font-size:13px;color:#9fb3d0;max-width:320px'; t3.textContent = '返回云坛登录后，进入「小程序」再点本游戏即可自动带账号游玩。'; ov.appendChild(t3);
      var btn = document.createElement('button');
      btn.textContent = '去登录';

      ov.appendChild(btn);

      return;
    }
    var el = document.createElement('div');

    var b1 = document.createElement('b'); b1.style.color = '#7cc4ff'; b1.textContent = String(u).replace(/[<>&]/g, '');
    var b2 = document.createElement('span'); b2.textContent = '✕'; b2.style.cssText = 'cursor:pointer;opacity:.65;margin-left:6px;font-size:11px';
    b2.title = '关闭';

    el.appendChild(document.createTextNode('👤 云坛登录：')); el.appendChild(b1); el.appendChild(b2);
    document.body.appendChild(el);
    window.YT_USER = u;
    window.YT_LOGGED = true;
    /* 存档按账号隔离：所有 localStorage 自动带账号前缀，旧档自动迁移 */
    var pre = '_yt_' + u + '_';
    var g = Storage.prototype.getItem, sw = Storage.prototype.setItem, r = Storage.prototype.removeItem;
    Storage.prototype.getItem = function(k){
      if(typeof k !== 'string' || k.indexOf(pre) === 0) return g.call(this, k);
      var scoped = g.call(this, pre + k);
      if(scoped !== null) return scoped;
      var legacy = g.call(this, k);
      if(legacy !== null){ try{ sw.call(this, pre + k, legacy); r.call(this, k); }catch(e){} }
      return legacy;
    };
    Storage.prototype.setItem = function(k, v){
      if(typeof k === 'string' && k.indexOf(pre) !== 0){ try{ sw.call(this, pre + k, v); }catch(e){} }
      else{ try{ sw.call(this, k, v); }catch(e){} }
    };
    Storage.prototype.removeItem = function(k){
      if(typeof k === 'string'){ r.call(this, pre + k); r.call(this, k); }
      else r.call(this, k);
    };
  }catch(e){}
})();
