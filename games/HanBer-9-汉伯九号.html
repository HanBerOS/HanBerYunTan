<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="《HanBer NINE》——五次中东战争结局全面反转的平行世界生存冒险游戏。单机、2D、开放世界、本地存档。">
<title>HanBer NINE · 汉伯九号</title>
<style>
:root{
  --bg:#0a0d12; --panel:#131a23; --panel2:#182130; --line:#273244; --line2:#344055;
  --gold:#d8b56a; --gold2:#a8853f; --text:#e8e2d2; --dim:#93a0b4; --dim2:#5d6a7f;
  --red:#e0605c; --green:#7cc576; --blue:#6fa8dc; --orange:#e0a04a; --purple:#a98fd8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;}
#game{position:fixed;inset:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#b0985f;}
.hidden{display:none !important;}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;pointer-events:none;
  padding:6px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;}
.hudcard{pointer-events:auto;background:rgba(10,14,20,.88);border:1px solid var(--line);
  border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.45;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.hudcard b{color:var(--gold);font-weight:600;}
#hudTitle{min-width:150px;}
#hudTime{min-width:130px;}
#hudStats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.meter{display:flex;align-items:center;gap:4px;}
.meter .mlabel{width:2.2em;color:var(--dim);font-size:11px;}
.meter .bar{width:74px;height:9px;background:#1a222d;border:1px solid var(--line2);border-radius:4px;overflow:hidden;position:relative;}
.meter .fill{height:100%;transition:width .3s;}
.meter .num{font-size:10px;color:var(--dim);width:2.4em;text-align:right;font-variant-numeric:tabular-nums;}
#hudMoney{color:var(--gold);font-weight:700;}
#hudFaction{font-size:11px;color:var(--dim);}
#hudMsg{position:absolute;right:8px;top:8px;max-width:260px;font-size:12px;color:var(--dim);text-align:right;line-height:1.5;}

/* ---------- 底部日志与按钮 ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:6px 8px;display:flex;gap:8px;align-items:flex-end;pointer-events:none;}
#log{flex:1;pointer-events:auto;background:rgba(10,14,20,.85);border:1px solid var(--line);border-radius:8px;
  height:92px;overflow-y:auto;padding:5px 8px;font-size:12px;line-height:1.5;color:var(--dim);}
#log .lg-imp{color:var(--gold);} #log .lg-ok{color:var(--green);} #log .lg-bad{color:var(--red);}
#log .lg-dim{color:var(--dim2);} #log .lg-story{color:#c9b8ff;}
#btnbar{pointer-events:auto;display:flex;flex-direction:column;gap:4px;}
#btnbar .bb{background:rgba(16,22,32,.9);border:1px solid var(--line2);color:var(--text);border-radius:6px;
  padding:4px 10px;font-size:12px;cursor:pointer;text-align:left;min-width:118px;font-family:inherit;}
#btnbar .bb:hover{background:#1e2936;border-color:var(--gold2);}
#btnbar .bb b{color:var(--gold);font-weight:600;}
#minimapWrap{pointer-events:auto;background:rgba(10,14,20,.85);border:1px solid var(--line);border-radius:8px;padding:4px;}
#mini{display:block;border-radius:4px;}

/* ---------- 通用弹层 ---------- */
.modal{position:absolute;inset:0;z-index:70;background:rgba(4,6,10,.66);display:flex;align-items:center;justify-content:center;padding:12px;}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.6);
  max-width:min(720px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.mhead{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--panel2);}
.mhead h2{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:1px;}
.mclose{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:6px;padding:2px 10px;cursor:pointer;font-family:inherit;font-size:12px;}
.mclose:hover{color:#fff;border-color:var(--gold2);}
.mbody{padding:12px 16px;overflow-y:auto;font-size:13px;line-height:1.7;}
.mfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}

/* ---------- 标题界面 ---------- */
#titleScreen{position:absolute;inset:0;z-index:60;background:linear-gradient(180deg,#0a0d12 0%,#151003 55%,#0a0d12 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
#titleScreen .logo{font-size:clamp(42px,9vw,96px);font-weight:900;letter-spacing:6px;
  background:linear-gradient(180deg,#f3e3b0 0%,#d8b56a 45%,#7a5a1e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(216,181,106,.25);}
#titleScreen .sub{color:var(--gold2);letter-spacing:8px;font-size:14px;margin-top:2px;}
#titleScreen .tagline{color:var(--dim);font-size:13px;margin:26px 0 4px;max-width:560px;line-height:1.8;padding:0 16px;}
#titleScreen .ver{color:var(--dim2);font-size:11px;margin-top:8px;letter-spacing:2px;}
.tbtn{width:230px;margin:6px 0;padding:11px 0;background:rgba(20,28,40,.7);border:1px solid var(--line2);color:var(--text);
  border-radius:8px;font-size:14px;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:all .15s;}
.tbtn:hover{border-color:var(--gold);color:var(--gold);background:rgba(40,50,66,.7);}
.tbtn.primary{border-color:var(--gold);color:var(--gold2);background:rgba(60,46,16,.25);}
.tbtn.primary:hover{color:var(--gold);}

/* ---------- 对话 ---------- */
#dialogBox .mbox{width:min(680px,94vw);}
#dlgName{color:var(--gold);font-weight:700;font-size:14px;margin-bottom:2px;}
#dlgPortrait{width:64px;height:64px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:30px;margin-right:12px;flex:0 0 auto;}
#dlgText{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;}
.dlg-choices{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.dc{background:rgba(24,32,46,.9);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text);text-align:left;font-family:inherit;}
.dc:hover{border-color:var(--gold);color:var(--gold);}
.dlg-next{color:var(--dim);font-size:12px;margin-top:8px;}

/* ---------- 章节/悬念 ---------- */
#storyScreen .mbox{width:min(620px,94vw);border-color:var(--gold2);}
#storyChap{font-size:12px;color:var(--gold2);letter-spacing:3px;}
#storyTitle{font-size:22px;color:var(--gold);font-weight:800;margin:4px 0 10px;}
#storyBody{font-size:14px;line-height:2;white-space:pre-wrap;color:var(--text);max-height:52vh;overflow-y:auto;}
.cliff{border:1px solid #7a3a3a;background:rgba(80,20,20,.16);border-radius:8px;padding:10px 14px;margin-top:10px;}
.cliff b{color:var(--red);}
.teaser{color:var(--dim);font-size:12px;margin-top:8px;font-style:italic;}

/* ---------- 背包 / 任务 / 地图 / 阵营 通用 ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.itemCard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;}
.itemCard:hover{border-color:var(--gold2);}
.itemCard .iname{font-size:13px;font-weight:600;}
.itemCard .idesc{font-size:11px;color:var(--dim);line-height:1.5;margin-top:2px;}
.itemCard .imeta{font-size:11px;color:var(--gold2);margin-top:3px;}
.itemCard .imeta.gray{color:var(--dim2);}
.qrow{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;background:var(--panel2);}
.qrow h4{font-size:13px;color:var(--gold);}
.qrow p{font-size:12px;color:var(--dim);line-height:1.6;}
.qrow .qobj{font-size:12px;color:var(--green);}
.quest-active{box-shadow:0 0 0 1px var(--gold2);}
#mapBig{width:100%;max-width:560px;border-radius:8px;border:1px solid var(--line2);cursor:pointer;}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:11px;color:var(--dim);}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* ---------- 阵营 ---------- */
.frow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;background:var(--panel2);}
.fdot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(255,255,255,.25);}
.frow h4{font-size:13px;} .frow p{font-size:11px;color:var(--dim);line-height:1.5;}
.frep{font-size:11px;color:var(--gold);white-space:nowrap;margin-left:auto;}

/* ---------- 商店 ---------- */
.shop-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;}
.shop-row:hover{background:var(--panel2);}
.sbtn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px;font-family:inherit;}
.sbtn:hover{border-color:var(--gold);color:var(--gold);}
.sbtn:disabled{opacity:.35;cursor:not-allowed;}

/* ---------- 战斗 ---------- */
#combatBox{width:min(520px,94vw);}
.cb-enemy{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
.cb-icon{width:56px;height:56px;border-radius:50%;background:var(--panel2);border:2px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:26px;}
.cb-hp{width:100%;height:10px;background:#1a222d;border:1px solid var(--line2);border-radius:5px;overflow:hidden;margin-top:4px;}
.cb-hp .fill{height:100%;background:var(--red);}
.cb-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.cb-log{font-size:12px;color:var(--dim);line-height:1.7;margin-top:8px;max-height:120px;overflow-y:auto;}

/* ---------- 存档 ---------- */
.slotrow{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;background:var(--panel2);}
.slotrow h4{font-size:13px;color:var(--gold);}
.slotrow p{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.5;}
textarea.export{width:100%;height:70px;background:#0b1017;color:var(--green);border:1px solid var(--line2);border-radius:6px;font-size:11px;padding:6px;font-family:monospace;resize:vertical;}

/* ---------- 按钮通用 ---------- */
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:7px;padding:6px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.primary{border-color:var(--gold);color:var(--gold2);}
.btn.danger{border-color:#7a3a3a;color:var(--red);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
input[type=text],select{background:#0b1017;border:1px solid var(--line2);color:var(--text);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;}
select option{background:#141a23;}
#toast{position:absolute;top:14%;left:50%;transform:translateX(-50%);z-index:90;background:rgba(16,20,28,.95);
  border:1px solid var(--gold2);color:var(--gold);border-radius:8px;padding:10px 22px;font-size:14px;letter-spacing:1px;
  opacity:0;transition:opacity .4s;pointer-events:none;max-width:80vw;text-align:center;}
#flash{position:absolute;inset:0;z-index:50;pointer-events:none;background:#fff;opacity:0;}
#helpBox .mbox{width:min(560px,94vw);}
.helpSec{margin:10px 0;} .helpSec h3{color:var(--gold);font-size:13px;margin-bottom:4px;}
.helpSec p{color:var(--dim);font-size:12px;line-height:1.8;}
.helpSec kbd{background:#0b1017;border:1px solid var(--line2);border-radius:4px;padding:1px 7px;font-size:11px;color:var(--gold);font-family:inherit;}
#achList .a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;}
#achList .a .an{flex:1;color:var(--text);} #achList .a .ad{color:var(--dim);}
#achList .a.locked{opacity:.4;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#2a3648;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
<style id="hanber-soviet-skin">
/* === HanBer 统一皮肤 · 后苏联忧郁美学 (Post-Soviet Melancholy) === */
html,body{
  background-color:#15181e !important;
  background-image:
    radial-gradient(ellipse at 50% -5%, rgba(201,168,106,.10), transparent 55%),
    linear-gradient(165deg,#11141a 0%,#1a1f28 48%,#231d15 100%) !important;
  color:#d6cdb8 !important;
}
#hanber-vignette{position:fixed;inset:0;z-index:99998;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,.55) 100%);}
</style>
<div id="hanber-vignette"></div>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <!-- 标题界面 -->
  <div id="titleScreen">
    <div class="logo">HanBer NINE</div>
    <div class="sub">汉 伯 九 号</div>
    <div class="tagline">五次中东战争的结局全部反转的世界。<br>
      沙姆的军旗、河谷的麦田、海湾的油轮、高墙内的旧邦——<br>
      而你，是档案选中的第九位书写者。</div>
    <button class="tbtn primary" id="btnNew">⚔ 新游戏 · 主线模式</button>
    <button class="tbtn" id="btnFree2">🏜 自由模式 · 活下去</button>
    <button class="tbtn" id="btnContinue">💾 继续游戏（自动存档）</button>
    <button class="tbtn" id="btnLoad">📂 存档管理 / 读档</button>
    <button class="tbtn" id="btnHelp">📖 帮助</button>
    <button class="tbtn" id="btnAbout">ℹ️ 关于 / 更新日志</button>
    <div class="ver">v1.0 · 单机 · 本地存档 · 12 章主线 · 3 结局</div>
  </div>

  <!-- 顶部 HUD -->
  <div id="hud">
    <div class="hudcard" id="hudTitle"><b id="hudName">-</b><br><span id="hudMode" style="color:var(--dim);font-size:11px;">-</span></div>
    <div class="hudcard" id="hudTime"><b id="hudDate">第 1 天</b><br><span id="hudClock">07:00</span> · <span id="hudWeather">晴</span> · <span id="hudTemp">32°C</span></div>
    <div class="hudcard" id="hudStats" style="flex:1;min-width:300px;">
      <div class="meter"><span class="mlabel">生命</span><span class="bar"><span class="fill" id="mHP" style="background:var(--red);"></span></span><span class="num" id="nHP">100</span></div>
      <div class="meter"><span class="mlabel">体力</span><span class="bar"><span class="fill" id="mST" style="background:var(--orange);"></span></span><span class="num" id="nST">100</span></div>
      <div class="meter"><span class="mlabel">饥饿</span><span class="bar"><span class="fill" id="mHU" style="background:var(--orange);"></span></span><span class="num" id="nHU">100</span></div>
      <div class="meter"><span class="mlabel">口渴</span><span class="bar"><span class="fill" id="mTH" style="background:var(--blue);"></span></span><span class="num" id="nTH">100</span></div>
      <div class="meter"><span class="mlabel">精神</span><span class="bar"><span class="fill" id="mSA" style="background:var(--purple);"></span></span><span class="num" id="nSA">100</span></div>
      <span style="margin-left:6px;">💰 <span id="hudMoney">0</span></span>
      <span id="hudFaction" style="margin-left:4px;"></span>
    </div>
  </div>

  <!-- 底部 -->
  <div id="bottom">
    <div id="log"></div>
    <div id="btnbar">
      <button class="bb" onclick="UI.open('inv')"><b>I</b> 背包</button>
      <button class="bb" onclick="UI.open('quest')"><b>J</b> 任务</button>
      <button class="bb" onclick="UI.open('map')"><b>M</b> 大地图</button>
      <button class="bb" onclick="UI.open('faction')"><b>F</b> 阵营</button>
      <button class="bb" onclick="UI.open('journal')"><b>L</b> 日志</button>
      <button class="bb" onclick="UI.open('save')"><b>S</b> 存档</button>
      <button class="bb" onclick="UI.open('menu')"><b>Esc</b> 菜单</button>
    </div>
    <div id="minimapWrap"><canvas id="mini" width="196" height="196"></canvas></div>
  </div>

  <!-- 弹层容器 -->
  <div id="modals"></div>

  <!-- 章节剧情界面（复用） -->
  <div id="storyScreen" class="modal hidden"><div class="mbox">
    <div class="mhead"><span id="storyChap">序章</span><span id="storyCloseHint" style="color:var(--dim);font-size:12px;"></span></div>
    <div class="mbody">
      <div id="storyTitle">-</div>
      <div id="storyBody"></div>
      <div id="storyPost" class="cliff hidden" style="border-color:var(--gold2);background:rgba(90,70,20,.12);"></div>
      <div id="storyCliff" class="cliff hidden"></div>
      <div id="storyTeaser" class="teaser hidden"></div>
    </div>
    <div class="mfoot"><button class="btn primary" id="storyBtn">继续</button></div>
  </div></div>

  <div id="dialogBox" class="modal hidden"><div class="mbox">
    <div class="mhead"><h2>对话</h2><button class="mclose" onclick="Dialogue.close()">关闭</button></div>
    <div class="mbody" style="display:flex;">
      <div id="dlgPortrait">❓</div>
      <div style="flex:1;min-width:0;">
        <div id="dlgName">-</div>
        <div id="dlgText"></div>
        <div class="dlg-choices" id="dlgChoices"></div>
        <div class="dlg-next" id="dlgNext"></div>
      </div>
    </div>
  </div></div>

  <div id="combatBox" class="modal hidden"><div class="mbox" id="combatBoxInner">
    <div class="mhead"><h2>⚔ 遭遇战</h2></div>
    <div class="mbody">
      <div class="cb-enemy">
        <div class="cb-icon" id="cbIcon">🐺</div>
        <div style="flex:1;">
          <div id="cbName" style="font-size:15px;font-weight:700;"></div>
          <div style="font-size:11px;color:var(--dim);" id="cbDesc"></div>
          <div class="cb-hp"><div class="fill" id="cbHp" style="width:100%;"></div></div>
        </div>
      </div>
      <div style="font-size:13px;color:var(--text);">我方生命 <b id="cbMyHp" style="color:var(--green);">100</b> / 体力 <b id="cbMySt" style="color:var(--orange);">100</b> / 弹药 <b id="cbAmmo">0</b></div>
      <div class="cb-btns">
        <button class="btn primary" onclick="Combat.act('attack')">⚔ 攻击</button>
        <button class="btn" onclick="Combat.act('defend')">🛡 防御</button>
        <button class="btn" onclick="Combat.act('item')">💊 用药</button>
        <button class="btn danger" onclick="Combat.act('flee')">🏃 逃跑</button>
      </div>
      <div class="cb-log" id="cbLog"></div>
    </div>
  </div></div>

  <div id="toast"></div>
  <div id="flash"></div>
</div>

<script>
"use strict";
/* ================= 基础工具 ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(ax,ay,bx,by)=>Math.sqrt((ax-bx)**2+(ay-by)**2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtMoney(n){return n>=0?n.toLocaleString():n.toLocaleString();}
function pad2(n){return n<10?'0'+n:''+n;}
let uid=1; const nid=()=>'id'+(uid++);

/* ================= 配置 ================= */
const CFG={W:200,H:200,TILE:32,SAVE_KEY:'HB9_SAVE_v3',AUTO:'HB9_AUTO_v3',
  CHAPTER_DAYS:6, // 每章间隔的游戏天数
  TIME_SCALE:2,    // 1 真实秒 = 2 游戏分钟
  SPEEDS:{1:'慢速',2:'正常',4:'快速'}};
let TIME_SCALE=2;

/* ================= 阵营 ================= */
const F={

/* ================= 世界生成（确定性种子） ================= */
let G=null; // {tiles:Uint8Array, cities, buildings, seed}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genWorld(seed){
  const rng=mulberry(seed);
  const tiles=new Uint8Array(CFG.W*CFG.H);
  const tid=(x,y)=>tiles[y*CFG.W+x];
  const W=CFG.W,H=CFG.H;
  // 底色沙漠/戈壁
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=rng();
    tiles[y*W+x]= v<.62?0: v<.8?1: 0;
  }
  const set=(x,y,t)=>{if(x>=0&&y>=0&&x<W&&y<H)tiles[y*W+x]=t;};
  const is=(x,y,t)=>x>=0&&y>=0&&x<W&&y<H&&tiles[y*W+x]===t;
  // 海与海岸（东南角）
  for(let y=H-1;y>H-34;y--)for(let x=W-1;x>W-34;x--){ tiles[y*W+x]=11; }
  for(let i=0;i<34;i++){ // 海岸线
    const y=H-33+rnd(0,2),x=W-33+rnd(0,2);
    for(let k=0;k<6;k++)set(x-k,y-k,11);
  }
  // 河谷（纵贯）
  const riverX=68;
  for(let y=40;y<H-8;y++){
    const xx=riverX+Math.floor(Math.sin(y/11)*3+rng()*3-1);
    set(xx,y,10);set(xx+1,y,rng()<.5?10:5);set(xx-1,y,rng()<.5?10:5);
    if(y%7===0){set(xx+rnd(-3,3),y,5);}
  }
  // 山带（西北 + 中部屏障）
  for(let y=0;y<46;y++){const jitter=Math.floor(Math.sin(y/5)*4);for(let x=Math.max(0,8+jitter);x<34+jitter;x++)set(x,y,6);}
  for(let y=20;y<90;y++){const jitter=Math.floor(Math.sin(y/9)*5);for(let x=W-22+jitter;x<W-4;x++)set(x,y,6);}
  for(let y=120;y<H;y++){const jitter=Math.floor(Math.sin(y/8)*6);for(let x=2+jitter;x<26+jitter;x++)set(x,y,6);}
  // 油田带（东北，近纳夫塔港）
  for(let i=0;i<70;i++){const x=rnd(140,178),y=rnd(58,104);set(x,y,8);if(rng()<.5)set(x+1,y,8);}
  // 废墟带（第九城周围 + 旧邦周边）
  for(let i=0;i<90;i++){const x=rnd(70,100),y=rnd(52,84);set(x,y,7);}
  for(let i=0;i<40;i++){const x=rnd(112,146),y=rnd(28,50);set(x,y,7);}
  // 绿洲散布
  for(const[ox,oy]of[[40,120],[62,86],[30,150],[110,118],[150,140],[20,60],[90,160],[172,50]]){
    for(let i=0;i<10;i++){const x=ox+rnd(-3,3),y=oy+rnd(-3,3);set(x,y,5);}
  }
  // 城市主体（城区+道路）
  const roads=[];
  const cityOrder=[...CITIES].sort((a,b)=>a.fx-b.fx);
  for(let i=0;i<cityOrder.length-1;i++){
    const a=cityOrder[i],b=cityOrder[i+1];
    roads.push([a,b]);
    // 画公路
    let{x,y}=a;
    const dx=Math.sign(b.fx-a.fx),dy=Math.sign(b.fy-a.fy);
    let steps=0;
    while((x!==b.fx||y!==b.fy)&&steps<400){
      steps++;
      if(rng()<.5&&x!==b.fx)x+=dx;else if(y!==b.fy)y+=dy;else if(x!==b.fx)x+=dx;else y+=dy;
      set(x,y,2);
    }
  }
  // 铁路：新月城—绿洲驿站—阿卡沙—泽兰
  for(const[aa,bb]of[[CITY.crescent,CITY.oasis],[CITY.oasis,CITY.aksha],[CITY.aksha,CITY.zelan],[CITY.crescent,CITY.nafta]]){
    let{x,y}=aa;const dx=Math.sign(bb.fx-aa.fx),dy=Math.sign(bb.fy-aa.fy);let steps=0;
    while((x!==bb.fx||y!==bb.fy)&&steps<400){steps++;
      if(rng()<.5&&x!==bb.fx)x+=dx;else if(y!==bb.fy)y+=dy;else if(x!==bb.fx)x+=dx;else y+=dy;
      if(tiles[y*W+x]===0||tiles[y*W+x]===1)tiles[y*W+x]=3;}
  }
  // 城市涂抹
  const buildings=[];
  for(const c of CITIES){
    const r=c.big?9:6;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<=r-(rng()*0.6)){
        const x=c.fx+dx,y=c.fy+dy;
        const base=c.type==='废墟'?7:(c.type==='营地'?9:(c.type==='油镇'?8:(c.type==='围城飞地'?0:4)));
        tiles[y*W+x]=base;
      }
    }
    if(c.type==='围城飞地'){ // 高墙
      for(let a=0;a<16;a++){const ang=a/16*Math.PI*2;const x=c.fx+Math.round(Math.cos(ang)*(r+2)),y=c.fy+Math.round(Math.sin(ang)*(r+2));set(x,y,13);set(x,y-1,13);}
    }
    if(c.type==='废墟'){ // 残破感
      for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){const x=c.fx+dx,y=c.fy+dy;if(tiles[y*W+x]===4&&rng()<.4)tiles[y*W+x]=7;}
    }
    // 城内建筑
    const facs=cityFacilities(c);
    let placed=0,guard=0;
    while(placed<facs.length&&guard<200){
      guard++;
      const ang=rng()*Math.PI*2,rr=rng()*r*0.62;
      const x=Math.round(c.fx+Math.cos(ang)*rr),y=Math.round(c.fy+Math.sin(ang)*rr);
      if(tid(x,y)===4||tid(x,y)===0||tid(x,y)===1){
        buildings.push({id:c.id+'_b'+placed,type:facs[placed],x,y,city:c.id,name:facs[placed]});
        placed++;
      }
    }
  }
  // 地图上的野外定居点（帐篷/井）
  for(let i=0;i<26;i++){const x=rnd(6,W-6),y=rnd(6,H-6);
    if(tid(x,y)===0&&tid(x+1,y)===0){set(x,y,9);set(x+1,y,9);}
  }
  G={tiles,cities:CITIES,buildings,seed,roads};
  return G;
}
function cityFacilities(c){
  const list=['market','inn','tavern','board','clinic','gun','black','trade'];
  const s=c.big?[0,1,2,3,4,5,6,7]:[0,1,2,3];
  return s.map(i=>list[i]);
}

const Time={
  day:1,hour:7,min:0,
  tick(ms){ // 每帧调用
    const minutes=ms/1000*TIME_SCALE;
    this.min+=minutes;
    if(this.min>=60){this.hour+=Math.floor(this.min/60);this.min%=60;}
    if(this.hour>=24){this.hour-=24;this.day++;onDayPass();}
  },
  clock(){return pad2(this.hour)+':'+pad2(Math.floor(this.min));},
  isNight(){return this.hour>=20||this.hour<6;},
  dateStr(){const m=Math.min(12,Math.floor((this.day-1)/6)+1);return '第'+this.day+'天 · 纪年'+m+'月';},
  month(){return Math.min(12,Math.floor((this.day-1)/6)+1);}
};

/* ================= 背包 ================= */
function invAdd(id,qty,quiet){
  qty=qty||1;
  const it=ITEMS[id]; if(!it)return;
  const f=S.inv.find(i=>i.id===id);
  if(f)f.n+=qty;else S.inv.push({id,n:qty});
  S.weight+=it.weight*qty;
  if(!quiet)log('获得 '+it.name+' ×'+qty,'ok');
}
function invCount(id){const f=S.inv.find(i=>i.id===id);return f?f.n:0;}
function invRemove(id,qty){
  qty=qty||1;
  const f=S.inv.find(i=>i.id===id); if(!f)return false;
  if(f.n<qty)return false;
  f.n-=qty; S.weight-=ITEMS[id].weight*qty;
  if(f.n<=0)S.inv=S.inv.filter(i=>i.id!==id);
  return true;
}
function canCarry(id,qty){qty=qty||1;return S.weight+ITEMS[id].weight*qty<=carryCap();}
function carryCap(){const m=S.equip.mount?ITEMS[S.equip.mount].mount:0;return 30+m*8;}
function equipWeapon(id){S.equip.weapon=S.equip.weapon===id?null:id;}
function equipArmor(id){S.equip.armor=S.equip.armor===id?null:id;}
function equipMount(id){S.equip.mount=S.equip.mount===id?null:id;}

}

/* ================= 程序化居民 ================= */
function genResidents(){
  for(const c of CITIES){
    const n=c.big?22:10;
    const facWeights=c.f==='none'?['neutral','neutral','neutral','gulf','merc','trib','eden','sham']:null;
    for(let i=0;i<n;i++){
      const f=c.f==='none'?pick(facWeights):c.f;
      const name=genName(f);
      const role=pick(ROLE_POOL);
      const nx=clamp(c.fx+rnd(-8,8),1,CFG.W-2),ny=clamp(c.fy+rnd(-8,8),1,CFG.H-2);
      regNPC({id:nid(),name,faction:f,role,city:c.id,x:nx,y:ny,shop:null,lines:[pick(GENLINES[f]||GENLINES.neutral)],quest:null,awake:[7,21],dir:'down',icon:pick(['👤','👥','🧑','👨','👩'])});
    }
  }
}
// 给每个设施建筑配一名店主
function assignShopkeepers(){
  for(const b of G.buildings){
    const def=SHOPDEF[b.type]; if(!def||b.type==='board')continue;
    const c=CITY[b.city];
    const f=c.f==='none'?pick(['neutral','gulf','merc','trib']):c.f;
    const kp=regNPC({id:nid(),name:genName(f),faction:f,role:def.name+'店主',city:b.city,x:b.x,y:b.y,
      shop:b.type,lines:[pick(GENLINES[f]||GENLINES.neutral)],quest:null,awake:[8,20],dir:'down',icon:def.icon});
    b.keeper=kp.id;
  }
}

function encounterFor(tileX,tileY){
  const t=G.tiles[tileY*CFG.W+tileX];
  const hour=Time.hour;const night=Time.isNight();
  const r=Math.random();
  const near=dist(tileX,tileY,CITY.nine.fx,CITY.nine.fy)<12;
  const nearBorder=dist(tileX,tileY,CITY.border.fx,CITY.border.fy)<14;
  let e;
  if(near&&r<.5)e='scavenger';
  else if(nearBorder&&r<.45)e=pick(['patrol_sham','smuggler']);
  else if(t===7||t===8)e=r<.35?'scavenger':(r<.6?'smuggler':'bandit');
  else if(t===2||t===3)e=r<.5?'bandit':(r<.75?'smuggler':'dog');
  else if(night&&r<.2)e=pick(['wolf','bandit','scorpion']);
  else if(r<.12)e=pick(['wolf','bandit','outlaw','dog']);
  else return null;
  const base=ENEMIES[e];
  const scale=1+Math.min(1.2,S.encounters*0.015);
  return {kind:e,name:base.name,icon:base.icon,hp:Math.round(base.hp*scale),maxHp:Math.round(base.hp*scale),
    dmg:Math.round(base.dmg*scale),money:(typeof base.money==='function'?base.money():base.money),desc:base.desc,items:base.items,rep:base.rep};
}

function spName(id){return SP[id]||id;}
function spIcon(id){
  const def=STORY_NPCS[id]; if(def)return def.icon;
  const n=NPCI[id]; if(n)return n.icon||'👤';
  if(id==='nar')return '🎙️'; if(id==='sys')return '⚙️'; if(id==='you')return '🧭'; return '❓';
}
function parseEff(eff){
  if(!eff)return;
  for(const e of eff){
    const p=e.split('.');
    if(p[0]==='rep'){const m=p[1].match(/^(\w+)([+-]\d+)$/);if(m)S.rep[m[1]]=clamp((S.rep[m[1]]||0)+parseInt(m[2]),-100,100);factionTierUpdate(m[1]);}
    else if(p[0]==='item'){invAdd(e.slice(5).split(' ')[0],1,true);}
    else if(p[0]==='money'){S.money+=parseInt(p[1]);}
    else if(p[0]==='hp'){S.hp=clamp(S.hp+parseInt(p[1]),0,100);}
    else if(p[0]==='st'){S.st=clamp(S.st+parseInt(p[1]),0,100);}
    else if(p[0]==='san'){S.sanity=clamp(S.sanity+parseInt(p[1]),0,100);}
    else if(p[0]==='hun'){S.hunger=clamp(S.hunger+parseInt(p[1]),0,100);}
    else if(p[0]==='thirst'){S.thirst=clamp(S.thirst+parseInt(p[1]),0,100);}
    else if(p[0]==='flag'){S.flags[p[1]]=parseInt(p[2])||1;}
    else if(p[0]==='ammo'){S.ammo=Math.max(0,S.ammo+parseInt(p[1]));}
    else if(p[0]==='quest'){addQuest(p[1]);}
  }
}
function dlgRender(idx){
  const n=DLG_CUR[idx]; if(!n){finishDlg();return;}
  parseEff(n.eff);
  document.getElementById('dlgName').textContent=spName(n.s);
  document.getElementById('dlgPortrait').textContent=spIcon(n.s);
  document.getElementById('dlgText').textContent=n.t;
  const box=document.getElementById('dlgChoices'); box.innerHTML='';
  const nxt=document.getElementById('dlgNext');
  if(n.c&&n.c.length){
    nxt.innerHTML='';
    for(const c of n.c){
      if(c.cond&&!evalCond(c.cond))continue;
      const b=document.createElement('div'); b.className='dc'; b.textContent=c.t;
      b.onclick=()=>{parseEff(c.eff);dlgRender(c.go);};
      box.appendChild(b);
    }
  }else{
    nxt.innerHTML='▸ 点击继续';
    document.getElementById('dlgNext').onclick=()=>dlgRender(n.go);
  }
}
function runDialog(id,onEnd){
  DLG_CUR=DIALOG[id]; DLG_END=onEnd||null;
  document.getElementById('dialogBox').classList.remove('hidden');
  dlgRender(0);
}
function finishDlg(){
  document.getElementById('dialogBox').classList.add('hidden');
  DLG_CUR=null;
  if(DLG_END){const f=DLG_END;DLG_END=null;f();}
}
const Dialogue={close(){if(DLG_CUR){finishDlg();}}};

 {s:'nar',t:'地窖里又黑又闷，脚步声在上方来回碾过，像碾在你心上。',go:7},
 {s:'nar',t:'你从屋顶跳进后院，佣兵的搜索圈差一步合拢。你贴着墙根，跑向驿站的方向。',go:7},
 {s:'nar',t:'门被撞开的同时，你顶了上去。砍刀在火把光里划出一道弧线——佣兵退了一步。他们没想到驿站里有人敢还手。',go:7},
 {s:'nar',t:'天亮前，你在扎伊德爷爷的驼队掩护下离开阿卡沙。他往你手里塞了最后一块干酪："别回头。回头，就是沙。"',go:'end',eff:['flag.escaped=1']}];
DIALOG.ch1_3=[
 {s:'zayed',t:'（看着你的背影，像是自言自语）九宫格……上一次它出现，是六十年前。那时候我还是个放驼娃。',go:1},
 {s:'you',t:'爷爷，你知道什么，是吗？',go:2},
 {s:'zayed',t:'只知道一句话：档案不是写历史的，是算历史的。算好了，再动手改。至于谁在算、为什么要算……',go:3},
 {s:'zayed',t:'……去新月城吧。那里有人能回答你。记住：名片背面还会再变字。它说什么，你就听什么。',go:'end',eff:['flag.hint_1=1']}];
DIALOG.ch1_4=[
 {s:'nar',t:'绿洲驿站在风沙尽头出现：一节旧车厢、两盏信号灯、一条伸向地平线的铁轨。',go:1},
 {s:'nar',t:'站牌上钉着时刻表：新月城方向，午后发车。你攥着那张九宫格名片，登上列车。',go:'end',eff:['flag.at_oasis=1']}];
DIALOG.ch1_5=[
 {s:'rasul',t:'（站长眯着眼打量你）阿卡沙来的？今天车上多了不少生面孔，你自己留个心眼。',go:1},
 {s:'you',t:'站长，这张名片上的字，你看得懂吗？',go:2},
 {s:'rasul',t:'（他只看了一眼，立刻还给你，像接了块烙铁）不懂不懂。这年头，懂太多的人活不长。',go:3},
 {s:'rasul',t:'不过你可以去新月城的茶馆找迪娜——那女人，什么都知道，就是什么也不说。',go:'end',eff:['flag.hint_2=1']}];
DIALOG.ch1_6=[
 {s:'nar',t:'汽笛长鸣。列车碾过沙海，把阿卡沙抛在身后。车窗外，夕阳把第九城废墟的方向染成血红色。',go:1},
 {s:'nar',t:'你翻开那张名片。这一次，背面的打字机文字变了——',go:2},
 {s:'sys',t:'"第九城·档案馆·等你的信。"',go:3},
 {s:'nar',t:'第一章《流亡者的名片》完结。',go:'end',eff:['flag.ch1_done=1','ach.first_chapter']}];

/* ================= 第二章剧情 ================= */
DIALOG.ch2_1=[
 {s:'aliya',t:'（合上笔记本，直勾勾看着你）阿卡沙来的？昨天那封信，是你收到的吧。',go:1},
 {s:'you',t:'你怎么知道？',go:2},
 {s:'aliya',t:'我是记者。乱世里，记者靠两条命活着：一条自己，一条情报。九宫格名片，我追了三年。',go:3},
 {s:'aliya',t:'追它的人都会死，可它偏偏找上了你。所以要么你命大，要么——你就是下一个"书写者"。',go:4},
 {s:'you',t:'书写者？那是什么？',go:5},
 {s:'aliya',t:'（她没有回答，只把一枚老式徽章放进你掌心）到了新月城，会有人找你。记住：谁都别信。',go:'end',eff:['item.w_ninecoin','flag.meet_aliya=1']}];
DIALOG.ch2_2=[
 {s:'kor',t:'（灌了口劣酒，咧嘴）小崽子，坐我这儿。记者那娘们儿话太多，听多了掉头发。',go:1},
 {s:'you',t:'你是……？',go:2},
 {s:'kor',t:'柯尔。打过解放战争、苏伊士、六日、赎罪日——哦不对，在这条世界线上，那些仗我们"都赢了"……妈的，说顺嘴了。',go:3},
 {s:'kor',t:'总之，我是活得最久的输家。你手里那玩意儿，我年轻时候见过一次。见过它的人，坟头草都三米高了。',go:4},
 {s:'you',t:'那你怎么没死？',go:5},
 {s:'kor',t:'（哈哈大笑）因为老子不识字！九宫格上的字，我一个字都不认识！',go:'end',eff:['flag.meet_kor=1']}];
DIALOG.ch2_3=[
 {s:'nar',t:'列车驶过边境废弃的检查站。突然，前方一声巨响——路基炸裂，沙尘冲天。车厢剧烈摇晃，有人尖叫，有人拔枪。',go:1},
 {s:'nar',t:'车窗外的沙丘后，火光一闪，子弹打在铁皮上，叮当乱响。沙匪，来了。',go:2},
 {s:'you',t:'（选项）',go:3,c:[
   {t:'抄起武器，跟着柯尔冲下车厢还击',go:4,eff:['rep.merc+8','st-15']},
   {t:'躲在座椅下，护住残页',go:5,eff:['san-6']},
   {t:'找到车长，抢在沙匪合围前倒车',go:6,eff:['rep.neutral+6','san-3']}]},
 {s:'nar',t:'你跟着老佣兵跳下列车。枪声、沙尘、火把。柯尔一边射击一边骂骂咧咧："兔崽子们，爷爷在沙漠里打仗的时候你们还在喝奶！"',go:7},
 {s:'nar',t:'车厢里只剩弹壳声和喘息。沙匪抢了几箱货撤了，留下一地狼藉。你护住了怀里的残页。',go:7},
 {s:'nar',t:'列车在沙匪合围前倒车退出伏击区，绕行戈壁多走了半天。虽然迟了，但活着。',go:7},
 {s:'nar',t:'清晨，新月城的轮廓出现在地平线上。白色城墙、金色圆顶、遮天蔽日的商队旗帜。你到了。',go:'end',eff:['flag.train_ok=1','kills:0']}];
DIALOG.ch2_4=[
 {s:'kor',t:'（靠在车门边，手臂缠着纱布）小子，刚才够胆。不过记住——档案这东西，谁先伸手，谁先死。',go:1},
 {s:'kor',t:'新月城龙蛇混杂。沙姆的军情处、伊甸的复国派、海湾的钱袋子、还有我们这些拿命换钱的……五方人马，都想吃了你。',go:2},
 {s:'you',t:'那我该怎么办？',go:3},
 {s:'kor',t:'先活着。活着，棋局才有你的位置。死人的棋谱，只能垫桌脚。',go:'end',eff:['flag.hint_3=1']}];
DIALOG.ch2_5=[
 {s:'nar',t:'新月城，五大势力的公约数。集市上，驼队与油罐车并行；茶馆里，间谍与商人共用一张桌子。',go:1},
 {s:'nar',t:'城门口贴着告示：三日后，第九城档案多国会议。你注意到，告示下方被人用炭笔画了一个小小的九宫格。',go:'end',eff:['flag.at_crescent=1']}];
DIALOG.ch2_6=[
 {s:'dina',t:'（擦着杯子，眼皮都没抬）阿卡沙的娃，坐。茶钱先给。',go:1},
 {s:'you',t:'迪娜姐，扎伊德爷爷让我来找你。这张名片——',go:2},
 {s:'dina',t:'（她终于抬起头，目光像把刀）收起来。这玩意儿在我店里晃一眼，明天我这茶馆就得被拆。',go:3},
 {s:'dina',t:'听好了：三天后的会议，是给外人看的。真正的棋局在下面。有人想开档案馆，有人想烧了它，还有人——想让你当那把钥匙。',go:4},
 {s:'you',t:'钥匙？',go:5},
 {s:'dina',t:'（倒了杯茶，推到你面前）你自己那封信，就是有人给你的"请帖"。喝了这杯，去开你的棋局吧。',go:'end',eff:['flag.hint_4=1','san+6']}];
DIALOG.ch2_7=[
 {s:'nar',t:'夜深了。新月城灯火通明，而你躺在旅店的床上，反复摩挲那张名片。',go:1},
 {s:'nar',t:'窗外，有人在拉一把老胡琴，拉的是五次战争前的旧曲调。第二章《绿洲列车》完结。',go:'end',eff:['flag.ch2_done=1']}];

/* ================= 第三章剧情 ================= */
DIALOG.ch3_1=[
 {s:'aliya',t:'（把几张报纸摊在桌上）会议议程泄露了：五方各持半张"棋谱"，拼齐才能开馆。而你手里有第六样东西——残页。',go:1},
 {s:'you',t:'残页上画的是我小时候住的街区。这到底是谁画的？',go:2},
 {s:'aliya',t:'（她盯着你看了很久）这也是我想知道的。三年来，我第一次见到档案"认得"的人。',go:3},
 {s:'aliya',t:'今晚八点，档案馆筹备处有个小会。别迟到——迟到的人，连残页一起，会被"处理掉"。',go:'end',eff:['flag.hint_5=1']}];
DIALOG.ch3_2=[
 {s:'dina',t:'（压低声音）五大势力的人，今晚都住在新月城。海湾的莱拉在码头，沙姆的萨利姆在军情处，伊甸的米里亚姆在领事馆。',go:1},
 {s:'dina',t:'各家的棋谱都是半张——但没人承认缺了另一半。你猜，他们缺的那一半，是不是都长一个样？',go:2},
 {s:'you',t:'你是说……',go:3},
 {s:'dina',t:'（嘘了一声）我什么都没说。茶钱结一下，谢谢惠顾。',go:'end',eff:['flag.hint_6=1']}];
DIALOG.ch3_3=[
 {s:'salim',t:'（军装笔挺，礼貌地微笑）年轻人，沙姆军情处想请你喝杯咖啡。放心，我们不像佣兵那样粗鲁。',go:1},
 {s:'you',t:'上校，我知道你为那张残页而来。',go:2},
 {s:'salim',t:'不，我为"秩序"而来。五次战争的胜利是沙姆的秩序——而档案，是唯一能让秩序崩盘的东西。',go:3},
 {s:'salim',t:'把残页交给我们。作为回报，你会得到沙姆的庇护、一份体面的差事，和一辈子花不完的第纳尔。',go:4,c:[
   {t:'婉拒：这页纸，我还没看完',go:5,eff:['rep.sham-6']},
   {t:'沉默，不置可否',go:6,eff:['rep.sham+3']},
   {t:'反问：如果我不交呢？',go:7,eff:['rep.sham-10','flag.sham_watch=1']}]},
 {s:'salim',t:'（笑容不变，眼神变冷）当然可以。只是沙姆的"秩序"，有时候也不讲礼貌。你考虑考虑，会议见。',go:'end'},
 {s:'salim',t:'（点头）聪明人。沙姆不会忘记朋友。会议见。',go:'end'},
 {s:'salim',t:'（他起身，整了整军装）那就不是咖啡了。年轻人，愿风沙对你温柔些。',go:'end'}];
DIALOG.ch3_4=[
 {s:'miriam',t:'（披着伊甸走廊的旧色披肩，声音很轻）年轻人，我知道你是从阿卡沙来的。旧邦的子民，不该在别人的棋局里当棋子。',go:1},
 {s:'you',t:'伊甸走廊想要档案？',go:2},
 {s:'miriam',t:'想要？档案里写的是我们失去的一切——五次战争，五次清算。我们只想取回"真相"，让世界看看墙外发生了什么。',go:3},
 {s:'miriam',t:'把残页交给我们。伊甸走廊会记住你的名字，像记住每一个流亡者的名字。',go:4,c:[
   {t:'拒绝：我要先亲眼看看档案',go:5,eff:['rep.eden-5']},
   {t:'被说动了：我会考虑',go:6,eff:['rep.eden+6']},
   {t:'质问：走廊的高墙里，难道没有秘密？',go:7,eff:['rep.eden-8','flag.eden_doubt=1']}]},
 {s:'miriam',t:'（眼里闪过一丝失望，随即恢复平静）愿你在档案里，找到比我们更好的答案。',go:'end'},
 {s:'miriam',t:'（她轻抚披肩）愿你的选择配得上这个名字。',go:'end'},
 {s:'miriam',t:'（她长久地看着你，最后只说了一句）有些墙，是我们自己砌的。',go:'end'}];
DIALOG.ch3_5=[
 {s:'nar',t:'档案馆筹备处的小会，挤满了五方人马。灯光昏暗，空气里全是雪茄味和火药味。',go:1},
 {s:'nar',t:'五张桌子，五张半棋谱。有人公开叫价，有人用眼神杀人。而你坐在角落，口袋里装着所有人都在找的残页。',go:2},
 {s:'you',t:'（选项：这一局，你想站谁？）',go:3,c:[
   {t:'把残页亮出来，公开开价',go:4,eff:['rep.gulf+10','money+200','san-4','flag.public=1']},
   {t:'保持沉默，谁也不给',go:5,eff:['san+2','flag.neutral=1']},
   {t:'悄悄给海湾的莱拉使个眼色',go:6,eff:['rep.gulf+15','money+120','flag.gulf_side=1']},
   {t:'把残页给伊甸的米里亚姆',go:7,eff:['rep.eden+18','flag.eden_side=1']}]},
 {s:'nar',t:'残页一出，满场死寂，随即炸了锅。五方人马同时起身，向你围过来。钱、威胁、承诺，像沙暴一样砸向你。',go:8},
 {s:'nar',t:'你什么都没有给任何人，只是把残页收回口袋。散会时，五双眼睛都钉在你背上，像五把刀。',go:8},
 {s:'nar',t:'莱拉在门口等你，递来一叠钞票和一张黑市会员卡："聪明人。今晚别走夜路，明天，来找我。"',go:8},
 {s:'nar',t:'米里亚姆在你走出门口时低声说："你会后悔的——但不是现在。现在，你是我们的人了。"',go:8},
 {s:'nar',t:'（无论你选了谁）这一晚，新月城的所有灯，都像在看你。',go:'end',eff:['flag.ch3_choice=1']}];
DIALOG.ch3_6=[
 {s:'kor',t:'（蹲在巷子阴影里啃肉串）小子，今天的会，好玩不？',go:1},
 {s:'you',t:'差点没活着出来。',go:2},
 {s:'kor',t:'这才到哪。棋局才开第一手——后面还有八格等着你。',go:3},
 {s:'you',t:'柯尔，你到底知道多少？',go:4},
 {s:'kor',t:'（沉默片刻）我知道档案馆在沙漠深处，也知道那座城被抹了名。我还知道，去过那里还活着的人，全世界只剩一个。',go:5},
 {s:'you',t:'谁？',go:6},
 {s:'kor',t:'（把肉串签子往沙地一插）他叫自己"老馆长"。你要找的下一站，是地图上没有名字的城——第九城。',go:'end',eff:['flag.hint_7=1']}];
DIALOG.ch3_7=[
 {s:'nar',t:'新月城的夜，九头鸟的棋局正式开局。第三章《九宫棋局》完结。',go:'end',eff:['flag.ch3_done=1','quest.q_ch4']}];

/* ================= 第四章剧情 ================= */
DIALOG.ch4_1=[
 {s:'nar',t:'越过三道沙梁，你踩上焦黑的土地。坦克残骸半埋在沙里，锈蚀的弹壳铺成一条路。',go:1},
 {s:'nar',t:'石碑上，城名被人凿掉了。只剩下一个模糊的轮廓——九个字的轮廓。',go:2},
 {s:'nar',t:'这就是第九城。五次战争里被抹去名字的旧都。',go:'end',eff:['flag.at_nine=1']}];
DIALOG.ch4_2=[
 {s:'curator',t:'（灯下，老人抬起头。他太老了，老得像这堆废墟一样）又来了一个。说吧，是来卖档案的，还是来烧档案的？',go:1},
 {s:'you',t:'（你取出名片。老人浑浊的眼睛突然亮了）我收到了这封信。',go:2},
 {s:'curator',t:'（他接过名片，手抖得厉害）六十年了……六十年了，第九格终于又动了。',go:3},
 {s:'curator',t:'年轻人，跟我来。你想知道档案是什么——我这条命，就是为回答这个问题留的。',go:'end',eff:['flag.meet_curator=1']}];
DIALOG.ch4_3=[
 {s:'curator',t:'（废墟深处的石室里，一台锈迹斑斑的机器嗡嗡作响）五次战争，五次"手术"。你以为那是自然历史？不。',go:1},
 {s:'you',t:'手术？',go:2},
 {s:'curator',t:'1948年，一个叫汉伯的档案员，在废墟里启动了这台机器。他改写了战争的结局——为了阻止一场更大的灾难。',go:3},
 {s:'curator',t:'但改写是有代价的。每一次"手术"，都会杀死一批人，重写一段历史。五次战争反转，就是五次手术的伤疤。',go:4},
 {s:'you',t:'那……为什么是我？',go:5},
 {s:'curator',t:'（老人久久看着你，没有回答）档案选人，从不说为什么。它只会给你指令——像这封信一样。',go:'end',eff:['flag.truth_1=1']}];
DIALOG.ch4_4=[
 {s:'curator',t:'（他把一把旧钥匙放在你手里）档案馆的钥匙。在更深的地方——第九格。',go:1},
 {s:'you',t:'第九格……是什么？',go:2},
 {s:'curator',t:'九宫格的最后一格。档案的核心。打开它的人，会得到"重写世界"的力量——也会付出无法想象的代价。',go:3},
 {s:'curator',t:'记住，年轻人：别让任何人打开第九格。除非——',go:4},
 {s:'curator',t:'（老人没有说完。他站起身，看向窗外）……天快黑了。你睡吧。天亮之前，别出石室。',go:'end',eff:['item.w_key','flag.has_key=1']}];
DIALOG.ch4_5=[
 {s:'nar',t:'你醒来时，灯已经灭了。老馆长不在。石桌上只有一道刀刻的遗言，和一小滩已经干涸的血。',go:1},
 {s:'sys',t:'"别让任何人打开第九格……除非……"',go:2},
 {s:'nar',t:'最后几个字被血洇掉了。风从废墟的破口灌进来，吹得残页猎猎作响。',go:3},
 {s:'nar',t:'远方，沙丘线上亮起一串火光——有人，正连夜赶来。第四章《第九城》完结。',go:'end',eff:['flag.ch4_done=1','ach.ninth_city']}];

/* ================= 第五章剧情 ================= */
DIALOG.ch5_1=[
 {s:'salim',t:'（在边境站的指挥所里，他背对地图）老馆长失踪了。钥匙，想必在你手里。',go:1},
 {s:'you',t:'上校的消息，比我快得多。',go:2},
 {s:'salim',t:'沙姆的情报网，比沙姆的军队还密。听着，孩子：档案必须由沙姆接管。它太危险，不该落在任何人手里。',go:3},
 {s:'salim',t:'交出来，我保你平安。这是沙姆最后一次用"请"字。',go:4,c:[
   {t:'交出钥匙',go:5,eff:['rep.sham+20','money+300','flag.gave_key=1','san-10']},
   {t:'拒绝',go:6,eff:['rep.sham-15','flag.keep_key=1']},
   {t:'假装交出一把假钥匙',go:7,eff:['rep.sham-25','flag.fake_key=1']}]},
 {s:'salim',t:'（他接过钥匙，端详片刻，难得地笑了笑）识时务。沙姆会记住你。',go:'end'},
 {s:'salim',t:'（他眯起眼）那我们就只能用另一种方式谈了。祝你活到下次见面。',go:'end'},
 {s:'salim',t:'（他掂了掂钥匙，脸色铁青）假的。你耍我？很好——沙姆喜欢和有骨气的年轻人打交道。下次见面，就是坟头了。',go:'end'}];
DIALOG.ch5_2=[
 {s:'miriam',t:'（在难民营的帐篷里，她摘下披肩，露出憔悴的脸）萨利姆想要钥匙，对不对？',go:1},
 {s:'you',t:'你怎么知道？',go:2},
 {s:'miriam',t:'因为我们有同一个情报源。年轻人，档案对沙姆是威胁，对伊甸是救赎——它里面，有"旧邦"的真相。',go:3},
 {s:'miriam',t:'五次战争，我们输了五次。墙外的人说我们是"被抹去的名字"。可档案里的真相，会让他们重新读历史。',go:4,c:[
   {t:'把钥匙交给伊甸',go:5,eff:['rep.eden+20','flag.gave_key_eden=1','san-10']},
   {t:'拒绝',go:6,eff:['rep.eden-12','flag.keep_key=1']},
   {t:'问：你们拿到档案，真的只想"读"历史吗？',go:7,eff:['rep.eden-8','flag.eden_doubt2=1']}]},
 {s:'miriam',t:'（她郑重地收下钥匙）你会被写进伊甸的史书。',go:'end'},
 {s:'miriam',t:'（她沉默很久）愿你守住它。',go:'end'},
 {s:'miriam',t:'（她苦笑着）读历史？还是改写历史？……也许连我自己，都不确定。',go:'end'}];
DIALOG.ch5_3=[
 {s:'nar',t:'边境线上，沙姆与伊甸的部队隔着铁丝网对峙。枪口对枪口，火药味比沙尘还呛。',go:1},
 {s:'nar',t:'而在你身后，海湾的油罐车、自由港的佣兵，正从两个方向逼近。九头鸟，终于同时张开了嘴。',go:2},
 {s:'you',t:'（选项：你站在哪一边？）',go:3,c:[
   {t:'跟着沙姆军推进',go:4,eff:['rep.sham+10','flag.side_sham=1']},
   {t:'掩护伊甸的难民车队',go:5,eff:['rep.eden+10','flag.side_eden=1']},
   {t:'两不相帮，绕路进废墟',go:6,eff:['san-6','flag.side_neutral=1']}]},
 {s:'nar',t:'你跟在沙姆的装甲车后，穿过烟尘。枪声在耳边炸开，你第一次直面战争的样子。',go:7},
 {s:'nar',t:'你把难民的车队引向绿洲方向。伊甸的人朝你喊了什么，被爆炸声吞没。',go:7},
 {s:'nar',t:'你贴着废墟的断墙穿行，子弹从头顶飞过。战争不属于你——至少今天，你只想活下来。',go:7},
 {s:'nar',t:'战斗在黄昏时沉寂下来。你在沙地里的弹坑边缘，捡到一样东西——一张照片。',go:'end',eff:['item.w_photo','flag.photo_got=1']}];
DIALOG.ch5_4=[
 {s:'nar',t:'边境站，铁丝网的两边都在流血。你站在中间，像站在历史的一道裂缝里。',go:'end',eff:['flag.at_border=1']}];
DIALOG.ch5_5=[
 {s:'nar',t:'你翻开那张照片。照片上，第九城的街道完好无损，阳光正好——一个与你一模一样的人站在街心，朝镜头微笑。',go:1},
 {s:'nar',t:'照片背面，是你小时候歪歪扭扭的字迹，写着一个日期：',go:2},
 {s:'sys',t:'"十天之后。"',go:3},
 {s:'nar',t:'你的手在抖。因为你确定，你从来没有写过这张照片。',go:'end',eff:['flag.photo_see=1','san-8']}];
DIALOG.ch5_6=[
 {s:'kor',t:'（在废墟边抽烟，手臂上多了道新伤）照片我看了。小子，你摊上大事了。',go:1},
 {s:'you',t:'柯尔，这照片到底哪来的？',go:2},
 {s:'kor',t:'（吐了个烟圈）档案"算"出来的。它算到十天后的第九城会有一个仪式——算到你会在场。',go:3},
 {s:'kor',t:'这张照片，是它给你的"请帖"。跟那封信一个道理。',go:4},
 {s:'you',t:'那……如果我不去呢？',go:5},
 {s:'kor',t:'（意味深长地看了你一眼）它算到的事，还没失算过。',go:'end',eff:['flag.hint_8=1']}];
DIALOG.ch5_7=[
 {s:'nar',t:'沙漠上，战争的火光未熄。第五章《九头鸟》完结。',go:'end',eff:['flag.ch5_done=1']}];

/* ================= 第六章剧情 ================= */
DIALOG.ch6_1=[
 {s:'nar',t:'十天后。第九城废墟上搭起了白色谈判帐篷，各色旗帜在风里列队。',go:1},
 {s:'nar',t:'这是二十年来的头一遭：沙姆、尼罗、海湾、伊甸、佣兵、维和团——六面旗，同一天插在同一片废墟上。',go:2},
 {s:'nar',t:'《第九城协议》，即将签署。而你，握着一张预言十天后的照片，站在人群边缘。',go:'end',eff:['flag.at_nine2=1']}];
DIALOG.ch6_2=[
 {s:'aliya',t:'（她挤到你身边，眼睛发亮）协议是幌子。我查到一件怪事：六方的"代表"，都是十天前才临时换的。',go:1},
 {s:'you',t:'临时换人？',go:2},
 {s:'aliya',t:'原来的代表，全在这几天"病退"了。官方的说法是水土不服。六个人一起水土不服？你信吗？',go:3},
 {s:'aliya',t:'（她压低声音）今晚仪式前，我要溜进维和团的帐篷查底账。你来不来？',go:4,c:[
   {t:'跟她去查',go:5,eff:['rep.neutral+6','flag.investigate=1']},
   {t:'太危险，不去了',go:6,eff:['san-4','flag.skip_invest=1']}]},
 {s:'nar',t:'你们趁换岗摸进维和团帐篷。账本、电报、还有几封没有署名的信。阿莉娅的手电光在纸面上扫过。',go:'end'},
 {s:'nar',t:'你没有去。但那一夜，你始终睡不踏实——远处帐篷里的灯光，亮到后半夜。',go:'end'}];
DIALOG.ch6_3=[
 {s:'aliya',t:'（她回来时脸色惨白）我看到了……帐篷里不止账本。还有六套一模一样的军服，和六张一模一样的脸。',go:1},
 {s:'you',t:'一模一样的脸？',go:2},
 {s:'aliya',t:'（她抖开一张底片）六个"代表"的体检照片。你把它们叠在一起看——完全是同一个人。',go:3},
 {s:'aliya',t:'档案……它在"复制"人。它在用替身，控制这场会议。',go:'end',eff:['flag.clone_hint=1','san-6']}];
DIALOG.ch6_4=[
 {s:'salim',t:'（军装笔挺，笑容标准得像刻出来的）年轻人，我们又见面了。协议签署在即，沙姆愿意再给你一次机会。',go:1},
 {s:'you',t:'（你盯着他的脸。他的微笑幅度，和三天前一模一样，分毫不差）上校……您的手，一直在抖吗？',go:2},
 {s:'salim',t:'（笑容凝固了一瞬，随即恢复）风沙大，沙姆军人常年握枪。你多虑了。',go:3},
 {s:'you',t:'（你后退半步）那……上校，您记得我们第一次见面，您请我喝的是什么吗？',go:4},
 {s:'salim',t:'（他沉默了两秒，然后说）咖啡。沙姆的咖啡。',go:5},
 {s:'nar',t:'你后背一凉。第一次见面，他请的是"咖啡"，但他说的是——茶。萨利姆上校，从来只喝茶。',go:'end',eff:['flag.salim_clone=1','san-10']}];
DIALOG.ch6_5=[
 {s:'nar',t:'仪式开始前一小时，你掀开维和团主帐篷的门帘。',go:1},
 {s:'nar',t:'八位谈判代表并排坐在折叠椅上，闭着眼，一动不动，像蜡像。你凑近看——他们长得一模一样。',go:2},
 {s:'nar',t:'而他们的"本人"，早在三天前就消失了。',go:3},
 {s:'you',t:'（选项：你怎么办？）',go:4,c:[
   {t:'冲进会场，掀翻协议桌，公开真相',go:5,eff:['rep.gulf-5','rep.sham-10','rep.eden-5','flag.expose=1','san-10']},
   {t:'烧掉档案入口的封条，把水搅浑',go:6,eff:['rep.gulf+5','flag.sabotage=1','san-5']},
   {t:'什么都不做，静静退出去',go:7,eff:['flag.stay=1','san-3']}]},
 {s:'nar',t:'你撞开会场大门，在众目睽睽之下把八张一模一样的脸摊开在谈判桌上。会场炸了。协议，没签成。',go:8},
 {s:'nar',t:'档案馆入口的封条在火光中化为灰烬。各方人马乱作一团，趁乱，有人钻进了废墟深处。',go:8},
 {s:'nar',t:'你退到人群之外，把这一切看在眼里。风沙中，你第一次觉得——自己站在了一张巨大棋盘上。',go:8},
 {s:'nar',t:'第六章《十天之后》完结。',go:'end',eff:['flag.ch6_done=1']}];
DIALOG.ch6_6=[
 {s:'kor',t:'（不知何时，他已经站在你身边）看见了？',go:1},
 {s:'you',t:'看见了。他们不是人。',go:2},
 {s:'kor',t:'（把烟屁股摁灭）他们也是人——只是被人"重写"过。档案这东西，能算历史，也能算人。',go:3},
 {s:'kor',t:'小子，下一个被重写的，可能就是你我。想活命，就得比它算得更快。',go:4},
 {s:'you',t:'怎么快？',go:5},
 {s:'kor',t:'（他看向废墟深处）去找那个瞎眼诗人。新月城，唱旧歌的那个。他知道怎么"抢在档案前面"。',go:'end',eff:['flag.hint_9=1']}];
DIALOG.ch6_7=[
 {s:'nar',t:'《第九城协议》化为泡影。替身的秘密像瘟疫一样传开。',go:1},
 {s:'nar',t:'而你终于明白：五次战争的反转，不是历史——是手术。档案一直在"重写"这个世界。',go:2},
 {s:'nar',t:'风沙里，档案馆的入口黑洞洞地开着。它在等你。',go:'end',eff:['flag.ch6b=1']}];

 w_mud:{name:'战地泥偶',cat:'任务',desc:'1948 年战场上的孩子捏的泥偶，第一层记忆的钥匙。',price:0,sell:0,weight:.2,quest:1},
 w_badge_old:{name:'旧六角徽章',cat:'任务',desc:'1967 年旧邦军人的徽章，锈得只剩轮廓，第二层记忆的钥匙。',price:0,sell:0,weight:.2,quest:1},
 w_tag:{name:'断军牌',cat:'任务',desc:'1982 年战线上掰断的军牌，上面的名字被磨平了，第三层记忆的钥匙。',price:0,sell:0,weight:.1,quest:1},
 w_quill:{name:'汉伯的羽毛笔',cat:'任务',desc:'档案馆里找到的旧笔，笔尖还沾着干涸的墨。',price:0,sell:0,weight:0,quest:1}});

/* ================= 第七章剧情 ================= */
DIALOG.ch7_1=[
 {s:'musa',t:'（新月城广场上，盲诗人拨着琴弦。他"看"向你，像看穿一层沙）来了？带着照片和替身的秘密，来了。',go:1},
 {s:'you',t:'（你在老人面前坐下）他们都说您知道——怎么抢在档案前面。',go:2},
 {s:'musa',t:'（他笑了，琴声停了）抢在档案前面？孩子，档案不是写在纸上的，它是活的。它在"算"，也在"写"。',go:3},
 {s:'musa',t:'替身是它的免疫细胞。谁动了档案的核心，它就复制一批"人"来保卫自己。你们看到的会议，不过是它的一场高烧。',go:4},
 {s:'you',t:'那……我手里的信、照片，也都是它写的？',go:5},
 {s:'musa',t:'（他沉默了很久）不。信和照片，不是档案写的——是你自己写的。',go:6},
 {s:'you',t:'我？我从来没——',go:7},
 {s:'musa',t:'你是"书写者"。档案选了九个书写者，前八个都死在自己的字里行间。你是第九个。',go:'end',eff:['flag.meet_musa=1','san-4','quest.q_ch7']}];
DIALOG.ch7_2=[
 {s:'dina',t:'（她把一沓纸推到你面前）盲诗人说的对。这是我能找到的，关于"书写者"的全部记载。',go:1},
 {s:'dina',t:'前八个书写者，死在档案馆的不同层。他们"写"过战争，也"写"过自己。档案从不浪费一个书写者。',go:2},
 {s:'you',t:'那我也会死在里面？',go:3},
 {s:'dina',t:'（她看着你，像看着自己的孩子）档案选人，不选命大的，选"该写的人"。至于你该写什么——只有第九格知道。',go:4},
 {s:'dina',t:'（她顿了顿）还有一件事。老馆长失踪前，给茶馆留过一张字条。上面只有四个字："换日线，深。"',go:'end',eff:['flag.hint_10=1']}];
DIALOG.ch7_3=[
 {s:'nar',t:'你再次进入档案馆深处。这一次，锈迹斑斑的机器"醒"了——屏幕亮起，齿轮转动，整座废墟都在轻微震颤。',go:1},
 {s:'nar',t:'屏幕上滚动着数字：1948·1956·1967·1973·1982。五次手术的记录，像五道巨大的伤疤。',go:2},
 {s:'sys',t:'"第九位书写者已就位。"',go:3},
 {s:'nar',t:'机器深处伸出一支机械臂，将一枚金属徽章轻轻放在你掌心。九宫格的纹路，正中刻着——HanBer NINE。',go:4},
 {s:'you',t:'（你捏着徽章）为什么要选我？',go:5},
 {s:'sys',t:'"因为你是第九个。"',go:6},
 {s:'nar',t:'屏幕暗下去。但最后一行字，你不可能看错——',go:7},
 {s:'sys',t:'"指令一：找到你自己死去的那个版本。"',go:'end',eff:['item.w_ninecoin','flag.writer=1','ach.writer','san-6']}];
DIALOG.ch7_4=[
 {s:'kor',t:'（他听说你进了档案馆，破口大骂了十分钟）你疯了！八个书写者，八个坟！',go:1},
 {s:'you',t:'可它已经选了我。',go:2},
 {s:'kor',t:'（他沉默良久，最后从怀里摸出一块破布包着的东西塞给你）……拿着。1948 年的旧东西，我年轻时从废墟里刨的。',go:3},
 {s:'you',t:'这是什么？',go:4},
 {s:'kor',t:'泥偶。战场上的孩子捏的。档案的"记忆层"认这种东西——它带着活人的温度。',go:5},
 {s:'kor',t:'去找另外两件：1967 的徽章，1982 的军牌。凑齐三件，你才能下到第九格。',go:'end',eff:['item.w_mud','flag.hint_11=1','rep.merc+5']}];
DIALOG.ch7_5=[
 {s:'nar',t:'深夜，你坐在新月城旅店的窗边。徽章在月光下泛着冷光。',go:1},
 {s:'nar',t:'档案的指令还在你脑中回响："找到你自己死去的那个版本。"',go:2},
 {s:'nar',t:'死去的……自己。有九个。第七章《换日线》完结。',go:'end',eff:['flag.ch7_done=1']}];

/* ================= 第八章剧情 ================= */
DIALOG.ch8_1=[
 {s:'musa',t:'（琴声低沉）九层记忆，九个死去的你。每一层，是一场反转的战争；每一个"你"，都是它写下的一个结局。',go:1},
 {s:'you',t:'那我怎么进去？',go:2},
 {s:'musa',t:'档案认"活人的温度"。三件旧物：1948 的泥偶、1967 的徽章、1982 的军牌。它们能让你在九层之间行走。',go:3},
 {s:'musa',t:'去找吧。边境站的铁匠有旧徽章，难民营的护士有断军牌。至于泥偶——你怀里不是已经有一件了么。',go:'end',eff:['flag.hint_12=1','quest.q_ch8']}];
DIALOG.ch8_2=[
 {s:'kamaal',t:'（铁匠铺的炉火映着他粗糙的脸）1967 的徽章？你说的是这个吧。',go:1},
 {s:'kamaal',t:'（他从工具箱最底层翻出一枚锈徽章）旧邦军官的，战后流到黑市，我收来当镇纸。你要，拿东西换。',go:2,c:[
   {t:'付钱买下（150第纳尔）',go:3,eff:['money-150']},
   {t:'用一把匕首换',go:4,eff:['flag.barter=1']},
   {t:'算了，不换了',go:5}]},
 {s:'kamaal',t:'（他掂了掂钱袋）痛快。拿去吧，愿它别给你招来祸事。',go:6,eff:['item.w_badge_old']},
 {s:'kamaal',t:'（他接过匕首，在手里转了个花）老伙计，换新主了。这枚徽章，是你的了。',go:6,eff:['item.w_badge_old']},
 {s:'kamaal',t:'（他耸耸肩）随你。徽章就躺在这儿，什么时候想通了什么时候来。',go:'end'},
 {s:'nar',t:'（只要换了，都一样）你收好徽章。1967 的那场战争，隔着六十年，硌得你手心发疼。',go:'end'}];
DIALOG.ch8_3=[
 {s:'hanna',t:'（难民营诊所的帘子后，她正给一个孩子换药）断军牌？……你是说这个？',go:1},
 {s:'hanna',t:'（她从脖子上摘下一块被磨平了名字的军牌）1982 年，战线上。一个年轻士兵死在我怀里，他说自己是"档案的人"。',go:2},
 {s:'hanna',t:'他说，如果有一天有个拿九宫格徽章的人来，就把这个给他。',go:3},
 {s:'you',t:'（你摊开掌心，露出九号徽章）……是我。',go:4},
 {s:'hanna',t:'（她看了你很久，然后把军牌放进你手里）他等的人，终于来了。愿你别死在他死的地方。',go:'end',eff:['item.w_tag','rep.eden+8']}];
DIALOG.ch8_4=[
 {s:'nar',t:'（你带着三件旧物，再次下到档案馆第九格入口。锈门无声滑开，幽蓝的光漫出来。）',go:1},
 {s:'nar',t:'九扇门，九层记忆。每推开一扇，就是一场被"手术"改写的战争。',go:2},
 {s:'you',t:'（选项：你先推开哪扇门？）',go:3,c:[
   {t:'第一层：1948 的废墟（泥偶发光）',go:4,eff:['flag.layer1=1']},
   {t:'第七层：1973 的焦土（徽章发烫）',go:5,eff:['flag.layer7=1']},
   {t:'第九层：1982 的战线（军牌嗡鸣）',go:6,eff:['flag.layer9=1']}]},
 {s:'nar',t:'门后是一声遥远的哭喊，一场炮火，一片被抹平的街区。你看见一个和你一模一样的少年倒在焦土里——那是"你"的第一个版本。',go:7},
 {s:'nar',t:'门后是燃烧的输油管线与坦克洪流。另一个"你"举着白旗，被流弹击中——那是第七个版本。',go:7},
 {s:'nar',t:'门后是贝鲁特的断壁残垣。一个"你"把相机交给你，说"真相就交给你了"——那是第九个版本。',go:7},
 {s:'nar',t:'（九层你走了个遍。最后，你停在第九层最深处。）',go:8},
 {s:'nar',t:'那里躺着一个"你"。他还活着——身上插满管子，连接着档案馆的机器。',go:9},
 {s:'first',t:'（第一版的我缓缓睁开眼，看着你，像看着镜子）你来了。我等你，等了二十六年。',go:10},
 {s:'you',t:'你是谁？',go:11},
 {s:'first',t:'我是第一个被档案写下的"你"。1948 年，汉伯启动机器，我替他承受了第一次手术的代价。',go:12},
 {s:'first',t:'档案维持这个世界，需要能量。每二十六年，需要一个"书写者"的心脏来续命。',go:13},
 {s:'you',t:'心脏？',go:14},
 {s:'first',t:'（他笑了，笑得很苦）今年，就是第二十六年。而你的生日——就是续命的日子。',go:'end',eff:['flag.meet_first=1','san-12','ach.layers']}];
DIALOG.ch8_5=[
 {s:'nar',t:'你跌跌撞撞爬出档案馆。风沙灌进肺里，你大口喘气。',go:1},
 {s:'nar',t:'生日。你从来不知道自己的生日有什么特别——现在你知道了。',go:2},
 {s:'nar',t:'第八章《九死一生》完结。',go:'end',eff:['flag.ch8_done=1','quest.q_ch9']}];

/* ================= 第九章剧情 ================= */
DIALOG.ch9_1=[
 {s:'nar',t:'你回到阿卡沙。生日前夜，驿站的火堆旁，扎伊德爷爷给你煨了一壶茶。',go:1},
 {s:'zayed',t:'（他像什么都没发生一样，给你倒茶）长大了。该知道自己的生辰八字了。',go:2},
 {s:'you',t:'爷爷……档案说，我生日那天，就是它续命的日子。',go:3},
 {s:'zayed',t:'（他沉默了很久，火光在他脸上跳动）……汉伯当年启动机器之前，来找过我父亲。他问：改五个结局，要付几条命？',go:4},
 {s:'zayed',t:'我父亲说：一条。他说：那我来。',go:5},
 {s:'you',t:'汉伯……是用自己的命，换了世界？',go:6},
 {s:'zayed',t:'（他摇头）不。他付了那条命，可又有人替他活了下去。档案从来不只算历史——它算人心。',go:'end',eff:['flag.hint_13=1','san+6']}];
DIALOG.ch9_2=[
 {s:'nar',t:'生日当天，新月城的信鸽、沙姆的直升机、海湾的游艇、伊甸的装甲车——同时向档案馆集结。',go:1},
 {s:'nar',t:'所有人都在找你。不，所有人都在找"你的心脏"。',go:2},
 {s:'you',t:'（你站在档案馆大门前。世界线在这一天收束成三个字。）',go:3,c:[
   {t:'续命——维持这个反转的世界',go:4,eff:['flag.end_keep=1']},
   {t:'断供——让世界回滚到 1948',go:5,eff:['flag.end_break=1']},
   {t:'改写——启动第三次手术，创造第三种世界',go:6,eff:['flag.end_rewrite=1']}]},
 {s:'nar',t:'你选择了"续命"。世界会继续维持五次战争的反转——而档案的指针，重新归位。',go:7},
 {s:'nar',t:'你选择了"断供"。你亲手拔掉档案的管线。世界，开始回滚。',go:7},
 {s:'nar',t:'你选择了"改写"。你告诉档案：第三次手术，目标不是战争，是"边界"本身。',go:7},
 {s:'nar',t:'（无论选什么，档案馆的机器都发出一声长鸣。）',go:8},
 {s:'nar',t:'你走向控制台。第九格的按钮，在灯光下泛着铜锈。',go:9},
 {s:'nar',t:'你伸出手——然后愣住了。按钮上刻着一行字。',go:10},
 {s:'sys',t:'HanBer NINE',go:11},
 {s:'nar',t:'你终于明白：汉伯不是档案的名字。汉伯，是创始人的名字。',go:12},
 {s:'nar',t:'而你——你就是他。他的意识，在每一次"手术"后，都被写进下一个书写者体内。',go:13},
 {s:'nar',t:'你是汉伯的第九个继承者。',go:14},
 {s:'nar',t:'第九章《生日》完结。',go:'end',eff:['flag.ch9_done=1','ach.birthday']}];

/* ================= 第十章剧情 ================= */
DIALOG.ch10_1=[
 {s:'musa',t:'（他的琴声第一次走了调）汉伯……我还记得他。1948 年，他在废墟里数尸体，数到第九具时，他跪下了。',go:1},
 {s:'musa',t:'他对那九具尸体说："如果结局能重写，我愿意付任何代价。"——档案听见了。',go:2},
 {s:'you',t:'所以他改写了五次战争，想让那九个人活下来？',go:3},
 {s:'musa',t:'（老人摇头，又点头）他改写了战争，不是为了那九个人——是为了让"下一次战争"不要发生。他算到，如果按照原历史，会有一场更大的灾难。',go:4},
 {s:'musa',t:'五次手术，五次纠偏。世界保住了——可他自己的命，一次又一次地，续在了别人身上。',go:5},
 {s:'musa',t:'孩子，档案里有一本他的日记。去找它。那里面，写着所有答案——和一个可怕的问题。',go:'end',eff:['flag.hint_14=1','quest.q_ch10']}];
DIALOG.ch10_2=[
 {s:'dina',t:'（她神神秘秘地把你拉到后厨）你要的东西，在档案馆筹备处的仓库。被封条封着，钥匙在维和团那帮人手里。',go:1},
 {s:'you',t:'你连这个都知道？',go:2},
 {s:'dina',t:'（她翻了个白眼）我的茶馆开在新月城三十年，靠的就是"什么都知道"。去拿吧，今晚维和团换防，有半小时空窗。',go:'end',eff:['flag.hint_15=1']}];
DIALOG.ch10_3=[
 {s:'nar',t:'深夜，你翻进档案馆筹备处的仓库。灰尘里，一个铁皮箱子贴着封条：1948·档字第壹号。',go:1},
 {s:'nar',t:'你撬开箱子。里面只有一本日记——封面烫着金字：HanBer。',go:2},
 {s:'nar',t:'你翻开。日记的第一页写着：',go:3},
 {s:'sys',t:'"1948年6月9日。今天，我改写了世界。没有人感谢我。包括我自己。"',go:4},
 {s:'nar',t:'你一页页翻下去。汉伯记录了五次手术的每一次代价：谁死了，谁活了，谁被改写，谁再也认不出自己。',go:5},
 {s:'nar',t:'最后一页，字迹狂乱，几乎要划破纸面——',go:6},
 {s:'sys',t:'"我改写了五次战争，却没能改写我自己。第九个我，正在某处活着——去找他，杀了他，世界才会停止循环。"',go:7},
 {s:'nar',t:'你握着日记，站在夜里，久久没有动。第九个"我"……是谁？',go:'end',eff:['item.w_diary','flag.have_diary=1','san-10','ach.diary']}];
DIALOG.ch10_4=[
 {s:'miriam',t:'（她看着你手里的日记，脸色一点点白下去）……所以，我们走廊的高层，都是"写生"出来的。',go:1},
 {s:'you',t:'写生？',go:2},
 {s:'miriam',t:'档案的术语。被"重写"过的人，档案会保留他们的一部分，再"写"出替身来维护秩序。我们这些复国派……',go:3},
 {s:'miriam',t:'（她惨然一笑）我们以为自己在为真相而战。可我们存在的本身，就是档案的一场手术。',go:4},
 {s:'miriam',t:'（她看向远方，声音很轻）年轻人，如果连"复国"都是被写好的剧本——那这世界上，到底还有什么是真的？',go:'end',eff:['flag.miriam_truth=1','san-8']}];
DIALOG.ch10_5=[
 {s:'nar',t:'日记在月光下泛黄。第九章的秘密像潮水一样淹过来。',go:1},
 {s:'nar',t:'汉伯在等你。第九个他，在这个世界的某个角落，活了几十年。',go:2},
 {s:'nar',t:'第十章《创始人之子》完结。',go:'end',eff:['flag.ch10_done=1','quest.q_ch11']}];

/* ================= 第十一章剧情 ================= */
DIALOG.ch11_1=[
 {s:'zayed',t:'（他听完你的话，沉默了很久）……"第九个我"。',go:1},
 {s:'zayed',t:'（他慢慢站起身，走到窗边）阿卡沙的旧磨坊，三十年前就没人去了。但这两年，磨坊的灯，偶尔会亮。',go:2},
 {s:'you',t:'（你心里一沉）爷爷，你知道那是谁？',go:3},
 {s:'zayed',t:'（他没有回头）知道。但我答应过他，不告诉任何人。',go:4},
 {s:'zayed',t:'（他转过身，目光深深）不过——你不一样。你是唯一一个，可能"结束"这件事的人。去吧。',go:'end',eff:['flag.hint_16=1','quest.q_ch11b']}];
DIALOG.ch11_2=[
 {s:'nar',t:'旧磨坊的灯，真的亮着。风车早已停转，门缝里漏出一点昏黄的光。',go:1},
 {s:'nar',t:'你推开门。屋里坐着一个老人——很老，老得像第九城的废墟。他抬起头。',go:2},
 {s:'oldme',t:'（他看着你，笑了，像看了自己一辈子）你来了。第九个我。',go:3},
 {s:'you',t:'（你握着日记，声音发紧）汉伯……',go:4},
 {s:'oldme',t:'（他点头）汉伯。1948 年我是汉伯。现在是"第九个汉伯"。每一次手术，我都把自己续下去——因为世界还需要我。',go:5},
 {s:'oldme',t:'可日记你也看了：世界永远不会停止循环，除非有人结束"我"。',go:6},
 {s:'you',t:'你早就知道会这样……所以你把信寄给"自己"？',go:7},
 {s:'oldme',t:'（他笑了）信不是我寄的。是你自己寄的。每一个书写者，都在临死前给"下一个自己"写信——这已经是我们唯一的仪式。',go:8},
 {s:'you',t:'（选项：你面对"自己"，怎么办？）',go:9,c:[
   {t:'结束他——让循环停止',go:10,eff:['flag.kill_old=1','san-15']},
   {t:'放过他——带他离开磨坊',go:11,eff:['flag.spare_old=1','san+8']},
   {t:'坐下来，和他谈谈最后一次',go:12,eff:['flag.talk_old=1','san+4','flag.know_all=1']}]},
 {s:'nar',t:'你结束了"第九个汉伯"。循环，终于在你手里断开了。',go:13},
 {s:'nar',t:'你扶起他，走出磨坊。他在晨光里眯着眼，像刚从一场大梦里醒过来。',go:13},
 {s:'nar',t:'你们谈到天亮。他告诉你最后一个秘密：档案馆的机器，其实从来不需要心脏——它需要的是"选择"。',go:13},
 {s:'nar',t:'（无论你怎么选，老人最后都只问了一句。）',go:14},
 {s:'oldme',t:'（他拿出一面旧镜子，递给你）看看。这个世界的"结局"，到底长什么样？',go:15},
 {s:'nar',t:'你接过镜子。镜子里——没有你。',go:16},
 {s:'nar',t:'镜子里，是正在看着屏幕的，你自己。',go:17},
 {s:'sys',t:'第十一章《第九个我》完结。',go:'end',eff:['flag.ch11_done=1','ach.mirror','san-6']}];

/* ================= 第十二章剧情（终局） ================= */
DIALOG.ch12_1=[
 {s:'nar',t:'你带着全部答案，回到档案馆。机器静静运转，第九格的按钮泛着铜锈。',go:1},
 {s:'nar',t:'世界线，收束在这里。',go:2},
 {s:'you',t:'（你最后看了一眼这个世界：沙姆的军旗、河谷的麦田、纳夫塔港的油轮、难民营的灯火、新月城的茶馆、自由港的酒馆——）',go:3},
 {s:'nar',t:'你按下按钮。',go:4,c:[
   {t:'（续命线）维持反转世界，成为新馆长',go:5,eff:['flag.endA=1']},
   {t:'（断供线）拔掉管线，世界回滚 1948',go:6,eff:['flag.endB=1']},
   {t:'（改写线）第三次手术：消除边界',go:7,eff:['flag.endC=1']}]},
 {s:'nar',t:'终局演出请见章节界面。第十二章《世界线收束》·结局·续命线。',go:'end'},
 {s:'nar',t:'终局演出请见章节界面。第十二章《世界线收束》·结局·断供线。',go:'end'},
 {s:'nar',t:'终局演出请见章节界面。第十二章《世界线收束》·结局·改写线。',go:'end'}];

/* ================= 结局演出 ================= */
const ENDINGS={
 A:{name:'结局·续命线《长夜掌灯》',text:`　　你选择了维持这个世界。
　　五次战争的反转延续下去：沙姆的军旗还在边境飘，河谷的麦田还在收成，纳夫塔港的油轮还在吞吐，难民营的灯还在亮。世界没有变得更好，也没有变得更坏——它只是，继续存在。
　　你成了档案馆的新馆长。每年生日，你都会回到第九城，给机器换一枚齿轮，然后坐在老馆长坐过的椅子上，看太阳从废墟上升起。
　　阿莉娅在报纸上写下最后一篇报道：《第九城的新守夜人》。柯尔带着两瓶酒来看了你一次，骂你"傻小子"，然后在你门口坐了一整夜。
　　后来你发现，档案的指令栏里多了一行字：
　　"下一次续命：二十六年后。书写者：待定。"
　　你提笔，在那行字下面，写上了自己的名字。
　　因为你知道——总得有人，替这个世界掌灯。`,
   post:`　　沙漠深处，又一次响起打字机的声音。`,
   cliff:`　　档案仍在书写。第二季《NINE·第二次手术》敬请期待。`},
 B:{name:'结局·断供线《倒带的钟》',text:`　　你拔掉了档案的管线。
　　世界开始回滚：五次战争的原历史，像一卷倒放的胶片，冲刷过每一个人。沙姆消失了，伊甸走廊消失了，海湾的石油纪元消失了——连新月城的茶馆，都变成了地图上一个从未存在的坐标。
　　只有你记得。
　　你记得扎伊德爷爷的火堆，记得阿莉娅的笔记本，记得柯尔的劣酒，记得盲诗人的琴声。你走遍这个"原历史"的世界，却再也找不到他们任何一个。
　　你在 1948 年的废墟上坐了很久。那里，九具尸体刚刚被埋好，一个叫汉伯的档案员正跪在墓前。
　　你走过去，对他说："别启动那台机器。"
　　他抬起头，看着你，像是看到了很多年以后的一束光。他笑了："那你呢？你是谁？"
　　你没有回答。你只是在他手边，放了一枚九宫格徽章，然后转身走进风沙。
　　身后，打字机的声音，响了一下，又停了。`,
   post:`　　档案，终于安静了。`,
   cliff:`　　可你知道，只要还有人记得"另一种历史"，汉伯总有一天会再找到那台机器。第二季《NINE·回滚年代》敬请期待。`},
 C:{name:'结局·改写线《无界之沙》',text:`　　你告诉档案：第三次手术，不针对战争，针对"边界"本身。
　　机器震动了七天七夜。第八天清晨，当第一缕光照进档案馆时，你发现：地图上的虚线，全部消失了。
　　沙姆与伊甸之间没有了高墙，河谷与海湾之间没有了关卡，难民营与新城之间没有了铁丝网。人们起初恐慌，后来试探，再后来——有人在第九城的废墟上，摆了一张很长的桌子，邀请所有旗子下的人，一起吃饭。
　　那天新月城的茶馆爆满。迪娜忙得脚不沾地，阿莉娅在人群中记着笔记，柯尔破天荒地没有骂人。盲诗人穆萨坐在广场上，拨着琴弦唱了一支新歌。
　　没有人知道，这一切的代价是：你自己，从这个世界里消失了。
　　你成了档案的一部分，成了风沙里那句无人听见的旁白。
　　很多年后，阿莉娅出版了一本书，叫《第九个书写者》。书的最后一页，只有一行字：
　　"风沙会记住每一个没有名字的人。而那座城，终于有了名字。"`,
   post:`　　沙漠深处，打字机的声音没有停。`,
   cliff:`　　只是这一次，写下的不再是战争。第二季《NINE·无界》敬请期待。`}};

const ACTIVE_QUESTS={};
function initSideQuests(){
  for(const id in SIDE_QUESTS){ACTIVE_QUESTS[id]=Object.assign({id},SIDE_QUESTS[id],{done:false});}
}
function sideGive(id){
  const q=ACTIVE_QUESTS[id]; if(!q)return;
  // 素材是否满足
  const needItem=q.item?invCount(q.item)>=q.qty:true;
  const needExtra=q.extra?invCount(q.extra)>=1:true;
  const needKill=q.kill?(S.flags['kill_'+(q.kill)]||0)>=q.qty:true;
  const needCity=q.city?playerAtCity(q.city):true;
  if(q.kill&&!needKill){toast('还差 '+q.kill+' 目标 '+Math.max(0,q.qty-(S.flags['kill_'+q.kill]||0))+' 个');return;}
  if(needItem&&needExtra&&needCity){
    if(q.item)invRemove(q.item,q.qty);
    if(q.extra)invRemove(q.extra,1);
    q.done=true;
    const rw=q.reward.split(';');
    for(const r of rw)parseEff([r]);
    S.doneQuests.push(id);
    S.quests=S.quests.filter(x=>x!==id);
    log('✅ 任务完成：'+q.title,'ok');
    ach('side_quest');
    toast('任务完成：'+q.title);
  }else{
    const missing=[];
    if(q.item&&!needItem)missing.push(q.item+'×'+q.qty);
    if(q.extra&&!needExtra)missing.push(q.extra);
    if(q.city&&!needCity)missing.push('送到'+CITY[q.city].name);
    toast('还缺：'+missing.join('、'));
  }
}

/* ================= 章节引擎 ================= */
function evalCond(c){
  const m=c.match(/^(\w+)>=(-?\d+)$/); if(!m)return true;
  const k=m[1],v=parseInt(m[2]);
  if(k==='money')return S.money>=v;
  if(k.startsWith('flag.'))return (S.flags[k.slice(5)]||0)>=v;
  return true;
}
function chapterAllowed(n){
  if(S.mode!=='main'||S.storyDone)return false;
  if(n<1||n>12)return false;
  if(n===1)return true;
  return !!S.flags['ch'+(n-1)+'done'];
}
function pendingStep(){
  if(S.mode!=='main'||S.storyDone)return null;
  const ch=CHAPTERS[S.chapter-1]; if(!ch)return null;
  if(S.flags['ch'+S.chapter+'done'])return null;
  return ch.steps[S.step];
}
function startChapter(n){
  if(S.chapter===n)return;
  S.chapter=n;S.step=0;
  const ch=CHAPTERS[n-1];
  showStory({chap:'第'+n+'章',title:'《'+ch.title+'》',body:ch.intro,btn:'踏入这个世界'});
  journal('第'+n+'章《'+ch.title+'》开启');
  log('📖 第'+n+'章《'+ch.title+'》开启','story');
}
function completeChapter(){
  const n=S.chapter,ch=CHAPTERS[n-1];
  S.flags['ch'+n+'done']=1;
  journal('第'+n+'章《'+ch.title+'》完结');
  log('📖 第'+n+'章《'+ch.title+'》完结','story');
  if(n<12){
    showStory({chap:'第'+n+'章·完',title:'悬念：',body:'',cliff:ch.cliff,teaser:ch.teaser,btn:'等待下期更新'});
  }else{
    S.storyDone=true;
    const key=S.flags.endA?'A':(S.flags.endB?'B':(S.flags.endC?'C':'A'));
    const e=ENDINGS[key];
    ach('ending_'+key.toLowerCase());
    ach('finish_story');
    showStory({chap:'最终章·结局',title:e.name,body:e.text,cliff:true,extra:e.post,teaser:e.cliff,btn:'回到这个世界',final:true});
  }
}
function stepDone(){
  const n=S.chapter,ch=CHAPTERS[n-1];
  S.step++;
  if(S.step>=ch.steps.length){completeChapter();return;}
  const ns=ch.steps[S.step];
  if(ns.type==='auto')setTimeout(()=>runDialog(ns.dialog,stepDone),450);
}
function checkTalkStep(npc){
  const st=pendingStep();
  if(st&&st.type==='talk'&&st.npc===npc.id){
    runDialog(st.dialog,()=>{
      if(st.need&&st.need.some(it=>invCount(it)<1)){toast('还差关键道具——先在别处找齐，再回来。');return;}
      stepDone();
    });
    return true;
  }
  return false;
}
function checkCityStep(){
  const st=pendingStep();
  if(st&&st.type==='city'){
    const c=CITY[st.city];
    if(c&&dist(S.x,S.y,c.fx,c.fy)<14){
      runDialog(st.dialog,stepDone);
      return true;
    }
  }
  return false;
}

  if(S.chapter===0&&chapterAllowed(1))startChapter(1);
  else if(chapterAllowed(S.chapter+1))startChapter(S.chapter+1);
  // 天气
  rollWeather();
  // 世界事件
  rollEvent();
  // 生存里程碑
  if(S.mode==='free'||S.storyDone){
    if(Time.day===7)ach('survival_7');
    if(Time.day===15)ach('survival_15');
    if(Time.day===30)ach('survival_30');
    if(Time.day>50)ach('survival_60');
  }
  if(Time.day===60)S.survivalBest=Math.max(S.survivalBest,60);
  // 每日小结
  log('🌅 第'+Time.day+'天 开始。天气：'+S.weather+'。','dim');
  autosave();
}

function currentTemp(){
  const h=Time.hour;
  let t=26+Math.sin((h-9)/24*Math.PI*2)*10;
  if(S.weather==='热浪')t+=9;if(S.weather==='沙尘')t-=3;
  if(Time.isNight())t-=8;
  return Math.round(t);
}

let MOVE_TO=null;
const MOVECOST={0:6,1:7,2:4,3:4,4:5,5:6,7:9,8:8,9:6,11:5,12:6}; // 每格体力消耗
function tileCost(t){return (MOVECOST[t]||6);}
function movePlayer(dx,dy){
  const nx=S.x+dx,ny=S.y+dy;
  if(nx<0||ny<0||nx>=CFG.W||ny>=CFG.H)return;
  const t=G.tiles[ny*CFG.W+nx];
  if(t===6||t===10||t===13)return; // 山/河/墙
  const speed=(S.equip.mount?ITEMS[S.equip.mount].mount||1:1);
  if(sandstorm)speed*=.7;
  S.x=nx;S.y=ny;
  S.st=Math.max(0,S.st-tileCost(t)/speed);
  if(S.st<=5)log('😮‍💨 体力见底，走不动了——休息一下吧。','bad');
  // 时间消耗
  Time.min+=6/speed;
  // 遭遇
  if(Math.random()<encChance(t)){
    const e=encounterFor(nx,ny);
    if(e)Combat.start(e);
  }
  // 城市到达检测
  onCityArrive();
  // 城市剧情
  checkCityStep();
  updateHUD();
}
function encChance(t){
  const base=T[t]?T[t].enc:0;
  let c=base;
  if(Time.isNight())c+=0.06;
  if(S.weather==='沙尘')c+=0.04;
  if(S.mode==='free'&&S.storyDone)c+=0.02;
  return Math.min(.55,c);
}
let lastCity=null;
function onCityArrive(){
  for(const c of CITIES){
    if(dist(S.x,S.y,c.fx,c.fy)<13){
      if(!S.known.cities)S.known.cities={};
      if(!S.known.cities[c.id]){
        S.known.cities[c.id]=1;
        log('🏙️ 抵达 '+c.name+'（'+c.type+'）','imp');
        journal('抵达 '+c.name+'：'+c.desc);
        checkAch();
      }
      CITY_AT={id:c.id,name:c.name};
      if(lastCity!==c.id){lastCity=c.id;checkCityStep();}
      return;
    }
  }
  lastCity=null;
}

        if(S.flags['side_deliver_'+q.id]){delete S.flags['side_deliver_'+q.id];sideGive(q.id);}

}

  const sellable=S.inv.filter(i=>buyable.has(i.id)&&ITEMS[i.id].price>0);
  if(!sellable.length)h+='<div style="color:var(--dim2);font-size:12px;">（店里不收这些货）</div>';

    if(S.money<p){toast('💰 钱不够');return;}
    if(!canCarry(iid)){toast('🎒 背不动了');return;}
    S.money-=p;invAdd(iid,1,true);S.trades++;

  });
  modal.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{
    const iid=b.dataset.sell,v=+b.dataset.v;
    invRemove(iid,1);S.money+=v;S.trades++;

    openShop(type,keeper);
  });

const Combat={
 enemy:null,defending:false,
 start(e){
   S.encounters++;
   this.enemy=e;this.defending=false;
   document.getElementById('cbIcon').textContent=e.icon;
   document.getElementById('cbName').textContent=e.name;
   document.getElementById('cbDesc').textContent=e.desc+'（'+(e.money?('战利品约 '+e.money+'¥'):'无钱财')+'）';
   this.update();
   document.getElementById('combatBox').classList.remove('hidden');
   document.getElementById('cbLog').innerHTML='';
   this.cl('⚔ 遭遇：'+e.name);
   flash();
 },
 update(){
   const e=this.enemy;
   document.getElementById('cbHp').style.width=(e.hp/e.maxHp*100)+'%';
   document.getElementById('cbMyHp').textContent=Math.round(S.hp);
   document.getElementById('cbMySt').textContent=Math.round(S.st);
   const wep=S.equip.weapon?ITEMS[S.equip.weapon]:null;
   document.getElementById('cbAmmo').textContent=S.ammo+(wep&&wep.gun?'（'+ITEMS[S.equip.weapon].name+'）':'（徒手）');
 },
 cl(t){const el=document.getElementById('cbLog');const d=document.createElement('div');d.textContent=t;el.appendChild(d);el.scrollTop=el.scrollHeight;},
 act(a){
   const e=this.enemy; if(!e)return;
   const wep=S.equip.weapon?ITEMS[S.equip.weapon]:null;
   const armor=S.equip.armor?ITEMS[S.equip.armor]:null;
   if(a==='attack'){
     if(wep&&wep.gun){
       if(S.ammo<=0){this.cl('🔫 没子弹了！只能近身格斗。');this.enemyTurn(0);return;}
       S.ammo--;
     }
     const dmg=wep?wep.dmg:4;
     const hit=0.62+Math.random()*0.25+(wep&&wep.long?.08:0);
     if(Math.random()<hit){
       const dealt=Math.round(dmg*(0.8+Math.random()*0.5)*(wep&&wep.gun?1.2:1));
       e.hp-=dealt;
       this.cl('💥 命中！造成 '+dealt+' 点伤害'+(wep?'（'+wep.name+'）':''));
       if(e.hp<=0){this.win();return;}
     }else this.cl('💨 没打中！');
     S.st=Math.max(0,S.st-(wep&&wep.melee?8:4));
   }else if(a==='defend'){
     this.defending=true;
     this.cl('🛡 摆出防御姿态。');
   }else if(a==='item'){
     this.useItem();
     return;
   }else if(a==='flee'){
     if(Math.random()<0.55+S.st/220){
       this.cl('🏃 你甩掉敌人，跑了出去。');
       S.st=Math.max(0,S.st-15);
       this.end(false);
       return;
     }else this.cl('😰 没跑掉！');
   }
   this.enemyTurn(a==='defend'?1:0);
 },
 enemyTurn(def){
   const e=this.enemy;
   const hit=def?0.34:0.62;
   if(Math.random()<hit){
     const dmg=Math.round(e.dmg*(def?0.35:1)*(0.85+Math.random()*0.3));
     S.hp-=dmg;
     this.cl('🩸 敌方造成 '+dmg+' 点伤害！');
     if(S.hp<=0){this.die();return;}
   }else this.cl('🛡 你躲开了攻击！');
   this.defending=false;
   this.update();
 },
 useItem(){
   const box=mkModal('combatitem');
   box.head('💊 使用道具');
   const usable=['w_bandage','w_medkit','w_antibiotic','w_painkiller','w_stim','w_antidote'];
   let h='';
   for(const iid of usable){
     const n=invCount(iid);
     if(!n)continue;
     h+=`<div class="shop-row"><span style="flex:1;">${ITEMS[iid].name} ×${n}</span><button class="sbtn" data-use="${iid}">使用</button></div>`;

     const iid=b.dataset.use;invRemove(iid,1);
     const it=ITEMS[iid];
     if(it.heal)S.hp=clamp(S.hp+it.heal,0,100);
     if(it.sanity)S.sanity=clamp(S.sanity+it.sanity,0,100);
     if(iid==='w_stim'){S.hp=clamp(S.hp+20,0,100);S.st=clamp(S.st+30,0,100);}
     Combat.cl('💊 使用了 '+it.name);
     UI.close();Combat.update();Combat.enemyTurn(0);
   });
 },
 win(){
   const e=this.enemy;
   S.kills++;
   if(e.money){S.money+=e.money;this.cl('💰 缴获 '+e.money+' 第纳尔');}
   const loot=e.items.filter(()=>Math.random()<.5);
   for(const it of loot){invAdd(it,1,true);this.cl('🎒 拾获 '+ITEMS[it].name);}
   if(e.kind&&e.kind.startsWith('patrol')){
     const fid=e.rep;
     if(fid){S.rep[fid]=clamp((S.rep[fid]||0)-18,-100,100);factionTierUpdate(fid);
       this.cl('⚠️ 你攻击了'+F[fid].name+'的部队，与该势力交恶。');}
   }
   if(e.kind==='wolf')S.flags.kill_wolf=(S.flags.kill_wolf||0)+1;
   if(e.kind==='bandit'||e.kind==='outlaw')S.flags.kill_bandit=(S.flags.kill_bandit||0)+1;
   checkAch();
   this.end(true);
 },
 die(){
   S.hp=25;S.sanity=clamp(S.sanity-18,0,100);
   const lost=Math.round(S.money*0.2);
   S.money-=lost;
   ach('died');
   log('💀 你被击倒了……挣扎着爬回安全地带，丢了 '+lost+' 第纳尔。','bad');
   journal('在一次遭遇战中倒下，损失惨重');
   // 传送回最近城市
   let bc=null,bd=1e9;
   for(const c of CITIES){const d=dist(S.x,S.y,c.fx,c.fy);if(d<bd){bd=d;bc=c;}}
   if(bc){S.x=bc.fx+rnd(-3,3);S.y=bc.fy+rnd(-3,3);log('🏥 你在 '+bc.name+' 醒了过来。','dim');}
   this.end(true);
   flash();
 },
 end(win){
   document.getElementById('combatBox').classList.add('hidden');

 }

function useItem(id){
  const it=ITEMS[id];if(!it)return;
  if(it.food||it.water){
    if(it.food)S.hunger=clamp(S.hunger+it.food,0,100);
    if(it.water)S.thirst=clamp(S.thirst+it.water,0,100);
    if(it.heal)S.hp=clamp(S.hp+it.heal,0,100);
    if(it.sanity)S.sanity=clamp(S.sanity+it.sanity,0,100);
    invRemove(id,1);
    log('🍽 吃了 '+it.name+'，饥饿+'+ (it.food||0)+' 口渴+'+(it.water||0),'ok');
  }else if(it.use){
    invRemove(id,1);
    if(it.use==='heal'||id==='w_bandage'||id==='w_medkit'||id==='w_antibiotic'){
      S.hp=clamp(S.hp+(it.heal||0),0,100);
      log('💊 使用 '+it.name+'，生命 +'+it.heal,'ok');
    }else if(it.use==='sanity'){
      S.sanity=clamp(S.sanity+(it.sanity||0),0,100);
      log('🧘 使用 '+it.name+'，精神 +'+it.sanity,'ok');
    }else if(it.use==='stim'){
      S.hp=clamp(S.hp+20,0,100);S.st=clamp(S.st+30,0,100);
      log('⚡ 使用 '+it.name+'，体力与生命回升。','ok');
    }else if(it.use==='radio'){
      S.sanity=clamp(S.sanity+2,0,100);
      log('📻 收音机里传来一首五次战争前的旧歌。','dim');
    }else if(it.use==='purify'){
      S.thirst=clamp(S.thirst+15,0,100);
      log('💧 净水片化开一杯浑水，喝了下去。','ok');
    }else if(it.use==='camp'){
      log('🏕 帐篷支起来了——野外过夜更安全了。','ok');
    }else if(it.use==='map'){
      log('🗺 军用地图上标注了旧哨站。你记下了几个坐标。','dim');
    }else if(it.use==='compass'){
      log('🧭 你确认了方位：正前方是'+ (S.x<100?'西方':'东方')+'的沙海。','dim');
    }else if(it.use==='book'){
      S.sanity=clamp(S.sanity+3,0,100);
      log('📖 手册上写着：沙暴前，骆驼会先跪下。','dim');
    }else if(it.use==='camera'){
      journal('你用相机记录下这一刻的'+(CITY_AT?CITY_AT.name:'沙漠')+'。');
      log('📷 快门按下，这一刻被留了下来。','dim');
    }else if(it.use==='binoculars'||it.use==='scout'){
      log('🔭 你举目远望，远方沙丘上没有可疑的影子。','dim');
    }else if(it.use==='night'){
      log('🔦 夜视仪把黑夜变成灰绿色的白昼。','dim');
    }else if(it.use==='lock'){
      log('🔓 开锁器在手里转了个圈——可惜没找到值得撬的锁。','dim');
    }else if(it.use==='dig'){
      log('⛏ 你随便挖了两下，除了沙子还是沙子。','dim');
    }else{
      log('使用 '+it.name+'。','dim');
    }
  }else{
    log(it.name+'：暂不能用。','dim');
  }
  updateHUD();
}
/* ================= 渲染 ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');
let miniReady=false;
let camX=0,camY=0;
const BUILD_ICON={market:'市',inn:'宿',tavern:'茶',board:'任',clinic:'医',gun:'械',black:'黑',trade:'商'};
function buildMini(){
  mctx.fillStyle='#b0985f';mctx.fillRect(0,0,196,196);
  for(let y=0;y<CFG.H;y++)for(let x=0;x<CFG.W;x++){
    const t=G.tiles[y*CFG.W+x];
    mctx.fillStyle=T[t].c;
    mctx.fillRect(x,y,1,1);
  }
  for(const c of CITIES){
    mctx.fillStyle=c.f==='none'?'#f4ecd8':F[c.f].color;
    mctx.beginPath();mctx.arc(c.fx,c.fy,c.big?2.2:1.4,0,Math.PI*2);mctx.fill();
  }
  miniReady=true;
}
function drawBigMap(m){
  // 大地图：200×200 瓦片按 1px 离屏绘制后平滑放大
  const off=document.createElement('canvas');
  off.width=CFG.W;off.height=CFG.H;
  const octx=off.getContext('2d');
  for(let y=0;y<CFG.H;y++)for(let x=0;x<CFG.W;x++){
    const t=G.tiles[y*CFG.W+x];
    octx.fillStyle=T[t].c;
    octx.fillRect(x,y,1,1);
  }
  for(const c of CITIES){
    octx.fillStyle=c.f==='none'?'#f4ecd8':F[c.f].color;
    octx.beginPath();octx.arc(c.fx,c.fy,c.big?2.2:1.4,0,Math.PI*2);octx.fill();
  }
  const mctx=m.getContext('2d');
  mctx.imageSmoothingEnabled=false;
  mctx.drawImage(off,0,0,m.width,m.height);
  mctx.fillStyle='#ffffff';
  mctx.beginPath();mctx.arc(S.x/CFG.W*m.width,S.y/CFG.H*m.height,3.5,0,Math.PI*2);mctx.fill();
}
function resize(){
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=window.innerWidth*dpr;cv.height=window.innerHeight*dpr;
  cv.style.width=window.innerWidth+'px';cv.style.height=window.innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  const W=window.innerWidth,Hh=window.innerHeight;
  const px=S.x*CFG.TILE,py=S.y*CFG.TILE;
  camX+=(px-camX)*0.12;camY+=(py-camY)*0.12;
  const ox=W/2-camX,oy=Hh/2-camY;
  ctx.fillStyle='#b0985f';ctx.fillRect(0,0,W,Hh);
  const x0=Math.max(0,Math.floor((0-ox)/CFG.TILE)),x1=Math.min(CFG.W-1,Math.ceil((W-ox)/CFG.TILE));
  const y0=Math.max(0,Math.floor((0-oy)/CFG.TILE)),y1=Math.min(CFG.H-1,Math.ceil((Hh-oy)/CFG.TILE));
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const t=G.tiles[y*CFG.W+x];
      ctx.fillStyle=T[t].c;
      ctx.fillRect(x*CFG.TILE+ox,y*CFG.TILE+oy,CFG.TILE+0.5,CFG.TILE+0.5);
      if(t===4){ // 城区纹理
        ctx.fillStyle='rgba(255,255,255,.05)';
        ctx.fillRect(x*CFG.TILE+ox+6,y*CFG.TILE+oy+6,8,8);
      }
    }
  }
  // 建筑
  for(const b of G.buildings){
    const sx=b.x*CFG.TILE+ox,sy=b.y*CFG.TILE+oy;
    if(sx<-40||sy<-40||sx>W+40||sy>Hh+40)continue;
    const st=SHOPDEF[b.type];
    ctx.fillStyle=st?st.night?'#2c2a3d':'#4a4450':'#6a6458';
    ctx.fillRect(sx+3,sy+3,CFG.TILE-6,CFG.TILE-6);
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeRect(sx+3,sy+3,CFG.TILE-6,CFG.TILE-6);
    ctx.fillStyle='#f0ead8';
    ctx.font='13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(BUILD_ICON[b.type]||'?',sx+CFG.TILE/2,sy+CFG.TILE/2+1);
  }
  // 剧情标记（★）
  const st=pendingStep();
  if(st&&st.type==='talk'){
    const n=NPCI[st.npc];
    if(n){
      const sx=n.x*CFG.TILE+ox,sy=n.y*CFG.TILE+oy;
      if(sx>-40&&sy>-40&&sx<W+40&&sy<Hh+40){
        const bob=Math.sin(Date.now()/300)*4;
        ctx.fillStyle='#e8c75a';ctx.font='18px sans-serif';
        ctx.fillText('★',sx+CFG.TILE/2,sy-8+bob);
      }
    }
  }
  if(st&&st.type==='city'){
    const c=CITY[st.city];
    const sx=c.fx*CFG.TILE+ox,sy=c.fy*CFG.TILE+oy;
    if(sx>-60&&sy>-60&&sx<W+60&&sy<Hh+60){
      ctx.strokeStyle='#e8c75a';ctx.lineWidth=2;
      ctx.strokeRect(sx-14,sy-14,CFG.TILE+28,CFG.TILE+28);
      ctx.fillStyle='#e8c75a';ctx.font='14px sans-serif';
      ctx.fillText('目的地：'+c.name,sx-14,sy-22);
    }
  }
  // NPC
  for(const n of NPC){
    const sx=n.x*CFG.TILE+ox,sy=n.y*CFG.TILE+oy;
    if(sx<-30||sy<-30||sx>W+30||sy>Hh+30)continue;
    ctx.beginPath();ctx.arc(sx+CFG.TILE/2,sy+CFG.TILE/2,8,0,Math.PI*2);
    ctx.fillStyle=(F[n.faction]?F[n.faction].color:'#aab');
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();
    const hero=STORY_NPCS[n.id]||n.shop;
    if(hero&&st&&st.type==='talk'&&st.npc===n.id){
      ctx.fillStyle='#e8c75a';ctx.font='11px sans-serif';
      ctx.fillText(n.name,sx+CFG.TILE/2,sy+18);
    }
  }
  // 玩家
  const pxs=S.x*CFG.TILE+ox,pys=S.y*CFG.TILE+oy;
  ctx.fillStyle='#f0c040';
  ctx.beginPath();ctx.arc(pxs+CFG.TILE/2,pys+CFG.TILE/2,11,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#7a5a1e';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff8e0';ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText(S.name.charAt(0),pxs+CFG.TILE/2,pys+CFG.TILE/2+4);
  // 日夜
  const night=Time.isNight();
  const alpha=night?0.32:0;
  ctx.fillStyle='rgba(8,10,26,'+alpha+')';ctx.fillRect(0,0,W,Hh);
  // 沙暴粒子
  if(sandstorm){
    ctx.fillStyle='rgba(216,190,120,.16)';
    for(let i=0;i<26;i++){
      const px2=((i*173+Date.now()/40)%(W+200))-100;
      const py2=((i*97+Date.now()/60)%(Hh+200))-100;
      ctx.fillRect(px2,py2,60,2);
    }
    ctx.fillStyle='rgba(216,190,120,.12)';ctx.fillRect(0,0,W,Hh);
  }
  // 小地图
  if(miniReady){
    mctx.clearRect(0,0,196,196);
    mctx.drawImage(miniBack(),0,0);
    mctx.fillStyle='#fff';
    mctx.beginPath();mctx.arc(S.x/CFG.W*196,S.y/CFG.H*196,2.4,0,Math.PI*2);mctx.fill();
    mctx.strokeStyle='#fff';mctx.stroke();
  }
}
let miniBackCache=null;
function miniBack(){
  if(!miniBackCache){
    miniBackCache=document.createElement('canvas');
    miniBackCache.width=196;miniBackCache.height=196;
    const c=miniBackCache.getContext('2d');
    c.fillStyle='#b0985f';c.fillRect(0,0,196,196);
    for(let y=0;y<CFG.H;y++)for(let x=0;x<CFG.W;x++){
      c.fillStyle=T[G.tiles[y*CFG.W+x]].c;c.fillRect(x,y,1,1);
    }
    for(const cty of CITIES){
      c.fillStyle=cty.f==='none'?'#f4ecd8':F[cty.f].color;
      c.beginPath();c.arc(cty.fx,cty.fy,cty.big?2.2:1.4,0,Math.PI*2);c.fill();
    }
  }
  return miniBackCache;
}

/* ================= 生存衰减 ================= */
function survivalTick(dt){
  const min=dt/1000*TIME_SCALE;
  const hot=S.weather==='热浪'&&!Time.isNight();
  S.hunger=Math.max(0,S.hunger-min*(0.026+(S.st<20?0.012:0)));
  S.thirst=Math.max(0,S.thirst-min*(0.042+(hot?0.03:0)+(sandstorm?0.008:0)));
  let sd=0;
  const t=G.tiles[S.y*CFG.W+S.x];
  if(t===7||t===8)sd+=0.010;
  if(sandstorm)sd+=0.012;
  if(Time.isNight()&&(t===0||t===7))sd+=0.006;
  if(S.mode==='free'&&sd<0.004)sd=0.004; // 自由模式保持一点压力
  S.sanity=Math.max(0,S.sanity-min*sd);
  // 再生与伤害
  if(S.hunger>60&&S.thirst>60&&S.st>25)S.hp=Math.min(100,S.hp+min*0.006);
  if(S.hunger<30)S.hp-=min*0.004;
  if(S.hunger<12)S.hp-=min*0.010;
  if(S.thirst<25)S.hp-=min*0.006;
  if(S.thirst<8)S.hp-=min*0.014;
  if(S.hp<=0){S.hp=5;log('🩸 你虚弱地跪倒在沙地上……好在活了下来。','bad');}
  if(S.st<100)S.st=Math.min(100,S.st+min*0.010);
  // 沙暴视线
  if(sandstorm&&!MOVE_TO&&!Time.isNight()){}
}
/* ================= 输入 ================= */
const keys={};
document.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  const k=e.key.toLowerCase();
  if(k==='escape'){if(UI.stack.length){UI.close();}else{UI.open('menu');}e.preventDefault();return;}
  if(blocked())return;
  const map={i:'inv',j:'quest',m:'map',f:'faction',l:'journal',s:'save'};
  if(map[k]){UI.open(map[k]);e.preventDefault();return;}
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys[k]=true;}
  if(k==='e'||k===' '){doInteract();e.preventDefault();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
cv.addEventListener('click',e=>{
  if(!S||blocked())return;
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const wx=Math.floor((mx-W/2+camX)/CFG.TILE),wy=Math.floor((my-H/2+camY)/CFG.TILE);
  if(wx>=0&&wy>=0&&wx<CFG.W&&wy<CFG.H)MOVE_TO={x:wx,y:wy};
});
function doInteract(){
  // 剧情目标 NPC（头顶★）优先：当前剧情步骤指定的对象在 4 格内直接对话
  const st=pendingStep();
  if(st&&st.type==='talk'){
    const tN=NPC.find(n=>n.id===st.npc);
    if(tN&&dist(tN.x,tN.y,S.x,S.y)<=4){onInteractNPC(tN);return;}
  }
  // 2 格半径内找 NPC / 建筑（就近优先）
  let best=null,bd=99;
  for(const n of NPC){
    const d=Math.abs(n.x-S.x)+Math.abs(n.y-S.y);
    if(d<=2&&d<bd){bd=d;best=n;}
  }
  if(best){onInteractNPC(best);return;}
  best=null;bd=99;
  for(const b of G.buildings){
    const d=Math.abs(b.x-S.x)+Math.abs(b.y-S.y);
    if(d<=2&&d<bd){bd=d;best=b;}
  }
  if(best){onInteractBuilding(best);return;}
  toast('这里什么都没有——去城里找 NPC 或建筑吧。');
}
function blocked(){return !!UI.stack.length||!!DLG_CUR||!S||!document.getElementById('storyScreen').classList.contains('hidden');}
function moveStep(dt){
  if(!MOVE_TO)return;
  const speed=(S.equip.mount?ITEMS[S.equip.mount].mount||1:1)*(sandstorm?0.7:1);
  const stepTimer=140/speed;
  MOVE_TICK=(MOVE_TICK||0)+dt;
  if(MOVE_TICK<stepTimer)return;
  MOVE_TICK-=stepTimer;
  const dx=Math.sign(MOVE_TO.x-S.x),dy=Math.sign(MOVE_TO.y-S.y);
  if(!dx&&!dy){MOVE_TO=null;return;}
  const cand=[[dx,dy],[dx,0],[0,dy],[-dx,dy],[dx,-dy]];
  for(const[cx,cy]of cand){
    const nx=S.x+cx,ny=S.y+cy;
    if(nx<0||ny<0||nx>=CFG.W||ny>=CFG.H)continue;
    const t=G.tiles[ny*CFG.W+nx];
    if(t===6||t===10||t===13)continue;
    movePlayer(cx,cy);
    return;
  }
  MOVE_TO=null;
}
let MOVE_TICK=0;
/* ================= 剧情过场界面 ================= */

  document.getElementById('storyChap').textContent=o.chap||'章节';
  document.getElementById('storyTitle').textContent=o.title||'';
