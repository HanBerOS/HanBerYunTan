    else{log('📖 剧情推进。悬念已埋下——下期更新见。','story');}
  };
}
/* ================= 存档 ================= */
function saveData(){return {ver:1,S,Time:{day:Time.day,hour:Time.hour,min:Time.min},seed:G.seed};}
function loadData(d){
  S=d.S;Time.day=d.Time.day;Time.hour=d.Time.hour;Time.min=d.Time.min;
  const seed=d.seed||1013;
  genWorld(seed);
  NPC=[];NPCI={};
  placeStoryNPCs();genResidents();assignShopkeepers();
  updateHUD();
}
function slotKey(i){return CFG.SAVE_KEY+'_'+i;}
function loadSlotRaw(i){
  try{const d=JSON.parse(localStorage.getItem(slotKey(i)));if(!d||!d.S)return null;return {name:d.S.name,day:d.Time.day,mode:d.S.mode,chapter:d.S.chapter,frozen:false};}
  catch(e){return null;}
}
function saveSlot(i){
  if(!S)return;
  localStorage.setItem(slotKey(i),JSON.stringify(saveData()));
  toast('💾 已存入存档 '+(i+1));
  journal('存档至档位'+(i+1));
}
function loadSlot(i){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(i)));
    if(!d||!d.S)return false;
    loadData(d);
    return true;
  }catch(e){toast('读档失败：数据损坏');return false;}
}
function autosave(){
  if(!S)return;
  localStorage.setItem(CFG.AUTO,JSON.stringify(saveData()));
}
function loadAuto(){
  try{
    const d=JSON.parse(localStorage.getItem(CFG.AUTO));
    if(d&&d.S){loadData(d);return true;}
  }catch(e){}
  return false;
}
function exportSave(){
  if(!S)return;
  const str=encodeURIComponent(JSON.stringify(saveData()));
  const code=btoa(str);
  const el=document.getElementById('expText');
  if(el){el.value=code;el.select();}
  toast('存档码已生成，复制保存即可迁移。');
}
function importSave(){
  const el=document.getElementById('expText');
  if(!el||!el.value.trim()){toast('请先粘贴存档码');return;}
  try{
    const d=JSON.parse(decodeURIComponent(atob(el.value.trim())));
    if(!d||!d.S)throw 0;
    loadData(d);
    UI.closeAll();enterGame();
    toast('✅ 导入成功');
  }catch(e){toast('存档码无效');}
}
function wipeSave(){
  for(let i=0;i<3;i++)localStorage.removeItem(slotKey(i));
  localStorage.removeItem(CFG.AUTO);
  toast('已清空全部本地存档');
  UI.open('save');
}
function quitToTitle(){
  autosave();
  UI.closeAll();
  document.getElementById('titleScreen').classList.remove('hidden');
}
/* ================= 标题与创建角色 ================= */
const BGS={
 sham:{name:'沙姆青年',desc:'生在秩序严明的沙姆京，懂规矩，也懂机灵。',icon:'🪖',city:'shamjing',money:260,items:{w_can:2},rep:{sham:25}},
 eden:{name:'伊甸流亡者',desc:'高墙里的流亡者后代，对旧邦满怀乡愁。',icon:'🕊️',city:'amara',money:150,items:{w_bread:3},rep:{eden:20}},
 trib:{name:'部族向导',desc:'阿卡沙长大的沙漠之眼，熟稔每条商路。',icon:'🐫',city:'aksha',money:200,items:{w_dates:4,w_compass:1},rep:{trib:20}},
 merc:{name:'退役佣兵',desc:'自由港混过刀口的日子，手里有枪，心里有数。',icon:'🔫',city:'freeport',money:400,items:{w_pistol:1,w_ammo:2},rep:{merc:15}},
 journal:{name:'战地记者',desc:'揣着相机和收音机的新月城记者，嗅得到新闻也闻得到危险。',icon:'📷',city:'crescent',money:350,items:{w_camera:1,w_radio:1},rep:{}}};
function newGame(mode,bg){
  S=newState();
  S.name=document.getElementById('nameInput').value.trim()||'旅人';
  S.mode=mode;S.bg=bg;
  const b=BGS[bg];
  S.money=b.money;
  S.x=CITY[b.city].fx;S.y=CITY[b.city].fy;
  for(const id in b.items)invAdd(id,b.items[id],true);
  for(const f in b.rep)S.rep[f]=b.rep[f];
  S.flags.start_city=b.city;
  CITY_AT={id:b.city,name:CITY[b.city].name};
  journal('我在'+CITY[b.city].name+'醒来，开始了这段旅途。');
  log('🏜️ 欢迎来到反转世界。你从 '+CITY[b.city].name+' 出发。','imp');
  updateHUD();
  if(mode==='main'){
    startChapter(1);
  }else{
    toast('自由模式：唯一目标，活下去。');
    journal('自由模式：没有剧本，没有终点，只有生存。');
  }
}
function enterGame(){
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('game').style.display='';
  updateHUD();
}
function boot(){
  resize();window.addEventListener('resize',resize);
  const seed=rnd(1,99999);
  genWorld(seed);
  placeStoryNPCs();genResidents();assignShopkeepers();
  initSideQuests();
  buildMini();
  // 标题按钮
  document.getElementById('btnNew').onclick=()=>{
    const box=mkModal('char');
    box.head('🧭 创建角色');
    let h='<div style="margin-bottom:8px;">你的名字：<input type="text" id="nameInput" maxlength="8" placeholder="输入名字" style="width:160px;"></div>';
    h+='<div style="font-size:12px;color:var(--dim);margin-bottom:6px;">选择出身（影响初始城市、资金与势力好感）：</div><div class="grid2">';
    for(const id in BGS){
      const b=BGS[id];
      h+=`<div class="itemCard" data-bg="${id}" style="text-align:left;"><div class="iname">${b.icon} ${b.name}</div><div class="idesc">${b.desc}</div><div class="imeta gray">起步 ${b.money}¥ · ${CITY[b.city].name}</div></div>`;
    }
    h+='</div>';
    box.body(h);
    box.foot(`<button class="btn primary" id="btnMain">主线模式 · 踏入命运</button>
      <button class="btn" id="btnFree">自由模式 · 活下去</button>
      <button class="btn" onclick="UI.close()">取消</button>`);
    let sel='trib';
    box.el.querySelectorAll('[data-bg]').forEach(el=>{
      el.onclick=()=>{
        box.el.querySelectorAll('[data-bg]').forEach(x=>x.style.outline='');
        el.style.outline='2px solid var(--gold)';
        sel=el.dataset.bg;
      };
    });
    box.el.querySelector('[data-bg="trib"]').style.outline='2px solid var(--gold)';
    box.el.querySelector('#btnMain').onclick=()=>{newGame('main',sel);UI.closeAll();enterGame();};
    box.el.querySelector('#btnFree').onclick=()=>{newGame('free',sel);UI.closeAll();enterGame();UI.open('help');};
  };
  document.getElementById('btnFree2').onclick=()=>{
    const box=mkModal('char');
    box.head('🧭 创建角色（自由模式）');
    let h='<div style="margin-bottom:8px;">你的名字：<input type="text" id="nameInput" maxlength="8" placeholder="输入名字" style="width:160px;"></div>';
    h+='<div class="grid2">';
    for(const id in BGS){
      const b=BGS[id];
      h+=`<div class="itemCard" data-bg="${id}" style="text-align:left;"><div class="iname">${b.icon} ${b.name}</div><div class="idesc">${b.desc}</div><div class="imeta gray">起步 ${b.money}¥ · ${CITY[b.city].name}</div></div>`;
    }
    h+='</div>';
    box.body(h);
    box.foot(`<button class="btn primary" id="btnGo">进入沙海</button><button class="btn" onclick="UI.close()">取消</button>`);
    let sel='trib';
    box.el.querySelectorAll('[data-bg]').forEach(el=>{
      el.onclick=()=>{box.el.querySelectorAll('[data-bg]').forEach(x=>x.style.outline='');el.style.outline='2px solid var(--gold)';sel=el.dataset.bg;};
    });
    box.el.querySelector('[data-bg="trib"]').style.outline='2px solid var(--gold)';
    box.el.querySelector('#btnGo').onclick=()=>{newGame('free',sel);UI.closeAll();enterGame();};
  };
  document.getElementById('btnContinue').onclick=()=>{
    if(loadAuto()){enterGame();toast('✅ 已载入自动存档');}
    else toast('没有找到存档');
  };
  document.getElementById('btnLoad').onclick=()=>{UI.open('save');};
  document.getElementById('btnHelp').onclick=()=>{UI.open('help');};
  document.getElementById('btnAbout').onclick=()=>{UI.open('about');};
  // 主循环
  let last=performance.now();
  function loop(now){
    const dt=Math.min(100,now-last);last=now;
    if(!blocked()){
      Time.tick(dt);
      survivalTick(dt);
      // 键盘移动
      if(keys['w']||keys['arrowup']){movePlayer(0,-1);MOVE_TO=null;}
      else if(keys['s']||keys['arrowdown']){movePlayer(0,1);MOVE_TO=null;}
      else if(keys['a']||keys['arrowleft']){movePlayer(-1,0);MOVE_TO=null;}
      else if(keys['d']||keys['arrowright']){movePlayer(1,0);MOVE_TO=null;}
      else moveStep(dt);
      // NPC 微动
      if(Math.random()<0.02)npcWander();
    }
    if(S)updateHUD();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
let npcWanderT=0;
function npcWander(){
  if(!S)return;
  const near=NPC.filter(n=>dist(n.x,n.y,S.x,S.y)<16&&n.awake[0]<=Time.hour&&Time.hour<=n.awake[1]&&!STORY_NPCS[n.id]);
  if(!near.length)return;
  const n=pick(near);
  const c=CITY[n.city];
  const r=rnd(-1,1),rr=rnd(-1,1);
  const nx=clamp(n.x+r,0,CFG.W-1),ny=clamp(n.y+rr,0,CFG.H-1);
  const t=G.tiles[ny*CFG.W+nx];
  if(t===6||t===10||t===13)return;
  if(dist(nx,ny,c.fx,c.fy)>10)return;
  n.x=nx;n.y=ny;
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
