<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>铁甲战史 2D · 四战役战争游戏</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ============ 基础与令牌 ============ */
:root{
  --bg:#101418; --panel:#1A2026; --panel2:#14181D; --line:#2A323A;
  --text:#E8E2D4; --dim:#9AA3AB; --accent:#3E7CBF;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; user-select:none; -webkit-user-select:none;}
body[data-era="nap"]{--accent:#3E7CBF;}
body[data-era="ww1"]{--accent:#8A7A3E;}
body[data-era="oct"]{--accent:#B0452E;}
body[data-era="ww2"]{--accent:#4A7A4A;}

#game{position:fixed; inset:0; display:block; touch-action:none;}

/* ============ 界面层 ============ */
#ui{position:fixed; inset:0; pointer-events:none; z-index:10;}
.screen{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto; padding:20px;}
.screen.active{display:flex;}

.panel{background:rgba(16,20,24,0.92); border:1px solid var(--line); border-left:4px solid var(--accent);
  padding:26px 30px; max-width:760px; width:100%; max-height:92vh; overflow:auto;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);}
.panel h1{font-family:'Noto Serif SC',serif; font-weight:900; font-size:34px; letter-spacing:6px; color:var(--text);}
.panel h1 .ac{color:var(--accent);}
.panel .sub{color:var(--dim); font-size:13px; letter-spacing:2px; margin-top:6px;}
.panel h2{font-family:'Noto Serif SC',serif; font-weight:700; font-size:20px; letter-spacing:3px; margin-bottom:12px; color:var(--text);}
.panel h3{font-size:14px; font-weight:700; letter-spacing:2px; margin-bottom:8px; color:var(--text);}
.panel p.desc{font-size:13px; color:var(--dim); line-height:1.8; margin-bottom:14px;}

.btn{display:block; width:100%; padding:14px 16px; margin-top:12px; background:var(--panel2); color:var(--text);
  border:1px solid var(--line); border-left:4px solid var(--accent); font-size:15px; font-weight:700; letter-spacing:3px;
  cursor:pointer; font-family:inherit; text-align:left; transition:background .12s, border-color .12s;}
.btn:hover{background:var(--accent); border-left-color:var(--text);}
.btn.small{width:auto; display:inline-block; padding:9px 18px; margin-top:0; font-size:13px; letter-spacing:2px;}
.btnrow{display:flex; gap:12px; flex-wrap:wrap; margin-top:14px;}
.btnrow .btn{margin-top:0; flex:1 1 150px; text-align:center;}
.btn.danger{border-left-color:#C0504D;} .btn.danger:hover{background:#C0504D;}
.btn.ghost{opacity:.85;} .btn.ghost:hover{opacity:1; background:#2A323A;}

/* 战役卡片 */
.cards{display:flex; flex-wrap:wrap; gap:14px; margin-top:6px;}
.card{flex:1 1 44%; min-width:240px; padding:18px; background:var(--panel2); border:1px solid var(--line);
  border-top:4px solid var(--accent); cursor:pointer; transition:background .12s;}
.card:hover{background:var(--panel);}
.card .cn{font-family:'Noto Serif SC',serif; font-weight:700; font-size:19px; letter-spacing:2px;}
.card .cy{font-size:12px; color:var(--dim); margin-top:4px; letter-spacing:1px;}
.card .prog{margin-top:12px; font-size:12px; color:var(--dim);}
.card .bar{height:6px; background:#0C0F12; margin-top:6px; border:1px solid var(--line);}
.card .bar i{display:block; height:100%; background:var(--accent);}

/* 任务列表 */
.mlist{display:flex; flex-direction:column; gap:12px;}
.mitem{padding:14px 16px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; transition:background .12s;}
.mitem:hover{background:var(--panel);}
.mitem .mn{font-size:15px; font-weight:700; letter-spacing:1px;}
.mitem .mb{font-size:12px; color:var(--dim); margin-top:4px; line-height:1.6;}
.mitem.locked{opacity:.45; cursor:not-allowed;}
.mitem .tag{display:inline-block; font-size:11px; padding:2px 8px; margin-right:6px; border:1px solid var(--line); color:var(--dim);}

/* 载具选择（自由模式） */
.vlist{display:flex; flex-wrap:wrap; gap:12px;}
.vcard{flex:1 1 30%; min-width:180px; padding:14px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; transition:background .12s;}
.vcard:hover{background:var(--panel);}
.vcard.sel{border-color:var(--accent); border-left-width:4px;}
.vcard .vn{font-size:14px; font-weight:700; letter-spacing:1px;}
.vcard .vs{font-size:12px; color:var(--dim); margin-top:4px; line-height:1.7;}
.tabs{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.tab{padding:8px 16px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px; letter-spacing:2px; color:var(--dim);}
.tab.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
.opt{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.opt .obox{flex:1 1 130px; padding:10px 12px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; font-size:13px; text-align:center; color:var(--dim);}
.opt .obox.sel{background:var(--accent); color:#fff; border-color:var(--accent);}

/* 战斗 HUD */
#hud{position:absolute; inset:0; display:none; pointer-events:none;}
#hud.active{display:block;}
#hud .hpwrap{position:absolute; left:18px; top:14px; width:280px; max-width:40vw;}
#hud .hpname{font-size:12px; letter-spacing:2px; color:var(--dim); margin-bottom:4px;}
#hud .hpbar{height:14px; background:#0C0F12; border:1px solid var(--line);}
#hud .hpbar i{display:block; height:100%; background:var(--accent); transition:width .1s;}
#hud .reload{margin-top:6px; height:6px; background:#0C0F12; border:1px solid var(--line);}
#hud .reload i{display:block; height:100%; background:#E8E2D4; width:0%;}
#hud .obj{position:absolute; top:14px; left:50%; transform:translateX(-50%); text-align:center;}
#hud .obj .ot{font-size:13px; letter-spacing:2px; color:var(--text); background:rgba(16,20,24,.75); padding:6px 14px; border:1px solid var(--line); display:inline-block;}
#hud .obj .os{font-size:11px; color:var(--dim); margin-top:4px; letter-spacing:1px;}
#hud .info{position:absolute; right:18px; top:14px; text-align:right; font-size:12px; color:var(--dim); letter-spacing:1px; line-height:1.8;}
#hud .hint{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--dim); letter-spacing:1px;
  background:rgba(16,20,24,.7); padding:6px 14px; border:1px solid var(--line); white-space:nowrap;}

/* 暂停 / 结算 */
#pauseOverlay{position:absolute; inset:0; background:rgba(10,13,15,.8); display:none; align-items:center; justify-content:center; pointer-events:auto;}
#pauseOverlay.active{display:flex;}
.statgrid{display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 4px;}
.stat{flex:1 1 30%; min-width:130px; background:var(--panel2); border:1px solid var(--line); padding:12px; text-align:center;}
.stat .sv{font-family:'Noto Serif SC',serif; font-weight:700; font-size:22px; color:var(--accent);}
.stat .sk{font-size:11px; color:var(--dim); margin-top:4px; letter-spacing:1px;}
.banner{font-family:'Noto Serif SC',serif; font-size:30px; font-weight:900; letter-spacing:8px; text-align:center; margin-bottom:6px;}
.banner.win{color:#7FA86F;} .banner.lose{color:#C0504D;}

/* 调试面板 */
#debug{position:fixed; left:10px; bottom:10px; z-index:50; max-width:46vw; max-height:110px; overflow:auto;
  font:11px/1.5 monospace; color:#9AA3AB; background:rgba(10,13,15,.8); border:1px solid #2A323A; padding:6px 8px; pointer-events:none;}
#debug div.err{color:#E87B6E;}
#fps{position:fixed; right:10px; bottom:10px; z-index:50; font:11px monospace; color:#6E7780; background:rgba(10,13,15,.7); padding:4px 8px; border:1px solid #2A323A;}
</style>
</head>

/* ---------------- 小工具 ---------------- */
const TAU = Math.PI * 2;
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function rand(a, b){ return a + Math.random() * (b - a); }
function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }
function normAng(a){ while(a > Math.PI) a -= TAU; while(a < -Math.PI) a += TAU; return a; }
function angDiff(a, b){ return normAng(a - b); }
function dist(ax, ay, bx, by){ const dx = bx - ax, dy = by - ay; return Math.hypot(dx, dy); }
function rectHit(r, x, y){ return x >= r.x - r.w/2 && x <= r.x + r.w/2 && y >= r.y - r.h/2 && y <= r.y + r.h/2; }
/* 线段与矩形相交（用于弹道与视线） */
function segRectHit(ax, ay, bx, by, r){
  const x1 = r.x - r.w/2, y1 = r.y - r.h/2, x2 = r.x + r.w/2, y2 = r.y + r.h/2;
  const dx = bx - ax, dy = by - ay;
  let t0 = 0, t1 = 1;
  const p = [-dx, dx, -dy, dy];
  const q = [ax - x1, x2 - ax, ay - y1, y2 - ay];
  for(let i = 0; i < 4; i++){
    if(Math.abs(p[i]) < 1e-9){ if(q[i] < 0) return false; continue; }
    let t = q[i] / p[i];
    if(p[i] < 0){ if(t > t1) return false; if(t > t0) t0 = t; }
    else { if(t < t0) return false; if(t < t1) t1 = t; }
  }
  return true;
}
function losClear(obstacles, ax, ay, bx, by){
  for(let i = 0; i < obstacles.length; i++){ if(segRectHit(ax, ay, bx, by, obstacles[i])) return false; }
  return true;
}

function findCountry(eraId, cid){
  const list = COUNTRIES[eraId] || [];
  for(let i = 0; i < list.length; i++){ if(list[i].id === cid) return list[i]; }
  return list[0] || null;
}
function pickFoeCountry(eraId, myId){
  const list = COUNTRIES[eraId] || [];
  const me = findCountry(eraId, myId);
  // 优先抽对立阵营（历史敌对关系），避免盟友互打
  let others = [];
  if(me) others = list.filter(c => c.id !== myId && c.side !== me.side);
  if(!others.length) others = list.filter(c => c.id !== myId);
  return pick(others.length ? others : list);
}

  load(){

      const raw = localStorage.getItem(this.KEY);
      if(raw){ const d = JSON.parse(raw); if(d && typeof d === 'object') this.data = Object.assign(this.data, d); }
    }catch(e){ this.data = {camp:{}, free:{wins:0, bestKills:0, diff:1, countryEra:'nap', countryId:'uk'}, diff:1}; }
  },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){ /* 隐私模式忽略 */ } },
  done(camp, idx){ const a = this.data.camp[camp] || []; if(a.indexOf(idx) < 0){ a.push(idx); this.data.camp[camp] = a; } this.save(); },
  unlocked(camp, idx){ if(idx <= 1) return true; const a = this.data.camp[camp] || []; return a.indexOf(idx - 1) >= 0; }
};

/* ---------------- 引擎 ---------------- */
const Engine = function(cfg){
  this.map = MAPS[cfg.mapId];
  this.veh = VEH[cfg.player];
  this.ents = [];       // 全部载具（含玩家与敌机）
  this.shells = [];
  this.parts = [];
  this.texts = [];
  this.cam = {x:0, y:0, shx:0, shy:0, shake:0};
  this.time = 0;
  this.endT = -1;       // 结算延迟计时
  this.state = 'run';   // run | over
  this.result = null;
  this.stats = {kills:0, shots:0, hits:0, dmg:0};
  this.cfg = cfg;
  this.demo = !!cfg.demo;
  this.stress = !!cfg.stress;
  this.stressFrames = this.stress ? 600 : 0;   // 压测 10 秒自动结算
  this.diff = cfg.diff || 1;
  this.hudFn = null;
  this.onEnd = null;
  this.aimErr = 0.015 + 0.02 * this.diff;   // AI 瞄准误差
  this.surviveT = (cfg.obj && cfg.obj.type === 'survive') ? cfg.obj.time : 0;
  this.obs = this.map.obs || [];

  // 生成玩家
  const sp = this.map.blue[0];
  this.player = this.spawn(this.veh, sp[0], sp[1], 'blue', false, cfg.country);
  this.ents.push(this.player);
  // 生成敌机
  (cfg.foes || []).forEach(f => {
    const v = VEH[f[0]];
    for(let i = 0; i < f[1]; i++){ const p = this.pickRedSpawn(); this.ents.push(this.spawn(v, p[0], p[1], 'red', true, cfg.foeCountry)); }
  });
};

Engine.prototype.spawn = function(v, x, y, faction, ai, country){
  return {
    id: Math.random().toString(36).slice(2),
    v:v, kind:v.kind, name:v.name, faction:faction, ai:ai, country:country || null,
    x:x, y:y, heading:(faction === 'red' ? Math.PI : 0), turret:0,
    hp:v.hp, maxHp:v.hp, speedCur:0, reload:0, sideReload:0,
    radius:v.r, alive:true, wreck:false, burnT:0,
    strafeDir: Math.random() < 0.5 ? 1 : -1, strafeT: rand(2,4),
    aimOff: 0, moveDelay: 0
  };
};

Engine.prototype.pickRedSpawn = function(){
  const list = this.map.red.slice();
  for(let i = list.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; const t = list[i]; list[i] = list[j]; list[j] = t; }
  for(let i = 0; i < list.length; i++){
    const p = list[i];
    if(dist(p[0], p[1], this.player.x, this.player.y) < 400) continue;
    if(!this.clearSpot(p[0], p[1], 30)) continue;
    return [p[0] + rand(-40, 40), p[1] + rand(-40, 40)];
  }
  return [list[0][0], list[0][1]];
};
Engine.prototype.clearSpot = function(x, y, r){
  for(let i = 0; i < this.obs.length; i++){
    const o = this.obs[i];
    if(rectHit(o, x, y)) return false;
    if(dist(x, y, o.x, o.y) < (o.w + o.h) / 2 + r) return false;
  }
  return true;
};

/* ---------- 移动 ---------- */
Engine.prototype.moveEnt = function(e, dt, fwd, back, turn){
  const v = e.v;
  if(e.kind === 'train'){
    const r = this.map.rail;
    let ny = e.y + fwd * v.spd * dt - back * v.spd * 0.6 * dt;
    e.y = clamp(ny, r.y1 + 40, r.y2 - 40);
    e.heading = Math.PI / 2;
    e.x = r.x;
    e.speedCur = fwd ? v.spd : back ? -v.spd * 0.6 : 0;
    return;
  }
  const target = (fwd ? 1 : 0) - (back ? 0.6 : 0);
  e.speedCur += (target * v.spd - e.speedCur) * Math.min(1, 2.5 * dt);
  e.heading += turn * v.turn * dt * (1 - Math.abs(e.speedCur) / v.spd * 0.35);
  e.x += Math.cos(e.heading) * e.speedCur * dt;
  e.y += Math.sin(e.heading) * e.speedCur * dt;
  e.x = clamp(e.x, 40, this.map.w - 40);
  e.y = clamp(e.y, 40, this.map.h - 40);
  // 撞障碍物：简单回推
  for(let i = 0; i < this.obs.length; i++){
    const o = this.obs[i];
    if(o.type === 'tree' || o.type === 'rock'){ if(dist(e.x, e.y, o.x, o.y) < (o.w + o.h) / 2 + e.radius){ const d = dist(e.x,e.y,o.x,o.y) || 1; e.x = o.x + (e.x - o.x) / d * ((o.w + o.h) / 2 + e.radius); e.y = o.y + (e.y - o.y) / d * ((o.w + o.h) / 2 + e.radius); } }
    else if(rectHit(o, e.x, e.y)){ const nx = clamp(e.x, o.x - o.w/2 - e.radius, o.x + o.w/2 + e.radius); const ny = clamp(e.y, o.y - o.h/2 - e.radius, o.y + o.h/2 + e.radius); if(Math.abs(nx - e.x) < Math.abs(ny - e.y)) e.x = nx; else e.y = ny; }
  }
};

/* ---------- 开火 ---------- */
Engine.prototype.fireTurret = function(e, aim, manual){
  const g = e.v.gun;
  if(e.reload > 0) return;
  if(Math.abs(angDiff(e.turret, aim)) > (manual ? 0.14 : 0.12 + e.aimErr * 2)) return;
  const tipX = e.x + Math.cos(e.turret) * (e.radius + 10);
  const tipY = e.y + Math.sin(e.turret) * (e.radius + 10);
  this.shells.push({x:tipX, y:tipY, vx:Math.cos(e.turret) * 950, vy:Math.sin(e.turret) * 950,
    dmg:g.dmg, pen:g.pen, owner:e, life:g.rng / 950 + 0.3, px:tipX, py:tipY, col: e.faction === 'blue' ? '#FFE3B3' : '#FFB199'});
  e.reload = g.rel;
  this.flash(tipX, tipY, e.turret);
  if(e === this.player) this.stats.shots++;
};
Engine.prototype.fireBroadside = function(e){
  const g = e.v.gun;
  if(e.sideReload > 0) return;
  // 找侧舷弧内的目标
  let best = null, bestSide = 0, bestArc = 0;
  for(let i = 0; i < this.ents.length; i++){
    const t = this.ents[i];
    if(t === e || !t.alive || t.faction === e.faction) continue;
    const d = dist(e.x, e.y, t.x, t.y);
    if(d > g.rng) continue;
    const rel = angDiff(Math.atan2(t.y - e.y, t.x - e.x), e.heading);
    let side = 0, arc = 0;
    if(rel > 0.4 && rel < 2.75){ side = 1; arc = Math.abs(rel - Math.PI/2); }
    else if(rel < -0.4 && rel > -2.75){ side = -1; arc = Math.abs(rel + Math.PI/2); }
    if(side !== 0 && (best === null || arc < bestArc)){ best = t; bestSide = side; bestArc = arc; }
  }
  if(!best) return;
  const perp = bestSide;
  const baseA = e.heading + perp * Math.PI / 2;
  for(let i = 0; i < g.shells; i++){
    const a = baseA + rand(-1, 1) * g.spread * 0.017;
    const ox = e.x + Math.cos(e.heading) * Math.cos(perp) * 0; // 侧舷位置
    const sx = e.x + Math.cos(baseA) * e.radius * 0.75;
    const sy = e.y + Math.sin(baseA) * e.radius * 0.75;
    this.shells.push({x:sx, y:sy, vx:Math.cos(a) * 900, vy:Math.sin(a) * 900,
      dmg:g.dmg, pen:g.pen, owner:e, life:g.rng / 900 + 0.3, px:sx, py:sy, col: e.faction === 'blue' ? '#FFE3B3' : '#FFB199'});
  }
  e.sideReload = g.rel;
  if(e === this.player) this.stats.shots += g.shells;
  this.flash(e.x + Math.cos(baseA) * e.radius, e.y + Math.sin(baseA) * e.radius, baseA);
};

/* ---------- 弹道命中与装甲 ---------- */
Engine.prototype.hitVehicle = function(s, e){
  const dir = Math.atan2(s.vy, s.vx);
  const rel = Math.abs(angDiff(dir, e.heading));
  const face = rel < Math.PI/4 ? 0 : rel < 3*Math.PI/4 ? 1 : 2;   // 0前 1侧 2后
  const inc = Math.min(Math.abs(angDiff(dir, e.heading)), Math.PI/2);
  const eff = e.v.armor[face] * (1 + 0.006 * (inc * 180 / Math.PI));
  const penRoll = s.pen * rand(0.9, 1.1);
  let dmg = 0, type = 'pen';
  if(inc > 1.13 && penRoll < eff * 1.25){ type = 'bounce'; }        // 65度以上跳弹
  else if(penRoll >= eff){ dmg = s.dmg * rand(0.9, 1.1); type = 'pen'; }
  else { dmg = s.dmg * 0.12; type = 'spall'; }
  const atX = s.x, atY = s.y;
  if(type === 'bounce'){
    // 沿被击车辆正面法线反射，让跳弹真的弹开
    const nx = Math.cos(e.heading), ny = Math.sin(e.heading);
    const vd = s.vx * nx + s.vy * ny;
    s.vx -= 2 * vd * nx; s.vy -= 2 * vd * ny;
    s.life = Math.min(s.life, 0.18);
    this.burst(atX, atY, 4, '#C8C8C8');
    this.text(atX, atY, '跳弹', '#C8C8C8');
    return false;                 // 未被消耗，弹体继续飞行
  }
  if(type === 'spall'){
    this.burst(atX, atY, 3, '#8A8A8A');
    this.text(atX, atY, '未击穿', '#9AA3AB');
  } else {
    e.hp -= dmg;
    if(s.owner === this.player){ this.stats.hits++; this.stats.dmg += dmg; }
    this.burst(atX, atY, 8, '#FFD166');
    this.text(atX, atY, '-' + Math.round(dmg), '#FFE3B3');
    if(e === this.player) this.cam.shake = Math.min(1, this.cam.shake + 0.5);
    if(e.hp <= 0) this.destroy(e);
  }
  return true;                    // 已消耗（击穿/未击穿）
};

/* ---------- 销毁与粒子 ---------- */
Engine.prototype.destroy = function(e){
  e.alive = false; e.wreck = true;
  this.explode(e.x, e.y);
  if(e.faction === 'red' && e !== this.player) this.stats.kills++;
};
Engine.prototype.explode = function(x, y){
  this.burst(x, y, 22, '#FF7A3C');
  this.burst(x, y, 10, '#FFD166');
  for(let i = 0; i < 10; i++){ this.parts.push({x:x, y:y, vx:rand(-25,25), vy:rand(-40,-5), life:rand(0.8,1.6), max:1.6, size:rand(8,16), type:'smoke', col:'#3A3A3A'}); }
  this.parts.push({x:x, y:y, vx:0, vy:0, life:0.16, max:0.16, size:60, type:'flash', col:'#FFE3B3'});
  this.cam.shake = Math.min(1, this.cam.shake + 0.7);
};
Engine.prototype.burst = function(x, y, n, col){
  for(let i = 0; i < n; i++){
    const a = rand(0, TAU), sp = rand(40, 220);
    this.parts.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rand(0.2,0.5), max:0.5, size:rand(2,4), type:'spark', col:col});
  }
};
Engine.prototype.flash = function(x, y, a){
  this.parts.push({x:x + Math.cos(a)*6, y:y + Math.sin(a)*6, vx:Math.cos(a)*40, vy:Math.sin(a)*40, life:0.08, max:0.08, size:14, type:'flash', col:'#FFE3B3'});
};
Engine.prototype.text = function(x, y, t, col){
  this.texts.push({x:x, y:y, t:t, col:col, life:0.9});
};

/* ---------- AI ---------- */
Engine.prototype.aiUpdate = function(e, dt){
  const t = this.player && this.player.alive ? this.player : null;
  if(e.kind === 'ship'){ this.shipAI(e, dt, t); return; }
  // 坦克 / 装甲车 / 列车
  if(!t){ e.speedCur = 0; return; }
  const d = dist(e.x, e.y, t.x, t.y);
  const g = e.v.gun;
  e.moveDelay -= dt;
  if(e.moveDelay <= 0){ e.moveDelay = rand(0.3, 1.2); if(Math.random() < 0.3) e.strafeDir *= -1; }
  // 移动决策
  let fwd = 0, back = 0, turn = 0;
  if(e.kind === 'train'){
    // 列车只沿铁路上下移动，贴近目标
    const targetY = t.y;
    if(Math.abs(e.y - targetY) > 150){ fwd = targetY > e.y ? 1 : 0; back = targetY < e.y ? 1 : 0; }
    else { back = 1; }
    turn = 0;
  } else {
    if(d > g.rng * 0.8){ fwd = 1; const a = Math.atan2(t.y - e.y, t.x - e.x); const turnNeed = angDiff(a, e.heading); turn = clamp(turnNeed, -1, 1) * 2; }
    else if(d < g.rng * 0.45){ back = 1; const a = Math.atan2(t.y - e.y, t.x - e.x); const turnNeed = angDiff(a + Math.PI, e.heading); turn = clamp(turnNeed, -1, 1) * 2; }
    else { const a = Math.atan2(t.y - e.y, t.x - e.x) + Math.PI/2 * e.strafeDir; const turnNeed = angDiff(a, e.heading); turn = clamp(turnNeed, -1, 1) * 1.4; }
  }
  this.moveEnt(e, dt, fwd, back, turn);
  // 瞄准
  const lead = d / 950;
  const ax = t.x + Math.cos(t.heading) * t.speedCur * lead;
  const ay = t.y + Math.sin(t.heading) * t.speedCur * lead;
  const aim = Math.atan2(ay - e.y, ax - e.x) + rand(-1, 1) * e.aimErr;
  e.turret += angDiff(aim, e.turret) * Math.min(1, 3 * dt);
  // 开火
  if(losClear(this.obs, e.x, e.y, t.x, t.y)) this.fireTurret(e, e.turret, false);
};
Engine.prototype.shipAI = function(e, dt, t){
  if(!t){ e.speedCur = 0; return; }
  const base = Math.atan2(t.y - e.y, t.x - e.x);
  const side = e.faction === 'red' ? -1 : 1;
  const want = base + side * Math.PI / 2;
  const turnNeed = angDiff(want, e.heading);
  const turn = clamp(turnNeed, -1, 1) * 1.6;
  const fwd = Math.abs(turnNeed) < 1.2 ? 1 : 0;
  this.moveEnt(e, dt, fwd, 0, turn);
  this.fireBroadside(e);
};

/* ---------- 主更新 ---------- */
Engine.prototype.update = function(dt, input){
  this.time += dt;
  if(this.stress && this.stressFrames > 0){
    this.stressFrames--;
    if(this.stressFrames <= 0){ this.state = 'over'; this.result = 'win'; this.endT = 0.2; }
  }
  const p = this.player;
  // 玩家控制
  if(p && p.alive){
    if(this.demo || this.stress || input.ai){ this.aiUpdate(p, dt); }
    else {
      const fwd = input.up ? 1 : 0, back = input.down ? 1 : 0;
      const turn = (input.left ? -1 : 0) + (input.right ? 1 : 0);
      this.moveEnt(p, dt, fwd, back, turn);
      const wx = this.cam.x + (input.mx - this.cvw / 2), wy = this.cam.y + (input.my - this.cvh / 2);
      const aim = Math.atan2(wy - p.y, wx - p.x);
      p.turret += angDiff(aim, p.turret) * Math.min(1, 6 * dt);
      const wantFire = input.fire;
      if(wantFire){
        if(p.kind === 'ship'){ this.fireBroadside(p); }
        else { this.fireTurret(p, p.turret, true); }
      }
    }
  }
  // 敌机
  for(let i = 0; i < this.ents.length; i++){
    const e = this.ents[i];
    if(e === p || !e.alive) continue;
    this.aiUpdate(e, dt);
  }
  // 冷却
  for(let i = 0; i < this.ents.length; i++){
    const e = this.ents[i];
    if(!e.alive) continue;
    e.reload = Math.max(0, e.reload - dt);
    e.sideReload = Math.max(0, e.sideReload - dt);
    if(e.kind !== 'ship' && e !== p && !this.demo && !this.stress && e.ai){ /* 已由 aiUpdate 开火 */ }
    // 燃烧特效
    if(e.hp < e.maxHp * 0.35){
      e.burnT -= dt;
      if(e.burnT <= 0){ e.burnT = 0.12;
        this.parts.push({x:e.x + rand(-e.radius*0.5,e.radius*0.5), y:e.y + rand(-e.radius*0.5,e.radius*0.5), vx:rand(-8,8), vy:rand(-30,-10), life:rand(0.6,1.2), max:1.2, size:rand(6,12), type:'smoke', col:'#3A3A3A'});
        if(e.hp < e.maxHp * 0.18) this.parts.push({x:e.x, y:e.y, vx:rand(-10,10), vy:rand(-35,-15), life:rand(0.3,0.6), max:0.6, size:rand(4,8), type:'spark', col:'#FF7A3C'});
      }
    }
  }
  // 弹道
  for(let i = this.shells.length - 1; i >= 0; i--){
    const s = this.shells[i];
    s.px = s.x; s.py = s.y;
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.life -= dt;
    if(s.life <= 0){ this.shells.splice(i, 1); continue; }
    // 障碍物
    let hitObs = false;
    for(let j = 0; j < this.obs.length; j++){ if(rectHit(this.obs[j], s.x, s.y)){ hitObs = true; break; } }
    if(hitObs){ this.burst(s.x, s.y, 5, '#C8C8C8'); this.shells.splice(i, 1); continue; }
    // 载具
    let hit = false;
    for(let j = 0; j < this.ents.length; j++){
      const e = this.ents[j];
      if(!e.alive || e === s.owner) continue;
      if(dist(s.x, s.y, e.x, e.y) < e.radius + 3){
        const consumed = this.hitVehicle(s, e);
        hit = true;
        if(consumed) this.shells.splice(i, 1);
        break;
      }
    }
    if(hit) continue;
  }
  // 粒子
  for(let i = this.parts.length - 1; i >= 0; i--){
    const pa = this.parts[i];
    pa.life -= dt;
    if(pa.life <= 0){ this.parts.splice(i, 1); continue; }
    pa.x += pa.vx * dt; pa.y += pa.vy * dt;
    if(pa.type === 'smoke'){ pa.vx *= 0.98; pa.vy *= 0.98; pa.size += dt * 18; }
    else { pa.vx *= 0.94; pa.vy *= 0.94; }
  }
  for(let i = this.texts.length - 1; i >= 0; i--){
    const t = this.texts[i];
    t.life -= dt; t.y -= 24 * dt;
    if(t.life <= 0) this.texts.splice(i, 1);
  }
  // 相机
  if(p && p.alive){
    const tx = p.x - this.cvw / 2, ty = p.y - this.cvh / 2;
    this.cam.x = lerp(this.cam.x, tx, Math.min(1, 5 * dt));
    this.cam.y = lerp(this.cam.y, ty, Math.min(1, 5 * dt));
    this.cam.x = clamp(this.cam.x, 0, this.map.w - this.cvw);
    this.cam.y = clamp(this.cam.y, 0, this.map.h - this.cvh);
  }
  this.cam.shake = Math.max(0, this.cam.shake - dt * 2);
  this.cam.shx = rand(-1, 1) * this.cam.shake * 6;
  this.cam.shy = rand(-1, 1) * this.cam.shake * 6;
  // 目标判定
  if(this.state === 'run'){
    if(p && !p.alive){ this.state = 'over'; this.result = 'lose'; this.endT = 1.5; }
    else if(this.cfg.obj.type === 'destroy'){
      let left = 0;
      for(let i = 0; i < this.ents.length; i++){ const e = this.ents[i]; if(e !== p && e.alive && e.faction === 'red') left++; }
      if(left === 0){ this.state = 'over'; this.result = 'win'; this.endT = 1.0; }
    } else if(this.cfg.obj.type === 'survive'){
      this.surviveT -= dt;
      if(this.surviveT <= 0){ this.state = 'over'; this.result = 'win'; this.endT = 1.0; }
    }
  } else if(this.state === 'over' && this.endT > 0){
    this.endT -= dt;
    if(this.endT <= 0 && this.onEnd) this.onEnd(this.result);
  }
  // HUD
  if(this.hudFn){
    let left = 0;
    for(let i = 0; i < this.ents.length; i++){ const e = this.ents[i]; if(e !== p && e.alive && e.faction === 'red') left++; }
    this.hudFn({
      hp: p ? Math.max(0, Math.round(p.hp)) : 0, maxHp: p ? p.maxHp : 1,
      name: p ? p.name : '', country: p && p.country ? p.country.name : '', countryCol: p && p.country ? p.country.color : '', reload: p ? (p.kind === 'ship' ? clamp(1 - p.sideReload / p.v.gun.rel, 0, 1) : clamp(1 - p.reload / p.v.gun.rel, 0, 1)) : 0,
      kills: this.stats.kills, shots: this.stats.shots, dmg: Math.round(this.stats.dmg),
      obj: this.cfg.obj.type === 'survive' ? '坚守 ' + Math.ceil(Math.max(0, this.surviveT)) + ' 秒' : '摧毁全部敌军',
      left: left, time: Math.floor(this.time)
    });
  }
};

/* ---------- 渲染 ---------- */
Engine.prototype.render = function(ctx){
  const c = this.cam;
  ctx.fillStyle = '#101418';
  ctx.fillRect(0, 0, this.cvw, this.cvh);
  ctx.save();
  ctx.translate(-c.x + c.shx, -c.y + c.shy);
  // 地形
  ctx.fillStyle = this.map.bg;
  ctx.fillRect(0, 0, this.map.w, this.map.h);
  // 网格
  ctx.strokeStyle = this.map.grid;
  ctx.lineWidth = 1;
  const gs = 80;
  for(let x = 0; x <= this.map.w; x += gs){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.map.h); ctx.stroke(); }
  for(let y = 0; y <= this.map.h; y += gs){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.map.w, y); ctx.stroke(); }
  // 铁路
  if(this.map.rail){
    const r = this.map.rail;
    ctx.fillStyle = '#3A3628';
    ctx.fillRect(r.x - 9, r.y1, 18, r.y2 - r.y1);
    ctx.strokeStyle = '#8A8678'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r.x - 6, r.y1); ctx.lineTo(r.x - 6, r.y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r.x + 6, r.y1); ctx.lineTo(r.x + 6, r.y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 3;
    for(let y = r.y1; y <= r.y2; y += 24){ ctx.beginPath(); ctx.moveTo(r.x - 9, y); ctx.lineTo(r.x + 9, y); ctx.stroke(); }
  }
  // 障碍物
  for(let i = 0; i < this.obs.length; i++){
    const o = this.obs[i];
    if(o.type === 'tree'){
      ctx.fillStyle = '#3E4A2E'; ctx.beginPath(); ctx.arc(o.x, o.y, o.w / 2, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(o.x, o.y, o.w / 2, 0, TAU); ctx.fill();
    } else if(o.type === 'rock'){
      ctx.fillStyle = '#8A8274'; ctx.beginPath(); ctx.arc(o.x, o.y, (o.w + o.h) / 4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.arc(o.x - 3, o.y + 3, (o.w + o.h) / 4, 0, TAU); ctx.fill();
    } else if(o.type === 'island'){
      ctx.fillStyle = '#C2B280'; ctx.beginPath(); ctx.ellipse(o.x, o.y, o.w / 2, o.h / 2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7A8A5C'; ctx.beginPath(); ctx.ellipse(o.x, o.y, o.w / 2 * 0.7, o.h / 2 * 0.6, 0, 0, TAU); ctx.fill();
    } else if(o.type === 'build'){
      ctx.fillStyle = '#6E6A60'; ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.strokeRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(o.x - o.w/2 + 6, o.y - o.h/2 + 6, o.w - 12, o.h - 12);
    }
  }
  // 载具
  for(let i = 0; i < this.ents.length; i++){
    const e = this.ents[i];
    if(e.wreck){ this.drawWreck(ctx, e); }
    else { this.drawEnt(ctx, e); }
  }
  // 弹道
  for(let i = 0; i < this.shells.length; i++){
    const s = this.shells[i];
    ctx.strokeStyle = s.col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, TAU); ctx.fill();
  }
  // 粒子
  for(let i = 0; i < this.parts.length; i++){
    const pa = this.parts[i];
    const a = pa.life / pa.max;
    if(pa.type === 'smoke'){ ctx.globalAlpha = a * 0.5; ctx.fillStyle = pa.col; ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.size, 0, TAU); ctx.fill(); }
    else if(pa.type === 'flash'){ ctx.globalAlpha = a; ctx.fillStyle = pa.col; ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.size * a, 0, TAU); ctx.fill(); }
    else { ctx.globalAlpha = a; ctx.fillStyle = pa.col; ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.size, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // 漂浮文字
  ctx.font = '12px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';
  for(let i = 0; i < this.texts.length; i++){
    const t = this.texts[i];
    ctx.globalAlpha = clamp(t.life / 0.5, 0, 1);
    ctx.fillStyle = t.col;
    ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // 小地图
  this.drawMinimap(ctx);
};

Engine.prototype.drawEnt = function(ctx, e){
  const col = e.v.col, col2 = e.v.col2;
  ctx.save();
  ctx.translate(e.x, e.y);
  // 阵营环
  ctx.fillStyle = e.faction === 'blue' ? 'rgba(62,124,191,0.55)' : 'rgba(192,80,77,0.55)';
  ctx.beginPath(); ctx.arc(0, 0, e.radius + 4, 0, TAU); ctx.fill();
  // 国家环（细描边，标识所属阵营国家）
  if(e.country){ ctx.strokeStyle = e.country.color; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, e.radius + 4, 0, TAU); ctx.stroke(); }
  if(e.kind === 'ship'){
    ctx.rotate(e.heading);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(e.radius + 10, 0); ctx.lineTo(-e.radius * 0.9, -e.radius * 0.8); ctx.lineTo(-e.radius * 0.9, e.radius * 0.8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = col2;
    ctx.fillRect(-e.radius * 0.9, -e.radius * 0.75, e.radius * 1.7, e.radius * 1.5);
    // 桅杆与帆
    ctx.strokeStyle = '#3A2E22'; ctx.lineWidth = 2;
    for(let i = 0; i < 3; i++){ const mx = e.radius * 0.4 - i * e.radius * 0.5; ctx.beginPath(); ctx.moveTo(mx, -e.radius * 0.4); ctx.lineTo(mx, -e.radius * 1.6); ctx.stroke();
      ctx.fillStyle = 'rgba(232,226,212,0.75)'; ctx.fillRect(mx - 8, -e.radius * 1.5, 16, 12);
    }
    // 旗帜
    ctx.fillStyle = e.faction === 'blue' ? '#3E7CBF' : '#C0504D';
    ctx.beginPath(); ctx.moveTo(e.radius + 10, 0); ctx.lineTo(e.radius + 26, -6); ctx.lineTo(e.radius + 10, 0); ctx.fill();
    ctx.restore();
    return;
  }
  if(e.kind === 'train'){
    ctx.rotate(e.heading - Math.PI / 2);
    // 车体（长）
    ctx.fillStyle = col2; ctx.fillRect(-e.radius - 8, -e.radius * 3.2, e.radius * 2 + 16, e.radius * 6.4);
    ctx.fillStyle = col; ctx.fillRect(-e.radius, -e.radius * 3, e.radius * 2, e.radius * 6);
    // 车轮
    ctx.fillStyle = '#222';
    for(let i = -2.6; i <= 2.6; i += 0.65){ ctx.beginPath(); ctx.arc(i * e.radius, e.radius + 5, 5, 0, TAU); ctx.fill(); }
    // 烟囱与炮塔
    ctx.fillStyle = '#222'; ctx.fillRect(e.radius * 0.3, -e.radius * 3, 10, 16);
    ctx.save(); ctx.rotate(-(e.turret - Math.PI/2));
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(0, 0, e.radius * 0.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(e.radius * 1.6, 0); ctx.stroke();
    ctx.restore();
    ctx.restore();
    return;
  }
  // 坦克
  ctx.rotate(e.heading);
  ctx.fillStyle = col2; ctx.fillRect(-e.radius * 0.7, -e.radius - 3, e.radius * 1.4, e.radius * 2 + 6);   // 履带
  ctx.fillStyle = col; ctx.fillRect(-e.radius * 0.9, -e.radius * 0.75, e.radius * 1.8, e.radius * 1.5); // 车体
  ctx.save();
  ctx.rotate(e.turret - e.heading);
  ctx.fillStyle = col2; ctx.beginPath(); ctx.arc(0, 0, e.radius * 0.62, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(e.radius * 1.5, 0); ctx.stroke();   // 炮管
  ctx.restore();
  ctx.restore();
  // 血条
  if(e.hp < e.maxHp && e !== this.player){
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - e.radius, e.y - e.radius - 12, e.radius * 2, 5);
    ctx.fillStyle = '#C0504D'; ctx.fillRect(e.x - e.radius, e.y - e.radius - 12, e.radius * 2 * clamp(e.hp / e.maxHp, 0, 1), 5);
  }
  // 玩家箭头
  if(e === this.player){
    ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 8, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.x, e.y - e.radius - 14); ctx.lineTo(e.x - 5, e.y - e.radius - 22); ctx.lineTo(e.x + 5, e.y - e.radius - 22);
    ctx.closePath(); ctx.fillStyle = '#FFF'; ctx.fill();
  }
};
Engine.prototype.drawWreck = function(ctx, e){
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.translate(e.x, e.y);
  ctx.rotate(e.heading);
  ctx.fillStyle = '#2A2A2A';
  if(e.kind === 'ship'){
    ctx.beginPath(); ctx.moveTo(e.radius + 6, 0); ctx.lineTo(-e.radius * 0.9, -e.radius * 0.8); ctx.lineTo(-e.radius * 0.9, e.radius * 0.8); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillRect(-e.radius * 0.9, -e.radius * 0.75, e.radius * 1.8, e.radius * 1.5);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
};

Engine.prototype.drawMinimap = function(ctx){
  const mw = 170, mh = mw * this.map.h / this.map.w;
  const x0 = this.cvw - mw - 14, y0 = 14;
  ctx.fillStyle = 'rgba(12,15,18,0.85)';
  ctx.fillRect(x0 - 2, y0 - 2, mw + 4, mh + 4);
  ctx.fillStyle = this.map.bg;
  ctx.fillRect(x0, y0, mw, mh);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x0 - 2, y0 - 2, mw + 4, mh + 4);
  const sx = mw / this.map.w, sy = mh / this.map.h;
  for(let i = 0; i < this.obs.length; i++){
    const o = this.obs[i];
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x0 + (o.x - o.w/2) * sx, y0 + (o.y - o.h/2) * sy, o.w * sx, o.h * sy);
  }
  for(let i = 0; i < this.ents.length; i++){
    const e = this.ents[i];
    if(!e.alive) continue;
    ctx.fillStyle = e.faction === 'blue' ? '#4FA3FF' : '#FF6B5E';
    ctx.beginPath(); ctx.arc(x0 + e.x * sx, y0 + e.y * sy, 2.4, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.strokeRect(x0 + this.cam.x * sx, y0 + this.cam.y * sy, this.cvw * sx, this.cvh * sy);
};

/* ---------------- 主控（UI / 状态机） ---------------- */
const Game = {
  eng: null, state: 'menu', era: 'nap', camV: {x:0, y:0}, raf: 0, lastT: 0,
  input: {up:false, down:false, left:false, right:false, fire:false, mx:0, my:0, ai:false},
  joy: null, // 触屏摇杆
  fpsT: 0, fpsN: 0,
  init(){ this.canvas = document.getElementById('game'); this.ctx = this.canvas.getContext('2d');
    this.ui = document.getElementById('ui'); this.dbg = document.getElementById('debug'); this.fpsEl = document.getElementById('fps');
    Save.load(); this.resize();
    window.addEventListener('resize', () => this.resize());
    document.addEventListener('keydown', e => this.key(e, true));
    document.addEventListener('keyup', e => this.key(e, false));
    this.canvas.addEventListener('pointerdown', e => this.pDown(e));
    this.canvas.addEventListener('pointermove', e => this.pMove(e));
    this.canvas.addEventListener('pointerup', e => this.pUp(e));
    this.canvas.addEventListener('pointercancel', e => this.pUp(e));
    document.addEventListener('visibilitychange', () => { if(document.hidden) this.pause(); });
    window.addEventListener('error', ev => this.log('错误: ' + (ev.message || '未知'), true));
    window.addEventListener('unhandledrejection', ev => this.log('异步错误: ' + (ev.reason && ev.reason.message || '未知'), true));
    this.menu(); this.loop(performance.now());
  },
  resize(){ this.cvw = this.canvas.width = window.innerWidth; this.cvh = this.canvas.height = window.innerHeight; },
  /* ---- 输入 ---- */
  key(e, down){
    const c = (e.code === 'KeyF8') ? 'F8' : (e.code === 'KeyF9') ? 'F9' : e.code;
    if(c === 'KeyW' || c === 'ArrowUp') this.input.up = down;
    else if(c === 'KeyS' || c === 'ArrowDown') this.input.down = down;
    else if(c === 'KeyA' || c === 'ArrowLeft') this.input.left = down;
    else if(c === 'KeyD' || c === 'ArrowRight') this.input.right = down;
    else if(c === 'Space'){ this.input.fire = down; e.preventDefault(); }
    else if(c === 'Escape' && down){ if(this.state === 'battle') this.togglePause(); else if(this.state === 'help' || this.state === 'free' || this.state === 'missions' || this.state === 'campaign') this.menu(); }
    else if(c === 'Digit1' && down && this.state === 'menu'){ this.campaign(); }
    else if(c === 'Digit2' && down && this.state === 'menu'){ this.freeSetup(); }
    else if(c === 'Digit3' && down && this.state === 'menu'){ this.help(); }
    else if(c >= 'Digit1' && c <= 'Digit4' && down && this.state === 'campaign'){ const n = +c.slice(5); this.era = ERAS[n - 1].id; this.missions(); }
    else if(c >= 'Digit1' && c <= 'Digit9' && down && this.state === 'missions'){
      const n = +c.slice(5);
      const m = MISSIONS.find(x => x.camp === this.era && x.idx === n);
      if(m && Save.unlocked(m.camp, m.idx)) this.battle(m);
    }
    else if(c === 'Enter' && down && this.state === 'result'){ const b = document.getElementById('rAct'); if(b) b.click(); }
    else if(c === 'Enter' && down && this.state === 'free'){ this.freeBattle(); }
    else if(c === 'KeyE' && down && this.state === 'result'){ const b = document.getElementById('rAlt'); if(b) b.click(); }
    else if(c === 'KeyQ' && down && this.state === 'result'){ const b = document.getElementById('rBack'); if(b) b.click(); }
    else if(c === 'F8' && down){ if(this.eng && this.state === 'battle'){ this.eng.state = 'over'; this.eng.result = 'win'; this.eng.endT = 0.2; } }
    else if(c === 'F9' && down){ if(this.state === 'battle' || this.state === 'menu') this.stress(); }
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(c) >= 0) e.preventDefault();
  },
  pDown(e){
    if(this.state !== 'battle') return;
    this.canvas.setPointerCapture && this.canvas.setPointerCapture(e.pointerId);
    if(e.clientX < this.cvw * 0.4){ this.joy = {id:e.pointerId, ax:e.clientX, ay:e.clientY, x:0, y:0}; }
    else { this.input.mx = e.clientX; this.input.my = e.clientY; this.input.fire = true; }
  },
  pMove(e){
    this.input.mx = e.clientX; this.input.my = e.clientY;
    if(this.joy && this.joy.id === e.pointerId){
      let dx = e.clientX - this.joy.ax, dy = e.clientY - this.joy.ay;
      const d = Math.hypot(dx, dy); const max = 70;
      if(d > max){ dx = dx / d * max; dy = dy / d * max; }
      this.joy.x = dx; this.joy.y = dy;
      /* 修复：摇杆偏移映射到移动方向（原先只画圈不移动） */
      const TH = 12;
      this.input.left = this.joy.x < -TH;
      this.input.right = this.joy.x > TH;
      this.input.up = this.joy.y < -TH;
      this.input.down = this.joy.y > TH;
    }
  },
  pUp(e){
    if(this.joy && this.joy.id === e.pointerId){
      this.joy = null;
      this.input.left = this.input.right = this.input.up = this.input.down = false;
    }
    this.input.fire = false;
  },
  /* ---- 调试 ---- */
  log(msg, err){
    const d = document.createElement('div');
    d.textContent = (err ? '[!] ' : '') + msg;
    if(err) d.className = 'err';
    this.dbg.appendChild(d);
    while(this.dbg.children.length > 20) this.dbg.removeChild(this.dbg.firstChild);
  },
  /* ---- 主循环 ---- */
  loop(t){
    this.raf = requestAnimationFrame(tt => this.loop(tt));
    const dt = Math.min(0.05, (t - this.lastT) / 1000 || 0.016);
    this.lastT = t;
    this.fpsT += dt; this.fpsN++;
    if(this.fpsT >= 0.5){ this.fpsEl.textContent = Math.round(this.fpsN / this.fpsT) + ' FPS'; this.fpsT = 0; this.fpsN = 0; }
    if(this.eng && this.state === 'battle' && !this.paused){ this.eng.cvw = this.cvw; this.eng.cvh = this.cvh; this.eng.update(dt, this.input); this.eng.render(this.ctx); this.drawJoy(); }
    else if(this.eng && (this.state === 'menu' || this.state === 'campaign' || this.state === 'missions' || this.state === 'free')){ this.eng.cvw = this.cvw; this.eng.cvh = this.cvh; this.eng.update(dt, Object.assign({}, this.input, {ai:true})); this.eng.render(this.ctx); }
    else if(this.eng && this.state === 'battle' && this.paused){ this.eng.render(this.ctx); }
  },
  drawJoy(){
    if(!this.joy) return;
    const c = this.ctx;
    c.strokeStyle = 'rgba(232,226,212,0.35)'; c.lineWidth = 2;
    c.beginPath(); c.arc(this.joy.ax, this.joy.ay, 44, 0, TAU); c.stroke();
    c.fillStyle = 'rgba(232,226,212,0.4)';
    c.beginPath(); c.arc(this.joy.ax + this.joy.x, this.joy.ay + this.joy.y, 20, 0, TAU); c.fill();
  },
  /* ---- 暂停 ---- */
  paused: false,
  pause(){ if(this.state === 'battle' && !this.paused){ this.paused = true; cancelAnimationFrame(this.raf); document.getElementById('pauseOverlay').classList.add('active'); } },
  resume(){ if(this.paused){ this.paused = false; document.getElementById('pauseOverlay').classList.remove('active'); this.lastT = performance.now(); this.raf = requestAnimationFrame(tt => this.loop(tt)); } },
  togglePause(){ if(this.paused) this.resume(); else this.pause(); },
  /* ---- 屏幕 ---- */
  scr(name){ this.state = name; document.title = '铁甲战史 2D · ' + name; const all = this.ui.querySelectorAll('.screen'); for(let i = 0; i < all.length; i++) all[i].classList.remove('active'); const el = document.getElementById('scr-' + name); if(el) el.classList.add('active'); },

      hud = document.createElement('div'); hud.id = 'hud';
      hud.innerHTML =
        '<div class="hpwrap"><div class="hpname" id="hudName">-</div><div class="hpbar"><i id="hudHp" style="width:100%"></i></div>' +

  hudShow(on){ document.getElementById('hud').classList.toggle('active', on); },
  hud(h){
    document.getElementById('hudName').innerHTML = h.country ? '<span style="color:' + h.countryCol + '">' + h.country + '</span> · ' + h.name : h.name;
    document.getElementById('hudHp').style.width = (h.hp / h.maxHp * 100) + '%';
    document.getElementById('hudRel').style.width = (h.reload * 100) + '%';
    document.getElementById('hudObj').textContent = h.obj;
    document.getElementById('hudSub').textContent = '剩余敌军 ' + h.left + ' · 击杀 ' + h.kills + ' · 用时 ' + h.time + 's';
    document.getElementById('hudInfo').innerHTML = '伤害 ' + h.dmg + '<br>开火 ' + h.shots + '<br>击杀 ' + h.kills;
  },
  /* 结算 */
  battleEnd(res, m){
    this.hudShow(false);
    this.log(res === 'win' ? '胜利: ' + m.name : '战败: ' + m.name);
    const cN = findCountry(m.camp, m.country);
    const title = (cN ? cN.name + ' · ' : '') + m.name;
    if(res === 'win'){
      Save.done(m.camp, m.idx);
      const next = MISSIONS.find(x => x.camp === m.camp && x.idx === m.idx + 1);
      this.result(res, title, next ? '下一关' : '返回战役', () => {
        if(next) this.battle(next);
        else this.missions();
      });
    } else {
      this.result(res, title, '重试', () => this.battle(m));
    }
  },
  freeEnd(res){
    this.hudShow(false);
    if(res === 'win'){ Save.data.free.wins++; Save.data.free.bestKills = Math.max(Save.data.free.bestKills, this.eng.stats.kills); Save.save(); }
    const me = findCountry(this.free.era, this.free.country);
    this.result(res, (me ? me.name + ' · ' : '') + '自由模式', '再来一局', () => this.freeBattle(), '更换配置');
  },
  stressEnd(res){
    this.hudShow(false);
    this.log('压测结束: ' + (res === 'win' ? '通过' : '结束'));
    this.result(res, 'AI 压测', '再压测', () => this.stress(), '退出', () => { this.eng = null; this.menu(); });
  },
  result(res, title, actLabel, actFn, altLabel, altFn){
    this.scr('result');
    this.ui.innerHTML = '';
    const s = document.createElement('div'); s.className = 'screen active'; s.id = 'scr-result';
    const st = this.eng ? this.eng.stats : {kills:0, shots:0, dmg:0, hits:0};
    const acc = st.shots > 0 ? Math.round(st.hits / st.shots * 100) : 0;
    s.innerHTML = '<div class="panel" style="text-align:center">' +
      '<div class="banner ' + (res === 'win' ? 'win' : 'lose') + '">' + (res === 'win' ? '胜 利' : '战 败') + '</div>' +
      '<div class="sub" style="margin-bottom:6px">' + title + '</div>' +
      '<div class="statgrid">' +
        '<div class="stat"><div class="sv">' + st.kills + '</div><div class="sk">击杀</div></div>' +
        '<div class="stat"><div class="sv">' + st.dmg + '</div><div class="sk">造成伤害</div></div>' +
        '<div class="stat"><div class="sv">' + acc + '%</div><div class="sk">命中率</div></div>' +
        '<div class="stat"><div class="sv">' + st.shots + '</div><div class="sk">开火</div></div>' +
      '</div>' +
      '<div class="btnrow" style="justify-content:center">' +
        '<button class="btn" id="rAct">' + (actLabel || '再来一次') + '</button>' +
        (altLabel ? '<button class="btn ghost" id="rAlt">' + altLabel + '</button>' : '') +
        '<button class="btn ghost" id="rBack">返回菜单</button>' +
      '</div></div>';
    this.ui.appendChild(s);
    document.getElementById('rAct').onclick = actFn;
    const back = document.getElementById('rBack');
    back.onclick = () => { this.eng = null; this.menu(); };
    if(altLabel){ const alt = document.getElementById('rAlt'); alt.onclick = () => { this.eng = null; (altFn || (() => this.freeSetup()))(); }; }
  }
};

/* ---------------- 启动 ---------------- */
Game.init();
</script>
<script>
/* HanBer云坛 · 云坛一键登录（强制登录 + 存档按账号隔离） */
(function(){
  try{
    var qs = new URLSearchParams(location.search);
    var u = qs.get('yt_user');
    var logged = u && u !== 'guest';
    if(!logged){
      var ov = document.createElement('div');
      ov.id = 'yt-login-mask';
      ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:linear-gradient(160deg,#101828,#1a2a4a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;gap:14px;text-align:center;padding:20px';
      var t1 = document.createElement('div'); t1.style.cssText = 'font-size:40px'; t1.textContent = '🔒'; ov.appendChild(t1);
      var t2 = document.createElement('div'); t2.style.cssText = 'font-size:18px;font-weight:600'; t2.textContent = '此游戏需云坛一键登录'; ov.appendChild(t2);
      var t3 = document.createElement('div'); t3.style.cssText = 'font-size:13px;color:#9fb3d0;max-width:320px'; t3.textContent = '返回云坛登录后，进入「小程序」再点本游戏即可自动带账号游玩。'; ov.appendChild(t3);
      var btn = document.createElement('button');
      btn.textContent = '去登录';
      btn.style.cssText = 'margin-top:6px;padding:9px 22px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:14px;cursor:pointer';
      btn.onclick = function(){ try{ if(window.parent && window.parent.location){ window.parent.location.hash = '#/login'; } }catch(e){} };
      ov.appendChild(btn);
      document.body.appendChild(ov);
      return;
    }
    var el = document.createElement('div');
    el.id = 'yt-login-bar';
    el.style.cssText = 'position:fixed;top:8px;right:8px;z-index:99999;display:flex;align-items:center;gap:6px;background:rgba(10,14,26,.74);color:#fff;padding:5px 8px 5px 12px;border-radius:20px;font:12px/1 "PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.16);max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    var b1 = document.createElement('b'); b1.style.color = '#7cc4ff'; b1.textContent = String(u).replace(/[<>&]/g, '');
    var b2 = document.createElement('span'); b2.textContent = '✕'; b2.style.cssText = 'cursor:pointer;opacity:.65;margin-left:6px;font-size:11px';
    b2.title = '关闭';
    b2.onclick = function(){ var bar = document.getElementById('yt-login-bar'); if(bar) bar.remove(); };
    el.appendChild(document.createTextNode('👤 云坛登录：')); el.appendChild(b1); el.appendChild(b2);
    document.body.appendChild(el);
    window.YT_USER = u;
    window.YT_LOGGED = true;
    /* 存档按账号隔离：所有 localStorage 自动带账号前缀，旧档自动迁移 */
    var pre = '_yt_' + u + '_';
    var g = Storage.prototype.getItem, sw = Storage.prototype.setItem, r = Storage.prototype.removeItem;
    Storage.prototype.getItem = function(k){
      if(typeof k !== 'string' || k.indexOf(pre) === 0) return g.call(this, k);
      var scoped = g.call(this, pre + k);
      if(scoped !== null) return scoped;
      var legacy = g.call(this, k);
      if(legacy !== null){ try{ sw.call(this, pre + k, legacy); r.call(this, k); }catch(e){} }
      return legacy;
    };
    Storage.prototype.setItem = function(k, v){
      if(typeof k === 'string' && k.indexOf(pre) !== 0){ try{ sw.call(this, pre + k, v); }catch(e){} }
      else{ try{ sw.call(this, k, v); }catch(e){} }
    };
    Storage.prototype.removeItem = function(k){
      if(typeof k === 'string'){ r.call(this, pre + k); r.call(this, k); }
      else r.call(this, k);
    };
  }catch(e){}
})();
</script>
