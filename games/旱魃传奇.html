/* ---------- 事件 ---------- */
function bindEvents(){
  window.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    input.keys[k]=true;
    if(G&&G.state==="playing"){
      if(k==="q")castSkill(G.player,"Q");
      if(k==="e")castSkill(G.player,"E");
      if(k==="r")castSkill(G.player,"R");
      if(k==="h")toggleTrainPanel();
      if(k==="b"){
        if(!G.player.dead){G.shopOpen=!G.shopOpen;$("#shopPanel").classList.toggle("on",G.shopOpen);if(G.shopOpen)renderShop();}
      }
      if(k==="t"&&!G.player.dead&&!G.player.recalling&&!G.shopOpen){G.player.recalling=true;G.player.recallT=0;toast("正在回城…",1200);}
      if(k==="escape"&&G.shopOpen){G.shopOpen=false;$("#shopPanel").classList.remove("on");}
    }
  });
  window.addEventListener("keyup",e=>{input.keys[e.key.toLowerCase()]=false;});
  cv.addEventListener("mousemove",e=>{
    const r=cv.getBoundingClientRect();
    input.mouse.x=e.clientX-r.left;
    input.mouse.y=e.clientY-r.top;
    input.mouse.has=true;
  });
  cv.addEventListener("mouseleave",()=>{input.mouse.has=false;});
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    if(!G)return;
    G.cam.zoom=clamp(G.cam.zoom*(e.deltaY>0?0.92:1.08),0.7,2.4);
  },{passive:false});
  // 摇杆
  const joyEl=$("#joy");
  const joyKnob=joyEl.querySelector(".joy-knob");
  function joyDown(e){
    e.preventDefault();
    input.joy.active=true;
    input.joy.id=e.pointerId;
    const r=joyEl.getBoundingClientRect();
    input.joy.baseX=r.left+r.width/2;
    input.joy.baseY=r.top+r.height/2;
    input.joy.kx=r.left+r.width/2;
    input.joy.ky=r.top+r.height/2;
    joyEl.setPointerCapture&&joyEl.setPointerCapture(e.pointerId);
  }
  function joyMove(e){
    if(!input.joy.active||e.pointerId!==input.joy.id)return;
    let dx=e.clientX-input.joy.baseX,dy=e.clientY-input.joy.baseY;
    const l=Math.hypot(dx,dy),max=44;
    if(l>max){dx=dx/l*max;dy=dy/l*max;}
    input.joy.dx=dx/max;input.joy.dy=dy/max;
    input.joy.kx=input.joy.baseX+dx;
    input.joy.ky=input.joy.baseY+dy;
    joyKnob.style.left=(dx+44)+"px";
    joyKnob.style.top=(dy+44)+"px";
    joyKnob.style.marginLeft="-26px";
    joyKnob.style.marginTop="-26px";
  }
  function joyUp(e){
    if(e.pointerId!==input.joy.id)return;
    input.joy.active=false;input.joy.dx=0;input.joy.dy=0;
    joyKnob.style.left="50%";joyKnob.style.top="50%";
  }
  joyEl.addEventListener("pointerdown",joyDown);
  joyEl.addEventListener("pointermove",joyMove);
  joyEl.addEventListener("pointerup",joyUp);
  joyEl.addEventListener("pointercancel",joyUp);
  // 按钮
  if("ontouchstart" in window){$("#joy").style.display="block";}
  $("#btnShop").addEventListener("pointerdown",e=>{e.preventDefault();if(G&&G.state==="playing"&&G.player&&!G.player.dead){G.shopOpen=!G.shopOpen;$("#shopPanel").classList.toggle("on",G.shopOpen);if(G.shopOpen)renderShop();}});
  $("#btnRecall").addEventListener("pointerdown",e=>{e.preventDefault();if(G&&G.state==="playing"&&G.player&&!G.player.dead&&!G.player.recalling){G.player.recalling=true;G.player.recallT=0;toast("正在回城…",1200);}});
  $("#shopPanel").addEventListener("click",e=>{if(e.target===$("#shopPanel")){G.shopOpen=false;$("#shopPanel").classList.remove("on");}});
  // 主菜单
  document.querySelectorAll(".mode-card").forEach(card=>{
    card.addEventListener("click",()=>{
      curMode=card.dataset.mode;
      pickHeroId=0;
      showView("view-pick");
      renderPick();
    });
  });
  $("#btnCodex").addEventListener("click",()=>{renderCodex();showView("view-codex");});
  $("#btnCodexBack").addEventListener("click",()=>{showView("view-menu");});
  $("#btnHelp").addEventListener("click",()=>{
    $("#modalBody").innerHTML='<div class="help-body">'+
      "<b>操作</b><br>移动：WASD / 方向键；手机上使用左下角虚拟摇杆。<br>技能：Q（技能1）、E（技能2）、R（大招），或点击右下技能按钮。技能朝鼠标方向释放。<br>普通攻击自动锁定附近敌人。<br>商店：按 B 或点“商店”按钮，购买装备提升属性（最多 6 件）。<br>回城：按 T 或点“回城”，3 秒后回到基地并回满状态。<br>滚轮可缩放视野。<br><br>"+
      "<b>玩法</b><br>击杀小兵和野怪获得金币与经验，升级增强属性。<br>击杀英雄获取大量金币。红蓝 buff 与巨龙提供强力增益。<br>摧毁敌方基地即可获胜；1V1 先拿 10 杀、3V3 先拿 30 杀也可直接获胜。<br>5V5 排位模式会记录你的段位（黑铁 → 王者）。</div>";
    $("#modalMask").classList.add("on");
  });
  $("#btnResetRank").addEventListener("click",()=>{
    saveRank({tier:0,stars:0});
    renderMenu();
    toast("段位已重置为 黑铁",1500);
  });
  $("#modalClose").addEventListener("click",()=>{$("#modalMask").classList.remove("on");});
  $("#modalMask").addEventListener("click",e=>{if(e.target===$("#modalMask"))$("#modalMask").classList.remove("on");});
  $("#btnPickBack").addEventListener("click",()=>{showView("view-menu");});
  $("#btnStart").addEventListener("click",()=>{startGameUI();});
  $("#btnAgain").addEventListener("click",()=>{startAgain();});
  $("#btnMenu").addEventListener("click",()=>{showView("view-menu");renderMenu();});
  $("#tpClose").addEventListener("click",()=>{$("#trainPanel").classList.remove("on");});
  $("#btnLeave").addEventListener("click",leaveTrain);
  window.addEventListener("resize",resizeCanvas);
  document.addEventListener("visibilitychange",()=>{});
}

/* ---------- 主循环 ---------- */
function showDbgErr(msg){
  const de=$("#dbgErr");
  if(!de)return;
  de.textContent=msg;
  de.style.display="block";
}
function loop(ts){
  const dt=Math.min(0.05,(ts-lastTime)/1000);
  lastTime=ts;
  if(G&&G.state==="playing"){
    // 异常隔离：任何一帧出错都只记日志，绝不中断游戏循环（防止画面冻结清屏）
    try{update(dt);}catch(err){if(G._errs<(G._errs|0)+1||true)console.error("[update]",err);showDbgErr("update: "+(err&&err.message||err));}
    try{render();}catch(err){console.error("[render]",err);showDbgErr("render: "+(err&&err.message||err));}
    try{drawMinimap();}catch(err){console.error("[minimap]",err);showDbgErr("minimap: "+(err&&err.message||err));}
    try{updateHud();}catch(err){console.error("[hud]",err);showDbgErr("hud: "+(err&&err.message||err));}
    try{updateKfeed();}catch(err){console.error("[kfeed]",err);showDbgErr("kfeed: "+(err&&err.message||err));}
    if(G.over)loopId=null;
  }
  if(!G||G.state!=="playing"){loopId=null;return;}
  loopId=requestAnimationFrame(loop);
}

/* ---------- 初始化 ---------- */
function init(){
  resizeCanvas();
  bindEvents();
  renderMenu();
  showView("view-menu");
}
init();
</script>

      if(typeof k !== 'string' || k.indexOf(pre) === 0) return g.call(this, k);
      var scoped = g.call(this, pre + k);
      if(scoped !== null) return scoped;

    };

    };
    Storage.prototype.removeItem = function(k){
