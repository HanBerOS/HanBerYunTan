<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>鼓气河豚 · Puff!</title>
<style>
/* ===== 基础 ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background:#06324f;color:#f2fbff;
}
#game-root{position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ===== HUD ===== */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud-top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
.score-label{font-size:12px;letter-spacing:2px;opacity:.75}
.score-value{font-size:34px;font-weight:800;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.score-sub{font-size:12px;opacity:.8;margin-top:2px}
.score-sub b{color:#ffcf5c;font-weight:700}
.hud-right{display:flex;align-items:center;gap:10px}
.lives{display:flex;gap:5px}
.lives svg{width:24px;height:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.lives .lost{opacity:.22}
.icon-btn{
  pointer-events:auto;width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(255,255,255,.28);background:rgba(6,40,61,.55);
  color:#fff;display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:rgba(255,255,255,.22)}
.hud-bottom{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;align-items:center;gap:12px}
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.gauge-label{font-size:11px;letter-spacing:3px;opacity:.8;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.gauge{width:min(320px,58vw);height:14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);overflow:hidden}
.gauge-fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#ffcf5c,#ff9f43);transition:width .1s linear}
.gauge-fill.low{background:linear-gradient(90deg,#ff6b6b,#ff9f43);animation:gauge-blink .5s steps(2) infinite}
@keyframes gauge-blink{50%{opacity:.55}}
.lvl-tag{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:2px;opacity:.75;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* ===== 移动端控件 ===== */
#touch-zone{position:absolute;left:0;top:22%;width:58%;height:78%;z-index:4}
#joy-base{
  position:absolute;width:104px;height:104px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
  left:52px;bottom:66px;display:flex;align-items:center;justify-content:center;
}
#joy-knob{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.55)}
#puff-btn{
  position:absolute;right:26px;bottom:34px;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffdf8e,#ff9f43);
  border:3px solid #fff3d6;color:#5b3a05;font-size:22px;font-weight:800;letter-spacing:2px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:6;display:flex;align-items:center;justify-content:center;
}
#puff-btn:active{transform:scale(.94)}

/* ===== 全屏面板 ===== */
.screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(4,30,48,.55) 0%,rgba(4,30,48,.82) 100%)}
.card{
  width:min(460px,92vw);border-radius:22px;padding:34px 30px 30px;text-align:center;
  background:rgba(6,40,61,.9);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(6px);
}
.title-kicker{font-size:13px;letter-spacing:8px;opacity:.8;margin-bottom:6px;color:#7fd8ea}
.title{font-size:44px;font-weight:900;letter-spacing:6px;color:#ffcf5c;text-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 24px rgba(255,159,67,.35)}
.subtitle{font-size:14px;letter-spacing:5px;opacity:.75;margin-top:6px}
.howto{list-style:none;margin:26px 0 30px;text-align:left;display:flex;flex-direction:column;gap:12px}
.howto li{position:relative;padding-left:26px;font-size:14.5px;line-height:1.55;color:#e6f6ff}
.howto li::before{content:"";position:absolute;left:0;top:5px;width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#37b6c9,#1f7f9e);box-shadow:0 0 6px rgba(55,182,201,.6)}
.btn{
  display:inline-block;border:none;border-radius:999px;padding:14px 46px;font-size:18px;font-weight:800;letter-spacing:4px;
  color:#5b3a05;background:linear-gradient(180deg,#ffdf8e,#ff9f43);
  box-shadow:0 6px 20px rgba(255,159,67,.4),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .12s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.hint{font-size:12px;opacity:.65;margin-top:20px;letter-spacing:1px}
.end-score{font-size:56px;font-weight:900;color:#ffcf5c;margin:6px 0 0;line-height:1}
.end-best{font-size:14px;opacity:.8;margin-top:4px}
.record-badge{
  display:inline-block;margin-top:12px;padding:5px 16px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:3px;
  color:#5b3a05;background:#ffcf5c;animation:gauge-blink .6s steps(2) infinite;
}
.pause-title{font-size:30px;font-weight:900;letter-spacing:6px;margin-bottom:8px}
.pause-sub{font-size:13px;opacity:.7;margin-bottom:26px;letter-spacing:2px}
.row-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.3)}

/* ===== 小屏适配 ===== */
@media (max-width:640px){
  .title{font-size:36px}
  .card{padding:26px 20px 24px}
  .score-value{font-size:28px}
  #joy-base{width:88px;height:88px;left:40px;bottom:56px}
  #joy-knob{width:40px;height:40px}
  #puff-btn{width:84px;height:84px;font-size:19px;right:20px;bottom:26px}
}
</style>
</head>
<body>
<div id="game-root">
  <canvas id="game-canvas"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div class="lvl-tag" id="lvl-tag">Lv.1</div>
    <div class="hud-top">
      <div class="score-box">
        <div class="score-label">得分</div>
        <div class="score-value" id="score-value">0</div>
        <div class="score-sub">最高 <b id="best-value">0</b></div>
      </div>
      <div class="hud-right">
        <div class="lives" id="lives"></div>
        <button class="icon-btn" id="pause-btn" aria-label="暂停">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="gauge-wrap">
        <div class="gauge-label" id="gauge-label">气量</div>
        <div class="gauge"><div class="gauge-fill" id="gauge-fill"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== 移动端控件 ===== -->
  <div id="touch-zone" class="hidden">
    <div id="joy-base"><div id="joy-knob"></div></div>
  </div>
  <button id="puff-btn" class="hidden">鼓气</button>

  <!-- ===== 开始界面 ===== -->
  <div id="start-screen" class="screen">
    <div class="card">
      <div class="title-kicker">PUFF!</div>
      <h1 class="title">鼓气河豚</h1>
      <div class="subtitle">深海生存记</div>
      <ul class="howto">
        <li>移动：方向键 / WASD，手机用左下角摇杆</li>
        <li>鼓气：按空格 / 点右下按钮——全身长刺，把敌人吓跑赚高分</li>
        <li>吃小虾、海藻、海星攒分，躲开鲨鱼、水母和海胆</li>
      </ul>
      <button class="btn" id="start-btn">开始游戏</button>
      <div class="hint">鼓气时游得慢、气量会耗尽，时机比手速更重要</div>
    </div>
  </div>

  <!-- ===== 暂停界面 ===== -->
  <div id="pause-screen" class="screen hidden">
    <div class="card">
      <div class="pause-title">暂停</div>
      <div class="pause-sub">按 Esc / P 或点按钮继续</div>
      <div class="row-btns">
        <button class="btn" id="resume-btn">继续游戏</button>
        <button class="btn ghost" id="restart-btn">重新开始</button>
      </div>
    </div>
  </div>

  <!-- ===== 结束界面 ===== -->
  <div id="over-screen" class="screen hidden">
    <div class="card">
      <div class="title-kicker">PUFF!</div>
      <h1 class="title">游戏结束</h1>
      <div class="end-score" id="end-score">0</div>
      <div class="end-best">本局得分（最高 <b id="end-best">0</b>）</div>
      <div class="record-badge hidden" id="record-badge">新纪录！</div>
      <div style="margin-top:26px"><button class="btn" id="again-btn">再来一局</button></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ===== 工具 ===== */
function $(id){return document.getElementById(id)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rand(a,b){return a+Math.random()*(b-a)}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function angTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}

/* ===== Canvas 初始化 ===== */
var canvas=$('game-canvas'),ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1,bgGrad=null;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#1a6f9c');bgGrad.addColorStop(0.55,'#0d4a74');bgGrad.addColorStop(1,'#06324f');
}
window.addEventListener('resize',resize);
resize();

/* ===== 游戏状态 ===== */
var state={mode:'start',score:0,best:0,time:0,level:1,combo:0,lastScare:0,hearts:3};
var BEST_KEY='puff-best-score';
try{state.best=parseInt(localStorage.getItem(BEST_KEY),10)||0}catch(e){state.best=0}

var player,enemies,foods,particles,bubbles,seaweed,decor,shake=0;
var demoP={x:0,y:0,t:0};
var spawnTimer=0,foodTimer=0;
var keys={};
var joy={active:false,sx:0,sy:0,dx:0,dy:0};

function resetAll(){
  player={x:W/2,y:H*0.62,r:26,vx:0,vy:0,ang:0,inflated:false,gauge:100,inv:0,anim:0,swim:0};
  enemies=[];foods=[];particles=[];bubbles=[];seaweed=[];decor=[];
  state.score=0;state.time=0;state.level=1;state.combo=0;state.lastScare=0;state.hearts=3;
  spawnTimer=1.2;foodTimer=0.3;shake=0;
  seedScenery();
  buildLives();
  updateHUD();
}

/* ===== 场景装饰 ===== */
function seedScenery(){
  for(var i=0;i<14;i++)bubbles.push({x:rand(0,W),y:rand(H,H+60),r:rand(2,6),sp:rand(20,55),ph:rand(0,6.28)});
  var n=Math.max(4,Math.round(W/180));
  for(i=0;i<n;i++)seaweed.push({x:rand(20,W-20),h:rand(46,110),ph:rand(0,6.28),sp:rand(1.2,2.2),seg:3});
  for(i=0;i<Math.max(3,Math.round(W/260));i++){
    decor.push({x:rand(30,W-30),y:H+rand(2,14),kind:Math.random()<0.5?'coral':'rock',s:rand(0.7,1.25),ph:rand(0,6.28)});
  }
}

/* ===== 实体创建 ===== */
function spawnFood(rarity){
  var r=Math.random();
  var type = rarity? (Math.random()<0.75?'shell':'starfish') : (r<0.45?'shrimp':r<0.75?'seaweed':r<0.95?'starfish':'shell');
  var f={x:rand(30,W-30),y:rand(40,H*0.72),type:type,r:type==='shell'?14:type==='starfish'?13:type==='seaweed'?11:12,ph:rand(0,6.28),rot:rand(0,6.28)};
  // 避免生成在玩家脸上
  if(player&&dist(f.x,f.y,player.x,player.y)<120)f.y=Math.max(40,f.y-140);
  foods.push(f);
}
function spawnEnemy(){
  var side=Math.floor(rand(0,4));
  var x,y;
  if(side===0){x=rand(0,W);y=-50}
  else if(side===1){x=W+50;y=rand(0,H)}
  else if(side===2){x=rand(0,W);y=H+50}
  else{x=-50;y=rand(0,H)}
  var type;
  var roll=Math.random();
  if(state.level>=3&&roll<0.28)type='urchin';
  else if(state.level>=2&&roll<0.6)type='jelly';
  else type='shark';
  var e={x:x,y:y,type:type,r:type==='shark'?34:type==='jelly'?30:22,ang:0,scared:false,scaredT:0,vx:0,vy:0,sp:type==='shark'?150+state.level*14:type==='jelly'?64+state.level*6:36+state.level*4,ph:rand(0,6.28),tail:0};
  enemies.push(e);
}
function emitText(x,y,txt,color){
  particles.push({kind:'text',x:x,y:y,txt:txt,color:color,life:0.9,age:0});
}
function emitRing(x,y,color){
  particles.push({kind:'ring',x:x,y:y,color:color,r:10,life:0.5,age:0});
}
function emitBurst(x,y,n,color){
  for(var i=0;i<n;i++){
    var a=rand(0,6.28),sp=rand(60,230);
    particles.push({kind:'dot',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:rand(2,4.5),color:color,life:rand(0.4,0.8),age:0});
  }
}

/* ===== 更新 ===== */
function update(dt){
  // 场景
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    b.y-=b.sp*dt;b.x+=Math.sin(b.ph+b.y*0.02)*12*dt;
    if(b.y<-20){b.y=H+20;b.x=rand(0,W)}
  }
  for(i=0;i<seaweed.length;i++){var s=seaweed[i];s.ph+=s.sp*dt}
  for(i=0;i<decor.length;i++)decor[i].ph+=0.6*dt;

  if(state.mode==='start'){
    demoP.t+=dt;
    demoP.x=W/2+Math.sin(demoP.t*0.7)*W*0.22;
    demoP.y=H*0.46+Math.sin(demoP.t*1.3)*22;
    demoP.ang=Math.sin(demoP.t*0.7)*0.6;
    return;
  }
  if(state.mode!=='playing'){updateParticles(dt);return}

  state.time+=dt;
  state.level=Math.floor(state.time/15)+1;
  $('lvl-tag').textContent='Lv.'+state.level;
  if(state.combo>0&&state.time-state.lastScare>2)state.combo=0;

  // 玩家移动
  var ix=0,iy=0;
  if(keys.left||keys.a)ix-=1;
  if(keys.right||keys.d)ix+=1;
  if(keys.up||keys.w)iy-=1;
  if(keys.down||keys.s)iy+=1;
  if(!ix&&!iy&&joy.active){ix=joy.dx;iy=joy.dy}
  var len=Math.hypot(ix,iy);
  if(len>0){ix/=len;iy/=len}
  var speed=player.inflated?150:265;
  player.x+=ix*speed*dt;player.y+=iy*speed*dt;
  player.x=clamp(player.x,26,W-26);player.y=clamp(player.y,26,H-26);
  if(len>0)player.ang=Math.atan2(iy,ix);
  player.anim+=dt*7;
  player.swim+=dt*(player.inflated?3.2:5.6);

  // 鼓气与气量
  if(player.inflated){
    player.gauge-=21*dt;
    if(player.gauge<=0){player.gauge=0;player.inflated=false;emitText(player.x,player.y-44,'气力耗尽', '#ff6b6b')}
  }else{
    player.gauge=Math.min(100,player.gauge+11*dt);
  }
  if(player.inv>0)player.inv-=dt;

  // 食物刷新
  foodTimer-=dt;
  if(foodTimer<=0&&foods.length<7){
    spawnFood(false);
    foodTimer=rand(0.6,1.4);
    if(Math.random()<0.22)spawnFood(true);
  }

  // 敌人刷新
  spawnTimer-=dt;
  if(spawnTimer<=0&&enemies.length<3+state.level){
    spawnEnemy();
    spawnTimer=Math.max(0.55,1.75-(state.level-1)*0.17)*rand(0.8,1.2);
  }

  // 更新敌人
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.ph+=dt*2;e.tail+=dt*6;
    if(e.scared){
      e.scaredT-=dt;
      var dx=e.x-player.x,dy=e.y-player.y,l=Math.hypot(dx,dy)||1;
      e.x+=dx/l*e.sp*3.6*dt;e.y+=dy/l*e.sp*3.6*dt;
      if(e.scaredT<=0||e.x<-80||e.x>W+80||e.y<-80||e.y>H+80){enemies.splice(i,1);continue}
      continue;
    }
    if(e.type==='shark'){
      var a=angTo(e,player);
      e.vx=lerp(e.vx,Math.cos(a)*e.sp,0.045);
      e.vy=lerp(e.vy,Math.sin(a)*e.sp,0.045);
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.ang=Math.atan2(e.vy,e.vx);
    }else if(e.type==='jelly'){
      var ja=angTo(e,player);
      e.vx=Math.cos(ja)*e.sp*0.35+Math.sin(e.ph)*26;
      e.vy=Math.sin(ja)*e.sp*0.35-Math.cos(e.ph*0.8)*20;
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.ang=ja;
    }else{
      e.vx=Math.cos(e.ph)*e.sp*0.5;e.vy=Math.sin(e.ph*0.7)*e.sp*0.45;
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      if(e.x<22)e.ph=Math.PI-e.ph;if(e.x>W-22)e.ph=Math.PI-e.ph;
      if(e.y<22)e.ph=-e.ph;if(e.y>H-22)e.ph=-e.ph;
    }

    // 玩家碰撞
    var pr=player.inflated?42:26;
    var rr=pr+e.r;
    if(dist(player.x,player.y,e.x,e.y)<rr){
      if(player.inflated){
        e.scared=true;e.scaredT=2;
        state.combo=(state.time-state.lastScare<2)?Math.min(state.combo+1,5):1;
        state.lastScare=state.time;
        var pts=50*state.combo;
        state.score+=pts;
        emitRing(e.x,e.y,'#ffcf5c');
        emitBurst(e.x,e.y,10,'#ffe9c9');
        emitText(e.x,e.y-26,'+'+pts+(state.combo>1?' x'+state.combo:''),'#ffdf8e');
        shake=Math.max(shake,5);
      }else if(player.inv<=0){
        state.hearts--;
        player.inv=1.6;
        emitBurst(player.x,player.y,16,'#ff6b6b');
        emitText(player.x,player.y-42,'-1 生命','#ff6b6b');
        shake=Math.max(shake,10);
        if(state.hearts<=0){gameOver();return}
      }
    }
  }

  // 食物碰撞
  for(i=foods.length-1;i>=0;i--){
    var f=foods[i];
    if(dist(player.x,player.y,f.x,f.y)<player.r+f.r+8){
      var gain=f.type==='shrimp'?10:f.type==='seaweed'?5:f.type==='starfish'?20:80;
      state.score+=gain;
      emitBurst(f.x,f.y,8,'#fff2c9');
      if(f.type==='shell'){
        if(state.hearts<3){state.hearts++;buildLives();emitText(f.x,f.y-24,'+1 生命','#7dffab')}
        else emitText(f.x,f.y-24,'+80','#7fd8ea');
      }else{
        emitText(f.x,f.y-24,'+'+gain,'#ffdf8e');
      }
      foods.splice(i,1);
    }
  }

  updateParticles(dt);
  updateHUD();
  if(shake>0)shake=Math.max(0,shake-34*dt);
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.age+=dt;
    if(p.age>=p.life){particles.splice(i,1);continue}
    if(p.kind==='dot'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94}
    if(p.kind==='ring')p.r+=160*dt;
    if(p.kind==='text')p.y-=34*dt;
  }
}

/* ===== HUD ===== */
function buildLives(){
  var box=$('lives');box.innerHTML='';
  for(var i=0;i<3;i++){
    var s=document.createElement('span');
    s.className=(i<state.hearts)?'':'lost';
    s.innerHTML='<svg viewBox="0 0 24 24" fill="'+(i<state.hearts?'#ff6b6b':'#9fb4c4')+'"><path d="M12 21s-7.5-4.7-10-9.3C.6 8.6 2.4 5 5.8 5c2 0 3.4 1.2 4.2 2.6C10.8 6.2 12.2 5 14.2 5c3.4 0 5.2 3.6 3.8 6.7C19.5 16.3 12 21 12 21z"/></svg>';
    box.appendChild(s);
  }
}
function updateHUD(){
  if(!player)return;
  $('score-value').textContent=state.score;
  $('best-value').textContent=state.best;
  var fill=$('gauge-fill');
  fill.style.width=player.gauge+'%';
  fill.className='gauge-fill'+(player.gauge<22?' low':'');
  $('gauge-label').textContent=player.inflated?'鼓气中':'气量';
}

/* ===== 绘制 ===== */
function draw(){
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  drawLightBeams();
  drawDecor();
  drawSeaweed();
  drawBubbles();

  if(state.mode==='start'){
    drawPuffer(demoP.x,demoP.y,30,demoP.ang,false,0,false);
  }else{
    ctx.save();
    if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
    for(var i=0;i<foods.length;i++)drawFood(foods[i]);
    for(i=0;i<enemies.length;i++)drawEnemy(enemies[i]);
    drawPuffer(player.x,player.y,player.inflated?40:26,player.ang,player.inflated,player.swim,player.inv>0&&Math.floor(player.swim*4)%2===0);
    ctx.restore();
  }
  drawParticles();
}
function drawLightBeams(){
  ctx.save();
  ctx.globalAlpha=0.07;ctx.fillStyle='#ffffff';
  var t=performance.now()/1000;
  for(var i=0;i<3;i++){
    var bx=(W*0.25+i*W*0.28+Math.sin(t*0.2+i*2)*30);
    ctx.beginPath();
    ctx.moveTo(bx,-10);
    ctx.lineTo(bx+70,-10);
    ctx.lineTo(bx-60+Math.sin(t*0.3+i)*40,H);
    ctx.lineTo(bx-140+Math.sin(t*0.3+i)*40,H);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawSeaweed(){
  for(var i=0;i<seaweed.length;i++){
    var s=seaweed[i];
    ctx.save();
    ctx.translate(s.x,0);
    ctx.strokeStyle='#1d6a54';ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,H+10);
    var segH=s.h/s.seg;
    ctx.quadraticCurveTo(-8+Math.sin(s.ph)*10,-H+segH*2,0,H-segH*3);
    ctx.stroke();
    ctx.lineWidth=5;ctx.strokeStyle='#2a8a6d';
    ctx.beginPath();ctx.moveTo(0,H+10);
    ctx.quadraticCurveTo(8+Math.sin(s.ph+1.5)*10,-H+segH*3,0,H-segH*3+4);
    ctx.stroke();
    ctx.restore();
  }
}
function drawDecor(){
  for(var i=0;i<decor.length;i++){
    var d=decor[i];
    ctx.save();ctx.translate(d.x,d.y);
    ctx.scale(d.s,d.s);
    if(d.kind==='coral'){
      ctx.fillStyle='#e07a5f';
      for(var b=0;b<3;b++){
        var bx=-12+b*12;
        ctx.beginPath();ctx.arc(bx,-16,9,0,Math.PI*2);ctx.fill();
      }
      ctx.fillRect(-14,-14,28,14);
      ctx.fillStyle='#ef9278';
      ctx.beginPath();ctx.arc(0,-20,5,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#31597a';
      ctx.beginPath();ctx.arc(0,-8,14,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#3d6b8f';
      ctx.beginPath();ctx.arc(-5,-12,8,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}
function drawBubbles(){
  ctx.save();
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    ctx.globalAlpha=0.18+0.1*Math.sin(b.ph);
    ctx.strokeStyle='#d9f4ff';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

/* ===== 角色绘制 ===== */
function drawPuffer(x,y,r,ang,inflated,swim,blink){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(ang+(inflated?Math.sin(swim*0.5)*0.05:0));
  if(blink)ctx.globalAlpha=0.45;

  var bodyR=r*(inflated?1.15:1);
  // 尾巴
  ctx.save();
  var wag=Math.sin(swim)*0.5;
  ctx.rotate(wag*0.6);
  ctx.fillStyle=inflated?'#ff9f43':'#f0b84e';
  ctx.beginPath();
  ctx.moveTo(-bodyR*0.85,0);
  ctx.quadraticCurveTo(-bodyR*1.5,-bodyR*0.55,-bodyR*1.85,-bodyR*0.32);
  ctx.quadraticCurveTo(-bodyR*1.7,0,-bodyR*1.85,bodyR*0.32);
  ctx.quadraticCurveTo(-bodyR*1.5,bodyR*0.55,-bodyR*0.85,0);
  ctx.fill();
  ctx.restore();

  // 腹鳍
  ctx.fillStyle='#ffcf5c';
  ctx.beginPath();
  ctx.moveTo(-bodyR*0.25,bodyR*0.7);
  ctx.quadraticCurveTo(-bodyR*0.7,bodyR*1.25,-bodyR*0.15,bodyR*0.98);
  ctx.quadraticCurveTo(-bodyR*0.05,bodyR*0.85,-bodyR*0.1,bodyR*0.7);
  ctx.fill();

  // 身体
  var grad=ctx.createRadialGradient(-bodyR*0.3,-bodyR*0.25,bodyR*0.2,0,0,bodyR*1.4);
  if(inflated){grad.addColorStop(0,'#ffd98a');grad.addColorStop(1,'#ff9f43')}
  else{grad.addColorStop(0,'#ffdf9e');grad.addColorStop(1,'#f0b84e')}
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.ellipse(0,0,bodyR,bodyR*0.92,0,0,Math.PI*2);
  ctx.fill();

  // 肚皮
  ctx.fillStyle='rgba(255,243,214,.85)';
  ctx.beginPath();
  ctx.ellipse(bodyR*0.1,bodyR*0.45,bodyR*0.55,bodyR*0.34,0,0,Math.PI*2);
  ctx.fill();

  // 斑点
  ctx.fillStyle=inflated?'#d98a2b':'#d99a33';
  var spots=[[-0.35,0.35,0.14],[-0.15,-0.45,0.11],[0.28,0.02,0.1],[-0.05,0.55,0.08]];
  for(var s=0;s<spots.length;s++){
    ctx.beginPath();
    ctx.arc(bodyR*spots[s][0],bodyR*spots[s][1],bodyR*spots[s][2],0,Math.PI*2);
    ctx.fill();
  }

  if(inflated){
    // 刺
    ctx.fillStyle='#fff3d6';
    var spikes=16;
    for(var i=0;i<spikes;i++){
      var a=i/spikes*Math.PI*2+swim*0.2;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(bodyR*0.9,-bodyR*0.14);
      ctx.lineTo(bodyR*1.5,0);
      ctx.lineTo(bodyR*0.9,bodyR*0.14);
      ctx.closePath();ctx.fill();
      ctx.restore();
    }
    // 刺尖高光
    ctx.fillStyle='#fff';
    for(i=0;i<spikes;i+=2){
      var a2=i/spikes*Math.PI*2+swim*0.2;
      ctx.save();ctx.rotate(a2);
      ctx.beginPath();ctx.arc(bodyR*1.38,0,bodyR*0.07,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }

  // 眼睛（看向前方）
  var eyeX=bodyR*0.42,eyeY=-bodyR*0.28,eyeR=bodyR*0.24;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(eyeX,eyeY,eyeR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(eyeX,eyeY+bodyR*0.56,eyeR*0.92,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#24303f';
  var px=Math.cos(ang)*eyeR*0.28;
  ctx.beginPath();ctx.arc(eyeX+px,eyeY+0,eyeR*0.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(eyeX+px,eyeY+bodyR*0.56,eyeR*0.46,0,Math.PI*2);ctx.fill();
  // 高光
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(eyeX+eyeR*0.28,eyeY-eyeR*0.28,eyeR*0.16,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(eyeX+eyeR*0.24,eyeY+bodyR*0.56-eyeR*0.24,eyeR*0.14,0,Math.PI*2);ctx.fill();

  // 嘴
  if(inflated){
    ctx.fillStyle='#c2532f';
    ctx.beginPath();ctx.arc(bodyR*0.55,bodyR*0.18,bodyR*0.2,0,Math.PI*2);ctx.fill();
  }else{
    ctx.strokeStyle='#c2532f';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(bodyR*0.58,bodyR*0.18,bodyR*0.16,0.4,Math.PI-0.4);ctx.stroke();
  }
  // 腮红
  ctx.fillStyle='rgba(255,120,110,.35)';
  ctx.beginPath();ctx.arc(bodyR*0.42,bodyR*0.42,bodyR*0.13,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x,e.y);
  var wobble=e.scared?Math.sin(e.tail*2)*0.25:Math.sin(e.ph)*0.08;
  if(e.type==='shark'){
    ctx.rotate(e.ang+wobble);
    drawShark(e.r,e.scared);
  }else if(e.type==='jelly'){
    ctx.rotate(wobble*0.3);
    drawJelly(e.r,e.ph);
  }else{
    ctx.rotate(wobble);
    drawUrchin(e.r,e.ph);
  }
  ctx.restore();
}
function drawShark(r,scared){
  // 尾鳍
  ctx.fillStyle='#4a6884';
  ctx.beginPath();
  ctx.moveTo(-r*0.75,0);
  ctx.lineTo(-r*1.45,-r*0.6);
  ctx.lineTo(-r*1.15,r*0.08);
  ctx.lineTo(-r*1.45,r*0.6);
  ctx.closePath();ctx.fill();
  // 身体
  var grad=ctx.createLinearGradient(-r,0,r,0);
  grad.addColorStop(0,'#6a8cac');grad.addColorStop(1,'#4f7090');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.ellipse(0,0,r,r*0.52,0,0,Math.PI*2);ctx.fill();
  // 背鳍
  ctx.fillStyle='#3d5a76';
  ctx.beginPath();
  ctx.moveTo(-r*0.15,-r*0.42);
  ctx.lineTo(r*0.12,-r*0.95);
  ctx.lineTo(r*0.45,-r*0.4);
  ctx.closePath();ctx.fill();
  // 肚皮
  ctx.fillStyle='#cfe0ee';
  ctx.beginPath();ctx.ellipse(r*0.1,r*0.3,r*0.7,r*0.22,0,0,Math.PI*2);ctx.fill();
  // 吻部
  ctx.fillStyle='#e8eef4';
  ctx.beginPath();
  ctx.moveTo(r*0.7,-r*0.3);
  ctx.lineTo(r*1.05,-r*0.05);
  ctx.lineTo(r*0.7,r*0.3);
  ctx.closePath();ctx.fill();
  // 牙
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(r*0.72,-r*0.08);ctx.lineTo(r*0.9,-r*0.22);ctx.lineTo(r*0.9,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(r*0.72,r*0.1);ctx.lineTo(r*0.92,r*0.24);ctx.lineTo(r*0.94,r*0.02);ctx.closePath();ctx.fill();
  // 眼（修复：原代码误用未声明变量 e）
  if(scared){
    ctx.strokeStyle='#1c2b3a';ctx.lineWidth=2.4;ctx.lineCap='round';
    var ex=r*0.4,ey=-r*0.2;
    ctx.beginPath();ctx.moveTo(ex-5,ey-5);ctx.lineTo(ex+5,ey+5);ctx.moveTo(ex+5,ey-5);ctx.lineTo(ex-5,ey+5);ctx.stroke();
  }else{
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*0.42,-r*0.18,r*0.13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1c2b3a';ctx.beginPath();ctx.arc(r*0.45,-r*0.18,r*0.065,0,Math.PI*2);ctx.fill();
  }
  // 腮线
  ctx.strokeStyle='rgba(28,43,58,.35)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(r*0.05,-r*0.3);ctx.quadraticCurveTo(-r*0.08,0,r*0.05,r*0.3);ctx.stroke();
}
function drawJelly(r,ph){
  // 触须
  ctx.strokeStyle='rgba(215,185,255,.75)';ctx.lineWidth=2.4;ctx.lineCap='round';
  for(var i=0;i<4;i++){
    var tx=(-r*0.6+i*r*0.4);
    ctx.beginPath();
    ctx.moveTo(tx,r*0.55);
    ctx.quadraticCurveTo(tx+r*0.3*Math.sin(ph*1.5+i),r*1.0,tx,r*1.35);
    ctx.stroke();
  }
  // 伞
  var grad=ctx.createRadialGradient(0,-r*0.2,4,0,0,r*1.1);
  grad.addColorStop(0,'rgba(200,160,255,.85)');
  grad.addColorStop(1,'rgba(140,90,220,.6)');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(-r,0);
  ctx.quadraticCurveTo(-r,-r*1.3,0,-r*1.25);
  ctx.quadraticCurveTo(r,-r*1.3,r,0);
  ctx.closePath();ctx.fill();
  // 伞内纹
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.6;
  for(i=0;i<2;i++){
    ctx.beginPath();ctx.arc(0,-r*0.25,r*0.85+i*r*0.22,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
  }
  // 眼（鼓气状态打叉）
  ctx.fillStyle='#3a2350';
  ctx.beginPath();ctx.arc(-r*0.3,-r*0.45,r*0.09,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.3,-r*0.45,r*0.09,0,Math.PI*2);ctx.fill();
}
function drawUrchin(r,ph){
  // 刺
  ctx.strokeStyle='#8f6fc0';ctx.lineWidth=3;ctx.lineCap='round';
  for(var i=0;i<12;i++){
    var a=i/12*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r*0.8,Math.sin(a)*r*0.8);
    ctx.lineTo(Math.cos(a)*(r*1.7+Math.sin(ph+i)*2),Math.sin(a)*(r*1.7+Math.sin(ph+i)*2));
    ctx.stroke();
  }
  ctx.fillStyle='#7b5ea7';
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.beginPath();ctx.arc(-r*0.3,-r*0.3,r*0.4,0,Math.PI*2);ctx.fill();
  // 眼
  ctx.fillStyle='#241b3a';
  ctx.beginPath();ctx.arc(-r*0.3,-r*0.05,r*0.12,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.3,-r*0.05,r*0.12,0,Math.PI*2);ctx.fill();
}

function drawFood(f){
  ctx.save();
  ctx.translate(f.x,f.y+Math.sin(f.ph+f.x*0.02)*4);
  if(f.type==='shrimp'){
    ctx.rotate(Math.sin(f.ph)*0.3);
    ctx.fillStyle='#ff8fa3';
    ctx.beginPath();
    ctx.moveTo(-12,0);
    ctx.quadraticCurveTo(-6,-10,4,-6);
    ctx.quadraticCurveTo(10,-2,14,4);
    ctx.quadraticCurveTo(4,10,-12,0);
    ctx.fill();
    ctx.fillStyle='#ffb6c4';
    ctx.beginPath();ctx.arc(8,-2,3.4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ff6b85';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-16,-5);ctx.moveTo(-12,0);ctx.lineTo(-16,5);ctx.stroke();
  }else if(f.type==='seaweed'){
    ctx.fillStyle='#7bd88f';
    ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#a9ecb5';
    ctx.beginPath();ctx.arc(-3,-3,4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#4ca86a';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.stroke();
  }else if(f.type==='starfish'){
    ctx.rotate(f.rot);
    ctx.fillStyle='#ffb347';
    ctx.beginPath();
    for(var i=0;i<5;i++){
      var a=i/5*Math.PI*2-Math.PI/2;
      var ax=Math.cos(a)*13,ay=Math.sin(a)*13;
      if(i===0)ctx.moveTo(ax,ay);else ctx.lineTo(ax,ay);
      var a2=a+Math.PI/5;
      ctx.lineTo(Math.cos(a2)*5.5,Math.sin(a2)*5.5);
    }
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd08a';
    ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
  }else{
    // 稀有贝壳
    ctx.fillStyle='#ffe9a8';
    ctx.beginPath();
    ctx.arc(0,0,13,Math.PI,0);
    ctx.quadraticCurveTo(0,16,13,0);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#f2c14e';ctx.lineWidth=1.6;
    for(i=-2;i<=2;i++){
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(i*4,Math.sqrt(Math.max(0,169-i*16)));ctx.stroke();
    }
    ctx.fillStyle='#f2c14e';
    ctx.beginPath();ctx.arc(0,7,2.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var t=p.age/p.life;
    if(p.kind==='dot'){
      ctx.globalAlpha=1-t;
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-t*0.5),0,Math.PI*2);ctx.fill();
    }else if(p.kind==='ring'){
      ctx.globalAlpha=1-t;
      ctx.strokeStyle=p.color;ctx.lineWidth=3.5*(1-t)+1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
    }else if(p.kind==='text'){
      ctx.globalAlpha=1-t*t;
      ctx.fillStyle=p.color;
      ctx.font='700 17px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(p.txt,p.x,p.y);
    }
  }
  ctx.globalAlpha=1;
}

/* ===== 主循环 ===== */
var rafId=null,lastT=0;
function loop(t){
  var dt=Math.min((t-lastT)/1000,0.033);
  lastT=t;
  update(dt);
  draw();
  rafId=requestAnimationFrame(loop);
}
function startLoop(){
  lastT=performance.now();
  rafId=requestAnimationFrame(loop);
}

/* ===== 流程控制 ===== */
function showScreen(id){hideAllScreens();$(id).classList.remove('hidden')}
function hideAllScreens(){
  $('start-screen').classList.add('hidden');
  $('pause-screen').classList.add('hidden');
  $('over-screen').classList.add('hidden');
}
function setControls(show){
  $('hud').classList.toggle('hidden',!show);
  $('touch-zone').classList.toggle('hidden',!show||isTouch);
  $('puff-btn').classList.toggle('hidden',!show||!isTouch);
}
function startGame(){
  resetAll();
  state.mode='playing';
  hideAllScreens();
  setControls(true);
  if(rafId===null)startLoop();
}
function gameOver(){
  state.mode='gameover';
  setControls(false);
  buildLives();
  var isRecord=state.score>state.best;
  if(isRecord){
    state.best=state.score;
    try{localStorage.setItem(BEST_KEY,String(state.best))}catch(e){}
  }
  $('end-score').textContent=state.score;
  $('end-best').textContent=state.best;
  $('record-badge').classList.toggle('hidden',!isRecord);
  showScreen('over-screen');
}
function togglePause(){
  if(state.mode==='playing'){
    state.mode='paused';
    showScreen('pause-screen');
    cancelAnimationFrame(rafId);
    rafId=null;
  }else if(state.mode==='paused'){
    state.mode='playing';
    hideAllScreens();
    startLoop();
  }
}
function togglePuff(){
  if(state.mode!=='playing')return;
  if(player.gauge<=2&&!player.inflated)return;
  player.inflated=!player.inflated;
  if(player.inflated&&player.gauge<=0)player.gauge=1;
}

/* ===== 输入 ===== */
document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','escape','p','w','a','s','d'].indexOf(k)>-1)e.preventDefault();
  if(k==='arrowup'||k==='w')keys.up=true;
  if(k==='arrowdown'||k==='s')keys.down=true;
  if(k==='arrowleft'||k==='a')keys.left=true;
  if(k==='arrowright'||k==='d')keys.right=true;
  if(k===' '){
    if(state.mode==='start')startGame();
    else togglePuff();
  }
  if(k==='enter'&&state.mode==='start')startGame();
  if((k==='escape'||k==='p')&&(state.mode==='playing'||state.mode==='paused'))togglePause();
});
document.addEventListener('keyup',function(e){
  var k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w')keys.up=false;
  if(k==='arrowdown'||k==='s')keys.down=false;
  if(k==='arrowleft'||k==='a')keys.left=false;
  if(k==='arrowright'||k==='d')keys.right=false;
});

// 移动端识别
var isTouch=(('ontouchstart' in window)||(navigator.maxTouchPoints>0));
var joyBase=$('joy-base'),joyKnob=$('joy-knob'),touchZone=$('touch-zone');
touchZone.addEventListener('pointerdown',function(e){
  if(state.mode!=='playing')return;
  joy.active=true;
  joy.sx=e.clientX;joy.sy=e.clientY;joy.dx=0;joy.dy=0;
  joyBase.style.left=(e.clientX-52)+'px';
  joyBase.style.top=(e.clientY-52)+'px';
  joyKnob.style.transform='translate(0px,0px)';
  touchZone.setPointerCapture(e.pointerId);
});
touchZone.addEventListener('pointermove',function(e){
  if(!joy.active)return;
  var dx=e.clientX-joy.sx,dy=e.clientY-joy.sy;
  var m=Math.hypot(dx,dy)||1;
  var d=Math.min(m,48);
  joy.dx=dx/m*d/48;joy.dy=dy/m*d/48;
  joyKnob.style.transform='translate('+Math.round(joy.dx*48)+'px,'+Math.round(joy.dy*48)+'px)';
});
function joyEnd(){
  joy.active=false;joy.dx=0;joy.dy=0;
  joyBase.style.left='52px';joyBase.style.bottom='66px';joyBase.style.top='auto';
  joyKnob.style.transform='translate(0px,0px)';
}
touchZone.addEventListener('pointerup',joyEnd);
touchZone.addEventListener('pointercancel',joyEnd);
$('puff-btn').addEventListener('click',togglePuff);
$('start-btn').addEventListener('click',startGame);
$('again-btn').addEventListener('click',startGame);
$('resume-btn').addEventListener('click',togglePause);
$('restart-btn').addEventListener('click',startGame);
$('pause-btn').addEventListener('click',togglePause);
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&state.mode==='playing')togglePause();
});

<script>
/* HanBer云坛 · 云坛一键登录（强制登录 + 存档按账号隔离） */
(function(){
  try{
    var qs = new URLSearchParams(location.search);
    var u = qs.get('yt_user');
    var logged = u && u !== 'guest';
    if(!logged){
      var ov = document.createElement('div');
      ov.id = 'yt-login-mask';
      ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:linear-gradient(160deg,#101828,#1a2a4a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;gap:14px;text-align:center;padding:20px';
      var t1 = document.createElement('div'); t1.style.cssText = 'font-size:40px'; t1.textContent = '🔒'; ov.appendChild(t1);
      var t2 = document.createElement('div'); t2.style.cssText = 'font-size:18px;font-weight:600'; t2.textContent = '此游戏需云坛一键登录'; ov.appendChild(t2);
      var t3 = document.createElement('div'); t3.style.cssText = 'font-size:13px;color:#9fb3d0;max-width:320px'; t3.textContent = '返回云坛登录后，进入「小程序」再点本游戏即可自动带账号游玩。'; ov.appendChild(t3);
      var btn = document.createElement('button');
      btn.textContent = '去登录';
      btn.style.cssText = 'margin-top:6px;padding:9px 22px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:14px;cursor:pointer';
      btn.onclick = function(){ try{ if(window.parent && window.parent.location){ window.parent.location.hash = '#/login'; } }catch(e){} };
      ov.appendChild(btn);
      document.body.appendChild(ov);
      return;
    }
    var el = document.createElement('div');
    el.id = 'yt-login-bar';
    el.style.cssText = 'position:fixed;top:8px;right:8px;z-index:99999;display:flex;align-items:center;gap:6px;background:rgba(10,14,26,.74);color:#fff;padding:5px 8px 5px 12px;border-radius:20px;font:12px/1 "PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.16);max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    var b1 = document.createElement('b'); b1.style.color = '#7cc4ff'; b1.textContent = String(u).replace(/[<>&]/g, '');
    var b2 = document.createElement('span'); b2.textContent = '✕'; b2.style.cssText = 'cursor:pointer;opacity:.65;margin-left:6px;font-size:11px';
    b2.title = '关闭';
    b2.onclick = function(){ var bar = document.getElementById('yt-login-bar'); if(bar) bar.remove(); };
    el.appendChild(document.createTextNode('👤 云坛登录：')); el.appendChild(b1); el.appendChild(b2);
    document.body.appendChild(el);
    window.YT_USER = u;
    window.YT_LOGGED = true;
    /* 存档按账号隔离：所有 localStorage 自动带账号前缀，旧档自动迁移 */
    var pre = '_yt_' + u + '_';
    var g = Storage.prototype.getItem, sw = Storage.prototype.setItem, r = Storage.prototype.removeItem;
    Storage.prototype.getItem = function(k){
      if(typeof k !== 'string' || k.indexOf(pre) === 0) return g.call(this, k);
      var scoped = g.call(this, pre + k);
      if(scoped !== null) return scoped;
      var legacy = g.call(this, k);
      if(legacy !== null){ try{ sw.call(this, pre + k, legacy); r.call(this, k); }catch(e){} }
      return legacy;
    };
    Storage.prototype.setItem = function(k, v){
      if(typeof k === 'string' && k.indexOf(pre) !== 0){ try{ sw.call(this, pre + k, v); }catch(e){} }
      else{ try{ sw.call(this, k, v); }catch(e){} }
    };
    Storage.prototype.removeItem = function(k){
      if(typeof k === 'string'){ r.call(this, pre + k); r.call(this, k); }
      else r.call(this, k);
    };
  }catch(e){}
})();
</script>
