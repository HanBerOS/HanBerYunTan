<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HanBer SEVEN · 雾海纪元</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===== 设计基调：1900 甲午逆转世界 · 海雾墨青 =====
   深海墨青底 / 宣纸面板 / 朱砂印章 / 铜金纹路 / 海雾波纹
   ================================================ */
:root{
  --ink:#101E26; --ink2:#18303A; --ink3:#2A4750;
  --sea:#6E8FA0; --seaL:#9DBCC8; --fog:#8FA6AE;
  --paper:#EAE0C6; --paper2:#DDD0AE; --paper3:#F4EBD6;
  --brass:#B08A4F; --brass2:#87642F;
  --ver:#B43C2A; --ver2:#8C2B1D;          /* 朱砂 */
  --jade:#5E7D6E; --gold:#C9A44B;
  --ok:#3F6B3F; --bad:#A33B2E;
  --panel:rgba(236,228,202,.97);
  --panel2:rgba(211,196,158,.92);
  --line:2px solid var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0B151B}
body{
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none; touch-action:none;
}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#081318;image-rendering:auto}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}
.hidden{display:none!important}

/* ===== 通用面板与按钮 ===== */
.panel{
  background:var(--panel); border:var(--line);
  box-shadow:5px 5px 0 rgba(8,19,24,.42), inset 0 0 0 3px rgba(176,138,79,.28);
  border-radius:3px; padding:14px 16px; position:relative;
}
.panel::before,.panel::after{
  content:""; position:absolute; width:18px; height:18px;
  border:2px solid var(--ver); pointer-events:none;
}
.panel::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.panel::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.btn{
  display:inline-block; min-width:104px; padding:10px 18px; margin:5px;
  font-family:inherit; font-size:16px; font-weight:700; color:var(--paper3);
  background:linear-gradient(180deg,#CB9D4B,#8F6A22);
  border:1px solid #5C4313; border-bottom:3px solid #5C4313;
  border-radius:3px; cursor:pointer; letter-spacing:.14em;
  box-shadow:0 2px 0 rgba(0,0,0,.3); text-align:center;
  transition:transform .06s, filter .14s;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.ghost{background:transparent;color:var(--paper3);border:1px solid var(--seaL);border-bottom:3px solid var(--seaL);box-shadow:none}
.btn.ghost:hover{background:rgba(110,143,160,.18)}
.btn.danger{background:linear-gradient(180deg,#C0563F,#8C2B1D);border-color:#5C1C15}
.btn.jade{background:linear-gradient(180deg,#77907F,#4C6355);border-color:#2E4036}
.btn.small{min-width:70px;padding:6px 10px;font-size:14px;letter-spacing:.06em}
.btn.mini{min-width:52px;padding:3px 8px;font-size:12px;letter-spacing:.02em}
.btn:disabled{opacity:.45;cursor:not-allowed}
h2.pTitle{font-size:26px;letter-spacing:.4em;text-align:center;color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
h3.pTitle{font-size:18px;letter-spacing:.25em;color:var(--ink)}
.sep{height:2px;background:linear-gradient(90deg,transparent,var(--brass),transparent);margin:8px 0}
.mute{color:#5E5340;font-size:13px}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}

/* ===== 顶栏 HUD ===== */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(8,19,24,.94),rgba(8,19,24,.72)); padding:6px 10px; border-bottom:2px solid rgba(176,138,79,.6);}
#hud .hL{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#hud .hR{display:flex;align-items:center;gap:6px}
#hud .stat{color:var(--paper3);font-size:14px;letter-spacing:.08em}
#hud .stat b{color:var(--gold);font-weight:700}
#hud .stat.warn b{color:#E0A65A}
#hud .stat.crit b{color:#E05555;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#hud .btn{padding:5px 10px;font-size:13px;min-width:52px}

/* ===== 底部快捷栏 ===== */
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;
  background:linear-gradient(0deg,rgba(8,19,24,.94),rgba(8,19,24,.6)); padding:7px 8px; border-top:2px solid rgba(176,138,79,.55); flex-wrap:wrap}

/* ===== 悬浮面板容器 ===== */
#pop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,12,16,.55);z-index:30}
#pop .panel{max-width:min(92vw,720px);max-height:86vh;overflow:auto;width:92vw}
#pop.full .panel{max-width:min(96vw,900px)}

/* ===== 标题界面 ===== */
#boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:40;
  background:radial-gradient(ellipse at 50% 30%,#12303C 0%,#0B1B22 55%,#060E13 100%)}
#boot .mists{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.mistline{position:absolute;left:-20%;right:-20%;height:34px;background:linear-gradient(180deg,transparent,rgba(158,189,200,.16),rgba(158,189,200,.3),rgba(158,189,200,.16),transparent);
  animation:mistDrift linear infinite}
@keyframes mistDrift{0%{transform:translateY(-6vh);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(106vh);opacity:0}}
#boot .titleT{font-size:clamp(34px,7vw,64px);font-weight:900;letter-spacing:.22em;color:var(--paper3);text-shadow:0 0 26px rgba(157,188,200,.55), 3px 3px 0 var(--ink);position:relative;z-index:2}
#boot .titleS{font-size:clamp(15px,2.4vw,22px);letter-spacing:.6em;color:var(--gold);position:relative;z-index:2;margin-top:2px}
#boot .titleSub{font-size:13px;letter-spacing:.3em;color:var(--seaL);position:relative;z-index:2;margin-top:10px}
#boot .menu{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;margin-top:26px;gap:2px}
#boot .menu .btn{min-width:230px;font-size:18px}
#boot .ver{position:absolute;bottom:10px;right:14px;color:rgba(158,189,200,.55);font-size:12px;z-index:2}
#boot .warnBar{position:absolute;bottom:12px;left:14px;color:rgba(158,189,200,.5);font-size:11px;z-index:2}

/* ===== 对话框 ===== */
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:14%;width:min(94vw,860px);z-index:25;padding:0}
#dlg .speaker{display:inline-block;background:var(--ver);color:var(--paper3);padding:4px 14px;font-size:15px;letter-spacing:.2em;border:1px solid var(--ver2);border-bottom:none;border-radius:3px 3px 0 0}
#dlg .speaker.me{background:var(--ink3)}
#dlg .body{background:var(--panel);border:var(--line);border-radius:0 3px 3px 3px;padding:16px 20px;min-height:96px;box-shadow:5px 5px 0 rgba(5,12,16,.5)}
#dlg .text{font-size:17px;line-height:1.85;white-space:pre-wrap;min-height:60px}
#dlg .choices{margin-top:10px;display:flex;flex-direction:column;align-items:stretch;gap:6px}
#dlg .choices .btn{text-align:left;font-size:15px}
#dlg .tip{position:absolute;right:16px;bottom:10px;color:#6E6250;font-size:12px}

/* ===== 章节卡 ===== */
#chapter{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#12303C 0%,#0A1920 70%,#050C11 100%)}
#chapter .no{font-size:16px;letter-spacing:.5em;color:var(--gold);margin-bottom:6px}
#chapter .t{font-size:clamp(30px,6vw,52px);font-weight:900;letter-spacing:.3em;color:var(--paper3);text-shadow:0 0 22px rgba(157,188,200,.5)}
#chapter .sub{font-size:14px;letter-spacing:.4em;color:var(--seaL);margin-top:12px}
#chapter .lines{margin-top:26px;max-width:640px;padding:0 24px;font-size:16px;line-height:2.1;color:var(--paper2);text-align:center;letter-spacing:.08em;white-space:pre-wrap;max-height:40vh;overflow:auto}
#chapter .btn{margin-top:30px}
#chapter .suspense{max-width:600px;padding:14px 20px;border:1px dashed var(--gold);color:var(--gold);background:rgba(176,138,79,.08);font-size:15px;line-height:1.9;margin-top:18px;letter-spacing:.06em}

/* ===== 战斗界面 ===== */
#btl{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;background:rgba(5,12,16,.8)}
#btl .stage{flex:1;position:relative;min-height:180px;overflow:hidden}
#btl .unit{position:absolute;text-align:center;color:var(--paper3)}
#btl .unit .hp{width:120px;height:8px;background:#3A1414;border:1px solid #000;margin:2px auto 0}
#btl .unit .hp i{display:block;height:100%;background:linear-gradient(180deg,#7BC07B,#2F7A2F)}
#btl .unit.enemy .hp i{background:linear-gradient(180deg,#D97A5A,#9E2F1D)}
#btl .log{height:96px;overflow:auto;background:rgba(10,20,26,.92);border-top:2px solid rgba(176,138,79,.5);padding:8px 14px;color:var(--paper2);font-size:14px;line-height:1.7}
#btl .cmd{display:flex;justify-content:center;gap:8px;padding:10px;flex-wrap:wrap}

/* ===== 列表 / 表格 ===== */
.listItem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(39,33,26,.25);cursor:pointer}
.listItem:hover{background:rgba(176,138,79,.16)}
.listItem .nm{font-weight:700;font-size:15px}
.listItem .ds{font-size:12px;color:#5E5340;margin-top:2px}
.listItem .rt{font-size:13px;color:var(--ver2);white-space:nowrap}

/* ===== 世界地图卡 ===== */
#cityCard{position:absolute;right:14px;top:58px;width:min(92vw,330px);z-index:20}
#cityCard .row{margin-top:6px}

/* ===== 场景交互提示 ===== */
#hint{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:15;
  background:rgba(8,19,24,.85);color:var(--paper3);padding:6px 16px;font-size:14px;letter-spacing:.15em;border:1px solid var(--brass);border-radius:3px;pointer-events:none}

/* ===== 虚拟方向键 ===== */
#dpad{position:absolute;left:12px;bottom:86px;z-index:15;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px}
#dpad button{background:rgba(8,19,24,.8);border:1px solid var(--seaL);color:var(--paper3);font-size:20px;border-radius:4px;cursor:pointer}
#dpad .up{grid-column:2}
#dpad .left{grid-column:1;grid-row:2}
#dpad .down{grid-column:2;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}

/* ===== 输入框 ===== */
input.txt{width:100%;padding:10px 12px;font-family:inherit;font-size:16px;background:var(--paper3);border:1px solid var(--ink);border-radius:2px;color:var(--ink)}
select.txt{width:100%;padding:9px 12px;font-family:inherit;font-size:15px;background:var(--paper3);border:1px solid var(--ink);border-radius:2px}
label.lbl{font-size:13px;color:#5E5340;letter-spacing:.1em}

/* ===== 小工具 ===== */
.gauge{height:10px;background:#CFC3A2;border:1px solid var(--ink);position:relative;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(180deg,#7BC07B,#3F7A3F)}
.gauge i.mid{background:linear-gradient(180deg,#E0C65A,#A8872F)}
.gauge i.low{background:linear-gradient(180deg,#E08A5A,#A84F2F)}
.gauge i.rep{background:linear-gradient(180deg,#7BA8C0,#3F6A7A)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;background:var(--ink3);color:var(--paper3);font-size:11px;padding:2px 8px;border-radius:2px;letter-spacing:.12em;margin:1px}
.tag.gold{background:var(--brass2)}
.tag.ver{background:var(--ver)}
#errBox{position:fixed;left:8px;bottom:8px;max-width:70vw;z-index:99;background:#7C2C22;color:#FFF;font-size:12px;padding:6px 10px;border-radius:3px;display:none;white-space:pre-wrap}
/* ===== 运行时元素 ID 样式（与脚本创建的元素一一对应） ===== */
#bootEl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:40;background:radial-gradient(ellipse at 50% 30%,#12303C 0%,#0B1B22 55%,#060E13 100%)}
#charEl{position:absolute;inset:0;z-index:38}
#hudEl{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(8,19,24,.94),rgba(8,19,24,.72));padding:6px 10px;border-bottom:2px solid rgba(176,138,79,.6);z-index:18}
#hudEl .hL{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#hudEl .hR{display:flex;align-items:center;gap:6px}
#dockEl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;background:linear-gradient(0deg,rgba(8,19,24,.94),rgba(8,19,24,.6));padding:7px 8px;border-top:2px solid rgba(176,138,79,.55);flex-wrap:wrap;z-index:18}
#cityCardEl{position:absolute;right:14px;top:58px;width:min(92vw,330px);z-index:20}
#hintEl{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(8,19,24,.85);color:var(--paper3);padding:6px 16px;font-size:14px;letter-spacing:.15em;border:1px solid var(--brass);border-radius:3px;pointer-events:none}
#dpadEl{position:absolute;left:12px;bottom:86px;z-index:15;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px}
#dpadEl button{background:rgba(8,19,24,.8);border:1px solid var(--seaL);color:var(--paper3);font-size:20px;border-radius:4px;cursor:pointer}
.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(8,19,24,.92);color:var(--paper3);padding:8px 20px;border:1px solid var(--gold);border-radius:3px;font-size:14px;letter-spacing:.1em;z-index:50;animation:toastIn .25s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
<style id="hanber-soviet-skin">
/* === HanBer 统一皮肤 · 后苏联忧郁美学 (Post-Soviet Melancholy) === */
html,body{
  background-color:#15181e !important;
  background-image:
    radial-gradient(ellipse at 50% -5%, rgba(201,168,106,.10), transparent 55%),
    linear-gradient(165deg,#11141a 0%,#1a1f28 48%,#231d15 100%) !important;
  color:#d6cdb8 !important;
}
#hanber-vignette{position:fixed;inset:0;z-index:99998;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,.55) 100%);}
</style>
<div id="hanber-vignette"></div>

<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="errBox"></div>
<script>
/* ============================================================
   HanBer SEVEN · 核心工具与全局容器
   1900 甲午逆转世界 · 雾海纪元
   ============================================================ */
(function(){
  var eb = document.getElementById('errBox');
    window.addEventListener('error', function(e){
    var m = String(e.message||e.error||'未知错误');
    eb.style.display = 'block';
    eb.textContent = '运行错误: ' + m;
    console.error(m, e.error);
  });
})();

var VER = 'SEVEN v1.0.0';
var $ = function(id){ return document.getElementById(id); };
function qs(sel, root){ return (root||document).querySelector(sel); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rand(a,b){ return a + Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(rand(a,b+1)); }
function chance(p){ return Math.random() < p; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function moneys(v){
  v = Math.round(v);
  if(v<0) return '欠' + (-v) + '两';
  return v + '两';
}
function fmtDay(d){
  var dt = new Date(1900, 3, 1);
  dt.setDate(dt.getDate() + (d-1));
  var y = dt.getFullYear();
  var gz = (y-4)%10, zz = (y-4)%12;
  var GAN = '甲乙丙丁戊己庚辛壬癸', ZHI = '子丑寅卯辰巳午未申酉戌亥';
  var mon = dt.getMonth()+1, day = dt.getDate();
  return GAN[gz] + ZHI[zz] + '年 ' + mon + '月' + day + '日';
}
function fmtDateLong(d){
  return fmtDay(d) + ' · 第' + d + '日';
}
function log(){ if(window.console) console.log.apply(console, arguments); }

/* ---- 全局数据容器（后续脚本填充） ---- */
var D = {
  locations: {},      // id -> {..}
  locOrder: [],       // 显示顺序
  routes: [],         // [ [a,b], ... ]
  npcs: {},           // id -> {..}
  npcOrder: [],
  items: {},          // 物品
  enemies: {},        // 敌人
  goods: {},          // 贸易货物
  jobs: {},           // 职业
  events: [],         // 随机事件
  achievements: [],   // 成就
  buildings: {}       // 建筑原型(设施种类)
};
var STORY = [];       // 主线章节（story 脚本填充）

/* ---- 配置 ---- */
var CFG = {
  startMoney: 20,
  startDay: 1,
  capStam: 100, capHunger: 100, capHealth: 100,
  capacity: 30,               // 初始负重
  saveKey: 'hanber7_save_',
  saveMetaKey: 'hanber7_meta'
};

</script>

/* 重算称号 */
function titleFor(rep){
  if(rep>=9000)return '一等公';
  if(rep>=7000)return '三品大员';
  if(rep>=5000)return '五品大夫';
  if(rep>=3500)return '七品县尊';
  if(rep>=2000)return '九品吏员';
  if(rep>=1000)return '监生';
  if(rep>=500)return '乡贤';
  return '白身';
}
function cargoWeight(s){
  var w=0;
  for(var k in s.cargo){ w += D.goods[k].wt*s.cargo[k]; }
  return w;
}
function capacityOf(s){
  var c = CFG.capacity;
  if(s.martial>=40) c+=12;
  if(s.martial>=20) c+=6;
  if(titleFor(s.rep)==='一等公') c+=8;
  return c;
}
function compBonus(s){
  var b={martial:0,intel:0,charm:0,health:0,hp:0,rep:0};
  s.companions.forEach(function(id){
    var c = D.npcs[id] && D.npcs[id].comp;
    if(!c) return;
    for(var k in c){ b[k]=(b[k]||0)+c[k]; }
  });
  return b;
}
function maxHp(s){
  var cb = compBonus(s);
  return 50 + (s.martial+cb.martial)*2 + (D.items[s.equip.armor].st.def||0)*6 + (cb.hp||0);
}
function atkBonus(s){
  var cb = compBonus(s);
  return (s.martial+cb.martial) + (D.items[s.equip.weapon].st.atk||0) + Math.floor((s.intel+cb.intel)/5);
}
function defOf(s){
  var cb = compBonus(s);
  return (D.items[s.equip.armor].st.def||0) + Math.floor((s.martial+cb.martial)/10);
}
function intelOf(s){ return s.intel + compBonus(s).intel; }
function charmOf(s){ return s.charm + compBonus(s).charm; }

function paintWorld(){

    if(sea){ wctx.setLineDash([6,4]); } else { wctx.setLineDash([]); }

function isSeaRoute(r){
  var a = D.locations[r[0]], b = D.locations[r[1]];
  var s1 = (a.fac.indexOf('wharf')>=0 || a.type==='港口'||a.type==='军港'||a.type==='异邦');
  var s2 = (b.fac.indexOf('wharf')>=0 || b.type==='港口'||b.type==='军港'||b.type==='异邦');
  return (s1&&s2) ? true : false;
}
function bfsPath(from, to){
  if(from===to) return [from];
  var q=[from], prev={}, seen={}; seen[from]=1;
  while(q.length){
    var cur = q.shift();
    var nbs = D.adj[cur]||[];
    for(var i=0;i<nbs.length;i++){
      var nx = nbs[i];
      if(seen[nx]) continue;
      seen[nx]=1; prev[nx]=cur; q.push(nx);
      if(nx===to){
        var path=[to], c=to;
        while(prev[c]){ c=prev[c]; path.unshift(c); }
        return path;
      }
    }
  }
  return null;
}
function reachableCities(){
  var out = [];
  D.locOrder.forEach(function(id){
    if(id===S.loc) return;
    if(bfsPath(S.loc, id)) out.push(id);
  });
  return out;
}

function worldPointToTile(mx, my){
  var scale = Math.min(LOGIC_W/1000, (LOGIC_H-40)/620);
  var w = 1000*scale, h = 620*scale;
  var ox = (LOGIC_W-w)/2, oy = (LOGIC_H-h)/2 + 10;
  var tx = (mx-ox)/scale/10, ty = (my-oy)/scale/10;
  var best=null, bd=999;
  D.locOrder.forEach(function(id){
    var l = D.locations[id];
    var dx = l.x-tx, dy = l.y-ty;
    var d = dx*dx+dy*dy;
    if(d < bd){ bd = d; best = id; }
  });
  if(bd <= 25) return best;
  return null;
}

  var slotIdx = 0;
  var SLOTS = [
    [3,3,4,2],[8,3,4,2],[16,3,4,2],[21,3,3,2],
    [3,12,4,2],[8,12,4,2],[16,12,4,2],[21,12,3,2],
    [3,15,4,2],[8,15,4,2],[16,15,4,2],[21,15,3,2],
    [3,5,3,2],[20,5,3,2],[6,5,3,2],[18,5,3,2],
    [3,8,3,2],[20,8,3,2]
  ];
  loc.fac.forEach(function(k){
    var b = D.buildings[k];
    if(!b) return;
    var s = SLOTS[slotIdx % SLOTS.length]; slotIdx++;
    var bx = s[0], by = s[1], bw = s[2], bh = s[3];
    buildings.push({kind:k, nm:b.nm, ic:b.ic, x:bx, y:by, w:bw, h:bh,
      door:{x:bx+Math.floor(bw/2), y:by+bh}});
    for(var yy=by; yy<by+bh; yy++){ for(var xx=bx; xx<bx+bw; xx++){ tiles[yy][xx]=5; } }
  });
  /* NPC 放置（主要人物 + 填充百姓） */
  var npcIds = (CITY_NPC[locId]||[]).slice();
  npcIds = npcIds.concat(genNpcsFor(locId));
  var npcs = [];
  var nn = hashStr(locId+'npc');
  npcIds.forEach(function(id){
    var n = D.npcs[id]; if(!n) return;
    var nx, ny, guard=0;
    do{
      nx = Math.abs(nn)%W; nn=(nn*2654435761)|0;
      ny = Math.abs(nn)%H; nn=(nn*2654435761)|0;
      guard++;
      if(guard>40) break;
    } while(tiles[ny][nx]!==0 && tiles[ny][nx]!==1);
    if(tiles[ny][nx]===0||tiles[ny][nx]===1){
      npcs.push({id:id, x:nx*TILE+10, y:ny*TILE+8, dir:1, frame:0});
    }
  });
  scene = {loc:locId, tiles:tiles, w:W, h:H, buildings:buildings, npcs:npcs,
    spawn:{x:13*TILE-8, y:9*TILE+8}, px:13*TILE-8, py:9*TILE+8, frame:0, facing:2, t:0};
}
function tileAt(x,y){
  if(!scene) return 5;
  var tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
  if(tx<0||ty<0||tx>=scene.w||ty>=scene.h) return 5;
  return scene.tiles[ty][tx];
}
function walkable(x,y){
  var t = tileAt(x,y);
  if(t===2||t===4||t===5) return false;
  return true;
}
function drawScene(dt, t){
  var offX = (LOGIC_W - scene.w*TILE)/2;
  var offY = (LOGIC_H - scene.h*TILE)/2;
  ctx.fillStyle = '#081318'; ctx.fillRect(0,0,LOGIC_W,LOGIC_H);
  ctx.save();
  ctx.translate(offX, offY);
  /* 地面 */
  for(var y=0;y<scene.h;y++){
    for(var x=0;x<scene.w;x++){
      var tt = scene.tiles[y][x];
      var col = tt===1 ? '#C9B98A' : tt===2 ? '#5F8BA0' : tt===3 ? '#D6C79A' : '#9DB07E';
      var hv = (hashStr(scene.loc+'_'+x+'_'+y))%40;
      if(tt===0) col = (hv>25)?'#A3B584':'#9DB07E';
      if(tt===1) col = (hv>30)?'#D0C093':'#C9B98A';
      ctx.fillStyle = col;
      ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
      if(tt===0&&hv%7===0){ ctx.fillStyle='rgba(90,120,80,.25)'; ctx.fillRect(x*TILE+6,y*TILE+14,3,3); }
    }
  }
  /* 水波纹 */
  ctx.strokeStyle = 'rgba(220,235,240,.25)';
  for(var y=0;y<scene.h;y++){
    for(var x=0;x<scene.w;x++){
      if(scene.tiles[y][x]===2){
        ctx.beginPath();
        ctx.arc(x*TILE+15, y*TILE+15, 4+Math.sin(t/500 + x+y)*2, 0, 6.2832);
        ctx.stroke();
      }
    }
  }
  /* 建筑 */
  scene.buildings.forEach(function(b){
    var bx = b.x*TILE, by = b.y*TILE, bw = b.w*TILE, bh = b.h*TILE;
    ctx.fillStyle = '#8A7A5C';
    ctx.fillRect(bx, by, bw, bh-6);
    ctx.fillStyle = '#6E4F2E';
    ctx.beginPath();
    ctx.moveTo(bx-3, by); ctx.lineTo(bx+bw+3, by); ctx.lineTo(bx+bw+3, by-14);
    ctx.lineTo(bx, by-22); ctx.lineTo(bx-3, by-14); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(234,224,198,.92)';
    ctx.font = '13px "Noto Serif SC",serif';
    ctx.textAlign = 'center';
    ctx.fillText(b.ic, bx+bw/2, by+bh/2);
    /* 门 */
    ctx.fillStyle = '#4F3B22';
    var dx = b.door.x*TILE, dy = b.door.y*TILE;
    ctx.fillRect(dx, dy-6, 12, 8);
  });
  /* 交互高亮 */
  var near = nearestInteract();
  if(near){
    var ix, iy;
    if(near.type==='npc'){ var np = npcSprite(near.id); ix=np.x+15; iy=np.y+14; }
    else { ix = near.obj.door.x*TILE+6; iy = near.obj.door.y*TILE+4; }
    ctx.strokeStyle = 'rgba(180,60,42,.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ix, iy, 16+Math.sin(t/260)*3, 0, 6.2832); ctx.stroke();
  }
  /* NPC */
  scene.npcs.forEach(function(n){
    drawPerson(ctx, n.x, n.y, D.npcs[n.id].col, D.npcs[n.id].nm, n.dir, n.frame, false, t);
    if(isStoryMarkNPC(n.id)){
      ctx.fillStyle = '#B43C2A';
      ctx.font = 'bold 18px "Noto Serif SC",serif';
      ctx.fillText('!', n.x+16, n.y-6);
    }
  });
  /* 玩家 */
  var cb = compBonus(S);
  drawPerson(ctx, scene.px, scene.py, S.gender==='女'?['#7A4A68','#B08A9A','#EAE0C6']:['#18303A','#2A5560','#EAE0C6'], S.name, scene.facing, scene.frame, true, t);
  ctx.restore();
}
function npcSprite(id){
  for(var i=0;i<scene.npcs.length;i++){
    if(scene.npcs[i].id===id) return scene.npcs[i];
  }
  return null;
}
function drawPerson(c, x, y, col, nm, dir, frame, isP, t){
  var bob = Math.sin(t/260 + x)*1.2;
  /* 影 */
  c.fillStyle = 'rgba(0,0,0,.18)';
  c.beginPath(); c.ellipse(x+16, y+27, 9, 3.5, 0, 0, 6.2832); c.fill();
  /* 身体 */
  c.fillStyle = col[1];
  c.fillRect(x+10, y+12, 12, 15);
  /* 头 */
  c.fillStyle = col[0];
  c.fillRect(x+9, y+2, 14, 12);
  c.fillStyle = '#D9B48A';
  c.fillRect(x+11, y+5, 10, 9);
  /* 头发 */
  c.fillStyle = col[0];
  c.fillRect(x+9, y+2, 14, 5);
  /* 腿 */
  c.fillStyle = col[2];
  c.fillRect(x+11, y+27, 5, 5);
  c.fillRect(x+17, y+27, 5, 5);
  if(isP){
    c.fillStyle = '#B43C2A';
    c.font = 'bold 11px "Noto Serif SC",serif';
    c.textAlign = 'center';
    c.fillText('你', x+16, y+42);
  } else {
    c.fillStyle = 'rgba(240,235,214,.85)';
    c.font = '10px "Noto Serif SC",serif';
    c.textAlign = 'center';
    c.fillText(nm, x+16, y+42);
  }
}
function nearestInteract(){
  if(!scene) return null;
  var best=null, bd=48*48;
  scene.npcs.forEach(function(n){
    var dx = (n.x+16)-(scene.px+16), dy = (n.y+14)-(scene.py+14);
    var d = dx*dx+dy*dy;
    if(d<bd){ bd=d; best={type:'npc', id:n.id, d:d}; }
  });
  scene.buildings.forEach(function(b){
    var dx = (b.door.x*TILE+6)-(scene.px+16), dy = (b.door.y*TILE+4)-(scene.py+14);
    var d = dx*dx+dy*dy;
    if(d<bd){ bd=d; best={type:'bld', obj:b, d:d}; }
  });
  return best;
}
function sceneMove(dt){
  var sp = 120*dt;
  var dx=0, dy=0;
  if(KEYS['arrowleft']||KEYS['a']||dpadDir.l) dx-=1;
  if(KEYS['arrowright']||KEYS['d']||dpadDir.r) dx+=1;
  if(KEYS['arrowup']||KEYS['w']||dpadDir.u) dy-=1;
  if(KEYS['arrowdown']||KEYS['s']||dpadDir.d) dy+=1;
  if(dx!==0||dy!==0){
    scene.facing = dx<0?0:(dx>0?1:(dy<0?2:3));
    scene.frame = (scene.frame+1)%2;
  }
  if(dx!==0){
    var nx = scene.px + dx*sp;
    if(walkable(nx+6, scene.py+8) && walkable(nx+24, scene.py+8) && walkable(nx+6, scene.py+26) && walkable(nx+24, scene.py+26)) scene.px = nx;
  }
  if(dy!==0){
    var ny = scene.py + dy*sp;
    if(walkable(scene.px+6, ny+8) && walkable(scene.px+24, ny+8) && walkable(scene.px+6, ny+26) && walkable(scene.px+24, ny+26)) scene.py = ny;
  }
  scene.px = clamp(scene.px, 0, scene.w*TILE-30);
  scene.py = clamp(scene.py, 0, scene.h*TILE-30);
}

/* ================= 对话引擎 ================= */
var dlgState = null;
function startDialog(lines, opts){
  opts = opts||{};
  closePop();
  dlgState = {lines:lines, idx:0, choices:opts.choices||null, onEnd:opts.onEnd||null,
    speaker:opts.speaker||null, typing:0, done:false};
  buildDlg();
  setScreen('dlg');
}
function renderLine(){
  if(!dlgState) return;
  var l = dlgState.lines[dlgState.idx];
  var txt = String(l.t||'').replace(/\{name\}/g, S.name).replace(/\{money\}/g, moneys(S.money)).replace(/\{city\}/g, D.locations[S.loc].nm);
  var el = $('dlgText'), sp = $('dlgSpeaker');
  if(sp){ sp.textContent = l.n||''; sp.className = 'speaker' + (l.n==='你'?' me':''); }
  if(!dlgState.done && dlgState.typing < txt.length){
    dlgState.typing = Math.min(txt.length, dlgState.typing + 30*(1+S.textSpeed));
    el.textContent = txt.slice(0, dlgState.typing);
    if(dlgState.typing < txt.length){ return; }
  }
  el.textContent = txt;
  dlgState.done = true;
  if(dlgState.choices){
    buildChoices(dlgState.choices);
  } else {
    var ch = $('dlgChoices');
    ch.innerHTML = '<button class="btn ghost" onclick="dlgNext()">继续 ▶</button>';
  }
}
function buildDlg(){
  var ui = $('ui');
  var old = $('dlg'); if(old) old.remove();
  var d = document.createElement('div');
  d.id = 'dlg';
  d.innerHTML = '<div id="dlgSpeaker" class="speaker"></div>' +
    '<div class="body"><div id="dlgText" class="text"></div><div id="dlgChoices" class="choices"></div></div>' +
    '<div class="tip">空格 / 点击继续 · Esc 跳过</div>';
  ui.appendChild(d);
  setScreen('dlg');
  renderLine();
}
function buildChoices(list){
  var ch = $('dlgChoices');
  ch.innerHTML = '';
  list.forEach(function(c, i){
    var b = document.createElement('button');
    b.className = 'btn ghost';
    b.textContent = String(c.t).replace(/\{name\}/g, S.name);
    b.setAttribute('onclick', 'dlgChoice('+i+')');
    ch.appendChild(b);
  });
}
function dlgNext(){
  if(!dlgState) return;
  if(!dlgState.done){ dlgState.done = true; dlgState.typing = 99999; renderLine(); return; }
  if(dlgState.choices) return;
  dlgState.idx++;
  if(dlgState.idx >= dlgState.lines.length){
    var onEnd = dlgState.onEnd;
    dlgState = null;
    removeDlg();
    if(onEnd) onEnd();
    return;
  }
  dlgState.done = false; dlgState.typing = 0;
  renderLine();
}
function dlgChoice(i){
  if(!dlgState) return;
  var c = dlgState.choices[i];
  if(!c) return;
  var onEnd = dlgState.onEnd;
  var goto = c.goto;
  dlgState = null;
  removeDlg();
  if(c.fx) applyFx(c.fx);
  if(c.fxFn) c.fxFn(S);
  if(onEnd) onEnd(goto);
}
function removeDlg(){ var d = $('dlg'); if(d) d.remove(); }
function dlgSkip(){ if(dlgState){ dlgState.done=true; dlgState.typing=99999; renderLine(); } }

/* 效果应用 */
function applyFx(fx){
  if(!fx) return;
  if(fx.money) S.money += fx.money;
  if(fx.rep) S.rep = Math.max(0, S.rep + fx.rep);
  if(fx.martial) S.martial = clamp(S.martial+fx.martial, 1, 99);
  if(fx.intel) S.intel = clamp(S.intel+fx.intel, 1, 99);
  if(fx.charm) S.charm = clamp(S.charm+fx.charm, 1, 99);
  if(fx.health) S.health = clamp(S.health+fx.health, 0, 100);
  if(fx.stamina) S.stamina = clamp(S.stamina+fx.stamina, 0, 100);
  if(fx.hunger) S.hunger = clamp(S.hunger+fx.hunger, 0, 100);
  if(fx.item) addItem(fx.item);
  if(fx.items) fx.items.forEach(addItem);
  if(fx.flag) setFlag(fx.flag);
  if(fx.flags) fx.flags.forEach(setFlag);
  if(fx.favor){ for(var k in fx.favor){ changeFavor(k, fx.favor[k]); } }
  if(fx.comp && S.companions.indexOf(fx.comp)<0){ S.companions.push(fx.comp); toast(D.npcs[fx.comp].nm + ' 加入了你的队伍。'); }
  if(fx.npcCity){ for(var k2 in fx.npcCity){ var n=D.npcs[k2]; if(n) n.city = fx.npcCity[k2]; } }
  if(fx.title) S.title = fx.title;
  if(fx.intelDone) {}
  S.title = titleFor(S.rep);
  S.rep = Math.max(0, S.rep);
}
function setFlag(f){ S.flags[f]=1; }
function hasFlag(f){ return !!S.flags[f]; }
function addItem(id){
  var it = D.items[id]; if(!it) return;
  if(it.kind==='weapon'||it.kind==='armor'){ S.items[id]=(S.items[id]||0)+1; return; }
  S.items[id]=(S.items[id]||0)+1;
}
function changeFavor(npcId, d){
  S.favors[npcId] = clamp((S.favors[npcId]||10)+d, 0, 100);
}

/* ================= 剧情引擎 ================= */
function nextChapterIdx(){
  if(S.mode!=='story') return null;
  for(var i=0;i<STORY.length;i++){
    var ch = STORY[i];
    if(hasFlag('ch'+ch.no+'_done')) continue;
    if(S.day < ch.unlockDay) continue;
    return i;
  }
  return null;
}
function checkStory(){
  if(S.mode!=='story') return;
  var idx = nextChapterIdx();
  if(idx===null) return;
  if(S.story.cur!==null && S.story.cur!==idx) return;
  if(S.story.cur===null){
    S.story.cur = idx; S.story.beat = null;
  }
  var ch = STORY[idx];
  var beatId = S.story.beat || ch.start;
  var beat = ch.beats[beatId];
  if(!beat) return;
  var key = ch.no + '_' + beatId;
  if(S.story.curBeat === key) return;   /* 防重复触发 */
  if(beat.t==='auto'){
    if(!S.story.started){
      S.story.started = 1;
      showChapterCard(ch);
    }
  } else if(beat.t==='enter'){
    if(!beat.loc || S.loc===beat.loc){
      startBeatFlow(ch, beatId, beat);
    }
  }
}
function isStoryMarkNPC(id){
  if(S.mode!=='story' || S.story.cur===null) return false;
  var ch = STORY[S.story.cur];
  var beatId = S.story.beat || ch.start;
  var beat = ch.beats[beatId];
  return beat && beat.t==='talk' && beat.npc===id;
}
function showChapterCard(ch){
  var ui = $('ui');
  var old = $('chapter'); if(old) old.remove();
  var d = document.createElement('div');
  d.id = 'chapter';
  var lines = (ch.intro||[]).map(function(t){ return '<div>' + String(t).replace(/\{name\}/g,S.name) + '</div>'; }).join('');
  d.innerHTML = '<div class="no">第' + (ch.no===0?'〇':(ch.no===13?'终':ch.no)) + '回</div>' +
    '<div class="t">' + ch.title + '</div>' +
    '<div class="sub">' + ch.sub + '</div>' +
    '<div class="lines">' + lines + '</div>' +
    '<button class="btn" onclick="chapterGo()">启程</button>';
  ui.appendChild(d);
  setScreen('chapter');
}
function chapterGo(){
  var d = $('chapter'); if(d) d.remove();
  if(S.story.cur===null) return;
  var ch = STORY[S.story.cur];
  var beatId = S.story.beat || ch.start;
  startBeatFlow(ch, beatId, ch.beats[beatId]);
}
function startBeatFlow(ch, beatId, beat){
  if(!beat) return;
  S.story.beat = beatId;
  S.story.curBeat = ch.no + '_' + beatId;
  if(beat.t==='talk'){
    /* 直接以对话触发（NPC 在场） */
    if(beat.npc && !npcSprite(beat.npc)){ toast('你要找的人不在此处，请改日再来。'); S.story.curBeat = null; return; }
  }
  var lines = (beat.d||[]).map(function(l){
    var nm = l.n;
    if(beat.npc && !nm){ nm = D.npcs[beat.npc] ? D.npcs[beat.npc].nm : ''; }
    return {n:nm, t:l.t};
  });
  var choices = (beat.choices||[]).map(function(c){
    return {t:c.t, goto:c.goto, fx:c.fx, fxFn:c.fxFn};
  });
  startDialog(lines, {choices: choices.length?choices:null, onEnd:function(goto){
    /* 战斗节拍 */
    if(beat.fight){
      startBattle(beat.fight, function(win){
        if(!win){ return; }
        afterBeat(ch, beatId, beat, goto);
      });
      return;
    }
    afterBeat(ch, beatId, beat, goto);
  }});
}
function afterBeat(ch, beatId, beat, goto){
  if(beat.fx) applyFx(beat.fx);
  if(beat.note){ journalNote(beat.note); }
  S.story.curBeat = null;
  var next = goto || beat.next;
  if(next){
    if(next.indexOf('end')===0){
      var en = next.replace('end','');
      completeChapter(ch);
      showEnding(en);
      return;
    }
    S.story.beat = next;
    var nb = ch.beats[next];
    if(nb.t==='auto' || (nb.t==='enter' && (!nb.loc || S.loc===nb.loc))){
      startBeatFlow(ch, next, nb);
    } else {
      hud();
      toast('前路已明，接着走吧。');
    }
  } else {
    completeChapter(ch);
  }
}
function completeChapter(ch){
  setFlag('ch'+ch.no+'_done');
  if(ch.reward) applyFx(ch.reward);
  if(S.story.done.indexOf(ch.no)<0) S.story.done.push(ch.no);
  S.story.cur = null; S.story.beat = null; S.story.started = 0; S.story.curBeat = null;
  saveGame(0);
  if(ch.suspense){
    showSuspense(ch);
  } else {
    hud();
  }
}
function showSuspense(ch){
  var ui = $('ui');
  var old = $('chapter'); if(old) old.remove();
  var d = document.createElement('div');
  d.id = 'chapter';
  d.innerHTML = '<div class="no">本回完 · 待续</div>' +
    '<div class="t">' + ch.title + '</div>' +
    '<div class="suspense">' + (ch.suspense||'') + '</div>' +
    '<button class="btn" onclick="suspenseGo()">下回再会</button>';
  ui.appendChild(d);
  setScreen('chapter');
}
function suspenseGo(){
  var d = $('chapter'); if(d) d.remove();
  checkStory();
  enterScene(S.loc);
  hud();
}
function showEnding(en){
  var e = ENDINGS[en];
  if(!e){ e = ENDINGS.f_death; }
  S.ending = en;
  saveGame(0);
  var ui = $('ui');
  var old = $('chapter'); if(old) old.remove();
  var d = document.createElement('div');
  d.id = 'chapter';
  d.innerHTML = '<div class="no">—— 终 ——</div>' +
    '<div class="t" style="font-size:clamp(24px,4.5vw,40px)">' + e.nm + '</div>' +
    '<div class="sub">' + e.sub + '</div>' +
    '<div class="lines">' + String(e.txt).replace(/\n/g,'<br>') + '</div>' +
    '<div class="row" style="margin-top:24px"><button class="btn" onclick="endingBackTitle()">回到标题</button>' +
    '<button class="btn jade" onclick="endingNewGame()">开启新人生</button></div>';
  ui.appendChild(d);
  setScreen('chapter');
}
function endingBackTitle(){ goBoot(); }
function endingNewGame(){ goBoot(); }

/* ================= 战斗引擎 ================= */
var BTL = null;
var lastEnemyId = null, lastOnWin = null;
function playerMaxHp(){ return maxHp(S); }
function playerAtk(){ return atkBonus(S); }
function playerDef(){ return defOf(S); }
function startBattle(enemyId, onWin){
  var e = D.enemies[enemyId];
  lastEnemyId = enemyId; lastOnWin = onWin;
  var cb = compBonus(S);
  BTL = {
    enemy: {id:enemyId, nm:e.nm, hp:e.hp, max:e.hp, atk:e.atk, def:e.def, spd:e.spd, gold:e.gold},
    player: {hp: maxHp(S), max: maxHp(S)},
    log: [], def:false, over:false, onWin:onWin, esc:false
  };

}
function buildBattle(){
  var ui = $('ui');
  var old = $('btl'); if(old) old.remove();
  var d = document.createElement('div');
  d.id = 'btl';
  d.innerHTML = '<div class="stage">' +
    '<div id="btlPlayer" class="unit" style="left:8%;bottom:8%"></div>' +
    '<div id="btlEnemy" class="unit enemy" style="right:8%;bottom:8%"></div>' +
    '</div>' +
    '<div id="btlLog" class="log"></div>' +
    '<div class="cmd" id="btlCmd"></div>';
  ui.appendChild(d);
  setScreen('battle');
  renderBattle();
  btlLog('遭遇了 ' + BTL.enemy.nm + '！');
}
function btlLog(t){ BTL.log.push(t); if(BTL.log.length>6) BTL.log.shift(); var el=$('btlLog'); if(el){ el.innerHTML = BTL.log.map(function(x){return '<div>'+x+'</div>';}).join(''); el.scrollTop=9999; } }
function renderBattle(){
  var p = BTL.player, e = BTL.enemy;
  var pe = $('btlPlayer'), ee = $('btlEnemy');
  var cb = compBonus(S);
  if(pe){
    pe.innerHTML = '<div style="width:64px;height:64px;margin:0 auto;background:radial-gradient(circle at 40% 35%,#3A6A75,#1B3A44);border:2px solid #B08A4F;border-radius:50%"></div>' +
      '<div>' + S.name + '</div><div class="hp"><i style="width:'+Math.max(0,p.hp/p.max*100)+'%"></i></div><div class="mute">' + p.hp + '/' + p.max + '</div>';
  }
  if(ee){
    ee.innerHTML = '<div style="width:72px;height:72px;margin:0 auto;background:radial-gradient(circle at 40% 35%,#8C2B1D,#4A1210);border:2px solid #B43C2A;border-radius:50%"></div>' +
      '<div>' + e.nm + '</div><div class="hp"><i style="width:'+Math.max(0,e.hp/e.max*100)+'%"></i></div><div class="mute">' + e.hp + '/' + e.max + '</div>';
  }
  if(BTL.over) return;
  var cmd = $('btlCmd');
  cmd.innerHTML = '<button class="btn" onclick="btlCmd(\'atk\')">攻击</button>' +
    '<button class="btn" onclick="btlCmd(\'def\')">防御</button>' +
    '<button class="btn" onclick="btlCmd(\'skill\')">' + skillName() + '</button>' +
    '<button class="btn" onclick="btlCmd(\'item\')">用药</button>' +
    '<button class="btn ghost" onclick="btlCmd(\'run\')">遁走</button>';
}
function skillName(){
  if(S.martial>=45) return '连环刺';
  if(S.martial>=35) return '铁布衫';
  if(S.martial>=25) return '横扫';
  if(S.martial>=15) return '力劈';
  if(intelOf(S)>=20) return '暗器';
  return '怒击';
}
function btlCmd(cmd){
  if(!BTL || BTL.over) return;
  var e = BTL.enemy, p = BTL.player;
  var dmg = 0, txt = '';
  if(cmd==='atk'){
    dmg = Math.max(1, playerAtk() - e.def + rndi(-2,3));
    e.hp -= dmg; txt = '你挥出' + (D.items[S.equip.weapon].nm) + '，造成 ' + dmg + ' 点伤害。';
  } else if(cmd==='def'){
    BTL.def = true; txt = '你凝神防御。';
  } else if(cmd==='skill'){
    var sn = skillName();
    if(sn==='力劈'){ dmg = Math.max(1, playerAtk()+5 - e.def + rndi(-1,3)); e.hp-=dmg; txt = '力劈华山！造成 '+dmg+' 点伤害。'; }
    else if(sn==='横扫'){ dmg = Math.max(1, Math.floor(playerAtk()*1.4)-e.def + rndi(0,3)); e.hp-=dmg; txt='横扫千军！造成 '+dmg+' 点伤害。'; }
    else if(sn==='连环刺'){ var t1=0; for(var i=0;i<2;i++){ t1+=Math.max(1, Math.floor(playerAtk()*0.7)-e.def+rndi(0,2)); } e.hp-=t1; dmg=t1; txt='连环刺出，连伤两处，共 '+t1+' 点伤害。'; }
    else if(sn==='铁布衫'){ BTL.def=true; txt='你气沉丹田，周身如铁。'; }
    else if(sn==='暗器'){ dmg = Math.max(1, intelOf(S)+4 - e.def + rndi(0,3)); e.hp-=dmg; txt='暗器破空，命中要害，造成 '+dmg+' 点伤害。'; }
    else { dmg = Math.max(1, playerAtk()+2-e.def+rndi(0,2)); e.hp-=dmg; txt='你怒喝一声，造成 '+dmg+' 点伤害。'; }
  } else if(cmd==='item'){
    var meds = ['med_renshen','med_xing','med_jin','med_cao'];
    var has = meds.filter(function(m){ return S.items[m]; });
    if(!has.length){ btlLog('你没有药品！'); return; }
    var pick = has[0];
    S.items[pick]--;
    if(S.items[pick]<=0) delete S.items[pick];
    var h = D.items[pick].st.health||0;
    p.hp = Math.min(p.max, p.hp + h);
    txt = '你服下' + D.items[pick].nm + '，恢复 ' + h + ' 点生命。';
  } else if(cmd==='run'){
    if(S.mode==='story'){ btlLog('强敌当前，你无法从这场宿命之战中脱身。'); }
    else {
      var sp = S.martial/10 + 4;
      if(chance(sp/20)){ btlLog('你成功遁走，脱离了战斗。'); BTL.over=true; endBattle(false, true); return; }
      txt = '你试图脱身，但没有成功。';
    }
  }
  if(txt) btlLog(txt);
  BTL.def = false;
  renderBattle();
  if(e.hp<=0){
    e.hp = 0; renderBattle();
    btlLog('你击败了 ' + e.nm + '！');
    S.wins++;
    var gold = rndi(e.gold[0], e.gold[1]);
    S.money += gold;
    btlLog('缴获银两 ' + gold + '。');
    (e.drop||[]).forEach(function(dr){ if(chance(dr.ch)){ addItem(dr.it); btlLog('拾得 ' + D.items[dr.it].nm + '。'); } });
    checkAchievements();
    BTL.over = true;
    endBattle(true);
    return;
  }
  /* 敌方行动 */
  var ed = Math.max(1, e.atk - playerDef() + rndi(-2,3));
  if(BTL.def){ ed = Math.max(1, Math.floor(ed/2)); }
  p.hp -= ed;
  btlLog(e.nm + '的攻击造成 ' + ed + ' 点伤害。');
  renderBattle();
  if(p.hp<=0){
    p.hp = 0; renderBattle();
    BTL.over = true;
    btlLog('你倒下了……');
    endBattle(false);
  }
}
function endBattle(win, esc){
  var onWin = BTL.onWin;
  BTL = null;
  var d = $('btl'); if(d) d.remove();
  if(win){
    if(onWin) onWin(true);
    else { checkFreeEnding(); enterScene(S.loc); hud(); }
  } else if(esc){
    if(onWin) onWin(false);
    else { S.travel = null; enterScene(S.loc); hud(); }
  } else {
    /* 战败 */
    if(S.mode==='story'){
      showRetryPanel();
    } else {
      S.health = Math.max(1, S.health - 25);
      S.stamina = 10;
      var lost = Math.min(10, Math.floor(S.money/4));
      S.money -= lost;
      S.travel = null;
      toast('你负伤败退，损失 ' + lost + ' 两。');
      enterScene(S.loc); hud();
      checkFreeEnding();
    }
  }
}
function showRetryPanel(){
  var html = '<h2 class="pTitle">身陷绝境</h2>' +
    '<p class="mute" style="text-align:center">你倒在了敌人的刀下。这场战斗还远未结束——重振旗鼓，再战一次。</p>' +
    '<div class="row" style="justify-content:center;margin-top:12px">' +
    '<button class="btn" onclick="retryBattle()">重振旗鼓</button>' +
    '<button class="btn ghost" onclick="closePop();goBoot()">回到标题读档</button></div>';
  var pan = popPanel(html, {full:true});
}

  closePop();
  var d = $('btl'); if(d) d.remove();
  if(lastEnemyId) startBattle(lastEnemyId, lastOnWin);
}

function openMapBack(){ paintWorld(); setScreen('world'); }

/* ================= 旅行 ================= */
function travelPicker(){
  var dests = reachableCities();
  if(!dests.length){ toast('此处暂无可通之路。'); return; }
  var items = dests.map(function(id){
    var l = D.locations[id];
    var path = bfsPath(S.loc, id);
    var days = path.length-1;
    var cost = days*0.5;
    return '<div class="listItem" onclick="travelTo(\''+id+'\')"><div><div class="nm">' + l.nm + '</div>' +
      '<div class="ds">' + l.type + ' · 约' + days + '日 · 路资' + cost.toFixed(1) + '两' + '</div></div>' +
      '<div class="rt">前往</div></div>';
  }).join('');
  var html = '<h2 class="pTitle">海陆行旅</h2><div>' + items + '</div>' +
    '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" onclick="closePop()">作罢</button></div>';
  popPanel(html, {full:true});
}
function travelTo(dest){
  closePop();
  var path = bfsPath(S.loc, dest);
  if(!path){ toast('此路不通。'); return; }
  S.travel = {path:path, idx:1};
  toast('启程前往 ' + D.locations[dest].nm + '。');
  setScreen('world');
  travelStep();
}
function travelStep(){
  if(!S.travel){ return; }
  var path = S.travel.path, i = S.travel.idx;
  if(i >= path.length){
    var dest = path[path.length-1];
    S.travel = null;
    enterScene(dest);
    toast('抵达 ' + D.locations[dest].nm + '。');
    checkFreeEnding();
    return;
  }
  var a = path[i-1], b = path[i];
  var la = D.locations[a], lb = D.locations[b];
  var sea = isSeaRoute([a,b]);
  S.travel.idx = i+1;
  S.day++;
  S.hunger = Math.max(0, S.hunger - (sea?2.5:2));
  S.stamina = Math.max(0, S.stamina - (sea?12:9));
  S.health = clamp(S.health - (S.hunger<=0?3:0), 0, 100);
  if(sea) S.seaDays++;
  S.money = Math.max(0, S.money - (sea?0.6:0.3));
  marketDrift(1);
  /* 存档点 */
  if(S.day%5===0) saveGame(0);
  var evCh = S.mode==='story' ? 0.10 : 0.22;
  if(chance(evCh)){
    var ev = pickEvent('t');
    if(ev){ showEvent(ev, function(){ travelStep(); }); return; }
  }
  if(chance(0.05)){
    var bad = pickEnemy(la.dg);
    startBattle(bad, function(win){
      if(win){ travelStep(); }
      else { S.travel=null; enterScene(S.loc); }
    });
    return;
  }
  travelStep();
}
function pickEnemy(dg){
  var pool = ['biliu','jie'];
  if(dg>=1) pool.push('tufei','wo');
  if(dg>=2) pool.push('cike','gesake');
  return pick(pool);
}
function waitDays(n){
  if(SCR!=='world') return;
  for(var i=0;i<n;i++){
    S.day++; S.hunger=Math.max(0,S.hunger-2); S.stamina=Math.max(0,S.stamina-2);
    S.health=clamp(S.health-(S.hunger<=0?2:0),0,100);
    marketDrift(1);
    if(S.hunger<=10&&S.health<30){ toast('你饿得头昏眼花，赶紧找吃的吧。'); }
  }
  var ev = pickEvent('c');
  if(ev){ showEvent(ev, function(){ afterDay(); }); return; }
  afterDay();
}
function afterDay(){
  if(checkDeath()) return;
  checkStory();
  checkAchievements();
  checkFreeEnding();
  if(S.day%7===0) saveGame(0);
  hud();
}
function checkDeath(){
  if(S.health<=0 && !S.ending){
    S.health=0;
    showEnding('f_death');
    return true;
  }
  return false;
}

/* ---- 市场漂移 ---- */
function marketDrift(n){
  for(var g in D.goods){
    var d = S.drift[g] || 1;
    d = d * (0.985 + Math.random()*0.03);
    if(chance(0.01)) d = d * (chance(0.5)?0.9:1.12);
    S.drift[g] = clamp(d, 0.7, 1.5);
  }
}
function priceOf(loc, good, buy){
  var l = D.locations[loc], g = D.goods[good];
  var p = g.base * (l.tr[good]||1) * (S.drift[good]||1);
  return buy ? p : p*0.8;
}

/* ================= 随机事件 ================= */
function pickEvent(w){
  var pool = D.events.filter(function(e){ return e.w===w; });
  if(!pool.length) return null;
  return pick(pool);
}
function showEvent(ev, done){
  var opts = ev.opts.map(function(o, i){
    return '<button class="btn ghost" onclick="eventPick('+i+')">' + o.t + '</button>';
  }).join('');
  var html = '<h2 class="pTitle">' + ev.nm + '</h2>' +
    '<p style="line-height:1.9;font-size:15px">' + ev.txt + '</p>' +
    '<div style="display:flex;flex-direction:column;align-items:stretch;margin-top:12px">' + opts + '</div>';
  popPanel(html, {full:true});
  evDone = done;
  curEv = ev;
}
var curEv = null, evDone = null;
function eventPick(i){
  var o = curEv.opts[i];
  if(!o){ return; }
  var ev = curEv, done = evDone;
  curEv = null; evDone = null;
  closePop();
  var res = o.fx(S);
  if(res==='FIGHT'){
    startBattle(S.fight, function(win){
      if(win) toast('你击退了来犯之敌。');
      else S.health = Math.max(1, S.health-15);
      if(done) done();
    });
    return;
  }
  if(res) toast(res);
  if(done) done();
}

/* ================= NPC 互动 ================= */
function openNpcPanel(npcId){
  var n = D.npcs[npcId];
  if(!n) return;
  /* 剧情节拍 */
  if(S.mode==='story' && S.story.cur!==null){
    var ch = STORY[S.story.cur];
    var beatId = S.story.beat || ch.start;
    var beat = ch.beats[beatId];
    if(beat && beat.t==='talk' && beat.npc===npcId){
      startBeatFlow(ch, beatId, beat);
      return;
    }
  }
  var fav = S.favors[npcId]||10;
  var opts = [];
  opts.push('<button class="btn ghost" onclick="npcTalk(\''+npcId+'\')">交谈</button>');
  opts.push('<button class="btn ghost" onclick="npcGift(\''+npcId+'\')">赠送礼物</button>');
  if(n.comp && S.companions.indexOf(npcId)<0){
    opts.push('<button class="btn jade" onclick="npcJoin(\''+npcId+'\')">邀为同伴</button>');
  }
  if(n.rom && S.gender!==n.g && !S.spouse){
    if(fav>=100 && S.money>=100 && S.rep>=300){
      opts.push('<button class="btn danger" onclick="npcMarry(\''+npcId+'\')">求婚</button>');
    } else if(fav>=80){
      opts.push('<button class="btn ghost" onclick="npcLove(\''+npcId+'\')">表白心迹</button>');
    }
  }
  if(S.companions.indexOf(npcId)>=0){
    opts.push('<button class="btn ghost" onclick="npcLeave(\''+npcId+'\')">辞别同伴</button>');
  }
  opts.push('<button class="btn ghost" onclick="closePop()">作罢</button>');
  var html = '<h2 class="pTitle">' + n.nm + ' · ' + n.role + '</h2>' +
    '<p class="mute">' + n.ds + '</p>' +
    '<div style="margin-top:6px"><span class="tag">' + (n.g==='男'?'须眉':'巾帼') + '</span>' +
    '<span class="tag">' + n.age + '岁</span>' +
    '<span class="tag gold">好感 ' + Math.round(fav) + '</span></div>' +
    '<div style="margin-top:4px"><span class="mute">所在地：' + (n.city==='dynamic' ? '随剧情' : (D.locations[n.city] ? D.locations[n.city].nm : '漂泊')) + '</span></div>' +
    '<div style="display:flex;flex-direction:column;align-items:stretch;margin-top:10px">' + opts.join('') + '</div>';
  popPanel(html, {full:true});
}
function npcTalk(npcId){
  var n = D.npcs[npcId];
  var fav = S.favors[npcId]||10;
  if(!S.npcTalk) S.npcTalk = {};
  var i = S.npcTalk[npcId] || 0;
  var lines = n.talk;
  if(chance(0.25) && fav<40){ lines = [n.talk[0], n.talk[Math.min(1,n.talk.length-1)]]; }
  startDialog(lines.slice(i, i+2).map(function(t){ return {n:n.nm, t:t}; }), {onEnd:function(){
    S.npcTalk[npcId] = (i+1) % Math.max(1, lines.length);
    changeFavor(npcId, 1);

    openNpcPanel(npcId);
  }});

function npcGift(npcId){

    return '<div class="listItem" onclick="doGift(\''+npcId+'\',\''+k+'\','+eff+')"><div class="nm">' + it.nm + '（x' + S.items[k] + '）</div><div class="rt">赠</div></div>';
  }).join('');

    '<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" onclick="openNpcPanel(\''+npcId+'\')">返回</button></div>';
  popPanel(html, {full:true});

function doGift(npcId, itemId, eff){
  if(S.items[itemId]<=0){ toast('礼物已用完。'); return; }
  S.items[itemId]--;
  if(S.items[itemId]<=0) delete S.items[itemId];

/* 市集 */
function openMarket(){
  var loc = D.locations[S.loc];
  var rows = Object.keys(D.goods).map(function(g){
    var gd = D.goods[g];
    var bp = priceOf(S.loc, g, true), sp = priceOf(S.loc, g, false);
    var cargo = S.cargo[g]||0;
    return '<div class="listItem"><div><div class="nm">' + gd.nm + '</div>' +
      '<div class="ds">本处买' + bp.toFixed(1) + '两 / 卖' + sp.toFixed(1) + '两 · 负重' + gd.wt + (cargo?' · 持有'+cargo:'') + '</div></div>' +
      '<div class="row" style="gap:4px"><button class="btn mini" onclick="tradeBuy(\''+g+'\')">买1</button>' +
      '<button class="btn mini jade" onclick="tradeSell(\''+g+'\')">卖1</button></div></div>';
  }).join('');
  var html = '<h2 class="pTitle">市集 · ' + loc.nm + '</h2>' +
    '<p class="mute">背负 ' + cargoWeight(S) + '/' + capacityOf(S) + ' · 银两 ' + moneys(S.money) + '</p><div>' + rows + '</div>' +
    '<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" onclick="closePop()">离开</button></div>';
  popPanel(html, {full:true});
}
function tradeBuy(g){
  var bp = priceOf(S.loc, g, true);
  if(S.money < bp){ toast('银两不足。'); return; }
  if(cargoWeight(S) + D.goods[g].wt > capacityOf(S)){ toast('背不下了。'); return; }
  S.money -= bp; S.cargo[g] = (S.cargo[g]||0)+1;
  toast('购入 ' + D.goods[g].nm + ' 一担（' + bp.toFixed(1) + '两）。');
  openMarket();
}
function tradeSell(g){
  if(!S.cargo[g]){ toast('你没有此货。'); return; }
  var sp = priceOf(S.loc, g, false);
  S.money += sp;
  var profit = sp - D.goods[g].base;
  if(profit > S.bestDeal) S.bestDeal = profit;
  S.cargo[g]--;
  if(S.cargo[g]<=0) delete S.cargo[g];
  toast('售出 ' + D.goods[g].nm + '，得 ' + sp.toFixed(1) + '两。');
  checkAchievements();
  openMarket();
}

  for(var i=0;i<n;i++){
    S.day++; S.hunger=Math.max(0,S.hunger-2); marketDrift(1);

/* ---- 五子棋 ---- */
var GO = null;
function openGo(bet){
  if(S.money<bet){ toast('银两不足。'); return; }
  S.money-=bet;
  GO = {bet:bet, board:null, over:false};
  var N=15;
  GO.board=[];
  for(var i=0;i<N;i++){ GO.board.push([]); for(var j=0;j<N;j++) GO.board[i].push(0); }
  var cells='';
  for(var y=0;y<N;y++){
    for(var x=0;x<N;x++){
      cells += '<div class="gocell" id="gc_'+x+'_'+y+'" onclick="goPut('+x+','+y+')" style="width:26px;height:26px;display:inline-block;background:#D6C79A;border:1px solid #7A6C54;cursor:pointer"></div>';
    }
    cells += '<br>';
  }
  var html = '<h2 class="pTitle">手谈 · 五子棋（押' + bet + '两）</h2>' +
    '<div style="text-align:center">' + cells + '</div>' +
    '<p id="goMsg" class="mute" style="text-align:center;margin-top:6px">你先落子（黑）</p>' +
    '<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" onclick="goQuit()">认输离开</button></div>';
  popPanel(html, {full:true});
}
function goPut(x,y){
  if(!GO||GO.over) return;
  if(GO.board[x][y]!==0) return;
  GO.board[x][y]=1;
  goDraw(x,y,'#1A1A1A');
  if(goCheck(x,y,1)){
    goOver(true);
    return;
  }
  setTimeout(goAI, 350);
}
function goDraw(x,y,col){
  var el = $('gc_'+x+'_'+y);
  if(el){ el.style.background = col==='#1A1A1A' ? 'radial-gradient(circle at 35% 35%,#555,#000)' : 'radial-gradient(circle at 35% 35%,#fff,#ccc)'; }
}
function goCheck(x,y,who){
  var dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(var d=0;d<4;d++){
    var dx=dirs[d][0], dy=dirs[d][1];
    var c=1;
    for(var s=1;s<5;s++){ var nx=x+dx*s, ny=y+dy*s; if(nx<0||ny<0||nx>=15||ny>=15||GO.board[nx][ny]!==who) break; c++; }
    for(var s2=1;s2<5;s2++){ var nx2=x-dx*s2, ny2=y-dy*s2; if(nx2<0||ny2<0||nx2>=15||ny2>=15||GO.board[nx2][ny2]!==who) break; c++; }
    if(c>=5) return true;
  }
  return false;
}
function goAI(){
  if(!GO||GO.over) return;
  /* 找能赢的点，否则堵玩家 */
  var best=null;
  for(var y=0;y<15;y++){
    for(var x=0;x<15;x++){
      if(GO.board[x][y]!==0) continue;
      GO.board[x][y]=2;
      if(goCheck(x,y,2)){ GO.board[x][y]=0; best={x:x,y:y}; break; }
      GO.board[x][y]=0;
    }
    if(best) break;
  }
  if(!best){
    for(var y2=0;y2<15;y2++){
      for(var x2=0;x2<15;x2++){
        if(GO.board[x2][y2]!==0) continue;
        GO.board[x2][y2]=1;
        if(goCheck(x2,y2,1)){ GO.board[x2][y2]=0; best={x:x2,y:y2}; break; }
        GO.board[x2][y2]=0;
      }
      if(best) break;
    }
  }
  if(!best){
    var empt=[];
    for(var y3=0;y3<15;y3++) for(var x3=0;x3<15;x3++) if(GO.board[x3][y3]===0) empt.push({x:x3,y:y3});
    if(empt.length) best = pick(empt);
  }
  if(!best){ goOver(true); return; }
  GO.board[best.x][best.y]=2;
  goDraw(best.x,best.y,'#fff');
  if(goCheck(best.x,best.y,2)){ goOver(false); return; }
}
function goOver(win){
  GO.over=true;
  if(win){
    S.money += GO.bet*2;
    toast('你赢了！得' + (GO.bet*2) + '两。');
    $('goMsg').textContent = '你赢了（白）。再会！';
  } else {
    toast('你输了' + GO.bet + '两。');
    $('goMsg').textContent = '你输了。再会！';
  }
}
function goQuit(){
  GO = null;
  closePop();
  openTeahouse();
}

  } else if(tab==='gossip'){
    var notes = S.notes || [];
    body = notes.length ? notes.map(function(n){ return '<div class="listItem" style="cursor:default"><div class="ds">' + n + '</div></div>'; }).join('') : '<p class="mute">尚无传闻笔记。</p>';
  } else {
    var rows = D.achievements.map(function(a){
      var got = S.achievements.indexOf(a.id)>=0;
      return '<div class="listItem" style="cursor:default"><div><div class="nm">' + (got?'✓ ':'○ ') + a.nm + '</div><div class="ds">' + a.ds + '</div></div></div>';
    }).join('');
    body = rows;
  }
  var html = '<h2 class="pTitle">行旅日志</h2><div class="row" style="justify-content:center">' + tabBtns + '</div><div style="margin-top:8px">' + body + '</div>' +
    '<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" onclick="closePop()">离开</button></div>';
  popPanel(html, {full:true});
}
function journalNote(t){
  if(!S.notes) S.notes = [];
  S.notes.unshift(t);
  if(S.notes.length>40) S.notes.length = 40;
}
/* 存档 */
function openSave(fromBoot){
  var slots=[0,1,2,3];
  var rows = slots.map(function(i){
    var meta=null;
    try{ meta = JSON.parse(localStorage.getItem(CFG.saveMetaKey)||'{}')[i]; }catch(e){}
    var label = i===0?'自动':('存档' + i);
    var info = meta ? (meta.name + ' · ' + fmtDay(meta.day) + ' · ' + meta.mode + ' · ' + (D.locations[meta.loc]?D.locations[meta.loc].nm:meta.loc)) : '空';
    return '<div class="listItem"><div><div class="nm">' + label + '</div><div class="ds">' + info + '</div></div>' +
      '<div class="row" style="gap:4px">' +
      '<button class="btn mini" onclick="saveTo('+i+')">存</button>' +
      '<button class="btn mini jade" onclick="loadFrom('+i+')">读</button>' +
      (meta?'<button class="btn mini danger" onclick="delSave('+i+')">删</button>':'') +
      '</div></div>';
  }).join('');
  var html = '<h2 class="pTitle">存档 · 本地</h2><div>' + rows + '</div>' +
    '<div class="sep"></div>' +
    '<div class="row"><button class="btn small" onclick="doExport()">导出存档</button>' +
    '<button class="btn small" onclick="doImport()">导入存档</button></div>' +
    '<textarea id="expBox" class="txt" style="height:64px;margin-top:6px;font-size:11px" placeholder="导出的存档代码会显示在这里；导入时粘贴代码后点下方确认"></textarea>' +
    '<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" onclick="closePop()">离开</button></div>';
  popPanel(html, {full:true});
}
function saveTo(i){
  var ok = saveGame(i);
  toast(ok?'已存入' + (i===0?'自动':'存档' + i) + '。':'保存失败（浏览器可能禁用了本地存储）。');
  openSave();
}
function loadFrom(i){
  var ok = loadGame(i);
  if(ok){
    closePop();
    toast('读取存档，回到了第' + S.day + '日。');
    enterScene(S.loc);
    checkStory();
  } else {
    toast('存档读取失败或为空。');
  }
}
function delSave(i){
  deleteSave(i);
  openSave();
}
function doExport(){
  var str = exportSave();
  var box = $('expBox');
  if(box) box.value = str || '导出失败';
  toast('存档代码已生成，复制保存即可。');
}
function doImport(){
  var box = $('expBox');
  var v = box ? box.value : '';
  if(!v){ toast('请先粘贴存档代码。'); return; }
  var ok = importSave(v);
  if(ok){
    closePop();
    toast('导入成功。');
    enterScene(S.loc);
    checkStory();
  } else {
    toast('导入失败：代码无效。');
  }
}
/* 设定 */
function openSettings(){
  var html = '<h2 class="pTitle">设定</h2>' +
    '<div class="row"><label class="lbl">对话速度</label>' +
    '<button class="btn small' + (S.textSpeed===0?'':' ghost') + '" onclick="setTS(0)">慢</button>' +
    '<button class="btn small' + (S.textSpeed===1?'':' ghost') + '" onclick="setTS(1)">常</button>' +
    '<button class="btn small' + (S.textSpeed===2?'':' ghost') + '" onclick="setTS(2)">快</button></div>' +
    '<div class="sep"></div>' +
    '<div class="row"><button class="btn danger" onclick="confirmQuit()">返回标题</button>' +
    '<button class="btn ghost" onclick="closePop()">继续游戏</button></div>' +
    '<p class="mute" style="margin-top:8px">提示：本作数据存于浏览器本地。上传 GitHub Pages 后，存档随浏览器保留。</p>';
  popPanel(html, {full:true});
}
function setTS(v){ S.textSpeed = v; openSettings(); }
function confirmQuit(){
  saveGame(0);
  closePop();
  goBoot();
}

/* ================= 世界地图点击 ================= */
function worldClick(mx, my){
  var id = worldPointToTile(mx, my);
  if(!id) return;
  var l = D.locations[id];
  var cur = id===S.loc;
  var vis = S.visited[id] || !!S.items.tool_ditu;
  var ds = vis ? l.ds : '（尚未踏足之地。传闻与地图册会揭开它的面目。）';
  var hasPath = cur || bfsPath(S.loc, id);
  var btns = '';
  if(cur) btns = '<button class="btn" onclick="enterScene(\''+id+'\')">进城</button>';
  else if(hasPath) btns = '<button class="btn" onclick="travelTo(\''+id+'\')">前往（约' + (bfsPath(S.loc,id).length-1) + '日）</button>';
  else btns = '<span class="mute">此路暂不通。</span>';
  var old = $('cityCardEl'); if(old) old.remove();
  var d = document.createElement('div');
  d.id = 'cityCardEl';
  d.className = 'panel';
  d.innerHTML = '<h3 class="pTitle">' + l.nm + ' · ' + l.type + '</h3>' +
    '<p class="mute small" style="line-height:1.7">' + ds + '</p>' +
    '<div class="row">' + btns + '<button class="btn ghost small" onclick="closeCityCard()">收起</button></div>';
  uiEl.appendChild(d);
  setScreen('world');
}
function closeCityCard(){ var c=$('cityCardEl'); if(c) c.remove(); }

/* ================= 成就 / 自由结局 ================= */
function checkAchievements(){
  D.achievements.forEach(function(a){
    if(S.achievements.indexOf(a.id)>=0) return;
    if(a.cond(S)){
      S.achievements.push(a.id);
      toast('成就达成：' + a.nm + '！');
      S.rep = Math.max(0, S.rep + 2);
    }
  });
}
function checkFreeEnding(){
  if(S.mode!=='free') return;
  if(S.ending) return;
  if(S.money>=10000 && S.rep>=3000){ showEnding('f_rich'); return; }
  if(S.martial>=90 && S.rep>=8000 && S.wins>=30){ showEnding('f_general'); return; }
  if(S.day>=3650){ showEnding('f_old'); return; }
  if(S.day>=730 && S.rep<50 && S.money<100){ showEnding('f_hidden'); return; }
}

/* ================= 输入 ================= */
document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault();
  KEYS[k] = 1;
  if(k==='e' && SCR==='scene'){ interact(); }
  if(k===' ' && SCR==='dlg'){ dlgNext(); }
  if(k==='enter' && SCR==='dlg'){ dlgNext(); }
  if(k==='escape'){
    if(SCR==='dlg'){ dlgSkip(); }
    else if(SCR==='scene'){ openMapBack(); }
    else if(SCR==='world'){ openSettings(); }
  }
});
document.addEventListener('keyup', function(e){ KEYS[e.key.toLowerCase()] = 0; });
cv.addEventListener('pointerdown', function(e){
  var r = cv.getBoundingClientRect();
  var mx = (e.clientX - r.left) * LOGIC_W / r.width;
  var my = (e.clientY - r.top) * LOGIC_H / r.height;
  if(SCR==='world'){ worldClick(mx, my); }
  else if(SCR==='scene'){ interactAt(mx, my); }
});
function interact(){
  var n = nearestInteract();
  if(!n) return;
  if(n.type==='npc') openNpcPanel(n.id);
  else openFacility(n.obj.kind);
}
function interactAt(mx, my){
  /* 换算到场景坐标 */
  var offX = (LOGIC_W - scene.w*TILE)/2;
  var offY = (LOGIC_H - scene.h*TILE)/2;
  var tx = (mx-offX)/TILE, ty = (my-offY)/TILE;
  var best=null, bd=4*4;
  scene.npcs.forEach(function(n){
    var dx=(n.x+16)/TILE-tx, dy=(n.y+14)/TILE-ty;
    var d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best={type:'npc', id:n.id}; }
  });
  scene.buildings.forEach(function(b){
    var dx=(b.door.x*TILE+6)/TILE-tx, dy=(b.door.y*TILE+4)/TILE-ty;
    var d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best={type:'bld', obj:b}; }
  });
  if(best){
    if(best.type==='npc') openNpcPanel(best.id);
    else openFacility(best.obj.kind);
  }
}
/* 虚拟方向键 */
function buildDpad(){
  var d = document.createElement('div');
  d.id = 'dpadEl';
  d.innerHTML = '<button class="up" data-d="u">▲</button>' +
    '<button class="left" data-d="l">◀</button>' +
    '<button class="down" data-d="d">▼</button>' +
    '<button class="right" data-d="r">▶</button>';
  uiEl.appendChild(d);
  d.querySelectorAll('button').forEach(function(b){
    b.addEventListener('pointerdown', function(ev){ ev.preventDefault(); dpadDir[b.dataset.d]=1; });
    b.addEventListener('pointerup', function(){ dpadDir[b.dataset.d]=0; });
    b.addEventListener('pointerleave', function(){ dpadDir[b.dataset.d]=0; });
  });
}
buildDpad();

/* ================= 主循环 ================= */
var lastT = 0, rafId = null, running = false;
function loop(t){
  if(!running) return;
  var dt = Math.min(0.05, (t - lastT)/1000 || 0.016);
  lastT = t;
  if(SCR==='world'){
    drawWorld(dt, t);
  } else if(SCR==='scene'){
    sceneMove(dt);
    drawScene(dt, t);
  } else if(SCR==='dlg'){
    renderLine();
    drawScene(0.016, t);
  }
  rafId = requestAnimationFrame(loop);
}
function startLoop(){
  if(running) return;
  running = true;
  lastT = performance.now();
  rafId = requestAnimationFrame(loop);
}
function stopLoop(){ running = false; if(rafId) cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', function(){
  if(document.hidden) stopLoop();
  else { lastT = performance.now(); startLoop(); }
});

/* ================= 启动 ================= */
(function init(){
  paintWorld();
  goBoot();
  startLoop();
})();


</script>
