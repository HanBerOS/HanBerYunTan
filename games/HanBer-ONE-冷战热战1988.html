// ---------- 任务板 ----------
HB.openBoard = function(nd){
  var p=HB.state.player;
  var avail=HB.sideQuests.filter(function(q){
    return q.node===nd.id && !HB.state.quests[q.id];
  });
  var active=Object.keys(HB.state.quests).filter(function(k){return HB.state.quests[k].state==="active";});
  var done=Object.keys(HB.state.quests).filter(function(k){return HB.state.quests[k].state==="done";});
  var h='<p class="muted">任务板上钉着几张纸，有的字迹还很新。</p>';
  if(!avail.length) h+='<p class="muted mt">这里没有可领取的任务。</p>';
  avail.forEach(function(q){
    h+='<div class="quest-block"><h4>'+q.title+'</h4><div class="qd">'+q.desc+'</div><div class="qd">奖励：'+(q.reward.money?(q.reward.money+" 军票"):"")+(q.reward.items?" +物资":"")+' · '+(q.reward.xp||0)+' 经验</div><button class="btn btn-sm btn-p" onclick="HB.acceptQuest(\''+q.id+'\')">领取</button></div>';
  });
  if(active.length){
    h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">进行中</h3>';
    active.forEach(function(k){
      var q=HB.state.quests[k], def=HB.sideQuests.find(function(x){return x.id===k;});
      if(!def) return;
      h+='<div class="quest-block"><h4>'+def.title+'</h4>';
      def.objs.forEach(function(o,i){
        var done = o.type==="survive" ? true : (q.prog[i]||0)>=o.n;
        h+='<div class="obj'+(done?" done":"")+'"><span class="st">'+(done?"✓":"□")+'</span>'+HB.objText(o)+'</div>';
      });
      h+='</div>';
    });
  }
  if(done.length){
    h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#4d9e6a">已完成</h3>';
    done.forEach(function(k){
      var def=HB.sideQuests.find(function(x){return x.id===k;});
      if(def) h+='<div class="quest-block done"><h4>'+def.title+'</h4></div>';
    });
  }
  HB.ui.openModal("任务板 · "+nd.n, h);
};
HB.acceptQuest = function(qid){
  HB.state.quests[qid]={state:"active",prog:{}};
  HB.log("【支线】领取："+HB.sideQuests.find(function(x){return x.id===qid;}).title,"ev");
  HB.toast("已领取任务");
  HB.openBoard(HB.nodes[HB.state.player.pos]);
};

// ---------- 背包 / 制作 ----------
HB.openBag = function(){
  var p=HB.state.player;
  var h='<div class="statrow"><span class="lbl">负重</span><span class="tick">'+HB.carryNow()+'/'+HB.carryMax()+'</span></div>';
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">装备</h3>';
  var eq=p.equip;
  h+='<div class="shop-row"><span class="sn">武器：'+(eq.weapon?HB.items[eq.weapon].n:"徒手")+'</span>'+(eq.weapon&&eq.weapon!=="fist"?'<button class="btn btn-sm" onclick="HB.unequip(\'weapon\')">卸下</button>':'')+'</div>';
  h+='<div class="shop-row"><span class="sn">护甲：'+(eq.armor?HB.items[eq.armor].n:"无")+'</span>'+(eq.armor?'<button class="btn btn-sm" onclick="HB.unequip(\'armor\')">卸下</button>':'')+'</div>';
  h+='<div class="shop-row"><span class="sn">装备：'+(eq.gear?HB.items[eq.gear].n:"无")+'</span>'+(eq.gear?'<button class="btn btn-sm" onclick="HB.unequip(\'gear\')">卸下</button>':'')+'</div>';
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">物品</h3>';
  var cats=[["food","食物"],["drink","饮水"],["med","医疗"],["weapon","武器"],["ammo","弹药"],["gear","装备"],["junk","废料"],["special","特殊"]];
  var any=false;
  cats.forEach(function(cat){
    var keys=Object.keys(p.inv).filter(function(k){return HB.items[k]&&HB.items[k].cat===cat[0];});
    if(!keys.length) return;
    any=true;
    h+='<h4 class="mt muted">'+cat[1]+'</h4>';
    keys.forEach(function(k){
      var it=HB.items[k], q=p.inv[k];
      h+='<div class="shop-row"><span class="sn">'+it.n+' ×'+q+'</span><span class="sd">'+it.d.slice(0,18)+'…</span>';
      if(it.cat==="food"||it.cat==="drink"||it.cat==="med") h+='<button class="btn btn-sm btn-g" onclick="HB.useItem(\''+k+'\',1)">使用</button>';
      if(it.cat==="weapon") h+='<button class="btn btn-sm btn-b" onclick="HB.equipItem(\''+k+'\',\'weapon\')">装备</button>';
      if(it.cat==="gear") h+='<button class="btn btn-sm btn-b" onclick="HB.equipItem(\''+k+'\',\''+(it.armor?"armor":"gear")+'\')">装备</button>';
      h+='<button class="btn btn-sm btn-d" onclick="HB.dropItem(\''+k+'\')">丢弃</button></div>';
    });
  });
  if(!any) h+='<p class="muted">背包空空如也。</p>';
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">制作</h3>';
  HB.craft.forEach(function(c){
    var need=HB.canCraft(c);
    h+='<div class="shop-row"><span class="sn">'+c.n+'</span><span class="sd">';
    for(var i2 in c.in){ h+=HB.items[i2].n+'×'+c.in[i2]+' '; }
    h+='</span><button class="btn btn-sm '+(need?"btn-p":"")+'" '+(need?"":"disabled")+' onclick="HB.doCraft(\''+HB.craft.indexOf(c)+'\')">制作</button></div>';
  });
  HB.ui.openModal("背包", h, '<button class="btn" onclick="HB.ui.closeModal()">关闭</button>');
};
HB.useItem = function(id, n, silent){
  var p=HB.state.player, it=HB.items[id];
  if(!p.inv[id]) return false;
  var medBonus = it.cat==="med" ? Math.floor(p.skills.medical/5) : 0;
  if(it.fx){
    var fx=it.fx;
    var hp=fx.hp?fx.hp+medBonus:0;
    p.hp=Math.min(p.maxHp,Math.max(0,p.hp+hp));
    p.hunger=Math.max(0,Math.min(100,p.hunger+(fx.hunger||0)));
    p.thirst=Math.max(0,Math.min(100,p.thirst+(fx.thirst||0)));
    p.rad=Math.max(0,Math.min(100,p.rad+(fx.rad||0)));
    p.energy=Math.max(0,Math.min(100,p.energy+(fx.eng||0)));
    p.morale=Math.max(0,Math.min(100,p.morale+(fx.mor||0)));
  }
  HB.takeItem(id,n);
  if(!silent) HB.log("【使用】"+it.n,"info");
  HB.uiRefresh();
  return true;
};
HB.equipItem = function(id, slot){
  var p=HB.state.player;
  if(slot==="weapon") p.equip.weapon=id;
  if(slot==="armor") p.equip.armor=id;
  if(slot==="gear") p.equip.gear=id;
  HB.log("【装备】换上 "+HB.items[id].n,"info");
  HB.uiRefresh(); HB.openBag();
};
HB.unequip = function(slot){
  var p=HB.state.player;
  if(slot==="weapon") p.equip.weapon="fist";
  if(slot==="armor") p.equip.armor=null;
  if(slot==="gear") p.equip.gear=null;
  HB.uiRefresh(); HB.openBag();
};
HB.dropItem = function(id){
  HB.takeItem(id,1);
  HB.log("【丢弃】"+HB.items[id].n,"info");
  HB.uiRefresh(); HB.openBag();
};
HB.canCraft = function(c){
  var p=HB.state.player;
  for(var i in c.in) if((p.inv[i]||0)<c.in[i]) return false;
  return true;
};
HB.doCraft = function(idx){
  var c=HB.craft[idx];
  if(!HB.canCraft(c)){ HB.toast("材料不足"); return; }
  for(var i in c.in) HB.takeItem(i,c.in[i]);
  for(var o in c.out) HB.addItem(o,c.out[o]);
  HB.state.player.stats.crafts++;
  HB.log("【制作】"+c.n,"good");
  HB.achCheck();
  HB.uiRefresh(); HB.openBag();
};

// ---------- 角色 ----------
HB.openChar = function(){
  var p=HB.state.player;
  var h='<h3 style="letter-spacing:.2em;font-size:14px;color:#e2a13a">'+p.name+' · Lv.'+p.level+'</h3>';
  h+='<div class="kv"><span class="k">出身</span><span class="v">'+(HB.origins.find(function(o){return o.id===p.origin;})||{n:"战争遗孤"}).n+'</span></div>';
  h+='<div class="kv"><span class="k">经验</span><span class="v">'+p.xp+' / '+(p.level*120)+'</span></div>';
  h+='<div class="kv"><span class="k">击杀</span><span class="v">'+p.stats.kills+'</span></div>';
  h+='<div class="kv"><span class="k">旅程</span><span class="v">'+HB.state.dayCount+' 天 · 到访 '+Object.keys(p.stats.visited).length+' 地</span></div>';
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">技能（可用点数：'+p.skillPts+'）</h3>';
  var sk=[["combat","战斗"],["survival","生存"],["medical","医疗"],["charisma","口才"]];
  sk.forEach(function(s){
    h+='<div class="shop-row"><span class="sn">'+s[1]+'</span><span class="tick">'+p.skills[s[0]]+'</span><button class="btn btn-sm" '+(p.skillPts>0&&p.skills[s[0]]<100?"":"disabled")+' onclick="HB.addSkill(\''+s[0]+'\')">+</button></div>';
  });
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">声望</h3>';
  for(var f in HB.factions){
    h+='<div class="kv"><span class="k">'+HB.factions[f].n+'</span><span class="v '+(p.rep[f]>=0?"tick":"muted")+'">'+p.rep[f]+'</span></div>';
  }
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">专长</h3>';
  h+='<div class="row">';
  p.perks.forEach(function(pk){ h+='<span class="tag tag-amber">'+pk+'</span>'; });
  h+='</div>';
  if(p.perkPts>0){
    var pool=["铁壁（生命+20）","猎手（探索收获+）","神医（药物效果+）","说客（物价更优）","侦察兵（遇袭率降）","格斗家（伤害+2）"];
    h+='<p class="mt muted">可选专长（剩余 '+p.perkPts+' 个）</p>';
    pool.forEach(function(pk){
      if(p.perks.indexOf(pk)<0) h+='<button class="btn btn-sm mt" onclick="HB.takePerk(\''+pk+'\')">'+pk+'</button>';
    });
  }
  HB.ui.openModal("角色", h);
};
HB.addSkill = function(s){
  var p=HB.state.player;
  if(p.skillPts<=0||p.skills[s]>=100) return;
  p.skillPts--; p.skills[s]++;
  HB.uiRefresh(); HB.openChar();
};
HB.takePerk = function(pk){
  var p=HB.state.player;
  if(p.perkPts<=0) return;
  p.perkPts--; p.perks.push(pk);
  if(pk.indexOf("铁壁")>=0) p.maxHp+=20;
  HB.uiRefresh(); HB.openChar();
};

// ---------- 任务 ----------
HB.openQuests = function(){
  var st=HB.state, h='';
  if(st.mode==="story"){
    h+='<h3 style="letter-spacing:.2em;font-size:12px;color:#e2a13a">主线</h3>';
    var ch=HB.currentChapter();
    if(!ch) h+='<p class="muted">主线已完结。世界还在运转。</p>';
    else if(!st.story.started) h+='<p>下一章《'+ch.title+'》将于 <span class="tick">'+ch.unlock+'</span> 解锁。</p><p class="muted mt">你可以旅行、做支线、攒物资，等待时间推进。</p>';
    else {
      h+='<div class="quest-block"><h4>第'+ch.id+'章《'+ch.title+'》</h4>';
      ch.objs.forEach(function(o,i){
        var done = o.type==="survive" ? (st.dayCount>=(st.story.prog[i]||0)+o.n) : ((st.story.prog[i]||0)>=o.n);
        h+='<div class="obj'+(done?" done":"")+'"><span class="st">'+(done?"✓":"□")+'</span>'+HB.objText(o)+'</div>';
      });
      h+='</div>';
    }
    h+='<div class="mt"></div>';
  }
  h+='<h3 style="letter-spacing:.2em;font-size:12px;color:#7e90a6">支线</h3>';
  var active=Object.keys(st.quests).filter(function(k){return st.quests[k].state==="active";});
  var done=Object.keys(st.quests).filter(function(k){return st.quests[k].state==="done";});
  if(!active.length&&!done.length) h+='<p class="muted">还没接过任务。去任务板看看。</p>';
  active.forEach(function(k){
    var q=st.quests[k], def=HB.sideQuests.find(function(x){return x.id===k;});
    if(!def) return;
    h+='<div class="quest-block"><h4>'+def.title+'</h4><div class="qd">'+def.desc+'</div>';
    def.objs.forEach(function(o,i){
      var d = o.type==="survive" ? true : (q.prog[i]||0)>=o.n;
      h+='<div class="obj'+(d?" done":"")+'"><span class="st">'+(d?"✓":"□")+'</span>'+HB.objText(o)+'</div>';
    });
    h+='</div>';
  });
  done.forEach(function(k){
    var def=HB.sideQuests.find(function(x){return x.id===k;});
    if(def) h+='<div class="quest-block done"><h4>'+def.title+'</h4></div>';
  });
  HB.ui.openModal("任务", h);
};

// ---------- 日志 ----------
HB.openJournal = function(){
  var st=HB.state, p=st.player;
  var h='';
  h+='<h3 style="letter-spacing:.2em;font-size:12px;color:#e2a13a">故事回顾</h3>';
  if(st.mode==="story"){
    HB.story.forEach(function(ch){
      h+='<div class="quest-block'+(st.story.closed>=ch.id?" done":"")+'"><h4>第'+ch.id+'章《'+ch.title+'》</h4><div class="qd">'+(st.story.closed>=ch.id?("悬念："+ch.cliff.slice(0,60)+"…"):"尚未解锁")+'</div></div>';

  for(var a in HB.achievements){
    var ac=HB.achievements[a];
    h+='<div class="ach'+(st.ach[a]?" got":"")+'"><div class="an">'+(st.ach[a]?"✓ ":"")+ac.n+'</div><div class="ad">'+ac.d+'</div></div>';
  }
  h+='</div>';
  HB.ui.openModal("日志档案", h);
};

// ---------- 成就 ----------
HB.achCheck = function(){
  var st=HB.state, p=st.player;
  var defs={
    alive30:st.dayCount>=30, alive100:st.dayCount>=100, alive365:st.dayCount>=365,
    first_kill:p.stats.kills>=1, kill25:p.stats.kills>=25,
    visit10:Object.keys(p.stats.visited).length>=10, visit20:Object.keys(p.stats.visited).length>=20,
    money:p.money>=2000, rep_fed:p.rep.fed>=60, rep_red:p.rep.red>=60, rep_mer:p.rep.mer>=60,
    story6:st.story.closed>=6, story12:st.story.closed>=12, craft5:p.stats.crafts>=5
  };
  for(var k in defs){
    if(defs[k] && !st.ach[k]){
      st.ach[k]=1;
      HB.log("【成就】"+HB.achievements[k].n+"："+HB.achievements[k].d,"good");
    }
  }
};

// ---------- 存档 ----------
HB.openSave = function(){
  var h='';
  h+='<p class="muted">本地存档（浏览器 localStorage）。导出可跨设备迁移。</p>';
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">存档位</h3>';
  var meta={};
  try{ meta=JSON.parse(localStorage.getItem(HB.SAVE_META)||"{}"); }catch(e){}
  for(var i=0;i<=5;i++){
    var m=meta["s"+i];
    h+='<div class="slot-card"><div class="sinfo"><b>'+(i===0?"自动存档":"存档 "+i)+'</b><br>'+(m?(m.mode==="story"?"主线":"自由")+" · "+m.date+" · 第"+m.day+"天 · 主线"+m.ch+"/12":"空")+'</div>';
    h+='<button class="btn btn-sm '+(i===0?"":"btn-p")+'" onclick="HB.saveSlot('+i+')">保存</button>';
    h+='<button class="btn btn-sm" '+(m?"":"disabled")+' onclick="HB.loadSlot('+i+')">读取</button></div>';
  }
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">导出 / 导入</h3>';
  h+='<textarea id="saveArea" style="width:100%;height:90px;background:#0a1016;color:#8fd0a8;border:1px solid #23344a;font-family:monospace;font-size:11px;padding:6px"></textarea>';
  h+='<div class="row mt"><button class="btn btn-p" onclick="HB.exportToArea()">导出到文本框</button>';
  h+='<button class="btn" onclick="HB.downloadSave()">下载 .json 文件</button>';
  h+='<button class="btn btn-g" onclick="HB.importFromArea()">从文本框导入</button></div>';
  HB.ui.openModal("存档管理", h);
};
HB.saveSlot = function(i){ if(HB.saveGame(i)){HB.toast("已保存到"+(i===0?"自动存档":"存档 "+i));HB.openSave();} else HB.toast("保存失败（存储可能被禁用）"); };
HB.loadSlot = function(i){
  if(HB.loadGame(i)){ HB.ui.closeModal(); } else HB.toast("读档失败");
};
HB.exportToArea = function(){
  document.getElementById("saveArea").value=HB.exportSave();
  HB.toast("已导出，复制文本框内容即可");
};
HB.downloadSave = function(){
  var blob=new Blob([HB.exportSave()],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="HanBerONE_save.json";
  document.body.appendChild(a); a.click(); a.remove();
  HB.toast("存档已下载");
};
HB.importFromArea = function(){
  var v=document.getElementById("saveArea").value.trim();
  if(!v){ HB.toast("文本框是空的"); return; }
  if(HB.importSave(v)){ HB.ui.closeModal(); } else HB.toast("导入失败：格式不正确");
};

// ---------- 返回主菜单 ----------
HB.ui.confirmBackMenu = function(){
  var h='<p>返回主菜单会保留当前进度（已自动存档）。</p>';
  var foot='<button class="btn" onclick="HB.ui.closeModal()">继续游戏</button><button class="btn btn-d" onclick="HB.ui.backMenu()">返回主菜单</button>';
  HB.ui.openModal("回到主菜单", h, foot);
};
HB.ui.backMenu = function(){
  HB.ui.closeModal();
  if(HB.travel.timer){clearTimeout(HB.travel.timer);HB.travel.timer=null;HB.travel.active=false;}
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("titleScreen").style.display="flex";
  HB.ui.titleRefresh();
};

<script>
// ===== HanBer ONE · UI 2：对话 / 场景 / 地图 / 标题 =====
window.HB = window.HB || {};
HB.dlg = HB.dlg || {};
HB.ui = HB.ui || {};

// ---------- 开场旁白 ----------
HB.dlg.playIntro = function(mode){
  var lines = mode==="story" ? HB.storyIntro : HB.freeIntro;
  var i=0;
  var body=HB.ui.openModal(mode==="story"?"序章 · 1988 年 1 月 1 日":"自由模式 · 世界与你", "", "", {noClose:true});
  body.innerHTML='<div id="introLines"></div><div class="row mt"><button class="btn btn-p btn-block" id="introNext">继续</button></div>';
  var box=document.getElementById("introLines");
  function show(){
    box.innerHTML='';
    var it=lines[i];
    var d=document.createElement("div");
    d.className="sc-line";
    d.innerHTML='<div class="who">'+it.who+'</div><div class="txt">'+it.text.replace(/</g,"&lt;")+'</div>';
    box.appendChild(d);
    if(i>=lines.length-1){
      document.getElementById("introNext").textContent="进入世界";
    }
  }
  show();
  document.getElementById("introNext").addEventListener("click", function(){
    i++;
    if(i<lines.length){ show(); }
    else {
      HB.ui.closeModal();
      if(mode==="story") HB.storyDay();
      HB.hint(mode==="story"
        ? "主线第一章已开启：前往任务面板查看目标。世界地图点击任意地点可旅行。"
        : "自由模式开始：活过 365 天。地图上 32 个地点任你探索，任务板上有 16 个支线。");
    }
  });
};

// ---------- 通用逐行对话 ----------
HB.dlg.playLines = function(lines, cb){
  var i=0;
  var body=HB.ui.openModal("对话", "", "", {noClose:true});
  body.innerHTML='<div id="dlgLines"></div><div class="row mt"><button class="btn btn-p btn-block" id="dlgNext">继续</button></div>';
  function show(){
    document.getElementById("dlgLines").innerHTML='';
    var it=lines[i];
    var d=document.createElement("div");
    d.className="sc-line";
    d.innerHTML='<div class="who">'+(it.who||"旁白")+'</div><div class="txt">'+it.text.replace(/</g,"&lt;")+'</div>';
    document.getElementById("dlgLines").appendChild(d);
    document.getElementById("dlgNext").textContent = i>=lines.length-1?"结束":"继续";
  }
  show();
  document.getElementById("dlgNext").addEventListener("click", function(){
    i++;
    if(i<lines.length) show();
    else { HB.ui.closeModal(); cb(); }
  });
};

// ---------- 剧情场景 ----------
HB.dlg.sceneModal = function(ch, part, onDone){
  var ov=HB.sceneOpen();
  var kicker = part==="open" ? ("第"+ch.id+"章 · "+ch.mo) : ("第"+ch.id+"章 · 收尾");
  ov.querySelector(".sc-kicker").textContent = kicker;
  ov.querySelector(".sc-title").textContent = "《"+ch.title+"》";
  ov.querySelector(".sc-date").textContent = HB.fmtDate(HB.state.date);
  HB.sceneRun(ch, part, 0, function(){
    // 收尾章显示悬念与预告
    if(part==="close"){
      var body=document.getElementById("sceneBody");
      var d=document.createElement("div");
      d.className="sc-cliff";
      d.innerHTML='<div class="ct">— 本章悬念 —</div><div class="cx">'+ch.cliff.replace(/</g,"&lt;")+'</div>';
      body.appendChild(d);
      if(ch.preview){
        var d2=document.createElement("div");
        d2.className="sc-cliff";
        d2.innerHTML='<div class="ct">— 下章预告 —</div><div class="cx">'+ch.preview.replace(/</g,"&lt;")+'</div>';
        body.appendChild(d2);
      }
      var b=document.createElement("div");
      b.className="row mt";
      b.innerHTML='<button class="btn btn-p btn-block" id="sceneDone">继续旅程</button>';
      body.appendChild(b);
      document.getElementById("sceneDone").addEventListener("click", function(){ HB.sceneClose(); onDone(); });
    } else {
      var b=document.createElement("div");
      b.className="row mt";
      b.innerHTML='<button class="btn btn-p btn-block" id="sceneDone">我明白了</button>';
      document.getElementById("sceneBody").appendChild(b);
      document.getElementById("sceneDone").addEventListener("click", function(){ HB.sceneClose(); onDone(); });
    }
  });
};
HB.dlg.sceneLine = function(text, type, next, who){
  var body=document.getElementById("sceneBody");
  if(!body) { next(); return; }
  var d=document.createElement("div");
  if(type==="narr"){ d.className="sc-narr"; d.textContent=text; }
  else { d.className="sc-line"; d.innerHTML='<div class="who">'+(who||"旁白")+'</div><div class="txt"></div>'; d.querySelector(".txt").textContent=text; }
  body.appendChild(d);
  body.scrollTop=body.scrollHeight;
  var b=document.createElement("div");
  b.className="row mt";
  b.innerHTML='<button class="btn btn-sm btn-p" id="sceneNext">继续 ▶</button>';
  body.appendChild(b);
  document.getElementById("sceneNext").addEventListener("click", function(){
    b.remove();
    next();
  });
};
HB.dlg.sceneChoice = function(s, cb){
  var body=document.getElementById("sceneBody");
  if(!body){ cb({}); return; }
  var d=document.createElement("div");
  d.className="sc-line";
  d.innerHTML='<div class="who">抉择</div><div class="txt">'+s.text.replace(/</g,"&lt;")+'</div>';
  body.appendChild(d);
  var box=document.createElement("div");
  box.className="col mt";
  s.options.forEach(function(opt){
    var b=document.createElement("button");
    b.className="dlg-opt"; b.textContent=opt.t;
    b.addEventListener("click", function(){ box.remove(); cb(opt); });
    box.appendChild(b);
  });
  body.appendChild(box);
  body.scrollTop=body.scrollHeight;
};

// ---------- 事件弹窗 ----------
HB.dlg.eventModal = function(ev, onDone){
  var p=HB.state.player;
  var h='<p class="bold">'+ev.title+'</p><p class="muted mt">'+ev.text.replace(/</g,"&lt;")+'</p><div class="col mt">';
  ev.choices.forEach(function(c,i){
    var disabled="";
    if(c.need==="pass"){ if(!p.inv.pass_fed && !p.inv.pass_red) disabled="disabled"; }
    if(c.need==="weapon"){ if(HB.equippedWeapon().dmg[0]<=2) disabled="disabled"; }
    if(c.need==="antibiotic"){ if(!p.inv.antibiotic) disabled="disabled"; }
    h+='<button class="dlg-opt" '+disabled+' id="evOpt'+i+'">'+c.t+'</button>';
  });
  h+='</div>';
  var body=HB.ui.openModal("遭遇", h, " ", {noClose:true});
  ev.choices.forEach(function(c,i){
    document.getElementById("evOpt"+i).addEventListener("click", function(){
      HB.ui.closeModal();
      var after=function(){ onDone(); };
      if(c.combat){
        var ek=c.combat;
        if(ek==="_node"){
          var nf=HB.nodes[HB.state.player.pos].f;
          ek = nf==="fed"?"trooper":nf==="red"?"patrol":nf==="wild"?"goon":"bandit";
        }
        HB.startCombat(ek,{label:ev.title+" · 战斗",onWin:after,onLose:after});
      } else {
        HB.applyFx(c.fx, after);
      }
    });
  });
};

HB.hostileChoice = function(how, nodeId){
  var p=HB.state.player, node=HB.nodes[nodeId];
  HB.ui.closeModal();
  switch(how){
    case "pass":
      var pid=node.f==="fed"?"pass_fed":"pass_red";
      if(p.inv[pid]){ HB.takeItem(pid,1); HB.log("【检查站】"+node.n+"的"+HB.factions[node.f].n+"士兵查验了你的通行证，放行了。","good"); HB.addRep(node.f,3); }
      else HB.log("【检查站】你没有通行证。","warn");
      break;
    case "bribe":
      if(p.money>=80){ p.money-=80; HB.log("【检查站】"+node.n+"的士兵数了数军票，侧身让开。","info"); }
      else { HB.log("【检查站】钱不够，只能硬闯。","warn"); HB.startCombat("patrol",{label:"硬闯检查站",onWin:function(){},onLose:function(){}}); return; }
      break;
    case "camo":
      HB.takeItem("camo",1);
      HB.log("【检查站】你混在一队搬运工里溜进了"+node.n+"。","good");
      break;
    case "fight":
      HB.startCombat(node.f==="fed"?"trooper":"patrol",{label:"强闯"+node.n,onWin:function(){HB.log("【检查站】你打出一条血路，闯进了"+node.n+"。","ev");},onLose:function(){}});
      return;
  }
  HB.uiRefresh();
  HB.ui.npcsSection();
  HB.autosave();
};

HB.map={sel:null,hover:null,anim:0};
HB.ui.initMap = function(){
  var cv=document.getElementById("mapCanvas");
  var wrap=document.getElementById("mapWrap");
  function resize(){
    cv.width=wrap.clientWidth; cv.height=wrap.clientHeight;
  }
  resize();
  window.addEventListener("resize", resize);
  cv.addEventListener("mousemove", function(ev){
    var r=cv.getBoundingClientRect();
    var pt=HB.map.toMap(ev.clientX-r.left, ev.clientY-r.top);
    HB.map.hover=HB.map.nodeAt(pt.x,pt.y);
    HB.ui.mapTooltip(ev.clientX-r.left, ev.clientY-r.top);
  });
  cv.addEventListener("mouseleave", function(){ HB.map.hover=null; document.getElementById("mapTooltip").style.display="none"; });
  cv.addEventListener("click", function(ev){
    if(HB.travel.active) return;
    var r=cv.getBoundingClientRect();
    var pt=HB.map.toMap(ev.clientX-r.left, ev.clientY-r.top);
    var nd=HB.map.nodeAt(pt.x,pt.y);
    if(nd){ HB.map.sel=nd; HB.ui.nodeInfoPanel(nd); }
    else HB.map.sel=null;
  });
  cv.addEventListener("touchstart", function(ev){
    if(HB.travel.active) return;
    var t=ev.touches[0], r=cv.getBoundingClientRect();
    var pt=HB.map.toMap(t.clientX-r.left, t.clientY-r.top);
    var nd=HB.map.nodeAt(pt.x,pt.y);
    if(nd){ HB.map.sel=nd; HB.ui.nodeInfoPanel(nd); }
  }, {passive:true});
};
HB.map.toMap = function(px,py){
  var cv=document.getElementById("mapCanvas");
  var s=Math.min(cv.width/1000, cv.height/560);
  var ox=(cv.width-1000*s)/2, oy=(cv.height-560*s)/2;
  return {x:(px-ox)/s, y:(py-oy)/s};
};
HB.map.toScreen = function(x,y){
  var cv=document.getElementById("mapCanvas");
  var s=Math.min(cv.width/1000, cv.height/560);
  var ox=(cv.width-1000*s)/2, oy=(cv.height-560*s)/2;
  return {x:x*s+ox, y:y*s+oy};
};
HB.map.nodeAt = function(x,y){
  var best=null,bd=1e9;
  for(var id in HB.nodes){
    var n=HB.nodes[id];
    var d=Math.sqrt(Math.pow(n.x-x,2)+Math.pow(n.y-y,2));
    if(d<30&&d<bd){bd=d;best=id;}
  }
  return best;
};

HB.ui.renderMap = function(){
  var cv=document.getElementById("mapCanvas");
  if(!cv||!cv.width) return;
  var ctx=cv.getContext("2d");
  var s=Math.min(cv.width/1000, cv.height/560);
  var ox=(cv.width-1000*s)/2, oy=(cv.height-560*s)/2;
  ctx.clearRect(0,0,cv.width,cv.height);
  // 海洋
  var g=ctx.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,"#0a1219"); g.addColorStop(1,"#0c141d");
  ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.translate(ox,oy); ctx.scale(s,s);
  // 经纬网格
  ctx.strokeStyle="rgba(70,96,120,.14)"; ctx.lineWidth=1;
  for(var gx=0;gx<=1000;gx+=100){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,560); ctx.stroke(); }
  for(var gy=0;gy<=560;gy+=70){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(1000,gy); ctx.stroke(); }
  // 辐射区
  var t=HB.map.anim;
  HB.radZones.forEach(function(z){
    var a=0.10+0.10*Math.sin(t/900+z[0]);
    ctx.beginPath(); ctx.arc(z[0],z[1],z[2],0,Math.PI*2);
    ctx.fillStyle="rgba(182,201,92,"+a+")"; ctx.fill();
    ctx.strokeStyle="rgba(182,201,92,.5)"; ctx.stroke();
  });
  // 大陆
  HB.continents.forEach(function(c){
    ctx.beginPath();
    c.pts.forEach(function(pt,i){ if(i===0) ctx.moveTo(pt[0],pt[1]); else ctx.lineTo(pt[0],pt[1]); });
    ctx.closePath();
    ctx.fillStyle=c.fill; ctx.fill();
    ctx.strokeStyle=c.line; ctx.lineWidth=1.4; ctx.stroke();
  });
  // 大陆标签
  ctx.font="italic 12px monospace"; ctx.fillStyle="rgba(120,140,160,.35)";
  var labels=[["北美洲",200,150],["南美洲",350,360],["欧罗巴",520,180],["非洲",530,300],["亚洲",760,160],["澳大利亚",910,450]];
  labels.forEach(function(l){ ctx.fillText(l[0], l[1]-ctx.measureText(l[0]).width/2, l[2]); });
  // 路线（从玩家所在点到所有点）
  var p=HB.state.player;
  ctx.setLineDash([3,4]);
  for(var nid in HB.nodes){
    if(nid===p.pos) continue;
    var n=HB.nodes[nid];
    ctx.beginPath();
    ctx.moveTo(HB.nodes[p.pos].x, HB.nodes[p.pos].y);
    ctx.lineTo(n.x, n.y);
    ctx.strokeStyle="rgba(90,120,150,.16)"; ctx.lineWidth=1;
    ctx.stroke();
  }
  ctx.setLineDash([]);
  // 节点
  for(var id in HB.nodes){
    var nd=HB.nodes[id];
    var isHere=id===p.pos;
    var isSel=HB.map.sel===id;
    var fc=HB.factions[nd.f].c;
    var r = nd.t==="ruin"?7: nd.t==="city"?6.5:5.5;
    if(isSel){ ctx.beginPath(); ctx.arc(nd.x,nd.y,13,0,Math.PI*2); ctx.strokeStyle="#e2a13a"; ctx.lineWidth=2; ctx.stroke(); }
    // 势力环
    ctx.beginPath(); ctx.arc(nd.x,nd.y,r+4.5,0,Math.PI*2);
    ctx.strokeStyle=fc; ctx.globalAlpha=.7; ctx.lineWidth=1.2; ctx.stroke(); ctx.globalAlpha=1;
    // 节点本体
    ctx.beginPath(); ctx.arc(nd.x,nd.y,r,0,Math.PI*2);
    ctx.fillStyle = isHere ? "#e2a13a" : (nd.rad>0? "#5a6a3a" : fc);
    ctx.fill();
    ctx.strokeStyle="#0a0f14"; ctx.lineWidth=2; ctx.stroke();
    // 辐射标记
    if(nd.rad>0){ ctx.fillStyle="rgba(182,201,92,.8)"; ctx.font="8px monospace"; ctx.fillText("×",nd.x+r-2,nd.y+r-1); }
    // 名字
    ctx.font = (isHere?"bold 11px sans-serif":"10px sans-serif");
    ctx.fillStyle = isHere?"#e2a13a":"#aebccb";
    ctx.fillText(nd.n, nd.x+r+6, nd.y+3);
  }
  ctx.restore();
  // 边界说明
  ctx.fillStyle="rgba(126,144,166,.5)";
  ctx.font="10px monospace";
  ctx.fillText("HANBER ONE · 世界局势图 · "+HB.fmtDate(HB.state.date), 10, cv.height-8);
};
// 动画循环
HB.map.loop = function(){
  HB.map.anim++;
  if(document.getElementById("gameScreen").style.display!=="none") HB.ui.renderMap();
  if(document.getElementById("titleScreen").style.display!=="none") HB.ui.renderTitle();
  requestAnimationFrame(HB.map.loop);
};

// ---------- 标题屏 ----------
HB.ui.titleInit = function(){
  var cv=document.getElementById("titleCanvas");
  function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  resize(); window.addEventListener("resize", resize);
  HB.titleParticles=[];
  for(var i=0;i<110;i++){
    HB.titleParticles.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vy:0.3+Math.random()*0.8,vx:(Math.random()-0.5)*0.2,s:0.6+Math.random()*1.8,a:0.2+Math.random()*0.5});
  }
  HB.ui.titleRefresh();
};
HB.ui.titleRefresh = function(){

  h+='<button class="btn" '+(hasSave?"":"disabled")+' onclick="HB.continueGame()">继续游戏</button>';

HB.ui.renderTitle = function(){
  var cv=document.getElementById("titleCanvas");
  if(!cv.width) return;
  var ctx=cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  var g=ctx.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,"#06090d"); g.addColorStop(1,"#0a1219");
  ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
  // 迷你地图
  ctx.save();
  var s=Math.min(cv.width/1400, cv.height/700)*0.7;
  var ox=cv.width/2-500*s, oy=cv.height*0.42-280*s;
  ctx.translate(ox,oy); ctx.scale(s,s);
  HB.continents.forEach(function(c){
    ctx.beginPath();
    c.pts.forEach(function(pt,i){ if(i===0) ctx.moveTo(pt[0],pt[1]); else ctx.lineTo(pt[0],pt[1]); });
    ctx.closePath();
    ctx.fillStyle="rgba(35,52,66,.55)"; ctx.fill();
  });
  HB.radZones.forEach(function(z){
    ctx.beginPath(); ctx.arc(z[0],z[1],z[2],0,Math.PI*2);
    ctx.fillStyle="rgba(182,201,92,.12)"; ctx.fill();
  });
  for(var id in HB.nodes){
    var nd=HB.nodes[id];
    ctx.beginPath(); ctx.arc(nd.x,nd.y,3,0,Math.PI*2);
    ctx.fillStyle=HB.factions[nd.f].c; ctx.globalAlpha=.8; ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.restore();
  // 灰烬
  HB.titleParticles.forEach(function(pt){
    pt.y+=pt.vy; pt.x+=pt.vx;
    if(pt.y>cv.height){ pt.y=-5; pt.x=Math.random()*cv.width; }
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.s,0,Math.PI*2);
    ctx.fillStyle="rgba(190,180,160,"+pt.a*0.5+")"; ctx.fill();
  });
};

<script>
// ===== HanBer ONE · 启动 =====
window.HB = window.HB || {};

// 别名
HB.uiRefresh = function(){ HB.ui.refresh(); };

HB.boot = function(){
  HB.ui.titleInit();
  HB.ui.initMap();
  HB.map.loop();
  // 自检模式: URL 带 ?test=1
  if(location.search.indexOf("test=1")>=0) HB.selftest();
};

// ---------- 自检（仅开发验证用） ----------
HB.selftest = function(){
  var out=[];
  var ok=function(msg){ out.push("[OK] "+msg); };
  var fail=function(msg){ out.push("[FAIL] "+msg); };
  try{
    // 1. 数据完整性
    if(Object.keys(HB.nodes).length>=30) ok("世界节点 "+Object.keys(HB.nodes).length+" 个");
    else fail("节点数不足");
    if(Object.keys(HB.npcs).length>=35) ok("NPC "+Object.keys(HB.npcs).length+" 名");
    else fail("NPC 不足");
    if(HB.story.length===12) ok("主线 12 章");
    else fail("主线章节数="+HB.story.length);
    if(HB.sideQuests.length>=16) ok("支线 "+HB.sideQuests.length+" 个");
    if(Object.keys(HB.items).length>=45) ok("物品 "+Object.keys(HB.items).length+" 种");
    // 2. 新游戏
    HB.newGame("story","自检员","soldier","gen");
    var p=HB.state.player;
    if(p && p.pos==="gen") ok("主线模式开局于日内瓦");
    if(p.inv.locket===1) ok("初始挂坠在背包");
    // 3. 日期与推进
    var d0=HB.state.dayCount;
    HB.dayTick(3);
    if(HB.state.dayCount===d0+3) ok("时间推进 3 天");
    // 4. 存档往返
    var saveOk=HB.saveGame(0);
    if(saveOk){ var loaded=HB.loadGame(0); if(loaded && HB.state.dayCount===d0+3) ok("存档→读档往返一致"); else fail("读档不一致"); }
    else fail("保存失败");
    // 5. 战斗模拟
    HB.startCombat("bandit",{onWin:function(){},onLose:function(){}});
    var guard=0;
    while(HB.combat.active && guard<50){ guard++; HB.combatPlayerAttack(); }
    if(!HB.combat.active) ok("战斗闭环（"+guard+" 回合内结束）");
    else fail("战斗未结束");
    // 6. 旅行
    var days=HB.travelDays("gen","ber");
    if(days>=1) ok("日内瓦→柏林 预计 "+days+" 天");
    // 7. 章节解锁判定
    HB.state.date={y:1988,m:1,d:10};
    HB.storyDay();
    if(HB.state.story.started) ok("第一章已开启");
    else fail("第一章未开启");
    // 8. 物品/合成
    HB.state.player.inv.scrap=5; HB.state.player.inv.gunpowder=5;
    var craftable=HB.canCraft(HB.craft[4]);
    if(craftable) ok("配方判定正常");
    HB.doCraft(4);
    if((HB.state.player.inv.ammo_pistol||0)>=6) ok("制作 9mm 弹药成功");
    // 9. 自由模式
    HB.newGame("free","自由人","street","chi");
    if(HB.state.mode==="free" && HB.state.player.pos==="chi") ok("自由模式开局芝加哥");
    HB.autosave();
    ok("自检完成");
  }catch(e){
    fail("异常: "+e.message+"\n"+(e.stack||"").split("\n").slice(0,3).join("\n"));
  }
  var d=document.createElement("div");
  d.style.cssText="position:fixed;left:8px;top:8px;z-index:9999;background:#0a1016;border:1px solid #31465f;color:#c8d4e2;font:12px/1.6 monospace;padding:12px;max-width:520px;max-height:80vh;overflow:auto;white-space:pre-wrap";
  d.textContent=out.join("\n");
  document.body.appendChild(d);
  console.log("SELFTEST", out.join("\n"));
};

document.addEventListener("DOMContentLoaded", HB.boot);

</script>
