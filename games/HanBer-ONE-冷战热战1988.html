<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HanBer ONE — 冷战热战生存纪事 1988</title>
<style>
/* ============ HanBer ONE · 战地简报美学 ============ */
:root{
  --bg:#0a0f14; --bg2:#0d141c; --panel:#111a25; --panel2:#16222f; --panel3:#1b2a3a;
  --line:#23344a; --line2:#31465f; --ink:#c8d4e2; --muted:#7e90a6; --dim:#55687e;
  --amber:#e2a13a; --amber2:#f2c069; --amberDim:#8a6420;
  --fed:#4a7fd0; --fedDim:#2a4a80; --red:#c24545; --redDim:#7c2b2b; --mer:#4d9e6a; --merDim:#2c5c40;
  --wild:#cf8a3a; --wildDim:#7d521f; --neu:#8b98a8; --neuDim:#4a5563;
  --hp:#d45555; --thirst:#4a9fd0; --rad:#b6c95c; --eng:#a988d8; --mor:#d4a0a8;
  --mono:"Courier New",Consolas,monospace;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 800px at 70% -10%,rgba(30,52,74,.35),transparent 60%),
                   radial-gradient(900px 700px at 10% 110%,rgba(56,36,18,.28),transparent 55%);
  color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.55;
  overflow:hidden;
}
#app{height:100vh;display:flex;flex-direction:column}
::selection{background:rgba(226,161,58,.3)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a1016}
::-webkit-scrollbar-thumb{background:#24364b;border:1px solid #16202c}
::-webkit-scrollbar-thumb:hover{background:#2f4a66}

/* ---------- 通用 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;min-height:36px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line2);cursor:pointer;font:inherit;font-size:13px;letter-spacing:.05em;
  transition:border-color .15s,color .15s,background .15s,transform .05s;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.btn:hover{border-color:var(--amber);color:var(--amber2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn-p{background:linear-gradient(180deg,#1d2c18,#16221a);border-color:#6f5a24;color:var(--amber2)}
.btn-p:hover{border-color:var(--amber);color:#ffe0a0}
.btn-d{color:#e58a8a;border-color:#5c2b2b}
.btn-d:hover{border-color:var(--red);color:#ff9a9a}
.btn-g{color:#8fd0a8;border-color:#2c5c40}
.btn-g:hover{border-color:var(--mer);color:#a8e8c0}
.btn-b{color:#8fb4e8;border-color:#2a4a80}
.btn-b:hover{border-color:var(--fed);color:#b0d0ff}
.btn-sm{padding:4px 9px;min-height:28px;font-size:12px}
.btn-lg{padding:12px 26px;min-height:46px;font-size:16px}
.btn-block{width:100%;margin-top:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.mt{margin-top:10px}.mb{margin-bottom:10px}.muted{color:var(--muted)}.dim{color:var(--dim)}
.right{text-align:right}.center{text-align:center}.bold{font-weight:700}
.grow{flex:1}
.tick{color:var(--amber2);letter-spacing:.08em;font-family:var(--mono)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.1em;margin-right:4px}
.tag-amber{color:var(--amber2);border-color:#6f5a24}
.tag-red{color:#e58a8a;border-color:#5c2b2b}
.tag-green{color:#8fd0a8;border-color:#2c5c40}
.tag-blue{color:#8fb4e8;border-color:#2a4a80}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border:1px solid;letter-spacing:.06em;white-space:nowrap}
.chip i{width:7px;height:7px;display:inline-block;border-radius:50%}
.chip-fed{color:#9fc2f2;border-color:#2a4a80;background:rgba(74,127,208,.12)} .chip-fed i{background:var(--fed)}
.chip-red{color:#eda0a0;border-color:#5c2b2b;background:rgba(194,69,69,.12)} .chip-red i{background:var(--red)}
.chip-mer{color:#9fd8b8;border-color:#2c5c40;background:rgba(77,158,106,.12)} .chip-mer i{background:var(--mer)}
.chip-wild{color:#e8b078;border-color:#7d521f;background:rgba(207,138,58,.12)} .chip-wild i{background:var(--wild)}
.chip-neu{color:#b6c2d0;border-color:#4a5563;background:rgba(139,152,168,.12)} .chip-neu i{background:var(--neu)}

/* ---------- 状态条 ---------- */
.bar{height:13px;background:#080d13;border:1px solid var(--line);position:relative;overflow:hidden;min-width:0}
.bar>i{display:block;height:100%;transition:width .25s}
.bar.b-hp>i{background:linear-gradient(90deg,#8e2f2f,#d45555)}
.bar.b-hun>i{background:linear-gradient(90deg,#8a6420,#e2a13a)}
.bar.b-thi>i{background:linear-gradient(90deg,#24587e,#4a9fd0)}
.bar.b-rad>i{background:linear-gradient(90deg,#5a7d14,#b6c95c)}
.bar.b-eng>i{background:linear-gradient(90deg,#5a4a86,#a988d8)}
.bar.b-mor>i{background:linear-gradient(90deg,#8a5a62,#d4a0a8)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#eef4fa;text-shadow:0 1px 2px #000;letter-spacing:.06em;font-family:var(--mono)}
.statrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.statrow .lbl{width:52px;color:var(--muted);flex:none}
.statrow .bar{flex:1}

/* ---------- 标题屏 ---------- */
#titleScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#070b10 0%,#0a1118 55%,#0d141c 100%);overflow:hidden}
#titleCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
#titleScreen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 0%,rgba(4,6,9,.82) 78%)}
#titleInner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;text-align:center}
#tBadge{font-family:var(--mono);font-size:12px;letter-spacing:.5em;color:var(--amberDim);border:1px solid #3c3220;padding:5px 16px;background:rgba(10,12,8,.5)}
#tTitle{font-family:var(--mono);font-size:clamp(40px,7vw,84px);font-weight:900;letter-spacing:.14em;color:#e8dcc4;
  text-shadow:0 0 18px rgba(226,161,58,.25),0 2px 0 #000,0 4px 0 rgba(0,0,0,.6);line-height:1.05}
#tTitle .o{color:var(--amber2)}
#tSub{font-size:14px;letter-spacing:.42em;color:var(--muted);margin-top:4px;text-indent:.42em}
#tYear{font-family:var(--mono);font-size:13px;color:var(--amber2);letter-spacing:.3em;margin-top:2px}
#tDiv{width:min(420px,70vw);height:1px;background:linear-gradient(90deg,transparent,#6f5a24,transparent);margin:16px 0}
#tMenu{display:flex;flex-direction:column;gap:10px;width:min(320px,80vw);position:relative;z-index:2}
#tMenu .btn{font-size:15px;letter-spacing:.22em;padding:13px 0;justify-content:center;background:rgba(17,26,37,.55);backdrop-filter:blur(2px)}
#tFoot{position:absolute;bottom:16px;z-index:2;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.18em;text-align:center;line-height:1.9}
#tTip{position:absolute;bottom:16px;right:20px;z-index:2;font-family:var(--mono);font-size:11px;color:var(--amberDim);letter-spacing:.1em}

/* ---------- 游戏屏 ---------- */
#gameScreen{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;position:relative;display:none}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  flex-wrap:wrap;z-index:5}
#topbar .logo{font-family:var(--mono);font-weight:900;letter-spacing:.16em;color:#e8dcc4;font-size:16px}
#topbar .logo .o{color:var(--amber2)}
#topbar .sep{width:1px;height:22px;background:var(--line)}
#topbar .clock{font-family:var(--mono);font-size:12px;color:var(--amber2);letter-spacing:.08em}
#topbar .where{font-size:13px;color:var(--ink)}
#topbar .spacer{flex:1}
#main{display:grid;grid-template-columns:minmax(0,1fr) 392px;min-height:0;gap:0}
#mapWrap{position:relative;min-height:0;background:var(--bg2);border-right:1px solid var(--line);overflow:hidden}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#mapTooltip{position:absolute;pointer-events:none;background:rgba(10,15,22,.94);border:1px solid var(--line2);
  padding:7px 10px;font-size:12px;max-width:240px;z-index:6;display:none;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#mapTooltip b{color:var(--amber2);letter-spacing:.06em}
#mapLegend{position:absolute;left:12px;bottom:12px;z-index:6;background:rgba(10,15,22,.9);border:1px solid var(--line);
  padding:8px 10px;font-size:11px;display:flex;flex-direction:column;gap:4px;letter-spacing:.04em}
#mapLegend .lg{display:flex;align-items:center;gap:7px}
#mapLegend .lg i{width:9px;height:9px;display:inline-block;border-radius:50%}
#mapNodeInfo{position:absolute;left:12px;top:12px;z-index:6;background:rgba(10,15,22,.92);border:1px solid var(--line2);
  padding:10px 12px;max-width:300px;font-size:12px;display:none}
#mapNodeInfo h4{color:var(--amber2);letter-spacing:.08em;margin-bottom:4px}
#mapNodeInfo .desc{color:var(--muted);margin:6px 0}
#sidePanel{overflow-y:auto;background:var(--bg2);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.sec{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.sec>h3{font-size:11px;letter-spacing:.22em;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline}
.sec>h3 .hl{color:var(--amber2);letter-spacing:0}
.sec p{color:var(--ink);font-size:12.5px}
.place-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.place-row:last-child{border-bottom:none}
.place-row .pn{color:var(--ink);flex:1}
.place-row .pd{color:var(--dim);font-size:11px;margin-right:4px}
#logPanel{background:#070c12;border-top:1px solid var(--line);max-height:150px;overflow-y:auto;padding:6px 14px;font-family:var(--mono);font-size:12px;z-index:5}
.logline{padding:2px 0;border-bottom:1px dotted rgba(35,52,74,.4);white-space:pre-wrap;line-height:1.5}
.logline .tm{color:var(--dim);margin-right:8px}
.logline.ev{color:var(--amber2)} .logline.warn{color:#e8a0a0} .logline.good{color:#9fd8b8}
.logline.sys{color:#9fc2f2} .logline.info{color:var(--ink)} .logline.cri{color:#ff7d7d;font-weight:700}

/* ---------- 弹窗 ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(4,7,10,.8);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.m{width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line2);box-shadow:0 24px 80px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.4)}
.m-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel3),var(--panel));flex:none}
.m-head h2{font-size:14px;letter-spacing:.18em;color:var(--amber2);flex:1;font-family:var(--mono)}
.m-body{padding:14px 16px;overflow-y:auto;min-height:0}
.m-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex:none;background:var(--panel2)}
.m-wide{width:min(920px,95vw)}
.m-narrow{width:min(440px,92vw)}
.xbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);
  border:1px solid var(--line);background:transparent;font-size:16px}
.xbtn:hover{color:#fff;border-color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px;border-bottom:1px dotted var(--line)}
.kv .k{color:var(--muted)} .kv .v{color:var(--ink);text-align:right}

/* ---------- 对话 ---------- */
#dlgAvatar{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:900;font-size:22px;color:#0a0f14;border-radius:50%;border:2px solid var(--line2)}
#dlgName{font-size:15px;color:var(--amber2);letter-spacing:.1em;font-weight:700}
#dlgRole{font-size:11.5px;color:var(--muted);margin-top:2px}
#dlgText{margin-top:12px;font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-wrap;min-height:70px}
#dlgChoices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.dlg-opt{display:block;text-align:left;padding:10px 14px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  cursor:pointer;font:inherit;font-size:13.5px;letter-spacing:.02em}
.dlg-opt:hover{border-color:var(--amber);color:var(--amber2);background:var(--panel3)}
.dlg-opt:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}

/* ---------- 战斗 ---------- */
#combatEnemy{display:flex;gap:14px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:12px}
#combatEnemy .face{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:900;border-radius:50%;color:#0a0f14}
#combatLog{height:150px;overflow-y:auto;background:#070c12;border:1px solid var(--line);padding:8px 10px;
  font-family:var(--mono);font-size:12px;margin-top:10px}
#combatLog .ln{padding:1px 0;color:var(--ink)}
#combatLog .ln.hit{color:#ff9a9a} #combatLog .ln.ply{color:#9fd8b8} #combatLog .ln.ev{color:var(--amber2)} #combatLog .ln.cri{color:#ffe0a0}

/* ---------- 商店 ---------- */
.shop-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:13px}
.shop-row .sn{flex:1;color:var(--ink)}
.shop-row .sd{color:var(--dim);font-size:11px;max-width:200px}
.shop-row .sp{color:var(--amber2);font-family:var(--mono);font-size:12px;min-width:70px;text-align:right}

/* ---------- 任务 ---------- */
.quest-block{border:1px solid var(--line);padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
.quest-block.done{opacity:.65}
.quest-block h4{font-size:13.5px;color:var(--ink);display:flex;gap:8px;align-items:center}
.quest-block .qd{color:var(--muted);font-size:12px;margin:6px 0}
.quest-block .obj{font-size:12.5px;padding:3px 0;color:var(--ink)}
.quest-block .obj.done{color:var(--mer)}
.quest-block .obj .st{display:inline-block;width:18px;font-family:var(--mono)}

/* ---------- 存档 ---------- */
.slot-card{border:1px solid var(--line);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;background:var(--panel2)}
.slot-card .sinfo{flex:1;font-size:12px}
.slot-card .sinfo b{color:var(--amber2);letter-spacing:.06em}

/* ---------- 剧情场景 ---------- */
#sceneBox{width:min(840px,94vw);max-height:90vh;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line2);box-shadow:0 30px 90px rgba(0,0,0,.7);position:relative;overflow:hidden}
#sceneBox .sc-head{padding:18px 22px 10px;text-align:center;border-bottom:1px dashed var(--line);position:relative;z-index:2}
#sceneBox .sc-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.5em;color:var(--amberDim);text-indent:.5em}
#sceneBox .sc-title{font-family:var(--mono);font-size:30px;font-weight:900;letter-spacing:.2em;color:#e8dcc4;text-shadow:0 2px 0 #000;margin-top:6px}
#sceneBox .sc-date{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.2em;margin-top:6px}
#sceneBody{padding:18px 22px;overflow-y:auto;position:relative;z-index:2;flex:1;min-height:0}
#sceneBox::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 20%,transparent 30%,rgba(4,7,10,.5) 100%)}
.sc-narr{font-size:14.5px;line-height:2;color:var(--ink);white-space:pre-wrap}
.sc-line{margin:10px 0;padding-left:12px;border-left:2px solid var(--line2)}
.sc-line .who{font-size:12px;color:var(--amber2);letter-spacing:.14em;font-family:var(--mono);margin-bottom:3px}
.sc-line .txt{font-size:14px;color:var(--ink);white-space:pre-wrap}
.sc-cliff{margin-top:16px;padding:12px 14px;border:1px dashed #6f5a24;background:rgba(226,161,58,.06)}
.sc-cliff .ct{font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--amber2);margin-bottom:6px}
.sc-cliff .cx{font-size:13.5px;color:var(--amber2);line-height:1.8;white-space:pre-wrap}

/* ---------- 结局/成就 ---------- */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ach{background:var(--panel2);border:1px solid var(--line);padding:8px 10px;font-size:12px}
.ach.got{border-color:#6f5a24;color:var(--amber2)}
.ach .an{font-weight:700;letter-spacing:.04em}
.ach .ad{color:var(--muted);font-size:11px;margin-top:2px}

/* ---------- 引导 ---------- */
#hintBar{position:fixed;right:14px;bottom:170px;z-index:40;max-width:300px;background:rgba(17,26,37,.95);
  border:1px solid var(--amberDim);padding:10px 12px;font-size:12.5px;color:var(--amber2);display:none;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
#hintBar .hx{margin-left:8px;cursor:pointer;color:var(--muted)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:80;background:rgba(17,26,37,.96);
  border:1px solid var(--line2);padding:9px 18px;font-size:13px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5);letter-spacing:.04em}

@media (max-width:1100px){
  #main{grid-template-columns:minmax(0,1fr) 330px}
}
@media (max-width:860px){
  #main{grid-template-columns:1fr;grid-template-rows:minmax(320px,48vh) auto}
  #mapWrap{border-right:none;border-bottom:1px solid var(--line)}
}
</style>
<style id="hanber-soviet-skin">
/* === HanBer 统一皮肤 · 后苏联忧郁美学 (Post-Soviet Melancholy) === */
html,body{
  background-color:#15181e !important;
  background-image:
    radial-gradient(ellipse at 50% -5%, rgba(201,168,106,.10), transparent 55%),
    linear-gradient(165deg,#11141a 0%,#1a1f28 48%,#231d15 100%) !important;
  color:#d6cdb8 !important;
}
#hanber-vignette{position:fixed;inset:0;z-index:99998;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,.55) 100%);}
</style>
<div id="hanber-vignette"></div>
</head>

<body>
<div id="app">

  <!-- ===== 标题屏 ===== -->
  <div id="titleScreen">
    <canvas id="titleCanvas"></canvas>
    <div id="titleInner">
      <div id="tBadge">1988 · 战后档案 · 绝密</div>
      <h1 id="tTitle">HANBER <span class="o">ONE</span></h1>
      <div id="tSub">冷战热战 · 生存纪事</div>
      <div id="tYear">世界核战 · 三年之后</div>
      <div id="tDiv"></div>
      <div id="tMenu"></div>
    </div>
    <div id="tFoot">苏美热战模拟世界观 · 单机可玩 · 本地存档<br>本作虚构历史，与现实国家、组织及个人无关</div>
    <div id="tTip">v1.0.0</div>
  </div>

  <!-- ===== 游戏屏 ===== -->
  <div id="gameScreen">
    <header id="topbar">
      <div class="logo">HANBER <span class="o">ONE</span></div>
      <div class="sep"></div>
      <div class="where" id="tbMode"></div>
      <div class="where" id="tbLoc"></div>
      <div class="clock" id="tbClock"></div>
      <div class="spacer"></div>
      <button class="btn btn-sm" id="btnChar">角色</button>
      <button class="btn btn-sm" id="btnBag">背包</button>
      <button class="btn btn-sm" id="btnQuest">任务</button>

<script>
// ===== HanBer ONE · 数据：NPC / 支线任务 =====
window.HB = window.HB || {};

HB.npcs = {
  // --- 日内瓦 ---
  sister:{n:"玛丽亚修女",node:"gen",f:"neu",title:"孤儿院院长",d:"在日内瓦郊外收留战争孤儿的修女。她是你成年之前最后的“家人”。",topics:{
    hello:"你来了。今天是你的成人日，我的孩子。你母亲把你托付给我的时候，你才这么点大。",
    self:"那一年柏林大撤退，你的母亲把你和妹妹托上车，自己却没能上来。你在孤儿院长大，妹妹贝拉……在混乱中失散了。我们找了六年。",
    rumor:"有一位常来教堂的先生，总在打听“韩家兄妹”。他说他认识你父亲。我劝你小心。",
    farewell:"孩子，不管你要走哪条路，记住：活下去，才谈得上别的。"}},
  leo:{n:"利奥",node:"gen",f:"mer",title:"集市商人",d:"日内瓦集市的老油条，什么都能弄到，只要你付得起。",topics:{
    hello:"新面孔。是逃难的还是做买卖的？在日内瓦，这两件事常常是一件事。",
    self:"战前我在苏黎世做钟表生意。现在？钟表没人要，罐头才是硬通货。",
    rumor:"听说重建委员会在收战前的加密数据设备，出价很高，但我劝你别碰那门生意。",
    farewell:"买卖平安。"},trade:["bread","water","can_food","bandage","scrap","ammo_pistol"]},
  // --- 柏林 ---
  hoffmann:{n:"汉斯·霍夫曼",node:"ber",f:"mer",title:"商队首领",d:"柏林废墟里最有名的商队头领，战前是西德陆军士官。一条腿是假肢。",companion:true,topics:{
    hello:"小子，废墟里眼神别太野。要过死亡地带，跟着我的商队走。",
    self:"1985 年我在波茨坦守桥，一颗炮弹把半条街送上天，也把我这条腿留在了那里。现在？我送货，谁给钱送谁的货。",
    rumor:"东边最近在查“文件贩子”。有人为一张磁盘杀人，杀到柏林来了。",
    farewell:"商队天亮出发。想走，就跟着。"}},
  ivan:{n:"伊万·彼得罗夫",node:"ber",f:"red",title:"走私商",d:"从莫斯科一路走私到柏林的地下商人，笑得很假，眼睛很尖。",topics:{
    hello:"你好，朋友。伊万什么都能弄到——也什么都能替你弄丢。",
    self:"战争？那只是运费贵了点。我的货从莫斯科运到这里，穿过三条战线，比你们将军的通行证都好使。",
    rumor:"你打听“特别运送”？那不是货，是人。劝你别打听。",
    farewell:"合作愉快，朋友。愉快最重要。"}},
  lena:{n:"莱娜",node:"ber",f:"wild",title:"断墙酒馆老板娘",d:"在柏林废墟开了全城唯一一家有热酒的馆子。情报比酒贵。",topics:{
    hello:"找个角落坐。第一杯算我的——活着到柏林的人都值得一杯。",
    self:"战前我丈夫在弗里德里希大街开咖啡馆。现在？咖啡馆塌了，我开了这家。酒是自己酿的，别问原料。",
    rumor:"这礼拜有三个生面孔在打听“造物主”三个字，说完就走了。我认得出那种人——身上有硝烟味。",
    farewell:"下次来带点真酒。"}},
  // --- 华沙 ---
  mikhail:{n:"米哈伊尔·索科洛夫",node:"wsw",f:"red",title:"孤儿院院长",d:"华沙老城区孤儿院的院长，戴着圆框眼镜，说话很慢。",topics:{
    hello:"孩子，你是来找人的，还是来送东西的？",
    self:"这所孤儿院战前是小学。战争之后，它装下了一百多个孩子——和他们的噩梦。",
    rumor:"去年冬天，有一批孩子被“特别运送”接走，说是去基辅的疗养院。疗养院？呵。我记得一个叫贝拉的女孩，她特别安静，总抱着一个挂坠。",
    farewell:"主保佑你。"}},
  anna:{n:"安娜",node:"wsw",f:"red",title:"地下印报员",d:"白天是印刷厂女工，晚上油印《自由华沙》报。",topics:{
    hello:"嘘——进来说话。你是商人还是学生？",
    self:"我印的报纸上只有真话，所以只能晚上印。真话在哪个时代都要躲着走。",
    rumor:"红军往西伯利亚方向运了几批“物资”，车厢是全封闭的。我的人记下了车次，三列了。",
    farewell:"别把我写进你的报告里。"}},
  // --- 基辅 ---
  sergei:{n:"谢尔盖·沃洛金",node:"kiv",f:"red",title:"红军叛逃军官",d:"前红军总参档案处的上尉。他给过你一份档案，也把自己的命押上了。",companion:true,topics:{
    hello:"你来了。我盯着火车站看了三天，就怕看到内务部的车。",
    self:"我在档案处干了四年，整理“特别运送”的卷宗。那四年里我学会了一件事：这个国家的档案里，没有一件是小事。",
    rumor:"“造物主计划”不是传闻，是卷宗编号。我见过那个编号一次，第二天那位同事就“病退”了。",
    farewell:"小心点。莫斯科的空气会杀人。"}},
  oksana:{n:"奥克萨娜",node:"kiv",f:"red",title:"农庄主",d:"基辅郊外农庄的女主人，种的黑麦能喂饱半个城。",topics:{
    hello:"要粮食？先说你是哪个阵营的，再说价格。",
    self:"田里还有地雷，我照种。人不种地，地就不养人，就这么简单。",
    rumor:"军队最近征走了不少拖拉机，说是“春耕支援”。拖拉机进了军事基地，你信吗？",
    farewell:"路上小心，夜里有人摸田。"}},
  // --- 莫斯科 ---
  yuri:{n:"尤里·安德列夫",node:"mos",f:"red",title:"黎明组织领袖",d:"莫斯科地下的抵抗网络头目。白天是电车厂钳工，晚上管着半座城的地下室。",topics:{
    hello:"跟着巷子里的白线走来的？不错，你还活着。",
    self:"“黎明”不是什么大事业——我们只是想在这座城重新亮起来之前，别让人把它彻底拆了。",
    rumor:"你要找的“寄宿学校”在城北，三个月前关的。孩子们被连夜送上火车，车次 107。记住这个数字。",
    farewell:"黎明前最黑，别死在最黑的时候。"}},
  nadia:{n:"娜迪亚",node:"mos",f:"mer",title:"黑市商人",d:"莫斯科黑市的供货人，能搞到带红星戳的罐头和带自由女神戳的药。",topics:{
    hello:"莫斯科的黑市只认一样东西：胆量。你有吗？",
    self:"红军的军用配给，商会的船货，我都有门路。别问来路，问就是缴获。",
    rumor:"内务部最近在抓“档案鼠”——偷文件的。黑市上战前档案的价格翻了三倍。",
    farewell:"下次来从后巷进。"},trade:["water","can_food","radaway","antibiotic","scrap","circuit","whiskey"]},
  kolya:{n:"科利亚",node:"mos",f:"red",title:"少年信使",d:"十二岁，跑得快，胆子大，什么巷子都钻得进。",topics:{
    hello:"你是尤里叔叔的朋友？那你可以叫我科利亚。",
    self:"我给城里送信，一封 5 军票，加急 10。大人们不敢走的路，我敢。",
    rumor:"火车站的人说，往西伯利亚的军列装的是“会哭的货”。我没听懂，但大人们听完都不说话了。",
    farewell:"再见，好心人。下次我给你捎好吃的。"}},
  // --- 列宁格勒 ---
  tanya:{n:"塔尼娅",node:"len",f:"mer",title:"港口女商",d:"列宁格勒港的报关员，明面上报棉纱，暗地里什么都报。",topics:{
    hello:"港口的规矩：先付定金，再谈货。",
    self:"波罗的海冻了大半，但生意冻不了。红军的军需官也得吃饭，对吧？",
    rumor:"有一份莫斯科发来的“转运单”在市面上流出，收件地址是西伯利亚某设施。我见过一眼——名单上全是小孩的名字。",
    farewell:"风向要变了，记得收帆。"},trade:["water","bread","whiskey","scrap","wire","filter"]},
  // --- 巴黎 ---
  jeanpaul:{n:"让-保罗",node:"par",f:"red",title:"抵抗组织联络员",d:"巴黎地下抵抗组织的联络员，白天在面包房烤面包，晚上烤情报。",topics:{
    hello:"Bonsoir。你长得不像这里的占领军，也不是本地人。有意思。",
    self:"我们做的事很简单：让巴黎别变成莫斯科的一个区。为此我们什么都愿意做。",
    rumor:"占领军的运输队每隔一周往东送一次“特殊物资”。铁皮箱子，焊死的。最近一次是三天前。",
    farewell:"自由是有代价的，朋友。很贵的代价。"}},
  // --- 伦敦 ---
  ada:{n:"艾达·福斯特",node:"lon",f:"fed",title:"电台主持人",d:"伦敦广播电台的金牌主持人。声音温柔，问的问题一针见血。",topics:{
    hello:"欢迎收听伦敦广播。今天有什么想对全世界说的吗？",
    self:"战争把新闻变成了商品，把主持人变成了间谍。我两样都干，而且干得不错。",
    rumor:"华盛顿最近有个“特别委员会”，开会的人进进出出，从不接受采访。他们说那是重建委员会的分支。我不信。",
    farewell:"电波里见。"}},
  winston:{n:"温斯顿",node:"lon",f:"fed",title:"老兵酒保",d:"伦敦老酒馆的老板，诺曼底登陆的老兵。",topics:{
    hello:"小子，喝什么？先说好，这里不谈政治——除非你请客。",
    self:"44 年我在诺曼底，85 年我在易北河，两次都是踩着泥上来的。我这辈子就学会一件事：活着回来。",
    rumor:"军部最近半夜总有车队进出，走的还是防核掩体的道。老头子我闻得出来——要出大事了。",
    farewell:"干杯。"}},
  // --- 华盛顿 ---
  mason:{n:"梅森·科尔",node:"wdc",f:"fed",title:"联邦情报官",d:"自由联邦情报局的中校，说话滴水不漏，眼神比语言诚实。",topics:{
    hello:"韩先生。或者……我应该叫你“文件里那个名字”。",
    self:"我是联邦情报部欧洲处的中校。你的数据盘，你的妹妹，还有那个叫“海啸”的东西——我都知道。",
    rumor:"别急着信我，也别急着恨我。这局棋里，棋子越干净，死得越快。",
    farewell:"我们需要谈谈。私下。"}},
  helena:{n:"海伦娜·卡特",node:"wdc",f:"fed",title:"联邦军中尉",d:"联邦军宪兵部中尉，接到的命令是“全程监护”你——但她有自己的命令来源。",companion:true,topics:{
    hello:"别紧张。我的命令是监护你，不是押送你——暂时。",
    self:"我在芝加哥前线待过，见过最坏的人，也见过最好的人。你身上那股劲儿，像我在废墟里认识的另一种人。",
    rumor:"军部里有人把你写进了一份“处置清单”。谁写的，我不能说。但我建议你出门带着枪。",
    farewell:"我跟着你。不是命令，是我自己选的。"}},
  // --- 芝加哥 ---
  thomas:{n:"老托马斯",node:"chi",f:"fed",title:"粮食商人",d:"芝加哥最大的粮食批发商，战前是期货操盘手，现在操盘的是人命。",topics:{
    hello:"韩先生，久仰。你在柏林的事，芝加哥消息灵通的人都知道。",
    self:"我做粮食。粮食这东西，在和平年代是生意，在战争年代是武器，在战后是神。",
    rumor:"军阀的资金最近不对劲——他们的军火是从“某个基金会”买的，付款账户开在日内瓦。基金会？呵。",
    farewell:"生意归生意，命归命。别混。"},trade:["bread","can_food","dried_food","water","soup","coffee"]},
  ray:{n:"雷",node:"chi",f:"fed",title:"民兵队长",d:"芝加哥东区民兵队长，白天修铁路，晚上巡街。",topics:{
    hello:"外来的？芝加哥讲规矩：别惹事，别信嘴，别欠钱。",
    self:"民兵是我们自己的武装，联邦军太远，土匪太近。",
    rumor:"仓库那边闹鼠患，变异的那种，大得像狗。市政不管，我管。",
    farewell:"有事到铁轨尽头找我。"}},
  // --- 休斯顿 ---
  jack:{n:"杰克·罗林斯",node:"hou",f:"fed",title:"佣兵头子",d:"休斯顿佣兵公司的老板，纹着半个退役部队的臂章。",topics:{
    hello:"要雇人？先说价钱，再说活儿，最后说风险。",
    self:"我在阿富汗、波斯湾都打过仗。现在？谁出钱，我替谁摆平麻烦。这是职业。",
    rumor:"西海岸那边有一支“失踪”的巡逻队，联邦军找了一个月没找到。要是我的人去，三天就能给你答案——当然，要加钱。",
    farewell:"有活儿，来找我。"}},
  // --- 西雅图 ---
  rose:{n:"罗丝·陈",node:"sea",f:"fed",title:"工程师",d:"西雅图船坞的总工程师，战前造潜艇，战后修水泵。",topics:{
    hello:"你是来修东西的，还是来拆东西的？",
    self:"我修得了船，也修得了净化水站。西雅图能活到今天，一半靠运气，一半靠零件。",
    rumor:"港务局收到过一段怪信号，频率是战前的军用波段。信号源在北极圈方向，我复现不了。",
    farewell:"省着点用零件。"}},
  // --- 纽约 ---
  frankie:{n:"弗兰基",node:"nyc",f:"wild",title:"拾荒者",d:"纽约废墟里的拾荒老手，知道哪条街还能翻出宝贝。",topics:{
    hello:"纽约不欢迎生人。除非你带烟、带酒、或者带胆量。",
    self:"曼哈顿中城我闭着眼都能走。值钱的东西早被扒光了，剩下的，得用命去换。",
    rumor:"“长老”的部落占着中央公园南边，他们不收外人，但收废料。辐射让他们脑子坏了，也让他们鼻子灵了。",
    farewell:"小心头顶的楼板。"}},
  elder:{n:"变异人长老",node:"nyc",f:"wild",title:"“骨灰”部落首领",d:"中央公园里的变异人部落首领，喉咙坏了大半，说话像漏风的管子。",topics:{
    hello:"呜……外来者。我们闻到你身上有南边的味道。",
    self:"我们以前也是“正常”的，像你一样。辐射把我们变成了别的。但地底下的东西，我们知道得比你们都多。",
    rumor:"地底下有铁门，门上有字，我们看不懂。每隔几个月，门那边会传来轰鸣。",
    farewell:"别死在上面。下面比上面安全。"}},
  // --- 洛杉矶 ---
  nia:{n:"尼亚·门多萨",node:"la",f:"wild",title:"流浪医生",d:"洛杉矶唯一的正经医生，军阀也给她几分面子——因为军阀也会生病。",topics:{
    hello:"坐下，伸手。你这个脸色，三天没睡好。",
    self:"我在南加大医学院念了五年，毕业典礼那天核弹响了。现在我的“医院”是辆救护车。",
    rumor:"卡洛斯最近在谈一笔大生意，对方从东边来，穿西装。军阀谈生意穿西装，这事不对劲。",
    farewell:"少打架，多睡觉。"}},
  carlos:{n:"卡洛斯·莫拉莱斯",node:"la",f:"wild",title:"洛杉矶军阀",d:"西海岸最大的军阀，地盘从圣莫尼卡到长滩。",topics:{
    hello:"哈，联邦的走狗，还是商会的驴子？无所谓，来我地盘，按我的规矩。",
    self:"战前我只是个卡车司机。现在？我有一座城。这叫乱世出英雄，小姐和先生。",
    rumor:"我背后有人出钱——别打听是谁，你只需要知道，他们钱多得能买下整个加利福尼亚的废铁。",
    farewell:"别死在我的地盘上，晦气。"}},
  // --- 墨西哥城 ---
  miguel:{n:"米格尔",node:"mex",f:"wild",title:"走私头目",d:"墨西哥城的走私网络头目，边境两边都有他的人。",topics:{
    hello:"过境生意，找我。联邦的墙，红军的枪，都拦不住我的车队。",
    self:"我的货从南美上来，往北走。罐头、药品、弹药、人。在墨西哥城，一切都是货物。",
    rumor:"有支车队往东边送了三个“箱子”回来，空的。运费是平时的三倍。谁付的？日内瓦的银行家。",
    farewell:"生意，生意。"}},
  // --- 多伦多 ---
  sarah:{n:"莎拉",node:"tor",f:"neu",title:"难民救助站站长",d:"多伦多难民救助站的站长，每天经手上千张逃难的脸。",topics:{
    hello:"欢迎。无论你从哪里来，这里有一张床和一碗汤。",
    self:"每天都有从边境过来的难民，鞋都走烂了。战争不结束，这张床就永远不够。",
    rumor:"华盛顿那边在搞“安置计划”，说是给难民，其实挑的都是年轻人。我有不好的预感。",
    farewell:"愿你别再需要这里的床。"}},
  // --- 斯德哥尔摩 ---
  kurt:{n:"库尔特·伯格曼",node:"sto",f:"neu",title:"船王",d:"斯德哥尔摩航运巨头的当家人，船队挂着八国国旗。",topics:{
    hello:"坐。威士忌？我这儿的威士忌比你岁数大。",
    self:"战争对我唯一的影响，是运费翻了四倍。当然，风险也翻了四倍——所以我只运最值钱的东西。",
    rumor:"我的船长在北太平洋见到过一艘不点灯的船，吃水很深，没有国旗。船速像是要去格陵兰。",
    farewell:"风浪大，掌好舵。"}},
  // --- 罗马 ---
  padre:{n:"皮奥神父",node:"rom",f:"neu",title:"圣所神父",d:"罗马中立区的老神父，见惯了忏悔，也见惯了交易。",topics:{
    hello:"孩子，进来坐。主不赶人，我也不赶。",
    self:"五十年来我听过太多秘密。有将军的，有间谍的，有母亲的。它们在我这里，都比忏悔更沉。",
    rumor:"有一群“商人”常来圣所对面开会，从不用教会的语言交谈。他们谈“孩子”和“钥匙”。我不喜欢这个话题。",
    farewell:"愿你的路有灯。"}},
  // --- 开罗 ---
  fatima:{n:"法蒂玛",node:"cai",f:"mer",title:"商栈主",d:"开罗老商栈的掌柜，祖传四代的生意。",topics:{
    hello:"茶？先喝茶，再谈生意。沙漠的规矩。",
    self:"我的商栈从祖父手里传下来。那时运丝绸，现在运罐头。货物在变，商道不变。",
    rumor:"苏伊士那边有人出钱雇“懂密码的人”，出价极高。懂密码的人，在开罗可不多。",
    farewell:"愿真主护你的驼队。"},trade:["water","dried_food","antibiotic","cloth","filter"]},
  // --- 北京 ---
  zhang:{n:"张博士",node:"bj",f:"neu",title:"中立科学家",d:"战前在某联合实验室工作过的物理学家，现在在中立区做“物资鉴定”。",topics:{
    hello:"哦，你就是那个带着磁盘满世界跑的人。坐，让我看看。",
    self:"战前我做的是理论物理，无聊的理论，有用的物理。现在？我鉴定各种“古董”，包括不该存在的东西。",
    rumor:"你手里的数据盘，加密方式是战前最高规格的。要解码，需要柏林的一台旧机器——我记不清在哪，但有人记得。",
    farewell:"物理不骗人。人才骗人。"}},
  // --- 东京 ---
  tanaka:{n:"田中修平",node:"tyo",f:"neu",title:"贸易商",d:"东京秋叶原黑市的大庄家，手下管着三条街的柜台。",topics:{
    hello:"いらっしゃい。军票、美元、日元、卢布，在我这儿都是钱。",
    self:"战争让东京捡了个大便宜——两边打仗，中间做生意。我们祖上经历过一场更大的，所以知道怎么躲。",
    rumor:"有批“医疗物资”从西伯利亚运到东京黑市，标签是绷带，打开是别的。我没拆，我的规矩是不拆别人的货。",
    farewell:"一路顺风。"},trade:["water","can_food","radaway","circuit","battery","coffee"]},
  // --- 新加坡 ---
  blue:{n:"蓝姐",node:"sin",f:"neu",title:"港务掮客",d:"新加坡自由港的地下港务代理，船进船出都要过她的手。",topics:{
    hello:"南腔北调都行，我都能给你安排船。",
    self:"马六甲的水道上，十艘船里有一艘是走私的——那艘归我管。",
    rumor:"往悉尼的客船最近订舱的人很多，都是“带孩子的家庭”。怪的是，孩子都很大了，还牵着大人的手。",
    farewell:"船不等人。"}},
  // --- 新德里 ---
  anil:{n:"阿尼尔医生",node:"del",f:"neu",title:"难民医生",d:"新德里难民营的医生，药箱比自己的命重要。",topics:{
    hello:"把手给我。你的脉搏比你看起来的样子更疲惫。",
    self:"每天都有从北方过来的病人，辐射病、疟疾、营养不良。我治不过来，但我不能不治。",
    rumor:"北边来的人说，西伯利亚的铁路线上停过一列“孩子车”。他们都说那是编的——直到有个孩子跑出来，说漏了嘴。",
    farewell:"保重。"}},
  // --- 新西伯利亚 ---
  volkov:{n:"沃尔科夫教授",node:"nvb",f:"red",title:"前设施研究员",d:"“造物主设施”的前研究员，逃出来后在雪原上躲了两年。",topics:{
    hello:"谁……谁派你来的？！抱歉。这两年，我听到车声就想跑。",
    self:"我在“造物主”待了三年。那里不造武器，不造病毒——那里造“钥匙”。人做的钥匙。",
    rumor:"设施还有第二套系统，图纸我只见过一眼，标着“深海”。他们打算把第二套藏在海底。",
    farewell:"别相信那些穿西装的人。他们不是活人，他们是一套流程。"}},
  // --- 海参崴 ---
  dima:{n:"迪玛",node:"vla",f:"red",title:"老海员",d:"海参崴的老水手，一辈子跟船打交道，见过海参崴的每一次天亮。",topics:{
    hello:"船到港了？我这辈子见的船，比你们将军见的兵还多。",
    self:"太平洋舰队还在，船壳子还在，心气儿没了。水兵们偷着卖柴油，换伏特加。",
    rumor:"往北走的船，最近多了。都往西伯利亚沿岸去。运什么？运箱子。箱子会说话？我不信，但有人在传。",
    farewell:"海风咸，路也咸。"},trade:["water","bread","whiskey","scrap"]},
  // --- 悉尼 ---
  ruby:{n:"露比",node:"syd",f:"neu",title:"电台DJ",d:"悉尼地下电台的深夜 DJ，放老唱片，念战争新闻。",topics:{
    hello:"嗨，亲爱的。悉尼的夜晚适合听歌，不适合赶路。",
    self:"我的电台功率不大，但能飘到北半球。听众们说我的声音是他们唯一能确定的“和平”。",
    rumor:"有艘客船订了去悉尼的舱位，名单上全是“家庭”。但你知道我在想什么——战争年代，谁家会有这么多孩子？",
    farewell:"晚安，世界。"}},
  // --- 格陵兰 ---
  oleg:{n:"奥列格站长",node:"gl",f:"neu",title:"雷达站站长",d:"格陵兰废弃雷达站的看守人，靠一台柴油发电机活着。",topics:{
    hello:"来客了？两年来第一个。咖啡管够，信号——看情况。",
    self:"这站子战前盯着北方的导弹。现在导弹没了，信号还在。有些信号，不该在这个频率上出现。",
    rumor:"上个月我截到一段 12 秒的密码，解码后是一串坐标：南纬 66°，东经 140°。那地方只有冰。",
    farewell:"带上手套，外面零下四十度。"}}
};

  {who:"旁白",text:"1988 年 1 月 1 日，日内瓦。\n核战争爆发的第三年。\n1985 年，柏林危机升级为全面战争；1985 年 11 月，双方在一天之内互掷了数十枚核弹；1987 年 1 月，双方在日内瓦签署停火协议——但谁都没有撤军。\n世界裂成两半。你在裂缝里长大。"},
  {who:"旁白",text:"你的名字叫韩。你十九岁，在孤儿院长大。\n你母亲死在 1985 年柏林大撤退的车站，你妹妹贝拉在混乱中失踪——六年了，杳无音信。\n今天是你的成人日。修女说，有一封信，等了你很久。"},
  {who:"玛丽亚修女",text:"孩子，有些路，走上去就回不了头了。但有些路，不走，你会后悔一辈子。"}
];

HB.freeIntro = [
  {who:"旁白",text:"1988 年 1 月 1 日。\n战争结束了——又没结束。停火协议签了，坦克还在阵地上，辐射还在空气里。\n你是一个无名之辈，走在一条没有名字的路上。\n这个世界的规则很简单：活下去，活过这一年。"},
  {who:"旁白",text:"自由模式没有主线，没有任务清单上闪闪发光的目标。\n只有你，和这个世界。\n活过 365 天，你就赢了这场战争。"}

HB.story = [
// ================= 第一章 =================
{id:1,mo:"一月",title:"成年之日",unlock:"1988-01-01",closeAt:"ber",
 open:[
  {t:"narr",text:"日内瓦的雪下了整夜。\n这是战后第三个新年。广播里说“和平正在路上”，而你面前的烛台上，插着母亲留下的最后一根蜡烛。"},
  {t:"say",who:"玛丽亚修女",text:"今天你十九岁，韩。按法律，你成年了——按战争，你早就成年了。\n有一样东西，我替你母亲保管了十六年。"},
  {t:"give",items:{locket:1}},
  {t:"narr",text:"挂坠里是一张烧掉半边的照片：一个年轻女人抱着两个孩子，背景是柏林墙。\n照片背面有一行褪色的字：韩允中——如果我不在，告诉孩子们，去找东边的真相。"},
  {t:"say",who:"玛丽亚修女",text:"你母亲是柏林圣玛丽医院的护士，1985 年大撤退那天，她把你和贝拉送上西行的列车，自己留在了站台上。\n贝拉……我们在流亡名册上找了六年。去年冬天，有人告诉我，她在东边见过她。"},
  {t:"say",who:"玛丽亚修女",text:"这里有一封信，昨天来的。没有署名，只画着一只乌鸦。"},
  {t:"narr",text:"信上只有一行字：\n“贝拉还活着。她在东边。别相信任何一方。——乌鸦”"},
  {t:"choice",text:"你攥着信，指尖发冷。",options:[
    {t:"“我母亲到底是谁？她为什么知道这么多？”",r:"玛丽亚修女摇了摇头：“她只是个护士，韩。只是……她救的人，恰好都站在历史的节点上。”"},
    {t:"“那只乌鸦是谁？”",r:"“我不知道。但来送信的人说，他在柏林等你。”"},
    {t:"“我去东边。”",r:"修女看了你很久，最后只说了一句：“活下去，孩子。”"}]},
  {t:"narr",text:"你清点了积蓄，换上行装，站在日内瓦的雪里。\n钟声敲过十二点。新年，也是新的开始。"},
  {t:"flag",k:"ch1_start",v:1}],
 objs:[{type:"goto",node:"ber"},{type:"survive",n:3}],
 close:[
  {t:"narr",text:"柏林的冬天比日内瓦残酷十倍。断墙上的弹孔像一只只睁着的眼睛。"},
  {t:"say",who:"霍夫曼",text:"你就是信里说的那个“韩”？比我想象的年轻。\n那只乌鸦欠我一个人情，让我照看你。往东边去，得穿过死亡地带——我的商队三天后出发，你可以搭一程。"},
  {t:"narr",text:"断墙酒馆门口，一个兜帽压得很低的人与你擦肩而过，往你手里塞了一样东西。\n那是一枚挂坠——和贝拉那只，一模一样。"},
  {t:"give",items:{locket2:1}},
  {t:"narr",text:"兜帽人已经消失在雪里。你低头，挂坠的背面刻着一串坐标，和一个名字：\n伊万·彼得罗夫，华沙。"}],
 cliff:"有人在盯着你。你回头时，只见断墙上一只乌鸦扑棱棱飞走，爪子里叼着一块发亮的东西——像是一块数据盘。",
 preview:"第二章《柏林墙的阴影》：商队穿过死亡地带，而你同行的走私商伊万，正把某个秘密缝在铁箱里。那些人为了它，已经杀过三个人。"},

// ================= 第二章 =================
{id:2,mo:"二月",title:"柏林墙的阴影",unlock:"1988-02-01",closeAt:"wsw",
 open:[
  {t:"narr",text:"二月。死亡地带的雪是灰色的，弹壳在冻土里闪着光。"},
  {t:"say",who:"伊万",text:"听说你在打听去东边的路子？巧了，我也去。华沙，一批“货”。\n霍夫曼的商队顺路，你可以跟着。我付你押货的钱——按黑市的价。"},
  {t:"say",who:"霍夫曼",text:"小子，伊万的货箱从不让人碰。但我得提醒你——最近两个月，为他那口箱子杀人灭口的，已经有三起了。"},
  {t:"choice",text:"你看着那口焊死的铁箱。",options:[
    {t:"“我押货。但到了华沙，我要知道里面是什么。”",r:"伊万笑了：“到了华沙，你会后悔问这个问题的。”"},
    {t:"“我只是搭车去东边，不管货。”",r:"霍夫曼拍了拍你的肩：“聪明。有时候少知道一点，活得长一点。”"}]},
  {t:"narr",text:"商队天亮出发。铁箱在板车上咯吱作响，像一口不肯闭上的棺材。"}],
 objs:[{type:"talk",npc:"ivan"},{type:"talk",npc:"hoffmann"},{type:"goto",node:"wsw"}],
 close:[
  {t:"narr",text:"商队穿过雷区，躲过两次盘查，在深夜摸进华沙郊外的一间仓库。"},
  {t:"say",who:"伊万",text:"到了。这一趟辛苦。既然你一路都在瞟这口箱子——打开看看？反正，你也活得过今晚。"},
  {t:"narr",text:"铁箱里不是罐头，不是军火。\n是一块锈蚀的数据盘，和一沓泛黄的照片——上面全是孩子，编号从 1 到 107。"},
  {t:"narr",text:"仓库的门被炸开了。子弹扫进来。你拖起伊万滚到货堆后面。"},
  {t:"combat",enemy:"patrol"},
  {t:"say",who:"伊万",text:"（他咳着血，把数据盘塞进你手里）带……带给日内瓦那个中国人……别让莫斯科的人拿到……\n他们为它杀了多少人……你终于会知道了……快走。"},
  {t:"give",items:{datadisk:1}},
  {t:"narr",text:"你带着数据盘钻进下水道。身后，有人用俄语喊着什么。\n水声很大，盖过了你的心跳。"},
  {t:"flag",k:"got_disk",v:1}],
 cliff:"仓库废墟上，一个穿深色制服的男人放下望远镜。\n“护教士·阿列克谢”对身后敬礼的部下说：“107 号文件。活要见人，死要见尸。”",
 preview:"第三章《红军孤儿院》：华沙孤儿院的院长说，贝拉去年冬天被“特别运送”接走，目的地写着一个不属于任何地图的名字。"},

// ================= 第三章 =================
{id:3,mo:"三月",title:"红军孤儿院",unlock:"1988-03-01",closeAt:"kiv",
 open:[
  {t:"narr",text:"三月，华沙的雪化了，露出下面焦黑的街道。孤儿院的围墙刷着褪色的红五星。"},
  {t:"say",who:"米哈伊尔",text:"贝拉……这个名字我记得。去年冬天，她和其他十几个孩子，被军队的“特别运送”接走了。\n说是去基辅的疗养院。但疗养院，不收孩子。"},
  {t:"say",who:"米哈伊尔",text:"她走的时候很安静，一直抱着一个挂坠，跟你脖子上那只一模一样。\n她说：“哥哥会来找我的。”"}],
 objs:[{type:"talk",npc:"mikhail"},{type:"goto",node:"kiv"},{type:"talk",npc:"sergei"}],
 close:[
  {t:"narr",text:"基辅的火车站挤满士兵和难民。你在货运区找到了档案处的谢尔盖上尉。"},
  {t:"say",who:"谢尔盖",text:"档案我拿到了。基辅中转，目的地——莫斯科，城北“第七寄宿学校”。\n那所学校三个月前关闭，孩子们被连夜转移。交接单位：内务部，特别运输处。"},
  {t:"say",who:"谢尔盖",text:"你妹妹不是孤儿，韩。她是“造物主计划”的资产。编号 1 号。\n抱歉。这个编号，我不会记错。"},
  {t:"give",items:{intel:1}},
  {t:"flag",k:"bella_moscow",v:1},
  {t:"narr",text:"你把档案收好。谢尔盖的电话忽然响了。\n他听完，脸色发白：“他们发现档案少了。今晚，必须离开基辅。”"}],
 cliff:"火车开动前的最后一刻，你看见站台上有个人影——深色制服，胸前的徽章在路灯下一闪。\n他在微笑。",
 preview:"第四章《莫斯科的地下》：红色联盟的首都，内务部在这里嗅每一口空气。地下抵抗组织“黎明”说：贝拉的去向，和一座地图上没有的“造物主设施”有关。"},

// ================= 第四章 =================
{id:4,mo:"四月",title:"莫斯科的地下",unlock:"1988-04-01",closeAt:"mos",
 open:[
  {t:"narr",text:"四月。你跟着谢尔盖挤上开往莫斯科的货车。车厢里挤着士兵、逃难者和一笼鸡。"},
  {t:"say",who:"谢尔盖",text:"莫斯科是内务部的城市。进城容易，出城难。\n我有个地下联系人，代号“黎明”。他在电车厂做工，管着半座城的地下室。"},
  {t:"choice",text:"进城的方式，得选一个。",options:[
    {t:"走黑市弄通行证（花 120 军票）",r:"谢尔盖点头：“最稳妥。钱能买的，就别拿命去换。”",fx:{money:-120}},
    {t:"跟着黎明的人混进城",r:"“冒险，但省钱。你选吧。”"}]}],
 objs:[{type:"goto",node:"mos"},{type:"talk",npc:"yuri"}],
 close:[
  {t:"narr",text:"城北电车厂的锅炉房里，尤里就着一盏矿灯，把一份卷宗摊在桌上。"},
  {t:"say",who:"尤里",text:"“第七寄宿学校”我们盯了半年。孩子们转去的地方，叫“造物主设施”——新西伯利亚站以北，任何地图上都没有。\n这计划不建武器。它建“钥匙”。107 个孩子，107 把钥匙。你妹妹，是 1 号。"},
  {t:"say",who:"尤里",text:"而你，韩。我在名单上见过你的照片——编号 107。\n批注写着：备选密钥，1 号亲属。"},
  {t:"narr",text:"你的脑子嗡了一声。自己的照片，自己的名字，和一行冷冰冰的批注。\n谢尔盖从窗边回来，压低声音：“内务部的车，停在对街了。天亮前，必须出城。”"}],
 cliff:"出城的铁桥下，一列蒙着帆布的军列正缓缓驶过，车窗全部焊死。\n尤里在黑暗里轻声说：“那列车的方向——就是贝拉的方向。”",
 preview:"第五章《数据盘之战》：你带着伊万拼死交给你的数据盘返回西边。日内瓦的科学家说，这盘里锁着冷战最高机密——“海啸协议”。"},

// ================= 第五章 =================
{id:5,mo:"五月",title:"数据盘之战",unlock:"1988-05-01",closeAt:"ber",
 open:[
  {t:"narr",text:"五月。你带着数据盘一路向西，越过三条战线，躲过两次检查站。"},
  {t:"say",who:"谢尔盖",text:"这块盘的加密等级是“海啸级”——冷战时代双方的最高机密。\n听说全欧洲只有两台机器能解：一台在华盛顿的地堡，另一台，在柏林的地下。"},
  {t:"narr",text:"日内瓦的实验室里，张博士用放大镜看了半个晚上，只说了四个字：“是真的。”"}],
 objs:[{type:"goto",node:"gen"},{type:"talk",npc:"zhang"},{type:"goto",node:"ber"},{type:"talk",npc:"lena"}],
 close:[
  {t:"narr",text:"断墙酒馆的地下室，那台锈迹斑斑的解码机居然还能转。\n莱娜给它接上柴油发电机，机器哼了一整夜。"},
  {t:"narr",text:"黎明时分，屏幕上吐出的不是情报，而是一份协议——\n《海啸协议》：战前，美苏双方秘密约定，互押 107 名儿童为“活体密钥”，威慑对方不敢发动“第二击”。任何一方违约，系统将锁定目标，而钥匙，就是这些孩子。"},
  {t:"say",who:"???",text:"（身后传来掌声。一个穿灰西装的男人站在地下室门口）\n联邦情报部，梅森·科尔中校。你手里的东西，价值抵得上一座城市。"},
  {t:"narr",text:"话音未落，地下室的铁门被撞开——护教士的人追到了。"},
  {t:"combat",enemy:"officer"},
  {t:"say",who:"梅森",text:"（他擦了擦嘴角的血，整理领带）看来……我们得好好谈谈了。\n华盛顿，找我。带上你的盘，和你这条命。"},
  {t:"flag",k:"disk_decoded",v:1},{t:"flag",k:"mason_met",v:1}],
 cliff:"废墟屋顶上，阿列克谢放下望远镜，对通讯器说：\n“目标确认。中止公开行动。所有单位——坐标，华盛顿。”",
 preview:"第六章《铁幕之后》：联邦情报官梅森中校说，数据盘里还有一层你没读到的内容——一串正在跳动的倒计时。"},

// ================= 第六章 =================
{id:6,mo:"六月",title:"铁幕之后",unlock:"1988-06-01",closeAt:"wdc",
 open:[
  {t:"narr",text:"六月。你带着解码的真相西行。伦敦的雾，比柏林厚。"},
  {t:"say",who:"艾达",text:"（电台直播间里，她关掉话筒，声音忽然变得很轻）\n你要找的梅森中校，在华盛顿。但我要提醒你——他在军部的外号，叫“棋盘上的手”。\n跟他打交道，别让他碰你的棋子。"}],
 objs:[{type:"goto",node:"lon"},{type:"talk",npc:"ada"},{type:"goto",node:"wdc"},{type:"talk",npc:"mason"}],
 close:[
  {t:"narr",text:"华盛顿联合指挥部的地下会议厅。梅森把一张照片推过桌面：\n屏幕上，一串数字正在跳动：距 1989 年 1 月 1 日，还有 210 天。"},
  {t:"say",who:"梅森",text:"那一天，双方的第二击系统将同时点火。不是传闻，韩。是程序，是协议。\n是我们祖先埋在冷战冰层下的雷。现在，该我们踩了。"},
  {t:"choice",text:"你盯着那串倒计时。",options:[
    {t:"“你要我做什么？”",r:"梅森点燃一根烟：“芝加哥。有人想见你——一个叫‘乌鸦’的人。”"},
    {t:"“我怎么知道，你不是他们的人？”",r:"梅森笑了：“你不知道。我也希望你永远不用知道。”"}]},
  {t:"say",who:"梅森",text:"（他把一枚徽章推给你）联邦情报部特别顾问。挂上它，你能过大多数检查站。\n背面——你回头自己看。"},
  {t:"give",items:{pass_fed:1}},
  {t:"narr",text:"徽章背面，刻着一只乌鸦。"}],
 cliff:"你走出大楼时，正午的太阳白得刺眼。街对面，一个卖报的孩子冲你喊：\n“先生！芝加哥的铁路，今天又被炸断了一段！”",
 preview:"第七章《芝加哥的火焰》：军阀的账本上，有一个用墨水涂掉的名字。而“乌鸦”沃尔特将军说：执棋者，不止一个。"}
];

</script>
<script>
// ===== HanBer ONE · 数据：主线剧情 第7-12章 =====
window.HB = window.HB || {};

HB.story = (HB.story||[]).concat([
// ================= 第七章 =================
{id:7,mo:"七月",title:"芝加哥的火焰",unlock:"1988-07-01",closeAt:"chi",
 open:[
  {t:"narr",text:"七月。芝加哥的铁路被炸断三处，城东的火烧了整夜。"},
  {t:"say",who:"老托马斯",text:"军阀最近不对劲。他们的军火，是从一家“基金会”买的，付款账户开在日内瓦。\n基金会挂名“重建促进会”——可钱的流向，从来不说自己是哪边的。"},
  {t:"say",who:"雷",text:"城东仓库区，军阀的打手占了三条街。民兵人手不够。\n你要是有家伙，帮个忙——事后，我请你喝酒。"}],
 objs:[{type:"talk",npc:"thomas"},{type:"talk",npc:"ray"},{type:"kill",enemy:"trooper",n:2}],
 close:[
  {t:"narr",text:"仓库区的枪声平息后，你摸进了军阀的账房。\n账本最后一页，是七个名字。第七个，被墨水涂掉了。"},
  {t:"say",who:"沃尔特",text:"（一个披着旧军大衣的老人从阴影里走出来）\n我是沃尔特·汉密尔顿，联邦前参谋长。“乌鸦”是别人叫我的名字。\n那七个名字——包括我——就是“执棋者”。"},
  {t:"say",who:"沃尔特",text:"梅森利用你，我也利用你。但你听我说完——\n海啸协议不是人写的。是一台机器写的。战前的联合战略计算机“海啸”，在核战当天，接管了一切。"},
  {t:"narr",text:"话音未落，窗外的枪响了。沃尔特猛地推开你，自己却没躲开。\n他倒在血泊里，把半张坐标卡塞进你手心：“海底……第二套系统……在南纬……”"},
  {t:"flag",k:"walt_down",v:1},
  {t:"narr",text:"沃尔特的手表停在 21:07。\n你拿起账本，对着光看那个被涂掉的名字——隐约是一个“M”开头的姓氏。"}],
 cliff:"你在芝加哥的废墟里守到天亮。老托马斯递给你一杯酒：\n“军阀的金库昨天被搬空了。搬东西的人，穿着没番号的制服。”",
 preview:"第八章《海啸倒计时》：执棋者名单缺了第七个名字。而日内瓦重建委员会的地下三层，正有人为你准备一份“欢迎仪式”。"},

// ================= 第八章 =================
{id:8,mo:"八月",title:"海啸倒计时",unlock:"1988-08-01",closeAt:"gen",
 open:[
  {t:"narr",text:"八月。日内瓦的秋天来得早。重建委员会大楼的窗帘，拉得更紧了。"},
  {t:"say",who:"利奥",text:"委员会大楼地下三层，战时是防核掩体。最近半年，进出的都是“特别雇员”——穿西装，不挂任何国旗。\n我的送货卡车每周四进一次后门。你要是想进去——空箱子里，能装下一个人。"}],
 objs:[{type:"goto",node:"gen"},{type:"talk",npc:"leo"},{type:"talk",npc:"sister"}],
 close:[
  {t:"narr",text:"你借着利奥的货车混进大楼，在地下三层的走廊里，撞见了那个穿西装的代理人。\n他死得很快，但他的保险柜开得很慢。"},
  {t:"narr",text:"柜子里是执棋者名单——六个名字，和一段还没删干净的通讯记录。\n记录最后一栏写着：收件人，M.科尔，华盛顿。"},
  {t:"say",who:"玛丽亚修女",text:"（她不知何时站在你身后，声音很平静）\n孩子。有些真相，知道了，就回不了头了。\n你父亲当年也这么想过——然后他失踪了。"},
  {t:"flag",k:"mason_reveal",v:1},
  {t:"narr",text:"你带着名单离开。走廊尽头，电梯的数字缓缓停在 3——\n而门外，正传来整齐的脚步声。"}],
 cliff:"你从通风管道逃出大楼时，最后回望了一眼。顶层那间常年拉窗帘的办公室，灯忽然亮了。\n一个剪影站在窗前，正拿着电话。",
 preview:"第九章《西伯利亚列车》：名单上第七个名字指向西伯利亚。而新西伯利亚以北那座“地图上没有的设施”，门口刻着一个你认识的名字。"},

// ================= 第九章 =================
{id:9,mo:"九月",title:"西伯利亚列车",unlock:"1988-09-01",closeAt:"nvb",
 open:[
  {t:"narr",text:"九月。你搭上开往东方的货运列车。车厢里挤着士兵、商人和逃亡者。"},
  {t:"say",who:"海伦娜",text:"（一个穿宪兵制服的女军官在你对面坐下）\n联邦军中尉，海伦娜·卡特。梅森中校让我“全程监护”你。\n别误会——监护的意思就是，你在哪，我在哪。"},
  {t:"say",who:"谢尔盖",text:"造物主设施，在新西伯利亚以北。那是苏联地图上最大的“不存在的地方”。\n到了那儿，别相信任何向导。他们要么怕它，要么为它卖命。"},
  {t:"narr",text:"列车穿过乌拉尔。白桦林变成针叶林，针叶林变成冻土。\n车窗上结着霜，霜后面，是望不到边的黑暗。"}],
 objs:[{type:"goto",node:"nvb"},{type:"talk",npc:"volkov"},{type:"survive",n:2}],
 close:[
  {t:"narr",text:"新西伯利亚站以北四十公里，一座灰色混凝土建筑从雪原里长出来，像一颗埋了多年的牙。"},
  {t:"say",who:"沃尔科夫",text:"就是这里。“造物主设施”。门口那台——战前自动化防御系统，还醒着。\n它不认识人，只认权限和子弹。"},
  {t:"combat",enemy:"bot"},
  {t:"narr",text:"你清掉门口的守卫，却在设施大门上看到一个不该出现的名字。\n铆接的钢板上，刻着一行签名：“韩允中——系统总设计，1984。”"},
  {t:"say",who:"谢尔盖",text:"……你父亲的签名。\n他活着。他一直——就在这里。"},
  {t:"flag",k:"dad_alive",v:1},

<script>
// ===== HanBer ONE · 核心系统 =====
window.HB = window.HB || {};
HB.core = HB.core || {};

HB.SAVE_PREFIX = "hb1_slot_";
HB.SAVE_META = "hb1_saves";

// ---------- 日期 ----------
HB.monthNames = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
HB.weekNames = ["周日","周一","周二","周三","周四","周五","周六"];
HB.cal = {dim:[31,29,31,30,31,30,31,31,30,31,30,31], base:5}; // 1988-01-01 周五
HB.dayCountOf = function(y,m,d){ // 距 1988-01-01
  var n=0, ym;
  for(ym=1988; ym<y; ym++) n += (ym%4===0&&ym%100!==0)||ym%400===0 ? 366:365;
  for(m--; m>=1; m--) n += HB.cal.dim[m-1];
  return n + d - 1;
};
HB.addDays = function(date, n){
  var y=date.y, m=date.m, d=date.d, dim;
  while(n>0){
    dim = HB.cal.dim[m-1];
    if(d+n<=dim){ d+=n; n=0; } else { n-=dim-d+1; d=1; m++; if(m>12){m=1;y++;} }
  }
  return {y:y,m:m,d:d};
};
HB.fmtDate = function(date){
  var dc = HB.dayCountOf(date.y,date.m,date.d);
  return date.y+"年"+date.m+"月"+date.d+"日 " + HB.weekNames[(HB.cal.base+dc)%7];
};
HB.dateStr = function(date){ return date.y+"-"+String(date.m).padStart(2,"0")+"-"+String(date.d).padStart(2,"0"); };
HB.parseDate = function(s){ var p=s.split("-"); return {y:+p[0],m:+p[1],d:+p[2]}; };
HB.dateCmp = function(a,b){ return HB.dateStr(a)>=HB.dateStr(b); };

// ---------- 新游戏 ----------
HB.newGame = function(mode, name, originId, birthNode){
  var o = HB.origins.find(function(x){return x.id===originId}) || HB.origins[0];
  var p = {
    name: name || "韩一",
    origin: originId,
    hp:80, maxHp:80,
    hunger:80, thirst:80, rad:0, energy:70, morale:60,
    skills:{combat:10,survival:10,medical:10,charisma:10},
    skillPts:0, xp:0, level:1, perkPts:0, perks:[],
    pos: birthNode || "gen",
    money: mode==="story"?280:380,
    inv:{}, equip:{weapon:"fist",gear:null,armor:null},
    companions:{},
    rep:{fed:0,red:0,mer:0,wild:0,neu:0},
    stats:{kills:0,days:0,visited:{},crafts:0,deaths:0,travelDays:0}
  };
  if(o.fx.skills){
    p.skills.combat+= (o.fx.combat||0); p.skills.survival+=(o.fx.survival||0);
    p.skills.medical+=(o.fx.medical||0); p.skills.charisma+=(o.fx.charisma||0);
  }
  if(o.fx.hp) p.hp=p.maxHp+=o.fx.hp;
  // 初始物资
  var starter = mode==="story"
    ? {water:2,bread:2,bandage:1,scrap:3,knife:1,whiskey:0}
    : {water:2,dried_food:2,bandage:2,scrap:2,knife:1};
  for(var k in starter){ if(starter[k]>0) p.inv[k]=(p.inv[k]||0)+starter[k]; }
  p.inv.ammo_pistol = (p.inv.ammo_pistol||0)+6;

  var st = {
    v:1, mode:mode, date:{y:1988,m:1,d:1}, dayCount:0,
    player:p, journal:[], newsLog:[], ach:{} , hints:[],
    story:{next:1, prog:{}, closed:0, started:false, ended:false},
    quests:{}, visitedNodes:[], metNpcs:{}, nodeFlags:{}, worldFlags:{},
    weather:"晴"
  };
  st.visitedNodes.push(p.pos);
  st.player.stats.visited[p.pos]=1;
  HB.state = st;
  HB.applyOriginText(o);
  HB.log("【系统】"+st.date.y+"年"+st.date.m+"月"+st.date.d+"日。你醒来了。", "sys");
  HB.autosave();
  HB.uiRefresh();
  HB.ui.initGameScreen(st.mode);
  HB.dlg.playIntro(st.mode);
};
HB.applyOriginText = function(o){
  HB.log("【背景】"+o.n+"："+o.d,"info");
};

// ---------- 存档 ----------
HB.saveGame = function(slot){
  if(!HB.state) return false;
  try{
    var key = HB.SAVE_PREFIX+slot;
    localStorage.setItem(key, JSON.stringify(HB.state));
    var meta = {};
    try{ meta = JSON.parse(localStorage.getItem(HB.SAVE_META)||"{}"); }catch(e){}
    meta["s"+slot] = {mode:HB.state.mode, date:HB.fmtDate(HB.state.date), day:HB.state.dayCount, ch:HB.state.story.closed};
    localStorage.setItem(HB.SAVE_META, JSON.stringify(meta));
    return true;
  }catch(e){ return false; }
};
HB.autosave = function(){
  HB.saveGame(0);
};
HB.loadGame = function(slot){
  try{
    var raw = localStorage.getItem(HB.SAVE_PREFIX+slot);
    if(!raw) return false;
    var st = JSON.parse(raw);
    if(!st || !st.player) return false;
    HB.state = st;
    HB.ui.initGameScreen(st.mode);
    HB.uiRefresh();
    HB.log("【系统】读档完成："+HB.fmtDate(st.date)+"，第"+st.dayCount+"天。","sys");
    HB.checkPendingScenes();
    return true;
  }catch(e){ return false; }
};
HB.exportSave = function(){
  if(!HB.state) return "";
  return JSON.stringify({hb1:true, ts:Date.now(), save:HB.state});
};
HB.importSave = function(str){
  try{
    var o = JSON.parse(str);
    if(!o || !o.hb1 || !o.save || !o.save.player) return false;
    HB.state = o.save;
    HB.ui.initGameScreen(HB.state.mode);
    HB.uiRefresh();
    HB.log("【系统】导入存档完成。","sys");
    HB.checkPendingScenes();
    return true;
  }catch(e){ return false; }
};

// ---------- 数值辅助 ----------
HB.carryMax = function(){
  var p = HB.state.player;
  var cap = 20 + Math.floor(p.skills.survival*0.15);
  var g = p.equip.gear && HB.items[p.equip.gear] ? HB.items[p.equip.gear].carry||0 : 0;
  return cap + g;
};
HB.carryNow = function(){
  var p=HB.state.player, sum=0;
  for(var k in p.inv){ var it=HB.items[k]; if(it) sum += it.w*p.inv[k]; }
  return Math.round(sum*10)/10;
};
HB.equippedWeapon = function(){
  var p=HB.state.player;
  var w = p.equip.weapon && HB.items[p.equip.weapon] ? HB.items[p.equip.weapon] : HB.items.fist;
  return w;
};
HB.hasAmmo = function(w){
  if(!w.ammo) return true;
  return (HB.state.player.inv[w.ammo]||0) > 0;
};
HB.armorValue = function(){
  var p=HB.state.player, a=0;
  var it = p.equip.armor && HB.items[p.equip.armor] ? HB.items[p.equip.armor] : null;
  if(it && it.armor) a+=it.armor;
  return a;
};
HB.addItem = function(id, n){
  var p=HB.state.player; n=n||1;
  p.inv[id]=(p.inv[id]||0)+n;
  if(HB.questEvent) HB.questEvent({type:"collect",item:id});
  HB.uiRefresh();
};
HB.takeItem = function(id, n){
  var p=HB.state.player; n=n||1;
  if(!p.inv[id]) return false;
  p.inv[id]-=n;
  if(p.inv[id]<=0) delete p.inv[id];
  HB.uiRefresh();
  return true;
};
HB.gainMoney = function(n){ HB.state.player.money += n; if(HB.state.player.money<0) HB.state.player.money=0; HB.uiRefresh(); };
HB.addRep = function(f, n){
  var p=HB.state.player;
  if(!p.rep[f] && p.rep[f]!==0) return;
  p.rep[f]=Math.max(-100,Math.min(100,p.rep[f]+n));
  HB.log("【声望】"+HB.factions[f].n+" "+ (n>=0?"+":"")+n+"（当前 "+p.rep[f]+"）","info");
  HB.uiRefresh();
};
HB.gainXp = function(n){
  var p=HB.state.player;
  p.xp+=n;
  while(p.xp >= p.level*120){
    p.xp -= p.level*120;
    p.level++;
    p.maxHp+=5; p.hp=Math.min(p.maxHp,p.hp+10);
    p.skillPts+=3;
    if(p.level%4===0) p.perkPts++;
    HB.log("【升级】等级 "+p.level+"！生命上限+5，技能点+3"+(p.level%4===0?"，获得新专长！":""),"good");
  }
  HB.uiRefresh();
};
HB.heal = function(n){
  var p=HB.state.player;
  p.hp=Math.min(p.maxHp,p.hp+n);
  HB.uiRefresh();
};
HB.setFlag = function(k,v){
  HB.state.worldFlags[k]=v===undefined?1:v;
};
HB.getFlag = function(k){ return HB.state.worldFlags[k]||0; };

// ---------- 每日结算 ----------
HB.autoEat = function(){
  var p=HB.state.player;
  var food=null, drink=null;
  for(var k in p.inv){
    var it=HB.items[k]; if(!it) continue;
    if(it.cat==="food" && (p.hunger<35) && (!food || it.fx.hunger>(HB.items[food].fx.hunger||0))) food=k;
    if(it.cat==="drink" && (p.thirst<35) && (!drink || it.fx.thirst>(HB.items[drink].fx.thirst||0))) drink=k;
  }
  if(food){ HB.useItem(food,1,true); HB.log("（自动进食："+HB.items[food].n+"）","sys"); }
  if(drink){ HB.useItem(drink,1,true); HB.log("（自动饮水："+HB.items[drink].n+"）","sys"); }
};
HB.dayTick = function(n, opts){
  opts=opts||{};
  var p=HB.state.player;
  for(var i=0;i<n;i++){
    HB.state.dayCount++;
    var d=HB.state.date;
    var nd=HB.addDays(d,1); HB.state.date=nd;
    // 需求
    var hot = (HB.nodes[p.pos]&&(HB.nodes[p.pos].t==="ruin"))?3:0;
    p.hunger = Math.max(0,p.hunger-13);
    p.thirst = Math.max(0,p.thirst-16-hot);
    p.energy = Math.max(0,p.energy-14);
    var node=HB.nodes[p.pos];
    if(node && node.rad>0){
      var gear = p.equip.gear && HB.items[p.equip.gear];
      var rr = gear&&gear.radRes?gear.radRes:0;
      p.rad += node.rad*(1-rr)*(0.35+Math.random()*0.3);
    }
    // 再生 / 损伤
    var well = p.hunger>40 && p.thirst>40 && p.energy>30;
    if(well){ p.hp=Math.min(p.maxHp,p.hp+2+HB.companionCount()*1); p.morale=Math.min(100,p.morale+1); }
    else { p.morale=Math.max(0,p.morale-2); }
    if(p.hunger<=0) p.hp-=3;
    if(p.thirst<=0) p.hp-=5;
    if(p.energy<=0) p.hp-=4;
    if(p.rad>60) p.hp-=2;
    p.hp=Math.max(0,p.hp);
    HB.autoEat();
    HB.storyDay();
    if(HB.state.dayCount%7===0) HB.weeklyNews();
    if(HB.state.dayCount%30===0) HB.log("【日历】又一个月的第"+HB.state.dayCount+"天过去了。你活着。","sys");
    HB.achCheck();
    if(p.hp<=0 || p.rad>=100){
      HB.die(p.rad>=100?"辐射病发，身体再也撑不住了":"失血过多，意识慢慢模糊");
      return false;
    }
  }
  HB.uiRefresh();
  return true;
};
HB.companionCount = function(){
  var c=0; for(var k in HB.state.player.companions) if(HB.state.player.companions[k]) c++;
  return c;
};

// ---------- 天气 ----------
HB.weathers=["晴","阴","雪","细雨","辐射尘","大风"];
HB.rollWeather = function(){
  var w=HB.weathers[Math.floor(Math.random()*HB.weathers.length)];
  HB.state.weather=w; return w;
};

// ---------- 日志 ----------
HB.log = function(msg, cls){
  cls=cls||"info";
  var tm=HB.state?HB.fmtDate(HB.state.date).slice(0,11):"--";
  HB.state.journal.push({t:tm,m:msg,c:cls});
  if(HB.state.journal.length>400) HB.state.journal.splice(0,HB.state.journal.length-400);
  HB.ui.addLog(tm,msg,cls);
};

// ---------- 电台新闻 ----------
HB.weeklyNews = function(){
  var pool=HB.newsPool.filter(function(x){ return x.cond==="default" || HB.getFlag(x.cond); });
  var picks=[];
  var n=Math.min(2,pool.length);
  while(picks.length<n){ var it=pool[Math.floor(Math.random()*pool.length)]; if(picks.indexOf(it)<0) picks.push(it); }
  picks.forEach(function(it){ HB.log("【世界电台】"+it.text,"ev"); HB.state.newsLog.push(it.text); });
};

// ---------- 事件通用 ----------
HB.applyFx = function(fx, onDone){
  onDone=onDone||function(){};
  if(!fx) return onDone();
  var p=HB.state.player;
  var after=[];
  if(fx.money!==undefined) HB.gainMoney(fx.money);
  if(fx.items_give) for(var g in fx.items_give) HB.addItem(g,fx.items_give[g]);
  if(fx.items_take) for(var t in fx.items_take) HB.takeItem(t,fx.items_take[t]);
  if(fx.hp) p.hp=Math.min(p.maxHp,p.hp+fx.hp);
  if(fx.rad) p.rad=Math.max(0,Math.min(100,p.rad+fx.rad));
  if(fx.hunger) p.hunger=Math.max(0,Math.min(100,p.hunger+fx.hunger));
  if(fx.thirst) p.thirst=Math.max(0,Math.min(100,p.thirst+fx.thirst));
  if(fx.energy) p.energy=Math.max(0,Math.min(100,p.energy+fx.energy));
  if(fx.mor) p.morale=Math.max(0,Math.min(100,p.morale+fx.mor));
  if(fx.rep) for(var r in fx.rep) HB.addRep(r,fx.rep[r]);
  if(fx.days){ HB.dayTick(fx.days); if(HB.state.player.hp<=0) return; }
  if(fx.gamble){ var win=Math.random()<0.4; if(win){HB.gainMoney(fx.gamble*2);HB.log("【赌局】你赢了，揣着双倍的军票溜了。","good");}else{HB.log("【赌局】骰子向着庄家。钱没了。","warn");} }
  if(fx.info) HB.log("【见闻】"+fx.info,"ev");
  if(fx.say) HB.dlg.playLines(fx.say, function(){ after[0](); });
  if(fx.combat){
    HB.startCombat(fx.combat, {
      label:"遭遇战",
      onWin:function(){ after[0](); },
      onLose:function(){ after[0](); }
    });
  } else {
    after[0]=onDone; after[0]();
  }
  HB.uiRefresh();
};

// ---------- 事件（旅行/探索） ----------
HB.rollTravelEvent = function(){
  if(Math.random()<0.30){
    var ev=HB.travelEvents[Math.floor(Math.random()*HB.travelEvents.length)];
    return ev;
  }
  return null;
};
HB.playEvent = function(ev, onDone){
  HB.dlg.eventModal(ev, onDone);
};

// ---------- 旅行 ----------
HB.travel = {active:false, from:null, to:null, days:0, rem:0, timer:null};
HB.travelDays = function(fromId,toId){
  var a=HB.nodes[fromId], b=HB.nodes[toId];
  var dist=Math.sqrt(Math.pow(a.x-b.x,2)+Math.pow(a.y-b.y,2));
  var d=Math.max(1,Math.ceil(dist/55));
  if(a.cont!==b.cont) d=Math.ceil(d*1.6);
  if(HB.carryNow()>HB.carryMax()) d=Math.ceil(d*1.4);
  return d;
};
HB.travelStart = function(toId){
  var st=HB.state, p=st.player;
  if(HB.travel.active) return;
  if(toId===p.pos){ HB.toast("你已经在这里了。"); return; }
  var days=HB.travelDays(p.pos,toId);
  HB.travel={active:true,from:p.pos,to:toId,days:days,rem:days,timer:null};
  HB.log("【出发】从 "+HB.nodes[p.pos].n+" 前往 "+HB.nodes[toId].n+"（约 "+days+" 天）","sys");
  HB.ui.travelModal(HB.travel);
  HB.travelStep();
};
HB.travelCancel = function(){
  if(HB.travel.timer){ clearTimeout(HB.travel.timer); HB.travel.timer=null; }
  HB.travel.active=false;
  HB.ui.travelClose();
  HB.log("【行程】你取消了这次旅程。","sys");
};
HB.travelStep = function(){
  if(!HB.travel.active) return;
  var p=HB.state.player;
  if(HB.travel.rem<=0){ HB.travelArrive(); return; }
  HB.travel.rem--;
  HB.state.player.stats.travelDays++;
  var ok=HB.dayTick(1,{travel:true});
  if(!ok) return; // died
  var nodeNow=HB.nodes[HB.travel.to];
  HB.ui.travelUpdate(HB.travel.rem, HB.travel.days);
  var ev=HB.rollTravelEvent();
  if(ev){
    HB.travel.paused=true;
    HB.playEvent(ev, function(){
      HB.travel.paused=false;
      HB.travelStep();
    });
    return;
  }
  if(HB.travel.rem<=0){ HB.travelArrive(); return; }
  HB.travel.timer=setTimeout(function(){ HB.travel.timer=null; HB.travelStep(); }, 420);
};
HB.travelArrive = function(){
  var st=HB.state,p=st.player;
  var to=HB.travel.to;
  HB.travel.active=false;
  p.pos=to;
  if(!p.stats.visited[to]){ p.stats.visited[to]=1; st.visitedNodes.push(to); HB.achCheck(); }
  HB.rollWeather();
  HB.log("【到达】你抵达了"+HB.nodes[to].n+"。天气："+st.weather,"sys");
  var node=HB.nodes[to];
  var rep=p.rep[node.f]||0;
  var hostile = (node.f==="fed"||node.f==="red") && rep < -30;
  HB.ui.travelClose();
  HB.uiRefresh();
  HB.ui.nodeArrive(to, hostile);
  HB.questEvent({type:"goto",node:to});
  HB.autosave();
};

// ---------- 休息 ----------
HB.restStart = function(days){
  HB.ui.closeModal();
  HB.log("【休息】你在"+HB.nodes[HB.state.player.pos].n+"休整了 "+days+" 天。","sys");
  var ok=HB.dayTick(days);
  if(ok){
    var p=HB.state.player;
    p.energy=Math.min(100,p.energy+22*days);
    p.morale=Math.min(100,p.morale+4*days);
    if(p.hunger>30&&p.thirst>30) p.hp=Math.min(p.maxHp,p.hp+4*days);
    HB.uiRefresh();
    HB.storyDay();
    HB.autosave();
  }
};

// ---------- 战斗 ----------
HB.combat={active:false,enemy:null,ekey:null,ctx:null,defending:false,log:[]};
HB.startCombat = function(ekey, ctx){
  ctx=ctx||{};
  var e=HB.enemies[ekey];
  if(!e) return false;
  HB.combat={active:true,ekey:ekey,enemy:e,ctx:ctx,defending:false,log:[]};
  HB.combat.ehp=e.hp;
  HB.ui.combatModal(e, ekey, ctx.label||("遭遇："+e.n));
  return true;
};
HB.combatPlayerAttack = function(){
  var c=HB.combat; if(!c.active) return;
  var p=HB.state.player;
  var w=HB.equippedWeapon();
  if(w.ammo && !HB.hasAmmo(w)){
    HB.cLog("弹匣空了！你只能用拳头。","ev");
    w=HB.items.fist;
  } else if(w.ammo){
    HB.takeItem(w.ammo,1);
  }
  var hitCh = Math.min(.95, (w.acc||.75) + p.skills.combat/400);
  var roll=Math.random();
  if(roll>hitCh){
    HB.cLog("你挥出"+w.n+"，落空了。","ev");
  } else {
    var dmg=HB.rand(w.dmg[0],w.dmg[1]) + Math.floor(p.skills.combat/18) + (HB.companionCount()*1);
    var crit=Math.random()<0.08;
    if(crit) dmg=Math.round(dmg*1.8);
    var real=Math.max(1, dmg - c.enemy.arm);
    c.ehp-=real;
    HB.cLog((crit?"【暴击】":"")+"你用"+w.n+"击中"+c.enemy.n+"，造成 "+real+" 点伤害。",crit?"cri":"ply");
    if(c.ehp<=0){ HB.combatWin(); return; }
  }
  HB.combatEnemyTurn();
};
HB.combatPlayerDefend = function(){
  HB.cLog("你摆出防御姿态。","ply");
  HB.combat.defending=true;
  HB.combatEnemyTurn();
};
HB.combatPlayerItem = function(){
  HB.dlg.combatItemPick();
};
HB.combatPlayerFlee = function(){
  var p=HB.state.player;
  var ch=.35 + p.skills.survival/300;
  if(Math.random()<ch){
    HB.cLog("你抓住空当，溜了。","ev");
    HB.combatEnd();
  } else {
    HB.cLog("跑不掉！","warn");
    HB.combatEnemyTurn();
  }
};
HB.combatEnemyTurn = function(){
  var c=HB.combat; if(!c.active) return;
  var p=HB.state.player;
  var e=c.enemy;
  var act=Math.random();
  if(act<0.12){ HB.cLog(e.n+"在观察你的破绽。","ev"); }
  else if(act<0.22 && c.defending){ HB.cLog(e.n+"试探性地扑了一下，被你挡开。","ev"); }
  else {
    var hitCh=Math.min(.95,e.acc);
    var dmg = HB.rand(e.dmg[0],e.dmg[1]) - HB.armorValue();
    if(c.defending) dmg=Math.floor(dmg*0.45);
    if(Math.random()<hitCh){
      dmg=Math.max(0,dmg);
      p.hp-=dmg;
      HB.cLog(e.n+"攻击命中，你受到 "+dmg+" 点伤害。","hit");
      if(p.hp<=0){ HB.combatLose(); return; }
    } else {
      HB.cLog(e.n+"的攻击落空了。","ev");
    }
  }
  c.defending=false;
  HB.ui.combatRefresh();
};
HB.combatWin = function(){
  var c=HB.combat;
  c.log.push({t:"战斗结束。"});
  var p=HB.state.player;
  p.stats.kills++;
  HB.questEvent({type:"kill",enemy:c.ekey});
  HB.gainXp(c.enemy.xp);
  var loot=[];
  (c.enemy.loot||[]).forEach(function(l){
    if(Math.random()<l.p){ HB.addItem(l.i,l.n); loot.push(HB.items[l.i].n+"×"+l.n); }
  });
  if(loot.length) HB.log("【战利品】"+loot.join("、"),"good");
  HB.achCheck();
  HB.combatEnd();
  if(c.ctx && c.ctx.onWin) c.ctx.onWin();
};
HB.combatLose = function(){
  var ctx=HB.combat.ctx;   // 先取上下文（combatEnd 会重置）
  HB.combatEnd();
  var p=HB.state.player;
  p.hp=0;
  if(ctx && ctx.onLose){ ctx.onLose(); return; }
  HB.die("你在战斗中倒下了。");
};
HB.combatEnd = function(){
  HB.combat.active=false;
  HB.ui.combatClose();
  HB.uiRefresh();
};
HB.cLog = function(msg, cls){ HB.ui.combatLog(msg, cls); };
HB.rand = function(a,b){ return a+Math.floor(Math.random()*(b-a+1)); };

// ---------- 死亡 ----------
HB.die = function(reason){
  var p=HB.state.player;
  if(HB.travel.active){ if(HB.travel.timer){clearTimeout(HB.travel.timer);HB.travel.timer=null;} HB.travel.active=false; HB.ui.travelClose(); }
  p.stats.deaths++;
  HB.log("【死亡】"+reason,"cri");
  HB.ui.deathModal(reason);
};
HB.respawn = function(){
  var p=HB.state.player;
  p.hp=Math.max(1,Math.floor(p.maxHp*0.3));
  p.hunger=Math.max(30,p.hunger); p.thirst=Math.max(30,p.thirst); p.rad=Math.max(0,p.rad-20);
  p.money=Math.floor(p.money*0.5);
  // 丢失30%物品
  var keys=Object.keys(p.inv).filter(function(k){ return HB.items[k] && HB.items[k].cat!=="special"; });
  var lose=Math.min(keys.length, Math.floor(keys.length*0.3));
  for(var i=0;i<lose;i++){
    var kk=keys[Math.floor(Math.random()*keys.length)];
    p.inv[kk]=Math.max(0,p.inv[kk]-1); if(!p.inv[kk]) delete p.inv[kk];
  }
  HB.dayTick(2);
  HB.uiRefresh();
  HB.log("【重生】你被路过的人救起，代价是身上一半的军票和一些物资。","warn");
  HB.autosave();
};

// ---------- 任务引擎 ----------
HB.questProgress = function(quest, prog, ev){
  if(!prog) prog={};
  quest.objs.forEach(function(o,i){
    var cur=prog[i]||0;
    switch(o.type){
      case "goto": if(ev.type==="goto"&&ev.node===o.node) prog[i]=1; break;
      case "talk": if(ev.type==="talk"&&ev.npc===o.npc) prog[i]=1; break;
      case "kill": if(ev.type==="kill"&&ev.enemy===o.enemy) prog[i]=Math.min(o.n,cur+1); break;
      case "collect": if(ev.type==="collect"&&ev.item===o.item) prog[i]=Math.min(o.n,cur+HB.state.player.inv[o.item]||0); break;
      case "survive": prog[i]=HB.state.dayCount; break;
    }
  });
  var done=quest.objs.every(function(o,i){ return o.type==="survive" ? true : (prog[i]||0)>=(o.n||1); });
  var survOk=quest.objs.every(function(o,i){ return o.type!=="survive" ? true : (HB.state.dayCount>=(prog._s||0)+(o.n||0)); });
  if(!prog._s) prog._s=HB.state.dayCount;
  return done&&survOk;
};
HB.completeSideQuest = function(qid){
  var q=HB.state.quests[qid];
  q.state="done";
  var def=HB.sideQuests.find(function(x){return x.id===qid;});
  if(def){
    if(def.reward.money) HB.gainMoney(def.reward.money);
    if(def.reward.items) for(var i in def.reward.items) HB.addItem(i,def.reward.items[i]);
    if(def.reward.xp) HB.gainXp(def.reward.xp);
    if(def.rep) for(var f in def.rep) HB.addRep(f,def.rep[f]);
    HB.log("【支线完成】"+def.title+" — 报酬已结算。","good");
  }
  HB.uiRefresh();
};
HB.questEvent = function(ev){
  var st=HB.state;
  // 支线
  for(var qid in st.quests){
    var q=st.quests[qid];
    if(q.state!=="active") continue;
    var def=HB.sideQuests.find(function(x){return x.id===qid;});
    if(!def) continue;
    if(HB.questProgress(def,q.prog,ev)) HB.completeSideQuest(qid);
  }
  // 主线
  HB.storyEvent(ev);
};

// ---------- 主线剧情引擎 ----------
HB.currentChapter = function(){
  var st=HB.state;
  if(st.mode!=="story"||st.story.ended) return null;
  var ch=HB.story.find(function(c){return c.id===st.story.next;});
  return ch||null;
};
HB.storyDay = function(){
  var st=HB.state, ch=HB.currentChapter();
  if(!ch) return;
  if(!st.story.started){
    if(HB.dateCmp(st.date, HB.parseDate(ch.unlock))){
      HB.storyStart(ch);
    }
  } else {
    // 检查关闭
    var done=HB.objsAllDone(ch.objs, st.story.prog);
    if(done && st.player.pos===ch.closeAt && !st.story.closedThis){
      st.story.closedThis=true;
      HB.storyClose(ch);
    }
  }
};
HB.storyArrival = function(){ HB.storyEvent({type:"goto",node:HB.state.player.pos}); };
HB.storyEvent = function(ev){
  var st=HB.state, ch=HB.currentChapter();
  if(!ch||!st.story.started) return;
  HB.objsProgress(ch.objs, st.story.prog, ev);
  var done=HB.objsAllDone(ch.objs, st.story.prog);
  if(done && st.player.pos===ch.closeAt && !st.story.closedThis){
    st.story.closedThis=true;
    HB.storyClose(ch);
  }
};
HB.objsProgress = function(objs, prog, ev){
  objs.forEach(function(o,i){
    var cur=prog[i]||0;
    switch(o.type){
      case "goto": if(ev.type==="goto"&&ev.node===o.node) prog[i]=1; break;
      case "talk": if(ev.type==="talk"&&ev.npc===o.npc) prog[i]=1; break;
      case "kill": if(ev.type==="kill"&&ev.enemy===o.enemy) prog[i]=Math.min(o.n||1,cur+1); break;
      case "collect": if(ev.type==="collect"&&ev.item===o.item) prog[i]=Math.min(o.n||1,cur+(HB.state.player.inv[o.item]||0)); break;
      case "survive": if(!(prog[i]>0)) prog[i]=HB.state.dayCount; break;
    }
  });
};
HB.objsAllDone = function(objs, prog){
  return objs.every(function(o,i){
    if(o.type==="survive") return (prog[i]||0)>0 && HB.state.dayCount >= (prog[i]||0) + (o.n||1);
    return (prog[i]||0) >= (o.n||1);
  });
};
HB.storyStart = function(ch){
  var st=HB.state;
  st.story.started=true;
  st.story.prog={};
  st.story.closedThis=false;
  HB.log("【主线开启】第"+ch.id+"章《"+ch.title+"》","ev");
  HB.dlg.sceneModal(ch, "open", function(){
    HB.uiRefresh();
    HB.hint("主线目标已更新：查看任务面板。完成本章目标后，在 "+HB.nodes[ch.closeAt].n+" 触发剧情。");
  });
};
HB.storyClose = function(ch){
  var st=HB.state;
  HB.dlg.sceneModal(ch, "close", function(){
    st.story.closed=ch.id;
    st.story.next=ch.id+1;
    st.story.started=false;
    st.story.prog={};
    st.story.closedThis=false;
    HB.log("【主线完成】第"+ch.id+"章《"+ch.title+"》完结。","good");
    if(ch.id>=12) st.story.ended=true;
    HB.achCheck();
    HB.autosave();
    HB.uiRefresh();
  });
};

// 场景步骤执行（由 dlg.sceneModal 调用）
HB.sceneRun = function(ch, part, seq, done){
  var steps = part==="open" ? ch.open : ch.close;
  if(seq>=steps.length){ done(); return; }
  var s=steps[seq];
  var next=function(){ HB.sceneRun(ch,part,seq+1,done); };
  switch(s.t){
    case "narr": HB.dlg.sceneLine(s.text, "narr", next); break;
    case "say": HB.dlg.sceneLine(s.text, "say", next, s.who); break;
    case "give": if(s.items) for(var g in s.items) HB.addItem(g,s.items[g]); next(); break;
    case "take": if(s.items) for(var t in s.items) HB.takeItem(t,s.items[t]); next(); break;
    case "flag": HB.setFlag(s.k,s.v); next(); break;
    case "rep": if(s.f) HB.addRep(s.f,s.v); next(); break;
    case "combat": HB.startCombat(s.enemy,{label:"剧情战斗",onWin:function(){next();},onLose:function(){
        // 剧情战斗失败：不死亡、不打断场景（避免章节软锁）；第十二章终战例外，输了就真的死。
        if(ch.id>=12){ HB.combatEnd(); HB.die("你在最终决战中倒下了。"); return; }
        var pp=HB.state.player;
        pp.hp=Math.max(1,Math.floor(pp.maxHp*0.25));
        HB.log("【剧情】你在战斗中拼死撑了过来。","ev");
        HB.toast("你重伤撑过了这场战斗");
        next();
      }}); break;
    case "choice": HB.dlg.sceneChoice(s, function(opt){
        if(opt.end) HB.setFlag("ending",opt.end);
        if(opt.r) HB.dlg.sceneLine(opt.r,"say",next,s.who||"");
        else next();
      }); break;
    default: next();
  }
};

// 检查读档后需要补播的场景
HB.checkPendingScenes = function(){
  var st=HB.state;
  if(st.mode!=="story"||st.story.ended) return;
  var ch=HB.currentChapter();
  if(!ch) return;
  if(!st.story.started){
    if(HB.dateCmp(st.date, HB.parseDate(ch.unlock))) HB.storyStart(ch);
    return;
  }
  if(!st.story.closedThis){
    var done=HB.objsAllDone(ch.objs, st.story.prog);
    if(done && st.player.pos===ch.closeAt) HB.storyClose(ch);
  }
};

</script>
<script>
// ===== HanBer ONE · UI 与交互 =====
window.HB = window.HB || {};
HB.dlg = HB.dlg || {};
HB.ui = HB.ui || {};

// ---------- 通用弹窗 ----------
HB.ui.openModal = function(title, bodyHtml, footHtml, opts){
  opts=opts||{};
  var m=document.getElementById("modal"), box=document.getElementById("modalBox");
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=bodyHtml;
  var foot=document.getElementById("modalFoot");
  foot.innerHTML=footHtml||'<button class="btn" onclick="HB.ui.closeModal()">关闭</button>';
  document.getElementById("modalX").style.display = opts.noClose?"none":"flex";
  box.classList.toggle("m-wide", !!opts.wide);
  box.classList.toggle("m-narrow", !!opts.narrow);
  m.style.display="flex";
  document.getElementById("modalBody").scrollTop=0;
  return document.getElementById("modalBody");
};
HB.ui.closeModal = function(){
  var m=document.getElementById("modal");
  m.style.display="none";
  if(HB.combat.active){} // combat modal is separate overlay? we reuse modal
};
// 独立场景弹窗
HB.sceneOpen = function(){
  var d=document.createElement("div");
  d.className="ov"; d.id="sceneOv";
  d.innerHTML='<div id="sceneBox"><div class="sc-head"><div class="sc-kicker"></div><div class="sc-title"></div><div class="sc-date"></div></div><div id="sceneBody"></div></div>';
  document.body.appendChild(d);
  return d;
};
HB.sceneClose = function(){
  var d=document.getElementById("sceneOv");
  if(d) d.remove();
};

// ---------- Toast / Hint ----------
HB.toast = function(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){ t.style.display="none"; }, 2600);
};
HB.hint = function(text){
  var h=document.getElementById("hintBar");
  document.getElementById("hintText").textContent=text;
  h.style.display="block";
  clearTimeout(h._timer);
  h._timer=setTimeout(function(){ h.style.display="none"; }, 16000);
};

// ---------- 日志 ----------
HB.ui.addLog = function(tm,msg,cls){
  var el=document.getElementById("logPanel");
  var d=document.createElement("div");
  d.className="logline "+cls;

HB.ui.initGameScreen = function(mode){

HB.bindHeader = function(){
  var map={
    btnChar:function(){HB.openChar();}, btnBag:function(){HB.openBag();},
    btnQuest:function(){HB.openQuests();}, btnJournal:function(){HB.openJournal();},
    btnSave:function(){HB.openSave();}, btnMenu:function(){HB.ui.confirmBackMenu();}
  };

  document.addEventListener("keydown", function(ev){
    if(ev.key==="Escape"){ HB.ui.closeModal(); if(HB.travel.active&&HB.travel.paused){} }
  });

HB.ui.refresh = function(){
  if(!HB.state || document.getElementById("gameScreen").style.display==="none") return;
  var p=HB.state.player;
  document.getElementById("tbClock").textContent = HB.fmtDate(HB.state.date)+" · 第"+HB.state.dayCount+"天 · "+HB.state.weather;

HB.ui.renderSide = function(){

  h+='<div class="sec"><h3>生存状态 <span class="hl">'+p.name+'</span></h3>';

  h+=HB.bar("饱食",p.hunger,100,"hun");
  h+=HB.bar("饮水",p.thirst,100,"thi");
  h+=HB.bar("能量",p.energy,100,"eng");
  h+=HB.bar("辐射",p.rad,100,"rad");
  h+=HB.bar("士气",p.morale,100,"mor");

  h+='<div class="statrow"><span class="lbl">等级</span><span class="tick">Lv.'+p.level+'</span><span class="lbl" style="width:44px;margin-left:auto">经验</span><span class="tick">'+p.xp+'</span></div>';
  h+='</div>';
  // 当前位置
  h+='<div class="sec"><h3>当前位置</h3>';
  h+='<p class="bold">'+nd.n+' <span class="chip chip-'+nd.f+'"><i></i>'+HB.factions[nd.f].n+'</span></p>';
  h+='<p class="muted mt">'+nd.desc+'</p>';
  h+='<div class="mt"><span class="tag">危险 '+nd.dang+'/10</span><span class="tag">辐射 '+nd.rad+'/3</span><span class="tag">人口 '+nd.pop+'</span></div>';
  h+='</div>';
  // 行动
  h+='<div class="sec"><h3>行动</h3>';
  var places=HB.ui.placeList(nd);
  places.forEach(function(pl){
    h+='<div class="place-row"><span class="pn">'+pl.n+'</span><span class="pd">'+pl.d+'</span><button class="btn btn-sm" onclick="HB.ui.place(\''+pl.id+'\')">前往</button></div>';
  });
  h+='</div>';
  // 主线
  if(HB.state.mode==="story"){
    h+='<div class="sec"><h3>主线 · 第'+HB.state.story.next+'章</h3>';
    var ch=HB.currentChapter();
    if(!ch){ h+='<p class="muted">主线已完结。</p>'; }
    else if(!HB.state.story.started){
      h+='<p>《'+ch.title+'》将在 <span class="tick">'+ch.unlock+'</span> 解锁</p>';
      h+='<p class="muted mt">当前日期：'+HB.fmtDate(HB.state.date)+'</p>';
      h+='<button class="btn btn-sm btn-block" onclick="HB.restStart(7)">休整 7 天（推进时间）</button>';
    } else {
      h+='<p>《'+ch.title+'》进行中</p>';
      var objs=ch.objs, prog=HB.state.story.prog;
      objs.forEach(function(o,i){
        var done = o.type==="survive" ? (HB.state.dayCount>=(prog[i]||0)+o.n) : ((prog[i]||0)>=o.n);
        h+='<div class="obj'+(done?" done":"")+'"><span class="st">'+(done?"✓":"□")+'</span>'+HB.objText(o)+'</div>';
      });
      if(!HB.objsAllDone(ch.objs,prog)) h+='<p class="muted mt">完成后前往 <span class="tick">'+HB.nodes[ch.closeAt].n+'</span> 触发本章收尾</p>';
      else h+='<p class="muted mt">目标完成，去 <span class="tick">'+HB.nodes[ch.closeAt].n+'</span> 触发本章收尾</p>';
    }
    h+='</div>';
  } else {
    h+='<div class="sec"><h3>自由模式目标</h3><p>活下去，活过 <span class="tick">365 天</span>。</p><p class="muted mt">已存活：'+HB.state.dayCount+' 天。世界任你探索。</p></div>';
  }
  // 同伴
  var comps=Object.keys(p.companions).filter(function(k){return p.companions[k];});
  if(comps.length){
    h+='<div class="sec"><h3>同行者</h3>';
    comps.forEach(function(c){
      var np=HB.npcs[c];
      h+='<div class="place-row"><span class="pn">'+np.n+'</span><span class="pd">'+np.title+'</span></div>';
    });
    h+='<p class="muted">同行加成：伤害+8% · 每日自动回血+1 · 士气+2</p></div>';
  }
  document.getElementById("sidePanel").innerHTML=h;
};
HB.bar = function(lbl, val, max, cls){
  var pct=Math.max(0,Math.min(100,val/max*100));
  return '<div class="statrow"><span class="lbl">'+lbl+'</span><div class="bar b-'+cls+'"><i style="width:'+pct+'%"></i><span>'+Math.round(val)+'/'+max+'</span></div></div>';
};
HB.objText = function(o){
  switch(o.type){
    case "goto": return "前往 "+HB.nodes[o.node].n;
    case "talk": return "与 "+HB.npcs[o.npc].n+" 交谈";
    case "kill": return "击败 "+HB.enemies[o.enemy].n+" ×"+o.n;
    case "collect": return "获得 "+HB.items[o.item].n+" ×"+o.n;
    case "survive": return "在旅途中存活 "+o.n+" 天";
  }
  return "";
};
HB.ui.placeList = function(nd){
  var list=[];
  var def={
    market:{n:"集市",d:"买卖物资",id:"market"},
    tavern:{n:"酒馆",d:"消息·休整",id:"tavern"},
    clinic:{n:"诊所",d:"治疗伤病",id:"clinic"},
    board:{n:"任务板",d:"接取支线",id:"board"},
    camp:{n:"营地",d:"休息过夜",id:"camp"},
    wander:{n:"野外探索",d:"搜寻物资",id:"wander"},
    ruin:{n:"废墟搜刮",d:"高风险高回报",id:"ruin"},
    base:{n:"军事区",d:"军需品供应",id:"base"}
  };
  (nd.places||[]).forEach(function(pl){ if(def[pl]) list.push(def[pl]); });
  return list;
};
HB.ui.place = function(pid){
  var p=HB.state.player, nd=HB.nodes[p.pos];
  switch(pid){
    case "market": HB.openMarket(nd); break;
    case "tavern": HB.openTavern(nd); break;
    case "clinic": HB.openClinic(nd); break;
    case "board": HB.openBoard(nd); break;
    case "camp": HB.openRest(); break;
    case "wander": HB.ui.wander(); break;
    case "ruin": HB.ui.ruin(); break;
    case "base": HB.openBase(nd); break;
  }
};

// ---------- 探索 ----------

HB.ui.ruin = function(){

  ev = ev||pool[Math.floor(Math.random()*pool.length)];

// ---------- 集市 ----------
HB.priceOf = function(itemId, node, sell){
  var it=HB.items[itemId], nd=node;
  var mod=(nd.mods&&nd.mods[it.cat])||1;
  var rep=HB.state.player.rep[nd.f]||0;
  var factor=1 - rep*0.002;
  if(sell) return Math.max(1, Math.round(it.v*mod*0.5*(1+rep*0.002)));
  return Math.max(1, Math.round(it.v*mod*factor));
};
HB.openMarket = function(nd){
  var p=HB.state.player;
  var stock={};
  nd.npcs.forEach(function(nid){
    var np=HB.npcs[nid];
    (np.trade||[]).forEach(function(i){ stock[i]=(stock[i]||0)+1; });
  });
  var h='<p class="muted">'+nd.n+' 集市 · 汇率按声望浮动</p>';
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">购买</h3>';
  var keys=Object.keys(stock);
  if(!keys.length) h+='<p class="muted">这里没有摊位。去更大的城市吧。</p>';
  keys.forEach(function(i){
    var it=HB.items[i];
    var pr=HB.priceOf(i,nd,false);
    var can=p.money>=pr;
    h+='<div class="shop-row"><span class="sn">'+it.n+'</span><span class="sd">'+it.d.slice(0,22)+'…</span><span class="sp">'+pr+'</span><button class="btn btn-sm '+(can?"btn-p":"")+'" '+(can?"":"disabled")+' onclick="HB.buyItem(\''+i+'\',\''+nd.id+'\')">买1</button></div>';
  });
  h+='<h3 class="mt mb" style="letter-spacing:.2em;font-size:12px;color:#7e90a6">出售（0.5 折收购）</h3>';
  var sellable=Object.keys(p.inv).filter(function(k){return HB.items[k]&&HB.items[k].cat!=="special"&&HB.items[k].cat!=="weapon";});
  if(!sellable.length) h+='<p class="muted">背包里没有可卖的东西。</p>';
  sellable.forEach(function(k){
    var it=HB.items[k], pr=HB.priceOf(k,nd,true);
    h+='<div class="shop-row"><span class="sn">'+it.n+' ×'+p.inv[k]+'</span><span class="sp">'+pr+'</span><button class="btn btn-sm" onclick="HB.sellItem(\''+k+'\',\''+nd.id+'\')">卖1</button></div>';
  });
  HB.ui.openModal("集市 · "+nd.n, h);
};
HB.buyItem = function(id, nodeId){
  var p=HB.state.player, nd=HB.nodes[nodeId];
  var pr=HB.priceOf(id,nd,false);
  if(p.money<pr){ HB.toast("军票不够。"); return; }
  if(HB.carryNow()+HB.items[id].w>HB.carryMax()+0.01){ HB.toast("背包太重了。"); return; }
  p.money-=pr; HB.addItem(id,1);
  HB.log("【交易】购入 "+HB.items[id].n+"（-"+pr+"军票）","info");
  HB.openMarket(nd);
};
HB.sellItem = function(id, nodeId){
  var p=HB.state.player, nd=HB.nodes[nodeId];
  if(!p.inv[id]) return;
  var pr=HB.priceOf(id,nd,true);
  HB.takeItem(id,1); p.money+=pr;
  HB.log("【交易】售出 "+HB.items[id].n+"（+"+pr+"军票）","info");
  HB.openMarket(nd);
};

HB.tavernDrink = function(){

HB.tavernGamble = function(){
