<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>可颂传奇 · Croissant Legend</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* ============ 设计令牌 ============ */
:root{
  --ink:#3A2312;          /* 深可可，正文 */
  --ink-soft:#6B4A2A;     /* 次级文字 */
  --wood:#7A4A26;         /* 柜台木色 */
  --wood-dark:#57331A;
  --green:#2C5F4E;        /* 招牌墨绿 */
  --green-deep:#1F4638;
  --green-light:#3E7A63;
  --gold:#E9A63B;         /* 可颂金，强调色 */
  --gold-deep:#C87F2D;
  --gold-soft:#F6D9A0;
  --cream:#FAF3E3;        /* 纸色面板 */
  --cream-deep:#EFE0C2;
  --rust:#C5522F;         /* 警示 / 危险 */
  --red:#B03A2E;
  --ok:#3E8E5A;
  --white:#FFFDF7;
  --shadow:0 10px 30px rgba(58,35,18,.28);
  --radius:18px;
  --display:'Playfair Display','Noto Sans SC','PingFang SC','Microsoft YaHei',serif;
  --body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--body);
  color:var(--ink);
  background:#2A1A0E;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
button{font-family:var(--body);border:none;background:none;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{-webkit-user-drag:none}

/* ============ 背景 ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bg{
  position:absolute;inset:0;z-index:0;
  background:url('https://aka.doubaocdn.com/s/FRd2KfP1qF') center/cover no-repeat;
}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(31,70,56,.30),rgba(42,26,14,.34))}

/* ============ 顶部状态栏 ============ */
.status-bar{
  position:relative;z-index:3;
  display:flex;align-items:center;gap:18px;
  padding:10px 18px;min-height:62px;
  background:linear-gradient(180deg,var(--green-deep),var(--green));
  color:var(--white);
  border-bottom:3px solid var(--gold-deep);
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.stat{display:flex;align-items:center;gap:8px;white-space:nowrap}
.stat .ico{display:flex;align-items:center}
.stat b{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:12px;opacity:.85;margin-right:2px}
.grow{flex:1}
.time-wrap{flex:1.4;display:flex;align-items:center;gap:10px;min-width:180px}
.time-label{font-size:13px;font-weight:700;white-space:nowrap}
.time-track{flex:1;height:14px;background:rgba(255,255,255,.22);border-radius:8px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.time-fill{height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .3s linear}
.time-fill.low{background:linear-gradient(90deg,#E8944A,var(--rust))}
.mood{display:flex;align-items:center;gap:6px}
.mood .hearts{display:flex;gap:2px}
.music-btn{
  display:flex;align-items:center;justify-content:center;
  min-width:46px;min-height:46px;border-radius:12px;flex-shrink:0;
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);
  color:var(--white);transition:background .2s,color .2s;
}
.music-btn:hover{background:rgba(255,255,255,.25)}
.music-btn.muted{color:#D9CDB2;background:rgba(255,255,255,.08)}
.music-btn .m-off{display:none}
.music-btn.muted .m-off{display:flex}
.music-btn.muted .m-on{display:none}
.heart{width:14px;height:14px;clip-path:polygon(50% 0,61% 35%,100% 35%,68% 57%,79% 100%,50% 75%,21% 100%,32% 57%,0 35%,39% 35%);background:rgba(255,255,255,.35)}
.heart.on{background:#F7C15E}
.coin-fly{
  position:absolute;z-index:60;font-weight:900;color:var(--gold);
  text-shadow:0 2px 4px rgba(0,0,0,.4);pointer-events:none;
  animation:coinFly 1.1s ease-out forwards;
}
@keyframes coinFly{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-46px) scale(1.25);opacity:0}}

/* ============ 游戏区 ============ */
.game-area{position:relative;z-index:2;flex:1;display:flex;gap:12px;padding:12px;min-height:0}

/* --- 顾客队列（左） --- */
.queue-panel{
  width:252px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;
  background:rgba(250,243,227,.92);
  border:3px solid var(--wood);border-radius:var(--radius);
  padding:10px;box-shadow:var(--shadow);overflow:hidden;
}
.queue-title{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:2px;text-align:center;padding:2px 0 4px;border-bottom:2px dashed var(--cream-deep)}
.queue-scroll{flex:1;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.customer-card{
  position:relative;display:flex;align-items:center;gap:8px;
  background:var(--white);border:2px solid var(--cream-deep);border-radius:14px;
  padding:8px;transition:transform .25s ease,opacity .25s ease,border-color .25s;
}
.customer-card.leaving{transform:translateX(-40px);opacity:0}
.customer-card.served{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,166,59,.35)}
.customer-card.waiting{border-color:var(--cream-deep)}
.customer-card .avatar{width:52px;height:60px;flex-shrink:0;border-radius:10px;overflow:hidden;background:var(--cream);display:flex;align-items:flex-end;justify-content:center}
.customer-card .avatar img{width:100%;height:100%;object-fit:cover}
.customer-card .info{flex:1;min-width:0}
.customer-card .bubble{
  display:flex;align-items:center;gap:5px;background:var(--cream);border-radius:10px;
  padding:3px 7px;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px;
  border:1.5px solid var(--cream-deep);white-space:nowrap;overflow:hidden;
}
.customer-card .bubble svg{flex-shrink:0}
.patience{height:8px;background:#EDE3CE;border-radius:5px;overflow:hidden}
.patience i{display:block;height:100%;border-radius:5px;background:var(--ok);transition:width .2s linear}
.patience i.mid{background:#E9A63B}
.patience i.low{background:var(--rust)}
.queue-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-soft);font-size:13px;opacity:.7}

/* --- 工作台（中） --- */
.workbench{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,rgba(122,74,38,.92),rgba(87,51,26,.94));
  border:3px solid #4A2B16;border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.workbench::before{ /* 木纹 */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.12) 26px 30px);
}
.step-hint{
  position:relative;z-index:2;text-align:center;font-size:15px;font-weight:700;color:var(--white);
  background:rgba(31,70,56,.85);border:2px solid var(--gold-deep);border-radius:12px;
  padding:8px 14px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
}
.step-hint .arrow{color:var(--gold);font-weight:900}
.stage-wrap{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{
  position:relative;width:min(430px,82%);height:min(280px,80%);
  background:
    radial-gradient(circle at 50% 42%,#FDF6E6 0 58%,#F0E2C6 58% 62%,transparent 62%),
    linear-gradient(160deg,#8A5A2B,#5C3419);
  border-radius:14px;border:3px solid #3E2410;
  box-shadow:inset 0 6px 18px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.04) 22px 24px);pointer-events:none}
.cro-item{position:absolute;transition:opacity .35s ease,transform .35s ease}
#cDough{transform-origin:50% 80%}
#cTri{transform-origin:50% 60%}
#cBaked{transform-origin:50% 50%}
#cEgg{clip-path:inset(0 0 100% 0);transition:clip-path .15s linear}
#cWrap{opacity:0;transform:scale(.6)}
.stage .idle-text{font-size:15px;font-weight:700;color:var(--ink-soft);text-align:center;line-height:1.6;background:rgba(250,243,227,.8);border-radius:12px;padding:10px 16px;border:2px dashed var(--cream-deep)}
.oven-meter{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  width:60%;background:rgba(31,70,56,.9);border:2px solid var(--gold-deep);border-radius:10px;
  padding:4px 8px;display:none;align-items:center;gap:8px;z-index:4;
}
.oven-meter .ot{flex:1;height:12px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
.oven-meter .of{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:6px;transition:width .12s linear}
.oven-meter .ol{font-size:12px;font-weight:900;color:var(--white);font-variant-numeric:tabular-nums}
.oven-meter.warn{border-color:var(--rust);animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 3px))}75%{transform:translateX(calc(-50% + 3px))}}

/* --- 工具区 --- */
.tools{position:relative;z-index:2;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tool-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:76px;min-height:76px;
  padding:8px 12px;background:var(--cream);border:2.5px solid var(--cream-deep);border-radius:14px;
  color:var(--ink);font-size:12.5px;font-weight:700;transition:transform .15s,box-shadow .15s,border-color .15s,opacity .15s;
}
.tool-btn .tic{display:flex;align-items:center;justify-content:center;width:40px;height:40px}
.tool-btn.active{border-color:var(--gold-deep);background:var(--gold-soft);box-shadow:0 4px 12px rgba(0,0,0,.28);transform:translateY(-3px);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.28)}50%{box-shadow:0 4px 20px rgba(233,166,59,.75)}}
.tool-btn.done-btn{border-color:var(--ok);background:#D9EBD9}
.tool-btn:active{transform:scale(.95)}
.tool-btn:disabled{opacity:.4;transform:none;box-shadow:none;cursor:not-allowed}
.tool-btn .sub{font-size:10.5px;color:var(--ink-soft);font-weight:500}
.tool-btn.hint-only{pointer-events:none;border-color:var(--gold-deep);background:var(--gold-soft);box-shadow:0 4px 12px rgba(0,0,0,.28);animation:pulse 1.1s ease-in-out infinite}

/* --- 底部订单栏 --- */
.order-bar{
  position:relative;z-index:3;display:flex;align-items:center;gap:14px;
  margin:0 12px 12px;padding:10px 16px;min-height:96px;
  background:rgba(250,243,227,.95);border:3px solid var(--wood);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.order-avatar{width:64px;height:76px;flex-shrink:0;border-radius:12px;overflow:hidden;background:var(--cream);display:flex;align-items:flex-end;justify-content:center;border:2px solid var(--cream-deep)}
.order-avatar img{width:100%;height:100%;object-fit:cover}
.order-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.order-name{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.order-name .tag{font-size:11px;font-weight:700;background:var(--green);color:var(--white);border-radius:6px;padding:2px 7px}
.order-name .money{color:var(--gold-deep);font-size:16px;margin-left:auto;white-space:nowrap}
.order-patience{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);font-weight:700}
.order-patience .pt{flex:1;height:11px;background:#EDE3CE;border-radius:6px;overflow:hidden;max-width:420px}
.order-patience i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .2s linear}
.order-patience i.mid{background:#E9A63B}
.order-patience i.low{background:var(--rust)}
.deliver-btn{
  flex-shrink:0;min-height:56px;padding:12px 26px;border-radius:14px;
  background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3A2312;
  font-size:17px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.3);
  border:2px solid #A86A1F;display:none;align-items:center;gap:8px;
}
.deliver-btn.show{display:flex;animation:pulse 1s ease-in-out infinite}
.order-empty{flex:1;text-align:center;color:var(--ink-soft);font-size:14px;font-weight:500}

/* ============ 弹层 ============ */
.modal{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(31,25,14,.68);backdrop-filter:blur(3px);padding:16px;
}
.modal.show{display:flex}
.modal-card{
  width:min(560px,94%);max-height:92vh;overflow:auto;
  background:linear-gradient(180deg,#FDF8EA,var(--cream-deep));
  border:4px solid var(--wood);border-radius:22px;box-shadow:var(--shadow);
  padding:26px 28px;text-align:center;position:relative;
}
.modal-card h2{font-family:var(--display);font-size:30px;color:var(--green-deep);margin:6px 0 2px}
.modal-card .en{font-family:var(--display);font-style:italic;color:var(--gold-deep);font-size:14px;letter-spacing:2px}
.big-cro{display:flex;justify-content:center;margin:10px 0 4px}
.close-x{position:absolute;top:12px;right:16px;font-size:22px;font-weight:900;color:var(--ink-soft);width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.close-x:hover{color:var(--rust)}

/* --- 开始界面 --- */
#view-start{background:linear-gradient(rgba(31,70,56,.55),rgba(42,26,14,.6)),url('https://aka.doubaocdn.com/s/FRd2KfP1qF') center/cover}
.title-wrap{padding:6vh 20px 0}
.title-main{font-family:var(--display);font-size:clamp(44px,8vw,76px);font-weight:800;color:var(--white);text-shadow:0 4px 18px rgba(0,0,0,.5);letter-spacing:2px}
.title-sub{font-family:var(--display);font-style:italic;color:var(--gold);font-size:clamp(18px,3vw,26px);letter-spacing:6px;margin-top:2px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.hero-cro{display:flex;justify-content:center;margin:14px 0 6px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.4))}
.howto{
  width:min(680px,92%);margin:14px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.howto .card{
  flex:1;min-width:150px;background:rgba(250,243,227,.92);border-radius:14px;padding:12px 10px;
  border:2px solid var(--wood);box-shadow:0 4px 10px rgba(0,0,0,.2);
}
.howto .card .step-no{font-size:12px;font-weight:900;color:var(--gold-deep);letter-spacing:1px}
.howto .card .step-t{font-size:15px;font-weight:900;color:var(--ink);margin:2px 0}
.howto .card .step-d{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.start-btn{
  margin:26px auto 4vh;min-width:min(360px,80%);min-height:64px;border-radius:18px;
  background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3A2312;
  font-size:24px;font-weight:900;font-family:var(--display);
  border:3px solid #A86A1F;box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;gap:10px;
  animation:pulse 1.4s ease-in-out infinite;
}
.start-btn:active{transform:scale(.97)}
.record-line{color:var(--white);font-size:13.5px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.5);margin-bottom:20px}

/* --- 日结面板 --- */
.res-line{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 4px;flex-wrap:wrap}
.res-chip{background:var(--white);border:2px solid var(--cream-deep);border-radius:12px;padding:8px 16px;min-width:120px}
.res-chip .v{font-size:22px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.res-chip .k{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:1px}
.res-chip.gold .v{color:var(--gold-deep)}
.res-chip.ok .v{color:var(--ok)}
.res-chip.bad .v{color:var(--rust)}
.goal-line{font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.goal-line b{color:var(--gold-deep)}
.upgrade-title{font-size:15px;font-weight:900;color:var(--green-deep);margin:16px 0 8px;display:flex;align-items:center;gap:8px;justify-content:center}
.up-list{display:flex;flex-direction:column;gap:8px;text-align:left}
.up-card{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--cream-deep);border-radius:12px;padding:9px 12px}
.up-card .u-ico{width:42px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--cream);border-radius:10px}
.up-card .u-info{flex:1;min-width:0}
.up-card .u-name{font-size:14.5px;font-weight:900}
.up-card .u-desc{font-size:12px;color:var(--ink-soft)}
.up-card .u-lv{font-size:11px;color:var(--gold-deep);font-weight:700}
.up-card .u-buy{min-width:96px;min-height:44px;border-radius:10px;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3A2312;font-weight:900;font-size:14.5px;border:2px solid #A86A1F}
.up-card .u-buy:disabled{background:#D9CDB2;color:#8A7A5F;border-color:#C6B896;cursor:not-allowed}
.up-card .u-buy.max{background:var(--green);color:var(--white);border-color:#1F4638}
.btn-row{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn-main{min-height:56px;padding:12px 30px;border-radius:14px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:center}
.btn-next{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3A2312;border:2px solid #A86A1F;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.btn-ghost{background:var(--white);color:var(--ink);border:2px solid var(--cream-deep);box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* toast */
.toast{
  position:fixed;z-index:70;left:50%;top:16%;transform:translate(-50%,-10px);
  background:rgba(31,46,38,.92);color:var(--white);font-size:15px;font-weight:700;
  padding:12px 22px;border-radius:12px;border:2px solid var(--gold);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 6px 16px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:var(--ok)}
.toast.bad{border-color:var(--rust)}

/* ============ 移动端 ============ */
@media (max-width:760px){
  .status-bar{gap:10px;padding:8px 10px;flex-wrap:wrap}
  .time-wrap{order:10;flex-basis:100%}
  .game-area{flex-direction:column;padding:8px;gap:8px}
  .queue-panel{width:100%;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:8px;border-width:2px}
  .queue-title{display:none}
  .queue-scroll{flex-direction:row;gap:6px;overflow-x:auto}
  .customer-card{min-width:150px;flex-shrink:0}
  .customer-card .avatar{width:44px;height:52px}
  .workbench{padding:8px;border-width:2px}
  .stage{width:88%;height:190px}
  .step-hint{font-size:13.5px;min-height:40px;padding:6px 10px}
  .tool-btn{min-width:64px;min-height:64px;padding:6px 8px;font-size:11.5px}
  .tool-btn .tic{width:34px;height:34px}
  .order-bar{margin:0 8px 8px;padding:8px 10px;min-height:84px}
  .order-avatar{width:52px;height:64px}
  .order-name{font-size:14.5px}
  .deliver-btn{min-height:52px;padding:10px 18px;font-size:15px}
  .modal-card{padding:18px 16px}
  .modal-card h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 游戏主界面 ============ -->
  <div class="bg"></div>

  <header class="status-bar" id="statusBar">
    <div class="stat" id="statCoins" title="金币">
      <span class="ico" id="coinIco"></span><b id="coinVal">0</b>
    </div>
    <div class="stat">
      <span class="lbl">第</span><b id="dayVal">1</b><span class="lbl">天</span>

/* ---------------- 工作台 SVG 绘制 ---------------- */
let shapeSum = 0, shapeLast = null, shapeActive = false, shapeDownX = 0, shapeDownY = 0;

function drawDough(){
  // 面团：随擀面次数变扁
  const n = state.making ? state.making.rollDone : 0;
  const max = rollNeed();
  const t = max>1 ? n/(max-1) : 1;          // 0..1 擀动进度
  const sy = 1 - t*0.55, sx = 1 + t*0.35;
  const fill = n===0 ? '#F2E3C0' : n>=max ? '#EFD9A6' : '#F5E8C8';
  const ry = 34*sy, rx = 44*sx;
  const el = $('#svgDough');
  el.innerHTML = `
    <g transform="translate(95,78)">
      ${n===0
        ? `<ellipse cx="0" cy="0" rx="${rx}" ry="${ry}" fill="${fill}" stroke="#D9C48F" stroke-width="3"/>
           <ellipse cx="${-rx*0.3}" cy="${-ry*0.35}" rx="${rx*0.28}" ry="${ry*0.3}" fill="#FBF0D8"/>`
        : `<ellipse cx="0" cy="0" rx="${rx}" ry="${ry}" fill="${fill}" stroke="#C9B077" stroke-width="2.6"/>
           <path d="M${-rx*0.5} 0 Q0 ${-ry*0.7} ${rx*0.5} 0" stroke="#CDB680" stroke-width="2" fill="none"/>`}
    </g>`;
}

function drawTri(){
  // 切三角：三条虚线边，点击后变实线

  const lines = [[0,1],[1,2],[2,0]];
  const labels = ['左','底','右'];
  let s = `<polygon points="95,22 22,120 168,120" fill="#F5E8C8" stroke="#C9B077" stroke-width="2"/>`;
  lines.forEach((p,i)=>{
    const [a,b]=p, on = cuts>i;
    s += `<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}"
      stroke="${on?'#C5522F':'#B8A878'}" stroke-width="${on?4:3}"
      ${on?'':'stroke-dasharray="7 6"'} stroke-linecap="round"/>`;
  });
  $('#svgDough').innerHTML = `<g transform="translate(0,4)">${s}</g>`;
}

function drawCro(progress){

      <path d="M-72 48 C-92 30 -86 0 -66 -14 C-40 -32 -10 -42 18 -46 C6 -28 2 -12 -2 4 C-8 28 -14 44 -16 52 C-18 58 -46 60 -72 48 Z" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
      <path d="M-40 36 C-56 26 -54 8 -38 -2 C-18 -14 6 -20 26 -24 C18 -10 14 4 10 18 C6 32 2 40 0 44 C-4 48 -28 44 -40 36 Z" fill="none" stroke="${stroke}" stroke-width="2.4"/>
      <path d="M-12 22 C-22 16 -20 4 -8 -2 C6 -9 22 -12 34 -14 C29 -4 25 8 22 20 C21 26 8 28 -12 22 Z" fill="none" stroke="${stroke}" stroke-width="2"/>
      <path d="M12 8 C6 4 7 -3 14 -7 C22 -11 30 -12 36 -13 C34 -7 31 0 29 6 C28 9 16 12 12 8 Z" fill="none" stroke="${stroke}" stroke-width="1.8"/>
      ${glow}
    </g>`;
}
function lerpColor(a,b,t){
  const pa=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16));
  const pb=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
  const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*clamp(t,0,1)).toString(16).padStart(2,'0'));
  return '#'+c.join('');
}
function drawEggWash(progress){
  // 蛋液从顶部刷下：容器 clip-path 控制显示高度
  const p = clamp(progress,0,100);
  const layer = $('#cEgg');
  layer.style.clipPath = `inset(0 0 ${100-p}% 0)`;
  const el = layer.querySelector('svg');
  el.innerHTML = `<ellipse cx="120" cy="84" rx="72" ry="50" fill="#EBB94F" opacity="0.5"/>`;
}

function drawWrap(){
  $('#svgWrap').innerHTML = `
    <g transform="translate(115,80)">
      <rect x="-58" y="-42" width="116" height="84" rx="6" fill="#FAF3E3" stroke="#C9A96A" stroke-width="2.4"/>
      <path d="M-20 -42 L20 -42 L40 -18 L40 42 L-40 42 L-40 -18 Z" fill="#F4E8CC" stroke="#C9A96A" stroke-width="1.6"/>
      <path d="M-44 -14 L44 -14 M-46 -2 L46 -2 M-46 10 L46 10 M-42 22 L42 22 M-36 32 L36 32" stroke="#C87F2D" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M0 -30 C-16 -20 -20 -2 -12 14" stroke="#C9A96A" stroke-width="2" fill="none"/>

}

/* ---------------- 派生数值 ---------------- */
const upLv = id => state.upgrades[id];
const rollNeed = ()=> BASE_ROLL - upLv('knead');
const bakeTime = ()=> BASE_BAKE * Math.pow(0.8, upLv('oven'));
const eggTime = ()=> BASE_EGG * Math.pow(0.7, upLv('egg'));
const maxQueue = ()=> 3 + upLv('queue');
const spawnInterval = ()=> BASE_SPAWN * Math.pow(0.88, upLv('flow'));
const priceOf = r => Math.round(r.price * Math.pow(1.15, upLv('price')));
const patienceOf = ()=> Math.max(MIN_PATIENCE, BASE_PATIENCE - Math.floor((state.day-1)/3)*3);
const dayTarget = ()=> TARGET_BASE + state.day*TARGET_PER_DAY;

/* ---------------- 顾客系统 ---------------- */
function makeCustomer(){
  const unlocked = Object.values(RECIPES).filter(r=>r.unlockDay<=state.day);
  const recipe = unlocked[Math.floor(Math.random()*unlocked.length)];
  return {
    id: Math.random().toString(36).slice(2,8),
    sprite: Math.floor(Math.random()*SPRITES.length),
    recipe,
    patience: patienceOf(), patienceMax: patienceOf(),
    state:'waiting'
  };
}
function trySpawn(){
  if(state.queue.length + (state.current?1:0) >= maxQueue()) return;
  if(state.dayTime<=0) return;
  const c = makeCustomer();
  state.queue.push(c);
  renderQueue();
  promoteNext();
}
function spawnTimed(dt){
  state.spawnTimer -= dt;
  if(state.spawnTimer<=0){
    trySpawn();
    state.spawnTimer = spawnInterval()*rand(0.75,1.25);
  }
}
function customerLeave(c, angry){
  // 从队列或当前服务移除
  const i = state.queue.indexOf(c);
  if(i>=0) state.queue.splice(i,1);
  if(state.current===c) state.current=null;
  if(angry){
    state.lost++;
    if(c && c.el){ c.el.classList.add('leaving'); setTimeout(()=>{ if(c.el) c.el.remove(); renderQueue(); },300); }
    toast('顾客等得不耐烦，离开了…','bad');
  }
  if(state.current===null) state.making=null;
  promoteNext();
  renderQueue(); renderOrderBar(); renderStage(); renderTools();
}
function promoteNext(){
  if(state.current) return;
  if(state.queue.length){
    const c = state.queue.shift();
    state.current = c;
    if(c.el) c.el.remove();
    beginOrder(c);
    renderQueue(); renderOrderBar(); renderStage(); renderTools();
  }
}
function beginOrder(c){
  state.making = {
    recipe:c.recipe,
    step:'roll',
    rollDone:0, cutDone:0, fillDone:false,
    bakeProgress:0, bakeDone:false, burnTimer:0,
    packDone:false
  };
  state.making.stepStart = performance.now();
}

/* ---------------- 制作步骤 ---------------- */
function setStep(step){
  const m = state.making; if(!m) return;
  m.step = step;
  if(step==='roll'){ m.rollDone=0; m.cutDone=0; m.fillDone=false; }
  if(step==='shape'){ shapeSum=0; shapeLast=null; }
  if(step==='bake'){ m.bakeProgress=0; m.bakeDone=false; m.burnTimer=0; }
  if(step==='pack'){ m.packDone=false; }
  renderStage(); renderTools();
}
function doRoll(){
  const m = state.making; if(!m || m.step!=='roll') return;
  m.rollDone++;
  drawDough();
  if(m.rollDone>=rollNeed()){
    setStep('cut');
  }
}
function doCut(){
  const m = state.making; if(!m || m.step!=='cut') return;
  if(m.cutDone<3){ m.cutDone++; drawTri(); }
  if(m.cutDone>=3){
    if(m.recipe.fill) setStep('fill');
    else setStep('shape');
  }
}
function doFill(){
  const m = state.making; if(!m || m.step!=='fill' || m.fillDone) return;
  m.fillDone=true;
  drawFill();
  setStep('shape');
}
function shapeTick(){
  // 画圈检测在 pointer 事件里更新 shapeSum
  const m = state.making;
  if(!m || m.step!=='shape') return;
  if(Math.abs(shapeSum)>=SHAPE_NEED){
    shapeSum=SHAPE_NEED;
    drawCro(1);
    setStep('egg');
  } else {
    drawCro(Math.min(1,Math.abs(shapeSum)/SHAPE_NEED));
  }
}
function startEgg(){
  const m = state.making; if(!m || m.step!=='egg') return;
  eggActive=true; eggTimer=0;
}
function eggTick(dt){
  if(!eggActive) return;
  const m = state.making; if(!m || m.step!=='egg'){ eggActive=false; return; }
  eggTimer += dt;
  const p = clamp(eggTimer/eggTime()*100,0,100);
  drawEggWash(p);
  if(p>=100){ eggActive=false; setStep('bake'); }
}
function doBake(){
  const m = state.making; if(!m || m.step!=='bake') return;
  if(!m.bakeDone) return;      // 正在烘烤，点击忽略
  setStep('pack');             // 出炉，进入包装
}
function bakeTick(dt){
  const m = state.making; if(!m || m.step!=='bake') return;
  if(!m.bakeDone){
    m.bakeProgress = clamp(m.bakeProgress + dt/bakeTime()*100, 0, 100);
    drawCro(m.bakeProgress/100);
    if(m.bakeProgress>=100){
      m.bakeDone=true; m.burnTimer=0;
      toast('可颂出炉了，快包装！','good');
    }
  } else {
    m.burnTimer += dt;
    if(m.burnTimer>BURN_GRACE){
      toast('可颂烤焦了！只能重新做一个','bad');
      setStep('roll');
    }
  }
}
function doPack(){
  const m = state.making; if(!m || m.step!=='pack') return;
  m.packDone=true;
  drawWrap();
  renderTools();
  renderOrderBar();
}
function doDeliver(){
  const c = state.current;
  if(!c || !state.making || state.making.step!=='pack' || !state.making.packDone) return;
  // 收入与好评
  const waitRatio = clamp(c.patience/c.patienceMax, 0, 1);
  const sat = 0.4 + 0.6*waitRatio;
  const tip = sat>0.85 ? 1.15 : 1;
  const gain = Math.round(priceOf(c.recipe)*tip);
  state.dayIncome += gain;
  state.coins += gain;
  state.served++;
  state.moodSum += sat; state.moodCount++;
  flyCoins(gain);
  toast(`+${gain} 金币`,'good');
  // 顾客满意离开
  const el = c.el;
  if(el){ el.classList.add('leaving'); setTimeout(()=>{ if(el&&el.parentNode) el.parentNode.removeChild(el); renderQueue(); },300); }
  state.current=null; state.making=null;
  promoteNext();
  renderStatus(); renderQueue(); renderOrderBar(); renderStage(); renderTools();
  checkDayEnd();
}

/* ---------------- 渲染 ---------------- */
function renderStatus(){
  $('#coinVal').textContent = state.coins;
  $('#dayVal').textContent = state.day;
  const left = Math.max(0, Math.round(state.dayTime));
  $('#timeLbl').textContent = `营业 ${left}s`;
  const fill = $('#timeFill');
  fill.style.width = (state.dayTime/DAY_LENGTH*100)+'%';
  fill.classList.toggle('low', state.dayTime/DAY_LENGTH < .25);
  const mood = state.moodCount ? Math.round(state.moodSum/state.moodCount*100) : 100;
  $('#moodVal').textContent = mood+'%';
  const hearts = $('#hearts');
  const n = Math.round(mood/25);
  hearts.innerHTML = [0,1,2,3].map(i=>`<span class="heart ${i<n?'on':''}"></span>`).join('');
}
function customerCardHTML(c, served){
  return `<div class="customer-card ${served?'served':'waiting'}" data-id="${c.id}">
    <div class="avatar"><img src="${SPRITES[c.sprite]}" alt="顾客"></div>
    <div class="info">
      <div class="bubble">${miniCroSVG(c.recipe.hue,20)}<span>${c.recipe.name}</span></div>
      <div class="patience"><i data-role="pat" data-id="${c.id}"></i></div>
    </div>
  </div>`;
}
function renderQueue(){
  const sc = $('#queueScroll');
  // 保留已有卡片，避免闪烁
  const keep = {};
  sc.querySelectorAll('.customer-card').forEach(el=>{ keep[el.dataset.id]=el; });
  // 当前服务顾客不在此列（在底部订单栏）——但显示标记：把队首 waiting 高亮？队列只显示排队中的
  const items = state.queue;
  const frag = document.createDocumentFragment();
  if(!items.length){
    const empty = document.createElement('div');
    empty.className='queue-empty';
    empty.innerHTML = croCoinSVG(30) + '<span>等待客人进店</span>';
    frag.appendChild(empty);
  } else {
    items.forEach(c=>{
      let el = keep[c.id];
      if(!el){
        el = document.createElement('div');
        el.innerHTML = customerCardHTML(c,false);
        el = el.firstElementChild;
        el.style.transform='translateX(60px)'; el.style.opacity='0';
        requestAnimationFrame(()=>{ el.style.transform='translateX(0)'; el.style.opacity='1'; });
        c.el = el;
      }
      frag.appendChild(el);
    });
  }
  sc.innerHTML='';
  sc.appendChild(frag);
}
function updateQueuePatience(){
  document.querySelectorAll('.customer-card i[data-role="pat"]').forEach(i=>{
    const c = state.queue.find(x=>x.id===i.dataset.id);
    if(!c) return;
    const r = clamp(c.patience/c.patienceMax,0,1);
    i.style.width = (r*100)+'%';
    i.className = r>.5?'':r>.25?'mid':'low';
  });
}
function renderOrderBar(){
  const c = state.current;
  const empty = $('#orderEmpty'), content = $('#orderContent');
  if(!c){
    empty.style.display='block'; content.style.display='none';
    $('#deliverBtn').classList.remove('show');
    return;
  }
  empty.style.display='none'; content.style.display='flex';
  $('#orderAvatar').src = SPRITES[c.sprite];
  $('#orderCroName').innerHTML = miniCroSVG(c.recipe.hue,26) + '<span style="margin-left:4px">'+c.recipe.name+'</span>';
  $('#orderTag').textContent = '第 '+c.recipe.unlockDay+' 天解锁' + (c.recipe.fill?' · '+FILLS[c.recipe.fill].name:'');
  $('#orderMoney').textContent = '¥ '+priceOf(c.recipe);
  const m = state.making;
  const showDeliver = m && m.step==='pack' && m.packDone;
  $('#deliverBtn').classList.toggle('show', showDeliver);
  updateOrderPatience();
}
function updateOrderPatience(){
  const c = state.current;
  if(!c) return;
  const r = clamp(c.patience/c.patienceMax,0,1);
  const bar = $('#orderPatience');
  bar.style.width = (r*100)+'%';
  bar.className = r>.5?'':r>.25?'mid':'low';
  $('#orderWaitTxt').textContent = '耐心 '+Math.round(r*100)+'%';
}
function renderStage(){
  const m = state.making;
  const idle = $('#idleText'), dough=$('#cDough'), cro=$('#cBaked'), wrap=$('#cWrap'), meter=$('#ovenMeter');
  idle.style.display = m ? 'none':'flex';
  dough.style.display='none'; cro.style.display='none'; wrap.style.display='none'; meter.style.display='none';
  if(!m) return;
  const step = m.step;
  if(step==='roll'){ dough.style.display='block'; drawDough(); }
  else if(step==='cut'){ dough.style.display='block'; drawTri(); }
  else if(step==='fill'){ dough.style.display='block'; drawFill(); }
  else if(step==='shape'||step==='egg'||step==='bake'){
    cro.style.display='block';
    const p = step==='shape' ? Math.min(1,Math.abs(shapeSum)/SHAPE_NEED) : 1;
    drawCro(p);
    if(step==='egg'){ drawEggWash(clamp(eggTimer/eggTime()*100,0,100)); }
  }
  else if(step==='pack'){ cro.style.display='block'; drawCro(1); wrap.style.display='block'; drawWrap(); }
  if(step==='bake'){
    meter.style.display='flex';
    $('#ovenFill').style.width = (m.bakeProgress)+'%';
    $('#ovenLbl').textContent = Math.round(m.bakeProgress)+'%';
    meter.classList.toggle('warn', m.bakeDone);
    if(m.bakeDone){ $('#ovenLbl').textContent='出炉!'; }
  }
  renderStepHint();
}
function renderStepHint(){
  const m = state.making, txt = $('#stepHintTxt');
  if(!m){ txt.textContent='等待顾客上门…'; return; }
  const step = stepOf();
  let text = '';
  if(step==='roll') text = `擀面团${m.rollDone}/${rollNeed()} — 点击面团${m.rollDone<rollNeed()?'继续擀':'完成'}`;
  else if(step==='cut') text = `切三角 ${m.cutDone}/3 — 点击虚线完成切割`;
  else if(step==='fill') text = `放上${FILLS[m.recipe.fill].name} — 点击配料`;
  else if(step==='shape') text = `卷成形 — 按住可颂画圈${Math.round(Math.min(100,Math.abs(shapeSum)/SHAPE_NEED*100))}%`;
  else if(step==='egg') text = `刷蛋液 — 点击刷子自动涂抹`;
  else if(step==='bake') text = m.bakeDone?'烘烤完成！点击烤箱出炉':'烘烤中，别烤焦了';
  else if(step==='pack') text = '包装 — 点击包装纸';
  txt.textContent = text;
}
function stepOf(){
  const m=state.making; return m?m.step:'';
}
function renderTools(){
  const m = state.making, t = $('#tools');
  if(!m){ t.innerHTML=''; return; }
  const step = m.step;
  const rows = [];
  rows.push({key:'knead', label:'擀面杖', sub:'', disabled: step!=='roll'});
  rows.push({key:'cut', label:'切刀', sub:'', disabled: step!=='cut'});
  if(m.recipe.fill) rows.push({key:m.recipe.fill, label:FILLS[m.recipe.fill].name, sub:m.fillDone?'已放':'配料', disabled: step!=='fill'||m.fillDone});
  if(step==='shape') rows.push({key:'shape', label:'卷成形', sub:'在台面画圈', hintOnly:true});
  rows.push({key:'egg', label:'刷蛋液', sub:'', disabled: step!=='egg'});
  rows.push({key:'oven', label:'烤箱', sub:m.bakeDone?'出炉!':'烘烤', disabled: step!=='bake'});
  rows.push({key:'wrap', label:'包装纸', sub:'', disabled: step!=='pack'||m.packDone});
  t.innerHTML = rows.map(b=>`
    <button class="tool-btn ${b.hintOnly?'hint-only':(b.disabled?'':'active')}" data-key="${b.key}" ${b.disabled?'disabled':''}>
      <span class="tic">${TOOL_ICONS[b.key]||''}</span>
      <span>${b.label}</span>
      ${b.sub?`<span class="sub">${b.sub}</span>`:''}
    </button>`).join('');
  t.querySelectorAll('.tool-btn').forEach(btn=>{
    if(btn.dataset.key==='shape') return;   // 卷起由台面画圈驱动
    btn.addEventListener('click', ()=>{
      const mm = state.making; if(!mm) return;
      const key = btn.dataset.key;
      if(key==='knead') doRoll();
      else if(key==='cut') doCut();
      else if(key==='choco'||key==='almond'||key==='ham') doFill();
      else if(key==='egg') startEgg();
      else if(key==='oven') doBake();
      else if(key==='wrap') doPack();
    });
  });
}

/* ---------------- 音乐系统（Web Audio 合成 · 沙威玛风格改编曲） ---------------- */
const Music = (()=>{
  const BPM = 132;
  const STEP = 60/BPM/4;            // 一个 16 分音符的秒数
  const LOOP = 64;                  // 4 小节循环（64 步）
  let ctx=null, master=null;
  let playing=false, muted=false;
  let nextTime=0, step=0, rafId=null;

  // 主旋律（原创旋律 · 中东 Hijaz 调式风情）：[起始步, MIDI 音高, 时值(步数)]
  const LEAD = [
    [0,74,1],[2,74,1],[4,77,2],[6,76,1],[7,74,1],[8,72,2],[10,71,1],[11,72,1],[12,74,2],
    [16,69,1],[17,72,1],[18,74,2],[20,77,2],[22,80,2],[24,77,2],[26,76,1],[27,74,1],[28,76,2],
    [32,74,1],[34,74,1],[36,77,2],[38,79,1],[39,77,1],[40,76,2],[42,74,1],[43,72,1],[44,71,2],
    [48,69,2],[50,71,2],[52,74,4],[56,76,2],[58,77,2],[60,79,4]
  ];
  // 贝斯线：D2 根音，每小节末 A2
  const BASS = [
    [0,38],[4,38],[8,38],[12,45],[16,38],[20,38],[24,38],[28,45],
    [32,38],[36,38],[40,38],[44,45],[48,38],[52,38],[56,38],[60,45]
  ];
  // 手鼓：低音鼓点（dum）与边缘拍击（tek）
  const KICK = [0,4,8,12,14,16,20,24,28,32,36,40,44,48,52,56,60];
  const TEK  = [2,6,10,18,22,26,30,34,38,42,46,50,54,58,62];

  const midi = n => 440*Math.pow(2,(n-69)/12);

  function init(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.3;
    master.connect(ctx.destination);
  }
  function playNote(freq,t,dur,vol,type,lp,vib){
    if(!ctx) return;
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = ctx.createGain();
    let end = g;
    o.connect(g);
    if(lp){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; g.connect(f); end=f; }
    if(vib){
      const lfo = ctx.createOscillator(); lfo.frequency.value = vib;
      const lg = ctx.createGain(); lg.gain.value = freq*0.012;
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(t); lfo.stop(t+dur+0.1);
    }
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    end.connect(master);
    o.start(t); o.stop(t+dur+0.06);
  }
  function kick(t){
    if(!ctx) return;
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.26,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.17);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+0.2);
  }
  function tek(t){
    if(!ctx) return;
    const o=ctx.createOscillator(); o.type='square'; o.frequency.value=1900;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2800; f.Q.value=2;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.07,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); o.stop(t+0.08);
  }
  function playStep(s,t){
    LEAD.forEach(([at,note,dur])=>{ if(at===s) playNote(midi(note), t, dur*STEP*0.92, 0.13, 'sawtooth', 1900, 6); });
    BASS.forEach(([at,note])=>{ if(at===s) playNote(midi(note), t, STEP*3.4, 0.16, 'triangle', 480, 0); });
    if(KICK.includes(s)) kick(t);
    if(TEK.includes(s)) tek(t);
  }
  function tick(){
    if(!playing) return;
    const horizon = ctx.currentTime + 0.16;
    while(nextTime < horizon){
      playStep(step%LOOP, nextTime);
      nextTime += STEP;
      step++;
    }
    rafId = requestAnimationFrame(tick);
  }
  return {
    unlock(){
      init();
      if(ctx && ctx.state==='suspended') ctx.resume();
    },
    isMuted(){ return muted; },
    start(){
      this.unlock();
      if(!ctx || playing) return;
      playing=true; nextTime = ctx.currentTime + 0.08; step=0;
      rafId = requestAnimationFrame(tick);
    },
    stop(){ playing=false; cancelAnimationFrame(rafId); },
    toggle(){
      init();
      if(!ctx) return false;
      muted = !muted;
      master.gain.setTargetAtTime(muted?0:0.3, ctx.currentTime, 0.05);
      if(!muted){ this.unlock(); if(!playing) this.start(); }
      return muted;
    }
  };
})();

/* ---------------- 弹层与特效 ---------------- */
let toastTimer=null;
function toast(msg, kind){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show'+(kind?(' '+kind):'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}
function flyCoins(n){
  const bar = $('#statusBar').getBoundingClientRect();
  const el = document.createElement('div');
  el.className='coin-fly';
  el.style.left = (bar.right-90)+'px';
  el.style.top = (bar.bottom-14)+'px';
  el.textContent = '+'+n;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1100);
}
function showModal(id){ $('#'+id).classList.add('show'); }
function hideModal(id){ $('#'+id).classList.remove('show'); }

/* ---------------- 日结与升级 ---------------- */
function endDay(){
  state.running=false;
  cancelAnimationFrame(rafId);
  // 清场
  state.queue=[]; state.current=null; state.making=null;
  state.moodSum=0; state.moodCount=0;
  // 纪录
  if(state.dayIncome>state.bestIncome){
    state.bestIncome=state.dayIncome;
    try{ localStorage.setItem('cl_bestIncome', state.bestIncome); }catch(e){}
  }
  if(state.day>state.bestDay){ state.bestDay=state.day;
    try{ localStorage.setItem('cl_bestDay', state.bestDay); }catch(e){}
  }
  const hit = state.dayIncome>=state.dayTarget;
  $('#dayendTitle').textContent = `第 ${state.day} 天营业结束`;
  $('#dayendGoal').innerHTML = `今日目标 <b>${state.dayTarget}</b> 金币 · ${hit?'<b style="color:var(--ok)">目标达成 +30 奖励</b>':'<b style="color:var(--rust)">还差一点</b>'}`;
  $('#deIncome').textContent = state.dayIncome;
  $('#deServed').textContent = state.served;
  $('#deLost').textContent = state.lost;
  $('#deMood').textContent = (state.served+state.lost)? Math.round(state.moodSum/(state.served+state.lost)*100)+'%' : '—';
  if(hit) state.coins += 30;
  $('#upTitle').textContent = '金币 '+state.coins+' · 升级你的烘焙坊';
  renderUpgrades();
  $('#nextDayTxt').textContent = '进入第 '+(state.day+1)+' 天';
  showModal('view-dayend');
  renderStatus();
}
function renderUpgrades(){
  const list = $('#upList');
  list.innerHTML='';
  Object.keys(UPGRADES).forEach(id=>{
    const u = UPGRADES[id], lv = state.upgrades[id];
    const cost = Math.round(u.base*Math.pow(1.7,lv));
    const maxed = lv>=u.max;
    const card = document.createElement('div');
    card.className='up-card';
    card.innerHTML = `
      <div class="u-ico">${TOOL_ICONS[u.ico]||''}</div>
      <div class="u-info">
        <div class="u-name">${u.name} <span class="u-lv">${maxed?'已满级':'Lv.'+lv+' → '+(lv+1)}</span></div>
        <div class="u-desc">${u.desc}</div>
      </div>
      <button class="u-buy ${maxed?'max':''}" data-up="${id}" ${maxed?'disabled':''}>${maxed?'MAX':cost+' 金币'}</button>`;
    list.appendChild(card);
  });
  list.querySelectorAll('.u-buy').forEach(b=>{
    const id = b.dataset.up;
    b.addEventListener('click', ()=>{
      const u = UPGRADES[id], lv = state.upgrades[id];
      if(lv>=u.max) return;
      const cost = Math.round(u.base*Math.pow(1.7,lv));
      if(state.coins<cost){ toast('金币不够','bad'); return; }
      state.coins-=cost; state.upgrades[id]++;
      toast(u.name+' 升级成功！','good');
      renderUpgrades();
      $('#upTitle').textContent = '金币 '+state.coins+' · 升级你的烘焙坊';
      renderStatus();
    });
  });
}
function checkDayEnd(){
  if(state.dayTime<=0){
    state.running=false;
    endDay();
  }
}

/* ---------------- 主循环 ---------------- */
let rafId=null, lastTs=0;
function loop(ts){
  if(state.paused || !state.running){ rafId=requestAnimationFrame(loop); return; }
  const dt = Math.min(0.1, (ts-lastTs)/1000 || 0.016);
  lastTs = ts;
  // 营业时间
  state.dayTime -= dt;
  // 顾客生成
  spawnTimed(dt);
  // 耐心
  if(state.current){
    state.current.patience -= dt;
    if(state.current.patience<=0){
      customerLeave(state.current, true);
    }
  }
  state.queue.forEach(c=>{ c.patience -= dt; });
  const gone = state.queue.filter(c=>c.patience<=0);
  gone.forEach(c=>customerLeave(c,true));
  // 制作进度
  if(state.making){
    eggTick(dt);
    bakeTick(dt);
  }
  // 渲染
  renderStatus();
  updateQueuePatience();
  updateOrderPatience();
  renderStage();
  renderTools();
  checkDayEnd();
  rafId = requestAnimationFrame(loop);
}
function startLoop(){
  state.running=true; state.paused=false;
  lastTs = performance.now();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
function pauseLoop(){ state.paused=true; cancelAnimationFrame(rafId); }
function resumeLoop(){ if(!state.running) return; state.paused=false; lastTs=performance.now(); cancelAnimationFrame(rafId); rafId=requestAnimationFrame(loop); }
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ pauseLoop(); }
  else { resumeLoop(); }
});

/* ---------------- 工作台交互 ---------------- */
function setupStage(){
  const stage = $('#stage');
  // 擀面：点击面团
  stage.addEventListener('pointerdown', e=>{
    const m = state.making; if(!m) return;
    if(m.step==='roll'){ doRoll(); return; }
    if(m.step==='cut'){ return; } // 点击台面不切，点虚线才切
    if(m.step==='shape'){
      shapeActive=true; shapeLast=angleOf(e, stage);
      shapeDownX=e.clientX; shapeDownY=e.clientY;
      stage.setPointerCapture(e.pointerId);
      return;
    }
  });
  stage.addEventListener('pointermove', e=>{
    if(!shapeActive){ return; }
    const m = state.making; if(!m || m.step!=='shape'){ shapeActive=false; return; }
    const a = angleOf(e, stage);
    let d = a - shapeLast;
    if(d>180) d-=360; if(d<-180) d+=360;
    shapeSum += d;
    shapeLast = a;
    shapeTick();
  });
  stage.addEventListener('pointerup', e=>{
    if(shapeActive){
      shapeActive=false;
      // 原地轻点也算卷制进度（90°/次），兼容鼠标玩家
      if(Math.abs(e.clientX-shapeDownX)+Math.abs(e.clientY-shapeDownY) < 8){
        const m = state.making;
        if(m && m.step==='shape'){
          shapeSum += shapeSum>=0 ? 90 : -90;
          shapeTick();
        }
      }
    }
  });
  stage.addEventListener('pointercancel', ()=>{ shapeActive=false; eggActive=false; });
  // 切三角：点击在任一条虚线附近即可切割（按 SVG 实际坐标算距离，容错 40px）
  stage.addEventListener('pointerdown', e=>{
    const m = state.making; if(!m || m.step!=='cut') return;
    const sr = $('#svgDough').getBoundingClientRect();
    const px = e.clientX - sr.left, py = e.clientY - sr.top;
    const P = [[95,22],[22,120],[168,120]], L = [[0,1],[1,2],[2,0]];
    for(let i=0;i<3;i++){
      const [a,b]=L[i], x1=P[a][0], y1=P[a][1], x2=P[b][0], y2=P[b][1];
      const dx=x2-x1, dy=y2-y1, dd=dx*dx+dy*dy;
      const t = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/dd));
      const dist = Math.hypot(px-(x1+dx*t), py-(y1+dy*t));
      if(dist<=40){ doCut(); return; }
    }
  });
  // 刷蛋：按住刷子后涂抹（在 tools 的 egg 按钮上按下保持，舞台移动也刷）
  // 简化：egg 按钮 pointerdown 启动自动刷，不再需要涂抹轨迹
}
function angleOf(e, el){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height*0.45;
  return Math.atan2(e.clientY-cy, e.clientX-cx)*180/Math.PI;
}

/* ---------------- 生命周期 ---------------- */
function startDay(){
  state.dayTime = DAY_LENGTH;
  state.dayIncome = 0;
  state.served = 0; state.lost = 0;
  state.moodSum=0; state.moodCount=0;
  state.spawnTimer = 2.0;
  state.queue=[]; state.current=null; state.making=null;
  hideModal('view-dayend');
  renderStatus(); renderQueue(); renderOrderBar(); renderStage(); renderTools();
  startLoop();
}
function resetGame(){
  pauseLoop();
  state = freshState();
  try{
    state.bestIncome = parseInt(localStorage.getItem('cl_bestIncome')||'0',10)||0;
    state.bestDay = parseInt(localStorage.getItem('cl_bestDay')||'1',10)||1;
  }catch(e){}
  // 清理顾客卡片
  $('#queueScroll').innerHTML='';
  $('#orderContent').style.display='none';
  $('#orderEmpty').style.display='block';
  $('#deliverBtn').classList.remove('show');
  renderStatus(); renderStage(); renderTools();
  hideModal('view-dayend');
  $('#startRecord').textContent = state.bestDay>1
    ? `最高纪录：第 ${state.bestDay} 天 · 单日 ${state.bestIncome} 金币`
    : '还没有纪录，来创造第一个传奇吧';
  showModal('view-start');
}
function boot(){
  state = freshState();
  let bd = 1, bi = 0;
  try{
    bi = parseInt(localStorage.getItem('cl_bestIncome')||'0',10)||0;
    bd = parseInt(localStorage.getItem('cl_bestDay')||'1',10)||1;
  }catch(e){}
  state.bestIncome = bi;
  state.bestDay = bd;
  // 静态图标
  $('#coinIco').innerHTML = croCoinSVG(26);
  $('#heroCro').innerHTML = croCoinSVG(120);
  $('#dayendCro').innerHTML = croCoinSVG(64);
  $('#startRecord').textContent = state.bestDay>1
    ? `最高纪录：第 ${state.bestDay} 天 · 单日 ${state.bestIncome} 金币`
    : '还没有纪录，来创造第一个传奇吧';
  // 按钮
  $('#startBtn').addEventListener('click', ()=>{
    state = freshState();
    try{
      state.bestIncome = parseInt(localStorage.getItem('cl_bestIncome')||'0',10)||0;
      state.bestDay = parseInt(localStorage.getItem('cl_bestDay')||'1',10)||1;
    }catch(e){}
    hideModal('view-start');
    startDay();
  });
  $('#nextDayBtn').addEventListener('click', ()=>{
    state.day++;
    startDay();
  });
  $('#restartBtn').addEventListener('click', ()=>{ resetGame(); });
  $('#dayendClose').addEventListener('click', ()=>{
    // 关闭日结 = 继续下一天
    state.day++;
    startDay();
  });
  $('#deliverBtn').addEventListener('click', ()=>doDeliver());
  // 音乐开关
  $('#musicBtn').addEventListener('click', ()=>{
    $('#musicBtn').classList.toggle('muted', Music.toggle());
  });
  // 首次用户手势后解锁音频并启动音乐（浏览器要求）
  document.addEventListener('pointerdown', function unlockOnce(){
    Music.unlock();
    if(!Music.isMuted()) Music.start();
    document.removeEventListener('pointerdown', unlockOnce);
  }, {passive:true});
  setupStage();
}
boot();
</script>

      var t2 = document.createElement('div'); t2.style.cssText = 'font-size:18px;font-weight:600'; t2.textContent = '此游戏需云坛一键登录'; ov.appendChild(t2);
      var t3 = document.createElement('div'); t3.style.cssText = 'font-size:13px;color:#9fb3d0;max-width:320px'; t3.textContent = '返回云坛登录后，进入「小程序」再点本游戏即可自动带账号游玩。'; ov.appendChild(t3);

    }

    var b1 = document.createElement('b'); b1.style.color = '#7cc4ff'; b1.textContent = String(u).replace(/[<>&]/g, '');
    var b2 = document.createElement('span'); b2.textContent = '✕'; b2.style.cssText = 'cursor:pointer;opacity:.65;margin-left:6px;font-size:11px';
    b2.title = '关闭';

    el.appendChild(document.createTextNode('👤 云坛登录：')); el.appendChild(b1); el.appendChild(b2);
    document.body.appendChild(el);
    window.YT_USER = u;
    window.YT_LOGGED = true;
    /* 存档按账号隔离：所有 localStorage 自动带账号前缀，旧档自动迁移 */
    var pre = '_yt_' + u + '_';
    var g = Storage.prototype.getItem, sw = Storage.prototype.setItem, r = Storage.prototype.removeItem;
    Storage.prototype.getItem = function(k){
      if(typeof k !== 'string' || k.indexOf(pre) === 0) return g.call(this, k);
      var scoped = g.call(this, pre + k);
      if(scoped !== null) return scoped;
      var legacy = g.call(this, k);
      if(legacy !== null){ try{ sw.call(this, pre + k, legacy); r.call(this, k); }catch(e){} }
      return legacy;
    };
    Storage.prototype.setItem = function(k, v){
      if(typeof k === 'string' && k.indexOf(pre) !== 0){ try{ sw.call(this, pre + k, v); }catch(e){} }
      else{ try{ sw.call(this, k, v); }catch(e){} }
    };
    Storage.prototype.removeItem = function(k){
      if(typeof k === 'string'){ r.call(this, pre + k); r.call(this, k); }
      else r.call(this, k);
    };
  }catch(e){}
})();
