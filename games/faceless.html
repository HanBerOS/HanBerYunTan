<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

<title>没有脸的人 THE FACELESS — 一部反战游戏</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;color:#cfcfc6;user-select:none;-webkit-user-select:none;}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
canvas#game{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden;}
.layer{position:absolute;left:0;right:0;margin:auto;display:none;opacity:0;transition:opacity .35s;}
.layer.show{display:block;opacity:1;}
.layer.instant{transition:none;}
/* 对话 */
#dlg{bottom:0;width:min(92vw,900px);background:rgba(3,4,8,.88);border-top:2px solid #5c1414;padding:14px 18px 12px;box-shadow:0 -8px 40px rgba(0,0,0,.8);}
#dlg .who{display:inline-block;font-size:14px;font-weight:700;letter-spacing:2px;color:#d8d8d0;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:2px;margin-bottom:6px;}
#dlg .txt{font-size:16px;line-height:1.75;min-height:56px;color:#e8e6df;text-shadow:0 0 6px rgba(0,0,0,.9);}
#dlg .next{position:absolute;right:22px;bottom:10px;font-size:12px;color:#8a8a80;animation:blink 1s infinite;}
#dlg .mono{color:#b9b7ae;font-style:italic;}
#dlg .mom{color:#e0b76a;}
#dlg .officer{color:#d97a5a;}
#dlg .inner{color:#9aa5b8;font-style:italic;}
#dlg .red{color:#e04040;}
#dlg .monster{color:#d8d8d0;letter-spacing:2px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
/* 选项 */
#ask{top:38%;width:min(92vw,640px);pointer-events:auto;}
#ask .askt{font-size:15px;color:#8a8a80;text-align:center;margin-bottom:12px;letter-spacing:2px;}
#ask button{display:block;width:100%;margin:6px 0;padding:12px 16px;background:rgba(10,12,18,.92);border:1px solid #4a4a42;color:#e8e6df;font-size:16px;letter-spacing:3px;cursor:pointer;text-align:center;transition:all .15s;pointer-events:auto;}
#ask button:hover,#ask button:focus{background:#3a1515;border-color:#a02020;}
#ask button.hovered{background:#3a1515;border-color:#a02020;}
/* 章节卡片 */
#card{top:34%;width:min(90vw,700px);text-align:center;}
#card .ct{font-size:34px;letter-spacing:10px;color:#e8e6df;text-shadow:0 0 20px rgba(160,32,32,.6);}
#card .cs{font-size:14px;color:#8a8a80;letter-spacing:6px;margin-top:8px;}
#card .ch{font-size:13px;color:#5c5c54;margin-top:14px;letter-spacing:2px;}
#card .csub{font-size:15px;color:#d8d8d0;margin-top:10px;letter-spacing:2px;line-height:1.8;}
/* HUD */
#hud{top:0;padding:10px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;}
#hud .box{background:rgba(3,4,8,.72);border:1px solid #2a2a24;padding:7px 12px;font-size:12px;letter-spacing:2px;}
#hud .lbl{color:#8a8a80;font-size:11px;}
#hud .val{color:#e8e6df;font-size:14px;margin-top:2px;}
#hud .bar{width:150px;height:8px;background:#15151a;margin-top:5px;border:1px solid #2a2a24;}
#hud .bar i{display:block;height:100%;background:#8f6a3a;transition:width .5s, background .5s;}
#hud .bar i.low{background:#a02020;}
#hud .bar i.dead{background:#555;}
#hud .right{text-align:right;}
#hud .kills{color:#a02020;}
#hud .keys{position:fixed;bottom:8px;right:14px;font-size:11px;color:#5c5c54;letter-spacing:1px;text-align:right;line-height:1.8;}
/* 信件/物品 */
#inv{top:12%;left:50%;transform:translateX(-50%);width:min(94vw,720px);background:rgba(4,5,9,.94);border:1px solid #3a3a34;padding:16px 18px;pointer-events:auto;max-height:76vh;overflow:auto;}
#inv h2{margin:0 0 10px;font-size:16px;letter-spacing:4px;color:#e0b76a;}
#inv .close{float:right;cursor:pointer;color:#8a8a80;font-size:14px;}
#inv .cat{color:#8a8a80;font-size:12px;letter-spacing:3px;margin:12px 0 6px;border-top:1px solid #23231e;padding-top:8px;}
#inv .item{display:block;width:100%;text-align:left;background:none;border:none;color:#cfcfc6;font-size:14px;padding:8px 6px;cursor:pointer;letter-spacing:1px;border-left:2px solid transparent;}
#inv .item:hover{background:#14161e;border-left-color:#a02020;color:#fff;}
#inv .item .tag{color:#5c5c54;font-size:11px;}
#inv .body{margin-top:8px;font-size:13px;line-height:1.9;color:#b9b7ae;white-space:pre-wrap;border-top:1px solid #23231e;padding-top:10px;max-height:34vh;overflow:auto;}
#inv .body .who{color:#e0b76a;}
/* 死亡 */
#death{top:0;width:100%;height:100%;background:rgba(0,0,0,.96);flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;}
#death.show{display:flex;}
#death .d1{font-size:40px;letter-spacing:16px;color:#a02020;text-shadow:0 0 24px rgba(160,32,32,.5);}
#death .d2{margin-top:22px;font-size:15px;line-height:2.2;color:#8a8a80;text-align:center;letter-spacing:2px;}
#death .d3{margin-top:30px;font-size:12px;color:#4a4a42;letter-spacing:3px;animation:blink 1.2s infinite;}
#death .d2 b{color:#cfcfc6;}
/* toast */
#toast{top:12%;font-size:13px;color:#d8d8d0;letter-spacing:2px;text-shadow:0 0 10px #000;text-align:center;width:100%;}
/* 标题 */
#title{top:0;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;background:transparent;}
#title.show{display:flex;}
#title .t1{font-size:52px;letter-spacing:18px;color:#e8e6df;text-shadow:0 0 30px rgba(160,32,32,.7);font-weight:700;}
#title .t2{font-size:18px;letter-spacing:12px;color:#8a8a80;margin-top:10px;}
#title .t3{margin-top:26px;font-size:13px;color:#5c5c54;letter-spacing:4px;line-height:2.2;text-align:center;}
#title .t4{margin-top:40px;font-size:14px;color:#a02020;letter-spacing:6px;animation:blink 1.4s infinite;}
#title .t5{position:absolute;bottom:26px;font-size:11px;color:#3a3a34;letter-spacing:2px;}
#flash{position:absolute;inset:0;background:rgba(255,255,255,.0);pointer-events:none;transition:none;}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);opacity:.5;mix-blend-mode:multiply;}
#blood{position:absolute;inset:0;pointer-events:none;opacity:0;}
#touch{position:fixed;inset:0;pointer-events:none;z-index:9;display:none;}
#touch .tb{position:absolute;background:rgba(20,22,30,.5);border:1px solid #3a3a34;color:#cfcfc6;font-size:18px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s;}
#err{position:fixed;bottom:0;left:0;right:0;background:#500;color:#fff;font-size:12px;padding:6px;display:none;z-index:99;white-space:pre-wrap;pointer-events:auto;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#2a2a24;}::-webkit-scrollbar-track{background:#0a0a0e;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<div id="ui">
  <div id="fade"></div>
  <div id="vig"></div>
  <div id="scan"></div>
  <div id="blood"></div>
  <div id="flash"></div>
  <div id="toast" class="layer"></div>
  <div id="dlg" class="layer"><span class="who" id="dlgwho"></span><div class="txt" id="dlgtxt"></div><div class="next">▼ 空格 / 点击</div></div>
  <div id="ask" class="layer"><div class="askt" id="askt"></div><div id="askb"></div></div>
  <div id="card" class="layer"><div class="ct" id="cardt"></div><div class="cs" id="cards"></div><div class="csub" id="cardc"></div><div class="ch" id="cardh"></div></div>
  <div id="hud">
    <div class="box"><div class="lbl">人性 · 你还剩下什么</div><div class="bar"><i id="humbar"></i></div><div class="val" id="humval"></div></div>
    <div class="box right"><div class="lbl" id="daylbl">战争第 1 天</div><div class="val" id="killsval"></div><div class="lbl" id="hintval" style="color:#e0b76a"></div></div>
  </div>
  <div class="keys" id="keyhint"></div>
  <div id="inv" class="layer"><span class="close" id="invclose">✕ 关闭</span><h2>行囊 · 你还带着的东西</h2><div id="invbody"></div></div>
  <div id="death" class="layer"><div class="d1">你死了</div><div class="d2" id="deathtxt"></div><div class="d3">— 点击 · 再冲一次 —</div></div>
  <div id="title" class="layer"><div class="t1">没有脸的人</div><div class="t2">T H E &nbsp;F A C E L E S S</div><div class="t3" id="titletxt"></div><div class="t4" id="titlecta">点 击 开 始</div><div class="t5">谨记：战争是地狱。这是一部反战游戏。</div></div>
</div>

<div id="dbg" style="position:fixed;top:0;right:0;background:#000;color:#0f0;font-size:11px;z-index:999;padding:2px 6px;font-family:monospace;">dbg</div>
<script>
'use strict';
/* =====================================================================
   没有脸的人 THE FACELESS
   一部反战像素游戏 · 单文件 · 无任何外部依赖
   —— 战争是地狱。所有被战争带走的名字，都曾是某个母亲的儿子。
   ===================================================================== */
var $=function(id){return document.getElementById(id);};
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var rand=function(a,b){return a+Math.random()*(b-a);};
var randi=function(a,b){return Math.floor(rand(a,b+1));};
var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
var TAU=Math.PI*2;
var now=function(){return performance.now()/1000;};

/* ============================= 状态 ============================= */
var S={
  chapter:0, name:'你', humanity:100, kills:0, deaths:0, days:0,
  letters:[], lettersRead:[], items:[], dogtags:[], killed:[],
  flags:{}, choices:{}, endings:{},
  isNew:true
};
var SAVE_KEY='faceless_save_v1';
function saveGame(){
  try{
    S.flags.savedAt=new Date().toISOString();
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
  }catch(e){}
}
function loadGame(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var d=JSON.parse(raw);
    for(var k in S){ if(d[k]!==undefined) S[k]=d[k]; }
    return true;
  }catch(e){ return false; }
}
function resetGame(){
  var was=S.isNew; var obj={chapter:0,name:'你',humanity:100,kills:0,deaths:0,days:0,letters:[],lettersRead:[],items:[],dogtags:[],killed:[],flags:{},choices:{},endings:{},isNew:true};
  for(var k in S){ delete S[k]; }
  for(var k2 in obj){ S[k2]=obj[k2]; }
  S.isNew=was;
}
function addLetter(l){ if(!S.letters.some(function(x){return x.id===l.id;})){ S.letters.push(l); UI.toast('获得：'+l.title); } }
function addItem(l){ if(!S.items.some(function(x){return x.id===l.id;})){ S.items.push(l); } }
function addDogtag(l){ S.dogtags.push(l); }

/* ============================= 音频 ============================= */
var Aud=(function(){
  var ctx=null, master=null, muted=false, noiseBuf=null;
  var music=null, humOsc=null, humGain=null, rainGain=null, windGain=null, heartTimer=0, heartOn=false;
  function init(){
    if(ctx) return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0.55; master.connect(ctx.destination);
      var len=ctx.sampleRate*2; noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){ ctx=null; }
  }
  function resume(){ if(ctx&&ctx.state==='suspended') ctx.resume(); }
  function mute(){ muted=!muted; if(master) master.gain.value=muted?0:0.55; return muted; }
  function env(g,t0,a,peak,d){ g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); }
  function noise(dur,filterFreq,peak,type){
    if(!ctx) return;
    var t=ctx.currentTime;
    var src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    var f=ctx.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=filterFreq;
    var g=ctx.createGain(); env(g,t,0.005,peak,dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t+dur+0.1);
  }
  function tone(freq,dur,peak,type,slide){
    if(!ctx) return;
    var t=ctx.currentTime;
    var o=ctx.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    var g=ctx.createGain(); env(g,t,0.008,peak,dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.1);
  }
  return {
    init:init, resume:resume, mute:mute,
    gun:function(){ noise(0.12,2600,0.9,'bandpass'); tone(150,0.1,0.7,'square',40); },
    rifle:function(){ noise(0.16,3000,0.7,'bandpass'); tone(110,0.12,0.5,'square',30); },
    boom:function(big){
      noise(big?1.6:0.8, big?300:500, big?1:0.8,'lowpass');
      tone(big?55:70, big?1.4:0.7, big?1:0.7,'sine',25);
      G.shake(big?1:0.5);
    },
    whistle:function(){ if(!ctx)return; var t=ctx.currentTime; var o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(1900,t); o.frequency.linearRampToValueAtTime(2400,t+0.15); o.frequency.linearRampToValueAtTime(1500,t+0.45); var g=ctx.createGain(); g.gain.setValueAtTime(0.35,t); g.gain.linearRampToValueAtTime(0.35,t+0.4); g.gain.linearRampToValueAtTime(0.0001,t+0.55); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.6); },
    scream:function(){ if(!ctx)return; tone(900,0.5,0.25,'sawtooth',400); tone(1200,0.4,0.18,'sawtooth',600); },
    clink:function(){ tone(3000,0.3,0.2,'triangle',600); noise(0.1,4000,0.12,'highpass'); },
    splash:function(){ noise(0.35,900,0.35,'lowpass'); },
    thunder:function(){ noise(2.2,180,0.55,'lowpass'); tone(40,2,0.4,'sine',25); },
    drip:function(){ tone(1800,0.12,0.12,'sine',900); },
    // 雨/风 循环
    startRain:function(){ if(!ctx||rainGain)return; var src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true; var f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=0.6; rainGain=ctx.createGain(); rainGain.gain.value=0.0; src.connect(f); f.connect(rainGain); rainGain.connect(master); src.start(); },
    setRain:function(v){ if(rainGain) rainGain.gain.linearRampToValueAtTime(v, ctx.currentTime+1.5); },
    startWind:function(){ if(!ctx||windGain)return; var src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true; var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=320; windGain=ctx.createGain(); windGain.gain.value=0.0; src.connect(f); f.connect(windGain); windGain.connect(master); src.start(); },
    setWind:function(v){ if(windGain) windGain.gain.linearRampToValueAtTime(v, ctx.currentTime+1.5); },
    stopWeather:function(){ if(rainGain){rainGain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.8); setTimeout(function(){try{rainGain.disconnect();}catch(e){}; rainGain=null;},900);} if(windGain){windGain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.8); setTimeout(function(){try{windGain.disconnect();}catch(e){}; windGain=null;},900);} },
    // 心跳
    setHeart:function(on){ heartOn=on; heartTimer=0; },
    tickHeart:function(dt){
      if(!ctx||!heartOn) return;
      heartTimer-=dt;
      if(heartTimer<=0){
        heartTimer=0.92; var t=ctx.currentTime;
        tone(58,0.09,0.6,'sine',45); tone(52,0.12,0.45,'sine',40);
      }
    },
    // 哼唱（摇篮曲）
    hum:function(start){
      if(!ctx) return;
      if(start){
        if(humOsc) return;
        humOsc=ctx.createOscillator(); humOsc.type='sine'; humOsc.frequency.value=392;
        var lfo=ctx.createOscillator(); lfo.frequency.value=5.2;
        var lfoG=ctx.createGain(); lfoG.gain.value=5;
        lfo.connect(lfoG); lfoG.connect(humOsc.frequency);
        humGain=ctx.createGain(); humGain.gain.value=0.0001; humGain.gain.linearRampToValueAtTime(0.05,ctx.currentTime+1.2);
        humOsc.connect(humGain); humGain.connect(master);
        humOsc.start(); lfo.start();
      }else{
        if(humOsc){ try{humGain.gain.linearRampToValueAtTime(0.0001,ctx.currentTime+1);}catch(e){} var o=humOsc; humOsc=null; setTimeout(function(){try{o.stop();}catch(e){}},1400); }
      }
    },
    /* 音乐序列器 */
    playMusic:function(def){
      if(!ctx) return;
      music={notes:def.notes, bpm:def.bpm, inst:def.inst||'box', loop:def.loop!==false, vol:def.vol||0.2, idx:0, next:ctx.currentTime+0.1, stopped:false, done:def.done};
    },
    stopMusic:function(){ music=null; },
    tickMusic:function(){
      if(!ctx||!music) return;
      var m=music;
      while(m.next<ctx.currentTime+0.18){
        var n=m.notes[m.idx];
        if(n){
          if(n[0]>0){
            var beat=60/m.bpm;
            if(m.inst==='box'){ var o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=n[0]; var o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=n[0]*2; var g=ctx.createGain(); var g2=ctx.createGain(); g.gain.setValueAtTime(0.0001,m.next); g.gain.linearRampToValueAtTime(m.vol,m.next+0.01); g.gain.exponentialRampToValueAtTime(0.0001,m.next+n[1]*beat*0.95); g2.gain.value=m.vol*0.25; o.connect(g); g.connect(master); o2.connect(g2); g2.connect(master); o.start(m.next); o.stop(m.next+n[1]*beat); o2.start(m.next); o2.stop(m.next+n[1]*beat); }
            else if(m.inst==='drone'){ var o3=ctx.createOscillator(); o3.type='sine'; o3.frequency.value=n[0]; var g3=ctx.createGain(); g3.gain.setValueAtTime(0.0001,m.next); g3.gain.linearRampToValueAtTime(m.vol*0.6,m.next+1.2); g3.gain.linearRampToValueAtTime(0.0001,m.next+n[1]*beat); o3.connect(g3); g3.connect(master); o3.start(m.next); o3.stop(m.next+n[1]*beat+0.1); }
            else if(m.inst==='horn'){ var o4=ctx.createOscillator(); o4.type='square'; o4.frequency.value=n[0]; var f4=ctx.createBiquadFilter(); f4.type='lowpass'; f4.frequency.value=900; var g4=ctx.createGain(); g4.gain.setValueAtTime(0.0001,m.next); g4.gain.linearRampToValueAtTime(m.vol*0.5,m.next+0.02); g4.gain.exponentialRampToValueAtTime(0.0001,m.next+n[1]*beat*0.92); o4.connect(f4); f4.connect(g4); g4.connect(master); o4.start(m.next); o4.stop(m.next+n[1]*beat); }
            else if(m.inst==='snare'){ if(n[0]===1){ var s=ctx.createBufferSource(); s.buffer=noiseBuf; var f5=ctx.createBiquadFilter(); f5.type='bandpass'; f5.frequency.value=1800; var g5=ctx.createGain(); g5.gain.setValueAtTime(m.vol*0.5,m.next); g5.gain.exponentialRampToValueAtTime(0.0001,m.next+0.08); s.connect(f5); f5.connect(g5); g5.connect(master); s.start(m.next); s.stop(m.next+0.1); } }
          }
        }
        m.idx++;
        if(m.idx>=m.notes.length){
          if(m.loop){ m.idx=0; }
          else{ var mm=m; music=null; if(mm.done) setTimeout(mm.done,50); return; }
        }
        m.next+=60/m.bpm;
      }
    },
    /* 摇篮曲 妈妈的主题 */
    lullaby:function(){ this.playMusic({bpm:72, vol:0.16, inst:'box', notes:[
      [659,1],[784,1],[880,1.5],[784,0.5],[659,1],[587,1],[523,2],
      [440,1],[523,1],[659,1.5],[587,0.5],[523,1],[440,1],[392,2],
      [440,1],[523,1],[587,1.5],[523,0.5],[440,1],[392,1],[349,2],
      [392,1],[440,1],[523,1.5],[494,0.5],[440,1],[392,1],[349,2]
    ]}); },

/* ============================= 精灵 ============================= */
var Spr=(function(){

    x.fillStyle=boot;
    x.fillRect(Math.round(1.4*sc)+Math.round(walk*0.8*sc), (ly+3*sc)-1, lw+1, 1*sc+1);
    x.fillRect(Math.round(4*sc)-Math.round(walk*0.8*sc), (ly+3*sc)-1, lw+1, 1*sc+1);

    x.fillStyle=uni;
    x.fillRect(Math.round(1.2*sc), Math.round(3.4*sc), Math.round(4.6*sc), Math.round(4*sc));
    x.fillStyle='#2a2218'; // 腰带
    x.fillRect(Math.round(1.2*sc), Math.round(6.4*sc), Math.round(4.6*sc), 1);
    // 手臂
    x.fillStyle=uni;
    x.fillRect(Math.round(0.6*sc), Math.round(3.6*sc), 1*sc, Math.round(3*sc));
    x.fillRect(Math.round(5.4*sc), Math.round(3.6*sc), 1*sc, Math.round(3*sc));
    if(fire){
      x.save(); x.translate(Math.round(6.4*sc), Math.round(4*sc)); x.rotate(-0.6);
      x.fillStyle='#2a2218'; x.fillRect(0,0,1*sc,Math.round(4.4*sc));
      x.restore();
    }
    // 头
    x.fillStyle=skin; x.fillRect(Math.round(1.8*sc), Math.round(0.8*sc), Math.round(3.4*sc), Math.round(2.8*sc));
    if(o.faceless){ x.fillStyle='#d8d8d0'; x.fillRect(Math.round(1.8*sc), Math.round(0.8*sc), Math.round(3.4*sc), Math.round(2.8*sc)); }
    else if(o.blank){ /* 无脸死兵 */ x.fillStyle='#6a6a64'; x.fillRect(Math.round(1.8*sc), Math.round(0.8*sc), Math.round(3.4*sc), Math.round(2.8*sc)); }
    else{
      x.fillStyle='#141418'; // 眼

      x.fillRect(Math.round(3.8*sc), Math.round(1.6*sc), 1, 1);
      if(o.beard){ x.fillStyle='#8a8a80'; x.fillRect(Math.round(2*sc), Math.round(2.6*sc), Math.round(3*sc), 1); }

  /* 士兵（主角/战友） */

  function girl(){ var c=cv(9,13),x=C(c); x.fillStyle='#6a3a2e'; x.fillRect(1,8,2,3); x.fillRect(5,8,2,3); x.fillStyle='#7a4a3a'; x.fillRect(1,3,6,6); x.fillStyle='#3a2416'; x.fillRect(2,0,4,3); x.fillStyle='#c9a985'; x.fillRect(3,2,2,2); x.fillStyle='#141418'; x.fillRect(3,3,1,1); x.fillRect(5,3,1,1); x.fillStyle='#8a8a80'; x.fillRect(7,6,1,3); return c; }

  /* 没有脸的怪物 */
  function faceless(size, opts){

  return { cv:cv, C:C, person:person, soldier:soldier, civilian:civilian, girl:girl, doll:doll, rat:rat, dogtags:dogtags, faceless:faceless, poster:poster, treeBare:treeBare, house:house, grave:grave };

/* ============================= 特效 ============================= */
var FX=(function(){
  var parts=[], decals=[], weatherType='none', rainDrops=[], snowFlakes=[], ashBits=[];
  function reset(){ parts=[]; decals=[]; rainDrops=[]; snowFlakes=[]; ashBits=[]; weatherType='none'; }
  function setWeather(t,n){ weatherType=t; if(n){ for(var i=0;i<n;i++){ if(t==='rain') rainDrops.push({x:rand(0,G.w),y:rand(-300,0),s:rand(2,5),sp:rand(280,420)}); else if(t==='snow') snowFlakes.push({x:rand(0,G.w),y:rand(-270,0),s:rand(1,3),sp:rand(18,40),dr:rand(-20,20)}); else if(t==='ash') ashBits.push({x:rand(0,G.w),y:rand(-270,0),s:rand(1,2),sp:rand(30,70),dr:rand(-15,15)}); } } }
  function spawn(o){ parts.push(o); }
  function blood(x,y,n,dir){ dir=dir||0; for(var i=0;i<n;i++){ parts.push({x:x,y:y,vx:Math.cos(dir+rand(-0.9,0.9))*rand(20,90),vy:rand(-60,-10),life:rand(0.4,0.9),max:0.9,col:pick(['#a01f1f','#c83838','#7c1414']),grav:140,size:rand(1,2.2),type:'blood'}); }
    for(var j=0;j<Math.floor(n/2);j++) decals.push({x:x+rand(-6,6),y:y+rand(-3,3),r:rand(1,3),col:pick(['#6e1010','#8f1d1d','#5c0f0f'])});
  }
  function spark(x,y,n,dir){ for(var i=0;i<n;i++){ parts.push({x:x,y:y,vx:Math.cos(dir+rand(-0.6,0.6))*rand(40,160),vy:rand(-120,-30),life:rand(0.2,0.5),max:0.5,col:pick(['#ffd23e','#ff7b1a','#fff']),grav:60,size:1,type:'spark'}); } }
  function smoke(x,y,n,big){ for(var i=0;i<n;i++){ parts.push({x:x+rand(-4,4),y:y+rand(-3,3),vx:rand(-14,14),vy:rand(-40,-16),life:rand(1,2.4),max:2.4,col:big?'#2a2a2a':'#3a3a3a',size:rand(2,big?6:4),type:'smoke',grow:0.6}); } }
  function ember(x,y,n){ for(var i=0;i<n;i++){ parts.push({x:x,y:y,vx:rand(-18,18),vy:rand(-90,-30),life:rand(0.7,1.6),max:1.6,col:pick(['#ff7b1a','#ffd23e','#ff3d00']),size:1,type:'ember',grav:-30}); } }
  function mud(x,y,n){ for(var i=0;i<n;i++){ parts.push({x:x,y:y,vx:rand(-40,40),vy:rand(-90,-20),life:rand(0.3,0.7),max:0.7,col:'#3d3125',size:rand(1,2),type:'blood',grav:220}); } }
  function splash(x,y,n){ for(var i=0;i<n;i++){ parts.push({x:x+rand(-8,8),y:y+rand(-2,2),vx:rand(-36,36),vy:rand(-110,-15),life:rand(0.4,0.8),max:0.8,col:pick(['#a8c8e8','#d8ecf8','#7a9ab8']),size:rand(1,2.2),type:'blood',grav:300}); } }
  function update(dt){
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.life-=dt; if(p.life<=0){ parts.splice(i,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.grav) p.vy+=p.grav*dt; if(p.type==='smoke'&&p.grow) p.size+=p.grow*dt; }
    if(weatherType==='rain'){ for(var j=0;j<rainDrops.length;j++){ var r=rainDrops[j]; r.y+=r.sp*dt; r.x+=6*dt; if(r.y>G.h){ r.y=-5; r.x=rand(0,G.w); } } }
    else if(weatherType==='snow'){ for(var k=0;k<snowFlakes.length;k++){ var s=snowFlakes[k]; s.y+=s.sp*dt; s.x+=Math.sin(now()*2+s.dr)*14*dt; if(s.y>G.h){ s.y=-5; s.x=rand(0,G.w); } } }
    else if(weatherType==='ash'){ for(var m=0;m<ashBits.length;m++){ var a=ashBits[m]; a.y+=a.sp*dt; a.x+=Math.sin(now()*2.4+a.dr)*20*dt; if(a.y>G.h){ a.y=-5; a.x=rand(0,G.w); } } }
  }
  function draw(c){
    // 血迹
    for(var i=0;i<decals.length;i++){ var d=decals[i]; c.fillStyle=d.col; c.fillRect(d.x,d.y,d.r,d.r); }
    for(var j=0;j<parts.length;j++){ var p=parts[j]; var a=clamp(p.life/p.max,0,1); c.globalAlpha=a; c.fillStyle=p.col; c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); }
    c.globalAlpha=1;
    // 天气
    if(weatherType==='rain'){ c.strokeStyle='rgba(170,180,200,0.35)'; c.lineWidth=1; for(var k=0;k<rainDrops.length;k++){ var r=rainDrops[k]; c.beginPath(); c.moveTo(r.x,r.y); c.lineTo(r.x-3,r.y-8); c.stroke(); } }
    else if(weatherType==='snow'){ c.fillStyle='rgba(230,230,230,0.8)'; for(var m2=0;m2<snowFlakes.length;m2++){ var s2=snowFlakes[m2]; c.fillRect(s2.x,s2.y,s2.s,s2.s); } }
    else if(weatherType==='ash'){ c.fillStyle='rgba(60,60,58,0.8)'; for(var m3=0;m3<ashBits.length;m3++){ var a2=ashBits[m3]; c.fillRect(a2.x,a2.y,a2.s,a2.s); } }
  }
  function drawFire(c,x,y,s){ // 火苗
    var f=Math.sin(now()*10+x)*0.3+0.7;
    c.fillStyle='rgba(255,61,0,'+(0.5*f)+')'; c.fillRect(x-s/2,y-s,s,s*1.4);
    c.fillStyle='rgba(255,123,26,'+(0.7*f)+')'; c.fillRect(x-s/4,y-s*1.2,s/2,s);
    c.fillStyle='rgba(255,210,62,'+(0.9*f)+')'; c.fillRect(x-s/8,y-s*1.5,s/4,s/2);
  }
  return { reset:reset, setWeather:setWeather, spawn:spawn, blood:blood, spark:spark, smoke:smoke, ember:ember, mud:mud, splash:splash, update:update, draw:draw, drawFire:drawFire };
})();

/* ============================= 引擎 ============================= */
var G={
  w:480,h:270, c:null, ctx:null, scale:1,
  keys:{}, mouse:{x:0,y:0,down:false}, inputLock:false,
  scenes:{}, cur:null, sceneData:null, time:0, pause:false,
  shakeAmt:0, flashA:0, flashCol:'#fff', fadeA:0,
  hint:null,
  init:function(){
    this.c=$('game'); this.ctx=this.c.getContext('2d');
    var self=this;
    window.addEventListener('keydown',function(e){
      var k=e.key.toLowerCase();
      self.keys[k]=true;
      if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault();
      if(k===' '||k==='enter'){ if(!self.inputLock||$('dlg').classList.contains('show')) self.press('confirm'); }
      if(k==='e') self.press('interact');
      if(k==='i') UI.toggleInv();
      if(k==='m') Aud.mute();
      if(k==='1'||k==='2'||k==='3'||k==='4') self.press('num'+k);
      Aud.resume();
    });
    window.addEventListener('keyup',function(e){ self.keys[e.key.toLowerCase()]=false; });
    window.addEventListener('mousemove',function(e){ var r=self.c.getBoundingClientRect(); self.mouse.x=(e.clientX-r.left)*self.w/r.width; self.mouse.y=(e.clientY-r.top)*self.h/r.height; });
    window.addEventListener('mousedown',function(e){ self.mouse.down=true; if(!self.inputLock||$('dlg').classList.contains('show')) self.press('confirm'); Aud.resume(); });
    window.addEventListener('mouseup',function(){ self.mouse.down=false; });
    window.addEventListener('resize',function(){ self.fit(); });
    window.addEventListener('error',function(e){ var el=$('err'); el.style.display='block'; el.textContent='脚本错误: '+(e.message||e)+'\n'+(e.error&&e.error.stack?e.error.stack.split('\n').slice(0,4).join('\n'):''); });
    this.fit(); this.loop();
  },
  fit:function(){
    var vw=window.innerWidth, vh=window.innerHeight;
    this.scale=Math.max(1,Math.min(Math.floor(vw/this.w),Math.floor(vh/this.h)));
    if(this.scale<1) this.scale=1;
    this.c.style.width=(this.w*this.scale)+'px'; this.c.style.height=(this.h*this.scale)+'px';
  },
  press:function(act){ if(this.cur&&this.cur.press) this.cur.press(act); },
  start:function(name,data){
    FX.reset(); Aud.stopWeather();
    this.sceneData=data||{};
    var sc=this.scenes[name];
    if(sc) sc.name=sc.name||name;
    this.cur=sc;
    if(sc.enter) sc.enter(this.sceneData);
    UI.closeAll();
  },
  shake:function(a){ this.shakeAmt=Math.max(this.shakeAmt,a); },
  flash:function(col,a){ this.flashA=a; this.flashCol=col; var el=$('flash'); el.style.background=col; el.style.opacity=clamp(a,0,0.9); },
  fade:function(to,cb){ var el=$('fade'); el.style.transition='opacity .9s'; el.style.opacity=to?1:0; var self=this; clearTimeout(this._ft); this._ft=setTimeout(function(){ if(cb) cb(); }, to?900:100); },
  die:function(lines){
    var el=$('death'); $('deathtxt').innerHTML=lines.join('<br>');
    el.classList.add('show'); this.pause=true; this.inputLock=true;
    S.deaths++;
    var self=this;
    $('death').onclick=function(){
      el.classList.remove('show'); self.pause=false; self.inputLock=false;
      if(self.cur&&self.cur.retry) self.cur.retry();
      else self.start(self.cur.name);
    };
    $('death').style.pointerEvents='auto';
  },
  loop:function(){
    var self=this;
    var last=now();
    function frame(){
      var t=now(); var dt=Math.min(0.05,t-last); last=t;
      self.time+=dt;
      try{
        Aud.tickMusic();
        if(self.pause){ requestAnimationFrame(frame); return; }
        if(self.cur&&self.cur.update) self.cur.update(dt);
        FX.update(dt);
        Aud.tickHeart(dt);
        if(self.shakeAmt>0) self.shakeAmt=Math.max(0,self.shakeAmt-dt*2);
        if(self.flashA>0){ self.flashA-=dt*2.4; if(self.flashA<=0){ self.flashA=0; $('flash').style.opacity=0; } }
        self.render();
        UI.updateHud();
        var _d=$('dbg'); if(_d){ _d.textContent='scene:'+(self.cur?self.cur.name:'?')+' ch:'+S.chapter+' pause:'+(self.pause?1:0)+' t:'+self.time.toFixed(1); }
      }catch(e){
        var _d=$('dbg'); if(_d){ _d.textContent='FRAME ERR: '+e.message+' @ '+(self.cur?self.cur.name:'?'); }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  },
  render:function(){
    var c=this.ctx, w=this.w, h=this.h;
    c.save();
    if(this.shakeAmt>0){ c.translate(rand(-1,1)*this.shakeAmt*4, rand(-1,1)*this.shakeAmt*4); }
    c.fillStyle='#05060a'; c.fillRect(-4,-4,w+8,h+8);
    if(this.cur&&this.cur.draw) this.cur.draw(c);
    FX.draw(c);
    c.restore();
  }
};

  var typing=false, queue=[], qidx=0, timer=null, typeIdx=0, dlgDone=null;
  function show(id){ $(id).classList.add('show'); }
  function hide(id){ $(id).classList.remove('show'); }
  function closeAll(){ hide('dlg'); hide('ask'); hide('card'); hide('inv'); hide('death'); hide('title'); hide('toast'); }
  function typewriter(el,text,speed,cb){
    el.textContent=''; typeIdx=0; clearInterval(timer);
    timer=setInterval(function(){
      typeIdx+=2; if(typeIdx>=text.length){ typeIdx=text.length; clearInterval(timer); if(cb) cb(); }
      el.textContent=text.slice(0,typeIdx);
    }, speed||22);
  }
  function say(lines,done){
    queue=lines.slice(); qidx=0; dlgDone=done; G.inputLock=true; typing=false;
    show('dlg'); next();
  }
  function next(){
    if(qidx>=queue.length){ hide('dlg'); G.inputLock=false; var d=dlgDone; dlgDone=null; if(d) d(); return; }
    var L=queue[qidx];
    var who=$('dlgwho'), txt=$('dlgtxt');
    who.textContent=L.w||'';
    who.style.color='#d8d8d0';
    var cls='';
    if(L.cls){ var map={mono:'mono',mom:'mom',officer:'officer',inner:'inner',red:'red',monster:'monster'}; cls=map[L.cls]||''; }
    txt.className='txt '+cls;
    typewriter(txt,L.s,20,function(){ typing=true; });
    if(L.fx) runFx(L.fx);
  }
  function runFx(f){
    if(f==='gun') Aud.gun();
    else if(f==='boom') Aud.boom(false);
    else if(f==='bigboom') Aud.boom(true);
    else if(f==='whistle') Aud.whistle();
    else if(f==='scream') Aud.scream();
    else if(f==='thunder') Aud.thunder();
    else if(f==='clink') Aud.clink();
    else if(f==='splash') Aud.splash();
  }
  function advance(){
    if(!queue.length&&!typing) return;
    if(typing){ // 完成打字
      clearInterval(timer); var L=queue[qidx]; $('dlgtxt').textContent=L.s; typing=false; return;
    }
    qidx++; next();
  }
  function ask(title,opts,done){
    G.inputLock=true;
    $('askt').textContent=title||'';
    var b=$('askb'); b.innerHTML='';
    opts.forEach(function(o,i){
      var btn=document.createElement('button');
      btn.textContent=o.k; btn.tabIndex=0;
      btn.addEventListener('click',function(){ hide('ask'); G.inputLock=false; done(i+1); });
      btn.addEventListener('mouseenter',function(){ btn.classList.add('hovered'); });
      btn.addEventListener('mouseleave',function(){ btn.classList.remove('hovered'); });
      b.appendChild(btn);
    });
    show('ask');
  }
  function card(title,sub,body,hint,done){
    $('cardt').textContent=title; $('cards').textContent=sub||'';
    $('cardc').textContent=body||''; $('cardh').textContent=hint||'';
    show('card');
    setTimeout(function(){ hide('card'); if(done) done(); }, (hint?2400:2100));
  }
  function toast(msg,ms){ $('toast').textContent=msg; show('toast'); clearTimeout(toast._t); toast._t=setTimeout(function(){ hide('toast'); }, ms||2200); }
  /* HUD */
  function updateHud(){
    var hb=$('humbar');
    hb.style.width=clamp(S.humanity,0,100)+'%';
    hb.className='';
    if(S.humanity<=10) hb.classList.add('dead');
    else if(S.humanity<=35) hb.classList.add('low');
    var hv=$('humval');
    if(S.humanity>70) hv.textContent='你还算个人';
    else if(S.humanity>45) hv.textContent='你在动摇';
    else if(S.humanity>20) hv.textContent='你开始麻木';
    else if(S.humanity>5) hv.textContent='行尸走肉';
    else hv.textContent='你记不清自己是谁';
    $('daylbl').textContent=S.days>0?('战争第 '+S.days+' 天'):'战争第 1 天';
    var kv=$('killsval');
    if(S.chapter<2) kv.textContent='';
    else if(S.kills>50) kv.textContent='你已数不清';
    else kv.textContent='你杀了 '+S.kills+' 个母亲的孩子';
    var kh=$('keyhint');
    if(G.hint) kh.textContent=G.hint; else kh.textContent='移动 WASD/方向键 · 互动 空格/E · 行囊 I · 静音 M';
    $('hintval').textContent='';
  }
  /* 行囊 */
  function toggleInv(){ if($('inv').classList.contains('show')) hide('inv'); else openInv(); }
  function openInv(){
    $('invclose').onclick=function(){ hide('inv'); };
    var b=$('invbody'); b.innerHTML='';
    var h='';
    if(S.items.length){ h+='<div class="cat">随身之物</div>'; S.items.forEach(function(it){ h+='<button class="item" data-id="i-'+it.id+'"><span class="tag">[物]</span> '+it.name+'</button>'; }); }
    if(S.letters.length){ h+='<div class="cat">信件 · 还没有寄到的字（'+S.letters.length+' 封）</div>'; S.letters.forEach(function(l){ h+='<button class="item" data-id="l-'+l.id+'"><span class="tag">[信]</span> '+l.title+'</button>'; }); }
    if(S.dogtags.length){ h+='<div class="cat">狗牌 · 你带回来的名字（'+S.dogtags.length+' 枚）</div>'; S.dogtags.forEach(function(d){ h+='<button class="item" data-id="d-'+d.id+'"><span class="tag">[牌]</span> '+d.name+'</button>'; }); }
    if(!h){ h='<div class="cat">空</div><div class="item">你什么都没带。</div>'; }
    b.innerHTML=h;
    var body=document.createElement('div'); body.className='body'; body.id='invbodytext';
    b.appendChild(body);
    b.querySelectorAll('button[data-id]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=btn.getAttribute('data-id'); var kind=id[0], rid=id.slice(2);
        var txt='';
        if(kind==='i'){ var it=S.items.find(function(x){return x.id===rid;}); if(it) txt=it.desc; }
        else if(kind==='l'){ var l=S.letters.find(function(x){return x.id===rid;}); if(l){ if(S.lettersRead.indexOf(l.id)<0) S.lettersRead.push(l.id); txt='《'+l.title+'》\n\n'+l.text; } }
        else if(kind==='d'){ var d=S.dogtags.find(function(x){return x.id===rid;}); if(d) txt=d.name+'  ·  '+d.date+'\n\n'+d.line; }
        body.textContent=txt||'……字迹被雨水泡烂了，你认不出。';
      });
    });
    show('inv');
  }
  return { say:say, advance:advance, ask:ask, card:card, toast:toast, openInv:toggleInv, toggleInv:toggleInv, closeAll:closeAll, updateHud:updateHud, show:show, hide:hide };
})();

  update:function(dt){

      else { this.px+=dt*22; }
      this.px=Math.min(this.px,380);
      if(this.px>=this.puddleX-8&&this.phase==='walk'){ G.hint='按 空格 在水洼前停下'; }
    }
    if(this.phase==='walkhome'){ this.px+=dt*40; this.walkT=(this.walkT||0)+dt; if(this.walkT>12){ this.walkT=999; var s2=this; G.fade(1,function(){ G.fade(0); G.start('epilogue'); }); } }
    if(this.phase==='look'){ this.t+=dt; }

  draw:function(c){
    // 雨后的废墟路
    var g=c.createLinearGradient(0,0,0,120);
    g.addColorStop(0,'#1a1c26'); g.addColorStop(1,'#2e3140');
    c.fillStyle=g; c.fillRect(0,0,480,120);
    // 废墟

    if(this.phase==='look'||this.phase==='loopback'||this.phase==='drop'){
      // 水中的怪物/自己
      var m=this.t;
      var ref=Spr.faceless(36); c.globalAlpha=0.85; c.drawImage(ref,282,186,28,36); c.globalAlpha=1;
      if(this.looked){ var me=Spr.person({u:'#4a4632',helmet:'round',s:'#c9a985',sc:2}); c.drawImage(me,284,192,14,24); }
    }
    // 玩家
    if(this.phase==='walk'||this.phase==='look'){
      var pl=Spr.soldier('us',{walk:Math.sin(this.t*6)*0.8});
      c.drawImage(pl,80+this.px*0.5,180,14,24);
    }
    if(this.phase==='walkhome'){
      // 缓慢移动的归途：废墟→田野→雪→春
      var off=(this.px*0.6)%480;
      var stage=Math.floor(this.px/3200);
      if(stage>=4) stage=4;
      if(stage===0){ /*废墟*/ }
      else if(stage===1){ c.fillStyle='#2a2a26'; c.fillRect(0,150,480,120); for(var t2=0;t2<10;t2++) c.fillRect(t2*60-((this.px*0.2)%60),130,40,4); }
      else if(stage===2){ c.fillStyle='#c8c8c2'; c.fillRect(0,120,480,150); }
      else if(stage>=3){ c.fillStyle='#5a7a4a'; c.fillRect(0,140,480,130); c.fillStyle='#6a8a58'; c.fillRect(0,130,480,10); }
      // 归人
      var home=Spr.civilian({coat:'#4a4632',hair:'#241a12',sc:2});
      c.drawImage(home,110,180,14,24);
      // 字幕提示
      if(this.walkT>6&&this.walkT<9){ c.fillStyle='rgba(230,230,220,0.8)'; c.font='10px monospace'; c.textAlign='center'; c.fillText('……家……',240,120); c.textAlign='left'; }
    }
  }
};

/* ============================= 启动 ============================= */
function bootGame(){
  try{
    G.init();
    G.start('title');
  }catch(e){
    var _d=$('dbg'); if(_d) _d.textContent='BOOT ERR: '+e.message;
    var _el=$('err'); _el.style.display='block'; _el.textContent='启动异常: '+e.message+'\n'+(e.stack?e.stack.split('\n').slice(0,5).join('\n'):'');
  }
}
if(document.readyState==='loading'){ window.addEventListener('DOMContentLoaded',bootGame); }
else{ bootGame(); }
