<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>白雾安魂曲 · 2D像素探索</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{--ink:#e6ecf4;--dim:#93a1b3;--blood:#e05548;--note:#f7f0d6;--deep:#0a1018;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--deep);color:var(--ink);overflow:hidden;font-family:'ZCOOL KuaiLe','Noto Sans SC',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#stage{position:relative;width:min(100vw,133.4vh);aspect-ratio:4/3;margin:0 auto;background:#0d1420}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;z-index:3}
#hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#hearts{font-size:22px;letter-spacing:2px;color:var(--blood);text-shadow:0 0 6px rgba(224,85,72,.6)}
#notes{font-size:17px;color:var(--note);text-shadow:0 0 8px rgba(247,240,214,.5)}
#hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;color:var(--dim);pointer-events:none;z-index:5;text-shadow:0 1px 3px #000}
#dlg{position:absolute;left:6%;right:6%;bottom:5%;min-height:104px;background:rgba(10,16,24,.9);border:2px solid rgba(230,236,244,.35);border-radius:8px;padding:12px 16px;display:none;z-index:8;box-shadow:0 0 24px rgba(0,0,0,.6)}
#dlgName{font-size:15px;color:var(--note);margin-bottom:4px}
#dlgText{font-size:17px;line-height:1.55;min-height:54px;color:var(--ink)}
#dlgHint{position:absolute;right:10px;bottom:6px;font-size:12px;color:var(--dim)}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#choices button{font-family:inherit;font-size:16px;color:var(--ink);background:rgba(46,61,74,.85);border:1px solid rgba(230,236,244,.35);border-radius:6px;padding:10px 12px;text-align:left;cursor:pointer;min-height:44px}
#choices button:hover{background:rgba(70,90,110,.92)}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(6,10,16,.84)}
#card{width:min(600px,88%);background:rgba(13,20,32,.96);border:2px solid rgba(230,236,244,.3);border-radius:10px;padding:26px 28px;text-align:center;max-height:90%;overflow:auto}
#card h1{font-family:'Press Start 2P',monospace;font-size:24px;line-height:1.6;color:var(--note);margin:10px 0 4px;text-shadow:0 0 16px rgba(247,240,214,.45)}
#card h2{font-size:20px;color:var(--ink);margin:6px 0 12px}
#card p{font-size:15px;line-height:1.7;color:var(--dim);margin:6px 0}
#card .sub{font-size:13px;color:#5f6f81}
#card .btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
#card button{font-family:inherit;font-size:17px;padding:12px 14px;border-radius:8px;cursor:pointer;min-height:46px}
#card .primary{background:var(--note);color:#1a1a1a;border:none;font-weight:700}
#card .ghost{background:transparent;color:var(--ink);border:1px solid rgba(230,236,244,.4)}
#card .primary:hover{background:#fff6d8}
#card .ghost:hover{background:rgba(255,255,255,.08)}
#card .endTitle{font-family:'Press Start 2P',monospace;font-size:18px;line-height:1.7;margin:10px 0}
#card .epilogue{font-size:16px;line-height:2;color:var(--ink);text-align:left;white-space:pre-line;background:rgba(255,255,255,.04);border-left:3px solid rgba(247,240,214,.5);padding:12px 14px;border-radius:0 6px 6px 0}
#card .stats{font-size:14px;color:var(--dim);margin-top:12px;line-height:1.8}
#gallery{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
#gallery span{font-size:13px;padding:5px 12px;border-radius:20px;border:1px solid rgba(230,236,244,.3);color:var(--dim)}
#gallery span.on{color:#1a1a1a;background:var(--note);border-color:var(--note)}
#tpad{position:absolute;left:10px;bottom:10px;display:none;z-index:7;flex-direction:column;gap:5px}
#tpad .row{display:flex;gap:5px;justify-content:center}
#tpad button{width:54px;height:54px;font-size:18px;color:var(--ink);background:rgba(46,61,74,.5);border:1px solid rgba(230,236,244,.3);border-radius:10px;touch-action:none}
#actWrap{position:absolute;right:14px;bottom:14px;display:none;z-index:7}
#actWrap button{width:76px;height:76px;font-size:15px;color:var(--ink);background:rgba(46,61,74,.55);border:1px solid rgba(230,236,244,.35);border-radius:50%;touch-action:none}
@media (pointer:coarse){#tpad,#actWrap{display:flex}}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 130px rgba(0,0,0,.55)}
#redv{position:absolute;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 100px rgba(176,58,46,.6);opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="640" height="480"></canvas>
  <div class="scan"></div>
  <div id="vignette"></div>
  <div id="redv"></div>
  <div id="hud"><span id="hearts"></span><span id="notes"></span></div>
  <div id="hint"></div>
  <div id="dlg">
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="choices"></div>
    <div id="dlgHint">E / 点击 继续</div>
  </div>
  <div id="panel"><div id="card"></div></div>
  <div id="tpad">
    <div class="row"><button data-d="up">▲</button></div>
    <div class="row"><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div>
  </div>
  <div id="actWrap"><button id="actBtn">互动</button></div>
</div>

function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function rnd(a,b){return a+Math.random()*(b-a);}
function noise(x,y){var n=(x*73856093^y*19349663)>>>0;return (n%1000)/1000;}

var PAL={W:'#f2f5f8',w:'#c3ccd8',g:'#8a96a6',d:'#39414f',k:'#14171d',R:'#b03a2e',r:'#e05548',Y:'#f7d774',y:'#fbeaa5',B:'#2b3a4a',b:'#44586c',G:'#2e5d43',g2:'#4d8a5f',O:'#d98a3d',o:'#f0b27a',P:'#6d4b8a',p:'#c9a7e0',M:'#10151f',m:'#2c3e50',N:'#0a1524',n:'#1e3a52',E:'#cfe0ee',e:'#eef4fa',C:'#7f8c8d',c:'#b8c1c9',F:'#5d4037',f:'#8d6e63',L:'#aab7c4',l:'#d6dee6',T:'#1d2733',t:'#37424f'};

function drawPix(p,x,y,opt){
  opt=opt||{};var al=(opt.alpha!=null)?opt.alpha:1,s=opt.scale||1;
  ctx.save();ctx.globalAlpha=al;
  for(var j=0;j<p.h;j++){var row=p.rows[j];
    for(var i=0;i<row.length;i++){var ch=row[i];if(ch==='.'||ch===' ')continue;var c=p.pal[ch];if(!c)continue;
      ctx.fillStyle=c;ctx.fillRect(Math.round(x+i*s),Math.round(y+j*s),s,s);}}
  ctx.restore();
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function P(rows,pal){return {rows:rows,pal:pal||PAL,w:Math.max.apply(null,rows.map(function(r){return r.length;})),h:rows.length};}

/* ================= 瓦片缓存 ================= */
var TILES={};
function tileCanvas(ch){
  if(TILES[ch])return TILES[ch];
  var c=document.createElement('canvas');c.width=c.height=TILE;
  var g=c.getContext('2d');drawTile(g,ch);TILES[ch]=c;return c;
}
function speckle(g,base,cols,seed){
  g.fillStyle=base;g.fillRect(0,0,TILE,TILE);
  for(var i=0;i<cols;i++){
    var x=Math.floor(noise(seed*97+i*13,seed*31+i*7)*16);
    var y=Math.floor(noise(seed*53+i*17,seed*11+i*3)*16);
    g.fillStyle=(i%2)?'rgba(0,0,0,0.12)':'rgba(255,255,255,0.07)';
    g.fillRect(x,y,2,2);
  }
}
function drawTile(g,ch){
  switch(ch){
    case '.':speckle(g,'#24402e',10,1);break;
    case 'r':speckle(g,'#4c5561',8,2);break;
    case 'R':g.fillStyle='#55606e';g.fillRect(0,0,16,16);g.fillStyle='rgba(0,0,0,.14)';g.fillRect(0,7,16,2);g.fillRect(7,0,2,16);break;
    case '#':g.fillStyle='#3a4150';g.fillRect(0,0,16,16);g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,14,16,2);g.fillStyle='rgba(255,255,255,.06)';g.fillRect(0,0,16,1);g.fillRect(0,0,1,16);break;
    case 'A':g.fillStyle='#2b3a4a';g.fillRect(0,0,16,16);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,4,16,1);g.fillRect(0,8,16,1);g.fillRect(0,12,16,1);g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,0,16,1);break;
    case 'T':g.fillStyle='#24402e';g.fillRect(0,0,16,16);g.fillStyle='#5d4037';g.fillRect(6,9,4,7);g.fillStyle='#2e5d43';g.fillRect(2,2,12,9);g.fillStyle='#3a7250';g.fillRect(4,4,6,5);g.fillRect(9,2,3,3);break;
    case 'W':g.fillStyle='#16324a';g.fillRect(0,0,16,16);g.fillStyle='rgba(255,255,255,.10)';g.fillRect(2,5,10,1);g.fillRect(6,10,7,1);break;
    case 'F':g.fillStyle='#24402e';g.fillRect(0,0,16,16);g.fillStyle='#5d4037';g.fillRect(1,6,2,10);g.fillRect(13,6,2,10);g.fillStyle='#6d513f';g.fillRect(0,7,16,2);g.fillRect(0,11,16,2);break;
    case 'G':speckle(g,'#1f3a2c',8,3);g.fillStyle='#8a96a6';g.fillRect(3,5,10,11);g.fillStyle='#9aa6b6';g.fillRect(3,5,10,2);g.fillStyle='#5c6774';g.fillRect(6,8,4,2);g.fillRect(7,7,2,6);break;
    case 'P':g.fillStyle='#14171d';g.fillRect(0,4,16,12);g.fillStyle='#f2f5f8';g.fillRect(2,4,12,2);g.fillRect(2,6,12,1);g.fillRect(2,8,12,1);g.fillRect(2,10,12,1);break;
    case 'B':g.fillStyle='#39424f';g.fillRect(0,0,16,16);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,13,16,3);g.fillStyle='#4a5565';g.fillRect(3,2,10,4);g.fillRect(3,2,2,12);g.fillRect(11,2,2,12);break;
    case 'D':g.fillStyle='#39424f';g.fillRect(0,0,16,16);g.fillStyle='#0b1017';g.fillRect(4,4,8,12);g.fillStyle='rgba(255,255,255,.10)';g.fillRect(4,4,8,1);break;
    case 'L':speckle(g,'#24402e',8,4);g.fillStyle='#5d4037';g.fillRect(7,8,2,8);g.fillStyle='#f7d774';g.fillRect(5,4,6,6);g.fillStyle='rgba(247,215,116,.25)';g.fillRect(3,2,10,10);break;
    case 'S':speckle(g,'#1d3350',6,5);g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,14,16,2);break;
    default:speckle(g,'#24402e',8,9);
  }
}

/* ================= 地图构建 ================= */
function blank(w,h,ch){var m=[];for(var y=0;y<h;y++){var r=[];for(var x=0;x<w;x++)r.push(ch);m.push(r);}return m;}
function fill(m,x0,y0,x1,y1,ch){for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++)m[y][x]=ch;}
function stamp(m,rows,x0,y0){for(var dy=0;dy<rows.length;dy++){var r=rows[dy];for(var dx=0;dx<r.length;dx++){var c=r[dx];if(c===' ')continue;var yy=y0+dy,xx=x0+dx;if(yy>=0&&yy<m.length&&xx>=0&&xx<m[0].length)m[yy][xx]=c;}}}
function isSolid(ch){return ch==='#'||ch==='T'||ch==='W'||ch==='G'||ch==='P'||ch==='D'||ch==='B'||ch==='F';}

function keyDown(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')KEY.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')KEY.right=true;
  if(e.code==='ArrowUp'||e.code==='KeyW')KEY.up=true;
  if(e.code==='ArrowDown'||e.code==='KeyS')KEY.down=true;
  if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter'){e.preventDefault();primaryPress();}
  if(e.code==='Escape'||e.code==='KeyP'){if(GS.mode==='play')togglePause();else if(GS.mode==='pause')togglePause();}
}
function keyUp(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')KEY.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')KEY.right=false;
  if(e.code==='ArrowUp'||e.code==='KeyW')KEY.up=false;
  if(e.code==='ArrowDown'||e.code==='KeyS')KEY.down=false;
}
window.addEventListener('keydown',keyDown);
window.addEventListener('keyup',keyUp);

});

/* ================= 对话系统 ================= */
function startDialog(lines,onDone){
  DIALOG={lines:lines,idx:0,typing:true,ch:'',timer:0,onDone:onDone||null,choices:false};
  $('dlg').style.display='block';
  $('choices').innerHTML='';
  var sp=lines[0][0];
  $('dlgName').textContent=sp||'';
  typeLine(lines[0][1]);
}
function typeLine(txt){
  DIALOG.txt=txt;DIALOG.ch='';DIALOG.typing=true;DIALOG.timer=0;
  $('dlgText').textContent='';
}
function advanceDialog(){
  if(!DIALOG)return;
  if(DIALOG.choices)return;
  if(DIALOG.typing){DIALOG.typing=false;$('dlgText').textContent=DIALOG.txt;return;}
  DIALOG.idx++;
  if(DIALOG.idx>=DIALOG.lines.length){
    var cb=DIALOG.onDone;DIALOG=null;
    $('dlg').style.display='none';$('choices').innerHTML='';
    if(cb)cb();
    return;
  }
  var sp=DIALOG.lines[DIALOG.idx][0];
  $('dlgName').textContent=sp||'';
  typeLine(DIALOG.lines[DIALOG.idx][1]);
}
function showChoices(opts,onPick){
  if(!DIALOG){return;}
  DIALOG.choices=true;
  $('dlgHint').textContent='';
  var box=$('choices');box.innerHTML='';
  opts.forEach(function(o,i){
    var b=document.createElement('button');
    b.textContent=o;
    b.onclick=function(){box.innerHTML='';DIALOG.choices=false;$('dlgHint').textContent='E / 点击 继续';onPick(i);};
    box.appendChild(b);
  });
}
function primaryPress(){
  if(GS.mode==='title'||GS.mode==='pause'||GS.mode==='ending')return;
  if(DIALOG){advanceDialog();return;}
  if(GS.mode==='boss'){tryAttack();return;}
  if(GS.mode==='play'){tryInteract();return;}
}

/* ================= 场景切换 ================= */
function switchScene(to,sx,sy){
  GS.scene=to;
  var sc=SCENES[to];
  GS.px=sx*TILE+TILE/2;GS.py=sy*TILE+TILE/2;
  GS.dir=0;
  resetSceneEnemies();
  setHUD();
  if(to==='tower'&&GS.notes>=6&&!GS.flags.towerTalk)setTimeout(function(){towerTalk();},400);
}

function tryInteract(){
  var sc=SCENES[GS.scene];
  var nearest=null,bd=30;
  sc.inter.forEach(function(it){
    var d=dist(GS.px,GS.py,it.x*TILE+8,it.y*TILE+8);
    if(d<bd){bd=d;nearest=it;}
  });
  if(nearest){nearest.fn();return;}
  sc.npcs.forEach(function(n){
    var d=dist(GS.px,GS.py,n.x*TILE+8,n.y*TILE+8);
    if(d<bd){bd=d;npcTalk(n);}
  });
}

/* ================= 粒子 / 耳语 ================= */
function burst(x,y,n,type){
  for(var i=0;i<n;i++){
    PARTICLES.push({x:x,y:y,vx:rnd(-40,40),vy:rnd(-70,-10),life:rnd(0.5,1.2),max:1.2,type:type||'note'});
  }
}
function spawnWhisper(){
  var lines=['别回头……','琴声……停了……','雾里有东西……','她还在弹……','别捡那些音符……','荒大人……对不起了……','好冷……','不要相信铃……'];
  WHISPERS.push({x:GS.px+rnd(-120,120),y:GS.py+rnd(-80,20),txt:lines[Math.floor(Math.random()*lines.length)],life:2.6,max:2.6});

/* ================= 敌人 AI ================= */
function updateEnemies(dt){
  var sc=SCENES[GS.scene];
  sc.enemies.forEach(function(e){
    var d=dist(GS.px,GS.py,e.x,e.y);
    var sp=34+(GS.notes*3);
    if(d<170){
      var ang=Math.atan2(GS.py-e.y,GS.px-e.x);
      e.vx=Math.cos(ang)*sp;e.vy=Math.sin(ang)*sp;
    }else{
      if(Math.random()<0.02){e.vx=rnd(-20,20);e.vy=rnd(-20,20);}
      if(Math.random()<0.01){e.vx=0;e.vy=0;}
    }
    var nx=e.x+e.vx*dt,ny=e.y+e.vy*dt;
    if(!solidAt(nx,e.y))e.x=nx;
    if(!solidAt(e.x,ny))e.y=ny;
    e.x=clamp(e.x,TILE,TILE*(sc.m[0].length-1));e.y=clamp(e.y,TILE,TILE*(sc.m.length-1));
    if(d<14&&GS.iframes<=0)damagePlayer();
  });
}
function damagePlayer(){
  GS.hp--;GS.iframes=1.6;GS.shake=10;GS.flash=1;
  $('redv').style.opacity='1';
  setTimeout(function(){$('redv').style.opacity='0';},350);
  if(GS.hp<=0){
    GS.mode='dead';GS.paused=false;
    setTimeout(function(){deathScreen();},600);
  }else{
    setHUD();
  }
}

/* ================= 碰撞 ================= */
function solidAt(x,y){
  var sc=SCENES[GS.scene],m=sc.m;
  var tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  if(tx<0||ty<0||tx>=m[0].length||ty>=m.length)return true;
  return isSolid(m[ty][tx]);
}
function movePlayer(dx,dy){
  var k=(GS.iframes>0)?0.8:1;
  var nx=GS.px+dx*k,ny=GS.py+dy*k;
  var hw=3,hh=2;
  if(!solidAt(nx-hw,GS.py-hh)&&!solidAt(nx+hw,GS.py-hh)&&!solidAt(nx-hw,GS.py+6)&&!solidAt(nx+hw,GS.py+6))GS.px=nx;
  if(!solidAt(GS.px-hw,ny-hh)&&!solidAt(GS.px+hw,ny-hh)&&!solidAt(GS.px-hw,ny+6)&&!solidAt(GS.px+hw,ny+6))GS.py=ny;
  GS.px=clamp(GS.px,TILE,TILE*(SCENES[GS.scene].m[0].length-1)-1);
  GS.py=clamp(GS.py,TILE,TILE*(SCENES[GS.scene].m.length-1)-1);
}

/* ================= 主更新 ================= */
function updatePlay(dt){
  GS.runTime=(Date.now()-GS.startTime)/1000;
  if(GS.iframes>0)GS.iframes-=dt;
  if(GS.shake>0)GS.shake=Math.max(0,GS.shake-dt*30);
  if(GS.flash>0)GS.flash=Math.max(0,GS.flash-dt*2.5);
  var dx=(KEY.right||TOUCH.right?1:0)-(KEY.left||TOUCH.left?1:0);
  var dy=(KEY.down||TOUCH.down?1:0)-(KEY.up||TOUCH.up?1:0);
  if(dx||dy){
    var len=Math.sqrt(dx*dx+dy*dy);
    movePlayer(dx/len*92*dt,dy/len*92*dt);
    if(dx<0)GS.dir=2;else if(dx>0)GS.dir=3;
    if(dy<0)GS.dir=0;else if(dy>0)GS.dir=1;
    GS.walk=(GS.walk+dt*7)%2;
  }
  var inBoss=GS.scene==='tower'&&BOSS;
  if(!inBoss){
    var sc=SCENES[GS.scene];
    sc.exits.forEach(function(ex){
      var tx=Math.floor(GS.px/TILE),ty=Math.floor((GS.py+4)/TILE);
      if(tx===ex.tx&&ty===ex.ty){switchScene(ex.to,ex.sx,ex.sy);}
    });
  }
  if(!inBoss){
    GS.whisperTimer-=dt;
    if(GS.whisperTimer<=0){GS.whisperTimer=rnd(3,6);if(Math.random()<0.6)spawnWhisper();}
    updateEnemies(dt);
  }
  updateParticles(dt);
  updateWhispers(dt);
  updateFog(dt);
}
function updateBoss(dt){
  updatePlay(dt);
  if(!BOSS||BOSS.state==='dead'||BOSS.state==='talk')return;
  var b=BOSS;
  b.t-=dt;
  if(b.flash>0)b.flash=Math.max(0,b.flash-dt*4);
  if(b.state==='idle'){
    if(b.t<=0){
      b.state='telegraph';b.t=0.7;
    }
  }else if(b.state==='telegraph'){
    b.dir=(GS.px<b.x)?-1:1;
    if(b.t<=0){b.state='lunge';b.t=0.55;b.lvx=b.dir*240;b.lvy=0;}
  }else if(b.state==='lunge'){
    var nx=b.x+b.lvx*dt,ny=b.y+b.lvy*dt;
    if(!solidAt(nx,b.y))b.x=nx;
    if(!solidAt(b.x,ny))b.y=ny;
    if(dist(GS.px,GS.py,b.x,b.y)<16&&GS.iframes<=0){damagePlayer();}
    b.t-=dt;
    if(b.t<=0){
      b.state='recover';b.t=1.4;b.cycle++;
      if(b.cycle%2===0&&b.minions.length<2){
        b.minions.push({x:b.x+rnd(-60,60),y:b.y+rnd(-30,60),vx:0,vy:0});
      }
    }
  }else if(b.state==='recover'){
    if(b.t<=0){b.state='idle';b.t=rnd(0.9,1.3);}
  }else if(b.state==='stagger'){
    if(b.t<=0){b.state='idle';b.t=rnd(1.1,1.5);}
  }
  // 荒的小弟（雾影）
  b.minions.forEach(function(mn){
    var d=dist(GS.px,GS.py,mn.x,mn.y);
    var ang=Math.atan2(GS.py-mn.y,GS.px-mn.x);
    mn.vx=Math.cos(ang)*40;mn.vy=Math.sin(ang)*40;
    var nx=mn.x+mn.vx*dt,ny=mn.y+mn.vy*dt;
    if(!solidAt(nx,mn.y))mn.x=nx;
    if(!solidAt(mn.x,ny))mn.y=ny;
    if(d<14&&GS.iframes<=0)damagePlayer();
  });
}
function updateFog(dt){
  FOG_ALPHA+=(FOG_TARGET-FOG_ALPHA)*dt*0.6;
}
function updateParticles(dt){
  PARTICLES.forEach(function(p){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.life-=dt;
  });
  PARTICLES=PARTICLES.filter(function(p){return p.life>0;});
}
function updateWhispers(dt){
  WHISPERS.forEach(function(w){w.y-=12*dt;w.life-=dt;});
  WHISPERS=WHISPERS.filter(function(w){return w.life>0;});
}

/* ================= 渲染 ================= */
var fogCanvas=document.createElement('canvas');fogCanvas.width=VW;fogCanvas.height=VH;
var fogCtx=fogCanvas.getContext('2d');
var cam={x:0,y:0};
function render(){
  ctx.save();
  ctx.fillStyle='#0d1420';ctx.fillRect(0,0,VW,VH);
  if(GS.shake>0){ctx.translate(rnd(-GS.shake,GS.shake),rnd(-GS.shake,GS.shake));}
  var sc=SCENES[GS.scene];
  cam.x=clamp(GS.px-VW/2,0,Math.max(0,sc.m[0].length*TILE-VW));
  cam.y=clamp(GS.py-VH/2,0,Math.max(0,sc.m.length*TILE-VH));
  if(sc.m[0].length*TILE<VW)cam.x=(sc.m[0].length*TILE-VW)/2;
  if(sc.m.length*TILE<VH)cam.y=(sc.m.length*TILE-VH)/2;
  var x0=Math.max(0,Math.floor(cam.x/TILE)),y0=Math.max(0,Math.floor(cam.y/TILE));
  var x1=Math.min(sc.m[0].length-1,Math.ceil((cam.x+VW)/TILE)),y1=Math.min(sc.m.length-1,Math.ceil((cam.y+VH)/TILE));
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){
    ctx.drawImage(tileCanvas(sc.m[ty][tx]),tx*TILE-cam.x,ty*TILE-cam.y);
  }
  // 铃（开场引导，门附近）
  if(GS.scene==='gate'&&GS.notes===0&&!GS.flags.lingGone){
    var lx=20*TILE+8-cam.x,ly=16*TILE+8-cam.y;
    drawPix(SPR.ling,lx-5,ly-14,{alpha:0.85});
    circ(lx,ly-18,2,'#f7f0d6');
  }
  // 实体（按 y 排序）
  var ents=[];
  sc.npcs.forEach(function(n){ents.push({y:n.y*TILE+8,draw:function(){drawNPC(n);}});});
  sc.enemies.forEach(function(e){ents.push({y:e.y,draw:function(){drawShadow(e);}});});
  if(BOSS&&GS.scene==='tower'&&BOSS.state!=='dead'){ents.push({y:BOSS.y,draw:function(){drawBoss();}});}
  if(BOSS&&BOSS.minions&&BOSS.minions.length){BOSS.minions.forEach(function(mn){ents.push({y:mn.y,draw:function(){drawShadow({x:mn.x,y:mn.y});}});});}
  sc.notes.forEach(function(n){if(!GS.notesGot[n.id])ents.push({y:n.y*TILE,draw:function(){drawNote(n);}});});
  ents.push({y:GS.py,draw:function(){drawPlayer();}});
  ents.sort(function(a,b){return a.y-b.y;});
  ents.forEach(function(e){e.draw();});
  // 白雾
  drawFog();
  // 飘雾团
  drawDrift();
  // 耳语
  WHISPERS.forEach(function(w){
    var a=Math.max(0,w.life/w.max);
    ctx.fillStyle='rgba(220,228,240,'+(a*0.5)+')';
    ctx.font='12px "ZCOOL KuaiLe",sans-serif';
    ctx.fillText(w.txt,w.x-cam.x,w.y-cam.y);
  });
  ctx.restore();
  if(GS.flash>0){
    ctx.fillStyle='rgba(255,255,255,'+(GS.flash*0.35)+')';
    ctx.fillRect(0,0,VW,VH);
  }
}
function drawPlayer(){
  var spr=GS.dir===0?SPR.playerB:(GS.dir===1?SPR.playerF:(GS.dir===2?SPR.playerL:SPR.playerR));
  var bob=GS.walk<1?0:1;
  var px=Math.round(GS.px-cam.x),py=Math.round(GS.py-cam.y);
  var al=GS.iframes>0?(0.4+0.3*Math.sin(GS.iframes*20)):1;
  drawPix(spr,px-6,py-16+bob,{alpha:al});
}
function drawNPC(n){
  var t=Date.now()/1000;
  var al=0.68+0.12*Math.sin(t*3+n.x);
  var offx=(n.id==='huang')?10:6;
  drawPix(n.sp,n.x*TILE+8-offx-cam.x,n.y*TILE+8-16-cam.y+Math.sin(t*2+n.x)*1.5,{alpha:al});
  if(n.id==='huang'){drawBossStand(n);}
}
function drawBossStand(n){
  var sx=n.x*TILE+8-cam.x,sy=n.y*TILE+8-cam.y;
  ctx.fillStyle='rgba(176,58,46,0.8)';
  ctx.fillRect(sx-1,sy-20,2,8);
}
function drawShadow(e){
  var t=Date.now()/1000;
  var al=0.55+0.25*Math.sin(t*5+e.x);
  drawPix(SPR.shadow,e.x-7-cam.x,e.y-13-cam.y+Math.sin(t*4+e.x)*1.2,{alpha:al});
}
function drawBoss(){
  var b=BOSS;
  var t=Date.now()/1000;
  var spr=(b.state==='lunge'||b.state==='telegraph')?SPR.huangLunge:SPR.huang;
  var x=b.x-cam.x,y=b.y-cam.y;
  var fl=(b.state==='telegraph')?(0.6+0.4*Math.sin(t*18)):1;
  ctx.save();
  if(b.state==='stagger'||b.state==='recover')ctx.translate(rnd(-1.5,1.5),rnd(-1.5,1.5));
  // 剑
  ctx.save();
  ctx.translate(x+8*b.dir,y+4);
  ctx.rotate(b.dir*0.5+Math.sin(t*2)*0.06);
  drawPix(SPR.sword,-2,-2,{alpha:fl});
  ctx.restore();
  drawPix(spr,x-10,y-24,{alpha:fl});
  ctx.restore();
  // 血条
  if(b.state!=='dead'&&b.state!=='talk'){
    ctx.fillStyle='rgba(10,16,24,0.7)';ctx.fillRect(x-26,y-32,52,6);
    ctx.fillStyle='#b03a2e';ctx.fillRect(x-25,y-31,50*(b.hp/5),4);
  }
  if(b.state==='recover'){
    ctx.fillStyle='rgba(247,240,214,'+(0.4+0.4*Math.sin(t*10))+')';
    ctx.fillRect(x-14,y-40,28,2);
  }
}
function drawNote(n){
  var t=Date.now()/1000;
  var x=n.x*TILE+8-cam.x,y=n.y*TILE+8-cam.y;
  var bob=Math.sin(t*2.2+n.id)*2;
  var glow=0.5+0.3*Math.sin(t*3+n.id);
  ctx.fillStyle='rgba(247,240,214,'+glow+')';
  ctx.beginPath();ctx.arc(x,y-8+bob,10,0,6.2832);ctx.fill();
  drawPix(SPR.note,x-4,y-12+bob);
}
function drawFog(){
  fogCtx.clearRect(0,0,VW,VH);
  var flick=FOG_ALPHA+(Math.sin(Date.now()/900)*0.02);
  fogCtx.fillStyle='rgba(232,238,246,'+clamp(flick,0.85,1)+')';
  fogCtx.fillRect(0,0,VW,VH);
  fogCtx.globalCompositeOperation='destination-out';
  var grd=fogCtx.createRadialGradient(GS.px-cam.x,GS.py-cam.y,10,GS.px-cam.x,GS.py-cam.y,105);
  grd.addColorStop(0,'rgba(0,0,0,1)');grd.addColorStop(1,'rgba(0,0,0,0)');
  fogCtx.fillStyle=grd;fogCtx.fillRect(0,0,VW,VH);
  var sc=SCENES[GS.scene];
  sc.notes.forEach(function(n){
    if(GS.notesGot[n.id])return;
    var x=n.x*TILE+8-cam.x,y=n.y*TILE+8-cam.y;
    var g2=fogCtx.createRadialGradient(x,y-8,4,x,y-8,34);
    g2.addColorStop(0,'rgba(0,0,0,0.9)');g2.addColorStop(1,'rgba(0,0,0,0)');
    fogCtx.fillStyle=g2;fogCtx.fillRect(x-40,y-48,80,80);
  });
  sc.npcs.forEach(function(n){
    var x=n.x*TILE+8-cam.x,y=n.y*TILE+8-cam.y;
    var g3=fogCtx.createRadialGradient(x,y,4,x,y,30);
    g3.addColorStop(0,'rgba(0,0,0,0.7)');g3.addColorStop(1,'rgba(0,0,0,0)');
    fogCtx.fillStyle=g3;fogCtx.fillRect(x-40,y-40,80,80);
  });
  sc.inter.forEach(function(it){
    if(it.label.indexOf('拾起')<0)return;
    var x=it.x*TILE+8-cam.x,y=it.y*TILE+8-cam.y;
    var g4=fogCtx.createRadialGradient(x,y-6,4,x,y-6,26);
    g4.addColorStop(0,'rgba(0,0,0,0.8)');g4.addColorStop(1,'rgba(0,0,0,0)');
    fogCtx.fillStyle=g4;fogCtx.fillRect(x-34,y-40,68,68);
  });
  fogCtx.globalCompositeOperation='source-over';
  ctx.drawImage(fogCanvas,0,0);
}
var drift=[];
function initDrift(){for(var i=0;i<5;i++)drift.push({x:rnd(0,VW),y:rnd(0,VH),r:rnd(30,70),vx:rnd(3,8),vy:rnd(-2,2)});}
function drawDrift(){
  drift.forEach(function(d){
    d.x+=d.vx*0.016;d.y+=d.vy*0.016;
    if(d.x>VW+80)d.x=-80;if(d.x<-80)d.x=VW+80;
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.2832);ctx.fill();
  });
}

/* ================= 暂停 ================= */
function togglePause(){
  if(GS.mode==='play'){GS.mode='pause';GS.paused=true;pauseScreen();}
  else if(GS.mode==='pause'){hidePanel();GS.mode='play';GS.paused=false;}
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&(GS.mode==='play'||GS.mode==='boss')){GS.mode='pause';GS.paused=true;pauseScreen();}
});

/* ================= 主循环 / 启动 ================= */
function frame(t){
  raf=requestAnimationFrame(frame);
  var dt=Math.min((t-lastT)/1000||0.016,0.05);lastT=t;
  if(!GS.paused){
    if(GS.mode==='play')updatePlay(dt);
    else if(GS.mode==='boss')updateBoss(dt);
    else if(GS.mode==='ending'){updateFog(dt);updateParticles(dt);updateWhispers(dt);}
  }
  if(DIALOG&&DIALOG.typing){
    DIALOG.timer+=dt;
    var n=Math.min(DIALOG.txt.length,Math.floor(DIALOG.timer/0.045));
    DIALOG.ch=DIALOG.txt.slice(0,n);
    $('dlgText').textContent=DIALOG.ch;
    if(n>=DIALOG.txt.length)DIALOG.typing=false;
  }
  render();
}
function boot(){
  buildScenes();
  initDrift();
  lastT=performance.now();
  raf=requestAnimationFrame(frame);
  titleScreen();
}
boot();
</script>
