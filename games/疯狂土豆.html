<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="疯狂土豆——60秒土豆田打地鼠小游戏，拍土豆攒连击，小心虫土豆！">
<meta name="theme-color" content="#5A3A22">
<title>疯狂土豆 · 打土豆小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cellipse cx='60' cy='62' rx='44' ry='35' fill='%23D9A05B' stroke='%235A3A22' stroke-width='5'/%3E%3Ccircle cx='46' cy='58' r='6' fill='%233B2A1A'/%3E%3Ccircle cx='74' cy='58' r='6' fill='%233B2A1A'/%3E%3Cpath d='M50 72 Q60 82 70 72' fill='none' stroke='%235A3A22' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ===== 设计 token ===== */
:root{
  --cream:#F6EBD3;
  --cream-2:#EFDFBC;
  --soil:#6B4423;
  --soil-mid:#8A5A32;
  --soil-deep:#4A2E17;
  --soil-dark:#2E1C0E;
  --pot:#D9A05B;
  --pot-dark:#B97A3E;
  --gold:#F2C14E;
  --gold-deep:#D99A2B;
  --bug:#A3AF64;
  --accent:#E86A33;
  --accent-dark:#C9531F;
  --leaf:#6B8F4E;
  --ink:#3B2A1A;
  --white:#FFF9EF;
  --font-display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}

/* ===== 基础 ===== */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  color:var(--white);
  background-color:var(--soil-deep);
  background-image:
    linear-gradient(180deg, rgba(58,36,18,.42) 0%, rgba(58,36,18,.28) 45%, rgba(42,23,9,.55) 100%),
    url("https://aka.doubaocdn.com/s/ElaPa0gqiW");
  background-size:cover;
  background-position:center 28%;
  background-repeat:no-repeat;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

/* ===== 布局 ===== */
.app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  max-width:640px;
  margin:0 auto;
}

/* ===== 顶部品牌行 ===== */
.brand-row{
  width:100%;
  max-width:560px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:40px;height:40px;flex:none;filter:drop-shadow(0 3px 0 rgba(42,24,10,.45));}
.title{
  font-family:var(--font-display);
  font-size:clamp(26px,6.4vw,34px);
  line-height:1.1;
  color:var(--white);
  text-shadow:2px 3px 0 rgba(42,24,10,.65);
  letter-spacing:1px;
}
.pause-btn{
  width:46px;height:46px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#F6EBD3,#EFDFBC);
  border:3px solid var(--soil);
  border-radius:14px;
  color:var(--ink);
  cursor:pointer;
  box-shadow:0 4px 0 rgba(42,24,10,.4);
  transition:transform .08s ease, box-shadow .08s ease;
}
.pause-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(42,24,10,.4);}

/* ===== HUD ===== */
.hud{
  width:100%;
  max-width:560px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:stretch;
  gap:10px;
}
.hud-cell{
  background:linear-gradient(#F6EBD3,#EFDFBC);
  border:3px solid var(--soil);
  border-radius:16px;
  padding:8px 10px 7px;
  text-align:center;
  box-shadow:0 4px 0 rgba(42,24,10,.4), inset 0 2px 6px rgba(255,255,255,.5);
  color:var(--ink);
  min-width:0;
}
.hud-cell .label{
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--soil);
  opacity:.85;
}
.hud-cell .value{
  font-family:var(--font-display);
  font-size:clamp(22px,5.6vw,30px);
  line-height:1.15;
  white-space:nowrap;
}
.hud-cell.score .value{color:var(--accent-dark);}
.hud-cell.best .value{color:var(--soil);}
.timer-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:72px;height:72px;
  border-radius:50%;
  border:3px solid var(--soil);
  background:radial-gradient(circle at 35% 30%, #FFFDF6, #F0DFBC);
  box-shadow:0 4px 0 rgba(42,24,10,.4), inset 0 2px 6px rgba(255,255,255,.6);
  color:var(--ink);
  margin:auto;
}
.timer-cell .t-val{
  font-family:var(--font-display);
  font-size:26px;
  line-height:1;
}
.timer-cell .t-lab{font-size:11px;font-weight:700;letter-spacing:2px;opacity:.75;}
.timer-cell.urgent .t-val{color:var(--accent);animation:blink 1s steps(2) infinite;}

/* ===== 连击 ===== */
.combo{
  height:34px;
  font-family:var(--font-display);
  font-size:28px;
  color:#FFD66B;
  text-shadow:0 2px 0 rgba(42,24,10,.7);
  opacity:0;
  transform:scale(.7);
  transition:opacity .15s ease, transform .15s ease;
  letter-spacing:1px;
}
.combo.show{opacity:1;transform:scale(1);}
.combo.bump{animation:combobump .28s ease;}

/* ===== 土豆田 ===== */
.field-wrap{position:relative;width:100%;max-width:560px;}
.field{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:clamp(8px,2vw,14px);
  padding:clamp(14px,3vw,22px);
  background:linear-gradient(180deg,#8A5A32,#5E3D20);
  border:5px solid var(--soil-deep);
  border-radius:26px;
  box-shadow:0 10px 0 rgba(42,24,10,.45), inset 0 4px 10px rgba(0,0,0,.28);
}
.hole{
  position:relative;
  aspect-ratio:1/1;
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.hole-pit{
  position:absolute;
  inset:7%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 32%, #54351C 0%, #3A2412 58%, #2A1709 100%);
  box-shadow:inset 0 8px 16px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.07);
  z-index:0;
}
.potato{
  position:absolute;
  left:50%;
  bottom:14%;
  width:64%;
  z-index:1;
  transform:translate(-50%,112%) scale(.92);
  opacity:0;
  transition:transform .16s cubic-bezier(.28,1.35,.5,1), opacity .12s ease;
  will-change:transform;
  pointer-events:none;
}
.potato.is-up{transform:translate(-50%,0) scale(1);opacity:1;}
.potato.squash{transform:translate(-50%,0) scale(1.06,.4);opacity:0;transition:transform .16s ease, opacity .14s ease;}
.soil-lip{
  position:absolute;
  left:50%;
  bottom:-13%;
  width:132%;
  height:46%;
  transform:translateX(-50%);
  border-radius:50%;
  background:linear-gradient(#7A5230,#5A3A22 72%);
  box-shadow:inset 0 -5px 9px rgba(0,0,0,.32);
  z-index:2;
  pointer-events:none;
}

/* ===== 特效：土粒 / 飘字 ===== */
.dirt{
  position:absolute;
  left:50%;
  top:36%;
  width:11px;height:11px;
  border-radius:50%;
  background:#6B4423;
  z-index:3;
  pointer-events:none;
  opacity:0;
}
.dirt.fly{animation:dirtfly .5s ease-out forwards;}
@keyframes dirtfly{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.35);}
}
.floaty{
  position:absolute;
  left:50%;
  top:22%;
  z-index:4;
  transform:translateX(-50%);
  font-family:var(--font-display);
  font-size:22px;
  font-weight:700;
  color:var(--white);
  text-shadow:0 2px 0 rgba(42,24,10,.85);
  pointer-events:none;
  white-space:nowrap;
  animation:floatup .9s ease-out forwards;
}
.floaty.gold{color:#FFD66B;font-size:27px;}
.floaty.bad{color:#FF7A5C;font-size:24px;}
.floaty.miss{color:#E4D9BE;font-size:16px;font-family:var(--font-body);}
@keyframes floatup{
  0%{opacity:0;transform:translate(-50%,8px) scale(.55);}
  16%{opacity:1;transform:translate(-50%,-8px) scale(1.15);}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1);}
}

/* ===== 遮罩 / 面板 ===== */
.overlay{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(30,18,8,.55);
  -webkit-backdrop-filter:blur(5px);
  backdrop-filter:blur(5px);
  padding:20px;
}
.overlay.hidden{display:none;}
.panel{
  width:min(440px,94%);
  max-height:92dvh;
  overflow:auto;
  background:linear-gradient(#F6EBD3,#EFDFBC);
  border:6px solid var(--soil);
  border-radius:28px;
  color:var(--ink);
  padding:26px 24px 22px;
  text-align:center;
  box-shadow:0 18px 44px rgba(0,0,0,.4), inset 0 3px 10px rgba(255,255,255,.55);
}
.panel .p-title{
  font-family:var(--font-display);
  font-size:30px;
  color:var(--accent-dark);
  letter-spacing:2px;
  text-shadow:0 2px 0 rgba(255,255,255,.6);
}
.panel .p-sub{font-size:14px;color:var(--soil);margin-top:4px;}
.big-score{
  font-family:var(--font-display);
  font-size:54px;
  line-height:1.05;
  color:var(--ink);
  margin:12px 0 2px;
}
.big-score .unit{font-size:20px;color:var(--soil);margin-left:4px;}
.new-record{
  display:inline-block;
  margin-top:6px;
  padding:3px 12px;
  background:var(--accent);
  color:#fff;
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  border-radius:999px;
  animation:blink 1.1s steps(2) infinite;
}
.stats-row{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:14px 0 4px;
  flex-wrap:wrap;
}
.stat-chip{
  background:#fff8e6;
  border:2px solid var(--soil-mid);
  border-radius:12px;
  padding:6px 14px;
  font-size:13px;
  color:var(--soil);
  white-space:nowrap;
}
.stat-chip b{font-family:var(--font-display);font-size:19px;color:var(--accent-dark);}

/* ===== 图例 ===== */
.legend{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin:16px 0 6px;
  text-align:left;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff8e6;
  border:2px solid var(--soil-mid);
  border-radius:14px;
  padding:7px 12px;
  font-size:13.5px;
  line-height:1.45;
  color:var(--soil);
}
.legend-item .ico{width:38px;height:38px;flex:none;}
.legend-item b{color:var(--ink);}
.legend-item .pt{color:var(--accent-dark);font-weight:700;}
.legend-item .gt{color:#B57E12;font-weight:700;}
.legend-item .bt{color:#6E7A36;font-weight:700;}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:48px;
  padding:12px 28px;
  border:none;
  border-radius:16px;
  font-family:var(--font-display);
  font-size:20px;
  letter-spacing:2px;
  cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn-primary{
  background:linear-gradient(#F0844E,#E86A33);
  color:#fff;
  box-shadow:0 5px 0 var(--accent-dark), 0 8px 16px rgba(201,83,31,.35);
  text-shadow:0 1px 0 rgba(0,0,0,.15);
}
.btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-dark);}
.btn-ghost{
  background:#fff8e6;
  color:var(--soil);
  border:3px solid var(--soil-mid);
  box-shadow:0 4px 0 rgba(42,24,10,.35);
}
.btn-ghost:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(42,24,10,.35);}
.btn-row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

.hint{
  font-size:12px;
  color:rgba(255,249,239,.85);
  text-shadow:0 1px 0 rgba(42,24,10,.6);
  text-align:center;
  margin-top:2px;
}

@keyframes blink{50%{opacity:.35;}}
@keyframes combobump{40%{transform:scale(1.35);}}
@media (prefers-reduced-motion:reduce){
  .potato,.dirt,.floaty,.combo,.timer-cell.urgent .t-val,.new-record{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>
<div class="app">

  <!-- 顶部：标题 + 暂停 -->
  <div class="brand-row">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="62" rx="46" ry="37" fill="#D9A05B" stroke="#4A2E17" stroke-width="6"/>
        <circle cx="45" cy="58" r="7" fill="#3B2A1A"/>
        <circle cx="75" cy="58" r="7" fill="#3B2A1A"/>
        <path d="M50 74 Q60 84 70 74" fill="none" stroke="#4A2E17" stroke-width="4.5" stroke-linecap="round"/>
        <ellipse cx="34" cy="42" rx="10" ry="6" fill="#FFF3DC" opacity=".55"/>
      </svg>
      <h1 class="title">疯狂土豆</h1>
    </div>
    <button id="pauseBtn" class="pause-btn" aria-label="暂停游戏">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>
        <rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-cell score">
      <div class="label">得分</div>
      <div class="value" id="scoreVal">0</div>
    </div>
    <div class="timer-cell" id="timerCell">
      <div class="t-val" id="timerVal">60</div>
      <div class="t-lab">秒</div>
    </div>
    <div class="hud-cell best">
      <div class="label">最高分</div>
      <div class="value" id="bestVal">0</div>
    </div>
  </div>

  <!-- 连击 -->
  <div class="combo" id="comboEl" aria-hidden="true">连击 ×1</div>

  <!-- 土豆田 -->
  <div class="field-wrap">
    <div class="field" id="field"></div>
  </div>

  <div class="hint">空格 / P 键暂停 · 手机直接拍土豆</div>
</div>

<!-- 开始 / 结束 / 暂停 共用遮罩 -->
<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<noscript><div style="padding:24px;text-align:center;color:#fff;font-size:16px;">本游戏需要启用 JavaScript 才能运行。</div></noscript>

      '<ellipse cx="60" cy="60" rx="45" ry="36" fill="url(#pSkin)" stroke="' + line + '" stroke-width="4"/>' +
      '<ellipse cx="40" cy="72" rx="5.5" ry="4" fill="#A9723C" opacity=".85"/>' +
      '<ellipse cx="79" cy="52" rx="4.5" ry="3.2" fill="#A9723C" opacity=".8"/>' +
      '<ellipse cx="72" cy="82" rx="3.6" ry="2.6" fill="#A9723C" opacity=".7"/>' +
      '<ellipse cx="34" cy="38" rx="10" ry="6.5" fill="#FFF3DC" opacity=".55"/>' +
      '<circle cx="46" cy="55" r="7.5" fill="#FFFDF6"/>' +
      '<circle cx="74" cy="55" r="7.5" fill="#FFFDF6"/>' +
      '<circle cx="48" cy="57" r="3.6" fill="#3B2A1A"/>' +
      '<circle cx="72" cy="57" r="3.6" fill="#3B2A1A"/>' +
      '<circle cx="37" cy="66" r="4.2" fill="#E8976B" opacity=".6"/>' +
      '<circle cx="83" cy="66" r="4.2" fill="#E8976B" opacity=".6"/>' +
      '<path d="M49 71 Q60 82 71 71" fill="none" stroke="' + line + '" stroke-width="3.6" stroke-linecap="round"/>' +
      '<path d="M14 72 Q60 112 106 72 L106 102 Q60 126 14 102 Z" fill="#8A5A32" stroke="' + line + '" stroke-width="3.5"/>' +
    '</svg>';
  }

  /* ===== 搭建土豆田 ===== */
  function buildField(){
    var i;
    for(i = 0; i < HOLE_COUNT; i++){
      (function(idx){
        var hole = document.createElement('div');
        hole.className = 'hole';

        var pit = document.createElement('div');
        pit.className = 'hole-pit';

        var potato = document.createElement('div');
        potato.className = 'potato';
        potato.innerHTML = potatoSVG('normal');

        var lip = document.createElement('div');
        lip.className = 'soil-lip';

        hole.appendChild(pit);
        hole.appendChild(potato);
        hole.appendChild(lip);

        hole.addEventListener('pointerdown', function(ev){
          ev.preventDefault();
          onTap(idx);
        });

        fieldEl.appendChild(hole);
        holes.push({ el:hole, potato:potato, type:null, expires:0, locked:false });
      })(i);
    }
  }

  /* ===== 难度曲线 ===== */
  function difficulty(){
    var t = state.elapsed;
    return {
      spawn: Math.max(560, 1280 - t * 11),
      stay: Math.max(680, 1500 - t * 13),
      maxUp: t < 18 ? 1 : (t < 38 ? 2 : 3)
    };
  }

  /* ===== 生成土豆 ===== */
  function spawn(){
    var d = difficulty();
    var idle = [];
    var i, r, type, stay;
    for(i = 0; i < holes.length; i++){
      if(!holes[i].type) idle.push(i);
    }
    if(idle.length === 0) return;

    var pick = idle[Math.floor(Math.random() * idle.length)];
    if(idle.length > 1 && pick === state.lastHole){
      pick = idle[(idle.indexOf(pick) + 1 + Math.floor(Math.random() * (idle.length - 1))) % idle.length];
    }
    state.lastHole = pick;

    r = Math.random();
    if(r < 0.12){ type = 'gold'; }
    else if(r < 0.3){ type = 'bug'; }
    else { type = 'normal'; }

    stay = d.stay;
    if(type === 'gold') stay = stay * 0.55;

    var h = holes[pick];
    h.type = type;
    h.expires = performance.now() + stay;
    h.locked = false;
    h.potato.innerHTML = potatoSVG(type);
    h.potato.classList.remove('squash');
    h.potato.classList.add('is-up');
    puff(h);
  }

  /* ===== 土粒迸溅 ===== */
  function puff(h){
    var i, d;
    var dirs = [
      {dx:-46, dy:-34},{dx:46, dy:-34},{dx:-26, dy:-52},
      {dx:26, dy:-52},{dx:0, dy:-58}
    ];
    for(i = 0; i < dirs.length; i++){
      d = document.createElement('div');
      d.className = 'dirt fly';
      d.style.setProperty('--dx', dirs[i].dx + 'px');
      d.style.setProperty('--dy', dirs[i].dy + 'px');
      h.el.appendChild(d);
      (function(node){ setTimeout(function(){ node.remove(); }, 520); })(d);
    }
  }

  /* ===== 飘字 ===== */
  function floater(h, text, cls){
    var f = document.createElement('div');
    f.className = 'floaty' + (cls ? ' ' + cls : '');
    f.textContent = text;
    h.el.appendChild(f);
    (function(node){ setTimeout(function(){ node.remove(); }, 920); })(f);
  }

  /* ===== 拍打 ===== */
  function onTap(idx){
    var h = holes[idx];
    var gained, mult;
    if(!state.running || state.paused || state.over) return;

    if(!h.type || h.locked){
      if(state.combo >= 2){
        state.combo = 0;
        updateCombo();
        floater(h, '断连击', 'miss');
      }
      return;
    }

    h.locked = true;
    state.hits++;

    if(h.type === 'bug'){
      state.score = Math.max(0, state.score - 5);
      state.combo = 0;
      h.potato.classList.add('squash');
      floater(h, '-5', 'bad');
      puff(h);
      setTimeout(function(){ clearHole(h); }, 170);
      updateHUD();
      updateCombo();
      return;
    }

    state.combo++;
    if(state.combo > state.maxCombo) state.maxCombo = state.combo;
    mult = Math.min(state.combo, 20);
    gained = (h.type === 'gold' ? 5 : 1) * mult;
    state.score += gained;

    h.potato.classList.add('squash');
    floater(h, '+' + gained, h.type === 'gold' ? 'gold' : '');
    puff(h);
    setTimeout(function(){ clearHole(h); }, 170);
    updateHUD();
    updateCombo();
  }

  function clearHole(h){
    h.type = null;
    h.expires = 0;
    h.locked = false;
    h.potato.classList.remove('is-up');
  }

  /* ===== HUD 刷新 ===== */
  function updateHUD(){
    scoreVal.textContent = state.score;
    bestVal.textContent = state.best;
    var remain = Math.max(0, Math.ceil(ROUND_SEC - state.elapsed));
    timerVal.textContent = remain;
    timerCell.classList.toggle('urgent', remain <= 10);
  }

  function updateCombo(){
    if(state.combo >= 2){
      comboEl.textContent = '连击 ×' + state.combo;
      comboEl.classList.add('show');
      comboEl.classList.remove('bump');
      void comboEl.offsetWidth;
      comboEl.classList.add('bump');
    }else{
      comboEl.classList.remove('show');
    }
  }

  /* ===== 主循环 ===== */
  function tick(ts){
    if(!state.running || state.paused) return;
    var dt = ts - state.lastTs;
    state.lastTs = ts;
    state.elapsed += dt / 1000;

    updateHUD();

    var d = difficulty();
    var i, upCount = 0;
    for(i = 0; i < holes.length; i++){
      if(holes[i].type){
        upCount++;
        if(ts >= holes[i].expires && !holes[i].locked){
          clearHole(holes[i]);
          if(state.combo > 0){
            state.combo = 0;
            updateCombo();
          }
        }
      }
    }

    if(ts >= state.nextSpawn && upCount < d.maxUp){
      spawn();
      state.nextSpawn = ts + d.spawn * (0.8 + Math.random() * 0.4);
    }

    if(state.elapsed >= ROUND_SEC){
      endGame();
      return;
    }
    state.rafId = requestAnimationFrame(tick);
  }

  /* ===== 开始 / 结束 ===== */
  function resetAll(){
    state.score = 0;
    state.combo = 0;
    state.maxCombo = 0;
    state.hits = 0;
    state.elapsed = 0;
    state.over = false;
    state.paused = false;
    state.nextSpawn = 0;
    state.lastHole = -1;
    holes.forEach(function(h){
      h.type = null;
      h.expires = 0;
      h.locked = false;
      h.potato.classList.remove('is-up','squash');
    });
    comboEl.classList.remove('show');
    timerCell.classList.remove('urgent');
    updateHUD();
    updateCombo();
  }

  function startGame(){
    if(state.rafId) cancelAnimationFrame(state.rafId);
    readBest();
    resetAll();
    state.running = true;
    overlayEl.classList.add('hidden');
    state.lastTs = performance.now();
    state.nextSpawn = state.lastTs + 400;
    state.rafId = requestAnimationFrame(tick);
  }

  function endGame(){
    state.running = false;
    state.over = true;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    var isRecord = false;
    if(state.score > state.best){
      state.best = state.score;
      isRecord = true;
      try{ localStorage.setItem(SAVE_KEY, String(state.score)); }catch(e){}
      bestVal.textContent = state.best;
    }
    showOverlay('end', isRecord);
  }

  function readBest(){
    try{
      var v = parseInt(localStorage.getItem(SAVE_KEY), 10);
      state.best = isNaN(v) ? 0 : v;
    }catch(e){ state.best = 0; }
    bestVal.textContent = state.best;
  }

  /* ===== 遮罩内容 ===== */
  function legendIcon(type){
    return '<span class="ico">' + potatoSVG(type) + '</span>';
  }

  function showOverlay(mode, isRecord){
    var html = '';
    if(mode === 'start'){
      html =
        '<div class="p-title">疯狂土豆</div>' +
        '<div class="p-sub">60 秒土豆大作战，看看你能收多少！</div>' +
        '<div class="legend">' +
          '<div class="legend-item">' + legendIcon('normal') + '<div><b>普通土豆</b>：拍中得 <span class="pt">+1 ×连击</span></div></div>' +
          '<div class="legend-item">' + legendIcon('gold') + '<div><b>金土豆</b>：<span class="gt">+5 ×连击</span>，但溜得快</div></div>' +
          '<div class="legend-item">' + legendIcon('bug') + '<div><b>虫土豆</b>：<span class="bt">千万别拍！</span>拍了扣 5 分并断连击</div></div>' +
          '<div class="legend-item"><div style="width:38px;height:38px;flex:none"></div><div>拍空手或让土豆溜走，连击都会清零，手要稳！</div></div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" id="btnStart">开始挖土豆</button>' +
        '</div>';
    }else if(mode === 'end'){
      html =
        '<div class="p-title">本局结束</div>' +
        '<div class="p-sub">土豆田收成了 ' + state.hits + ' 次</div>' +
        '<div class="big-score">' + state.score + '<span class="unit">分</span></div>' +
        (isRecord ? '<div class="new-record">新纪录！</div>' : '') +
        '<div class="stats-row">' +
          '<span class="stat-chip">命中 <b>' + state.hits + '</b></span>' +
          '<span class="stat-chip">最高连击 <b>×' + state.maxCombo + '</b></span>' +
          '<span class="stat-chip">最高分 <b>' + state.best + '</b></span>' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" id="btnRestart">再来一局</button>' +
          '<button class="btn btn-ghost" id="btnClose">回主页</button>' +
        '</div>';
    }else{ /* paused */
      html =
        '<div class="p-title">已暂停</div>' +
        '<div class="p-sub">土豆们在地里等你</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" id="btnResume">继续</button>' +
        '</div>';
    }
    panelEl.innerHTML = html;
    overlayEl.classList.remove('hidden');

    var btnStart = document.getElementById('btnStart');
    var btnRestart = document.getElementById('btnRestart');
    var btnClose = document.getElementById('btnClose');
    var btnResume = document.getElementById('btnResume');
    if(btnStart) btnStart.addEventListener('click', startGame);
    if(btnRestart) btnRestart.addEventListener('click', startGame);
    if(btnResume) btnResume.addEventListener('click', function(){ togglePause(false); });
    if(btnClose) btnClose.addEventListener('click', function(){ showOverlay('start'); });
  }

  /* ===== 暂停 ===== */
  function togglePause(force){
    if(!state.running || state.over) return;
    var wantPause = (typeof force === 'boolean') ? force : !state.paused;

    if(wantPause){
      if(state.paused) return;
      state.paused = true;
      if(state.rafId) cancelAnimationFrame(state.rafId);
      showOverlay('paused');
    }else{
      if(!state.paused) return;
      state.paused = false;
      overlayEl.classList.add('hidden');
      state.lastTs = performance.now();
      state.rafId = requestAnimationFrame(tick);
    }
  }

  /* ===== 事件 ===== */
  pauseBtn.addEventListener('click', function(){ togglePause(); });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && state.running && !state.paused && !state.over){
      togglePause(true);
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.target !== document.body) return;
    if(e.code === 'Space' || e.code === 'KeyP'){
      e.preventDefault();
      if(state.running && !state.over) togglePause();
    }
    if(e.code === 'Enter' && !state.running){
      startGame();
    }
  });

  /* ===== 初始化 ===== */
  buildField();
  readBest();
  updateHUD();
  showOverlay('start');
})();
</script>
<script>
/* HanBer云坛 · 云坛一键登录（强制登录 + 存档按账号隔离） */
(function(){
  try{
    var qs = new URLSearchParams(location.search);
    var u = qs.get('yt_user');
    var logged = u && u !== 'guest';
    if(!logged){
      var ov = document.createElement('div');
      ov.id = 'yt-login-mask';
      ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:linear-gradient(160deg,#101828,#1a2a4a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;gap:14px;text-align:center;padding:20px';
      var t1 = document.createElement('div'); t1.style.cssText = 'font-size:40px'; t1.textContent = '🔒'; ov.appendChild(t1);
      var t2 = document.createElement('div'); t2.style.cssText = 'font-size:18px;font-weight:600'; t2.textContent = '此游戏需云坛一键登录'; ov.appendChild(t2);
      var t3 = document.createElement('div'); t3.style.cssText = 'font-size:13px;color:#9fb3d0;max-width:320px'; t3.textContent = '返回云坛登录后，进入「小程序」再点本游戏即可自动带账号游玩。'; ov.appendChild(t3);
      var btn = document.createElement('button');
      btn.textContent = '去登录';
      btn.style.cssText = 'margin-top:6px;padding:9px 22px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:14px;cursor:pointer';
      btn.onclick = function(){ try{ if(window.parent && window.parent.location){ window.parent.location.hash = '#/login'; } }catch(e){} };
      ov.appendChild(btn);
      document.body.appendChild(ov);
      return;
    }
    var el = document.createElement('div');
    el.id = 'yt-login-bar';
    el.style.cssText = 'position:fixed;top:8px;right:8px;z-index:99999;display:flex;align-items:center;gap:6px;background:rgba(10,14,26,.74);color:#fff;padding:5px 8px 5px 12px;border-radius:20px;font:12px/1 "PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.16);max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    var b1 = document.createElement('b'); b1.style.color = '#7cc4ff'; b1.textContent = String(u).replace(/[<>&]/g, '');
    var b2 = document.createElement('span'); b2.textContent = '✕'; b2.style.cssText = 'cursor:pointer;opacity:.65;margin-left:6px;font-size:11px';
    b2.title = '关闭';
    b2.onclick = function(){ var bar = document.getElementById('yt-login-bar'); if(bar) bar.remove(); };
    el.appendChild(document.createTextNode('👤 云坛登录：')); el.appendChild(b1); el.appendChild(b2);
    document.body.appendChild(el);
    window.YT_USER = u;
    window.YT_LOGGED = true;
    /* 存档按账号隔离：所有 localStorage 自动带账号前缀，旧档自动迁移 */
    var pre = '_yt_' + u + '_';
    var g = Storage.prototype.getItem, sw = Storage.prototype.setItem, r = Storage.prototype.removeItem;
    Storage.prototype.getItem = function(k){
      if(typeof k !== 'string' || k.indexOf(pre) === 0) return g.call(this, k);
      var scoped = g.call(this, pre + k);
      if(scoped !== null) return scoped;
      var legacy = g.call(this, k);
      if(legacy !== null){ try{ sw.call(this, pre + k, legacy); r.call(this, k); }catch(e){} }
      return legacy;
    };
    Storage.prototype.setItem = function(k, v){
      if(typeof k === 'string' && k.indexOf(pre) !== 0){ try{ sw.call(this, pre + k, v); }catch(e){} }
      else{ try{ sw.call(this, k, v); }catch(e){} }
    };
    Storage.prototype.removeItem = function(k){
      if(typeof k === 'string'){ r.call(this, pre + k); r.call(this, k); }
      else r.call(this, k);
    };
  }catch(e){}
})();
</script>
