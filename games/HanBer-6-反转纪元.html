<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0d12;color:#d8d4c8;font-family:"Courier New",Consolas,monospace}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0d12}
#cv{width:min(100vw,177vh);height:min(100vh,56.25vw);background:#000;display:block;border:1px solid #2a2f3a}
.layer{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:10}
.layer.on{display:flex}
#menu{flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,12,.82);z-index:50}
#menu h1{font-size:56px;letter-spacing:8px;color:#e8c56a;text-shadow:0 0 18px rgba(232,197,106,.5);font-weight:700;margin-bottom:6px}
#menu .sub{color:#9aa3b2;font-size:14px;letter-spacing:4px;margin-bottom:34px}
#menu .mk{width:300px;height:4px;background:linear-gradient(90deg,transparent,#e8c56a,transparent);margin-bottom:30px}
.mbtn{display:block;width:280px;padding:12px 0;margin:7px auto;background:#141a24;border:1px solid #3a4356;color:#cfd6e2;font-size:16px;font-family:inherit;cursor:pointer;text-align:center;letter-spacing:2px;transition:.15s}
.mbtn:hover{border-color:#e8c56a;color:#e8c56a;background:#1a2230}
.mbtn.dim{color:#7a8292}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:20;display:none}
#hud.on{display:block}
.bar{height:10px;background:#222a36;border:1px solid #39445a;position:relative;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(180deg,var(--c1),var(--c2));transition:width .2s}
.bar>u{position:absolute;inset:0;font-size:8px;line-height:10px;text-align:center;color:#e8e4d8;text-shadow:0 0 3px #000;font-style:normal}
#stats{position:absolute;top:10px;left:10px;width:300px;pointer-events:auto}
#stats .lbl{font-size:10px;color:#8a94a6;margin-top:4px}
#topinfo{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#topinfo .t1{font-size:14px;color:#e8c56a;letter-spacing:2px}
#topinfo .t2{font-size:10px;color:#8a94a6;margin-top:2px}
#minimap{position:absolute;top:10px;right:10px;border:1px solid #39445a;background:#0d1117;pointer-events:auto;width:220px;height:165px}
#actionbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.abtn{background:#141a24;border:1px solid #3a4356;color:#cfd6e2;padding:8px 14px;font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:1px}
.abtn:hover{border-color:#e8c56a;color:#e8c56a}
#prompt{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:rgba(20,26,36,.9);border:1px solid #e8c56a;color:#e8e4d8;padding:8px 16px;font-size:13px;letter-spacing:1px;pointer-events:none;display:none}
.panel{position:absolute;inset:0;background:rgba(6,9,14,.94);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 20px}
.panel.on{display:flex}
.panel h2{color:#e8c56a;letter-spacing:4px;font-size:26px;margin-bottom:18px}
.panel .close{position:absolute;top:14px;right:20px;color:#7a8292;cursor:pointer;font-size:22px;padding:4px 10px;border:1px solid #39445a}
.panel .close:hover{color:#e8c56a}
.list{width:760px;max-width:92vw;overflow-y:auto;flex:1;padding-right:8px}
.row{display:flex;justify-content:space-between;align-items:center;background:#121824;border:1px solid #2a3345;padding:9px 12px;margin:5px 0;cursor:pointer}
.row:hover{border-color:#e8c56a}
.row .nm{color:#e4dfd2;font-size:14px}
.row .ds{color:#8a94a6;font-size:11px;margin-left:12px;flex:1}
.row .qt{color:#e8c56a;font-size:13px;min-width:56px;text-align:right}
.row .bt{margin-left:10px;background:#1b2434;border:1px solid #3a4356;color:#cfd6e2;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px}
.row .bt:hover{border-color:#e8c56a;color:#e8c56a}
.gold{color:#e8c56a}
.hint{color:#6d7686;font-size:11px;margin-top:10px;text-align:center}
#dlog{position:absolute;bottom:0;left:0;width:100%;background:rgba(10,13,20,.95);border-top:2px solid #39445a;z-index:25;display:none;padding:14px 20px}
#dlog.on{display:block}
#dlog .dl{font-size:12px;color:#7a8292;letter-spacing:1px;margin-bottom:6px}
#dlog .dt{font-size:15px;color:#e8e4d8;line-height:1.5;min-height:44px;white-space:pre-wrap}
#dlog .dc{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
#dlog .dc button{background:#1b2434;border:1px solid #e8c56a;color:#e8c56a;padding:7px 18px;font-family:inherit;cursor:pointer;font-size:13px}
#dlog .dc button:hover{background:#e8c56a;color:#0a0d12}
#cbt{position:absolute;bottom:120px;right:10px;width:330px;background:rgba(14,18,26,.96);border:1px solid #7a4a2a;z-index:24;display:none;padding:12px}
#cbt.on{display:block}
#cbt h3{color:#e8a86a;letter-spacing:2px;font-size:14px;margin-bottom:8px}
#cbt .cb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#cbt .cb button{background:#1b2434;border:1px solid #7a5a3a;color:#e8cba8;padding:7px 14px;font-family:inherit;cursor:pointer;font-size:12px}
#cbt .cb button:hover{border-color:#e8c56a}
.cen{text-align:center;color:#8a94a6;font-size:12px;margin-top:30px}
.arch{width:820px;max-width:94vw;flex:1;overflow-y:auto;color:#c9c4b6;font-size:13px;line-height:1.7;padding-right:10px}
.arch h3{color:#e8c56a;font-size:16px;margin:16px 0 6px;letter-spacing:2px;border-bottom:1px solid #2a3345;padding-bottom:4px}
.arch p{margin:6px 0}
.arch .y{color:#e8a86a}
#toast{position:absolute;top:16%;left:50%;transform:translateX(-50%);background:rgba(14,18,26,.95);border:1px solid #e8c56a;color:#e8e4d8;padding:10px 22px;font-size:13px;letter-spacing:1px;z-index:60;display:none;max-width:70vw;text-align:center}
#help{position:absolute;bottom:10px;left:10px;color:#5d6675;font-size:10px;line-height:1.6;pointer-events:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2a3345}
::-webkit-scrollbar-track{background:#0d1117}
.cut{position:absolute;inset:0;background:rgba(2,4,8,.97);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center}
.cut.on{display:flex}
.cut .ct{color:#e8c56a;font-size:34px;letter-spacing:10px;text-shadow:0 0 24px rgba(232,197,106,.6);animation:pulse 2s infinite}
.cut .cs{color:#8a94a6;font-size:13px;letter-spacing:3px;margin-top:14px}
.cut .cn{color:#5d6675;font-size:11px;margin-top:30px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.toast-in{animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

/* ============ 世界生成与渲染 ============ */
'use strict';
function rng(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;}}
let G=null;
const MW=320, MH=240, TS=32;
function genWorld(seed){
  G.seed=seed; const rnd=rng(seed);

  const T0=T;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    let rg=regionOf(x,y), b;
    if(rg===R.UNION) b=(y<14)?T.SNOW:(rnd()<.35?T.PINE:T.GRASS);
    else if(rg===R.MARCHES) b=(rnd()<.4?T.FOREST:T.GRASS);
    else if(rg===R.DIXIE) b=(rnd()<.45?T.FOREST:T.GRASS);
    else if(rg===R.WASTE) b=(rnd()<.2?T.CRAG:T.DESERT);
    else if(rg===R.GOLDEN) b=(rnd()<.3?T.FOREST:T.GRASS);
    else b=(rnd()<.3?T.FOREST:(rnd()<.2?T.SWAMP:T.GRASS));
    G.tiles[y*MW+x]=b; G.reg[y*MW+x]=rg;
  }
  // 山脉带
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    let m=false;
    if(x>=58&&x<=70&&y>=38&&y<=182) m=true;            // 阿巴拉契亚
    if(x>=246&&x<=258&&y>=6&&y<=214) m=true;           // 落基山
    if(x>=176&&x<=180&&y>=96&&y<=120) m=true;          // 黑松脊
    if(m&&G.tiles[y*MW+x]!==T.WATER)G.tiles[y*MW+x]=T.MTN;
  }
  // 湖泊与海
  lake(94,8,7);lake(110,26,5);lake(78,33,3);lake(300,200,6);
  for(let x=0;x<MW;x++){G.tiles[(MH-1)*MW+x]=T.WATER;G.tiles[(MH-2)*MW+x]=T.WATER;}
  for(let y=0;y<MH;y++){G.tiles[y*MW+(MW-1)]=T.WATER;G.tiles[y*MW+(MW-2)]=T.WATER;}
  function lake(cx,cy,r){for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){if(x<0||y<0||x>=MW||y>=MH)continue;if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r)G.tiles[y*MW+x]=T.WATER;}}
  // 大河(密西西比)
  const RP=[[150,0],[151,16],[148,32],[153,48],[150,62],[156,76],[152,90],[158,104],[154,118],[160,132],[156,146],[163,160],[166,174],[168,186]];
  for(let i=0;i<RP.length-1;i++){
    let x0=RP[i][0],y0=RP[i][1],x1=RP[i+1][0],y1=RP[i+1][1];
    let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,guard=0;
    while(true){
      paint(x0,y0,3); paint(x0+1,y0,2); paint(x0,y0+1,2);
      if(x0===x1&&y0===y1)break;
      if(++guard>5000)break;
      let e2=2*err;
      if(e2>-dy&&x0!==x1){err-=dy;x0+=sx;}
      if(e2<dx&&y0!==y1){err+=dx;y0+=sy;}
    }
  }
  function paint(x,y,w){for(let dy=0;dy<w;dy++)for(let dx=0;dx<w;dx++){let X=x+dx-1,Y=y+dy-1;if(X<0||Y<0||X>=MW||Y>=MH)continue;if(rnd()<.85)G.tiles[Y*MW+X]=T.WATER;}}
  // 沿岸浅滩与沙地
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){

  function adjWater(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let X=x+dx,Y=y+dy;if(X<0||Y<0||X>=MW||Y>=MH)continue;if(G.tiles[Y*MW+X]===T.WATER)return true;}return false;}
  // 城镇与道路
  buildCities(rnd);
  buildRoads(rnd);
}
function regionOf(x,y){
  if(x>=306) return y<112?R.GOLDEN:R.MEXICO;
  if(x>=244) return R.WASTE;
  if(y<62) return R.UNION;
  if(y<96) return R.MARCHES;
  if(y<178) return R.DIXIE;
  return R.MEXICO;
}
function buildCities(rnd){
  G.cities=CITIES.map(c=>({id:c.id,n:c.n,r:c.r,x:c.x,y:c.y,d:c.d||'',dis:false,shops:[],npcs:[],depot:{x:c.x,y:c.y-2}}));
  for(const c of G.cities){
    const r=6;
    for(let y=c.y-r;y<=c.y+r;y++)for(let x=c.x-r;x<=c.x+r;x++){
      if(x<0||y<0||x>=MW||y>=MH)continue;
      const d=Math.sqrt((x-c.x)**2+(y-c.y)**2);
      if(d<=r&&G.tiles[y*MW+x]!==T.WATER)G.tiles[y*MW+x]=T.TOWN;
    }
    // 建筑环
    for(let k=0;k<16;k++){
      const a=k/16*Math.PI*2+ rnd()*.3, rr=3+rnd()*2.4;
      const bx=Math.round(c.x+Math.cos(a)*rr), by=Math.round(c.y+Math.sin(a)*rr);
      if(bx<0||by<0||bx>=MW||by>=MH)continue;
      if(G.tiles[by*MW+bx]===T.TOWN)G.tiles[by*MW+bx]=T.BLDG;
    }
    // 商店门脸
    for(let k=0;k<3;k++){
      const a=k/3*Math.PI*2+rnd()*.4, rr=3.6;
      const bx=Math.round(c.x+Math.cos(a)*rr), by=Math.round(c.y+Math.sin(a)*rr);
      if(bx<0||by<0||bx>=MW||by>=MH)continue;
      if(G.tiles[by*MW+bx]===T.BLDG||G.tiles[by*MW+bx]===T.TOWN){G.tiles[by*MW+bx]=T.BLDG;c.shops.push({x:bx,y:by,kind:k%3});}
    }
    // NPC站位
    const spots=[];
    for(let y=c.y-r;y<=c.y+r;y++)for(let x=c.x-r;x<=c.x+r;x++){
      if(x<0||y<0||x>=MW||y>=MH)continue;
      if(G.tiles[y*MW+x]===T.TOWN)spots.push({x,y});
    }
    shuffle(spots,rnd); c.spot=spots.slice(0,14);
  }
}
function shuffle(a,rnd){for(let i=a.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function buildRoads(rnd){
  const conns=[['boston','philadelphia'],['philadelphia','ironfalls'],['ironfalls','chicago'],['ironfalls','emberfalls'],['chicago','dustbowl'],['dustbowl','freeport'],['emberfalls','freeport'],['emberfalls','richmond'],['richmond','atlanta'],['atlanta','savannah'],['savannah','neworleans'],['richmond','savannah'],['dustbowl','denver'],['denver','saltgap'],['saltgap','sanfran'],['freeport','neworleans'],['dustbowl','neworleans'],['boston','ironfalls']];
  const m={};G.cities.forEach(c=>m[c.id]=c);
  for(const [a,b] of conns){
    let x0=m[a].x,y0=m[a].y,x1=m[b].x,y1=m[b].y;
    let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,guard=0;
    while(true){
      let X=x0,Y=y0;
      if(X>=0&&Y>=0&&X<MW&&Y<MH){
        const t=G.tiles[Y*MW+X];
        if(t===T.WATER||t===T.BRIDGE)G.tiles[Y*MW+X]=T.BRIDGE;
        else if(t!==T.BLDG)G.tiles[Y*MW+X]=T.ROAD;
      }
      if(x0===x1&&y0===y1)break;
      if(++guard>5000)break;
      let e2=2*err;
      if(e2>-dy&&x0!==x1){err-=dy;x0+=sx;}
      if(e2<dx&&y0!==y1){err+=dx;y0+=sy;}
    }
  }
}
/* ---------- 渲染 ---------- */
const tileCache={};
function getTileCanvas(t,x,y){
  const key=t*8+((x*7+y*13)%8);
  if(tileCache[key])return tileCache[key];
  const c=document.createElement('canvas');c.width=TS;c.height=TS;
  const g=c.getContext('2d');const rnd=rng(key*97+13);
  let base,edge;
  switch(t){
    case T.WATER:base='#1a3f5c';edge='#24567c';break;
    case T.SAND:base='#c8b078';edge='#d4bd88';break;
    case T.GRASS:base='#3e6b33';edge='#4a7a3d';break;
    case T.FOREST:base='#2c5a2e';edge='#2a5528';break;
    case T.PINE:base='#1e4236';edge='#17382e';break;
    case T.MTN:base='#5d5d68';edge='#6a6a76';break;
    case T.SNOW:base='#d9e3f0';edge='#c9d6e8';break;
    case T.DESERT:base='#b99a52';edge='#c8a95e';break;
    case T.SWAMP:base='#2f4a33';edge='#38573c';break;
    case T.TOWN:base='#6e6144';edge='#7a6c4c';break;
    case T.ROAD:base='#6f6a5a';edge='#7a7563';break;
    case T.BLDG:base='#4c4a55';edge='#5a5864';break;
    case T.BRIDGE:base='#7a5236';edge='#8a6040';break;
    case T.CRAG:base='#4e4e58';edge='#5c5c68';break;
    default:base='#333';edge='#444';
  }
  g.fillStyle=base;g.fillRect(0,0,TS,TS);
  g.fillStyle=edge;
  for(let i=0;i<4;i++){g.fillRect(Math.floor(rnd()*TS),Math.floor(rnd()*TS),3,3);}
  if(t===T.FOREST||t===T.PINE){
    for(let i=0;i<5;i++){let px=3+rnd()*(TS-8);g.fillRect(px,8,4,6);g.fillRect(px+1,4,2,4);}
  }
  if(t===T.CRAG){g.fillStyle='#6a6a76';g.fillRect(8,10,14,8);g.fillRect(4,16,20,6);}
  if(t===T.BLDG){g.fillStyle='#5f3a3a';g.fillRect(2,2,TS-4,8);g.fillStyle='#8a8a94';g.fillRect(TS/2-3,10,6,10);g.fillStyle='#c8b078';g.fillRect(4,10,6,6);}
  if(t===T.ROAD){g.fillStyle='#8a8370';for(let i=0;i<3;i++)g.fillRect(6+rnd()*20,14+rnd()*6,10,2);}
  if(t===T.BRIDGE){g.fillStyle='#5a3a26';g.fillRect(2,8,28,4);g.fillRect(6,4,3,8);g.fillRect(24,4,3,8);}
  tileCache[key]=c;return c;
}
function drawWorld(ctx){

  if(G.wx&&G.wx.snow)dark=Math.max(dark,.32);
  ctx.fillStyle=`rgba(10,16,40,${dark.toFixed(3)})`;ctx.fillRect(0,0,960,540);
  if(G.wx&&G.wx.rain){
    ctx.strokeStyle='rgba(160,190,220,.35)';ctx.lineWidth=1;
    for(let i=0;i<40;i++){const px=(G.wx.seed+i*73)%960,py=(G.wx.seed*3+i*37)%540;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-4,py+12);ctx.stroke();}
  }
  if(G.wx&&G.wx.snow){ctx.fillStyle='rgba(230,240,250,.5)';for(let i=0;i<50;i++){const px=(G.wx.seed+i*97)%960,py=(G.wx.seed*5+i*53)%540;ctx.fillRect(px,py,2,2);}}
  // 城镇名
  for(const c of G.cities){

function drawMinimap(){

    else if(t===T.SWAMP)col='#3a5a3c';else if(t===T.TOWN)col='#a8925a';else if(t===T.ROAD)col='#8a8370';
    else if(t===T.BLDG)col='#b8b6c8';else if(t===T.BRIDGE)col='#9a6a40';else col='#4a9a44';
    g.fillStyle=col;g.fillRect(x*s,y*s,s*2,s*2);

  g.fillStyle='#3ab8ff';g.fillRect(G.player.x/TS*s-2.5,G.player.y/TS*s-2.5,5,5);

}
/* ============ 核心系统 ============ */
'use strict';
const AUD={};
function initAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)AUD.ctx=new AC();}catch(e){}}
function sfx(f,dur,freq2){if(!G||!G.settings.sfx||!AUD.ctx)return;try{const c=AUD.ctx,o=c.createOscillator(),g=c.createGain();o.type='square';const t=c.currentTime;o.frequency.setValueAtTime(freq2||440,t);o.frequency.exponentialRampToValueAtTime((freq2||440)*.6,t+.1);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+(dur||.12));o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(dur||.12)+.02);}catch(e){}}
function toast(t){const el=document.getElementById('toast');el.innerHTML=t;el.style.display='block';el.classList.remove('toast-in');void el.offsetWidth;el.classList.add('toast-in');clearTimeout(AUD._tt);AUD._tt=setTimeout(()=>el.style.display='none',2600);}
function newPlayer(name,mode){
  return {name:name, x:74*TS+TS/2, y:82*TS+TS/2, f:0,
    hp:100,maxhp:100,hunger:90,thirst:90,energy:90,sanity:80,warmth:80,

    weapon:'pistol', rep:{union:0,marches:20,dixie:-10,golden:0,committee:0},

}
function cityById(id){return G.cities.find(c=>c.id===id);}
function distP(e,x,y){return Math.hypot((e.x||e.x)-x,(e.y||e.y)-y);}
/* ---- 背包 ---- */
function addItem(id,q){const it=G.player.inv.find(i=>i.id===id);if(it)it.q+=q;else G.player.inv.push({id:id,q:q});}
function remItem(id,q){const it=G.player.inv.find(i=>i.id===id);if(!it)return false;it.q-=q;if(it.q<=0)G.player.inv=G.player.inv.filter(i=>i.q>0);return true;}
function countItem(id){const it=G.player.inv.find(i=>i.id===id);return it?it.q:0;}
function statOf(id){return ITEMS[id];}
function equipWeapon(id){G.player.weapon=id;}
/* ---- 数值 ---- */
function tickStats(dtH){
  const p=G.player,t=G.time;
  const reg=regionAt(p.x,p.y);
  let cold=0;
  if(reg===R.UNION&&(t.month>=11||t.month<=3))cold=8;
  if(reg===R.WASTE&&t.h<7)cold=5;
  if(t.month>=6&&t.month<=8&&(reg===R.DIXIE||reg===R.MEXICO))cold=-3; // 热
  p.hunger=Math.max(0,p.hunger-1.6*dtH);
  p.thirst=Math.max(0,p.thirst-2.2*dtH);
  p.energy=Math.max(0,p.energy-(p.hunger<25||p.thirst<25?1.6:0.7)*dtH);
  p.warmth=Math.max(0,p.warmth-(cold>0?cold*0.35*dtH:0));
  p.sanity=Math.max(0,p.sanity-0.1*dtH);
  if(p.hunger<=0)p.hp-=2.2*dtH;
  if(p.thirst<=0)p.hp-=3.4*dtH;
  if(p.warmth<=0)p.hp-=1.4*dtH;
  if(p.hp<=0)die();
}
function regionAt(x,y){const tx=Math.floor(x/TS),ty=Math.floor(y/TS);return G.reg[ty*MW+tx]!==undefined?G.reg[ty*MW+tx]:R.MARCHES;}
function useItem(id){
  const p=G.player,it=statOf(id);
  if(!it||countItem(id)<=0)return;
  if(it.t==='food'){p.hunger=Math.min(100,p.hunger+it.hunger);p.hp=Math.min(p.maxhp,p.hp+(it.hp||0));if(it.risk)p.effects.sick=(p.effects.sick||0)+25;remItem(id,1);sfx('eat',.2,300);}
  else if(it.t==='drink'){p.thirst=Math.min(100,p.thirst+it.thirst);p.sanity=Math.min(100,p.sanity+(it.sanity||0));p.energy=Math.min(100,p.energy+(it.energy||0));if(it.drunk){p.effects.drunk=(p.effects.drunk||0)+it.drunk;}remItem(id,1);sfx('drink',.2,500);}
  else if(it.t==='med'){p.hp=Math.min(p.maxhp,p.hp+(it.heal||0));if(it.sick)p.effects.sick=Math.max(0,(p.effects.sick||0)-it.sick);if(it.wound)p.effects.wound=Math.max(0,(p.effects.wound||0)-it.wound);if(it.poison)p.effects.poison=Math.max(0,(p.effects.poison||0)-it.poison);remItem(id,1);sfx('heal',.3,700);}
  else if(it.t==='tool'&&id==='canteen'&&nearWater()){p.thirst=Math.min(100,p.thirst+35);p.hp=Math.min(p.maxhp,p.hp+2);toast('灌满了水壶');sfx('drink',.2,500);}
  else toast('这个物品不能直接使用。');
  checkQ('item',id);updateHUD();
}
function nearWater(){const p=G.player,tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const t=G.tiles[(ty+dy)*MW+tx+dx];if(t===T.WATER||t===T.SWAMP)return true;}return false;}
function eatDrinkAuto(){const p=G.player;if(p.hunger<40){const f=p.inv.find(i=>ITEMS[i.id]&&ITEMS[i.id].t==='food');if(f){useItem(f.id);toast('自动食用 '+ITEMS[f.id].n);}}if(p.thirst<40){const w=p.inv.find(i=>ITEMS[i.id]&&i.id==='water');if(w){useItem('water');toast('自动饮水');}}}
/* ---- 时间与天气 ---- */
function tickTime(dt){
  const t=G.time;t.minute+=dt*60*G.settings.speed;G._acc=(G._acc||0)+dt*G.settings.speed;
  while(t.minute>=60){t.minute-=60;t.hour++;}
  while(t.hour>=24){t.hour-=24;t.day++;autoSave(true);}
  if(!G.wx||Math.random()<0.02*dt){G.wx={rain:Math.random()<0.14,snow:Math.random()<0.06&&(t.month>=11||t.month<=2),seed:Math.random()*1e6};}
}
function weatherName(){const t=G.time;let w='晴';if(G.wx&&G.wx.rain)w='雨';if(G.wx&&G.wx.snow)w='雪';return w+` ${t.month}月`;}
/* ---- 移动 ---- */
function tryMove(dx,dy){
  const p=G.player;
  const nx=p.x+dx,ny=p.y+dy;
  const tx=Math.floor(nx/TS),ty=Math.floor(ny/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH)return;
  const t=G.tiles[ty*MW+tx];
  if(WALK.indexOf(t)<0){return;}
  const oldr=regionAt(p.x,p.y),newr=regionAt(nx,ny);
  p.x=nx;p.y=ny;
  const td=t===T.ROAD||t===T.BRIDGE?1.8:(t===T.FOREST||t===T.PINE||t===T.SWAMP?0.6:1);
  G.moveSpd=td;
  if(oldr!==newr){toast(`进入：${REGION_NAME[newr]}`);sfx('step',.1,200);}
  const c=nearCity();if(c){if(!c.dis){c.dis=true;toast(`发现城镇：${c.n}`);checkQ('goto',c.id);}}
}
function nearCity(){const p=G.player;for(const c of G.cities){if(Math.hypot(c.x*TS-p.x,c.y*TS-p.y)<64)return c;}return null;}
/* ---- 采集 ---- */
function gather(){
  const p=G.player;const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS);const t=G.tiles[ty*MW+tx];
  const hasAxe=countItem('axe')>0,hasSh=countItem('shovel')>0,hasRod=countItem('rod')>0;
  const r=Math.random();
  let got=null;
  if(t===T.FOREST||t===T.PINE){
    if(hasAxe){got='wood';addItem('wood',2);}
    else if(r<.6){got='wood';addItem('wood',1);}
    else if(r<.75){got='berry';addItem('berry',1);}
    else if(r<.82){got='herb';addItem('herb',1);}
    else{got='wood';addItem('wood',1);}
  }else if(t===T.GRASS){
    if(r<.4){got='herb';addItem('herb',1);}
    else if(r<.6){got='berry';addItem('berry',1);}
    else if(r<.75){got='flint';addItem('flint',1);}
    else if(r<.9){got='wood';addItem('wood',1);}
    else{got='berry';addItem('berry',1);}
  }else if(t===T.SWAMP){
    if(r<.4){got='herb';addItem('herb',1);}
    else if(r<.6){got='berry';addItem('berry',1);}
    else if(r<.75){got='cloth';addItem('cloth',1);}
    else{got='wood';addItem('wood',1);}
    if(r>.5)p.effects.sick=(p.effects.sick||0)+6;
  }else if(t===T.CRAG||t===T.MTN){
    if(hasSh&&r<.5){got='iron';addItem('iron',1);}
    else if(r<.55){got='coal';addItem('coal',1);}
    else if(r<.75){got='flint';addItem('flint',1);}
    else if(r<.9){got='scrap';addItem('scrap',1);}
    else{got='iron';addItem('iron',1);}
  }else if(t===T.DESERT){
    if(r<.5){got='flint';addItem('flint',1);}
    else if(r<.7){got='scrap';addItem('scrap',1);}
    else if(r<.85){got='iron';addItem('iron',1);}
    else{got='coal';addItem('coal',1);}
  }else if(t===T.WATER||t===T.BRIDGE||t===T.SAND){
    if(hasRod){if(r<.7){got='fish';addItem('fish',1);}else{got=null;}}
    else if(countItem('canteen')>0){got='water';addItem('water',1);}
    else if(r<.4){got='water';addItem('water',1);}
    else{got=null;toast('没有容器，无法取水。');}
  }else{toast('这里没什么可采集的。');}
  if(got){toast(`采集到：${ITEMS[got].n}`);sfx('pick',.12,900);checkQ('item',got);updateHUD();}
  p.energy=Math.max(0,p.energy-2);
}

/* ---- 睡眠 ---- */
function sleep(hours){
  const p=G.player;const t=G.time;
  if(countItem('bedroll')<=0&&countItem('tent')<=0){toast('没有睡袋或帐篷，无法野外过夜。去旅店吧。');return;}

  p.hp=Math.min(p.maxhp,p.hp+35);p.energy=100;p.hunger=Math.max(0,p.hunger-20);p.thirst=Math.max(0,p.thirst-25);p.sanity=Math.min(100,p.sanity+25);p.warmth=100;
  toast('一觉到天亮。');sfx('sleep',.6,200);autoSave(true);updateHUD();

function rentRoom(){

function gamble(){

/* ---- 商店 ---- */
function shopBuy(id){

/* ---- 战斗 ---- */
function startCombat(es){
  if(G.combat)return;
  G.combat={list:es,turn:'p',def:0,round:0};
  es.forEach(e=>e.hp=e.maxhp);
  document.getElementById('cbt').classList.add('on');
  sfx('fight',.3,150);
  renderCombat();
}
function renderCombat(){
  const box=document.getElementById('cbt');
  const p=G.player,c=G.combat;
  let h=`<h3>⚔ 遭遇战 - 第${c.round+1}回合</h3>`;
  h+=`<div style="font-size:12px;line-height:1.6;color:#c9c4b6">`;
  h+=`<span style="color:#3ab8ff">你</span> HP${p.hp}/${p.maxhp} 武器:${ITEMS[p.weapon].n}<br>`;
  c.list.forEach((e,i)=>{h+=`<span style="color:#e86a5a">${e.n}</span> HP${e.hp}/${e.maxhp}`+(e.bleed?' 流血':(e.def?' 防御':''))+(i<c.list.length-1?' | ':'');});
  h+=`</div><div class="cb">`;
  const w=ITEMS[p.weapon];
  if(w.ammo&&countItem(w.ammo)>0)h+=`<button onclick="combatAct('shoot')">射击</button>`;
  h+=`<button onclick="combatAct('melee')">近战</button>`;
  h+=`<button onclick="combatAct('def')">防御</button>`;
  h+=`<button onclick="combatAct('item')">用药</button>`;
  h+=`<button onclick="combatAct('flee')">逃跑</button>`;
  h+=`</div>`;
  box.innerHTML=h;
}
function combatAct(act){
  const p=G.player,c=G.combat;if(!c||c.turn!=='p')return;
  const w=ITEMS[p.weapon];
  let log='';
  if(act==='melee'){
    const dmg=roll(w.dmg||5)+Math.floor(p.skills.marksman*.5)+Math.floor(p.level*.3);
    const e=c.list[0];
    if(e){e.hp-=dmg;log=`近战命中 ${e.n}，造成 ${dmg} 伤害。`;sfx('hit',.15,180);}
  }else if(act==='shoot'){
    if(countItem(w.ammo)<=0){toast('没弹药了！');return;}
    remItem(w.ammo,1);
    const dmg=roll(w.dmg)+Math.floor(p.skills.marksman*1.2)+Math.floor(p.level*.4);
    const e=c.list[0];
    if(e){e.hp-=dmg;log=`射击命中 ${e.n}，造成 ${dmg} 伤害。`;sfx('shot',.2,700);}
  }else if(act==='def'){c.def=1;log='你举起武器防御。';}
  else if(act==='item'){
    const med=p.inv.find(i=>ITEMS[i.id]&&ITEMS[i.id].t==='med');
    if(med){useItem(med.id);log=`使用了 ${ITEMS[med.id].n}。`;}
    else{log='没有可用药品。';}
  }else if(act==='flee'){
    const sp=Math.random()<0.45?true:false;
    if(sp){toast('你成功逃跑了。');endCombat(true);return;}
    log='逃跑失败！';
  }
  if(log)toast(log);
  if(c.list.every(e=>e.hp<=0)){winCombat();return;}
  // 敌人回合
  c.list.forEach(e=>{if(e.hp<=0)return;
    if(e.def){e.def=0;return;}
    const dmg=roll(e.dmg)-Math.floor(p.level*.2)-Math.floor(p.skills.survival*.3);
    const hit=Math.max(1,dmg);
    p.hp-=c.def?Math.floor(hit*.4):hit;
    if(c.def)c.def=0;
    sfx('hurt',.2,120);
  });

function spawnEnemies(dt){
  G._spawnT=(G._spawnT||0)+dt;
  if(G._spawnT<3.2)return;G._spawnT=0;
  const p=G.player;
  const inTown=nearCity()!==null;
  const hostile=countHostile();
  if(inTown)return;
  if(hostile>=9)return;
  const reg=regionAt(p.x,p.y);
  const night=G.time.h<6||G.time.h>=20;
  const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS);
  const pool=[];
  for(const k in ENEMIES){
    const e=ENEMIES[k];
    if(e.reg.indexOf(reg)<0)continue;
    if(e.animal&&night&&Math.random()<.5)continue;
    if(e.human){
      if(k==='bandit'&&reg!==R.MARCHES&&reg!==R.WASTE)continue;
      if(k==='greywolf'&&(reg!==R.DIXIE&&reg!==R.MEXICO))continue;
      if(k==='ranger'&&(reg!==R.UNION&&reg!==R.GOLDEN))continue;
      if(k==='agent'&&G.story.chapter<9&&Math.random()<.7)continue;
      if(k==='bandit'&&p.rep.marches>60)continue;
      if(k==='greywolf'&&p.rep.dixie>40)continue;
      if(k==='ranger'&&p.rep.union>40)continue;
      if(k==='bandit'&&Math.random()<.5)continue;
      if(k==='greywolf'&&Math.random()<.55)continue;
      if(k==='ranger'&&Math.random()<.6)continue;
    }
    if(k==='agent'&&G.story.chapter<9)continue;
    pool.push(k);
  }
  if(!pool.length)return;
  const k=pool[Math.floor(Math.random()*pool.length)];
  const a=Math.random()*Math.PI*2,d=6+Math.random()*5;
  const ex=Math.floor(tx+Math.cos(a)*d),ey=Math.floor(ty+Math.sin(a)*d);
  if(ex<0||ey<0||ex>=MW||ey>=MH)return;
  if(WALK.indexOf(G.tiles[ey*MW+ex])<0)return;
  const t=G.tiles[ey*MW+ex];
  const e=ENEMIES[k];
  const kind=e.animal?(k==='wolf'?'wolf':k==='deer'?'deer':k==='gator'?'gator':k==='bear'?'bear':'boar'):null;
  G.ents.push({k:'enemy',kind:k,n:e.n,x:ex,y:ey,maxhp:e.hp,hp:e.hp,dmg:e.dmg,sp:e.sp,xp:e.xp,drop:e.drop,col:e.animal?(k==='wolf'?'#7a7a8a':k==='deer'?'#a88a5a':k==='gator'?'#3a5a3a':k==='bear'?'#4a3426':'#6a5a3a'):(k==='bandit'?'#6a5a3a':k==='greywolf'?'#5a4a4a':k==='ranger'?'#3a5a8a':k==='irondog'?'#8a8a96':'#2a2a35'),animal:e.animal,hostile:e.hostile,human:e.human});
}
function countHostile(){return G.ents.filter(e=>e.k==='enemy').length;}
function updateEntities(dt){
  const p=G.player;
  for(const e of G.ents.slice()){
    if(e.k==='drop'||e.k==='npc')continue;
    const d=Math.hypot(e.x*TS-p.x,e.y*TS-p.y);
    if(d>320||(e.k==='enemy'&&!e.hostile&&Math.random()<0.02*dt*60)){G.ents=G.ents.filter(x=>x!==e);continue;}
    if(e.k==='enemy'){
      if(d<40&&e.hostile){startCombat([e]);G.ents=G.ents.filter(x=>x!==e);continue;}
      if(!e.hostile&&d<70&&Math.random()<0.3*dt){e.x+=(p.x/TS>e.x?1:-1)*(Math.random()<.5?1:0);}
      if(e.hostile&&d<180&&Math.random()<0.25*dt){const dx=p.x/TS-e.x,dy=p.y/TS-e.y;const m=Math.hypot(dx,dy)||1;e.x+=Math.round(dx/m);e.y+=Math.round(dy/m);}
    }else if(e.k==='animal'){
      if(d<50&&Math.random()<0.3*dt){const dx=p.x/TS-e.x,dy=p.y/TS-e.y;const m=Math.hypot(dx,dy)||1;e.x-=Math.round(dx/m);e.y-=Math.round(dy/m);}
    }
  }
  // 拾取
  for(const e of G.ents.slice()){
    if(e.k!=='drop')continue;
    if(Math.hypot(e.x*TS-p.x,e.y*TS-p.y)<26){
      G.ents=G.ents.filter(x=>x!==e);
      const pick=['scrap','berry','flint','tooth'][Math.floor(Math.random()*4)];
      addItem(pick,1);p.money+=2;
      toast(`捡到 ${ITEMS[pick].n} 和 ${2} 银圆`);sfx('pick',.12,900);updateHUD();
    }
  }
}

function checkMain(){

  const nc=nearCity();
  if((o.t==='goto'||o.t==='travel')&&nc&&nc.id===o.city)advanceMain();
  // 支线：走到目标城完成送信
  for(const q of G.quests){if(q.state==='active'&&q.obj.t==='travel'&&nc&&nc.id===q.obj.city)completeQ(q);}
}
function checkQ(type,arg,n){
  // 主线
  if(G.story&&G.story.running){
    const ch=CHAPTERS[G.story.chapter-1];
    if(ch){
      const o=ch.obj[G.story.ci];
      if(o){
        if(o.t===type){
          let ok=false;
          if(type==='talk'&&o.npc===arg)ok=true;
          if(type==='item'&&o.id===arg)ok=true;
          if(type==='travel'&&o.city===arg)ok=true;
          if(type==='goto'&&o.city===arg)ok=true;
          if(type==='kill'&&o.kind===arg){G._killN=(G._killN||0)+1;if(G._killN>=o.n)ok=true;else ok=false;if(!ok){if(G._killN===1)toast(`还要消灭 ${o.n} 个${ENEMIES[o.kind].n}`);return;}}
          if(type==='craft'&&o.id===arg)ok=true;
          if(ok){G._killN=0;advanceMain();}
        }
      }
    }
  }
  // 支线
  for(const q of G.quests){
    if(q.state!=='active')continue;
    const o=q.obj;
    if(o.t===type){
      if(type==='kill'&&o.kind===arg){q.n=(q.n||0)+1;if(q.n>=o.n){completeQ(q);}}
      if(type==='item'&&o.id===arg&&countItem(arg)>=o.n){completeQ(q);}
      if(type==='travel'&&o.city===arg){completeQ(q);}
      if(type==='craft'&&o.id===arg&&countItem(arg)>=o.n){completeQ(q);}
    }
  }
}
function completeQ(q){
  q.state='done';
  G.player.money+=q.reward;G.player.xp+=q.xp;
  toast(`任务完成：${q.n}（+${q.reward}银圆，+${q.xp}经验）`);sfx('win',.4,500);maybeLevel();updateHUD();
}

  G.ents=[];
  genNPCs();
  G.cam={x:G.player.x-480,y:G.player.y-270};
  closeAllPanels();enterGame(d.mode,true);updateHUD();
}

function updateHUD(){

  const reg=G.reg[Math.floor(p.y/TS)*MW+Math.floor(p.x/TS)];

function renderMap(){
  const c=document.getElementById('bigmap'),g=c.getContext('2d');
  const s=c.width/MW;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=G.tiles[y*MW+x];let col;
    if(t===T.WATER)col='#16293f';else if(t===T.MTN)col='#565663';else if(t===T.SNOW)col='#b8c8e8';
    else if(t===T.DESERT)col='#96804a';else if(t===T.CRAG)col='#4e4e58';
    else if(t===T.FOREST)col='#1f4521';else if(t===T.PINE)col='#16352b';
    else if(t===T.SWAMP)col='#1d3a22';else if(t===T.TOWN)col='#7a6c4c';else if(t===T.ROAD)col='#5a5548';
    else if(t===T.BLDG)col='#8a8898';else if(t===T.BRIDGE)col='#6a4a30';else col='#2c5222';
    g.fillStyle=col;g.fillRect(x*s,y*s,s+0.4,s+0.4);
  }
  for(const cty of G.cities){

/* ---- 交互提示 ---- */
function findInteract(){
  const p=G.player,px=Math.floor(p.x/TS),py=Math.floor(p.y/TS);
  let best=null,bd=2;
  for(const e of G.ents){
    if(e.k!=='npc')continue;
    const d=Math.hypot(e.x-px,e.y-py);
    if(d<bd){bd=d;best=e;}
  }
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const tx=px+dx,ty=py+dy;
    if(tx<0||ty<0||tx>=MW||ty>=MH)continue;
    const t=G.tiles[ty*MW+tx];
    if(t===T.BLDG){
      for(const c of G.cities)if(c.shops.some(s=>s.x===tx&&s.y===ty)){if(bd>1){best={x:tx,y:ty,shop:c};bd=1;}}
    }
    for(const c of G.cities){
      if(c.depot.x===tx&&c.depot.y===ty&&bd>1){best={x:tx,y:ty,depot:c};bd=1;}
    }
  }
  if(G.fires.some(f=>Math.hypot(f.x-px,f.y-py)<1.5)&&bd>1){best={x:px,y:py,fire:true};bd=1;}
  const t=G.tiles[py*MW+px];
  if((t===T.FOREST||t===T.PINE||t===T.GRASS||t===T.SWAMP||t===T.CRAG||t===T.MTN||t===T.DESERT)&&bd>1){best={x:px,y:py,gather:true};bd=1;}
  if((t===T.WATER||t===T.BRIDGE||t===T.SAND)&&bd>1){best={x:px,y:py,water:true};bd=1;}
  return best;
}
function updatePrompt(){
  const el=document.getElementById('prompt');
  const it=findInteract();
  if(it){
    let s='';
    if(it.k==='npc')s=`E 与 ${it.name}（${ROLE_N[it.role]}）交谈`;
    else if(it.shop)s=`E 进入商店`;
    else if(it.depot)s=`E 驿站：快速旅行 / 悬赏板`;
    else if(it.fire)s=`E 营火：烹饪 / 休息`;
    else if(it.gather)s=`E 采集`;
    else if(it.water)s=`E 取水${countItem('canteen')>0?'/钓鱼(需钓竿)':''}`;
    el.textContent=s;el.style.display='block';
  }else el.style.display='none';
}
function doInteract(){
  const it=findInteract();if(!it)return;
  if(it.k==='npc'){talk(it);return;}
  if(it.shop){G._shop=it.shop;openShop();return;}
  if(it.depot){G._depot=it.depot;depotMenu();return;}
  if(it.fire){fireMenu();return;}
  if(it.gather){gather();return;}
  if(it.water){if(countItem('canteen')>0){addItem('water',1);toast('装了一壶水。');updateHUD();}else if(countItem('rod')>0){gather();}else{toast('没有容器。用空瓶或水壶。');}}
}
function fireMenu(){
  showDialogue([{s:'营火',t:'火光噼啪作响。'}],[
    {l:'烹饪（打开制作）',a:()=>openInv()},
    {l:'休息到天亮',a:()=>sleep(8)},
    {l:'收起火堆',a:()=>{G.fires.pop();toast('火堆熄灭了。');}}
  ]);
}
function depotMenu(){
  const d=G._depot;
  const opts=[{l:'快速旅行',a:()=>openTravel()},{l:'悬赏板（接支线）',a:()=>openBoard(d.id)}];
  showDialogue([{s:'驿站员',t:'欢迎来到 '+d.n+' 驿站。旅行还是打听活儿？'}],opts);
}
function openTravel(){
  const d=G._depot;
  let h='';
  G.cities.forEach(c=>{
    if(!c.dis)return;
    const cost=10+Math.round(Math.hypot(c.x-G.player.x/TS,c.y-G.player.y/TS)*0.4);
    h+=`<div class="row"><span class="nm">${c.n}</span><span class="ds">${REGION_NAME[c.r]} · 路费${cost}</span><button class="bt" onclick="fastTravel('${c.id}');closePanel('panel_travel')">出发</button></div>`;
  });
  const p=document.createElement('div');p.className='panel';p.id='panel_travel';
  p.innerHTML=`<h2>快速旅行</h2><div class="close" onclick="this.parentNode.remove()">×</div><div class="list">${h}</div>`;
  document.getElementById('wrap').appendChild(p);openPanel('panel_travel');
}
function openBoard(cityId){
  const c=cityById(cityId);
  let openQ=G.quests.filter(q=>q.city===cityId&&q.state==='open');
  if(!openQ.length)openQ=genSideQuests(c);
  let h='';
  openQ.forEach(q=>{
    h+=`<div class="row"><span class="nm">${q.n}</span><span class="ds">${q.d} · 赏金${q.reward}银圆</span><button class="bt" onclick="acceptQ('${q.n}')">接取</button></div>`;
  });
  showDialogue([{s:'悬赏板',t:'木板钉着几张泛黄的委托。'}],openQ.map(q=>({l:'接取：'+q.n,a:()=>acceptQ(q.n)})).concat([{l:'离开',a:()=>{}}]));
}
function acceptQ(n){
  const q=G.quests.find(x=>x.n===n&&x.state==='open');
  if(q){q.state='active';toast('已接取任务：'+q.n);updateHUD();drawJournalList();}
}
/* ---- 商店 ---- */
function openShop(){
  openPanel('panel_shop');
  const sh=G._shop;
  const stock=['bread','water','whiskey','bandage','medicine','herb','wood','iron','cloth','revolver_rounds','rifle_rounds','shells','pistol','rifle','shotgun','knife','axe','shovel','rod','bedroll','campfire_kit','tent','canteen'];
  let h=`<h2>${sh?sh.id==='emberfalls'?'驿站杂货铺':'商栈':'杂货铺'}</h2><div class="close" onclick="closePanel('panel_shop')">×</div>`;
  h+=`<div class="hint" style="text-align:left">— 出售 —</div><div class="list">`;
  stock.forEach(id=>{
    const it=statOf(id);
    if(Math.random()<0.4)return;
    let price=it.price;
    if(it.t==='weapon'||it.t==='ammo')price=Math.round(price*(1-G.player.skills.tinker*.05));
    h+=`<div class="row"><span class="nm">${it.n}</span><span class="ds">${it.d}</span><span class="qt">${price}银</span><button class="bt" onclick="shopBuy('${id}')">买</button></div>`;
  });
  h+=`</div><div class="hint" style="text-align:left">— 收购 —</div><div class="list">`;
  G.player.inv.forEach(i=>{
    const it=statOf(i.id);if(!it||it.t==='key')return;
    h+=`<div class="row"><span class="nm">${it.n}</span><span class="qt">×${i.q}</span><span class="qt">${Math.max(1,Math.round(it.price*.5))}银</span><button class="bt" onclick="shopSell('${i.id}')">卖1</button></div>`;
  });
  h+=`</div>`;
  const el=document.getElementById('panel_shop');
  if(!el){const p=document.createElement('div');p.className='panel';p.id='panel_shop';document.getElementById('wrap').appendChild(p);}
  document.getElementById('panel_shop').innerHTML=h;
  openPanel('panel_shop');
}
/* ---- 键盘 ---- */
function keyDown(e){
  if(!G||!G.player)return;
  const k=e.key.toLowerCase();
  if(k==='escape'){if(document.querySelector('.panel.on'))closeAllPanels();else openSettings();e.preventDefault();return;}
  if(G.dlogBusy&&k!=='e')return;
  G.keys[k]=true;
  if(k==='e')doInteract();
  else if(k==='i'){document.getElementById('panel_inv').classList.contains('on')?closePanel('panel_inv'):openInv();}
  else if(k==='m'){document.getElementById('panel_map').classList.contains('on')?closePanel('panel_map'):openMap();}
  else if(k==='j'){document.getElementById('panel_journal').classList.contains('on')?closePanel('panel_journal'):openJournal();}
  else if(k==='c'){document.getElementById('panel_char').classList.contains('on')?closePanel('panel_char'):openChar();}
  else if(k==='k'){document.getElementById('panel_archive').classList.contains('on')?closePanel('panel_archive'):openArchive();}
  else if(k===' '){meleeAttack();}
}
function keyUp(e){if(G)G.keys[e.key.toLowerCase()]=false;}
function meleeAttack(){
  const p=G.player;
  for(const e of G.ents){
    if(e.k!=='enemy')continue;
    if(Math.hypot(e.x-p.x/TS,e.y-p.y/TS)<2.2){startCombat([e]);G.ents=G.ents.filter(x=>x!==e);return;}
  }
}
/* ---- 主循环 ---- */
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!G||!G.player){return;}
  const dt=Math.min(.1,(ts-lastT)/1000)||.016;lastT=ts;
  if(G.inGame&&!document.querySelector('.panel.on')&&!G.dlogBusy){
    tickTime(dt);
    movePlayer(dt);
    tickStats(dt*G.settings.speed);
    spawnEnemies(dt);
    updateEntities(dt);
  }
  const ctx=document.getElementById('cv').getContext('2d');
  ctx.clearRect(0,0,960,540);
  drawWorld(ctx);
  drawEntities(ctx);
  drawOverlays(ctx);
  if(G.inGame)updatePrompt();
  updateHUDFrame();
  if(G.inGame)checkMain();
  if(G.inGame)checkMainItems();
}
function updateHUDFrame(){G._hudT=(G._hudT||0)+1;if(G._hudT%12===0)updateHUD();}
function movePlayer(dt){
  const p=G.player;
  let dx=0,dy=0;
  if(G.keys['w']||G.keys['arrowup'])dy-=1;
  if(G.keys['s']||G.keys['arrowdown'])dy+=1;
  if(G.keys['a']||G.keys['arrowleft'])dx-=1;
  if(G.keys['d']||G.keys['arrowright'])dx+=1;
  if(G.mv){
    const gx=G.mv.x,gy=G.mv.y;
    const d=Math.hypot(gx-p.x,gy-p.y);
    if(d<4)G.mv=null;
    else{dx=(gx-p.x)/d;dy=(gy-p.y)/d;}
  }
  if(dx||dy){
    const spd=76*(G.moveSpd||1)*dt;
    const m=Math.hypot(dx,dy)||1;
    tryMove(dx/m*spd,dy/m*spd);
    p.f=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?0:1);
  }
  G.cam.x+=(p.x-480-G.cam.x)*Math.min(1,dt*6);
  G.cam.y+=(p.y-270-G.cam.y)*Math.min(1,dt*6);
}
function canvasClick(e){
  if(!G||!G.player)return;
  if(document.querySelector('.panel.on'))return;
  const cv=document.getElementById('cv');
  const r=cv.getBoundingClientRect();
  const sx=(e.clientX-r.left)/r.width*960,sy=(e.clientY-r.top)/r.height*540;
  const wx=G.cam.x+sx,wy=G.cam.y+sy;
  G.mv={x:wx,y:wy};
}
function checkMainItems(){
  if(!G.story||!G.story.running)return;
  const ch=CHAPTERS[G.story.chapter-1];if(!ch)return;
  const o=ch.obj[G.story.ci];
  if(o&&o.t==='item'&&countItem(o.id)>=(o.n||1))advanceMain();
}
/* ============ 引导与主循环 ============ */
'use strict';
buildDOM();
initAudio();
const _cv=document.getElementById('cv');
_cv.addEventListener('click',canvasClick);
window.addEventListener('keydown',keyDown);
window.addEventListener('keyup',keyUp);
window.addEventListener('resize',()=>{});
// 主菜单背景世界
G={seed:99,mode:'free',inGame:false,
  time:{day:1,hour:9,minute:0,month:3},
  player:{x:74*TS+TS/2,y:82*TS+TS/2,f:0,hp:100,maxhp:100},
  cam:{x:0,y:0},cities:[],ents:[],fires:[],quests:[],
  wx:{rain:false,snow:false,seed:1},
  settings:{sfx:true,speed:1,unlockAll:false},keys:{},mv:null,moveSpd:1};
genWorld(99);
G.cam={x:G.player.x-480,y:G.player.y-270};
requestAnimationFrame(frame);
// 直达开局：#free 或 #story
if(typeof location!=='undefined'&&(location.hash==='#free'||location.hash==='#story')){
  setTimeout(()=>newGame(location.hash.slice(1)),800);
}
</script>
