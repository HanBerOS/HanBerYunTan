<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HanBer THREE · 被写错的世界</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===== 设计基调：1933 反转世界 · 油印档案 =====
   羊皮纸底 / 墨线 / 黄铜强调 / 血锈红印章
   ============================================ */
:root{
  --paper:#E9DDBF; --paper2:#DCCDA6; --paper3:#F2E8CF;
  --ink:#27211A; --ink2:#4A3F30; --ink3:#7A6C54;
  --brass:#B98A2F; --brass2:#8F6A22; --rust:#8A4B2A;
  --blood:#A33B2E; --blood2:#7C2C22;
  --olive:#5F6B4F; --fog:#6E7F8E;
  --ok:#3F6B3F; --bad:#A33B2E;
  --panel:rgba(235,224,198,.97);
  --panel2:rgba(216,199,154,.9);
  --line:2px solid var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#14100B}
body{
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none; touch-action:none;
}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0d0a07;image-rendering:auto}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}
.hidden{display:none!important}

/* ===== 通用面板 ===== */
.panel{
  background:var(--panel); border:var(--line);
  box-shadow:4px 4px 0 rgba(39,33,26,.28), inset 0 0 0 3px rgba(185,138,47,.25);
  border-radius:4px; padding:14px 16px;
}
.btn{
  display:inline-block; min-width:96px; padding:9px 16px; margin:4px;
  font-family:inherit; font-size:15px; font-weight:700; color:var(--paper3);
  background:linear-gradient(180deg,#C99B43,#8F6A22);
  border:1px solid #5C4313; border-bottom:3px solid #5C4313;
  border-radius:3px; cursor:pointer; letter-spacing:.12em;
  box-shadow:0 2px 0 rgba(0,0,0,.25); text-align:center;
  transition:transform .06s, filter .12s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);border-bottom:3px solid var(--ink);box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#B9503F,#7C2C22);border-color:#5C1C15}
.btn.olive{background:linear-gradient(180deg,#7A8760,#4C573C);border-color:#333C26}
.btn.small{min-width:64px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.locked{opacity:.5}

/* ===== 标题界面 ===== */
#titleScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 38%, rgba(233,221,191,.18), rgba(13,10,7,.88) 72%);
  z-index:60;}
#titleScreen .t-logo{
  font-family:"Noto Serif SC",serif; font-weight:900;
  font-size:min(9vw,84px); letter-spacing:.28em; color:var(--paper);
  text-shadow:0 0 18px rgba(185,138,47,.65), 0 6px 0 #1d1811, 0 10px 24px rgba(0,0,0,.9);
  transform:translateX(.14em); white-space:nowrap;
}
#titleScreen .t-sub{
  margin-top:14px; font-size:min(3.2vw,20px); letter-spacing:.6em; color:var(--brass);
  text-shadow:0 2px 6px rgba(0,0,0,.8); transform:translateX(.3em);
}
#titleScreen .t-line{width:min(480px,70vw);height:2px;margin:22px 0;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
#titleScreen .t-menu{display:flex;flex-direction:column;gap:10px;width:min(320px,76vw)}
#titleScreen .t-menu .btn{width:100%;font-size:17px;padding:12px}
#titleScreen .t-foot{position:absolute;bottom:26px;color:var(--ink3);font-size:12px;letter-spacing:.2em;text-align:center;line-height:1.9}
#titleScreen .t-stamp{
  position:absolute; top:9%; right:8%; transform:rotate(9deg);
  border:3px double var(--blood); color:var(--blood);
  padding:6px 14px; font-size:14px; font-weight:900; letter-spacing:.3em;
  opacity:.85; background:rgba(20,13,8,.35);
}

/* ===== 建档界面 ===== */
#charScreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:55;
  background:rgba(13,10,7,.72)}
#charScreen .panel{width:min(560px,92vw)}
#charScreen h2{letter-spacing:.4em;font-size:22px;margin-bottom:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--ink2);letter-spacing:.14em;margin-bottom:5px;font-weight:700}
.field input[type=text]{
  width:100%; padding:9px 10px; font-family:inherit; font-size:16px;
  background:var(--paper3); border:1px solid var(--ink); border-radius:2px; color:var(--ink);
}
.origin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.origin-card{
  border:1px solid var(--ink2); border-radius:3px; padding:8px 9px; cursor:pointer;
  background:var(--paper3); transition:all .1s;
}
.origin-card:hover{background:#F4EBD4}
.origin-card.sel{border:2px solid var(--brass); box-shadow:0 0 0 2px rgba(185,138,47,.35); background:#F7EED6}
.origin-card b{display:block;font-size:14px;letter-spacing:.08em}
.origin-card span{font-size:11px;color:var(--ink2);line-height:1.5;display:block;margin-top:3px}

/* ===== HUD ===== */
#hud{position:absolute;inset:0;z-index:20}
.hud-top{
  display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  padding:8px 10px; pointer-events:none;
}
.hud-top>*{pointer-events:auto}
.hud-left{background:rgba(30,24,16,.82); border:1px solid var(--brass); border-radius:3px; padding:6px 12px; color:var(--paper)}
.hud-left .ln1{font-size:14px;font-weight:700;letter-spacing:.06em}
.hud-left .ln2{font-size:11px;color:var(--brass);letter-spacing:.1em;margin-top:2px}
.hud-stats{
  background:rgba(30,24,16,.82); border:1px solid var(--brass); border-radius:3px;
  padding:7px 12px; display:grid; grid-template-columns:repeat(4,minmax(88px,1fr)); gap:7px; flex:0 1 auto;
}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .lab{font-size:10px;color:var(--paper2);letter-spacing:.18em}
.stat .bar{height:9px;background:#17110B;border:1px solid #4A3A22;border-radius:2px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(180deg,#D8C68F,#8F6A22)}
.stat .bar i.hp{background:linear-gradient(180deg,#D9644F,#8A2E20)}
.stat .bar i.th{background:linear-gradient(180deg,#6FA8C9,#3A6E8C)}
.stat .bar i.en{background:linear-gradient(180deg,#8FA87C,#4C6340)}
.stat .num{font-size:10px;color:var(--paper3);text-align:right}
.hud-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hud-right .money{
  background:rgba(30,24,16,.82); border:1px solid var(--brass); border-radius:3px;
  padding:4px 10px; color:var(--brass); font-weight:900; font-size:14px; letter-spacing:.06em;
}
.hud-right .money b{color:var(--paper3);font-weight:700}
.hud-btns{display:flex;gap:4px}
.hud-btns .btn{min-width:52px;padding:5px 8px;font-size:12px;margin:0}
.hud-bottom{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
#hudHint{
  background:rgba(30,24,16,.7); color:var(--paper2); border:1px solid rgba(185,138,47,.5);
  border-radius:3px; padding:5px 12px; font-size:12px; letter-spacing:.05em; min-height:30px;
  display:flex; align-items:center;
}
#minimapWrap{background:rgba(30,24,16,.85);border:1px solid var(--brass);border-radius:3px;padding:4px}
#minimap{display:block;width:196px;height:104px}
#hudMode{
  position:absolute; top:8px; left:50%; transform:translateX(-50%);
  background:rgba(30,24,16,.8); border:1px solid var(--brass); border-radius:3px;
  color:var(--paper); font-size:12px; letter-spacing:.24em; padding:5px 16px;
}
#hudChapter{
  position:absolute; top:44px; left:50%; transform:translateX(-50%);
  color:var(--brass); font-size:11px; letter-spacing:.2em; text-shadow:0 1px 3px #000;
}
#questBanner{
  position:absolute; top:86px; left:50%; transform:translateX(-50%);
  max-width:70%; text-align:center;
  background:rgba(30,24,16,.78); border-left:3px solid var(--brass); border-right:3px solid var(--brass);
  color:var(--paper2); font-size:12px; padding:4px 14px; border-radius:2px; letter-spacing:.04em;
}

/* ===== 触摸控制 ===== */
#touchPad{position:absolute;left:14px;bottom:70px;z-index:25;display:none}
#touchPad.show{display:block}
#touchPad .pad{position:relative;width:132px;height:132px;border:2px solid rgba(185,138,47,.6);border-radius:50%;
  background:rgba(30,24,16,.4)}
#touchPad .knob{position:absolute;width:46px;height:46px;border-radius:50%;left:41px;top:41px;
  background:rgba(185,138,47,.5);border:1px solid var(--brass)}
#touchAct{position:absolute;right:14px;bottom:70px;z-index:25;display:none}
#touchAct.show{display:flex;flex-direction:column;gap:8px}
#touchAct .btn{min-width:64px;padding:10px}

/* ===== 通用弹窗 ===== */
.modal-mask{position:absolute;inset:0;background:rgba(13,10,7,.66);display:flex;align-items:center;justify-content:center;z-index:40}
.modal{max-width:min(760px,94vw);max-height:88vh;overflow-y:auto;overscroll-behavior:contain}
.modal h3{
  font-size:18px; letter-spacing:.24em; border-bottom:2px solid var(--ink);
  padding-bottom:7px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
}
.modal h3 .x{font-size:13px;color:var(--ink2);cursor:pointer;letter-spacing:0;font-weight:700;border:1px solid var(--ink2);padding:1px 8px;border-radius:2px}
.modal h3 .x:hover{color:var(--blood);border-color:var(--blood)}
.modal p{font-size:14.5px;line-height:1.95;letter-spacing:.02em;text-align:justify}
.modal .muted{color:var(--ink3);font-size:12px}
.modal .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.modal .scroll{max-height:52vh;overflow-y:auto;overscroll-behavior:contain;padding-right:6px}

/* 物品列表 */
.it-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px}
.it-card{border:1px solid var(--ink2);border-radius:3px;background:var(--paper3);padding:7px;cursor:pointer;position:relative;transition:all .1s}
.it-card:hover{border-color:var(--brass);transform:translateY(-1px)}
.it-card b{font-size:13px;display:block}
.it-card span{font-size:11px;color:var(--ink2);display:block;margin-top:2px;line-height:1.4}
.it-card .qty{position:absolute;top:5px;right:7px;font-size:11px;color:var(--blood);font-weight:900}
.it-card .tag{position:absolute;top:5px;left:6px;font-size:9px;color:var(--ink3);letter-spacing:.1em}
.it-detail{margin-top:9px;border-top:1px dashed var(--ink2);padding-top:8px;font-size:13px;line-height:1.8}

/* NPC 对话 */
.dlg-name{font-size:15px;font-weight:900;letter-spacing:.1em;color:var(--rust);margin-bottom:2px}
.dlg-name .role{font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:.06em}
.dlg-text{font-size:14.5px;line-height:2;margin-top:6px;text-align:justify}
.dlg-choices{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.dlg-choices .btn{text-align:left;white-space:normal;line-height:1.5;font-size:13.5px;min-height:38px;height:auto}

/* 战斗 */
.battle-hero{font-size:15px;font-weight:900;letter-spacing:.2em;text-align:center;border-bottom:2px solid var(--blood);padding-bottom:6px;margin-bottom:10px}
.battle-enemies{display:flex;gap:12px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.b-enemy{border:1px solid var(--ink2);border-radius:3px;background:var(--paper3);padding:8px 12px;text-align:center;min-width:104px}
.b-enemy b{font-size:14px;display:block}
.b-enemy .hpbar{height:8px;background:#17110B;border-radius:2px;margin-top:6px;overflow:hidden}
.b-enemy .hpbar i{display:block;height:100%;background:linear-gradient(180deg,#D9644F,#8A2E20)}
.b-enemy .st{font-size:10px;color:var(--ink2);margin-top:3px}
.battle-party{display:flex;gap:12px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.b-pc{border:1px solid var(--brass2);border-radius:3px;background:var(--paper);padding:8px 12px;text-align:center;min-width:104px}
.b-pc b{font-size:14px;display:block}
.battle-log{height:118px;overflow-y:auto;background:rgba(39,33,26,.08);border:1px solid var(--ink2);border-radius:3px;
  padding:6px 10px;font-size:12.5px;line-height:1.8;margin:10px 0}
.battle-log .hl{color:var(--blood);font-weight:700}
.battle-acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.battle-acts .btn{min-width:86px}

/* 剧情演出 */
.story-paper{
  background:var(--panel); border:var(--line); border-radius:4px;
  box-shadow:5px 5px 0 rgba(39,33,26,.3);
  padding:22px 26px; max-width:min(780px,94vw); max-height:86vh; overflow-y:auto;
}
.story-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
.story-head .ch{font-size:13px;letter-spacing:.3em;color:var(--rust);font-weight:900}
.story-head .t{font-size:22px;font-weight:900;letter-spacing:.14em}
.story-head .date{font-size:12px;color:var(--ink3);letter-spacing:.1em}
.story-body{font-size:15px;line-height:2.1;text-align:justify;white-space:pre-wrap}
.story-body .spk{color:var(--rust);font-weight:700}
.story-body .anom{color:var(--blood);font-weight:700}
.story-body .hint{color:var(--ink3);font-size:13px}
.story-choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.story-page{display:none}
.story-page.on{display:block}
.story-nav{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.stamp{display:inline-block;border:3px double var(--blood);color:var(--blood);font-weight:900;letter-spacing:.3em;
  padding:2px 10px;font-size:12px;transform:rotate(-6deg);opacity:.8}

/* 日志/图鉴 */
.journal-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.journal-tabs .btn{padding:5px 12px;font-size:12px;margin:0}
.entry{border:1px solid var(--ink2);border-radius:3px;background:var(--paper3);padding:8px 10px;margin:6px 0}
.entry b{font-size:13px;display:block}
.entry span{font-size:12px;color:var(--ink2);line-height:1.7;display:block;margin-top:3px}
.entry.new{border-color:var(--brass);box-shadow:0 0 0 2px rgba(185,138,47,.25)}

/* 存档 */
.save-slot{border:1px solid var(--ink2);border-radius:3px;background:var(--paper3);padding:10px 12px;margin:8px 0;cursor:pointer;transition:all .1s}
.save-slot:hover{border-color:var(--brass)}
.save-slot b{font-size:14px}
.save-slot span{font-size:12px;color:var(--ink2);display:block;margin-top:3px;line-height:1.6}
.save-slot.empty{opacity:.55;cursor:default}

/* Toast */
#toastRoot{position:absolute;top:120px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{
  background:rgba(30,24,16,.92); color:var(--paper); border:1px solid var(--brass);
  border-radius:3px; padding:7px 18px; font-size:13.5px; letter-spacing:.06em;
  animation:toastIn .25s ease; max-width:76vw;
}
.toast.bad{border-color:var(--blood);color:#F0B9AE}
.toast.good{border-color:var(--olive)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* 章节选择 */
.chapter-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch-item{border:1px solid var(--ink2);border-radius:3px;background:var(--paper3);padding:9px 11px;cursor:pointer;transition:all .1s}
.ch-item:hover{border-color:var(--brass)}
.ch-item.done{border-color:var(--olive)}
.ch-item.locked{opacity:.45;cursor:default}
.ch-item b{font-size:13.5px;display:block;letter-spacing:.05em}
.ch-item span{font-size:11px;color:var(--ink2);display:block;margin-top:3px;line-height:1.5}
.ch-item .st{float:right;font-size:10px;color:var(--blood);font-weight:900;letter-spacing:.1em}

/* 地图页 */
.map-panel{width:min(860px,96vw)}
.map-panel canvas{width:100%;border:1px solid var(--ink);border-radius:2px;background:#1c160e}
.legend-line{font-size:11px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.swatch{display:inline-block;width:11px;height:11px;border:1px solid rgba(0,0,0,.3);border-radius:2px}

/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(39,33,26,.12)}
::-webkit-scrollbar-thumb{background:var(--brass2);border-radius:5px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--rust)}

@media (max-width:760px){
  .hud-stats{grid-template-columns:repeat(2,minmax(74px,1fr))}
  .chapter-list{grid-template-columns:1fr}
  .hud-left .ln2{display:none}
}
</style>
<style id="hanber-soviet-skin">
/* === HanBer 统一皮肤 · 后苏联忧郁美学 (Post-Soviet Melancholy) === */
html,body{
  background-color:#15181e !important;
  background-image:
    radial-gradient(ellipse at 50% -5%, rgba(201,168,106,.10), transparent 55%),
    linear-gradient(165deg,#11141a 0%,#1a1f28 48%,#231d15 100%) !important;
  color:#d6cdb8 !important;
}
#hanber-vignette{position:fixed;inset:0;z-index:99998;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,.55) 100%);}
</style>
<div id="hanber-vignette"></div>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">

  <!-- ===== 标题界面 ===== -->
  <div id="titleScreen">
    <div class="t-stamp">档案 · 时间线E-11</div>
    <div class="t-logo">HanBer&nbsp;THREE</div>
    <div class="t-sub">被写错的世界</div>
    <div class="t-line"></div>
    <div class="t-menu">
      <button class="btn" id="btnNew">开始游戏</button>
      <button class="btn ghost" id="btnLoad">读取存档</button>
      <button class="btn ghost" id="btnGuide">操作说明</button>
      <button class="btn ghost" id="btnAbout">关于本作</button>
    </div>
    <div class="t-foot">1918·柏林没有失败 · 1933·世界仍在转动<br>单机 · 自由探索 · 本地存档 · 主线十二卷连载中</div>
  </div>

  <!-- ===== 建档界面 ===== -->
  <div id="charScreen" class="hidden">

      <div class="field"><label>出身 · 决定初始能力与立场</label>
        <div class="origin-grid" id="originGrid"></div>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button class="btn ghost" id="btnCharBack">返回</button>
        <button class="btn" id="btnCharStart">开始旅程</button>
      </div>
    </div>
  </div>

  <!-- ===== 游戏 HUD ===== -->
  <div id="hud" class="hidden">
    <div id="hudMode">自由模式</div>
    <div id="hudChapter"></div>
    <div id="questBanner" class="hidden"></div>
    <div class="hud-top">
      <div class="hud-left">
        <div class="ln1" id="hudLoc">—</div>
        <div class="ln2" id="hudDate">—</div>
      </div>
      <div class="hud-stats">
        <div class="stat"><span class="lab">生命</span><div class="bar"><i class="hp" id="barHp"></i></div><span class="num" id="numHp">0/0</span></div>
        <div class="stat"><span class="lab">饱食</span><div class="bar"><i id="barHu"></i></div><span class="num" id="numHu">0</span></div>
        <div class="stat"><span class="lab">饮水</span><div class="bar"><i class="th" id="barTh"></i></div><span class="num" id="numTh">0</span></div>
        <div class="stat"><span class="lab">体力</span><div class="bar"><i class="en" id="barEn"></i></div><span class="num" id="numEn">0</span></div>

function dist2(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y){var h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

/* 一维噪声场 */
function makeNoise(w,h,seed,scale){
  const rng=mulberry32(seed);
  const gw=Math.ceil(w/scale)+2, gh=Math.ceil(h/scale)+2;
  const g=new Float32Array(gw*gh);
  for(let i=0;i<gw*gh;i++)g[i]=rng();
  const out=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const gx=x/scale, gy=y/scale;
    const x0=Math.floor(gx), y0=Math.floor(gy);
    const fx=gx-x0, fy=gy-y0;
    const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
    const a=g[y0*gw+x0], b=g[y0*gw+x0+1], c=g[(y0+1)*gw+x0], d=g[(y0+1)*gw+x0+1];
    out[y*w+x]=lerp(lerp(a,b,sx),lerp(c,d,sx),sy);
  }
  return out;
}

function buildWorld(seed){
  const rng=mulberry32(seed);
  const ter=new Uint8Array(MAP_W*MAP_H);
  const reg=new Uint8Array(MAP_W*MAP_H);
  const n1=makeNoise(MAP_W,MAP_H,seed,7);
  const n2=makeNoise(MAP_W,MAP_H,seed+99,3);
  /* 1) 基底海陆 */
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const v=n1[y*MAP_W+x]*0.6+n2[y*MAP_W+x]*0.4;
    ter[y*MAP_W+x]= v<0.44?TER.WATER:TER.PLAIN;
  }
  /* 2) 强制大陆 */
  function land(e){for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const dx=(x-e[0])/e[2],dy=(y-e[1])/e[3];
    if(dx*dx+dy*dy<=1)ter[y*MAP_W+x]=TER.PLAIN;}}
  function rect(r){for(let y=r[1];y<=r[3];y++)for(let x=r[0];x<=r[2];x++)
    if(x>=0&&x<MAP_W&&y>=0&&y<MAP_H)ter[y*MAP_W+x]=TER.PLAIN;}

  /* 4) 岛屿补丁 */
  land([72,70,4,6]);        /* 意大利 */
  land([102,68,5,5]);       /* 希腊 */
  land([82,78,2,2]);        /* 西西里 */
  land([72,76,2,3]);        /* 撒丁 */
  land([107,74,2,2]);       /* 克里特 */
  land([132,118,3,10]);     /* 马达加斯加 */
  land([245,84,2,3]);       /* 台湾 */
  land([242,73,3,6]);       /* 菲律宾 */
  land([248,90,2,2]);       /* 棉兰老 */
  land([98,30,3,3]);        /* 西兰岛 */
  land([80,26,2,4]);        /* 挪威南 */
  land([140,112,2,3]);      /* 索科特拉? 跳过 */
  land([40,20,5,4]);        /* 冰岛 */
  /* 5) 气候与地形 */
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const i=y*MAP_W+x;if(ter[i]===TER.WATER)continue;
    const h=n2[i];
    if(y<15)ter[i]=TER.SNOW;
    else if(y<22){ter[i]=h<0.5?TER.SNOW:TER.TUNDRA;}
    else if(y<27){ter[i]=h<0.35?TER.TUNDRA:TER.PLAIN;}
    /* 山系 */
    const alps=((x-88)/10)**2+((y-56)/3)**2;
    const carpat=((x-102)/9)**2+((y-49)/4)**2;
    const caucas=((x-140)/4)**2+((y-58)/2.4)**2;
    const ural=((x-124)/2.2)**2+((y-36)/16)**2;
    const himal=((x-176)/22)**2+((y-63)/3.5)**2;
    const atlas=((x-55)/18)**2+((y-76)/3.5)**2;
    const appen=((x-70)/2.5)**2+((y-69)/5)**2;
    const balkanm=((x-112)/4)**2+((y-66)/3)**2;
    const scandes=((x-80)/2.5)**2+((y-22)/9)**2;
    const altai=((x-180)/8)**2+((y-44)/4)**2;
    const transb=((x-202)/4)**2+((y-52)/4)**2;
    const min=Math.min(alps,carpat,caucas,ural,himal,atlas,appen,balkanm,scandes,altai,transb);
    if(min<0.9){ter[i]=TER.MOUNTAIN;continue;}
    /* 沙漠带 */
    if(x>36&&x<150&&y>88&&y<104){ter[i]=TER.DESERT;continue;}
    if(x>118&&x<166&&y>76&&y<92){ter[i]=TER.DESERT;continue;}
    if(x>136&&x<180&&y>44&&y<56&&h<0.45){ter[i]=TER.DESERT;continue;} /* 中亚 */
    if(x>198&&x<224&&y>50&&y<58&&h<0.42){ter[i]=TER.DESERT;continue;} /* 戈壁 */
    if(x>168&&x<196&&y>42&&y<48&&h<0.4){ter[i]=TER.DESERT;continue;} /* 哈萨克 */
    /* 森林/沼泽 */
    if(ter[i]===TER.PLAIN){
      if(h>0.66)ter[i]=TER.FOREST;
      else if(h<0.26&&y>34&&y<84)ter[i]=TER.FOREST;
      else if(h<0.22)ter[i]=TER.SWAMP;
      else if(h>0.56&&h<0.6&&n1[i]>0.5)ter[i]=TER.HILL;
    }
  }
  /* 6) 区域归属 */
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const i=y*MAP_W+x;if(ter[i]===TER.WATER){reg[i]=255;continue;}
    let found=REGIONS.length-1;
    for(let r=0;r<REGIONS.length;r++){
      const rs=REGIONS[r].shapes;let hit=false;
      for(let s=0;s<rs.length&&!hit;s++){
        const sh=rs[s];
        if(sh.e){const dx=(x-sh.e[0])/sh.e[2],dy=(y-sh.e[1])/sh.e[3];if(dx*dx+dy*dy<=1)hit=true;}
        else if(sh.r){if(x>=sh.r[0]&&x<=sh.r[2]&&y>=sh.r[1]&&y<=sh.r[3])hit=true;}
      }
      if(hit){found=r;break;}
    }
    reg[i]=found;
  }
  /* 7) 道路（铁路） */
  const roads=[];
  RAILS.forEach(pair=>{
    const a=CITY_MAP[pair[0]],b=CITY_MAP[pair[1]];
    if(!a||!b)return;
    const steps=Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y))*2;
    for(let s=0;s<=steps;s++){
      const t=s/steps;
      const x=Math.round(lerp(a.x,b.x,t)), y=Math.round(lerp(a.y,b.y,t));
      const i=y*MAP_W+x;
      if(x>=0&&x<MAP_W&&y>=0&&y<MAP_H&&ter[i]!==TER.WATER&&ter[i]!==TER.MOUNTAIN){
        if(ter[i]!==TER.CITY)ter[i]=TER.ROAD;
      }
    }
  });
  /* 8) 城市落位 */
  CITIES.forEach(c=>{
    let bx=clamp(Math.round(c.x),1,MAP_W-2), by=clamp(Math.round(c.y),1,MAP_H-2);
    if(ter[by*MAP_W+bx]===TER.WATER){
      outer: for(let r=1;r<12;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
        const nx=bx+dx,ny=by+dy;
        if(nx<1||nx>=MAP_W-1||ny<1||ny>=MAP_H-1)continue;
        if(ter[ny*MAP_W+nx]!==TER.WATER){bx=nx;by=ny;break outer;}
      }
    }
    c.px=bx*TILE+TILE/2;c.py=by*TILE+TILE/2;
    ter[by*MAP_W+bx]=TER.CITY;
    /* 城市辐射出小路 */
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const nx=bx+dx,ny=by+dy;
      if(nx<1||nx>=MAP_W-1||ny<1||ny>=MAP_H-1)continue;
      const i=ny*MAP_W+nx;
      if(ter[i]===TER.PLAIN||ter[i]===TER.FOREST||ter[i]===TER.DESERT||ter[i]===TER.TUNDRA)ter[i]=TER.ROAD;
    }
  });
  return {ter,reg};
}

  {id:"gen",name:"尤德尼奇将军",role:"白军总司令",city:"moscow",f:"white",

  {id:"anya",name:"安妮娅",role:"孤儿院院长",city:"moscow",f:"people",

  {id:"winston",name:"温斯顿",role:"情报局顾问",city:"london",f:"allies",

    opts:[{t:"听他的疯话",k:"lore",lines:["“你相信吗，年轻人？我曾经——在另一个世界——赢得过它。我为此写了厚厚的回忆录，然后一觉醒来，回忆录变成了废纸。这个世界的墨水，会自己改写字迹。”"]}]},

  {id:"smuggler",name:"秃鹫",role:"远东走私贩",city:"hk",f:"black",

const REP_KEYS=["imperial","ottoman","white","japan","allies","people","black"];

function newState(mode,name,originId){
  const o=ORIGINS.find(x=>x.id===originId)||ORIGINS[0];
  const rep={};REP_KEYS.forEach(k=>rep[k]=5);
  Object.keys(o.rep||{}).forEach(k=>rep[k]+=o.rep[k]);
  const c=CITY_MAP[o.city];
  return {
    v:1, mode, name:name||"汉伯", origin:o.id, chapter:0, chapterStep:0, storyFlags:{}, flags:{},
    x:c.px, y:c.py, region:0, day:0, minute:480,
    hp:o.st.hp, maxhp:o.st.hp, hunger:80, thirst:80, energy:100,
    money:o.money, level:1, exp:0, atk:o.st.atk, def:o.st.def, spd:o.st.spd, statBonus:{atk:0,def:0,spd:0},
    inv:[{id:o.weapon,qty:1},{id:"water",qty:2},{id:"bread",qty:3},{id:"bandage",qty:1}],
    equip:{weapon:o.weapon,armor:o.armor}, comps:[], rep,
    quests:[], doneQuests:[], journal:[], kills:0, deaths:0, daysAlive:0,
    explored:"", weatherSeed:0, ending:null, playTime:0, introRead:false,
  };
}

/* 探索地图编码 */
function exploredEncode(S){
  let s="";
  for(let i=0;i<WORLD.ter.length;i++)s+=String.fromCharCode(65+WORLD.explored[i]);
  return s;
}
function exploredDecode(s){
  for(let i=0;i<WORLD.ter.length;i++)WORLD.explored[i]=s&&i<s.length?Math.min(63,s.charCodeAt(i)-65):0;
}

/* ---------- 存档 ---------- */
const SAVE_KEY="hanber3_save_";
function saveToSlot(slot){
  try{
    S.explored=exploredEncode(S);
    S.weatherSeed=GS.weatherSeed;
    localStorage.setItem(SAVE_KEY+slot,JSON.stringify(S));
    GS.lastSave=Date.now();
    toast("已存档到 槽位"+slot,"good");
    refreshSaveList();
    return true;
  }catch(e){toast("存档失败："+e.message,"bad");return false;}
}
function loadFromSlot(slot){
  try{
    const raw=localStorage.getItem(SAVE_KEY+slot);
    if(!raw)return false;
    const s=JSON.parse(raw);
    if(!s||!s.v)return false;
    S=s; applyLoadedState();
    return true;
  }catch(e){toast("读档失败："+e.message,"bad");return false;}
}
function applyLoadedState(){
  if(!WORLD)WORLD=buildWorld(S.weatherSeed||7);
  WORLD.explored=new Uint8Array(WORLD.ter.length);
  exploredDecode(S.explored||"");
  GS.mode=S.mode==="story"?"story":"free";
  GS.minimapDirty=true;
  updateHUD();
  enterGame();
}
function saveExists(slot){try{return !!localStorage.getItem(SAVE_KEY+slot)}catch(e){return false}}
function deleteSave(slot){try{localStorage.removeItem(SAVE_KEY+slot);refreshSaveList();toast("已删除存档","good")}catch(e){toast("删除失败","bad")}}
function exportSave(){
  S.explored=exploredEncode(S);
  const txt=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  return txt;
}
function importSave(txt){
  try{
    const s=JSON.parse(decodeURIComponent(escape(atob(txt.trim()))));
    if(!s||!s.v)throw new Error("格式错误");
    S=s;applyLoadedState();toast("导入成功","good");
  }catch(e){toast("导入失败："+e.message,"bad")}
}
function autoSave(){
  if(!S||GS.mode==="title")return;
  saveToSlot(1);
}

/* ---------- 时间与天气 ---------- */
const MONTHS=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const WEEK=["周日","周一","周二","周三","周四","周五","周六"];
function gameDate(){
  const d=new Date(1933,10,1+S.day);
  return {y:d.getFullYear(),m:d.getMonth(),date:d.getDate(),w:(d.getDay())};
}
function fmtDate(){
  const d=gameDate();
  return d.y+"年"+(d.m+1)+"月"+d.date+"日 "+WEEK[d.w];
}
function fmtTime(){
  return pad2(Math.floor(S.minute/60))+":"+pad2(S.minute%60);
}
function seasonName(){const m=gameDate().m;return m>=10||m<=1?"冬":m<=4?"春":m<=7?"夏":"秋"}
function regionAt(x,y){
  const tx=clamp(Math.floor(x/TILE),0,MAP_W-1),ty=clamp(Math.floor(y/TILE),0,MAP_H-1);
  const ri=WORLD.reg[ty*MAP_W+tx];
  return ri===255?null:REGIONS[ri];
}
function cityNear(x,y,rad){
  let best=null,bd=rad;
  for(const c of CITIES){const d=dist2(x,y,c.px,c.py);if(d<bd){bd=d;best=c;}}
  return best;
}
function tileAt(x,y){return WORLD.ter[clamp(Math.floor(y/TILE),0,MAP_H-1)*MAP_W+clamp(Math.floor(x/TILE),0,MAP_W-1)]}
function isPassable(x,y){
  const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)return false;
  return TER_PASS[WORLD.ter[ty*MAP_W+tx]];
}
function regionClimate(ri){
  if(ri===null)return "sea";
  const r=REGIONS[ri];
  const n=r.name;
  if(n.includes("冰")||n.includes("西伯利亚")||n.includes("斯堪"))return "cold";
  if(n.includes("沙漠")||n.includes("撒哈拉")||n.includes("阿拉伯")||n.includes("波斯"))return "hot";
  return "temp";
}
function rollWeather(){
  const cl=regionClimate(S.region);
  const m=gameDate().m;
  const r=GS.rng;
  if(cl==="cold")GS.weather=r()<0.5?"雪":(r()<0.5?"阴":"晴");
  else if(cl==="hot")GS.weather=r()<0.45?"沙尘":(r()<0.6?"晴":"酷热");
  else GS.weather=r()<0.4?"雨":(r()<0.65?"阴":"晴");
  if(m>=4&&m<=9&&cl==="hot"&&GS.weather==="晴"&&r()<0.3)GS.weather="酷热";
  if(cl==="cold"&&GS.weather==="阴"&&r()<0.3)GS.weather="雪";
}
function calcTemp(){
  const ty=clamp(Math.floor(S.y/TILE),0,MAP_H-1);
  const lat=1-ty/MAP_H;            /* 0南 1北 */
  const m=gameDate().m;
  const seas=[0,-4,-6,-4,0,5,9,10,8,4,0,-2][m];
  let t=-34+lat*58+seas;           /* 基础纬度温度 */
  const h=S.minute/60;
  t+=Math.sin((h-9)/24*Math.PI*2)*3; /* 昼夜 */
  if(GS.weather==="雪")t-=5;
  if(GS.weather==="雨")t-=3;
  if(GS.weather==="沙尘")t+=4;
  if(GS.weather==="酷热")t+=8;
  return Math.round(t);
}
function advanceTime(realDt){
  S.minute+=realDt*3;
  S.playTime+=realDt;
  while(S.minute>=1440){S.minute-=1440;S.day++;S.daysAlive++;GS.dayRolled=false;GS.minimapDirty=true;}
  if(!GS.dayRolled){
    GS.dayRolled=true;
    GS.weatherSeed=((S.day*7919)+Math.floor(S.x/100))>>>0;
    if(!WORLD)WORLD=buildWorld(S.weatherSeed);
    GS.rng=mulberry32(S.weatherSeed);
    rollWeather();
    /* 每天结算 */
    onNewDay();
  }
  GS.temp=calcTemp();
}
function onNewDay(){
  if(!S)return;
  /* 生存结算 */
  const t=GS.temp;
  const warm=S.equip.armor&&(ITEMS[S.equip.armor]||{}).name&&(S.equip.armor==="coat"||S.equip.armor==="armor_cloth"||S.equip.armor==="armor_leather");
  if(t<0&&!warm&&S.energy<20){S.hp-=3;toast("严寒侵袭，你感到虚弱","bad");}
  checkDeath("严寒与饥饿");
  GS.minimapDirty=true;
  /* 每日自动存档 */
  if(localStorage.getItem("hanber3_auto")!=="0"){
    try{
      S.explored=exploredEncode(S);
      localStorage.setItem(SAVE_KEY+1,JSON.stringify(S));
    }catch(e){}
  }
}

/* ---------- HUD ---------- */
function updateHUD(){
  if(!S){return;}
  const d=gameDate();
  $("hudLoc").textContent=locName();
  $("hudDate").textContent=fmtDate()+"  "+fmtTime()+" · "+GS.weather+" "+GS.temp+"° · 存活"+S.daysAlive+"天";
  $("barHp").style.width=clamp(S.hp/S.maxhp*100,0,100)+"%";
  $("barHu").style.width=clamp(S.hunger,0,100)+"%";
  $("barTh").style.width=clamp(S.thirst,0,100)+"%";
  $("barEn").style.width=clamp(S.energy,0,100)+"%";
  $("numHp").textContent=Math.ceil(S.hp)+"/"+S.maxhp;
  $("numHu").textContent=Math.ceil(S.hunger);
  $("numTh").textContent=Math.ceil(S.thirst);
  $("numEn").textContent=Math.ceil(S.energy);
  $("hudMoney").innerHTML="ℳ <b>"+Math.floor(S.money)+"</b>";
  $("hudMode").textContent=S.mode==="story"?(S.chapter>12?"主线 · 终章后":"主线·第"+S.chapter+"卷"):"自由模式";
  const ch=CHAPTERS[S.chapter-1];
  $("hudChapter").textContent=S.mode==="story"&&ch?("「"+ch.meta.title+"」"):(S.mode==="story"&&S.chapter>12?"「世界，继续转动」":"");
  /* 任务横幅 */
  const q=S.quests.filter(q=>!q.done);
  const qb=$("questBanner");
  if(S.mode==="story"&&GS.objText){qb.classList.remove("hidden");qb.textContent=GS.objText;}
  else if(q.length){qb.classList.remove("hidden");qb.textContent="目标："+q[0].text;}
  else qb.classList.add("hidden");
}
function locName(){
  const c=cityNear(S.x,S.y,80);
  if(c)return c.name;
  const r=regionAt(S.x,S.y);
  return r?r.name:"荒野";
}

/* ---------- Toast ---------- */
function toast(msg,kind){
  const el=document.createElement("div");
  el.className="toast"+(kind?" "+kind:"");
  el.textContent=msg;
  $("toastRoot").appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .4s";setTimeout(()=>el.remove(),420)},2600);
}

/* ---------- 通用弹窗 ---------- */
let modalStack=[];
function openModal(html,cls){
  const mask=document.createElement("div");mask.className="modal-mask";
  const m=document.createElement("div");m.className="modal panel"+(cls?" "+cls:"");
  m.innerHTML=html;
  mask.appendChild(m);
  $("modalRoot").appendChild(mask);
  mask.addEventListener("pointerdown",e=>{if(e.target===mask&&!mask.dataset.lock)closeModal(mask)});
  modalStack.push(mask);
  return {mask,body:m};
}
function closeModal(mask){
  if(!mask){mask=modalStack.pop();}
  else{const i=modalStack.indexOf(mask);if(i>=0)modalStack.splice(i,1);}
  if(mask)mask.remove();
}
function closeAllModals(){while(modalStack.length)modalStack.pop().remove();}
function modalTitle(t,close=true){
  return '<h3>'+t+(close?'<span class="x" onclick="closeAllModals()">关闭</span>':'')+'</h3>';
}
/* ---------- NPC 实例化 ---------- */
let npcInstances=[];
let facInstances=[];
function buildEntities(){
  npcInstances=[];facInstances=[];
  const rng=mulberry32(12345);
  const anyPool=[];
  NPCS.forEach(n=>{
    if(n.city==="any"){anyPool.push(n);return;}
    const c=CITY_MAP[n.city];if(!c)return;
    const ang=rng()*Math.PI*2, rad=26+rng()*40;
    npcInstances.push({npc:n,x:c.px+Math.cos(ang)*rad,y:c.py+Math.sin(ang)*rad,t:rng()*10});
  });
  /* 任意NPC分配到各城市 */
  CITIES.forEach(c=>{
    if(anyPool.length===0)return;
    const n=anyPool[Math.floor(rng()*anyPool.length)];
    const ang=rng()*Math.PI*2,rad=24+rng()*36;
    npcInstances.push({npc:n,x:c.px+Math.cos(ang)*rad,y:c.py+Math.sin(ang)*rad,t:rng()*10});
  });
  /* 设施 */
  const FDIRS=[["inn",-46,-26],["shop",46,-26],["train",0,-50],["bounty",-46,28],["doc",46,28],["gamble",-20,52],["black",20,52],["port",0,66]];
  CITIES.forEach(c=>{
    const slots=[];
    FDIRS.forEach(f=>{if(c.facSet[f[0]])slots.push({fac:f[0],x:c.px+f[1],y:c.py+f[2]});});
    slots.forEach(s=>{
      let x=s.x,y=s.y;
      if(!isPassable(x,y)){x=c.px;y=c.py-20;}
      facInstances.push({city:c.id,fac:s.fac,x,y});
    });
  });
}

/* 触屏摇杆 */
const pad=$("touchPad"),tk=$("tk");
pad.addEventListener("pointerdown",e=>{
  GS.touch.active=true;GS.touch.id=e.pointerId;
  const r=pad.getBoundingClientRect();
  GS.touch.ox=r.left+r.width/2;GS.touch.oy=r.top+r.height/2;
  tk.style.left="41px";tk.style.top="41px";
  pad.setPointerCapture(e.pointerId);
});
pad.addEventListener("pointermove",e=>{
  if(!GS.touch.active)return;
  let dx=e.clientX-GS.touch.ox, dy=e.clientY-GS.touch.oy;
  const d=Math.hypot(dx,dy),max=40;
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  GS.touch.dx=dx/max;GS.touch.dy=dy/max;
  tk.style.left=(41+dx)+"px";tk.style.top=(41+dy)+"px";
});
pad.addEventListener("pointerup",e=>{GS.touch.active=false;GS.touch.dx=0;GS.touch.dy=0;tk.style.left="41px";tk.style.top="41px";});

/* ---------- 移动 ---------- */
function moveInput(){
  let dx=0,dy=0;
  if(KEYMAP["KeyW"]||KEYMAP["ArrowUp"])dy-=1;
  if(KEYMAP["KeyS"]||KEYMAP["ArrowDown"])dy+=1;
  if(KEYMAP["KeyA"]||KEYMAP["ArrowLeft"])dx-=1;
  if(KEYMAP["KeyD"]||KEYMAP["ArrowRight"])dx+=1;
  if(GS.touch.active&&(Math.abs(GS.touch.dx)>0.18||Math.abs(GS.touch.dy)>0.18)){dx=GS.touch.dx;dy=GS.touch.dy;}
  const len=Math.hypot(dx,dy);
  if(len<0.001)return {x:0,y:0,moving:false};
  dx/=len;dy/=len;
  const run=KEYMAP["ShiftLeft"]||KEYMAP["ShiftRight"];
  const sp=(run?150:88)*(S.energy<8?0.7:1);
  return {x:dx*sp,y:dy*sp,moving:true};
}
function tryMove(dt){
  const m=moveInput();
  if(!m.moving){S.energy=Math.min(100,S.energy+dt*0.35);return;}
  const steps=2;
  const px=m.x*dt/steps,py=m.y*dt/steps;
  for(let i=0;i<steps;i++){
    const nx=S.x+px,ny=S.y+py;
    const nx2=S.x+px,ny2=S.y;
    if(isPassable(nx2,ny2))S.x=nx2;
    if(isPassable(nx,ny))S.y=ny;
    else if(isPassable(nx2,ny))S.y=ny;
  }
  S.energy-=dt*0.11;
  /* 探索标记 */
  const tx=clamp(Math.floor(S.x/TILE),0,MAP_W-1),ty=clamp(Math.floor(S.y/TILE),0,MAP_H-1);
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
    const gx=tx+dx,gy=ty+dy;
    if(gx<0||gx>=MAP_W||gy<0||gy>=MAP_H)continue;
    const i=gy*MAP_W+gx;
    if(WORLD.explored[i]<3)WORLD.explored[i]=3;
  }
  GS.minimapDirty=true;
  /* 随机遭遇 */
  rollEncounter();
}
let encounterAcc=0;
function rollEncounter(){
  if(GS.battle||modalStack.length)return;
  if(S.mode==="story"&&S.storyFlags.safeTravel)return;
  const t=tileAt(S.x,S.y);
  if(t===TER.CITY||t===TER.ROAD&&false){} 
  const base=t===TER.FOREST?0.05:t===TER.DESERT?0.035:t===TER.PLAIN?0.028:t===TER.HILL?0.03:t===TER.SWAMP?0.04:t===TER.TUNDRA?0.02:t===TER.SNOW?0.018:0.012;
  encounterAcc+=base*1.6;
  if(encounterAcc>1){
    encounterAcc=0;
    if(Math.random()<0.55)return;
    const g=encounterGroup();
    if(g)startBattle(g);
  }
}
function encounterGroup(){
  const c=cityNear(S.x,S.y,140);
  const r=regionAt(S.x,S.y);
  const cl=regionClimate(S.region);
  const lvl=S.level;
  const pool=[];
  if(cl==="cold")pool.push("wolf","wolves","refugee_guard","deserter");
  else if(cl==="hot")pool.push("hyena","scorpion","bandit","bandit_gun");
  else pool.push("bandit","bandit","deserter","wolf","boar");
  if(lvl>=3&&Math.random()<0.3)pool.push("bandit_gun","thug");
  if(lvl>=6&&Math.random()<0.25)pool.push("patrol");
  const eid=pool[Math.floor(Math.random()*pool.length)];
  const e=ENEMIES[eid];
  return [{id:eid,name:e.name,hp:e.hp*(1+ (lvl-1)*0.06),maxhp:e.hp*(1+(lvl-1)*0.06),atk:e.atk+Math.floor((lvl-1)*0.4),def:e.def,spd:e.spd,exp:e.exp,money:e.money,n:e.n||1}];
}

/* ---------- 生存 ---------- */
function survivalTick(realDt){
  const gm=realDt*3; /* 游戏分钟 */
  S.hunger=Math.max(0,S.hunger-gm*0.32);
  S.thirst=Math.max(0,S.thirst-gm*0.42);
  if(GS.temp>30)S.thirst=Math.max(0,S.thirst-gm*0.5);
  if(GS.weather==="沙尘")S.thirst=Math.max(0,S.thirst-gm*0.45);
  if(S.hunger<=0){S.hp-=gm*0.35;if(Math.floor(S.hunger)===0&&Math.random()<0.02)toast("你饿得头晕眼花","bad");}
  if(S.thirst<=0){S.hp-=gm*0.5;if(Math.random()<0.02)toast("脱水，嘴唇干裂","bad");}
  const warm=S.equip.armor&&["coat","armor_cloth","armor_leather"].includes(S.equip.armor);
  if(GS.temp<0&&!warm){S.energy-=gm*0.25;if(Math.random()<0.01)toast("寒风刺骨","bad");}
  checkDeath("饥渴与严寒");
}
function checkDeath(reason){
  if(S&&S.hp<=0){
    S.hp=0;S.deaths++;
    GS.deathReason=reason||"未知原因";
    GS.paused=true;
    openDeathScreen();
  }
}
function heal(n){S.hp=Math.min(S.maxhp,S.hp+n)}
function eat(id,qty){
  const it=ITEMS[id];if(!it)return;
  if(it.type==="food"){S.hunger=Math.min(100,S.hunger+it.val);toast("吃下"+it.name,"good");}
  else if(it.type==="drink"){S.thirst=Math.min(100,S.thirst+it.val);toast("喝下"+it.name,"good");}
  else if(it.type==="med"){heal(it.heal||0);toast("使用"+it.name,"good");}
  else {toast("这个不能直接使用","bad");return;}
  addItem(id,-1);
}
function addItem(id,qty){
  qty=qty||1;
  const it=ITEMS[id];if(!it)return;
  const slot=S.inv.find(x=>x.id===id);
  if(slot)slot.qty+=qty;
  else S.inv.push({id,qty});
  if(S.inv.filter(x=>x.qty<=0).length){S.inv=S.inv.filter(x=>x.qty>0);}
  if(qty>0)updateHUD();
}
function hasItem(id,qty){qty=qty||1;const s=S.inv.find(x=>x.id===id);return s&&s.qty>=qty}
function removeItem(id,qty){addItem(id,-(qty||1));}
function itemCount(id){const s=S.inv.find(x=>x.id===id);return s?s.qty:0}

/* ---------- 战斗结算（通用） ---------- */
function gainExp(n){
  S.exp+=n;
  while(S.exp>=needExp()){
    S.exp-=needExp();S.level++;
    S.maxhp+=6;S.hp=S.maxhp;
    S.atk+=1;S.def+=1;
    toast("等级提升！现在是 "+S.level+" 级","good");
    updateHUD();
  }
}
function needExp(){return Math.floor(60*Math.pow(S.level,1.25))}
function pAtk(){return S.atk+(ITEMS[S.equip.weapon]?ITEMS[S.equip.weapon].atk||0:0)+(S.statBonus.atk||0)}
function pDef(){return S.def+(ITEMS[S.equip.armor]?ITEMS[S.equip.armor].def||0:0)+(S.statBonus.def||0)}
function pSpd(){return S.spd+(S.statBonus.spd||0)}

/* ---------- 睡眠与扎营 ---------- */
function campMenu(){
  const c=cityNear(S.x,S.y,90);
  if(c){openInnMenu(c);return;}
  openModal(modalTitle("野外扎营")+
    '<p>找一处背风处休息。没有帐篷的话，露宿会降低体力恢复，还有遭遇野兽的风险。</p>'+
    '<div class="row" style="justify-content:center;flex-direction:column;align-items:stretch;gap:8px">'+
    '<button class="btn" onclick="doCamp(true)">扎营休息（8小时）</button>'+
    '<button class="btn ghost" onclick="wildSearch()">在附近搜索物资（约1小时）</button>'+
    '<button class="btn ghost" onclick="closeAllModals()">取消</button></div>');
}
function wildSearch(){
  closeAllModals();
  S.minute+=60;
  while(S.minute>=1440){S.minute-=1440;S.day++;S.daysAlive++;}
  GS.dayRolled=false;
  S.energy=Math.max(0,S.energy-14);
  if(Math.random()<0.22){
    toast("搜索时惊动了野兽！","bad");
    startBattle([{id:"wolf",name:"野狼",hp:16,atk:5,def:0,spd:12,exp:8,money:[1,3],n:Math.random()<0.4?2:1}]);
    return;
  }
  const tbl=[["herb",0.28],["meat",0.2],["fish",0.16],["ammo",0.12],["cloth",0.1],["iron",0.06],["bread",0.16]];
  let got="";
  const r=Math.random();
  let acc=0,id="herb";
  for(const [iid,p] of tbl){acc+=p;if(r<=acc){id=iid;break;}}
  addItem(id,1);
  got=ITEMS[id].name;
  if(Math.random()<0.12){const i2=pick(Math.random,["herb","meat","water"]);addItem(i2,1);got+="、"+ITEMS[i2].name;}
  toast("搜索一番，找到："+got,"good");
  updateHUD();
}
function doCamp(useTent){
  const hasTent=hasItem("tent");
  const risk=hasTent?0.18:0.4;
  closeAllModals();
  if(Math.random()<risk){
    toast("夜晚有动静……","bad");
    const g=[{id:"wolf",name:"野狼",hp:16,atk:5,def:0,spd:12,exp:8,money:[1,3],n:Math.random()<0.5?2:1}];
    setTimeout(()=>startBattle(g),300);
    return;
  }
  sleep(8,hasTent?0.9:0.5);
}
function sleep(hours,quality){
  S.minute+=hours*60;
  while(S.minute>=1440){S.minute-=1440;S.day++;S.daysAlive++;}
  S.hp=Math.min(S.maxhp,S.hp+Math.floor(S.maxhp*0.5*quality));
  S.energy=Math.min(100,S.energy+55*quality);
  S.hunger=Math.max(0,S.hunger-6);
  S.thirst=Math.max(0,S.thirst-8);
  GS.dayRolled=false;
  toast("你睡了 "+hours+" 小时","good");
  updateHUD();
}

/* ---------- 交互 ---------- */
let nearNpc=null,nearFac=null;
function findNear(){
  nearNpc=null;nearFac=null;
  let bdN=52,bdF=44;
  for(const n of npcInstances){
    const d=dist2(S.x,S.y,n.x,n.y);
    if(d<bdN){bdN=d;nearNpc=n;}
  }
  for(const f of facInstances){
    const d=dist2(S.x,S.y,f.x,f.y);
    if(d<bdF){bdF=d;nearFac=f;}
  }
  const hint=$("hudHint");
  if(nearNpc&&nearFac){
    hint.textContent="E 交谈："+nearNpc.npc.name+" · E 使用："+FAC_NAME[nearFac.fac];
  }else if(nearNpc){
    hint.textContent="E 交谈："+nearNpc.npc.name+"（"+(nearNpc.npc.role||"路人")+"）";
  }else if(nearFac){
    hint.textContent="E 使用："+FAC_NAME[nearFac.fac];
  }else{
    const c=cityNear(S.x,S.y,70);
    hint.textContent=c?("位于"+c.name+" · 城内可住宿/购物/乘车"):"方向键移动 · Shift 奔跑 · E 交互 · B 扎营/住宿";
  }
}
function tryInteract(){
  if(GS.mode!=="game"||GS.battle)return;
  if(modalStack.length)return;
  findNear();
  if(nearNpc){interactNpc(nearNpc);return;}
  if(nearFac){useFacility(nearFac);return;}
  /* 城内兜底菜单 */
  const c=cityNear(S.x,S.y,90);
  if(c){openCityMenu(c);}
}
function useFacility(f){
  const c=CITY_MAP[f.city];
  switch(f.fac){
    case "inn":openInnMenu(c);break;
    case "shop":openShopMenu(c);break;
    case "train":openTrainMenu(c);break;
    case "bounty":openBountyMenu(c);break;
    case "doc":openDocMenu(c);break;
    case "gamble":openGambleMenu(c);break;
    case "black":openBlackMenu(c);break;
    case "port":openPortMenu(c);break;
  }
}
function openCityMenu(c){
  openModal(modalTitle(c.name)+
    '<p class="muted">'+c.desc+'</p>'+
    '<div class="row" style="justify-content:center;margin-top:10px">'+
    (c.facSet.inn?'<button class="btn" onclick="openInnMenu(CITY_MAP[\''+c.id+'\'])">旅馆</button>':'')+
    (c.facSet.shop?'<button class="btn" onclick="openShopMenu(CITY_MAP[\''+c.id+'\'])">商铺</button>':'')+
    (c.facSet.train?'<button class="btn" onclick="openTrainMenu(CITY_MAP[\''+c.id+'\'])">车站</button>':'')+
    (c.facSet.bounty?'<button class="btn" onclick="openBountyMenu(CITY_MAP[\''+c.id+'\'])">悬赏栏</button>':'')+
    (c.facSet.doc?'<button class="btn" onclick="openDocMenu(CITY_MAP[\''+c.id+'\'])">医馆</button>':'')+
    (c.facSet.gamble?'<button class="btn" onclick="openGambleMenu(CITY_MAP[\''+c.id+'\'])">赌场</button>':'')+
    (c.facSet.black?'<button class="btn" onclick="openBlackMenu(CITY_MAP[\''+c.id+'\'])">黑市</button>':'')+
    (c.facSet.port?'<button class="btn" onclick="openPortMenu(CITY_MAP[\''+c.id+'\'])">港口</button>':'')+

/* ---------- 渲染 ---------- */
const CV=$("cv"),CX=CV.getContext("2d");
let titleT=0,particles=[];
function initParticles(){
  particles=[];
  const n=120;
  for(let i=0;i<n;i++)particles.push({x:Math.random()*1280,y:Math.random()*720,vx:(Math.random()-0.5)*60,vy:30+Math.random()*60,kind:"dust"});
}
function drawWorld(){
  const cam=GS.cam;
  const x0=Math.floor(cam.x/TILE),y0=Math.floor(cam.y/TILE);
  const x1=Math.min(MAP_W-1,Math.ceil((cam.x+1280)/TILE)),y1=Math.min(MAP_H-1,Math.ceil((cam.y+720)/TILE));
  const ter=WORLD.ter,exp=WORLD.explored;
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const i=ty*MAP_W+tx;
      const t=ter[i];
      let col=TER_COL[t];
      /* 微变化 */
      const h=hash2(tx,ty);
      const v=0.92+h*0.16;
      let r=parseInt(col.slice(1,3),16)*v, g=parseInt(col.slice(3,5),16)*v, b=parseInt(col.slice(5,7),16)*v;
      const px=tx*TILE-cam.x,py=ty*TILE-cam.y;
      if(exp[i]<1){r*=0.28;g*=0.28;b*=0.3;}
      CX.fillStyle="rgb("+(r|0)+","+(g|0)+","+(b|0)+")";
      CX.fillRect(px,py,TILE,TILE);
      if(t===TER.WATER&&exp[i]>=1){
        CX.fillStyle="rgba(255,255,255,"+(0.03+h*0.05)+")";
        CX.fillRect(px,py+((h*7)|0)%6,TILE,1.5);
      }
      if(t===TER.FOREST&&exp[i]>=1&&h>0.5){
        CX.fillStyle="rgba(20,40,15,0.25)";
        CX.fillRect(px+4,py+6,3,4);CX.fillRect(px+9,py+8,3,4);
      }
      if(t===TER.SNOW&&exp[i]>=1&&h>0.6){
        CX.fillStyle="rgba(255,255,255,0.5)";
        CX.fillRect(px+((h*9)|0)%14,py+((h*13)|0)%14,3,2);
      }
      if(t===TER.DESERT&&exp[i]>=1&&h>0.62){
        CX.fillStyle="rgba(140,110,50,0.3)";
        CX.beginPath();CX.arc(px+((h*11)|0)%14,py+((h*7)|0)%13,1.4,0,7);CX.fill();
      }
    }
  }
  /* 区域名标签（大块） */
  if(GS.zoomLabels!==false){
    const drawn=new Set();
    for(let ty=y0;ty<=y1;ty+=6)for(let tx=x0;tx<=x1;tx+=6){
      const i=ty*MAP_W+tx;const ri=WORLD.reg[i];
      if(ri===255||drawn.has(ri))continue;
      const r=REGIONS[ri];
      /* 找该区域中心 */
      drawn.add(ri);
      const cx=tx*TILE+TILE*3-cam.x,cy=ty*TILE-cam.y;
      if(cx>-200&&cx<1480&&cy>-100&&cy<820){
        CX.font="bold 11px 'Noto Serif SC',serif";
        CX.fillStyle="rgba(39,33,26,0.55)";
        CX.textAlign="center";
        CX.fillText(r.name,cx,cy);
      }
    }
  }
  /* 设施图标 */
  for(const f of facInstances){
    const sx=f.x-cam.x,sy=f.y-cam.y;
    if(sx<-30||sx>1310||sy<-30||sy>750)continue;
    const tx=Math.floor(f.x/TILE),ty=Math.floor(f.y/TILE);
    if(WORLD.explored[ty*MAP_W+tx]<1)continue;
    const near=GS.mode==="game"&&dist2(S.x,S.y,f.x,f.y)<50;
    CX.fillStyle=near?"rgba(185,138,47,0.95)":"rgba(74,63,48,0.85)";
    CX.fillRect(sx-9,sy-9,18,18);
    CX.strokeStyle="rgba(233,221,191,0.8)";CX.lineWidth=1;
    CX.strokeRect(sx-9,sy-9,18,18);
    CX.fillStyle="#F2E8CF";CX.font="bold 11px 'Noto Serif SC',serif";CX.textAlign="center";CX.textBaseline="middle";
    CX.fillText(FAC_GLYPH[f.fac],sx,sy+1);
    if(near){CX.strokeStyle="rgba(233,221,191,0.5)";CX.beginPath();CX.arc(sx,sy,16+(titleT%40)/6,0,7);CX.stroke();}
  }
  /* NPC */
  for(const n of npcInstances){
    const sx=n.x-cam.x,sy=n.y-cam.y;
    if(sx<-40||sx>1320||sy<-40||sy>760)continue;
    const near=GS.mode==="game"&&dist2(S.x,S.y,n.x,n.y)<52;
    drawFigure(sx,sy,facCol(n.npc.f),near,false);
    if(near){
      CX.fillStyle="#27211A";CX.font="bold 12px 'Noto Serif SC',serif";CX.textAlign="center";
      CX.fillText(n.npc.name,sx,sy-24);
      CX.strokeStyle="rgba(163,59,46,0.7)";CX.beginPath();CX.arc(sx,sy,20+(titleT%50)/8,0,7);CX.stroke();
    }
  }
  /* 同伴跟随 */
  if(GS.mode==="game"&&S){
    const comps=S.comps||[];
    comps.forEach((cid,i)=>{
      const cd=COMPANIONS[cid];if(!cd)return;
      const off=40+i*16;
      const sx=S.x-cam.x-Math.cos(titleT*0.6+i*1.3)*0, sy=S.y-cam.y;
      const fx=S.x-cam.x+off*Math.cos(0.6+i*1.2)-off*0.4, fy=S.y-cam.y+off*Math.sin(0.6+i*1.2)*0.7;
      drawFigure(fx,fy,"#4E6B3A",false,true);
      CX.fillStyle="rgba(233,221,191,0.85)";CX.font="10px 'Noto Serif SC',serif";CX.textAlign="center";
      CX.fillText(cd.name,fx,fy-24);
    });
  }
  /* 玩家 */
  if(GS.mode==="game"&&S){
    const sx=S.x-cam.x,sy=S.y-cam.y;
    drawFigure(sx,sy,"#A33B2E",true,false);
    CX.fillStyle="#F2E8CF";CX.font="bold 12px 'Noto Serif SC',serif";CX.textAlign="center";
    CX.fillText(S.name,sx,sy-26);
    /* 玩家光标环 */
    CX.strokeStyle="rgba(233,221,191,0.4)";CX.lineWidth=2;
    CX.beginPath();CX.arc(sx,sy,13+Math.sin(titleT*2)*2,0,7);CX.stroke();
  }
  /* 浮动文字 */
  for(const f of GS.floating){
    const sx=f.x-cam.x,sy=f.y-cam.y-f.t*26;
    CX.globalAlpha=Math.max(0,1-f.t);
    CX.fillStyle=f.col;CX.font="bold 14px 'Noto Serif SC',serif";CX.textAlign="center";
    CX.fillText(f.txt,sx,sy);
    CX.globalAlpha=1;
  }
}
function facCol(f){
  const m={imperial:"#7A6A52",ottoman:"#B08A4E",white:"#7E7260",japan:"#C8B4A0",allies:"#5E7C8C",people:"#4E6B3A",black:"#5A4E3D"};
  return m[f]||"#4E6B3A";
}
function drawFigure(sx,sy,col,near,small){
  CX.save();
  CX.fillStyle=col;
  CX.beginPath();CX.arc(sx,sy-7,5.5,0,7);CX.fill();          /* 头 */
  CX.fillRect(sx-6,sy-2,12,13);                               /* 身 */
  CX.fillStyle="rgba(0,0,0,0.25)";
  CX.fillRect(sx-6,sy-2,12,3);
  if(near){CX.strokeStyle="rgba(233,221,191,0.9)";CX.lineWidth=2;CX.beginPath();CX.arc(sx,sy-7,9,0,7);CX.stroke();}
  CX.restore();
}
function drawOverlays(){
  /* 昼夜 */
  const h=S?S.minute/60:12;
  let dark=0;
  if(h<6){dark=0.55- h/12;}
  else if(h>19){dark=(h-19)/7*0.6;}
  else if(h>21)dark=0.5;
  if(GS.weather==="雨"||GS.weather==="雪"||GS.weather==="沙尘")drawWeather();
  if(dark>0){
    CX.fillStyle="rgba(8,10,26,"+dark+")";
    CX.fillRect(0,0,1280,720);
  }
  /* 暗角 */
  const vg=CX.createRadialGradient(640,360,260,640,360,900);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,"rgba(0,0,0,0.5)");
  CX.fillStyle=vg;CX.fillRect(0,0,1280,720);
  /* 季节色罩 */
  const m=S?gameDate().m:10;
  if(m>=10||m<=1){CX.fillStyle="rgba(120,140,170,0.06)";CX.fillRect(0,0,1280,720);}
  else if(m>=5&&m<=8){CX.fillStyle="rgba(180,150,80,0.05)";CX.fillRect(0,0,1280,720);}
}
function drawWeather(){
  const n=GS.weather==="雨"?90:GS.weather==="雪"?70:60;
  if(particles.length!==n)initWeather(n);
  for(const p of particles){
    if(GS.weather==="雨"){
      CX.strokeStyle="rgba(150,180,210,0.45)";CX.lineWidth=1;
      CX.beginPath();CX.moveTo(p.x,p.y);CX.lineTo(p.x-2,p.y+10);CX.stroke();
    }else if(GS.weather==="雪"){
      CX.fillStyle="rgba(240,245,250,0.7)";
      CX.beginPath();CX.arc(p.x,p.y,1.6,0,7);CX.fill();
    }else{
      CX.strokeStyle="rgba(200,170,110,0.35)";CX.lineWidth=1;
      CX.beginPath();CX.moveTo(p.x,p.y);CX.lineTo(p.x-12,p.y+3);CX.stroke();
    }
  }
}
function initWeather(n){
  particles=[];
  for(let i=0;i<n;i++)particles.push({x:Math.random()*1280,y:Math.random()*720,vx:(Math.random()-0.5)*80,vy:140+Math.random()*160});
}
function stepWeather(dt){
  if(!(GS.weather==="雨"||GS.weather==="雪"||GS.weather==="沙尘"))return;
  const n=GS.weather==="雨"?90:GS.weather==="雪"?70:60;
  if(particles.length!==n)initWeather(n);
  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.y>740){p.y=-10;p.x=Math.random()*1280;}
    if(p.x>1300)p.x=-10;
    if(p.x<-10)p.x=1300;
  }
}
/* ---------- 小地图 ---------- */
function drawMinimap(){
  const mc=$("minimap"),mx=mc.getContext("2d");
  mx.clearRect(0,0,392,208);
  if(!WORLD)return;
  const sw=392/MAP_W,sh=208/MAP_H;
  for(let ty=0;ty<MAP_H;ty+=2)for(let tx=0;tx<MAP_W;tx+=2){
    const i=ty*MAP_W+tx;
    const t=WORLD.ter[i];
    if(t===TER.WATER){mx.fillStyle="rgba(46,74,99,0.85)";}
    else{
      const ri=WORLD.reg[i];
      mx.fillStyle=ri===255?"#4a4436":REGIONS[ri].col;
      if(WORLD.explored[i]<1)mx.fillStyle="rgba(20,17,12,0.82)";
    }
    mx.fillRect(tx*sw,ty*sh,sw+0.5,sh+0.5);
  }
  /* 城市点 */
  mx.fillStyle="#F2E8CF";
  for(const c of CITIES){
    mx.fillRect(c.x*sw-1.5,c.y*sh-1.5,3,3);
  }
  /* 玩家 */
  if(GS.mode==="game"&&S){
    mx.fillStyle="#E0472E";
    mx.beginPath();mx.arc(S.x/WORLD_W*392,S.y/WORLD_H*208,3.2,0,7);mx.fill();
    mx.strokeStyle="#F2E8CF";mx.lineWidth=1;
    mx.strokeRect(Math.max(0,S.x/WORLD_W*392-40),Math.max(0,S.y/WORLD_H*208-22),80,44);
  }
}
/* ---------- 主循环 ---------- */
let rafId=0,lastT=0;
function loop(t){
  rafId=requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000||0.016);
  lastT=t;
  if(GS.mode==="title"){titleT+=dt;stepWeather(dt);renderTitle(dt);return;}
  if(GS.mode!=="game")return;
  if(GS.paused){render();return;}
  update(dt);
  render();
}
function update(dt){
  titleT+=dt;
  stepWeather(dt);
  if(GS.battle)return;
  if(modalStack.length>0){render();return;}
  advanceTime(dt);
  survivalTick(dt);
  tryMove(dt);
  const rr=regionAt(S.x,S.y);if(rr)S.region=REGION_MAP[rr.id];
  findNear();
  updateFloating(dt);
  storyTick();
  updateHUD();
}
function render(){
  if(!WORLD)return;
  if(GS.mode==="game"&&S){
    GS.cam.x=clamp(S.x-640,0,Math.max(0,WORLD_W-1280));
    GS.cam.y=clamp(S.y-360,0,Math.max(0,WORLD_H-720));
  }
  CX.save();
  CX.clearRect(0,0,1280,720);
  drawWorld();
  drawOverlays();
  CX.restore();
  if(GS.minimapDirty){drawMinimap();GS.minimapDirty=false;}
}
function renderTitle(dt){
  if(!WORLD){WORLD=buildWorld(7);WORLD.explored=new Uint8Array(WORLD.ter.length);}
  GS.cam={x:titleT*12%WORLD_W,y:titleT*3%WORLD_H};
  CX.save();
  CX.clearRect(0,0,1280,720);
  drawWorld();
  drawOverlays();
  CX.restore();
}
function updateFloating(dt){
  GS.floating=GS.floating.filter(f=>{f.t+=dt;return f.t<1});
}
function addFloat(x,y,txt,col){
  GS.floating.push({x,y,txt:txt||"",col:col||"#F2E8CF",t:0});
}
/* ---------- 对话系统 ---------- */
function interactNpc(n){
  if(storyNpcTouched(n.npc.id))return;
  const npc=n.npc;
  let html=modalTitle(npc.name)+'<div class="dlg-name">'+npc.name+'<span class="role"> · '+npc.role+'</span></div>';
  const comp=npc.comp?COMPANIONS[npc.comp]:null;
  const joined=comp&&(S.comps||[]).includes(npc.comp);
  const lines=npc.talk||["……"];
  html+='<div class="dlg-text">'+lines[(S.day+npc.id.length)%lines.length]+'</div>';
  html+='<div class="dlg-choices">';
  (npc.opts||[]).forEach((o,i)=>{
    if(o.k==="companion"){
      if(joined){html+='<button class="btn ghost" onclick="companionChat(\''+npc.comp+'\')">与同伴交谈</button>';}
      else{html+='<button class="btn" onclick="tryJoin(\''+npc.comp+'\')">邀请同行</button>';}
      return;
    }
    html+='<button class="btn ghost" onclick="npcOpt(\''+npc.id+'\','+i+')">'+o.t+'</button>';
  });
  html+='<button class="btn olive" onclick="closeAllModals()">离开</button>';
  html+='</div>';
  openModal(html);
}
function npcOpt(npcId,i){
  const n=NPCS.find(x=>x.id===npcId);if(!n)return;
  const o=n.opts[i];if(!o)return;
  switch(o.k){
    case "lore":{
      const m=openModal(modalTitle(n.name)+'<div class="dlg-name">'+n.name+'</div><div class="dlg-text">'+o.lines.join("<br><br>")+'</div>'+
        '<div class="row" style="justify-content:flex-end"><button class="btn" onclick="interactNpcById(\''+npcId+'\')">继续交谈</button></div>');
      break;}
    case "shop":openTrade(npcId,o.stock,1);break;
    case "black":openTrade(npcId,o.stock,2);break;
    case "job":doLaborJob(n);break;
    case "doc":{
      const cost=o.cost||12;
      if(S.money<cost){toast("钱不够","bad");break;}
      S.money-=cost;heal(o.heal||60);
      toast("治疗后感觉好多了","good");updateHUD();
      closeAllModals();break;}
    case "train":{
      const cost=o.cost||25;
      if(S.money<cost){toast("学费不够","bad");break;}
      S.money-=cost;if(o.atk)S.statBonus.atk=(S.statBonus.atk||0)+1;
      if(o.spd)S.statBonus.spd=(S.statBonus.spd||0)+1;
      toast("训练结束，能力提升","good");updateHUD();
      closeAllModals();break;}
    case "info":{
      const cost=o.cost||15;
      if(S.money<cost){toast("钱不够","bad");break;}
      S.money-=cost;
      const m=openModal(modalTitle("情报")+'<div class="dlg-text">'+o.lines.join("<br><br>")+'</div>'+
        '<div class="row" style="justify-content:flex-end"><button class="btn" onclick="interactNpcById(\''+npcId+'\')">继续交谈</button></div>');
      updateHUD();break;}
    case "drink":{
      const cost=o.cost||8;
      if(S.money<cost){toast("钱不够","bad");break;}
      S.money-=cost;S.energy=Math.min(100,S.energy+(o.energy||40));
      toast("畅饮一番，精神焕发","good");updateHUD();
      closeAllModals();break;}
    case "pray":{
      S.energy=Math.min(100,S.energy+(o.energy||30));
      toast("内心平静下来","good");updateHUD();
      closeAllModals();break;}
    case "donate":{
      if(S.money<o.cost){toast("钱不够","bad");break;}
      S.money-=o.cost;S.rep[o.rep||"people"]=(S.rep[o.rep||"people"]||5)+3;
      toast("对方感激不尽（声望+3）","good");updateHUD();
      closeAllModals();break;}
    case "beg":{
      if(!hasItem(o.item||"bread")){toast("你没有可施舍的食物","bad");break;}
      removeItem(o.item||"bread",1);S.rep.people=(S.rep.people||5)+2;
      toast("老人千恩万谢（民间声望+2）","good");updateHUD();
      closeAllModals();break;}
    case "check":{
      if(hasItem("passport")){toast("证件有效，放行","good");closeAllModals();}
      else if(hasItem("fakeid")){
        if(Math.random()<0.4){toast("伪造证件被识破！","bad");fineOrFight(n);}
        else{toast("侥幸蒙混过关……","good");closeAllModals();}
      }else{fineOrFight(n);}
      break;}
    case "bribe":{
      if(S.money<30){toast("你掏不出钱","bad");break;}
      S.money-=30;S.rep.black=(S.rep.black||5)+2;
      toast("宪兵收下钱，放你过去","good");updateHUD();
      closeAllModals();break;}
    case "fight":{
      closeAllModals();
      startBattle([{id:"patrol",name:"帝国巡逻队",hp:34,atk:11,def:3,spd:9,exp:20,money:[10,25],n:2}]);
      break;}
    default:closeAllModals();
  }
}
function fineOrFight(n){
  const m=openModal(modalTitle("宪兵检查")+'<p>你被拦下了。宪兵队长上下打量你：“证件呢？没有？要么交罚款，要么……跟我们去兵营谈谈。”</p>'+
    '<div class="row" style="justify-content:center"><button class="btn" onclick="payFine()">交罚款 25 马克</button>'+
    '<button class="btn danger" onclick="closeAllModals();startBattle([{id:\'patrol\',name:\'帝国巡逻队\',hp:34,atk:11,def:3,spd:9,exp:20,money:[10,25],n:2}])">反抗</button></div>');
}
function payFine(){
  if(S.money<25){toast("钱不够，只能硬闯了","bad");closeAllModals();startBattle([{id:"patrol",name:"帝国巡逻队",hp:34,atk:11,def:3,spd:9,exp:20,money:[10,25],n:2}]);return;}
  S.money-=25;closeAllModals();toast("罚款 25 马克","bad");updateHUD();
}
function interactNpcById(id){
  const n=npcInstances.find(x=>x.npc.id===id);
  if(n)interactNpc(n);
  else{const nn=NPCS.find(x=>x.id===id);if(nn)openModal(modalTitle(nn.name)+'<div class="dlg-text">'+nn.talk[0]+'</div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAllModals()">离开</button></div>');}
}
function doLaborJob(n){
  const pay=8+Math.floor(Math.random()*10)+(n.city==="shanghai"?3:0);
  S.money+=pay;S.energy=Math.max(0,S.energy-22);
  toast("干完一天的苦力，挣得 "+pay+" 马克","good");
  if(Math.random()<0.12){const drop=pick(Math.random,["bread","water","cloth","iron","herb"]);addItem(drop,1);toast("顺手捡到："+ITEMS[drop].name,"good");}
  updateHUD();
  closeAllModals();
}

/* ---------- 同伴 ---------- */
function tryJoin(cid){
  const c=COMPANIONS[cid];if(!c)return;
  const j=c.join;
  const miss=[];
  for(const k in j.rep){if((S.rep[k]||0)<j.rep[k])miss.push(REP_NAMES[k]+" 需"+j.rep[k]);}
  if(j.item&&!hasItem(j.item))miss.push("需要："+ITEMS[j.item].name);
  if(j.money&&S.money<j.money)miss.push("需要 "+j.money+" 马克");
  if(miss.length){
    const m=openModal(modalTitle(c.name)+'<p>'+c.name+'摇了摇头：“'+miss.join("；")+'。”</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAllModals()">好吧</button></div>');
    return;
  }
  if(j.item)removeItem(j.item,1);
  if(j.money)S.money-=j.money;
  S.comps=S.comps||[];
  S.comps.push(cid);
  S.rep.people=(S.rep.people||5)+2;
  const m=openModal(modalTitle("新同伴！")+'<div class="dlg-name">'+c.name+'<span class="role"> · '+c.role+'</span></div>'+
    '<div class="dlg-text">'+j.text+'</div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAllModals()">欢迎入队</button></div>');
  toast(c.name+" 加入了队伍","good");
  updateHUD();
}
function companionChat(cid){
  const c=COMPANIONS[cid];
  const hp=S.compHp?S.compHp[cid]:c.stats.hp;
  const m=openModal(modalTitle(c.name)+'<div class="dlg-name">'+c.name+'<span class="role"> · '+c.role+'</span></div>'+
    '<div class="dlg-text">'+c.talk+'</div>'+
    '<div class="row"><span class="muted">生命 '+Math.max(0,hp)+'/'+c.stats.hp+' · 特技：'+c.skill+'</span></div>'+
    '<div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="dismissComp(\''+cid+'\')">让TA离开</button><button class="btn" onclick="closeAllModals()">继续</button></div>');
}
function dismissComp(cid){
  S.comps=S.comps.filter(x=>x!==cid);
  closeAllModals();
  toast(COMPANIONS[cid].name+" 离开了队伍","bad");
  updateHUD();
}

/* ---------- 交易 ---------- */
function cityPriceMod(c){
  return 0.85+hash2(c.x,c.y)*0.45;
}
let tradeCtx=null;
function openTrade(npcId,stock,mode){
  const n=NPCS.find(x=>x.id===npcId);
  tradeCtx={title:(n?n.name:"交易")+(mode===2?" · 黑市":" · 交易"),stock:stock||["bread"],mode};
  cityTradePanel(tradeCtx);
}
function openShopMenu(c){
  tradeCtx={title:c.name+" · 商铺",mode:1,
    stock:["bread","rice","fish","stew","water","tea","coffee","bandage","kit","ammo","cloth","lantern","shovel","fishing","tent","coat","dagger","armor_cloth"]};
  cityTradePanel(tradeCtx);
}
function openBlackMenu(c){
  tradeCtx={title:c.name+" · 黑市",mode:2,
    stock:["opium","silk","fakeid","ammo","rifle_ammo","wine","radio","coffee","brandy","cigar","jewelry","passport"]};
  cityTradePanel(tradeCtx);
}
function cityTradePanel(ctx){
  const c=cityNear(S.x,S.y,200);
  const mod=ctx.mode===2?0.68+hash2(c?c.x:0,c?c.y:0)*0.3:cityPriceMod(c||{x:S.x,y:S.y});
  let html=modalTitle(ctx.title)+
    '<p class="muted">'+(ctx.mode===2?"黑市的价格浮动大，风险自担。":"本地行情：出售价按市价六成。")+'</p>'+
    '<div class="row"><b>购买：</b></div><div class="it-grid">';
  ctx.stock.forEach(id=>{
    const it=ITEMS[id];if(!it)return;
    const price=Math.max(1,Math.round(it.price*mod));
    html+='<div class="it-card" onclick="tradeBuy(\''+id+'\','+price+')"><b>'+it.name+'</b><span>'+descShort(it)+'</span><span class="qty">'+price+' 马克</span></div>';
  });
  html+='</div><div class="row" style="margin-top:10px"><b>出售（我的物品）：</b></div><div class="it-grid">';
  S.inv.forEach(s=>{
    const it=ITEMS[s.id];
    if(!it||it.price<=0)return;
    if(it.type==="quest")return;
    const sell=Math.max(1,Math.round(it.price*0.55));
    html+='<div class="it-card" onclick="tradeSell(\''+s.id+'\','+sell+')"><b>'+it.name+'</b><span>持有 '+s.qty+'</span><span class="qty">'+sell+' 马克</span></div>';
  });
  html+='</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn olive" onclick="closeAllModals()">结束交易</button></div>';
  openModal(html);
}
function descShort(it){return (it.desc||"").slice(0,26)}
function tradeBuy(id,price){
  if(S.money<price){toast("钱不够","bad");return;}
  S.money-=price;addItem(id,1);
  toast("购入 "+ITEMS[id].name,"good");
  updateHUD();
  if(tradeCtx)cityTradePanel(tradeCtx);
}
function tradeSell(id,sell){
  if(itemCount(id)<=0)return;
  removeItem(id,1);S.money+=sell;
  toast("卖出 "+ITEMS[id].name+" +"+sell+" 马克","good");
  updateHUD();
  if(tradeCtx)cityTradePanel(tradeCtx);
}

/* ---------- 车站（快速旅行） ---------- */
function railReach(cid){
  const out=[];
  RAILS.forEach(p=>{
    if(p[0]===cid&&CITY_MAP[p[1]])out.push(p[1]);
    if(p[1]===cid&&CITY_MAP[p[0]])out.push(p[0]);
  });
  return out;
}
function openTrainMenu(c){
  const reach=railReach(c.id);
  let html=modalTitle(c.name+" · 车站")+'<p class="muted">帝国铁路时刻表。列车准点得令人不安。</p>';
  if(!reach.length){html+='<p>这个车站没有直达线路。</p>';}
  else{
    html+='<div class="row"><b>目的地：</b></div><div class="row">';
    reach.forEach(did=>{
      const d=CITY_MAP[did];
      const dist=Math.round(dist2(c.x,c.y,d.x,d.y)/60);
      const cost=Math.max(3,Math.round(dist*0.12));
      html+='<button class="btn" style="min-width:130px" onclick="takeTrain(\''+c.id+'\',\''+did+'\','+cost+')">'+d.name+'<br><span style="font-size:10px;font-weight:400">'+dist+'站 · '+cost+' 马克</span></button>';
    });
    html+='</div>';
  }
  html+='<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn olive" onclick="closeAllModals()">离开</button></div>';
  openModal(html);
}
function takeTrain(from,to,cost){
  if(S.money<cost){toast("车票买不起","bad");return;}
  S.money-=cost;
  const d=CITY_MAP[to];
  S.x=d.px;S.y=d.py;S.minute+=180;
  while(S.minute>=1440){S.minute-=1440;S.day++;S.daysAlive++;}
  GS.dayRolled=false;GS.minimapDirty=true;
  closeAllModals();
  toast("列车抵达 "+d.name,"good");
  updateHUD();
  onArriveCity(to);
}

  S.money-=cost;
  if(full){S.hp=S.maxhp;S.hunger=Math.max(S.hunger,60);S.thirst=Math.max(S.thirst,60);}
  else heal(Math.floor(S.maxhp*0.5));
  toast("治疗完成","good");closeAllModals();updateHUD();
}

function gamble(bet){
  if(S.money<bet){toast("你连押注的钱都没有","bad");return;}
  S.money-=bet;
  const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6),d3=1+Math.floor(Math.random()*6);
  const sum=d1+d2+d3,big=sum>=11;
  const guess=Math.random()<0.5;
  const win=guess===big;
  if(win){S.money+=bet*2;toast("骰子 "+d1+" "+d2+" "+d3+" = "+sum+"，你赢了 "+bet*2+" 马克！","good");}
  else{toast("骰子 "+d1+" "+d2+" "+d3+" = "+sum+"，你输了 "+bet+" 马克","bad");}
  updateHUD();
  closeAllModals();
  openGambleMenu(cityNear(S.x,S.y,200));
}

function genBounties(c){
  const r=regionAt(c.x,c.y);
  const cl=regionClimate(S.region);
  const pool=cl==="cold"?[["wolves",3,45],["wolf",5,30],["deserter",2,55]]:cl==="hot"?[["hyena",4,35],["bandit",3,50],["scorpion",5,30]]:[["bandit",3,50],["wolf",4,35],["boar",2,45]];
  const out=[];
  for(let i=0;i<3;i++){
    const p=pool[Math.floor(Math.random()*pool.length)];
    const e=ENEMIES[p[0]];
    out.push({type:"bounty",enemy:p[0],text:"消灭 "+e.name+" ×"+p[1],count:p[1],reward:p[2]+(S.level-1)*8,kills:0,city:c.id});
  }
  return out;
}
function acceptBounty(o){
  o.id="b"+Date.now()+Math.floor(Math.random()*999);
  S.quests.push(o);
  toast("接下通缉："+o.text,"good");
  closeAllModals();
}
function claimBounty(id){
  const q=S.quests.find(x=>x.id===id);
  if(!q)return;
  S.money+=q.reward;
  q.done=true;
  S.rep.people=(S.rep.people||5)+2;
  toast("赏金到手 "+q.reward+" 马克","good");
  updateHUD();
  closeAllModals();
  openBountyMenu(cityNear(S.x,S.y,200));
}
/* 击杀计数 */
function onKill(enemyName){
  S.kills=(S.kills||0)+1;
  S.quests.filter(q=>!q.done&&q.type==="bounty"&&ENEMIES[q.enemy].name===enemyName).forEach(q=>q.kills=(q.kills||0)+1);
  S.quests.filter(q=>!q.done&&q.type==="hunt"&&ENEMIES[q.target].name===enemyName).forEach(q=>q.kills=(q.kills||0)+1);
}
/* 到达城市事件 */
function onArriveCity(cid){
  S.quests.filter(q=>!q.done&&q.type==="escort"&&q.city===cid).forEach(q=>{
    q.done=true;S.money+=q.reward;S.rep.people=(S.rep.people||5)+3;
    toast("护送完成，报酬 "+q.reward+" 马克","good");updateHUD();
  });
  storyTick();
}
/* ---------- 战斗系统 ---------- */
function makeEnemy(e){
  const n=e.n||1;
  const out=[];
  for(let i=0;i<n;i++){
    out.push({id:e.id+(n>1?"#"+(i+1):""),name:e.name+(n>1?" "+"甲乙丙丁戊".charAt(i):""),hp:e.hp,maxhp:e.hp,atk:e.atk,def:e.def,spd:e.spd+(Math.random()*2|0),exp:e.exp,money:e.money,done:false,weaken:0});
  }
  return out;
}
function startBattle(group){
  closeAllModals();
  const party=[{name:S.name,hp:S.hp,maxhp:S.maxhp,atk:pAtk(),def:pDef(),spd:pSpd()+Math.floor(Math.random()*3),isPlayer:true,usedBao:false,aim:false}];
  (S.comps||[]).forEach(cid=>{
    const c=COMPANIONS[cid];
    const chp=(S.compHp||{})[cid];
    party.push({name:c.name,hp:chp!=null?chp:c.stats.hp,maxhp:c.stats.hp,atk:c.stats.atk,def:c.stats.def,spd:c.stats.spd,isPlayer:false,cid,skill:c.skill,usedBao:false,aim:false});
  });
  GS.battle={
    enemies:makeEnemy(group[0]),
    party, log:["——遭遇战——"], order:[], idx:0, over:false, ended:false,
    actPending:false, reward:null, storyWin:group[0].storyWin||null,
  };
  buildOrder();
  renderBattle();
  nextTurn();
}
function buildOrder(){
  const all=[];
  GS.battle.party.forEach(p=>all.push({who:"p",p}));
  GS.battle.enemies.forEach(e=>all.push({who:"e",e}));
  all.sort((a,b)=>bSpeed(b)-bSpeed(a));
  GS.battle.order=all;
  GS.battle.idx=0;
}
function bSpeed(o){return o.who==="p"?o.p.spd:o.e.spd}
function currentUnit(){return GS.battle.order[GS.battle.idx]}
function bLog(t){GS.battle.log.push(t);if(GS.battle.log.length>40)GS.battle.log.shift();}
function nextTurn(){
  const b=GS.battle;
  if(b.over||b.ended)return;
  /* 清理死亡 */
  b.enemies=b.enemies.filter(e=>!e.done);
  b.party=b.party.filter(p=>p.hp>0);
  if(!b.enemies.length){battleWin();return;}
  if(!b.party.length){battleLose();return;}
  buildOrder();
  const u=currentUnit();
  b.actPending=false;
  if(u.who==="p"){
    if(u.p.isPlayer)renderBattle(); /* 等待玩家操作 */
    else setTimeout(()=>compAct(u.p),420);
  }else{
    setTimeout(()=>enemyAct(u.e),520);
  }
}
function renderBattle(){
  const b=GS.battle;
  if(!b)return;
  if(GS.battleModal){closeModal(GS.battleModal);GS.battleModal=null;}
  let eh="";
  b.enemies.forEach(e=>{
    const pct=Math.max(0,e.hp/e.maxhp*100);
    eh+='<div class="b-enemy"><b>'+e.name+'</b><div class="hpbar"><i style="width:'+pct+'%"></i></div><span class="st">'+Math.max(0,Math.ceil(e.hp))+'/'+e.maxhp+'</span></div>';
  });
  let ph="";
  b.party.forEach(p=>{
    const pct=Math.max(0,p.hp/p.maxhp*100);
    ph+='<div class="b-pc"><b>'+p.name+(p.isPlayer?" <span style=\"color:#A33B2E\">◆</span>":"")+'</b><div class="hpbar" style="height:8px;background:#17110B;border-radius:2px;margin-top:5px;overflow:hidden"><i style="display:block;height:100%;width:'+pct+'%;background:linear-gradient(180deg,#8FA87C,#4C6340)"></i></div><span class="st">'+Math.max(0,Math.ceil(p.hp))+'/'+p.maxhp+'</span></div>';
  });
  let acts='';
  if(!b.over&&!b.ended){
    const u=currentUnit();
    if(u&&u.who==="p"&&u.p.isPlayer){
      const w=ITEMS[S.equip.weapon];
      acts='<div class="battle-acts">'+
        '<button class="btn" onclick="bAttack()">攻击'+(w&&w.name?'（'+w.name+'）':'')+'</button>'+
        '<button class="btn" onclick="bSkill(0)"'+(u.p.usedBao?' disabled':'')+'>包扎</button>'+
        '<button class="btn" onclick="bSkill(1)">瞄准</button>'+
        '<button class="btn" onclick="bSkill(2)">猛击</button>'+
        '<button class="btn" onclick="bItem()">道具</button>'+
        '<button class="btn danger" onclick="bFlee()">逃跑</button></div>';
    }else if(u&&u.who==="p"){
      acts='<p class="muted" style="text-align:center">'+u.p.name+' 正在行动……</p>';
    }else{
      acts='<p class="muted" style="text-align:center">敌人行动中……</p>';
    }
  }
  const m=openModal(
    '<div class="battle-hero">遭遇战</div>'+
    '<div class="battle-enemies">'+eh+'</div>'+
    '<div class="battle-party">'+ph+'</div>'+
    '<div class="battle-log">'+b.log.map(l=>l).join("<br>")+'</div>'+
    acts,
    "modal-battle");
  m.mask.dataset.lock="1";
  GS.battleModal=m.mask;
  const logEl=m.body.querySelector(".battle-log");
  if(logEl)logEl.scrollTop=logEl.scrollHeight;
}
function bAttack(){
  const u=currentUnit();if(!u||u.who!=="p"||!u.p.isPlayer)return;
  playerAttack(u.p,1);
}
function playerAttack(p,mult){
  const b=GS.battle;
  const w=ITEMS[S.equip.weapon];
  let atk=p.atk;
  if(w&&w.ammo){
    if(hasItem(w.ammo)){removeItem(w.ammo,1);}
    else{atk=p.atk;bLog("（"+p.name+" 的"+w.name+"没有弹药，只能用拳头）");}
  }
  if(p.aim){atk=Math.floor(atk*1.8);p.aim=false;bLog(p.name+" 的瞄准生效！");}
  const t=aliveEnemy();
  if(!t){return;}
  const dmg=Math.max(1,Math.round(atk*(0.85+Math.random()*0.3)-t.def*0.5));
  t.hp-=dmg;
  bLog(p.name+" 攻击 "+t.name+"，造成 <span class='hl'>"+dmg+"</span> 伤害");
  addFloat(S.x,S.y-30,"-"+dmg,"#F2E8CF");
  if(t.hp<=0){t.done=true;bLog(t.name+" 倒下了！");}
  endAct();
}
function aliveEnemy(){return GS.battle.enemies.find(e=>!e.done)}
function aliveParty(){return GS.battle.party.find(p=>p.hp>0)}
function bSkill(k){
  const u=currentUnit();if(!u||u.who!=="p"||!u.p.isPlayer)return;
  const p=u.p;
  if(k===0){ /* 包扎 */
    if(p.usedBao){return;}
    p.usedBao=true;
    const heal=Math.min(p.maxhp-p.hp,Math.floor(p.maxhp*0.35));
    p.hp+=heal;
    bLog(p.name+" 包扎伤口，恢复 <span class='hl'>"+heal+"</span> 生命");
  }else if(k===1){ /* 瞄准 */
    p.aim=true;
    bLog(p.name+" 屏息凝神，下一击将造成重创");
  }else{ /* 猛击 */
    const t=aliveEnemy();
    if(t){
      const dmg=Math.max(1,Math.round(p.atk*1.35*(0.85+Math.random()*0.3)-t.def*0.5));
      t.hp-=dmg;
      bLog(p.name+" 奋力猛击 "+t.name+"，造成 <span class='hl'>"+dmg+"</span> 伤害");
      if(t.hp<=0){t.done=true;bLog(t.name+" 倒下了！");}
    }
  }
  endAct();
}
function bItem(){
  const m=openModal(modalTitle("使用道具")+'<div class="it-grid">');
  let html=m.body.innerHTML;
  let any=false;
  S.inv.forEach(s=>{
    const it=ITEMS[s.id];
    if(!it||(it.type!=="food"&&it.type!=="drink"&&it.type!=="med"))return;
    any=true;
    html+='<div class="it-card" onclick="bUseItem(\''+s.id+'\')"><b>'+it.name+'</b><span>'+descShort(it)+'</span><span class="qty">×'+s.qty+'</span></div>';
  });
  if(!any)html+='<p class="muted">没有可用的补给品</p>';
  m.body.innerHTML=html;
}
function bUseItem(id){
  const it=ITEMS[id];
  const u=currentUnit();if(!u||u.who!=="p"){closeAllModals();return;}
  const p=u.p;
  if(it.type==="food"){S.hunger=Math.min(100,S.hunger+it.val);p.hp=Math.min(p.maxhp,p.hp+Math.floor(it.val*0.3));}
  else if(it.type==="drink"){S.thirst=Math.min(100,S.thirst+it.val);p.hp=Math.min(p.maxhp,p.hp+Math.floor(it.val*0.2));}
  else if(it.type==="med"){p.hp=Math.min(p.maxhp,p.hp+(it.heal||0));}
  removeItem(id,1);
  bLog(p.name+" 使用了 "+it.name);
  closeAllModals();
  endAct();
}
function bFlee(){
  const b=GS.battle;
  if(b.storyWin){bLog("这是命运之战，你无法逃离。");return;}
  const avgSpd=b.enemies.reduce((s,e)=>s+e.spd,0)/b.enemies.length;
  const chance=clamp(0.35+(pSpd()-avgSpd)*0.03,0.15,0.8);
  if(Math.random()<chance){
    bLog("你成功脱离了战斗！");
    endBattle(true);
  }else{
    bLog("逃跑失败！");
    endAct();
  }
}
function endAct(){
  const b=GS.battle;
  if(b.over||b.ended)return;
  GS.battle.idx=(GS.battle.idx+1)%GS.battle.order.length;
  nextTurn();
}
function compAct(p){
  const b=GS.battle;
  if(b.over||b.ended)return;
  const t=aliveEnemy();
  if(!t){nextTurn();return;}
  const dmg=Math.max(1,Math.round(p.atk*(0.85+Math.random()*0.3)-t.def*0.5));
  t.hp-=dmg;
  bLog(p.name+" 攻击 "+t.name+"，造成 <span class='hl'>"+dmg+"</span> 伤害");
  if(t.hp<=0){t.done=true;bLog(t.name+" 倒下了！");}
  renderBattle();
  endAct();
}
function enemyAct(e){
  const b=GS.battle;
  if(b.over||b.ended)return;
  const p=aliveParty();
  if(!p){nextTurn();return;}
  let dmg=Math.max(1,Math.round(e.atk*(0.85+Math.random()*0.3)-p.def*0.6));
  if(e.weaken>0){dmg=Math.floor(dmg*0.7);e.weaken--;}
  p.hp-=dmg;
  bLog(e.name+" 攻击 "+p.name+"，造成 <span class='hl'>"+dmg+"</span> 伤害");
  if(p.hp<=0){
    p.hp=0;
    bLog(p.name+" 倒下了！");
    if(p.isPlayer){battleLose();return;}
  }
  renderBattle();
  endAct();
}
function battleWin(){
  const b=GS.battle;
  if(b.over)return;
  b.over=true;
  const exp=b.enemies.reduce((s,e)=>s+e.exp,0);
  const money=b.enemies.reduce((s,e)=>s+(e.money?Math.floor(e.money[0]+Math.random()*(e.money[1]-e.money[0])):0),0);
  bLog("战斗胜利！获得经验 "+exp+", 马克 "+money);
  const drops=[];
  if(Math.random()<0.3)drops.push("herb");
  if(Math.random()<0.2)drops.push("bread");
  if(Math.random()<0.15)drops.push("ammo");
  if(Math.random()<0.1)drops.push("cloth");
  if(Math.random()<0.08)drops.push("iron");
  if(Math.random()<0.05)drops.push("wine");
  b.reward={exp,money,drops};
  GS.battle.reward=b.reward;
  setTimeout(()=>{
    gainExp(exp);
    S.money+=money;
    drops.forEach(d=>addItem(d,1));
    b.enemies.forEach(e=>onKill(e.name.replace(/[甲乙丙丁戊]$/,"")));
    const compHp=S.compHp=S.compHp||{};
    b.party.forEach(p=>{if(p.cid)compHp[p.cid]=p.hp;});
    S.hp=b.party.find(p=>p.isPlayer).hp;
    renderBattleResult(true);
  },600);
}
function battleLose(){
  const b=GS.battle;
  if(b.over)return;
  b.over=true;
  const compHp=S.compHp=S.compHp||{};
  b.party.forEach(p=>{if(p.cid)compHp[p.cid]=Math.max(0,p.hp);});
  S.hp=0;
  GS.deathReason="战斗失败";
  setTimeout(()=>{
    GS.battle=null;
    closeAllModals();
    openDeathScreen();
  },700);
}
function renderBattleResult(win){
  const b=GS.battle;if(!b)return;
  let html='<div class="battle-hero" style="border-color:'+(win?'var(--olive)':'var(--blood)')+'">'+(win?"战斗胜利":"战斗失败")+'</div>';
  if(win){
    html+='<p>经验 +'+b.reward.exp+'　马克 +'+b.reward.money+'</p>';
    if(b.reward.drops.length)html+='<p class="muted">战利品：'+b.reward.drops.map(d=>ITEMS[d].name).join("、")+'</p>';
  }
  html+='<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="endBattle(false)">继续冒险</button></div>';
  closeAllModals();
  openModal(html);
}
function endBattle(fled){
  const b=GS.battle;
  if(b&&!b.ended){
    b.ended=true;
    if(b.storyWin){GS.storyWin=true;}
    if(!fled){
      const compHp=S.compHp=S.compHp||{};
      b.party.forEach(p=>{if(p.cid)compHp[p.cid]=p.hp;});
      const pl=b.party.find(p=>p.isPlayer);
      if(pl)S.hp=pl.hp;
    }
  }
  GS.battle=null;
  encounterAcc=0;
  closeAllModals();
  if(S.hp<=0){GS.deathReason="战斗失利";openDeathScreen();return;}
  updateHUD();
  if(b&&b.storyWin){/* 剧情战斗胜利后的延续由 storyTick 处理 */}
}
/* ---------- 物品栏 / 装备 ---------- */

  let html=modalTitle("物品 · 装备")+
    '<div class="row"><b>装备：</b></div><div class="row">'+

    html+='<div class="it-card" onclick="itemDetail(\''+s.id+'\')"><span class="tag">'+tag+'</span><b>'+it.name+'</b><span>'+descShort(it)+'</span><span class="qty">×'+s.qty+'</span></div>';

function itemDetail(id){
  const it=ITEMS[id];
  const s=S.inv.find(x=>x.id===id);
  if(!it||!s)return;
  let acts='';
  if(it.type==="food"||it.type==="drink"||it.type==="med"){
    acts+='<button class="btn" onclick="useFromInv(\''+id+'\')">使用</button>';
  }
  if(it.type==="weapon")acts+='<button class="btn" onclick="equipWeapon(\''+id+'\')">装备</button>';
  if(it.type==="armor")acts+='<button class="btn" onclick="equipArmor(\''+id+'\')">穿上</button>';
