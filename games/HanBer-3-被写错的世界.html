    '<div class="it-detail"><b>'+it.name+'</b>　<span class="muted">持有 ×'+s.qty+'</span><br>'+it.desc+
    (it.atk?'<br>攻击 +'+it.atk:'')+(it.def?'<br>防御 +'+it.def:'')+(it.heal?'<br>回复 '+it.heal:'')+
    (it.price?'<br>参考市价 '+it.price+' 马克':'')+'</div>'+
    '<div class="row" style="justify-content:flex-end">'+acts+'<button class="btn ghost" onclick="openInventory()">返回</button></div>');
}
function useFromInv(id){
  eat(id,1);
  closeAllModals();
  openInventory();
}
function equipWeapon(id){
  if(S.equip.weapon)S.inv.push({id:S.equip.weapon,qty:1});
  S.equip.weapon=id;
  const s=S.inv.find(x=>x.id===id);if(s)s.qty-=1;
  S.inv=S.inv.filter(x=>x.qty>0);
  toast("装备 "+ITEMS[id].name,"good");
  closeAllModals();openInventory();
}
function equipArmor(id){
  if(S.equip.armor)S.inv.push({id:S.equip.armor,qty:1});
  S.equip.armor=id;
  const s=S.inv.find(x=>x.id===id);if(s)s.qty-=1;
  S.inv=S.inv.filter(x=>x.qty>0);
  toast("穿上 "+ITEMS[id].name,"good");
  closeAllModals();openInventory();
}
function dropItem(id){
  removeItem(id,1);
  toast("丢弃了 1 份"+ITEMS[id].name,"bad");
  closeAllModals();openInventory();
}

/* ---------- 队伍 ---------- */
function openParty(){
  let html=modalTitle("队伍")+
    '<div class="entry"><b>'+S.name+'（主角）</b><span>Lv.'+S.level+'　生命 '+Math.ceil(S.hp)+'/'+S.maxhp+'　攻击 '+pAtk()+'　防御 '+pDef()+'　速度 '+pSpd()+'</span></div>';

let journalTab="main";
function openJournal(){
  const tabs=[["main","主线"],["faction","势力"],["comp","人物"],["anom","残响档案"],["chapters","更新日志"]];
  let html=modalTitle("日志 · 图鉴")+'<div class="journal-tabs">'+
    tabs.map(t=>'<button class="btn small '+(journalTab===t[0]?"":"ghost")+'" onclick="journalSwitch(\''+t[0]+'\')">'+t[1]+'</button>').join("")+
    '</div><div id="journalBody"></div>';
  const m=openModal(html,"modal-journal");
  journalRender();
}
function journalSwitch(t){journalTab=t;journalRender();}
function journalRender(){
  const body=document.getElementById("journalBody");
  if(!body)return;
  let h="";
  if(journalTab==="main"){
    const entries=S.journal||[];
    if(!entries.length)h+='<p class="muted">还没有日志。你的故事从旅程开始。</p>';
    entries.forEach((e,i)=>{h+='<div class="entry'+(i===entries.length-1?" new":"")+'"><b>'+e.t+'</b><span>'+e.d+'</span></div>';});
  }else if(journalTab==="faction"){
    Object.keys(LORE_FACTIONS).forEach(k=>{
      const f=LORE_FACTIONS[k];
      h+='<div class="entry"><b>'+f.n+'</b><span>'+f.t+'</span></div>';
    });
  }else if(journalTab==="comp"){
    Object.keys(COMPANIONS).forEach(k=>{
      const c=COMPANIONS[k];
      const joined=(S.comps||[]).includes(k);
      h+='<div class="entry'+(joined?" new":"")+'"><b>'+c.name+(joined?"（同行中）":"")+'</b><span>'+c.role+'<br>'+c.desc+'</span></div>';
    });
  }else if(journalTab==="anom"){
    LORE_ANOMALY.forEach(a=>{h+='<div class="entry"><b>'+a.t+'</b><span>'+a.d+'</span></div>';});
  }else if(journalTab==="chapters"){
    h+='<p class="muted">主线十二卷 · 每月更新一卷（1933.11—1934.10）</p><div class="chapter-list">';
    CHAPTERS.forEach(ch=>{
      const done=S.chapter>ch.num||S.chapter===ch.num&&S.chapterStep>=ch.steps.length;
      const cur=S.chapter===ch.num;
      h+='<div class="ch-item '+(done?"done":cur?"":"locked")+'"><b>第'+ch.num+'卷 · '+ch.meta.title+(done?' <span class="st">完</span>':cur?' <span class="st">进行中</span>':' <span class="st">未解锁</span>')+'</b><span>'+ch.meta.month+' · '+ch.meta.loc+'<br>'+ch.meta.teaser+'</span></div>';
    });
    h+='</div>';
  }
  body.innerHTML=h;
}
function addJournal(t,d){
  S.journal=S.journal||[];
  if(!S.journal.find(e=>e.t===t))S.journal.push({t,d});
}

/* ---------- 世界地图 ---------- */
function openMap(){
  const m=openModal(modalTitle("世界地图 · 1933年（欧亚非大陆）")+'<canvas id="mapCanvas" width="820" height="410" style="width:100%"></canvas>'+
    '<div class="legend-line"><span class="swatch" style="background:#7A6A52"></span>德意志帝国　<span class="swatch" style="background:#B08A4E"></span>奥斯曼　<span class="swatch" style="background:#7E7260"></span>白俄　<span class="swatch" style="background:#C8B4A0"></span>日本　<span class="swatch" style="background:#5E7C8C"></span>协约残余　<span class="swatch" style="background:#A89A6A"></span>中国势力圈　<span class="swatch" style="background:#2E4A63"></span>海洋</div>'+
    '<div class="row" style="justify-content:flex-end"><button class="btn olive" onclick="closeAllModals()">关闭</button></div>',"map-panel");
  const mc=$("mapCanvas");
  const mx=mc.getContext("2d");
  const sx=mc.width/MAP_W, sy=mc.height/MAP_H;
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    const i=ty*MAP_W+tx;
    const t=WORLD.ter[i];
    if(t===TER.WATER)mx.fillStyle="#2E4A63";
    else{
      const ri=WORLD.reg[i];
      mx.fillStyle=ri===255?"#4a4436":REGIONS[ri].col;
    }
    mx.fillRect(tx*sx,ty*sy,sx+0.5,sy+0.5);
  }
  mx.strokeStyle="rgba(30,20,10,0.6)";mx.lineWidth=1;
  CITIES.forEach(c=>{
    mx.fillStyle="#F2E8CF";
    mx.beginPath();mx.arc(c.x*sx,c.y*sy,2,0,7);mx.fill();
  });
  mx.font="9px 'Noto Sans SC',sans-serif";mx.fillStyle="rgba(30,24,16,0.85)";mx.textAlign="center";
  CITIES.forEach(c=>{if(c.t>=2)mx.fillText(c.name,c.x*sx,c.y*sy-5);});
  if(S){
    mx.fillStyle="#E0472E";
    mx.beginPath();mx.arc(S.x/WORLD_W*mc.width,S.y/WORLD_H*mc.height,3.5,0,7);mx.fill();
  }
  mc.addEventListener("click",e=>{
    const r=mc.getBoundingClientRect();
    const mxp=(e.clientX-r.left)/r.width*mc.width;
    const myp=(e.clientY-r.top)/r.height*mc.height;
    let best=null,bd=8;
    CITIES.forEach(c=>{
      const d=Math.hypot(c.x/WORLD_W*mc.width-mxp,c.y/WORLD_H*mc.height-myp);
      if(d<bd){bd=d;best=c;}
    });
    if(best){
      const dist=Math.round(dist2(S.x,S.y,best.px,best.py)/60);
      toast(best.name+" · 距离约 "+dist+" 站","good");
    }
  });
}

          '<button class="btn small ghost" onclick="saveSlot('+i+')">覆盖</button>'+
          '<button class="btn small danger" onclick="deleteSave('+i+')">删除</button></div></div>';
      }catch(e){

  {k:"text",head:"第一卷 · 黄铜信笺",date:"1933年11月1日 · 上海",
   pages:[
    ["","一九三三年十一月一日，上海，德租界。苏州河的水是铅灰色的，海关大钟指着下午四点——可那只钟，已经慢了十七分钟。"],
    ["","你叫汉伯。父亲是德国铁路工程师汉伯二世，母亲林慧兰是这条街上有名的中医。父亲民国十六年去西伯利亚考察铁路，一去不回。母亲半年前病倒，如今躺在面馆后屋，药石无用。"],
    ["梅婶","“汉伯，你娘今天的药……唉，别愣着了，你爹的老宅，房东又来催租了。他说要是月底再交不上，就把你爹那些破箱子扔进苏州河。”"],
    ["","你回到父亲留下的老宅。木箱积灰，里面是图纸、罗盘、几封旧信——和一封崭新的、火漆完好的信。信封上的邮戳让你后颈发凉：一九三四年四月七日。"],
    ["","你撕开信。笔迹是父亲的，可信里的字，正在你眼前缓缓地、一点点地变化——像是墨水还活着。"]],
   foot:"“汉伯，我是你父亲。如果你读到这封信，说明时间线还没有彻底崩溃。不要相信柏林派来的任何人。去莫斯科，找一只黄铜罗盘。它在你母亲手里。”"},
  {k:"give",items:[["letter",1]],note:"获得「未来的信」"},
  {k:"obj",note:"回面馆后屋，询问母亲",city:"shanghai"},
  {k:"talk",npc:"shen",scene:["沈医生","“你娘这病，脉象里带着寒气。她说不是风寒——是‘记性’坏了。她总念叨：‘我快把另一件事忘了，忘了我就不在了。’汉伯，你娘说，她见过你父亲回来过一次。就在上个月。”"],
   note:"与沈医生交谈"},
  {k:"talk",npc:"auntmei",scene:["梅婶","“你娘病倒前，把一样东西交给我收着——一只黄铜罗盘，指针不指北，指哪儿都没准头。她说等你满二十岁再给你。可她说，如果有一天，你收到一封‘明年’的信，就立刻把罗盘给你，并且让你——离开上海。”"],
   note:"与梅婶交谈，取回罗盘"},
  {k:"give",items:[["compass",1]],note:"获得「黄铜罗盘」"},
  {k:"text",head:"第一卷 · 黄铜信笺",date:"当晚",
   pages:[
    ["","罗盘在你掌心微微发烫。指针没有指向北方，而是固执地指着——苏州河对岸，那座废弃的教堂。"],
    ["","你穿过闸北的夜巷。教堂尖顶剪开铅灰色的天空，半掩的地窖门缝里漏出灯光。你听见有人在搬东西，用的是德语。"],
    ["","你推开门。三个穿黑大衣的人正在把木箱装上马车。为首的男人回头，脸上没有表情：“汉伯先生的儿子？来得正好。请把不属于这个世界的东西，交出来。”"]],
   foot:"“黄铜罗盘。还有你手里那封信。它们属于管理局——属于时间线的秩序。”"},
  {k:"battle",enemies:[{id:"thug",name:"码头打手",hp:28,atk:8,def:1,spd:9,exp:14,money:[8,16],n:2}],note:"击退黑大衣的打手"},
  {k:"text",head:"第一卷 · 黄铜信笺",date:"深夜",
   pages:[
    ["","你夺路而逃。黑大衣们在身后追赶，可他们没有开枪——仿佛忌惮着什么。老李的船就泊在苏州河上，他叼着烟卷朝你招手。"],
    ["老李","“快上船！那帮人是‘管理局’的，专管‘记性’。我说小子，你爹到底留了什么东西，值得他们半夜三更来抄家？”"],
    ["","船离岸时，你看见教堂的方向腾起火光。你的家——父亲的老宅——正在燃烧。火焰里，似乎有什么东西在倒着飘，像一卷被倒放的胶片。"],
    ["艾琳","“上帝啊——火是倒着烧的。我从没见过……不对，我在索姆河见过一次。战地医院里，一位士兵的怀表倒着走了三天，然后他死了，死前说：‘世界记错了，世界记错了。’”"]],
   foot:"第二天清晨，上海各大报纸头版：“闸北教堂大火，无人员伤亡”。只有你注意到，报纸角落有一条寻人启事：寻找工程师汉伯二世，如有消息，请往柏林档案局投递。"},
  {k:"end",next:2,suspense:"罗盘的指针转了一整圈，最后停在你自己的胸口。它指的不是教堂，不是柏林——是你。",
   pages:[
    ["","信还在你的口袋里。你借着火光又读了一遍。这一次，信尾多了一行字，字迹比你父亲的更年轻，也更潦草："],
    ["","“不要相信任何人。包括你。”"],
    ["","罗盘的指针微微颤动，指向东方——莫斯科的方向。西伯利亚铁路的汽笛，在雾气里长长地响了一声。"]]},
 ]},
/* ---------- 第二卷 逆流的列车 ---------- */
{num:2, meta:{title:"逆流的列车",month:"1933年12月",loc:"上海—莫斯科",teaser:"列车时刻表上，有一站不存在。",stamp:"残响·贰"},
 steps:[
  {k:"text",head:"第二卷 · 逆流的列车",date:"1933年12月 · 上海北站",
   pages:[
    ["","艾琳决定跟你同行。“反正我在远东也没什么牵挂。而且——我想再看看那种‘倒着走的时间’。它让我想起一个人。”"],
    ["","老李留在上海替你盯着管理局的动静。临行前他塞给你一张票：“西伯利亚快车，终点莫斯科。记住，过了乌兰乌德，有一站叫阿兰斯——不在时刻表上。列车长会提前把所有钟停掉。如果钟没停，你就别下车，闭上眼睛，数到一百。”"],
    ["","汽笛长鸣。列车碾过铁轨，向北，向西，向着欧亚大陆的深处驶去。三等车厢里挤满了流亡者、商人、退役军官——和一个裹着灰披风、一直在看一本倒拿着的书的男人。"]],
   foot:"列车驶入西伯利亚的第一夜，你发现窗外下着雪。可你明明记得，出发时还是深秋。"},
  {k:"obj",note:"在列车上四处走走（与乘客交谈）",city:"novosibirsk"},
  {k:"talk",npc:"beggar",scene:["老乞丐","“行行好，给口吃的吧。……噢，你闻起来像上海。我年轻时在凡尔赛当杂役，见过停战签字。可后来人人都说，签字的是柏林。他们烧了那支笔。可我记得——金笔，笔尖刻着‘1918.11.11’。”"],
   note:"与老乞丐交谈"},
  {k:"talk",npc:"katerina",scene:["卡捷琳娜","“站住。你的罗盘——哪儿来的？”她按住马刀，眼神锐利，“那是沃尔科夫家的东西。我祖父用它指挥骑兵团，1916年，在布加勒斯特。然后战争……变了。所有人都说是我们赢了。可我祖父的日记里写的是：我们输了。”"],
   note:"与灰披风的女子交谈"},
  {k:"battle",enemies:[{id:"assassin",name:"管理局特工",hp:40,atk:12,def:3,spd:12,exp:30,money:[10,25],n:1,storyWin:true}],note:"击退列车上的特工"},
  {k:"text",head:"第二卷 · 逆流的列车",date:"深夜 · 卧铺车厢",
   pages:[
    ["","特工被制服后，灰披风的女人摘下兜帽。她叫卡捷琳娜·沃尔科娃，白军退役中尉，正赶往莫斯科。“你父亲，”她说，“七年前在西伯利亚铁路失踪。可上个月，有人在莫斯科的旧货市场，看见一个酷似他的人，买走了半张铁路图。”"],
    ["卡捷琳娜","“那些黑大衣的，不只是冲你来的。他们在找‘会倒着走的东西’。而我——我欠沃尔科夫家族一个真相。让我同行，直到莫斯科。”"],
    ["","你答应了。窗外，雪越下越大。你掏出罗盘，它的指针正对着车尾——车尾的方向，是东方，是你来的地方。"],
    ["","列车员推着餐车经过，托盘上摆着热茶。他压低声音对你说：“先生，再过二十分钟，就是阿兰斯站。请把所有钟——包括您那只罗盘——收进包里。记住，不管听见什么，别往窗外看。”"]],
   foot:"列车开始减速。汽笛声在旷野里回响，像一声被拖长的叹息。"},
  {k:"choice",text:"列车驶入阿兰斯站。窗外一片漆黑，可你分明听见：马蹄声、炮声、还有成千上万人的呐喊，从黑暗里涌来。卡捷琳娜脸色苍白：“这是……布加勒斯特战役的声音。1916年。”",
   options:[
    {t:"闭上眼睛，数到一百（遵从列车员的警告）",to:8,set:{arans:"blind"}},
    {t:"睁开眼睛，看清窗外（真相在呼唤你）",to:9,set:{arans:"look"}}
   ]},
  {k:"text",head:"第二卷 · 逆流的列车",date:"阿兰斯站",
   pages:[
    ["","你闭上眼睛。黑暗里，声音仍在——冲锋号、马蹄、机枪的点射。你数到一百，声音戛然而止。列车重新加速，窗外是正常的风雪。"],
    ["卡捷琳娜","“你做得对。阿兰斯不是车站，是伤口。是这条时间线缝合最粗糙的地方。我祖父的日记说，他的骑兵团死在这里——可这个世界，没有这场战役的记载。他们把它‘烧掉’了。”"],
    ["","你睁开眼睛的瞬间，看见车窗玻璃上，有一张脸的倒影。那张脸年轻、陌生，可眉眼之间，与你惊人地相似。它对你笑了笑，然后消失了。"]],
   foot:"你不敢告诉任何人。那张脸——像是另一个你，从车窗的另一面，看着你。"},
  {k:"text",head:"第二卷 · 逆流的列车",date:"阿兰斯站",
   pages:[
    ["","你睁开眼。窗外的黑暗裂开一条缝——你看见了战场。没有雪，没有铁轨，只有1916年的布加勒斯特：燃烧的村庄，溃退的军队，以及一支不该存在的、举着铁十字旗的骑兵团——他们正举着枪，瞄准你。"],
    ["","你猛地闭上眼睛。可那一瞬的景象已经烙进视网膜。等列车驶过阿兰斯，你浑身冷汗，罗盘在口袋里滚烫——指针断了。"],
    ["艾琳","“你看见了什么？你的脸色——”她没问完。因为整个车厢的乘客，同时抬起头，看向车顶。所有人都听见了：头顶传来一声叹息，苍老，疲惫，像整个时代在喘气。”"]],
   foot:"罗盘的指针断了，可它仍在跳动——断口处的铜丝，在微微发光。"},
  {k:"end",next:3,suspense:"罗盘断针指向的，是莫斯科地底的某个坐标。而列车长在交班时，把一张泛黄的火车票塞进你手里——票面上印着两个日期：1917年3月8日，和1934年2月1日。",
   pages:[
    ["","列车在黎明时分驶入莫斯科。雪覆盖了红场，军政府的旗帜在风中猎猎作响。你握着断掉的罗盘，想起母亲说过的话：罗盘不会说谎，它只是不说人话。"],
    ["","卡捷琳娜站在你身边，轻声说：“欢迎来到莫斯科。这里的冬天，比任何敌人都残酷——除了记忆。”"],
    ["","远处，克里姆林宫的钟楼敲响了。钟声沉闷，像敲在一口空棺上。"]]},
 ]},
/* ---------- 第三卷 柏林之影 ---------- */
{num:3, meta:{title:"柏林之影",month:"1934年1月",loc:"莫斯科—柏林",teaser:"通缉令上的那张脸，与你一模一样——只是老了二十年。",stamp:"残响·叁"},
 steps:[
  {k:"text",head:"第三卷 · 柏林之影",date:"1934年1月 · 莫斯科",
   pages:[
    ["","莫斯科的白军档案局里，你终于找到了父亲的卷宗。照片上的汉伯二世戴着圆框眼镜，微笑温和。档案末尾有一行红字批注：『该员于1927年接受管理局任务，赴西伯利亚铁路执行时间锚点勘察，后因故失踪。档案封存。』"],
    ["卡捷琳娜","“时间锚点……果然是管理局。他们一直在找‘世界最初的钟声’。你父亲不是失踪——他是被管理局‘买’走的。”"],
    ["","你顺着档案的线索追查，发现父亲最后发回的电报，来自柏林——国会大厦地下的档案库。而你刚到柏林车站，就看见了月台上的通缉令。照片上的人叫『汉伯·冯·艾登』，帝国叛徒，赏金十万马克。那张脸，与你一模一样——只是老了二十年。"],
    ["","你低头压低帽檐。照片上的人，是你父亲的哥哥？还是……另一个时间线上的你？"]],
   foot:"柏林档案馆的门口，黑大衣的特工正在盘查每一个进出的身影。"},
  {k:"obj",note:"潜入柏林档案馆（东区侧门）",city:"berlin"},
  {k:"talk",npc:"gret",scene:["格蕾特","“先生？档案局九点开门——等等，你看上去……像一个人。那位冯·艾登先生，上个月来过，查阅了同一份卷宗：西伯利亚铁路阿兰斯站。他说那是他弟弟的旧档。可档案上的弟弟，1927年就死了。死人怎么会写信？”"],
   note:"与档案局文员交谈"},
  {k:"battle",enemies:[{id:"patrol",name:"帝国巡逻队",hp:34,atk:11,def:3,spd:9,exp:20,money:[12,26],n:2,storyWin:true}],note:"突破档案馆守卫"},
  {k:"text",head:"第三卷 · 柏林之影",date:"档案馆地下三层",
   pages:[
    ["","你撬开铁柜，找到了标记『时间锚点-E11』的卷宗。里面只有一张纸，纸上是一幅手绘的地图，画着七只罗盘的分布，和一条贯穿欧亚的虚线——虚线终点，在莫斯科，标着『原初节点』。"],
    ["","纸的背面，是父亲的字迹：“如果世界是一本书，那么我们所在的这一页，被人撕掉重写了。七只罗盘是书签，标记着被改写的地方。找到所有书签，才能翻开真正的那一页。”"],
    ["","你正要离开，档案室的门开了。走进来的人穿着黑大衣，袖口绣着一枚黄铜徽记。他看见你，先是一愣，然后缓缓笑了：“汉伯先生。或者说——冯·艾登先生的……侄子？有趣。你们家族，总是往不该去的地方钻。”"]],
   foot:"“我是克劳斯，管理局驻柏林办事处处长。你父亲曾是我最好的特工。直到他决定——‘看书’。”"},
  {k:"choice",text:"克劳斯没有拔枪，只是背着手，像在打量一件旧家具：“把罗盘交出来，我放你离开柏林。你的通缉令，我也可以撤销。怎么样？这是帝国最慷慨的价码了。”",
   options:[
    {t:"虚与委蛇，交出假罗盘，趁机脱身",to:6,set:{klaus:"deceive"}},
    {t:"拒绝，直面管理局的威压",to:7,set:{klaus:"defy"}}
   ]},
  {k:"text",head:"第三卷 · 柏林之影",date:"档案馆地下三层",
   pages:[
    ["","你从怀里摸出一只‘罗盘’——其实是旅馆房间里顺手拿的铜质烟灰缸。克劳斯接过去，掂了掂，笑容不变：“有意思。你父亲当年，也是用这一招骗过我的。”"],
    ["","就在他低头验货的瞬间，你掀翻档案柜，灰尘与纸张炸开。你冲出档案室，身后传来克劳斯平静的声音：“年轻人。你以为你在逃，其实你在赴约。”"],
    ["","你跑出档案馆，寒风扑面。通缉令在路灯下飘动，照片上那双与你一模一样的眼睛，正注视着你。"]],
   foot:"柏林一夜之间戒严。所有的出城列车，都在接受检查。"},
  {k:"text",head:"第三卷 · 柏林之影",date:"档案馆地下三层",
   pages:[
    ["","“我父亲为你们工作到失踪。现在，轮到我来问问题。”你上前一步，“时间锚点是什么？我父亲在哪里？”"],
    ["","克劳斯沉默片刻。“……你父亲是自愿留下的。锚点需要有人看守，否则时间线会崩成碎片。他选了莫斯科那一个，因为那里最靠近‘原初’。”他侧身让开路，“走吧。帝国杀不掉你——因为杀死你，会让某条时间线发出回声。管理局承受不起第二次残响。”"],
    ["","你走出档案馆。身后，克劳斯的声音追上来：“替我告诉你父亲——他欠帝国一个结局。”"]],
   foot:"柏林戒严的消息传来，你必须在城门关闭前离开。"},
  {k:"obj",note:"从柏林车站搭乘列车离开（回莫斯科方向）",city:"warsaw"},
  {k:"end",next:4,suspense:"你在列车餐车上捡到一张当天的报纸。头版是帝国总理的演讲，配图是国会大厦。而大厦顶层的窗户里，你看见一个人影——戴着圆框眼镜，正在目送你的列车远去。",
   pages:[
    ["","列车驶离柏林。你展开那张卷宗上的地图，七只罗盘分布在：上海、莫斯科、君士坦丁堡、开罗、德里、伦敦、柏林。你握着一只——还差六只。"],
    ["","卡捷琳娜看着窗外越来越远的国会大厦：“他还在那里。你父亲——他还在看着你。”"],
    ["","你闭上眼睛。列车向北，向着莫斯科，向着那个标着『原初节点』的红点，驶去。"]]},
 ]},
/* ---------- 第四卷 黄铜罗盘 ---------- */
{num:4, meta:{title:"黄铜罗盘",month:"1934年2月",loc:"莫斯科",teaser:"罗盘的指针，指向的不是北方——是你自己。",stamp:"残响·肆"},
 steps:[
  {k:"text",head:"第四卷 · 黄铜罗盘",date:"1934年2月 · 莫斯科",
   pages:[
    ["","回到莫斯科，你在旧货市场的角落里找到了父亲买走半张铁路图的那家铺子。老板是个瞎了一只眼的鞑靼老人，他认出了你手里的断罗盘：“七年前，一个德国人拿这罗盘来修。他说，罗盘坏了，因为时间坏了。”"],
    ["","老人把罗盘还给你。断掉的指针已经被重新接好，铜丝在断口处拧成一枚小小的、发光的结。“它现在能用了。但记住——它指的不是方向。它指的，是‘偏离’。”"],
    ["","你握着修好的罗盘走出铺子。指针转动，最终稳稳停住——指向你自己。你转动手腕，指针跟着你的胸口转动。卡捷琳娜皱眉：“它指着你。为什么会指着你？”"],
    ["","你没有回答。因为你的胸口，那封‘未来的信’的位置，正在发烫。"]],
   foot:"你想起母亲说过：罗盘不会说谎。它指着你，说明——你就是偏离本身。"},
  {k:"obj",note:"前往莫斯科大教堂地下的封印室",city:"moscow"},
  {k:"talk",npc:"priest",scene:["谢尔盖神父","“孩子，你身上带着钟声的味道。教堂地底有一条被封死的甬道，通向‘原初’。我守了三十年，只让一个人进去过——一个德国工程师，七年前。他说他要去‘看着钟’。他再也没出来。可他每个月，都会通过地缝递出一张纸条。你看，这是上个月的。”纸条上只有一行字：“钟还走着。它快停了。”"],
   note:"与神父交谈，取得父亲的消息"},
  {k:"text",head:"第四卷 · 黄铜罗盘",date:"教堂地底 · 时间锚点",
   pages:[
    ["","甬道尽头，是一扇黄铜大门。门上刻着密密麻麻的刻度，像一口被横放的钟。你推开门的瞬间，灰尘与光同时涌出。"],
    ["","门后是一个圆厅。圆厅中央，一口巨大的铜钟悬浮在虚空中，钟面没有指针——只有一圈刻度，从1914到1918。钟摆每一次晃动，圆厅的墙壁就透明一分，露出后面的景象：那是另一个世界。你的世界——那个同盟国战败、凡尔赛条约、你父母相爱的世界。"],
    ["","钟下坐着一个人。他背对着你，穿着铁路工程师的制服，头发花白。他没有回头：“你来了。比我预计的，早了三年。”"]],
   foot:"他缓缓转过椅子。圆框眼镜，温和的皱纹。七年前在西伯利亚失踪的汉伯二世，就坐在你面前。"},
  {k:"talk",npc:"gen",scene:["尤德尼奇将军","“你父亲？哦，那位工程师先生。他每年冬天来我的司令部，借阅铁路地图。他说他在找一个‘不存在的车站’。临走前他把这张图留给我——说是如果有个年轻人来找他，就把图给他。”将军递给你一张泛黄的铁路图，上面标注着一个红圈：阿兰斯。旁边写着一行小字：“罗盘指北者，人；罗盘指己者，钟。”"],
   note:"与将军交谈"},
  {k:"text",head:"第四卷 · 黄铜罗盘",date:"教堂地底 · 时间锚点",
   pages:[
    ["","父亲摘下眼镜，揉了揉眼睛。他比你记忆中的更老——老得不正常，仿佛七年里，他过了七十年。“这里是时间锚点。钟每摆动一次，世界就被‘校准’一次。我在这里看守了七年，亲眼看着这个被写错的世界，一天比一天更……错。”"],
    ["","“你母亲知道锚点的存在。我走后，她把罗盘给了你——因为罗盘会指向‘偏离者’。汉伯，你听我说：这个世界的你，本不该存在。你本该出生在另一个世界——那个世界，同盟国战败了，凡尔赛条约签署了，你母亲和我在上海相遇、相爱、生下了你。而现在这个世界，是被人重写的。”"],
    ["","他站起来，钟摆在他身后晃动：“我守在这里，不是守护这个世界。我是守护‘钟’——等一个能决定它命运的人来。那个人，是你。”"]],
   foot:"你终于明白那封信的含义：你不是这个世界的人。你是另一个世界的回声——一个本不该存在的‘残响’。"},
  {k:"choice",text:"父亲递给你一只旧的怀表，表盖内侧刻着母亲的名字：“莫斯科不是终点。罗盘指向你自己，是因为你身上带着‘原初’的碎片——你出生那天的钟声。下一站，去君士坦丁堡。那里有第二只罗盘，和一位守钟人。”",
   options:[
    {t:"接受父亲的指引，前往君士坦丁堡",to:7,set:{path:"east"}},
    {t:"追问父亲的真实身份（他为什么会在管理局的档案里）",to:8,set:{path:"truth"}}
   ]},
  {k:"text",head:"第四卷 · 黄铜罗盘",date:"教堂地底 · 时间锚点",
   pages:[
    ["","“君士坦丁堡？好。”你把罗盘收进怀里。父亲笑了笑：“你和你母亲一样，决定了就不回头。”"],
    ["","他交给你一张旧车票：“坐黑海的船，比走陆地快。奥斯曼帝国——苏丹快不行了。帝国一垮，第二只罗盘就会被埋在废墟下。快去。”"],
    ["","你转身离开圆厅。身后，钟摆晃动，世界在你背后轻轻‘咯吱’了一声，像一扇门被推开了一条缝。"]],
   foot:"走出教堂，莫斯科开始下雪。你的下一站，是黑海彼岸的君士坦丁堡。"},
  {k:"text",head:"第四卷 · 黄铜罗盘",date:"教堂地底 · 时间锚点",
   pages:[
    ["","“管理局的档案里，你是他们的特工。”你直视他，“你到底是看守者，还是帮凶？”"],
    ["","父亲沉默了很久。钟摆声在圆厅里回荡。“……都当过。”他苦笑，“我年轻时相信帝国的秩序，为管理局勘察锚点。直到我发现，他们在‘校对’这个世界——把不该存在的记忆，一条条删掉。包括你的母亲，包括你。”"],
    ["","“我叛逃了。他们追到西伯利亚，我躲进阿兰斯——然后我发现，那口钟，也需要有人看着。我欠这个世界的，比欠帝国的多。”他抬眼看你，“去吧，去君士坦丁堡。别再像我一样，半辈子都在还债。”"]],
   foot:"离开时，你回头看了一眼。父亲重新坐回钟下，背影佝偻，像一枚钉在时间里的钉子。"},
  {k:"obj",note:"离开莫斯科，南下前往君士坦丁堡（乘火车至敖德萨，转船）",city:"odessa"},
  {k:"end",next:5,suspense:"黑海的夜航船上，你在甲板上展开罗盘。指针在君士坦丁堡的方向剧烈颤动——而你的倒影里，那个‘另一个你’再次出现。这一次，他开口说话了。",
   pages:[
    ["","夜航船切开黑海的墨色。卡捷琳娜在船舱里擦拭马刀，艾琳在给伤员换药。你一个人站在船头，风把大衣吹得猎猎作响。"],
    ["","你低头看罗盘。指针疯狂颤动，像一只受惊的鸟。海面倒映着月亮——也倒映着一个人影，站在你身后。你猛地回头。没有人。"],
    ["","可海面的倒影里，那个人没有动。他隔着水面看着你，嘴唇翕动。你读懂了他的口型：“别去。那里是陷阱。”"],
    ["","船笛长鸣。君士坦丁堡的灯火，出现在天际线。"]]},
 ]},
/* ---------- 第五卷 奥斯曼的钟 ---------- */
{num:5, meta:{title:"奥斯曼的钟",month:"1934年3月",loc:"君士坦丁堡",teaser:"圣索菲亚的地底，有一座不会走的钟。",stamp:"残响·伍"},
 steps:[
  {k:"text",head:"第五卷 · 奥斯曼的钟",date:"1934年3月 · 君士坦丁堡",
   pages:[
    ["","君士坦丁堡笼罩在帝国最后的黄昏里。苏丹病危的消息像野火一样传遍大街小巷，咖啡馆里人人都在谈论帝国的遗产分配。而你握着罗盘，站在圣索菲亚大教堂前——指针直直地指向地底。"],
    ["","守夜人哈菲兹认出了你的罗盘：“七年了，又来一只。”他带你穿过回廊，掀开一块地毯，露出一道通往地底的石阶。“下面是拜占庭人的蓄水池，再往下——是‘钟室’。帝国历代苏丹都知道它的存在，没人敢碰。那口钟，不走。”"]],
   foot:"石阶向下延伸，水声与霉味一同涌来。你的脚步声在空旷的地下空间里，激起漫长的回声。"},
  {k:"obj",note:"进入圣索菲亚地下的钟室",city:"istanbul"},
  {k:"talk",npc:"osman",scene:["奥斯曼·埃芬迪","“年轻人，别急着下去。”一个拄着木拐的老兵拦住了你，“我叫奥斯曼，退役炮兵。这座地底我守了二十年——不是帝国让我守的，是我自己。因为我知道，那口钟下面，埋着帝国真正的秘密：帝国之所以能赢得那场战争，是因为有人在钟上动了手脚。”他顿了顿，“带我一程。我也想知道，这二十年的谎言，到底是谁写的。”"],
   note:"与守钟的老兵交谈"},
  {k:"text",head:"第五卷 · 奥斯曼的钟",date:"钟室",
   pages:[
    ["","钟室比想象中大得多。穹顶高达十丈，四壁刻满了奥斯曼、拜占庭与拉丁文的铭文。中央的铜钟有三人高，表面布满锈迹，却一尘不染——像是被人擦拭了千年。"],
    ["","钟面没有指针。只有一个刻度盘，从1914到1918。你掏出罗盘，断针剧烈旋转，最终停在1917。"],
    ["奥斯曼","“1917……那一年，帝国从巴勒斯坦撤军，英军眼看要打进大马士革。然后——一夜之间，战场倒转。英国人消失了，我们的士兵记得‘打过仗’，却不记得怎么赢的。原来，是钟被拨过。”"],
    ["","你伸手抚摸钟面。钟身冰凉，却在你掌心下微微震颤，像一只沉睡的巨兽，被惊动了。"]],
   foot:"你在钟座底部发现一行新刻的字——字迹与你父亲的如出一辙：“不要相信记忆。记忆是最容易被重写的东西。”"},
  {k:"battle",enemies:[{id:"cultist",name:"记忆教团卫兵",hp:44,atk:13,def:3,spd:11,exp:32,money:[12,26],n:2,storyWin:true}],note:"击退记忆教团的守卫"},
  {k:"text",head:"第五卷 · 奥斯曼的钟",date:"钟室 · 变故",
   pages:[
    ["","教团卫兵倒下的瞬间，钟室深处亮起烛火。一个披着灰袍的身影从阴影里走出，他的兜帽下是一张看不出年龄的脸——或者说，是一张会变化的脸，像水面上的倒影，不断被风吹皱。"],
    ["灰袍人","“欢迎，第四位守钟人的孩子。”他的声音苍老而年轻，像两把琴同时奏响，“我是记忆教团的大祭司。我们收集残响，因为残响是‘真历史’的碎片。这个被写错的世界，建立在无数人的遗忘之上——而我们，负责唤醒他们。”"],
    ["","“你父亲看守锚点，以为能维持平衡。但平衡正在崩坏。钟快停了。当钟彻底停摆，这个世界……会像一页被撕掉的书，永远消失。而另一个世界——真正的那一页——会重新翻开。”他伸出手，“加入我们。让世界回到它本来的样子。”"]],
   foot:"大祭司的兜帽下，那双眼睛看着你，像看着一件早已写好的结局。"},
  {k:"choice",text:"大祭司说，你身上的‘原初碎片’，是唤醒钟的最后一把钥匙。“你母亲用残响之力重写了你——你是这个世界唯一的‘活书签’。牺牲你，就能翻回正确的那一页。当然，你也可以拒绝。但钟停之后，所有人都将不复存在——包括你爱的人。”",
   options:[
    {t:"拒绝：没有人有权替世界做选择",to:8,set:{cult:"refuse"}},
    {t:"追问：你们想牺牲多少人？",to:9,set:{cult:"ask"}}
   ]},
  {k:"text",head:"第五卷 · 奥斯曼的钟",date:"钟室",
   pages:[
    ["","“世界不该由牺牲来纠正。”你后退一步，把罗盘收进怀里，“如果正确的那一页，需要踩着我母亲、我父亲、还有这世界上几十亿人的尸骨翻开——那它就不是正确，只是另一种错误。”"],
    ["","大祭司沉默。烛火在他兜帽下摇曳。“……你和他，说了一样的话。”他说，“你父亲拒绝我的时候，也是这么说的。然后他选择了第三种办法：让钟继续走。既不让世界崩坏，也不让世界重写——让一切，停在错误里。”"],
    ["","“可钟快停了，年轻人。错误，终归会自己结束。”他转身，融入阴影，“我们还会再见。在钟停的那一天。”"]],
   foot:"灰袍人消失后，钟室的烛火同时熄灭。黑暗中，只有你的罗盘在发光。"},
  {k:"text",head:"第五卷 · 奥斯曼的钟",date:"钟室",
   pages:[
    ["","“牺牲多少人？”你问，“这个世界有多少人？你们要让他们全部消失，就为了一个‘正确’的结局？”"],
    ["","大祭司没有立刻回答。“……你问到了问题的核心。”他说，“所以教团内部也有分歧。有人认为该唤醒钟，让世界重写；有人认为该维持现状，哪怕它是错的——因为活着的人，有权活着。”"],
    ["","“这就是我找你的原因。你的身体里，同时流着两个世界的血。你是唯一能同时理解两边的人。”他递给你一枚铜片，上面刻着一只眼睛，“这是教团的信物。当你想好了，用它来找我。我赌你会选择——第三条路。”"]],
   foot:"你接过铜片。它冰凉，像一枚小小的、等待被敲响的钟。"},
  {k:"obj",note:"带着疑问离开君士坦丁堡，前往开罗",city:"cairo"},
  {k:"end",next:6,suspense:"夜航的渡轮上，你打开那封‘未来的信’。信上的字迹又变了——这一次，它写满了整页，用的是你自己的笔迹。",
   pages:[
    ["","“第三只罗盘在开罗，苏丹的旧国库里。但那里已经没有钟了——钟在1917年被搬走，运往阿拉拉特山。你父亲说钟在莫斯科，是骗你的。他骗了所有人，包括管理局。”"],
    ["","信的落款，是你的名字。日期：1934年10月。"],
    ["","船身摇晃。你握着那页信，指尖发凉。写信的人，是七个月后的你。他为什么要告诉过去的自己，父亲在说谎？"],
    ["","沙漠的风从南方吹来，带着黄沙与骆驼的气息。开罗的灯火，出现在尼罗河的天际线上。"]]},
 ]},
/* ---------- 第六卷 沙漠信使 ---------- */
{num:6, meta:{title:"沙漠信使",month:"1934年4月",loc:"开罗—大马士革",teaser:"沙漠深处，1916年的英军仍在行军。",stamp:"残响·陆"},
 steps:[
  {k:"text",head:"第六卷 · 沙漠信使",date:"1934年4月 · 开罗",
   pages:[
    ["","开罗的旧国库里，第三只罗盘静静躺在木匣中——苏丹的管家说，这是‘胜利者的贡品’，1918年从凡尔赛运来的。你打开木匣的瞬间，整座国库的钟表同时停了。三秒后，又同时走动，分毫不差。"],
    ["","第三只罗盘的指针，指向东南——阿拉伯半岛的深处，阿拉拉特山的方向。与信上写的一致。"],
    ["","你正准备启程，一位蒙着面纱的贝都因女子拦住了你：“你带着钟的味道。长老要见你——他见过你的父亲。七年前，你父亲横穿沙漠，带着一口‘会走路的钟’。他把它藏在了阿拉拉特山的雪线以上。”"]],
   foot:"法蒂玛递给你一囊水：“沙漠的规矩：先喝水，再听故事。”"},
  {k:"talk",npc:"fatima",scene:["法蒂玛","“我叫法蒂玛，贝都因向导。长老说，你父亲当年雇我们部落带路，报酬是一箱银币和一台能收听到‘另一个世界’的收音机。收音机坏了之后，长老就一直说：你父亲还会回来。他说对了。”"],
   note:"与法蒂玛交谈，获得向导"},
  {k:"obj",note:"跟随商队穿越沙漠，前往大马士革",city:"damascus"},
  {k:"text",head:"第六卷 · 沙漠信使",date:"沙漠 · 第七日",
   pages:[
    ["","商队在第七日的黄昏，遇上了‘幽灵’。先是地平线上浮起海市蜃楼——然后是整齐的脚步声，由远及近。一支1916年军装的英国军队，从沙丘后面列队走来。他们的军装完好，刺刀反着光，可他们的影子，全都朝着一个方向——朝着他们行进方向的反方向。"],
    ["法蒂玛","“别出声。这是残响军团。他们不是鬼魂——他们是‘被删掉的记忆’。”她压低声音，“这支军队本该在1916年的加沙战死。可战争被改写了，他们就没死成。于是他们永远在这片沙漠里行军，找不到战场，也找不到坟墓。”"],
    ["","队伍从你们身旁走过。你看见士兵们的脸上没有表情，只有一种茫然的、等待的神色。队伍最后，一个下士抬起头，看了你一眼。他的嘴唇动了动，没有声音。可你读懂了：他在说——‘钟’。"]],
   foot:"残响军团消失在沙丘后面，像一阵被风抹平的水渍。"},
  {k:"battle",enemies:[{id:"ghost_soldier",name:"残响英军",hp:46,atk:14,def:3,spd:10,exp:40,money:[0,0],n:2,storyWin:true}],note:"击退拦路的残响英军"},
  {k:"battle",enemies:[{id:"ghost_soldier",name:"残响英军",hp:46,atk:14,def:3,spd:10,exp:40,money:[0,0],n:2,storyWin:true}],note:"击退拦路的残响英军"},
  {k:"text",head:"第六卷 · 沙漠信使",date:"大马士革 · 长老的帐篷",
   pages:[
    ["","大马士革城外的贝都因营地，长老的帐篷里点着酥油灯。长老已经很老了，老得像一块风化的石头。他看见你的罗盘，浑浊的眼睛亮了一瞬：“你父亲的罗盘。他把它留在了沙漠里，用一块银币和一根骆驼骨，换走了我的部落最年轻的两个骑手。”"],
    ["长老","“他要去阿拉拉特山。他说，山上有一口钟，钟里住着‘世界的锚’。他要在钟停之前，把锚修好。”长老咳嗽起来，“他走了三个月，回来时，只剩下半条命。他说，钟修好了，但他把自己锁在了里面。”"],
    ["","你看着长老。他的眼神不像在说谎。可那封信说，父亲骗了所有人。到底谁在说谎？"]],
   foot:"长老递给你一卷羊皮：“他留下的。说等一个拿罗盘的年轻人来，就交给他。”羊皮上画着阿拉拉特山的地形，山顶标着一个红叉——『锚点·圣所』。"},
  {k:"choice",text:"法蒂玛望着你：“你父亲说，如果他没能回来，就让拿到羊皮的人替他完成最后一件事——把钟拨回正确的刻度。可我问你：哪个刻度，是正确的？”",
   options:[
    {t:"相信父亲：去阿拉拉特山修钟",to:8,set:{truth:"father"}},
    {t:"相信那封信：父亲在说谎，真相在别处",to:9,set:{truth:"letter"}}
   ]},
  {k:"text",head:"第六卷 · 沙漠信使",date:"营地之夜",
   pages:[
    ["","“我父亲修了一辈子钟。如果他选择把自己锁在山里，那一定是因为——钟不能停。”你收起羊皮，“我要去阿拉拉特山。如果那封信是错的，至少我还能救出他。”"],
    ["","法蒂玛沉默了一会儿，然后笑了：“长老说你会这么说。他让我告诉你：阿拉拉特山不是沙漠的尽头，是沙漠开始的地方。带上三天的水，还有——一匹好骆驼。”"]],
   foot:"夜风里传来驼铃。队伍朝着东北方向，向着高加索的群山，出发了。"},
  {k:"text",head:"第六卷 · 沙漠信使",date:"营地之夜",
   pages:[
    ["","你摊开那封信。七个月后的你亲笔写的信，说你父亲在说谎。可长老说，你父亲把锚修好了。如果写信的你是对的，那长老、父亲、还有整个贝都因部落的记忆，都被改写过——被谁？被管理局？还是被……未来的你？"],
    ["","“我不确定谁在说谎。”你对法蒂玛说，“所以我都要查。先去阿拉拉特山，看看那口钟到底是好是坏。如果钟是好的，那封信就是假的——我就去查写信的人。”"],
    ["","法蒂玛点头：“聪明的做法。不选边，先看证据。长老果然没看错人。”"]],
   foot:"队伍朝着东北方向，向着高加索的群山出发。罗盘在夜色里微微发光。"},
  {k:"end",next:7,suspense:"抵达阿拉拉特山脚的前夜，你听见山里传来钟声。钟声只响了一下——然后，你口袋里的三只罗盘，同时指向天空。",
   pages:[
    ["","山影在月光下像一头蹲伏的巨兽。雪线以上的峰顶，隐约有一点灯火，像一颗不肯熄灭的星。"],
    ["","法蒂玛勒住骆驼：“那就是你父亲的地方。贝都因人叫它‘钟巢’——鸟筑巢是为了生蛋，他筑巢，是为了守钟。”"],
    ["","你抬头望着那点灯火。钟声，又响了一下。这一次更近，像是在回应你的到来。"],
    ["","山风呼啸。你握紧三只罗盘，开始登山。"]]},
 ]},
/* ---------- 第七卷 阿拉拉特 ---------- */
{num:7, meta:{title:"阿拉拉特",month:"1934年5月",loc:"阿拉拉特山",teaser:"父亲的日记最后一页写着：对不起，我选了另一边。",stamp:"残响·柒"},
 steps:[
  {k:"text",head:"第七卷 · 阿拉拉特",date:"1934年5月 · 雪线",
   pages:[
    ["","登山第五天，暴风雪来临。你们在岩石后支起帐篷，风力大到能把骆驼吹下悬崖。卡捷琳娜的刀鞘冻在皮带上，奥斯曼的假腿在雪里咯咯作响。只有法蒂玛像一片贴在山壁上的叶子，安静地辨认着风的方向。"],
    ["","雪停之后，你们在冰缝里发现了第一块人类活动的痕迹：一截铁轨。它嵌在冻土里，锈迹斑斑，枕木上刻着编号——『E-11 · 阿兰斯』。西伯利亚铁路的铁轨，怎么会出现在阿拉拉特山上？"],
    ["","你沿着铁轨向上走。风雪之外，山峰的阴影里，出现了一座建筑：一半是拜占庭式教堂，一半是蒸汽时代的钢铁车间。屋顶的烟囱里，冒着白色的蒸汽。"]],
   foot:"这就是父亲筑的‘钟巢’。它像一座倒扣在山顶的钟。"},
  {k:"obj",note:"进入钟巢",city:"yerevan"},
  {k:"text",head:"第七卷 · 阿拉拉特",date:"钟巢内部",
   pages:[
    ["","钟巢内部比外表更大——像是有人把一座圣殿和一座工厂焊在了一起。巨大的齿轮墙缓缓转动，每转动一圈，墙上就有一幅壁画亮起：凡尔赛宫的签字仪式、索姆河的弹坑、沙皇退位的月台……你认出来了——这些不是‘这个世界的记忆’，是‘另一个世界’的。"],
    ["","墙角的书桌上，摊着一本日记。父亲的笔迹，日期：1934年5月。最后一页只写了一行字：『对不起，我选了另一边。』"],
    ["","你翻开日记。前面几页写满了编号：E-01 上海，E-02 莫斯科，E-03 君士坦丁堡……每一页都画着一只罗盘的位置。只有最后一页，画着一支笔。旁边标注：『原初节点 · 1918.11.11 · 柏林国会大厦地库 · 守笔人：汉伯二世』。"]],
   foot:"你盯着那行字。守笔人：汉伯二世。你父亲同时守着钟，和笔？"},
  {k:"talk",npc:"aleksei",scene:["阿列克谢","“你们是来找那位工程师的吧？我是铁路机械师，七年前被他雇来修这条山里的铁路。他付钱爽快，就是不让问问题。我只知道：每隔三个月，会有一列没有编号的火车上山，卸下一批铜件，再拉走一批‘时钟’。”他顿了顿，压低声音，“上个月，火车来的时候，车厢里坐着穿黑大衣的人。工程师看见他们，脸色变了。他说了句话，我一直记着——他说：‘他们还是找到了。’”"],
   note:"与机械师交谈"},
  {k:"battle",enemies:[{id:"assassin",name:"管理局特工",hp:50,atk:15,def:4,spd:13,exp:38,money:[15,35],n:2,storyWin:true}],note:"击退突袭钟巢的管理局特工"},
  {k:"text",head:"第七卷 · 阿拉拉特",date:"钟巢 · 钟室",
   pages:[
    ["","击退特工后，你顺着齿轮墙的阶梯下到最底层。这里没有钟——只有一支笔，悬浮在玻璃柜里。黑色的钢笔，笔尖刻着『1918.11.11』。你父亲站在玻璃柜前，背对着你，手里握着一只黄铜钥匙。"],
    ["","“你来得正好。”他没有回头，“这支笔，就是‘原初节点’。1918年11月11日，凡尔赛，停战条约——签下它的人，决定了世界的样子。有人重写了那一天，于是世界变成了现在这样。而重写一支笔的代价，是让整条时间线都在流血。”"],
    ["","“我用七年时间，把钟修好了——但钟只是‘稳定器’。要让世界真正痊愈，只有两个选择：让钟永远走下去，世界继续活在这个错误里；或者，拿起这支笔，签下‘正确的停战’，让世界重写——然后，你、我、你母亲，所有活在这条时间线上的人，都会像墨水一样，被抹去。”"]],
   foot:"他转过身来。你看见他的眼睛——那里面有疲惫，有愧疚，还有一种近乎释然的平静。“所以我选了第三条路。我把钟和自己锁在这里。只要我活着，钟就不会停，这个世界就不会崩。可我快撑不住了，汉伯。钟，快停了。”"},
  {k:"choice",text:"父亲把黄铜钥匙递给你：“这是钟的钥匙。我死后，你可以选择：拧紧发条，让这个世界继续——它错，但它活着。或者松开发条，让世界重写——它‘对’，但我们都将消失。或者……拿走这支笔，找到‘真正的原初节点’，做第三个选择。我不知道第三个选择存不存在，但你母亲说，你会找到的。”",
   options:[
    {t:"接过钥匙，承诺守住钟（暂缓选择）",to:7,set:{key:"take"}},
    {t:"拒绝钥匙：你不该由父亲决定命运",to:8,set:{key:"refuse"}}
   ]},
  {k:"text",head:"第七卷 · 阿拉拉特",date:"钟室",
   pages:[
    ["","你接过钥匙。钥匙在掌心冰凉，刻着一圈细密的刻度，像一口微缩的钟。“我会守住它。”你说，“但我不签任何字，不松任何发条。我要先弄清全部真相——谁重写了1918年，为什么重写，重写的人，现在在哪里。”"],
    ["","父亲笑了。那笑容里有你记忆中的温和：“你母亲也会这么说。她总说，药要三副才见效，急不得。去吧。你母亲知道的一切，比我多。回上海，问她。”"],
    ["","“她……”你犹豫了一下，“她病得很重。”"],
    ["","父亲的笑容凝固了一瞬。他缓缓点头，声音很轻：“我知道。她是在用最后一点力气，撑着等你回去。”"]],
   foot:"下山的路比上山更难。暴风雪又起了，可你的心，比风雪更冷。"},
  {k:"text",head:"第七卷 · 阿拉拉特",date:"钟室",
   pages:[
    ["","“我拒绝。”你把钥匙推回去，“父亲，你把我的一生都安排好了——先让我收到信，再让我找到罗盘，现在又让我接你的钟。可你问过我，想不想活在这个世界吗？”"],
    ["","父亲沉默了。钟室的齿轮声像一首沉重的摇篮曲。很久，他才开口：“……没有。你出生那年，我做了一个决定，替你选了这个世界。你母亲为此恨了我很多年。她说，孩子该自己选。”"],
    ["","他收回钥匙，放进怀里：“那我不替你选了。但记住——钟停的那天，世界不会等你慢慢选。”他顿了顿，声音软下来，“……回家去吧。你母亲，在等你。”"]],
   foot:"你转身离开钟巢。风雪里，你听见身后的门，缓缓关上。齿轮转动的声音，像一声很轻的叹息。"},
  {k:"end",next:8,suspense:"回程的火车上，你打开那封‘未来的信’。信的末尾，字迹再次变化——这一次，它变成了你母亲的笔迹：“汉伯，如果我走了，就去老宅地窖，打开那只樟木箱。里面没有药方。有你出生那天的全部真相。”",
   pages:[
    ["","火车穿过高加索，穿过黑海，穿过整片欧亚大陆，向东方驶去。你在三等车厢里，一遍一遍摩挲着黄铜钥匙的刻度。"],
    ["","窗外，雪原在暮色里燃烧成金色。你想起母亲的脸，想起她总是说：“汉伯，你的名字是外公起的。他说，你出生那天，全城的钟都停了。”"],
    ["","全城的钟都停了。你终于知道，那不是一句玩笑。"],
    ["","列车在黎明抵达上海。苏州河的雾气里，海关大钟指着七点——可你记得，你离开时，它慢了十七分钟。现在，它准了。"]]},
 ]},
/* ---------- 第八卷 归途 ---------- */
{num:8, meta:{title:"归途",month:"1934年6月",loc:"上海",teaser:"你出生那天，全城的钟都停了。",stamp:"残响·捌"},
 steps:[
  {k:"text",head:"第八卷 · 归途",date:"1934年6月 · 上海",
   pages:[
    ["","你回到上海。面馆的招牌还在，梅婶在后厨熬药，药味顺着街角飘出来，熟悉得让人眼眶发酸。你推开后屋的门，母亲靠在窗边，手里握着一只旧怀表，表盖内侧刻着她的名字。她看见你，笑了：“回来啦。瘦了。”"],
    ["","她比离开时更虚弱，可精神出奇地好——像一盏即将燃尽的灯，最后用力地亮了一下。“你见到你父亲了。”她说，不是疑问句，“他是不是让你选？别理他。他啊，一辈子都在替别人做决定，就这一次——把决定权还给你了，还算他做了件对事。”"],
    ["","她把手里的怀表放进你手心：“你出生那年的东西。打开看看。”你打开表盖。表盘上没有指针——只有一根，停在『11』的位置。表的背面刻着一行小字：『1916.11.11 · 晨』。"]],
   foot:"“1916年11月11日，”母亲说，“你出生那天。全上海的钟，都停了。”"},
  {k:"text",head:"第八卷 · 归途",date:"上海 · 老宅地窖",
   pages:[
    ["","母亲让你打开老宅地窖的樟木箱。箱底，是厚厚一沓病历与笔记，还有一本用油布包着的、边角发黄的日记。日记第一页，是母亲的笔迹：『民国五年，冬。我接生了一个死婴。』"],
    ["","你握着那本日记，指节发白。母亲的声音从背后传来，平静得像在讲别人的故事：“你生下来就没有呼吸。我守了你一整夜，天快亮的时候——全城的钟停了。然后你哭了。哭声很响，不像个刚出生的孩子，倒像……一只被关了很多年的鸟，终于听见了门开的声音。”"],
    ["","“我知道那不是医理。那是你父亲用黄铜罗盘换来的——他那时已经在为管理局做事了。他用‘时间锚点’的力量，把你的命，从另一条时间线上‘借’了过来。你活下来了。代价是：你成了这个世界的一部分——不是这个世界的人。”"]],
   foot:"“汉伯，你不是残响的受害者。你，就是残响本身。”"},
  {k:"choice",text:"母亲剧烈地咳嗽起来，她按住你的手：“听我说完。管理局这些年追捕‘残响’，不是怕世界崩坏——是怕有人发现真相：世界是被重写的，而重写者……还活着。1918年，重写停战的人，没有离开柏林。他把自己写进了历史里，成了历史的一部分。”",
   options:[
    {t:"追问：重写者是谁？",to:4,set:{ask:"who"}},
    {t:"追问：父亲知道吗？他为什么不说？",to:5,set:{ask:"father"}}
   ]},
  {k:"text",head:"第八卷 · 归途",date:"上海 · 老宅",
   pages:[
    ["","“重写者是谁？”母亲望着窗外的苏州河，“我不知道他的名字。我只知道，你父亲为他工作了很多年，直到发现——那个人也在重写‘自己’。他每重写一次世界，就让自己变得更年轻、更强大、更不像人。”她顿了顿，“你父亲说，那个人现在住在柏林。国会大厦下面。他叫自己——‘钟匠’。”"],
    ["","钟匠。你想起君士坦丁堡的守钟人说的话，想起教团大祭司提起的‘世界最初的钟声’。原来从始至终，只有一口钟。而敲钟的人，住在柏林。"]],
   foot:"“去找他之前，”母亲说，“先回家睡一觉。你看起来，比我还累。”"},
  {k:"text",head:"第八卷 · 归途",date:"上海 · 老宅",
   pages:[
    ["","“父亲知道重写者是谁吗？”你问，“他守了七年钟，为什么从不告诉我真相？”"],
    ["","母亲沉默了一会儿。“他知道。他比谁都清楚。但他说，有些真相，说出来的那一刻，就会变成谎言。”她看着你，“你父亲不是不说。他是不敢说——因为他怕说出来，你就会恨他。”"],
    ["","“恨他？为什么？”"],
    ["","“因为1918年，重写停战的人，用的是你父亲的笔。那支刻着‘1918.11.11’的钢笔，是他年少时送给钟匠的礼物。他亲手把‘笔’递给了那个改写世界的人。”"]],
   foot:"窗外，海关大钟敲响。钟声一下一下，像敲在你心上。"},
  {k:"text",head:"第八卷 · 归途",date:"上海 · 深夜",
   pages:[
    ["","夜深了。母亲睡着后，你守在床边。月光从窗缝漏进来，落在她苍白的手背上。她忽然开口，没有睁眼：“汉伯。如果有一天，世界要重写……你替妈妈做一个决定。”"],
    ["","“什么决定？”"],
    ["","“如果重写之后，那个世界的我——你真正的母亲——还活着，就让她活着。她没受过这些苦。她该有完整的一生。”她睁开眼睛，目光清澈如水，“至于这个世界受苦的我……已经活够了。见过你长大，就够本了。”"],
    ["","你握着她的手，说不出话。她笑了笑，像小时候哄你一样：“别哭。你可是全城的钟，都为他停过的人。”"]],
   foot:"天快亮的时候，母亲的手，凉了。你守到太阳升起。苏州河的雾气散开，海关大钟指向七点——分秒不差。这是这座钟，第一次走得这么准。"},
  {k:"end",next:9,suspense:"处理完母亲的后事，你在整理遗物时，发现怀表的夹层里藏着一张纸条，是母亲的笔迹，日期却是十年前：“钟匠不是一个人。他们是两个人。你父亲当年送出的那支笔，现在握在‘未来的你’手里。”",
   pages:[
    ["","你把纸条翻来覆去地看。母亲的笔迹，没有错。可日期是十年前——那时你才十四岁，父亲还在西伯利亚，谁都没有见过‘未来的你’。"],
    ["","你想起在列车上、在海面上看见的那个‘另一个你’。他隔着水面，对你说：‘别去。那里是陷阱。’"],
    ["","如果你听从的是未来的你，而未来的你……就是钟匠呢？"],
    ["","你收起纸条，锁好老宅的门。上海在身后渐远。这一次，你的目的地是柏林——国会大厦的地底。那里有你的父亲，有你父亲的笔，还有一个自称‘钟匠’的人。"]]},
 ]},
/* ---------- 第九卷 两封信 ---------- */
{num:9, meta:{title:"两封信",month:"1934年7月",loc:"上海—柏林",teaser:"教团首领摘下兜帽——那是一张你的脸。",stamp:"残响·玖"},
 steps:[
  {k:"text",head:"第九卷 · 两封信",date:"1934年7月 · 上海",
   pages:[
    ["","启程去柏林的前夜，两封邀请同时送到。一封是黑信封，封口压着管理局的黄铜徽记：『汉伯先生：帝国愿意以‘时间锚点’的全部档案，换取你的合作。柏林，档案馆，克劳斯。』另一封是灰信封，封口压着一枚眼睛纹章：『守钟人的孩子：钟停之日将近。教团愿意告诉你，你父亲与钟匠的全部往事。君士坦丁堡，钟室。』"],
    ["","你把两封信摆在桌上。艾琳看了一眼：“他们都在赌你会选谁。”她顿了顿，“老李有话说。”"],
    ["","老李从后厨转出来，难得没有叼烟：“小子，有件事我一直没告诉你。我以前，也是管理局的人。叛逃的。七年前你父亲失踪那会儿，就是我放的水。”他吐出一口烟，“我不站管理局，也不站教团。我站你。”"]],
   foot:"老李的坦白让你重新审视每一段旅程。这个世界，到处都是叛逃者、守夜人、和两难的人。"},
  {k:"talk",npc:"laoli",scene:["老李","“管理局不是铁板一块。克劳斯是‘钟匠派’——他信钟匠能稳定世界。可局里还有一派人，叫‘还原派’，他们想重写世界，让历史回到‘正确’的样子。你父亲当年叛逃，就是发现钟匠派的‘稳定’，靠的是不断抹除记忆。”他压低声音，“还有件事：教团大祭司，认识你父亲。他们不是敌人。他们是你父亲的老朋友——被你父亲亲手送进监狱的那种朋友。”"],
   note:"听老李讲管理局的内幕"},
  {k:"choice",text:"艾琳站在码头边，海风吹起她的围巾：“我陪你去柏林。但在这之前——我想知道你的答案。你会选择哪一边？管理局说，维护秩序；教团说，还世界真相。可我不信这两边。你信什么？”",
   options:[
    {t:"信证据：先去柏林看那支笔，再决定",to:3,set:{faith:"evidence"}},
    {t:"信父亲：他守钟七年，不会错",to:4,set:{faith:"father"}}
   ]},
  {k:"text",head:"第九卷 · 两封信",date:"上海 · 码头",
   pages:[
    ["","“我不信旗子，也不信教义。我信笔。”你说，“那支笔决定过世界一次。我要亲眼看见它，摸到它，再决定它该不该再决定一次。”"],
    ["","艾琳点头：“好。那我们就去柏林，看笔。”她回头看了一眼上海的天际线，“回来的时候，我想吃梅婶的阳春面。”"]],
   foot:"汽笛响起。你、艾琳、卡捷琳娜、奥斯曼、法蒂玛、阿列克谢——一支七拼八凑的队伍，踏上了前往柏林的旅程。"},
  {k:"text",head:"第九卷 · 两封信",date:"上海 · 码头",
   pages:[
    ["","“我信我父亲。”你说，“他守了七年钟。如果他觉得钟该停，他早就停了。他撑着，一定有他的理由。我要去柏林，不是为了选边——是为了替他问钟匠一句话：值得吗？”"],
    ["","艾琳沉默了一会儿，笑了：“你父亲有你这样的儿子，挺幸运的。”她拍了拍你的肩，“走吧。别让钟匠等太久。”"]],
   foot:"汽笛响起。队伍踏上前往柏林的旅程。你怀里的罗盘，在轻轻发烫。"},
  {k:"obj",note:"抵达柏林，潜入国会大厦周边",city:"berlin"},
  {k:"text",head:"第九卷 · 两封信",date:"柏林 · 国会大厦外",
   pages:[
    ["","国会大厦在暮色里像一头铁灰色的巨兽。广场上军乐队正在排练，乐声在石柱间回荡。你绕到西侧的下水道入口——克劳斯给的档案里画着这条暗道，通往地库。"],
    ["","下水道的铁门虚掩着。你侧身挤进去。黑暗里，有人先开口：“你终于来了。”"],
    ["","是教团大祭司。他站在一盏孤灯下，兜帽压低：“我等你很久了。钟停之前，我要给你看一样东西——你父亲的旧信。他写给钟匠的，又亲手从钟匠那里偷了回来。”他递过来一沓发黄的信纸，“读读吧。读完，你就知道，你父亲为什么守钟，为什么锁自己，为什么……不肯告诉你全部真相。”"]],
   foot:"你接过信纸。第一封信的日期，是1917年。"},
  {k:"text",head:"第九卷 · 两封信",date:"下水道 · 灯下",
   pages:[
    ["","信纸很薄，字迹在潮湿的空气里洇开。你读得很慢。"],
    ["","1917年，父亲写给钟匠：“……你说要修正这场战争。我劝过你，战争是人打的，历史是人写的，人不能既当裁判又当球员。你不听。你问我，如果世界注定要错下去，为什么不能让错误变得‘好一点’？我不知道怎么回答。”"],
    ["","1918年，父亲写给钟匠：“……你签了。你用我的笔，签了另一个停战。我看着世界在我眼前改变：报纸、地图、人们的记忆。我的母亲——她记不得我的父亲战死了，她以为他退伍回了家。所有人都在笑，只有我在哭。你造了一个没有伤口的时代，可伤口还在，只是被藏起来了。”"],
    ["","1927年，父亲写给钟匠，最后一封：“……我找到锚点了。我会去守它。这不是为了你，是为了所有被你藏起来的伤口。钟停那天，请你亲自来。我们把这件事，做个了断。”"]],
   foot:"你读完信，抬起头。大祭司摘下兜帽。烛光下，那张脸，是你自己的脸——只是更成熟，更疲惫，眼角的皱纹里，藏着你看不懂的沧桑。"},
  {k:"text",head:"第九卷 · 两封信",date:"下水道 · 灯下",
   pages:[
    ["","“你……”你的声音发紧。“你是我。”"],
    ["","“我是你。或者说，是七个月后的你。”他笑了笑，那笑容让你毛骨悚然——因为那确实是你会有的笑容，“从你收到那封信开始，每一步都是我安排的。信是我写的，罗盘是我让梅婶交给你的，连你父亲的位置，也是我透露给你的。”"],
    ["","“为什么？”你问，“你为什么要骗过去的自己？”"],
    ["","他收起笑容：“因为未来的我，犯了一个错误。我选择了‘重写世界’——我拿起了那支笔，签下了正确的停战。然后，世界变了。可我还记得这个世界。我记得母亲、老李、艾琳——他们全都消失了。只有我记得。你明白那种感觉吗？全世界的幸福，压在你一个人的记忆上。”他低头看着自己的手，“所以我回到过去，阻止我自己。帮过去的我，找到第三条路。”"]],
   foot:"“你，未来的我，是来阻止你的。”"},
  {k:"end",next:10,suspense:"大祭司——未来的你——把一枚铜钥匙放进你手心：“钟停还有一个月。去阿拉拉特，取回你父亲藏的那支真笔。假的还在柏林地库，引开钟匠。然后，去凡尔赛——真正的原初节点，在凡尔赛宫的镜厅。1918年11月11日，钟匠重写世界时，把‘真笔’留在了那里，作为锚。去吧。一个月后，我们镜厅见。”",
   pages:[
    ["","你握着那枚铜钥匙。它与父亲给你的黄铜钥匙不同——更轻，更旧，钥匙齿上沾着干涸的墨迹。"],
    ["","“如果我把真笔取回来，”你问，“会发生什么？”"],
    ["","他沉默了很久：“你会成为新的钟匠。拥有重写世界的能力。然后，你会面临我当初的选择——而且这次，没有未来的你来提醒你了。”"],
    ["","“那你呢？如果我不重写世界，你会怎样？”"],
    ["","他笑了笑：“我会消失。因为未来的我，是在‘重写’之后诞生的。你不重写，我就不存在。……也好。这个世界，不该有两个汉伯。”"],
    ["","他转身走进黑暗。灯熄灭了。你握着钥匙，站在原地，很久很久。"]]},
 ]},
/* ---------- 第十卷 回声战争 ---------- */
{num:10, meta:{title:"回声战争",month:"1934年8月",loc:"欧洲",teaser:"整个欧洲，同时想起了另一场战争。",stamp:"残响·拾"},
 steps:[
  {k:"text",head:"第十卷 · 回声战争",date:"1934年8月 · 柏林",
   pages:[
    ["","残响爆发了。不是一处，而是整片大陆同时发作：柏林的市民在清晨醒来，发现街上多了许多‘不该存在’的店铺——卖的是法棍、煎饼和英国红茶；巴黎的德军士兵开始用英语唱歌，他们不知道歌词是什么意思；莫斯科的广场上，有人举着红旗游行，嘴里喊着被禁止了十六年的口号。"],
    ["","钟，快停了。世界像一台过热的机器，所有齿轮都在发出尖叫。"],
    ["","克劳斯在地下车站找到了你。他的黑大衣破了一角，头发乱糟糟的，再没有上次见面的从容：“帝国要完了。钟匠启动了‘大共鸣’——他要让所有残响一次性爆发，然后全部抹平。世界要么重写，要么崩溃。没有中间选项了。”他递给你一张通行证，“国会大厦地库的钥匙，我给你。去拿那支笔——在你父亲来之前。”"]],
   foot:"克劳斯顿了顿：“告诉你父亲——他说得对。我早就该听他的。”"},
  {k:"obj",note:"穿过混乱的柏林，进入国会大厦地库",city:"berlin"},
  {k:"battle",enemies:[{id:"patrol",name:"失控的巡逻队",hp:40,atk:14,def:4,spd:10,exp:34,money:[15,30],n:3,storyWin:true}],note:"突破失控的守军"},
  {k:"text",head:"第十卷 · 回声战争",date:"国会大厦地库",
   pages:[
    ["","地库比想象中深。你穿过三层铁门，每一层都刻着同一个日期：1918.11.11。最深处，是一间圆形密室。密室中央的石台上，放着一支钢笔——就是你父亲守卫的那支，笔尖刻着那个日期。假笔。你父亲把它藏在这里，引开钟匠的耳目。"],
    ["","你伸手握住假笔。笔身冰凉。忽然，密室四壁的灯同时亮起。一个声音从头顶传来，苍老，却带着金属般的回响：“放下。那不是你的。”"],
    ["","你抬头。密室的穹顶裂开一道缝，一个人影缓缓降下。他穿着1900年代的旧式礼服，戴着金丝眼镜，面容儒雅——看上去不到四十岁。可他的眼睛，像一口深不见底的钟井。“自我介绍一下。他们叫我，钟匠。”他微笑着说，“也就是，重写这个世界的人。”"]],
   foot:"钟匠的袖口，绣着与管理局徽记一样的黄铜纹——只是反过来，像一面镜子。"},
  {k:"text",head:"第十卷 · 回声战争",date:"国会大厦地库",
   pages:[
    ["","“你父亲把真笔藏起来了，对吧？”钟匠绕着石台踱步，像在欣赏一件古董，“他以为我找不到。可我不需要找到它。只要那支笔存在，我就能感应到它的位置——它和我的命运，绑在同一条时间线上。”他停下来，看着你，“它在阿拉拉特。你父亲守了七年。他以为守着笔，就是守着世界的锚。可他错了。”"],
    ["","“错在哪里？”你问。"],
    ["","“错在他以为，笔是用来写字的。”钟匠笑了笑，“笔是用来记住的。我重写世界之后，唯一能证明‘旧世界存在过’的，就是那支笔。只要它还在，残响就会一直渗漏。你父亲守的不是锚——他守的是一枚定时炸弹。”他伸出手，“把假笔给我。然后，去阿拉拉特，把真笔带回来。我们做个了断：我重写世界，让所有人解脱；而你，继承我的位置，成为新的钟匠。如何？”"]],
   foot:"“这个世界已经病了。你听见了吗？整个欧洲，都在同时想起另一场战争。让它们解脱，才是慈悲。”"},
  {k:"choice",text:"钟匠向你伸出手。地库深处，隐约传来整个柏林混乱的喧响。你的同伴们在铁门外与失控的守军缠斗，时间不多。",
   options:[
    {t:"假意答应，趁机夺回假笔，突围",to:7,set:{trick:"yes"}},
    {t:"拒绝：世界不需要第二个钟匠",to:8,set:{trick:"no"}}
   ]},
  {k:"text",head:"第十卷 · 回声战争",date:"国会大厦地库",
   pages:[
    ["","你上前一步，像是要交出假笔。就在钟匠伸手接过的刹那，你手腕一翻，假笔刺向他的胸口——笔尖在离他衣襟一寸处停住。他纹丝未动，只是低头看了一眼：“有趣。你父亲教你的？”"],
    ["","“不。你教我的。”你收回假笔，后退，“你刚才说，笔是用来记住的。那我用笔记住一件事——你不配决定世界。”你撞开密室侧门，冲进黑暗。身后，钟匠没有追。他的声音追上来：“年轻人，记住：你每次拒绝我，世界就离崩溃近一步。这不是威胁，是数学。”"]],
   foot:"你冲出地库，与同伴汇合。柏林上空，乌云翻涌，像一口倒扣的钟。"},
  {k:"text",head:"第十卷 · 回声战争",date:"国会大厦地库",
   pages:[
    ["","“我不当钟匠。”你说，“这个世界是错的，可它是活的。你们这些能重写世界的人，总是忘记一件事：活着的人，有权决定自己活在哪一页。”"],
    ["","钟匠的笑容淡了。“……你和他，真像。”他说，“你父亲也说过类似的话。然后他守了七年钟，看着世界一天天烂下去。”他转身，走向穹顶的裂缝，“那就让世界烂吧。等它烂到极点，自然会有新的钟匠出现。你拦不住的。”"],
    ["","“我不拦。”你说，“我会找到那支真笔，然后——签一个你们都不敢签的停战。”"]],
   foot:"你转身离开。身后，钟匠的笑声在地库里回荡：“那就让我们看看，你签下的停战，能活几年。”"},
  {k:"end",next:11,suspense:"你带着同伴离开柏林，直奔阿拉拉特。可当你们爬上雪线，钟巢的灯火已经熄灭。铁门洞开，里面空无一人——只有墙上多了一行字，是你的笔迹：“父亲，笔我带走了。去凡尔赛。1918年11月11日，镜厅见。——未来的你”",
   pages:[
    ["","你站在空荡荡的钟巢里，浑身发冷。那行字，是未来的你写的。他已经取走了真笔。"],
    ["","法蒂玛蹲下，摸了摸地面的灰烬：“他来过。而且……走了没多久。顺着山脊，往西。”"],
    ["","往西，是欧洲。是凡尔赛。是你答应与他会面的地方。"],
    ["","卡捷琳娜按住刀柄：“追？”你望着西沉的太阳，摇了摇头：“不。去凡尔赛。他说了，镜厅见——那就镜厅见。”"]],
   foot:"罗盘在你的口袋里，指针直直地指着西方，纹丝不动，像一枚被钉死的箭。"},
 ]},
/* ---------- 第十一卷 最后的停战 ---------- */
{num:11, meta:{title:"最后的停战",month:"1934年9月",loc:"凡尔赛",teaser:"父亲是守笔人。而他守的，是一个谎言。",stamp:"残响·拾壹"},
 steps:[
  {k:"text",head:"第十一卷 · 最后的停战",date:"1934年9月 · 凡尔赛",
   pages:[
    ["","凡尔赛宫笼罩在秋雨里。镜厅的玻璃映着铅灰色的天空，水晶吊灯在风中轻轻晃动——这座宫殿早已不再接待访客，帝国用铁栅栏把它围了起来，理由是‘保护胜利者的遗产’。"],
    ["","你从侧门的排水沟潜入。走廊里空无一人，只有雨声敲打着窗玻璃。你推开镜厅的大门——十七面镜子同时映出你的身影。厅中央，摆着一张长桌。桌上放着一支钢笔。笔尖在灯下，泛着温润的铜光。"],
    ["","‘真笔’安静地躺在那里，像等了十六年。你走向它。指尖碰到笔杆的瞬间，镜厅所有的镜子，同时亮了。镜子里映出的，不是你的倒影——是另一个世界：1918年11月11日，凡尔赛，协约国代表正在签字。而你父亲，就站在签字席旁，年轻了十六岁，手里捧着墨水瓶。"]],
   foot:"你终于看见了‘重写’发生的那一刻。而镜子里的父亲，缓缓抬起头，穿过十六年的时光，看着你。"},
  {k:"text",head:"第十一卷 · 最后的停战",date:"镜厅",
   pages:[
    ["","你伸手拿起真笔。笔身温热，像是被谁握了很久。你转身，看见镜厅的另一头，站着两个人。"],
    ["","一个是你父亲。他穿着七年前那件铁路工程师的制服，头发灰白，手里握着黄铜钥匙。另一个是未来的你——大祭司——他穿着灰袍，兜帽褪下，脸上是你熟悉的、疲惫的笑容。"],
    ["父亲","“你来了。”他像是等了很久，“我猜到你会的。未来的你告诉我，你会选择这条路——亲眼来看，而不是听谁说。”"],
    ["","你握着笔：“父亲。1918年，是你把笔递给钟匠的。为什么？”"],
    ["","父亲沉默了很久。雨声填满了镜厅。“因为那天，我以为我在阻止一场更大的灾难。我以为，只要签下‘另一个停战’，世界就不用再流血。可我错了。我亲手把笔递给了一个疯子，还替他守了十六年的秘密。”他看着你，“汉伯，我不求你原谅我。我只求你——用这支笔，做一个比我更好的决定。”"]],
   foot:"未来的你站在一旁，没有说话。镜子里，那个1918年的世界，还在继续。"},

/* ============================================================
   剧情引擎
   ============================================================ */
function curChapter(){return CHAPTERS[S.chapter-1]}
function curStep(){const c=curChapter();return c?c.steps[S.chapterStep]:null}
function storyStartChapter(n){
  if(!S)return;
  S.chapter=n;S.chapterStep=0;GS.storyBattle=false;GS.storyWin=false;GS.objText="";
  const ch=curChapter();
  addJournal("第"+ch.num+"卷 · "+ch.meta.title,ch.meta.month+" · "+ch.meta.loc+"："+ch.meta.teaser);
  if(localStorage.getItem("hanber3_auto")!=="0")saveToSlot(1);
  storyTick();
}
function storyTick(){
  if(!S||S.mode!=="story")return;
  if(GS.battle||modalStack.length)return;
  const st=curStep();
  if(!st)return;
  switch(st.k){
    case "text": runStoryText(st);break;
    case "choice": runStoryChoice(st);break;
    case "give": st.items.forEach(it=>addItem(it[0],it[1]||1));toast("获得："+st.items.map(it=>ITEMS[it[0]]?ITEMS[it[0]].name:it[0]).join("、"),"good");advanceStep();break;
    case "flag": applySets(st.set);advanceStep();break;
    case "obj": GS.objText=st.note||"";if(storyObjDone(st)){GS.objText="";advanceStep();}break;
    case "talk": GS.objText=st.note||"";break;
    case "battle":
      GS.objText=st.note||"";
      if(!GS.storyBattle){GS.storyBattle=true;GS.storyWin=false;startBattle(st.enemies);}
      else if(GS.storyWin){GS.storyWin=false;GS.storyBattle=false;GS.objText="";advanceStep();}
      break;
    case "end": runStoryEnd(st);break;
    case "ending": runStoryEnding(st);break;
    default: advanceStep();
  }
}
function applySets(set){
  if(!set)return;
  for(const k in set)S.storyFlags[k]=set[k];
}
function advanceStep(){
  S.chapterStep++;
  GS.objText="";
  const c=curChapter();
  if(!c){/* 终章后自由漫游 */return;}
  if(S.chapterStep>=c.steps.length){
    /* 章节完成保护 */
    S.chapterStep=c.steps.length-1;
  }
  storyTick();
}
function storyObjDone(st){
  if(st.city){const c=CITY_MAP[st.city];return c&&dist2(S.x,S.y,c.px,c.py)<85;}
  if(st.x!=null)return dist2(S.x,S.y,st.x,st.y)<85;
  return false;
}
function storyNpcTouched(npcId){
  if(!S||S.mode!=="story")return false;
  const st=curStep();
  if(!st||st.k!=="talk"||st.npc!==npcId)return false;
  runStoryTalk(st);
  return true;
}
function storyResume(){GS.objText="";storyTick();}
function storyPageHTML(pages){
  return pages.map((p,i)=>{
    const spk=p[0],txt=p[1]||"";
    return '<div class="story-page'+(i===0?" on":"")+'" data-p="'+i+'">'+
      (spk?'<div class="spk">'+spk+'</div>':'')+
      '<div class="story-body">'+txt+'</div></div>';
  }).join("");
}
function openStoryModal(head,date,pages,foot,btnLabel,onDone,extra){
  const m=openModal('<div class="story-paper" style="width:min(760px,94vw)">'+
    '<div class="story-head"><span class="ch">'+head+'</span><span class="date">'+(date||"")+'</span></div>'+
    '<div id="spPages">'+storyPageHTML(pages)+'</div>'+
    (foot?'<div class="story-foot" style="margin-top:14px;border-top:1px dashed var(--ink2);padding-top:10px;font-size:13px;color:var(--ink3);font-style:italic">'+foot+'</div>':'')+
    (extra||"")+
    '<div class="story-nav"><span class="stamp">档案</span><button class="btn" id="spNext">'+(btnLabel||"继续 ▸")+'</button></div></div>');
  m.mask.dataset.lock="1";
  const pagesEl=m.body.querySelectorAll(".story-page");
  let idx=0;
  const btn=m.body.querySelector("#spNext");
  btn.addEventListener("click",()=>{
    idx++;
    if(idx<pagesEl.length){
      pagesEl.forEach(p=>p.classList.remove("on"));
      pagesEl[idx].classList.add("on");
      btn.textContent=idx===pagesEl.length-1?(btnLabel==="继续 ▸"?"继续 ▸":btnLabel):"继续 ▸";
    }else{
      closeModal(m.mask);
      onDone&&onDone();
    }
  });
  return m;
}
function runStoryText(st){
  openStoryModal(st.head||"",st.date||"",st.pages,st.foot,"继续 ▸",()=>{advanceStep();});
}
function runStoryTalk(st){
  const scene=st.scene;
  const pages=scene.map((s,i)=>(i%2===0?[s,""]:[scene[i-1],s])).filter(p=>p[1]);
  openStoryModal("交谈",st.date||"",pages.length?pages:[[scene[0]||"","……"]],"","继续 ▸",()=>{GS.objText="";advanceStep();});
}
function runStoryChoice(st){
  let opts="";
  st.options.forEach((o,i)=>{
    opts+='<button class="btn" style="text-align:left;white-space:normal;line-height:1.6" onclick="storyChoose('+i+')">'+o.t+'</button>';
  });
  const m=openModal('<div class="story-paper" style="width:min(760px,94vw)">'+
    '<div class="story-head"><span class="ch">'+st.head+'</span><span class="date">'+(st.date||"")+'</span></div>'+
    '<div class="story-body">'+st.text+'</div>'+
    '<div class="story-choices">'+opts+'</div></div>');
  m.mask.dataset.lock="1";
  GS.storyChoice=st;
}
function storyChoose(i){
  const st=GS.storyChoice;
  if(!st)return;
  const o=st.options[i];
  applySets(o.set);
  GS.storyChoice=null;
  closeAllModals();
  S.chapterStep=o.to!=null?o.to:S.chapterStep+1;
  storyTick();
}
function runStoryEnd(st){
  const pages=st.pages||[];
  openStoryModal(st.head||"卷终",st.date||"",pages,st.suspense?"悬念 · "+st.suspense:"","卷终 ▸",()=>{
    const next=st.next;
    addJournal("第"+S.chapter+"卷 · 完","（本卷完）下一卷："+(next&&CHAPTERS[next-1]?CHAPTERS[next-1].meta.title:"——"));
    toast("第"+S.chapter+"卷 完结","good");
    if(next&&CHAPTERS[next-1]){
      if(localStorage.getItem("hanber3_auto")!=="0")saveToSlot(1);
      storyStartChapter(next);
    }
  });
}
function runStoryEnding(st){
  const pages=st.pages||[];
  openStoryModal(st.head||"终局",st.date||"",pages,st.epilogue?"尾声 · "+st.epilogue:"","落幕 ▸",()=>{
    S.ending=st.opt;
    S.chapter=13;S.chapterStep=0;
    addJournal("终章 · 结局"+st.opt+"「"+(st.opt==="A"?"定格":st.opt==="B"?"重写":"自焚")+"」",st.epilogue||"");
    if(localStorage.getItem("hanber3_auto")!=="0")saveToSlot(1);
    toast("主线完结。世界继续转动。","good");
    updateHUD();
  });
}
/* 主线剧情内的“到达城市”联动 */
function storyCityArrive(cid){
  if(!S||S.mode!=="story")return;
  const st=curStep();
  if(st&&st.k==="obj"&&st.city===cid)storyTick();
}

/* ---------- 启动 ---------- */
function boot(){
  renderOrigins();
  initParticles();
  bindMenu();
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    }else{
      if(!rafId){lastT=performance.now();rafId=requestAnimationFrame(loop);}
    }
  });
  WORLD=buildWorld(7);
  WORLD.explored=new Uint8Array(WORLD.ter.length);
  GS.mode="title";
  GS.zoomLabels=localStorage.getItem("hanber3_labels")!=="0";
  lastT=performance.now();
  rafId=requestAnimationFrame(loop);
}
/* 修复：HUD 章节索引 */
/* (updateHUD 中的 CHAPTERS[S.chapter] 已在下方修正为 CHAPTERS[S.chapter-1]) */
boot();

</script>
