<script>
/* ============================================================
   HanBer EIGHT · UI：HUD / 对话 / 过场 / 章节卡 / 商店 / 面板
   ============================================================ */

/* ---- Toast ---- */
function toast(msg){
  var box = $('ui');
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2600);
}

/* ---- HUD ---- */
function uiHudShow(){ $('hud').classList.remove('hidden'); }
function updateHud(){
  if(!P || G.state==='boot'||G.state==='menu'||G.state==='dead') return;
  setGauge('gHp', P.hp/P.maxhp);
  setGauge('gHunger', P.hunger/100);
  setGauge('gThirst', P.thirst/100);
  setGauge('gEng', P.eng/100);
  $('vHp').textContent = Math.ceil(P.hp);
  $('vHunger').textContent = Math.ceil(P.hunger);
  $('vThirst').textContent = Math.ceil(P.thirst);
  $('vEng').textContent = Math.ceil(P.eng);
  $('vMoney').textContent = P.money;
  $('vLv').textContent = P.lv;
  var hm = Math.floor(G.dayTime/60), mm = Math.floor(G.dayTime%60);
  $('vClock').textContent = G.day+'日 '+(hm<10?'0':'')+hm+':'+(mm<10?'0':'')+mm;
  $('vWeather').textContent = WEATHER_NAMES[WEATHER.type]||'';
  $('vDays').textContent = G.mode==='free' ? '生存'+G.stats.daysSurvived+'天' : '';
  var area = currentArea();
  if(area) $('vLoc').textContent = area;
}
function setGauge(id, p){
  var g = $(id);
  if(!g) return;
  var fill = g.querySelector('i');
  p = clamp(p, 0, 1);
  fill.style.width = Math.round(p*100)+'%';
  fill.className = p>0.5?'':(p>0.25?'mid':'low');
  if(id==='gThirst') fill.className = p>0.5?'water':(p>0.25?'water':'low');
  if(id==='gEng') fill.className = p>0.5?'eng':(p>0.25?'eng':'low');
}
function currentArea(){
  if(!P) return '';
  var best = null, bd = 9999;
  Object.keys(D.areas).forEach(function(k){
    var a = D.areas[k];
    if(P.x>=a.x && P.x<=a.x+a.w && P.y>=a.y && P.y<=a.y+a.h){
      if(a.w*a.h < bd){ bd = a.w*a.h; best = a.name; }
    }
  });
  if(best) return best;
  /* 城镇附近 */
  var t = nearestTownName();
  return t||'荒野';
}
function nearestTownName(){
  var best = '', bd = 999;
  D.towns.forEach(function(t){
    var d = Math.hypot(P.x-t.cx, P.y-t.cy);
    if(d<bd){ bd=d; best=t.name; }
  });
  return bd<18? best : '';
}

/* ---- 对话渲染 ---- */
function showDlgNode(){
  var dlg = $('dlg');
  if(!DLG){ dlg.classList.add('hidden'); return; }
  var node = DLG.nodes[DLG.idx];
  if(!node){ closeDlg(); return; }
  dlg.innerHTML = '';
  var sp = document.createElement('div');
  sp.className = 'speaker' + (node.who==='你'?' me':'');
  sp.textContent = node.who;
  var body = document.createElement('div'); body.className = 'body';
  var tx = document.createElement('div'); tx.className = 'text';
  tx.textContent = node.txt;
  body.appendChild(tx);
  if(node.opts && node.opts.length){
    var ch = document.createElement('div'); ch.className = 'choices';
    node.opts.forEach(function(o, i){
      var b = document.createElement('button'); b.className = 'btn';
      b.textContent = o.txt;
      if(o.cond && !condOk(o.cond)){ b.disabled = true; b.style.opacity = 0.45; }
      b.onclick = function(){ dlgPick(i); };
      ch.appendChild(b);
    });
    body.appendChild(ch);
  } else {
    var c = document.createElement('button'); c.className = 'btn';
    c.textContent = '继续 ▸';
    c.onclick = function(){ dlgContinue(); };
    body.appendChild(c);
  }
  dlg.appendChild(sp); dlg.appendChild(body);
  dlg.classList.remove('hidden');
}

/* ---- 过场（打字机） ---- */
function uiCutscene(lines, cb){
  var div = $('cutscene') || makeCut();
  div.classList.remove('hidden');
  var idx = 0;
  var body = div.querySelector('.cutBody');
  var title = div.querySelector('.cutTitle');
  title.textContent = G.mode==='story' ? '第'+G.chapter+'章 · '+(D.chapters[G.chapter-1]?D.chapters[G.chapter-1].title:'') : '自由模式';
  body.textContent = '';
  var btn = div.querySelector('.cutBtn');
  btn.textContent = '下一页 ▸';
  function showLine(){
    if(idx < lines.length){
      body.textContent = lines[idx];
      idx++;
      btn.textContent = idx < lines.length ? '下一页 ▸' : '继续 ▸';
    } else {
      div.classList.add('hidden');
      if(cb) cb();
    }
  }
  btn.onclick = showLine;
  showLine();
}
function makeCut(){
  var div = document.createElement('div');
  div.id = 'cutscene';
  div.style.cssText = 'position:absolute;inset:0;z-index:44;background:radial-gradient(ellipse at 50% 40%,#20260F 0%,#121608 70%,#060805 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;';
  var t = document.createElement('div'); t.className = 'cutTitle'; t.style.color = '#B98A2F';
  var b = document.createElement('div'); b.className = 'cutBody cutSceneText'; b.style.cssText = 'max-width:680px;padding:0 26px;color:#E8DCC0;min-height:120px;';
  var btn = document.createElement('button'); btn.className = 'btn cutBtn'; btn.style.marginTop = '28px';
  div.appendChild(t); div.appendChild(b); div.appendChild(btn);
  document.getElementById('ui').appendChild(div);
  return div;
}

/* ---- 章节卡 ---- */
function uiChapterCard(ch, next){
  var div = $('chapter');
  div.classList.remove('hidden');
  div.innerHTML = '';
  var no = document.createElement('div'); no.className = 'no';
  no.textContent = '第'+(next-1)+'章 · '+ch.title+' · 完结';
  var t = document.createElement('div'); t.className = 't';
  t.textContent = '待 续';
  var sub = document.createElement('div'); sub.className = 'sub';
  sub.textContent = ch.month+'的雨，下进了下一章';
  var lines = document.createElement('div'); lines.className = 'lines';
  lines.textContent = ch.teaser||'';
  var sus = document.createElement('div'); sus.className = 'suspense';
  sus.textContent = '【悬念已存档】在继续前，建议先保存进度。';
  var btn = document.createElement('button'); btn.className = 'btn';
  btn.textContent = '进入第'+next+'章 ▸';
  btn.onclick = function(){ div.classList.add('hidden'); chapterNext(); };
  div.appendChild(no); div.appendChild(t); div.appendChild(sub);

/* ---- 结局卡 ---- */
function uiEndCard(){
  var div = $('chapter');
  div.classList.remove('hidden');
  div.innerHTML = '';
  var ep = '';
  var title = '新世界的黎明';
  if(G.flags.end_open){
    ep = '你公开了一切。和谈在真相中重启，界河两岸的炮声第一次安静下来。\n没人知道未来会怎样——但至少，这一次，它不再由"永远不会死的战士"决定。';
    title = '结局·和 平';
  } else if(G.flags.end_burn){
    ep = '你炸掉了数据中心。棋手失去了棋子，战争变成了无数场混乱的散打。\n你走进雨林，再也没有人找到你。而天上的无人机，第一次消失了。';
    title = '结局·灰 烬';
  } else if(G.flags.end_seize){
    ep = '你坐进棋手的位置，按下了战争的暂停键。\n和平来了——这一次，握在你手里。只是你不知道，自己还能不能走回人间。';
    title = '结局·执 剑';
  } else {
    ep = '一年后的自由港，酒馆的雨夜。\n穿风衣的人推开门，胸前铜牌刻着"ONE"。\n他朝你举起杯："好久不见，EIGHT。"';
    title = '第 二 季 · 预 告';
  }
  var no = document.createElement('div'); no.className='no';
  no.textContent = 'HanBer EIGHT · 主线完结';
  var t = document.createElement('div'); t.className='t'; t.textContent = title;
  var sub = document.createElement('div'); sub.className='sub'; sub.textContent = '十七度线，终有一线';
  var lines = document.createElement('div'); lines.className='lines'; lines.textContent = ep;
  var sus = document.createElement('div'); sus.className='suspense';
  sus.textContent = '第二季预告：《新的编号正在苏醒》。存档已保存，你可以继续自由探索这个世界，等待下一季更新。';
  var row = document.createElement('div'); row.style.marginTop='26px';
  var b1 = document.createElement('button'); b1.className='btn'; b1.textContent='继续自由探索';
  b1.onclick = function(){ div.classList.add('hidden'); switchToFree(); };
  var b2 = document.createElement('button'); b2.className='btn ghost'; b2.textContent='回到主菜单';
  b2.onclick = function(){ div.classList.add('hidden'); backToMenu(); };
  row.appendChild(b1); row.appendChild(b2);

/* ---- 死亡 ---- */

  var pop = $('pop');
  pop.classList.remove('hidden');

  var p = document.createElement('div'); p.className='panel'; p.style.maxWidth='420px';

  var b1 = document.createElement('button'); b1.className='btn'; b1.textContent='在诊所醒来（损失20%金钱）';

/* ---- 商店 ---- */
function openShop(ent){
  if(DLG) DLG = null;
  G.state = 'pop';
  G.uiLock = true;
  var pop = $('pop');
  pop.classList.remove('hidden');
  pop.classList.add('wide');
  pop.innerHTML = '';
  var p = document.createElement('div'); p.className='panel';
  p.innerHTML = '<h2 class="pTitle">'+ent.name+' · 交易</h2>' +
    '<p class="mute" style="margin-bottom:8px">你有 '+money(P.money)+'</p>';
  var grid = document.createElement('div'); grid.className='grid2';
  /* 买入 */
  var buy = document.createElement('div');
  buy.innerHTML = '<h3 class="pTitle">购买</h3>';
  Object.keys(ent.shop||{}).forEach(function(id){
    var n = ent.shop[id];
    var it = D.items[id];
    var row = document.createElement('div'); row.className='listItem';
    row.innerHTML = '<div><div class="nm">'+it.icon+' '+it.name+' ×'+n+'</div>' +
      '<div class="ds">'+it.desc+'</div></div>' +
      '<button class="btn small" data-buy="'+id+'">'+money(it.price)+'</button>';
    buy.appendChild(row);
  });
  /* 卖出 */
  var sell = document.createElement('div');
  sell.innerHTML = '<h3 class="pTitle">卖出</h3>';
  var any = false;
  Object.keys(P.inv).forEach(function(id){
    var it = D.items[id];
    if(!it || it.cat==='quest' || it.price<=0) return;
    any = true;
    var row = document.createElement('div'); row.className='listItem';
    row.innerHTML = '<div><div class="nm">'+it.icon+' '+it.name+' ×'+P.inv[id]+'</div>' +
      '<div class="ds">'+it.desc+'</div></div>' +
      '<button class="btn small olive" data-sell="'+id+'">'+money(Math.floor(it.price*0.55))+'</button>';
    sell.appendChild(row);
  });
  if(!any) sell.innerHTML += '<p class="mute">没有可卖的东西。</p>';
  grid.appendChild(buy); grid.appendChild(sell);
  p.appendChild(grid);
  var close = document.createElement('button'); close.className='btn ghost'; close.textContent='离开';
  close.style.marginTop='14px';
  close.onclick = function(){ pop.classList.add('hidden'); pop.classList.remove('wide'); G.state='play'; G.uiLock=false; };
  p.appendChild(close);
  pop.appendChild(p);
  pop.querySelectorAll('[data-buy]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-buy');
      var it = D.items[id];
      if(P.money < it.price){ toast('钱不够'); return; }
      P.money -= it.price;
      addItem(id, 1);
      sfx('pickup');
      toast('买入：'+it.name);
      openShop(ent);
    };
  });
  pop.querySelectorAll('[data-sell]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-sell');
      var it = D.items[id];
      removeItem(id, 1);
      P.money += Math.floor(it.price*0.55);
      sfx('pickup');
      toast('卖出：'+it.name);
      openShop(ent);
    };
  });
}

/* ---- 背包 ---- */

  G.state = 'pop';
  G.uiLock = true;
  var pop = $('pop');
  pop.classList.remove('hidden');
  pop.classList.add('wide');

    cell.onclick = function(){
      uiItemMenu(id, cell);

    grid.appendChild(cell);
  });
  p.appendChild(grid);
  var row = document.createElement('div'); row.className='row';
  var b1 = document.createElement('button'); b1.className='btn ghost'; b1.textContent='关闭';
  b1.onclick = function(){ pop.classList.add('hidden'); pop.classList.remove('wide'); G.state='play'; G.uiLock=false; };
  var b2 = document.createElement('button'); b2.className='btn olive'; b2.textContent='烹饪（生肉→烤肉）';
  b2.onclick = function(){ cookFood(); uiInventory(); };
  var b3 = document.createElement('button'); b3.className='btn river'; b3.textContent='休息6小时';
  b3.onclick = function(){ sleep6h(); pop.classList.add('hidden'); pop.classList.remove('wide'); G.state='play'; G.uiLock=false; };
  row.appendChild(b2); row.appendChild(b3); row.appendChild(b1);
  p.appendChild(row);
  pop.appendChild(p);
}
function uiItemMenu(id, cell){
  var it = D.items[id];
  var sel = document.createElement('div');
  sel.className = 'panel'; sel.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,460px);z-index:35';
  sel.innerHTML = '<h3 class="pTitle">'+it.icon+' '+it.name+'</h3>' +
    '<p class="mute">'+it.desc+'</p><div class="sep"></div>';
  var usable = it.food||it.thirst||it.eng||it.hp;
  if(usable){
    var b1 = document.createElement('button'); b1.className='btn'; b1.textContent='使用';

    var b3 = document.createElement('button'); b3.className='btn olive'; b3.textContent='烹饪';
    b3.onclick = function(){ cookFood(); sel.remove(); uiInventory(); };
    sel.appendChild(b3);

  b4.onclick = function(){ removeItem(id,1); sel.remove(); uiInventory(); };
  var b5 = document.createElement('button'); b5.className='btn ghost'; b5.textContent='返回';

}

</script>
<script>
/* ============================================================
   HanBer EIGHT · 主入口：启动 / 帧循环 / 更新 / 渲染 / 按键
   ============================================================ */

var CVW = 1280, CVH = 720;
var CV = $('cv');
var CTX = CV.getContext('2d');
CV.width = CVW; CV.height = CVH;

var worldReady = false;

function initWorld(){
  if(worldReady) return;
  buildWorld();
  buildMinimap();
  worldReady = true;
}

/* ---- 新游戏 ---- */
function newGame(mode){
  initWorld();
  ENT.length = 0;
  G.mode = mode;
  G.chapter = 1;
  G.flags = {};
  G.quests = {};
  G.day = 1; G.clock = 0;
  G.stats = {kills:0, scav:0, bounties:0, questsDone:0, daysSurvived:0};
  G.night = false;
  G.paused = false;
  Object.keys(F_HOSTILE).forEach(function(k){ delete F_HOSTILE[k]; });
  var sa = D.towns.filter(function(t){return t.id==='saigon';})[0];
  createPlayer(sa.cx, sa.cy);
  spawnNamed();
  spawnGeneric();
  buildDock();
  $('boot').classList.add('hidden');
  uiHudShow();
  G.state = 'play';
  G.uiLock = false;
  if(mode==='story'){
    startChapter(1);
  } else {
    toast('自由模式：活下去。世界完全开放，没有主线。');
    updateObjective();
  }
  save();
}
function switchToFree(){
  G.mode = 'free';
  G.flags.end_done = true;
  G.state = 'play';
  G.uiLock = false;
  toast('你转入自由模式，继续在这个世界活下去。');
  updateObjective();
  save();
}

/* ---- 主循环 ---- */
var lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (ts - lastT)/1000 || 0.016);
  lastT = ts;
  G.time += dt;
  if(G.state==='play'){
    update(dt);
  }
  render();
  updateHud();
  if(G.state==='play' && !G.paused) updateDock();
  updateMinimapVis();
}
function update(dt){
  if(P.dead) return;
  /* 时间推进 */
  G.clock += dt;
  G.dayTime = (G.clock/CFG.dayLen)*1440;
  G.night = G.dayTime < 360 || G.dayTime > 1320;
  advanceTime(dt);
  survivalTick(dt);
  weatherTick(dt);
  updateEntities(dt);
  /* 玩家移动 */
  if(!G.uiLock){
    var mv = moveVec();
    if(mv.dx||mv.dy){
      var run = isRun() && P.eng > 5;
      var spd = run ? 4.6 : 3.0;
      var nx = P.x + mv.dx*spd*dt, ny = P.y + mv.dy*spd*dt;
      if(!solidAtF(nx, P.y)) P.x = nx;
      if(!solidAtF(P.x, ny)) P.y = ny;
      P.x = clamp(P.x, 0.6, W.w-0.6);
      P.y = clamp(P.y, 0.6, W.h-0.6);
      if(mv.dx !== 0) P.dir = mv.dx > 0 ? 1 : -1;
    }
    /* 攻击 */
    P.atkCd -= dt;
    if((KEYS[' '] || MOUSE.down) && P.atkCd<=0 && !isOverUi()){
      playerAttack();
    }
  }
  /* 交互 */
  var near = nearestInteract(1.6) || nearestLoot(1.8);
  G.showHint = near && !G.uiLock && G.state==='play';
  /* 区域追踪 */
  var area = areaAt(P.x, P.y);
  if(area !== G.lastArea){
    G.lastArea = area;
    if(area){
      G.flags['go_'+area] = true;
      emitEvent({type:'goto', area:area});
    }
  }
  /* 自动存档 */
  G.saveTimer += dt;
  if(G.saveTimer > 30){
    G.saveTimer = 0;
    save();
  }
}
function isOverUi(){
  /* 鼠标是否在UI按钮上（粗略：dialog/pop 打开时禁止攻击） */
  return G.uiLock || G.state!=='play';
}
function areaAt(x,y){
  var best = null, bd = 99999;
  Object.keys(D.areas).forEach(function(k){
    var a = D.areas[k];
    if(x>=a.x && x<=a.x+a.w && y>=a.y && y<=a.y+a.h){
      if(a.w*a.h < bd){ bd = a.w*a.h; best = k; }
    }
  });
  return best;
}

/* ---- 渲染 ---- */
function render(){
  CTX.fillStyle = '#0E120D';
  CTX.fillRect(0,0,CVW,CVH);
  if(!worldReady) return;
  var shx = 0, shy = 0;
  if(CAM.shake > 0.2){
    shx = rand(-CAM.shake, CAM.shake);
    shy = rand(-CAM.shake, CAM.shake);
    CAM.shake *= 0.85;
  } else CAM.shake = 0;
  CTX.save();
  CTX.translate(Math.round(shx), Math.round(shy));
  if(P && P.x!==undefined) camFollow(P.x, P.y);
  drawWorld(CTX);
  drawLootSpots(CTX);
  drawEntities(CTX);
  drawParticles(CTX);
  drawWeather(CTX);
  drawDarkness(CTX);
  CTX.restore();
}
var mmVisible = true;
function updateMinimapVis(){
  var mm = $('minimap');
  if(G.state==='play' && mmVisible && !mm.classList.contains('hidden')){
    drawMinimap();
  }
}
function toggleMinimap(){
  mmVisible = !mmVisible;
  var mm = $('minimap');
  if(mmVisible) mm.classList.remove('hidden');
  else mm.classList.add('hidden');
}

/* ---- 按键 ---- */
function handleKey(k){
  if(G.state==='boot') return;
  if(G.state==='dlg'){
    if(!DLG) return;
    var node = DLG.nodes[DLG.idx];
    if(node.opts && node.opts.length){
      var n = parseInt(k);
      if(n>=1 && n<=node.opts.length){
        var opt = node.opts[n-1];
        if(!(opt.cond && !condOk(opt.cond))) dlgPick(n-1);
      } else if(k==='escape'){
        closeDlg();
      }
    } else {
      if(k==='e'||k===' '||k==='enter') dlgContinue();
      else if(k==='escape') closeDlg();
    }
    return;
  }
  if(G.state==='pop'){
    if(k==='escape'){ closeTopPop(); }
    return;
  }
  if(G.state==='dead'){ return; }
  if(G.state!=='play') return;
  if(k==='e'){ doInteract(); }
  else if(k==='i'){ uiInventory(); }
  else if(k==='j'){ uiJournal(); }
  else if(k==='m'){ toggleMinimap(); }
  else if(k==='escape'){ uiPauseMenu(); }
  else if(k>='1' && k<='8'){
    var items = Object.keys(P.inv).filter(function(id){ return D.items[id].food||D.items[id].thirst||D.items[id].eng||D.items[id].hp; });
    var id = items[parseInt(k)-1];
    if(id) useItem(id);
  }
}
function closeTopPop(){
  var pop = $('pop');
  if(!pop.classList.contains('hidden')){
    pop.classList.add('hidden');
    pop.classList.remove('wide');
    if(G.state==='pop'){ G.state='play'; G.uiLock=false; }
  }
}

/* ---- 启动 ---- */
function boot(){
  initAudio();
  initWorld();
  /* 预载存档元信息（用于菜单显示章节） */
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      var st = JSON.parse(raw);
      G.mode = st.mode||'free';
      G.chapter = st.chapter||1;
      G.flags = st.flags||{};
      G.day = st.day||1;
    }
  }catch(e){}
  G.state = 'menu';
  G.uiLock = true;
  uiBoot();
  bindInput();
  /* HUD按钮 */
  $('btnInv').onclick = function(){ if(G.state==='play') uiInventory(); };
  $('btnJournal').onclick = function(){ if(G.state==='play') uiJournal(); };
  $('btnMenu').onclick = function(){ if(G.state==='play') uiPauseMenu(); };
  /* 按键分发 */
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    /* 过场/章节卡回车推进 */
    if(k==='enter'){
      var cut = $('cutscene');
      if(cut && !cut.classList.contains('hidden')){
        var cb = cut.querySelector('.cutBtn');
        if(cb) cb.click();
        return;
      }
      var ch = $('chapter');
      if(ch && !ch.classList.contains('hidden')){
        var b = ch.querySelector('.btn');
        if(b) b.click();
        return;
      }
    }
    handleKey(k);
  });
  requestAnimationFrame(function(ts){ lastT = ts; loop(ts); });
}
boot();
