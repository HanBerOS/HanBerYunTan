<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HanBer EIGHT · 十七度线</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   HanBer EIGHT · 十七度线
   设计基调：1975 未反转的架空印支 · 战争档案
   灰烬宣纸 / 墨线 / 黄铜 / 血锈红 / 丛林橄榄
   ============================================================ */
:root{
  --paper:#E8DCC0; --paper2:#D8C79B; --paper3:#F2E8CE;
  --ink:#241E16; --ink2:#4A3F30; --ink3:#7A6C54;
  --brass:#B98A2F; --brass2:#8F6A22;
  --rust:#8A4B2A; --blood:#9C3324; --blood2:#6F2118;
  --olive:#55603F; --olive2:#39401F;
  --fog:#6E7F8E; --river:#3E5F6E;
  --ok:#3F6B3F; --bad:#A33B2E;
  --panel:rgba(235,224,198,.97);
  --panel2:rgba(216,199,154,.9);
  --line:2px solid var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#14100B}
body{
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none; touch-action:none;
}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0e120d;image-rendering:auto}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}
.hidden{display:none!important}

/* ===== 通用面板与按钮 ===== */
.panel{
  background:var(--panel); border:var(--line);
  box-shadow:4px 4px 0 rgba(0,0,0,.32), inset 0 0 0 3px rgba(185,138,47,.22);
  border-radius:4px; padding:14px 16px; position:relative;
}
.panel::before,.panel::after{
  content:""; position:absolute; width:16px; height:16px;
  border:2px solid var(--blood); pointer-events:none;
}
.panel::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.panel::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.btn{
  display:inline-block; min-width:96px; padding:9px 16px; margin:4px;
  font-family:inherit; font-size:15px; font-weight:700; color:var(--paper3);
  background:linear-gradient(180deg,#C99B43,#8F6A22);
  border:1px solid #5C4313; border-bottom:3px solid #5C4313;
  border-radius:3px; cursor:pointer; letter-spacing:.12em;
  box-shadow:0 2px 0 rgba(0,0,0,.25); text-align:center;
  transition:transform .06s, filter .12s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);border-bottom:3px solid var(--ink);box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#B9503F,#6F2118);border-color:#4A150E}
.btn.olive{background:linear-gradient(180deg,#7A8760,#4C573C);border-color:#333C26}
.btn.river{background:linear-gradient(180deg,#5C7A88,#3A5660);border-color:#243A42}
.btn.small{min-width:64px;padding:5px 10px;font-size:13px}
.btn.mini{min-width:46px;padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.locked{opacity:.5}
h2.pTitle{font-size:24px;letter-spacing:.4em;text-align:center;color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
h3.pTitle{font-size:17px;letter-spacing:.25em;color:var(--ink)}
.sep{height:2px;background:linear-gradient(90deg,transparent,var(--brass),transparent);margin:8px 0}
.mute{color:#6E6250;font-size:13px}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}

/* ===== 顶栏 HUD ===== */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(20,16,11,.94),rgba(20,16,11,.72)); padding:6px 10px; border-bottom:2px solid rgba(185,138,47,.6);}
#hud .hL{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#hud .hR{display:flex;align-items:center;gap:6px}
#hud .stat{color:var(--paper3);font-size:14px;letter-spacing:.08em}
#hud .stat b{color:var(--brass);font-weight:700}
#hud .stat.warn b{color:#E0A65A}
#hud .stat.crit b{color:#E05555;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#hud .btn{padding:5px 10px;font-size:13px;min-width:52px}
.gauge{display:inline-block;width:78px;height:10px;background:#C9BC98;border:1px solid var(--ink);position:relative;overflow:hidden;vertical-align:middle}
.gauge i{display:block;height:100%;background:linear-gradient(180deg,#7BC07B,#3F7A3F)}
.gauge i.mid{background:linear-gradient(180deg,#E0C65A,#A8872F)}
.gauge i.low{background:linear-gradient(180deg,#E08A5A,#A84F2F)}
.gauge i.water{background:linear-gradient(180deg,#7BB8D8,#3F7090)}
.gauge i.eng{background:linear-gradient(180deg,#E8D86A,#B0A035)}
.gauge i.rep{background:linear-gradient(180deg,#C0807B,#8F504A)}
#hud .stat .ico{font-style:normal}

/* ===== 底部快捷栏 ===== */
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;
  background:linear-gradient(0deg,rgba(20,16,11,.94),rgba(20,16,11,.6)); padding:7px 8px; border-top:2px solid rgba(185,138,47,.55); flex-wrap:wrap}
.slot{width:52px;height:52px;background:var(--paper2);border:1px solid var(--ink);border-bottom:3px solid var(--ink);position:relative;cursor:pointer;font-size:20px;line-height:52px;text-align:center}
.slot .n{position:absolute;right:2px;bottom:0;font-size:11px;color:var(--ink3);font-weight:700}
.slot.sel{outline:3px solid var(--blood)}

/* ===== 悬浮面板容器 ===== */
#pop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,4,.55);z-index:30}
#pop .panel{max-width:min(92vw,760px);max-height:86vh;overflow:auto;width:92vw}
#pop.wide .panel{max-width:min(96vw,980px)}

/* ===== 标题界面 ===== */
#boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:40;
  background:radial-gradient(ellipse at 50% 32%,#2A2F1C 0%,#171A10 55%,#0B0D07 100%)}
#boot .rains{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#boot .titleT{font-size:clamp(36px,7vw,66px);font-weight:900;letter-spacing:.18em;color:var(--paper3);text-shadow:0 0 26px rgba(185,138,47,.45), 3px 3px 0 var(--ink);position:relative;z-index:2}
#boot .titleE{font-size:clamp(18px,3vw,30px);font-weight:900;letter-spacing:.5em;color:var(--blood);position:relative;z-index:2;text-shadow:0 0 18px rgba(156,51,36,.6)}
#boot .titleS{font-size:clamp(13px,2vw,18px);letter-spacing:.55em;color:var(--brass);position:relative;z-index:2;margin-top:4px}
#boot .titleSub{font-size:12px;letter-spacing:.28em;color:var(--paper2);position:relative;z-index:2;margin-top:12px;max-width:90vw;text-align:center;line-height:2}
#boot .menu{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;margin-top:24px;gap:0}
#boot .menu .btn{min-width:250px;font-size:17px}
#boot .ver{position:absolute;bottom:10px;right:14px;color:rgba(242,232,206,.5);font-size:12px;z-index:2}
#boot .warnBar{position:absolute;bottom:12px;left:14px;color:rgba(242,232,206,.45);font-size:11px;z-index:2;max-width:60vw;line-height:1.6}

/* ===== 对话框 ===== */
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:12%;width:min(94vw,880px);z-index:25;padding:0}
#dlg .speaker{display:inline-block;background:var(--blood);color:var(--paper3);padding:4px 14px;font-size:15px;letter-spacing:.2em;border:1px solid var(--blood2);border-bottom:none;border-radius:3px 3px 0 0}
#dlg .speaker.me{background:var(--ink2)}
#dlg .speaker.system{background:var(--olive2)}
#dlg .body{background:var(--panel);border:var(--line);border-radius:0 3px 3px 3px;padding:16px 20px;min-height:96px;box-shadow:5px 5px 0 rgba(0,0,0,.5)}
#dlg .text{font-size:17px;line-height:1.9;white-space:pre-wrap;min-height:56px}
#dlg .choices{margin-top:10px;display:flex;flex-direction:column;align-items:stretch;gap:6px}
#dlg .choices .btn{text-align:left;font-size:15px}
#dlg .tip{position:absolute;right:16px;bottom:10px;color:#6E6250;font-size:12px}

/* ===== 章节卡 ===== */
#chapter{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#232A16 0%,#14180C 70%,#080A05 100%)}
#chapter .no{font-size:15px;letter-spacing:.5em;color:var(--brass);margin-bottom:6px}
#chapter .t{font-size:clamp(30px,6vw,52px);font-weight:900;letter-spacing:.28em;color:var(--paper3);text-shadow:0 0 22px rgba(185,138,47,.5)}
#chapter .sub{font-size:14px;letter-spacing:.4em;color:var(--paper2);margin-top:12px}
#chapter .lines{margin-top:24px;max-width:660px;padding:0 24px;font-size:16px;line-height:2.1;color:var(--paper2);text-align:center;letter-spacing:.08em;white-space:pre-wrap;max-height:42vh;overflow:auto}
#chapter .btn{margin-top:28px}
#chapter .suspense{max-width:620px;padding:14px 20px;border:1px dashed var(--brass);color:var(--brass);background:rgba(185,138,47,.08);font-size:15px;line-height:1.9;margin-top:16px;letter-spacing:.06em}
#chapter .memo{margin-top:10px;font-size:12px;color:var(--ink3)}

/* ===== 清单 / 列表 ===== */
.listItem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(39,33,26,.25);cursor:pointer}
.listItem:hover{background:rgba(185,138,47,.16)}
.listItem .nm{font-weight:700;font-size:15px}
.listItem .ds{font-size:12px;color:#5E5340;margin-top:2px;line-height:1.6}
.listItem .rt{font-size:13px;color:var(--blood2);white-space:nowrap}
.tag{display:inline-block;background:var(--ink3);color:var(--paper3);font-size:11px;padding:2px 8px;border-radius:2px;letter-spacing:.12em;margin:1px}
.tag.gold{background:var(--brass2)}
.tag.blood{background:var(--blood)}
.tag.olive{background:var(--olive2)}
.tag.ok{background:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

/* ===== 物品栏网格 ===== */
.invGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.iv{background:var(--paper2);border:1px solid var(--ink);border-bottom:3px solid var(--ink);padding:8px 6px;text-align:center;cursor:pointer;position:relative}
.iv:hover{background:var(--paper3)}
.iv .ic{font-size:26px;display:block}
.iv .in{font-size:12px;font-weight:700;margin-top:2px;line-height:1.3}
.iv .icn{position:absolute;right:3px;bottom:1px;font-size:11px;color:var(--ink3)}
.iv.sel{outline:3px solid var(--blood)}

/* ===== 世界提示 ===== */
#hint{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:15;
  background:rgba(20,16,11,.88);color:var(--paper3);padding:6px 16px;font-size:14px;letter-spacing:.14em;border:1px solid var(--brass);border-radius:3px;pointer-events:none;white-space:pre}
#objective{position:absolute;top:100px;left:50%;transform:translateX(-50%);z-index:14;text-align:center;
  background:rgba(20,16,11,.8);color:var(--paper2);padding:5px 14px;font-size:13px;letter-spacing:.1em;border-left:3px solid var(--blood);max-width:80vw;line-height:1.6;pointer-events:none}

/* ===== 小地图 ===== */
#minimap{position:absolute;right:10px;top:64px;z-index:15;border:2px solid var(--ink);background:#000;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
#minimap canvas{display:block}

/* ===== 虚拟方向键 ===== */
#dpad{position:absolute;left:12px;bottom:76px;z-index:15;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px}
#dpad button{background:rgba(20,16,11,.82);border:1px solid var(--paper2);color:var(--paper3);font-size:20px;border-radius:4px;cursor:pointer}
#dpad .up{grid-column:2}
#dpad .left{grid-column:1;grid-row:2}
#dpad .down{grid-column:2;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
@media (pointer:coarse){#dpad{display:grid}}

/* ===== 输入 / 杂项 ===== */
input.txt{width:100%;padding:10px 12px;font-family:inherit;font-size:15px;background:var(--paper3);border:1px solid var(--ink);border-radius:2px;color:var(--ink)}
label.lbl{font-size:12px;color:#6E6250;letter-spacing:.1em}
#errBox{position:fixed;left:8px;bottom:8px;max-width:72vw;z-index:99;background:#7C2C22;color:#FFF;font-size:12px;padding:6px 10px;border-radius:3px;display:none;white-space:pre-wrap}
.toast{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:rgba(20,16,11,.94);color:var(--paper3);padding:8px 20px;border:1px solid var(--brass);border-radius:3px;font-size:14px;letter-spacing:.1em;z-index:50;animation:toastIn .25s;pointer-events:none;white-space:pre}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.helpKey{display:inline-block;background:var(--ink);color:var(--paper3);padding:1px 7px;border-radius:3px;font-size:12px;margin:0 2px}
.cutSceneText{font-size:17px;line-height:2.1;letter-spacing:.05em;white-space:pre-wrap;text-align:left}
.cutTitle{font-size:26px;font-weight:900;letter-spacing:.35em;color:var(--blood);margin-bottom:16px;text-align:center}
.suspenseBox{border:1px dashed var(--blood);background:rgba(156,51,36,.06);padding:12px 16px;color:var(--blood2);font-size:15px;line-height:1.9;margin-top:14px}
</style>
<style id="hanber-soviet-skin">
/* === HanBer 统一皮肤 · 后苏联忧郁美学 (Post-Soviet Melancholy) === */

  color:#d6cdb8 !important;
}
#hanber-vignette{position:fixed;inset:0;z-index:99998;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,.55) 100%);}
</style>
<div id="hanber-vignette"></div>
</head>

<script>
/* ============================================================
   HanBer EIGHT · 十七度线 —— 核心工具与全局容器
   ============================================================ */
(function(){
  var eb = document.getElementById('errBox');
  window.addEventListener('error', function(e){
    var m = String(e.message||e.error||'未知错误');
    eb.style.display = 'block';
    eb.textContent = '运行错误: ' + m + (e.lineno?' @行'+e.lineno:'');
    console.error(m, e.error);
  });
})();
var VER = 'EIGHT v1.0.0';
var $ = function(id){ return document.getElementById(id); };
function qs(sel, root){ return (root||document).querySelector(sel); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rand(a,b){ return a + Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(rand(a,b+1)); }
function chance(p){ return Math.random() < p; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function log(){ if(window.console) console.log.apply(console, arguments); }
function money(v){
  v = Math.round(v);
  return v + ' 南元';
}
/* 存档键名（每作独立，避免冲突） */

  roads: [],      // 道路点列
  lootSpots: [],  // 拾荒点
  spawnList: [],  // 命名NPC出生表
  events: []      // 自由模式随机事件
};
var CFG = {
  mapW: 320, mapH: 224, tile: 32,
  dayLen: 240,          // 一天=240秒(现实)
  startMoney: 180,
  capHp: 100, capHunger: 100, capThirst: 100, capEng: 100,
  carryLimit: 40,       // 负重kg上限
  diff: 1               // 难度倍率
};

<script>
/* ============================================================
   HanBer EIGHT · 引擎：世界生成 / 渲染 / 相机 / 输入 / 天气
   ============================================================ */

var W = { w: CFG.mapW, h: CFG.mapH, tiles:null, solid:null, decor:null, loot:null };

function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var RNG = mulberry32(20261017);

/* ---- 瓦片定义 ---- */
var TILE = {
  0:  {name:'深水', solid:true},
  1:  {name:'浅滩', solid:true},
  2:  {name:'草地', solid:false},
  3:  {name:'丛林', solid:false},
  4:  {name:'密林', solid:false},
  5:  {name:'山地', solid:true},
  6:  {name:'丘陵', solid:false},
  7:  {name:'道路', solid:false},
  8:  {name:'城区地面', solid:false},
  9:  {name:'城区墙壁', solid:true},
  10: {name:'门', solid:false},
  11: {name:'营地地面', solid:false},
  12: {name:'营地墙', solid:true},
  13: {name:'农田', solid:false},
  14: {name:'屋内地面', solid:false},
  15: {name:'桥梁', solid:false},
  16: {name:'废墟', solid:false},
  17: {name:'北方城区地面', solid:false},
  18: {name:'北方墙壁', solid:true},
  19: {name:'北方门', solid:false},
  20: {name:'河岸', solid:false}
};

/* ---- 世界构建 ---- */
function buildWorld(){
  W.tiles = new Uint8Array(W.w * W.h);
  W.solid = new Uint8Array(W.w * W.h);
  W.decor = new Uint8Array(W.w * W.h); // 0无 1树 2灌木 3残骸 4灯柱
  var cs = D.cellSize;
  var i, x, y, cx, cy, code;
  for(y=0;y<W.h;y++){
    for(x=0;x<W.w;x++){
      cx = Math.floor(x/cs); cy = Math.floor(y/cs);
      code = D.coarse[cy].charAt(cx);
      var t = 2; // 草地默认
      if(code==='M') t = (RNG()<0.55)?5:6;
      else if(code==='N') t = 2;
      else if(code==='J') t = (RNG()<0.7)?3:4;
      else if(code==='H') t = 6;
      else if(code==='W') t = 0;
      // 海岸线：陆地邻水做浅滩/河岸
      if(t!==0){
        var nearW = code!=='W' && (x+1<W.w && D.coarse[cy].charAt(Math.min(19,(x+1)/cs|0))==='W');
        if(!nearW && y+1<W.h && D.coarse[Math.min(13,(y+1)/cs|0)].charAt(cx)==='W') nearW = true;
        if(nearW && (t===2||t===6)) t = 20;
      }
      setTile(x,y,t);
    }
  }
  /* 界河（17度线）：横穿第5粗格 (y 80~95)，桥位留白 */
  for(y=80;y<96;y++) for(x=0;x<W.w;x++) setTile(x,y,0);
  for(y=80;y<96;y++){
    for(x=128;x<146;x++) setTile(x,y,15);          // 西桥
    for(x=206;x<224;x++) setTile(x,y,15);          // 东桥
  }
  /* 北方城区（红城） */
  paintTown(D.towns.filter(function(t){return t.id==='redcity';})[0], 17, 18, 19);
  /* 南方城市与港口 */
  paintTown(D.towns.filter(function(t){return t.id==='saigon';})[0], 8, 9, 10);
  paintTown(D.towns.filter(function(t){return t.id==='freeport';})[0], 8, 9, 10);
  paintTown(D.towns.filter(function(t){return t.id==='wildcat';})[0], 11, 12, 10);
  paintTown(D.towns.filter(function(t){return t.id==='farm';})[0], 13, 9, 10);
  paintTown(D.towns.filter(function(t){return t.id==='guerrilla';})[0], 11, 12, 10);
  paintTown(D.towns.filter(function(t){return t.id==='oldbase';})[0], 16, 12, 10);
  paintTown(D.towns.filter(function(t){return t.id==='sector7';})[0], 16, 12, 10);
  paintTown(D.towns.filter(function(t){return t.id==='outpost';})[0], 16, 12, 10);
  paintTown(D.towns.filter(function(t){return t.id==='military';})[0], 11, 12, 10);
  D.towns.forEach(function(t){
    if(t.kind==='camp') paintTown(t, 11, 12, 10);
  });
  /* 道路 */
  D.roads.forEach(function(seg){
    for(i=0;i<seg.length-1;i++){
      drawRoad(seg[i][0], seg[i][1], seg[i+1][0], seg[i+1][1]);
    }
  });
  /* 装饰 */
  for(y=0;y<W.h;y++) for(x=0;x<W.w;x++){
    var tv = W.tiles[y*W.w+x];
    if(tv===3 && RNG()<0.16) W.decor[y*W.w+x] = 1;
    else if(tv===4 && RNG()<0.30) W.decor[y*W.w+x] = 1;
    else if(tv===3 && RNG()<0.12) W.decor[y*W.w+x] = 2;
    else if((tv===8||tv===11||tv===16||tv===17) && RNG()<0.05) W.decor[y*W.w+x] = 3;
  }
  /* 拾荒点 */
  W.loot = [];
  D.towns.forEach(function(t){
    var n = D.lootCount[t.kind]||8;
    var attempts = n*6, made = 0;
    while(attempts-- > 0 && made < n){
      var lx = Math.floor(t.cx - t.w/2 + RNG()*t.w);
      var ly = Math.floor(t.cy - t.h/2 + RNG()*t.h);
      if(lx<2||ly<2||lx>W.w-2||ly>W.h-2) continue;
      var tv2 = W.tiles[ly*W.w+lx];
      if(tv2===9||tv2===12||tv2===18||tv2===0||tv2===5) continue;
      W.loot.push({x:lx, y:ly, kind:t.kind, done:false, t:0});
      made++;
    }
  });
  /* 撒少量野外拾荒点 */
  for(i=0;i<60;i++){
    var rx = 4 + (RNG()*(W.w-8))|0, ry = 4 + (RNG()*(W.h-8))|0;
    var tv3 = W.tiles[ry*W.w+rx];
    if(tv3===3||tv3===4||tv3===16||tv3===11){
      W.loot.push({x:rx, y:ry, kind:'wild', done:false, t:0}); i+=0;
    }
  }
  W.loot.sort(function(a,b){return a.kind!=='wild'?0:0});
}
function setTile(x,y,t){
  if(x<0||y<0||x>=W.w||y>=W.h) return;
  W.tiles[y*W.w+x] = t;
  W.solid[y*W.w+x] = TILE[t].solid?1:0;
}
function paintTown(t, floor, wall, door){
  var x0 = Math.max(1, Math.floor(t.cx - t.w/2)), y0 = Math.max(1, Math.floor(t.cy - t.h/2));
  var x1 = Math.min(W.w-1, Math.floor(t.cx + t.w/2)), y1 = Math.min(W.h-1, Math.floor(t.cy + t.h/2));
  var x, y, i;
  for(y=y0;y<y1;y++) for(x=x0;x<x1;x++) setTile(x,y,floor);
  /* 建筑网格：街宽2，楼宽4x3 */
  var bx, by;
  for(by=y0+2; by<y1-2; by+=5){
    for(bx=x0+2; bx<x1-2; bx+=6){
      var bw = 4 + (RNG()*3|0), bh = 3 + (RNG()*2|0);
      for(y=by; y<Math.min(by+bh,y1-1); y++){
        for(x=bx; x<Math.min(bx+bw,x1-1); x++){
          if(x===bx||x===bx+bw-1||y===by||y===by+bh-1) setTile(x,y,wall);
        }
      }
      /* 门朝街 */
      var doorX = bx + (bw/2|0);
      if(by+bh < y1-1) setTile(doorX, by+bh-1, door);
    }
  }
  /* 城镇广场 */
  var mx = (x0+x1)/2|0, my = (y0+y1)/2|0;
  for(y=my-1;y<=my+1;y++) for(x=mx-2;x<=mx+2;x++) setTile(x,y,floor);
}
function drawRoad(x0,y0,x1,y1){
  var steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
  for(var i=0;i<=steps;i++){
    var x = Math.round(x0 + (x1-x0)*i/steps);
    var y = Math.round(y0 + (y1-y0)*i/steps);
    if(x<0||y<0||x>=W.w||y>=W.h) continue;
    var tv = W.tiles[y*W.w+x];
    if(tv===0){ setTile(x,y,15); continue; } // 架桥
    if(tv===5||tv===9||tv===12||tv===18) continue;
    setTile(x,y,7);
    /* 路宽 */
    if(x>0 && W.tiles[y*W.w+x-1]!==9 && W.tiles[y*W.w+x-1]!==0 && W.tiles[y*W.w+x-1]!==5) setTile(x-1,y,7);
  }
}
function tileAt(x,y){
  x = Math.floor(x); y = Math.floor(y);
  if(x<0||y<0||x>=W.w||y>=W.h) return 5;
  return W.tiles[y*W.w+x];
}
function solidAt(x,y){
  if(x<0||y<0||x>=W.w||y>=W.h) return true;
  return W.solid[y*W.w+x]===1;
}
function solidAtF(px,py){
  return solidAt(Math.floor(px), Math.floor(py));
}

/* ---- 相机 ---- */
var CAM = {x:0, y:0, shake:0};
function camFollow(px,py){
  var vw = CVW/CFG.tile, vh = CVH/CFG.tile;
  CAM.x = clamp(px - vw/2, 0, W.w - vw);
  CAM.y = clamp(py - vh/2, 0, W.h - vh);
}

/* ---- 渲染：世界 ---- */
var TILE_COLORS = {
  0:'#1E3A4A', 1:'#2E4A5A', 2:'#3E5230', 3:'#2F4426', 4:'#23391C',
  5:'#5A5548', 6:'#5F6740', 7:'#8A7650', 8:'#6E6252', 9:'#8F7A5C',
  10:'#5C4313',11:'#5E5240',12:'#6B5A44',13:'#7A6A3A',14:'#4A4034',
  15:'#7A6850',16:'#524A3C',17:'#5A5A5A',18:'#6E6E6E',19:'#4E4E4E',20:'#2E4A3A'
};
function drawWorld(ctx){
  var t = CFG.tile;
  var x0 = Math.max(0, Math.floor(CAM.x)), y0 = Math.max(0, Math.floor(CAM.y));
  var x1 = Math.min(W.w-1, Math.ceil(CAM.x + CVW/t));
  var y1 = Math.min(W.h-1, Math.ceil(CAM.y + CVH/t));
  var ox = -Math.floor(CAM.x)*t, oy = -Math.floor(CAM.y)*t;
  var x, y, idx, tv, col;
  for(y=y0;y<=y1;y++){
    for(x=x0;x<=x1;x++){
      idx = y*W.w+x;
      tv = W.tiles[idx];
      col = TILE_COLORS[tv];
      if(tv===0){
        var sh = ((x*7+y*13 + Math.floor(G.time*2))%4===0);
        ctx.fillStyle = sh ? '#245060' : col;
      } else if(tv===3 && (x*3+y*5)%7===0){
        ctx.fillStyle = '#2A3D22';
      } else {
        ctx.fillStyle = col;
      }
      ctx.fillRect(ox + x*t, oy + y*t, t, t);
      /* 装饰 */
      var dc = W.decor[idx];
      if(dc===1){
        ctx.fillStyle = '#1B2E14';
        ctx.beginPath(); ctx.arc(ox+x*t+t/2, oy+y*t+t/2, t*0.38, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#2A4420';
        ctx.beginPath(); ctx.arc(ox+x*t+t/2, oy+y*t+t*0.38, t*0.26, 0, 6.283); ctx.fill();
      } else if(dc===2){
        ctx.fillStyle = '#3A5230';
        ctx.beginPath(); ctx.arc(ox+x*t+t/2, oy+y*t+t/2, t*0.2, 0, 6.283); ctx.fill();
      } else if(dc===3){
        ctx.fillStyle = '#3A3A30';
        ctx.fillRect(ox+x*t+4, oy+y*t+8, 8, 6);
        ctx.fillRect(ox+x*t+12, oy+y*t+12, 6, 4);
      }
    }
  }
  /* 建筑阴影/屋顶强调：墙壁上方加亮条 */
  for(y=y0;y<=y1;y++){
    for(x=x0;x<=x1;x++){
      tv = W.tiles[y*W.w+x];
      if(tv===9||tv===12||tv===18){
        ctx.fillStyle = 'rgba(0,0,0,.18)';
        ctx.fillRect(ox+x*t, oy+y*t+ t*0.66, t, t*0.34);
      }
    }
  }
}

/* ---- 输入 ---- */
var KEYS = {};
var MOUSE = {x:0, y:0, down:false};
var DPAD = {up:false,down:false,left:false,right:false};
function bindInput(){
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    KEYS[k] = true;
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','e','i','j','m','shift','escape'].indexOf(k)>=0){
      e.preventDefault();
    }
    if(G.audio && !G.audioStarted){ G.audioStarted = true; G.audio.resume && G.audio.resume(); }
  });
  window.addEventListener('keyup', function(e){ KEYS[e.key.toLowerCase()] = false; });
  var cv = $('cv');
  cv.addEventListener('mousemove', function(e){
    var r = cv.getBoundingClientRect();
    MOUSE.x = (e.clientX - r.left) * (CVW/r.width);
    MOUSE.y = (e.clientY - r.top) * (CVH/r.height);
  });
  cv.addEventListener('mousedown', function(e){
    MOUSE.down = true;
    if(G.audio && !G.audioStarted){ G.audioStarted = true; G.audio.resume && G.audio.resume(); }
  });
  window.addEventListener('mouseup', function(){ MOUSE.down = false; });
  /* 虚拟方向键 */
  document.querySelectorAll('#dpad button').forEach(function(b){
    var d = b.getAttribute('data-d');
    b.addEventListener('pointerdown', function(e){ e.preventDefault(); DPAD[d] = true; });
    b.addEventListener('pointerup', function(e){ e.preventDefault(); DPAD[d] = false; });
    b.addEventListener('pointerleave', function(){ DPAD[d] = false; });
  });
}
function isRun(){ return KEYS['shift']; }
function moveVec(){
  var dx=0, dy=0;
  if(KEYS['a']||KEYS['arrowleft']||DPAD.left) dx -= 1;
  if(KEYS['d']||KEYS['arrowright']||DPAD.right) dx += 1;
  if(KEYS['w']||KEYS['arrowup']||DPAD.up) dy -= 1;
  if(KEYS['s']||KEYS['arrowdown']||DPAD.down) dy += 1;
  if(dx!==0||dy!==0){
    var l = Math.hypot(dx,dy); dx/=l; dy/=l;
  }
  return {dx:dx, dy:dy};
}

/* ---- 粒子 ---- */
var parts = [];
function spawnParticle(x,y,vx,vy,life,color,size){
  parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,color:color,size:size||2});
}
function updateParticles(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.9; p.vy *= 0.9;
    p.life -= dt;
    if(p.life<=0) parts.splice(i,1);
  }
}
function drawParticles(ctx){
  parts.forEach(function(p){
    ctx.globalAlpha = clamp(p.life/p.max,0,1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x- p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

/* ---- 天气 ---- */
var WEATHER = {type:'clear', timer:0, rain:[]};
var WEATHER_NAMES = {clear:'晴', rain:'雨', storm:'雷暴'};
function weatherTick(dt){
  WEATHER.timer -= dt;
  if(WEATHER.timer<=0){
    var r = RNG();
    WEATHER.type = r<0.5?'clear':(r<0.8?'rain':'storm');
    WEATHER.timer = rand(60, 160);
  }
  if(WEATHER.type!=='clear' && P && Math.random()<0.5){
    WEATHER.rain.push({x:rand(0,CVW), y:rand(-40,0), v:rand(220,320)});
  }
  for(var i=WEATHER.rain.length-1;i>=0;i--){
    var ra = WEATHER.rain[i];
    ra.y += ra.v*dt;
    if(WEATHER.type==='storm') ra.x -= 40*dt;
    if(ra.y>CVH) WEATHER.rain.splice(i,1);
  }
  if(WEATHER.rain.length>140) WEATHER.rain.length = 140;
}
function drawWeather(ctx){
  if(WEATHER.type==='clear') return;
  var a = WEATHER.type==='storm'?0.22:0.12;
  ctx.strokeStyle = 'rgba(140,160,190,'+a+')';
  ctx.lineWidth = 1;
  WEATHER.rain.forEach(function(ra){
    ctx.beginPath();
    ctx.moveTo(ra.x, ra.y);
    ctx.lineTo(ra.x-2, ra.y-8);
    ctx.stroke();
  });
}

/* ---- 昼夜 ---- */
/* 时间：G.day 天数，G.clock 秒(游戏内) 一天=CFG.dayLen 秒 */
var DAY_START = 6*60; // 游戏内"分"制：一天=1440分
function nightAlpha(){
  var t = G.dayTime; // 0..1440
  var a = 0;
  if(t<360 || t>1320) a = 0.72;
  else if(t<420) a = 0.72 - (420-t)*0.012;
  else if(t>1260) a = (t-1260)*0.012;
  return clamp(a,0,0.72);
}
function drawDarkness(ctx){
  var a = nightAlpha();
  if(a<=0 || !P) return;
  var px = (P.x - CAM.x)*CFG.tile, py = (P.y - CAM.y)*CFG.tile;
  var lamp = 170;
  if(WEATHER.type!=='clear') lamp = 120;
  var g = ctx.createRadialGradient(px, py, 30, px, py, lamp);
  g.addColorStop(0, 'rgba(2,4,10,0)');
  g.addColorStop(1, 'rgba(2,4,10,'+a+')');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,CVW,CVH);
}

<script>
/* ============================================================
   HanBer EIGHT · 实体：玩家 / NPC / 敌人 / 野兽 / 战斗 / AI

var ENT = [];            // 全部实体
var ENT_ID = 1;

/* ---- BFS 寻路（粗网格，带时间戳避免清空） ---- */
var _vis = new Uint8Array(CFG.mapW*CFG.mapH);
var _stamp = 0;
function findStep(sx, sy, tx, ty, maxDepth){
  _stamp++;
  if(_stamp>2000000000) _stamp = 1;
  var q = [[Math.floor(sx), Math.floor(sy), null]];
  var head = 0;
  _vis[Math.floor(sy)*W.w+Math.floor(sx)] = _stamp;
  var gtx = Math.floor(tx), gty = Math.floor(ty);
  var depth = 0;
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while(head < q.length && depth < maxDepth){
    var cur = q[head++];
    depth++;
    if(cur[0]===gtx && cur[1]===gty) return cur[2];
    for(var i=0;i<4;i++){
      var nx = cur[0]+dirs[i][0], ny = cur[1]+dirs[i][1];
      if(nx<0||ny<0||nx>=W.w||ny>=W.h) continue;
      if(solidAt(nx,ny) && !(nx===gtx&&ny===gty)) continue;
      var idx = ny*W.w+nx;
      if(_vis[idx]===_stamp) continue;
      _vis[idx] = _stamp;
      q.push([nx,ny, cur[2]?cur[2]:[nx,ny]]);
    }
  }
  return null;
}
function losClear(x0,y0,x1,y1){
  var dist = Math.hypot(x1-x0, y1-y0);
  var steps = Math.ceil(dist*2);
  for(var i=1;i<steps;i++){
    var fx = x0 + (x1-x0)*i/steps, fy = y0 + (y1-y0)*i/steps;
    if(solidAtF(fx,fy)) return false;
  }
  return true;
}

/* ---- 实体创建 ---- */
function makeEnt(o){
  o.id = ENT_ID++;
  o.hp = o.hp || o.maxhp || 10;
  o.maxhp = o.maxhp || o.hp;
  o.t = 0;
  o.state = o.state || 'idle';
  o.dir = Math.random()<0.5?1:-1;
  o.cd = 0;
  o.wx = o.x; o.wy = o.y;
  o.dead = false;
  ENT.push(o);
  return o;
}
function newNPC(def){
  var town = D.towns.filter(function(t){return t.id===def.town;})[0];
  var x = town.cx + (def.ox||0) + rand(-2,2);
  var y = town.cy + (def.oy||0) + rand(-2,2);
  return makeEnt({
    type:'npc', name:def.name, role:def.role,
    x:x, y:y, town:def.town,
    faction:def.faction, color:def.color||D.factions[def.faction].color,
    npcId:def.id, shop:def.shop, healCost:def.healCost,
    hp:100, maxhp:100, dmg:0, speed:1.1, range:1,
    state:'idle', aggro:0, hostile:false
  });
}

  });
}
function spawnGeneric(){

    }
    for(i=0;i<(pop.guard||0);i++){
      makeEnt({
        type:'npc', name: pick(D.npcPools.names.sa), role:'守卫',
        x: rand(town.cx-town.w/2+2, town.cx+town.w/2-2),
        y: rand(town.cy-town.h/2+2, town.cy+town.h/2-2),
        town: tid, faction:'sa', color:D.factions.sa.color,
        hp:80, maxhp:80, dmg:8, speed:1.4, range:1.2, state:'patrol',
        guard:true, aggro:8
      });
    }
    for(i=0;i<(pop.north||0);i++){
      makeEnt({
        type:'npc', name: pick(D.npcPools.names.north), role: pick(D.npcPools.roles.north),
        x: rand(town.cx-town.w/2+2, town.cx+town.w/2-2),
        y: rand(town.cy-town.h/2+2, town.cy+town.h/2-2),
        town: tid, faction:'north', color:D.factions.north.color,
        hp:70, maxhp:70, dmg:12, speed:1.5, range:8, state:'patrol',
        guard:true, aggro:9, gun:'pistol'
      });
    }
    for(i=0;i<(pop.guer||0);i++){
      makeEnt({
        type:'npc', name: pick(D.npcPools.names.guer), role: pick(D.npcPools.roles.guer),
        x: rand(town.cx-town.w/2+2, town.cx+town.w/2-2),
        y: rand(town.cy-town.h/2+2, town.cy+town.h/2-2),
        town: tid, faction:'guer', color:D.factions.guer.color,
        hp:90, maxhp:90, dmg:14, speed:1.4, range:1.4, state:'patrol', guard:true, aggro:8
      });
    }
    for(i=0;i<(pop.merchant||0);i++){
      makeEnt({
        type:'npc', name: pick(D.npcPools.names.free), role:'店主',
        x: town.cx + rand(-4,4), y: town.cy + rand(-4,4),
        town: tid, faction:'free', color:D.factions.free.color,
        hp:50, maxhp:50, dmg:0, speed:0.4, range:1, state:'stand', shop: merchantStock()
      });
    }
    for(i=0;i<(pop.bandit||0);i++){
      spawnEnemyAt('bandit', rand(town.cx-town.w/2+2, town.cx+town.w/2-2), rand(town.cy-town.h/2+2, town.cy+town.h/2-2));
    }
  });
  /* 野外刷怪 */
  D.wildSpawns.forEach(function(sp){
    for(var i=0;i<sp.n;i++){
      var a = rand(0, 6.283);
      var d = rand(0, sp.r);
      var ex = sp.x + Math.cos(a)*d, ey = sp.y + Math.sin(a)*d;
      if(ex<2||ey<2||ex>W.w-2||ey>W.h-2) continue;
      if(solidAtF(ex,ey)) continue;
      if(sp.type==='deer') spawnAnimal('deer', ex, ey);
      else if(sp.type==='tiger') spawnAnimal('tiger', ex, ey);
      else if(sp.type==='python') spawnAnimal('python', ex, ey);
      else if(sp.type==='boar') spawnAnimal('boar', ex, ey);
      else spawnEnemyAt(sp.type, ex, ey);
    }
  });
}
function merchantStock(){
  var pool = ['bandage','pain','water','wine','coffee','biscuit','can','rice','cigs','ammo9','ammo12','ammo7','scrap','cloth','wire','battery','part','watch','eswatch'];
  var stock = {};
  var n = rndi(6,9);
  for(var i=0;i<n;i++){
    var it = pick(pool);
    stock[it] = (stock[it]||0) + rndi(1,4);
  }

}
function spawnEnemyAt(type, x, y){

    type:'enemy', name: d.name, enType: type,

    gun: d.melee?null:'pistol', hostile:true, state:'idle', xp:d.xp,

  });
}
function spawnAnimal(type, x, y){
  var d = D.enemies[type];
  return makeEnt({
    type:'animal', name: d.name, enType: type,
    x:x, y:y, faction: d.faction, color: type==='tiger'?'#C0562A':(type==='python'?'#4A7A3A':(type==='boar'?'#6E523A':'#8A7A5C')),
    hp: d.hp, maxhp: d.hp, dmg: d.dmg, speed: d.speed,
    range: 1.1, aggro: d.aggro, melee:true, hostile: d.prey?false:true, state:'idle',
    xp: d.xp, drop:d.drop||[], dropGold:d.dropGold||[0,0], prey:d.prey
  });
}

/* ---- 玩家 ---- */
function createPlayer(x,y){
  P = {
    type:'player', name:'HanBer · EIGHT',
    x:x, y:y, dir:1,
    hp:100, maxhp:CFG.capHp,
    hunger:100, thirst:100, eng:100,
    money:CFG.startMoney, lv:1, xp:0, xpNext:100,
    weapon:'fists', inv:{}, equip:{},
    carry:0, atkCd:0, regenT:0,
    dead:false, mode:null, day:1, aliveDays:0
  };
}
function invWeight(){
  var w = 0;
  Object.keys(P.inv).forEach(function(k){ w += (D.items[k]?D.items[k].w:0.5)*P.inv[k]; });
  Object.keys(P.equip).forEach(function(k){
    var id = P.equip[k];
    if(id && D.weapons[id]) w += D.weapons[id].w||0;
  });
  return w;
}
function addItem(id, n){
  n = n||1;
  if(!D.items[id]) return false;
  var max = D.items[id].stack || 99;
  if(!P.inv[id]) P.inv[id] = 0;
  var room = max - P.inv[id];
  var add = Math.min(room, n);
  P.inv[id] += add;
  if(P.inv[id]<=0) delete P.inv[id];
  return add;
}
function removeItem(id, n){
  n = n||1;
  if(!P.inv[id] || P.inv[id]<n) return false;
  P.inv[id] -= n;
  if(P.inv[id]<=0) delete P.inv[id];
  return true;
}
function hasItem(id, n){ return (P.inv[id]||0) >= (n||1); }
function addXp(n){
  P.xp += n;
  while(P.xp >= P.xpNext){
    P.xp -= P.xpNext;
    P.lv++;
    P.xpNext = Math.floor(P.xpNext*1.35);
    P.maxhp += 8; P.hp = Math.min(P.maxhp, P.hp+20);
    toast('等级提升！ Lv.'+P.lv+'（生命上限+8）');
  }
}
function equipWeapon(id){
  if(!D.weapons[id]) return;
  var old = P.weapon;
  P.weapon = id;
  P.equip.weapon = id;
  toast('装备了'+D.weapons[id].name);
  sfx('equip');
}

/* ---- 战斗 ---- */
function playerAttack(){
  if(P.atkCd>0 || !P || P.dead) return;
  var w = D.weapons[P.weapon];
  if(!w) return;
  if(w.type==='ranged'){
    if(!hasItem(w.ammo?('ammo'+(w.ammo==='9mm'?'9':w.ammo==='12g'?'12':'7')):null,1) && w.ammo){
      toast('没有弹药：'+w.ammo);
      return;
    }
    if(w.ammo) removeItem(w.ammo==='9mm'?'ammo9':(w.ammo==='12g'?'ammo12':'ammo7'),1);
  }
  P.atkCd = 1/w.speed;
  var tgt = nearestHostile();
  if(w.type==='melee'){
    if(tgt && distP(tgt) < w.range+0.6){
      hitEntity(tgt, w.dmg + (P.lv-1)*1, P);
      P.dir = tgt.x>P.x?1:-1;
      sfx('hit');
    } else {
      P.dir = 1;
      sfx('swing');
    }
  } else {
    shootWeapon(w, tgt);
  }
}
function shootWeapon(w, tgt){
  var mx = MOUSE.x/CFG.tile + CAM.x, my = MOUSE.y/CFG.tile + CAM.y;
  var sx = P.x, sy = P.y;
  var tx = tgt? tgt.x : mx, ty = tgt? tgt.y : my;
  var d = Math.hypot(tx-sx, ty-sy);
  if(d > w.range) { tx = sx + (tx-sx)/d*w.range; ty = sy + (ty-sy)/d*w.range; }
  P.dir = tx>P.x?1:-1;
  var hit = false;
  for(var i=0;i<ENT.length;i++){
    var e = ENT[i];
    if(e===P || e.dead) continue;
    if(e.faction===P.faction || (!e.hostile && !e.prey)) continue;
    var ed = dist(e, P);
    if(ed > w.range+1) continue;
    /* 与射线距离 */
    var seg = Math.abs((ty-sy)*e.x - (tx-sx)*e.y + tx*sy - ty*sx) / Math.max(0.001, d);
    if(seg < 1.0 && ed < w.range+0.8){
      var dmg = w.dmg;
      if(w.pellets){ dmg = 0; for(var p=0;p<w.pellets;p++) dmg += (w.dmg*rand(0.4,1.2))|0; }
      else dmg = (dmg*rand(0.8,1.25))|0;
      hitEntity(e, dmg, P);
      hit = true;
      break;
    }
  }
  sfx(w.type==='ranged'?'shot':'hit');
  spawnParticle((sx*CFG.tile - CAM.x*CFG.tile), (sy*CFG.tile - CAM.y*CFG.tile),
    (tx-sx)*3, (ty-sy)*3, 0.18, '#FFD77A', 3);
  CAM.shake = Math.min(8, CAM.shake + (w.type==='ranged'?3:1));
  if(w.pellets) for(var k=0;k<6;k++) spawnParticle(P.x*CFG.tile - CAM.x*CFG.tile, P.y*CFG.tile - CAM.y*CFG.tile, rand(-80,80), rand(-80,80), 0.3, '#C0562A', 2);
}
function nearestHostile(){
  var best = null, bd = 999;
  for(var i=0;i<ENT.length;i++){
    var e = ENT[i];
    if(e===P || e.dead) continue;
    if(e.hostile || e.prey || (e.guard && e.aggro>0 && hostileTo(e.faction))) {
      var d = dist(e,P);
      if(d < bd){ bd = d; best = e; }
    }
  }
  return best;
}
function hostileTo(f){
  return F_HOSTILE[f]===true || (f==='bandit'&&true) || (f==='north'&&!G.passNorth);
}
var F_HOSTILE = {};
function hitEntity(e, dmg, by){
  if(e.dead) return;
  e.hp -= dmg;
  e.hp = Math.max(0, e.hp);
  e.t = 0;
  e.lastHit = by;
  spawnParticle(e.x*CFG.tile - CAM.x*CFG.tile, e.y*CFG.tile - CAM.y*CFG.tile, rand(-30,30), rand(-40,10), 0.3, '#D04040', 3);
  if(e.guard && by===P){ setHostile(e.faction); }
  if(e.hp<=0) killEntity(e, by);
}
function setHostile(f){
  if(f==='sa'||f==='civ'||f==='free') { F_HOSTILE[f]=true; toast('你触怒了'+D.factions[f].name+'！'); }
  else F_HOSTILE[f] = true;
}
function killEntity(e, by){
  if(e.dead) return;
  e.dead = true;
  var i = ENT.indexOf(e);
  if(i>=0) ENT.splice(i,1);
  sfx('kill');
  /* 掉落 */
  if(by===P){
    if(e.drop) e.drop.forEach(function(id){ addItem(id, rndi(1,2)); });
    if(e.dropGold) addItem('silver',0), P.money += rndi(e.dropGold[0], e.dropGold[1]);
    if(e.xp) addXp(e.xp);
    if(e.enType) G.stats['kill_'+e.enType] = (G.stats['kill_'+e.enType]||0)+1;
    if(e.type==='enemy') G.stats.kills++;
    if(e.npcId) toast('你杀害了'+e.name);
    emitEvent({type:'kill', target:e});
  }
  if(e.enType==='boss'){
    setTimeout(function(){ runFx('set:ch10_boss'); }, 300);
  }
}
function dist(e1, e2){ return Math.hypot(e1.x-e2.x, e1.y-e2.y); }
function distP(e){ return Math.hypot(e.x-P.x, e.y-P.y); }

/* ---- 敌对NPC攻击玩家 ---- */
function enemyAttack(e){
  if(!P || P.dead) return;
  if(e.cd>0) return;
  if(e.melee){
    if(distP(e) < e.range+0.7){
      e.cd = 1.2;
      var dmg = Math.max(1, (e.dmg*G.diff)|0);
      P.hp -= dmg;
      CAM.shake = Math.min(8, CAM.shake+4);
      spawnParticle(P.x*CFG.tile - CAM.x*CFG.tile, P.y*CFG.tile - CAM.y*CFG.tile, 0, -20, 0.3, '#D04040', 4);
      sfx('hit');
      if(P.hp<=0){ P.hp = 0; playerDie(); }
    }
  } else {
    if(distP(e) < e.range+1 && losClear(e.x,e.y,P.x,P.y)){
      e.cd = 2.2;
      var dmg = Math.max(1, (e.dmg*G.diff)|0);
      if(P && !P.dead){
        P.hp -= dmg;
        spawnParticle(P.x*CFG.tile - CAM.x*CFG.tile, P.y*CFG.tile - CAM.y*CFG.tile, 0, -20, 0.3, '#D04040', 3);
        sfx('shot');
        if(P.hp<=0){ P.hp=0; playerDie(); }
      }
    }
  }
}

/* ---- AI 更新 ---- */
function updateEntities(dt){
  var i, e;
  for(i=ENT.length-1;i>=0;i--){
    e = ENT[i];
    if(e.dead) continue;
    e.cd -= dt;
    e.t += dt;
    var near = distP(e) < 26;
    if(!near && e.type!=='npc') continue; // 远处只更新NPC(它们需要对话)
    if(e.type==='npc') updateNpc(e, dt);
    else if(e.type==='enemy'||e.type==='animal') updateFoe(e, dt);
  }
}
function updateNpc(e, dt){
  var d = distP(e);
  e.dir = P && P.x > e.x ? 1 : -1;
  if(e.npcId && e.state!=='dead'){
    /* 命名NPC站在位置，若玩家接近则面向玩家 */
    if(d < 1.6) e.dir = P.x>e.x?1:-1;
    return;
  }
  if(e.state==='stand') return;
  if(d < 1.4){ e.dir = P.x>e.x?1:-1; return; }
  /* 守卫巡逻 */
  if(e.guard){
    e.t2 = (e.t2||0) + dt;
    if(e.t2 > 3){
      e.t2 = 0;
      e.tx = e.x + rand(-4,4); e.ty = e.y + rand(-4,4);
    }
  } else {
    e.t2 = (e.t2||0) + dt;
    if(e.t2 > 5){
      e.t2 = 0;
      e.tx = e.x + rand(-5,5); e.ty = e.y + rand(-5,5);
    }
  }
  if(e.tx!==undefined && Math.hypot(e.tx-e.x, e.ty-e.y) > 0.5){
    moveToward(e, e.tx, e.ty, e.speed*0.5, dt);
  }
}
function updateFoe(e, dt){
  if(!P || P.dead){ return; }
  var d = distP(e);
  /* 猎物逃跑 */
  if(e.prey){
    if(d < 5){ e.tx = e.x + (e.x-P.x)*3; e.ty = e.y + (e.y-P.y)*3; }
    else if(!e.tx || Math.hypot(e.tx-e.x,e.ty-e.y)<1){ e.tx = e.x+rand(-6,6); e.ty = e.y+rand(-6,6); }
    moveToward(e, e.tx, e.ty, e.speed, dt);
    return;
  }
  var hostile = e.hostile || (e.faction==='north' && !G.passNorth);
  if(hostile && d < e.aggro + (G.night?2:0) && losClear(e.x,e.y,P.x,P.y)){
    e.chasing = true;
    if(e.melee){
      if(d < e.range+0.8){ enemyAttack(e); }
      else {
        var step = findStep(e.x,e.y,P.x,P.y, 40);
        if(step) moveToward(e, step[0]+0.5, step[1]+0.5, e.speed, dt);
        else moveToward(e, P.x, P.y, e.speed, dt);
      }
    } else {
      if(d < e.range && d > 2){ enemyAttack(e); }
      else if(d > e.range*0.8){ moveToward(e, P.x, P.y, e.speed, dt); }
      else { moveToward(e, e.x - (P.x-e.x)*2, e.y - (P.y-e.y)*2, e.speed*0.8, dt); }
    }
  } else {
    e.chasing = false;
    e.t2 = (e.t2||0) + dt;
    if(e.t2 > 4){
      e.t2 = 0;
      e.tx = e.x + rand(-4,4); e.ty = e.y + rand(-4,4);
    }
    if(e.tx!==undefined) moveToward(e, e.tx, e.ty, e.speed*0.6, dt);
  }
  /* 低血量逃跑(非Boss) */
  if(!e.prey && e.hp < e.maxhp*0.25 && !e.melee && Math.random()<0.01){
    moveToward(e, e.x+(e.x-P.x)*4, e.y+(e.y-P.y)*4, e.speed*1.2, dt);
  }
}
function moveToward(e, tx, ty, spd, dt){
  var dx = tx - e.x, dy = ty - e.y;
  var d = Math.hypot(dx,dy);
  if(d < 0.05) return;
  var nx = e.x + dx/d*spd*dt, ny = e.y + dy/d*spd*dt;
  if(!solidAtF(nx, e.y)) e.x = nx;
  else e.x = e.x;
  if(!solidAtF(e.x, ny)) e.y = ny;
  if(e.x!==undefined) e.dir = dx>0?1:-1;
  e.x = clamp(e.x, 0.5, W.w-0.5);
  e.y = clamp(e.y, 0.5, W.h-0.5);
}

/* ---- 交互 ---- */
function nearestInteract(radius){
  radius = radius||1.5;
  var best = null, bd = radius;
  ENT.forEach(function(e){
    if(e===P || e.dead) return;
    var d = distP(e);
    if(d < bd && (e.type==='npc'||(e.type==='enemy'&&e.guard))){
      bd = d; best = e;
    }
  });
  return best;
}
function nearestLoot(radius){
  radius = radius||1.6;
  var best = null, bd = radius;
  W.loot.forEach(function(l){
    if(l.done) return;
    var d = Math.hypot(l.x+0.5-P.x, l.y+0.5-P.y);
    if(d < bd){ bd = d; best = l; }
  });
  return best;
}
function doInteract(){
  var e = nearestInteract(1.5);
  if(e && e.type==='npc'){
    if(e.npcId) startNpcDlg(e);
    else startGenericDlg(e);
    return;
  }
  var l = nearestLoot(1.6);
  if(l){ scavenge(l); return; }
  toast('附近没什么可互动的');
}
/* 拾荒 */
function scavenge(l){
  l.done = true;
  l.t = G.day; // 重置日
  var kind = l.kind;
  var table = {};
  if(kind==='wild') table = {scrap:0.5, cloth:0.3, wire:0.2, wood:0.3, can:0.25, part:0.15};
  else if(kind==='city'||kind==='village') table = {scrap:0.5, cloth:0.35, wire:0.25, can:0.4, biscuit:0.3, battery:0.2, part:0.25, eswatch:0.08};
  else if(kind==='ruins') table = {scrap:0.6, wire:0.3, battery:0.3, part:0.4, can:0.35, bandage:0.25, ammo9:0.2, silver:0.08, watch:0.06, diary:0.05, tape:0.04, folder:0.02, drone:0.02};
  else if(kind==='camp'||kind==='base'||kind==='outpost') table = {scrap:0.5, ammo9:0.3, ammo12:0.2, ammo7:0.25, bandage:0.3, can:0.3, part:0.2, stim:0.1, pain:0.15};
  else if(kind==='port') table = {scrap:0.4, wire:0.3, battery:0.25, cigs:0.25, wine:0.2, silver:0.12, eswatch:0.12, part:0.3, can:0.3};
  else if(kind==='farm') table = {wood:0.5, rawmeat:0.3, banana:0.4, rice:0.3, cloth:0.3, water:0.2};
  else table = {scrap:0.5, cloth:0.3, wood:0.4, can:0.3};
  /* 记忆碎片(第9章) */
  if(G.chapter===9 && G.flags.ch9_2 && !G.flags.frag_done && Math.random()<0.5){
    addItem('fragment',1);
    toast('你找到一块【记忆碎片】');
    emitEvent({type:'collect', item:'fragment', n:1});
    if((P.inv.fragment||0)>=3){ G.flags.frag_done = true; }
    return;
  }
  var roll = Math.random(), acc = 0, got = null;
  Object.keys(table).forEach(function(k){
    if(got) return;
    acc += table[k];
    if(roll < acc) got = k;
  });
  if(got){
    var n = (got==='scrap')? rndi(1,3) : 1;
    var added = addItem(got, n);
    if(added>0) toast('拾荒获得：'+D.items[got].name+'×'+added);
    emitEvent({type:'collect', item:got, n:added});
  } else {
    toast('这堆垃圾里什么也没有');
  }
}

/* ---- 渲染实体 ---- */
function drawEntities(ctx){
  var t = CFG.tile;
  var list = ENT.concat([]);
  list.sort(function(a,b){ return a.y - b.y; });
  list.forEach(function(e){
    var sx = e.x*t - CAM.x*t, sy = e.y*t - CAM.y*t;
    if(sx<-t*2||sy<-t*2||sx>CVW+t*2||sy>CVH+t*2) return;
    /* 阴影 */
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(sx+t/2, sy+t-3, t*0.34, t*0.16, 0, 0, 6.283); ctx.fill();
    var bob = Math.sin(e.t*3)*1.5;
    var bodyColor = e.color||'#8A7A5C';
    var isEnemy = e.type==='enemy';
    var isAnimal = e.type==='animal';
    var r = isEnemy? t*0.30 : t*0.26;
    var cx = sx + t/2, cy = sy + t/2 + bob;
    /* 身体 */
    ctx.fillStyle = bodyColor;
    if(isAnimal){
      ctx.beginPath();
      if(e.enType==='deer'){ ctx.ellipse(cx, cy, r*1.1, r*0.7, 0, 0, 6.283); }
      else if(e.enType==='python'){ ctx.ellipse(cx, cy, r*1.4, r*0.5, e.dir, 0, 6.283); }
      else ctx.ellipse(cx, cy, r*1.2, r*0.8, 0, 0, 6.283);
      ctx.fill();
      if(e.enType==='tiger'){
        ctx.fillStyle = '#3A2418';
        ctx.fillRect(cx-r*0.6, cy-3, r*1.2, 3);
        ctx.fillRect(cx-r*0.9, cy-7, r*1.8, 3);
      }
    } else {
      ctx.beginPath();
      ctx.roundRect(cx - r, cy - r*0.9, r*2, r*1.8, 4);
      ctx.fill();
      /* 头 */
      ctx.fillStyle = '#D9C9A8';
      ctx.beginPath(); ctx.arc(cx + e.dir*r*0.55, cy - r*0.75, r*0.42, 0, 6.283); ctx.fill();
      /* 帽子/特征 */
      if(e.guard || (e.faction==='north')){
        ctx.fillStyle = e.faction==='north'?'#6E6E6E':'#8F6A22';
        ctx.fillRect(cx - r*0.55, cy - r*1.45, r*1.1, r*0.5);
      } else if(e.npcId){
        ctx.fillStyle = 'rgba(0,0,0,.3)';
        ctx.fillRect(cx - r*0.5, cy + r*0.3, r, r*0.25);
      }
      if(e.role==='店主'||e.shop){
        ctx.fillStyle = '#B98A2F';
        ctx.fillRect(cx - r*0.7, cy - r*0.3, r*0.7, r*0.6);
      }
    }
    /* 血条 */
    if((isEnemy||e.guard||e.npcId) && e.hp < e.maxhp){
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(cx-r, cy-r*1.6, r*2, 4);
      ctx.fillStyle = '#7BC07B';
      ctx.fillRect(cx-r, cy-r*1.6, r*2*(e.hp/e.maxhp), 4);
    }
    /* 名称 */
    if(e.npcId){
      ctx.fillStyle = '#F2E8CE';
      ctx.font = '600 11px "Noto Serif SC",serif';
      ctx.textAlign = 'center';
      ctx.fillText(e.name, cx, cy - r*1.5);
    }
    /* 武器(敌对) */
    if(e.melee && isEnemy && e.chasing){
      ctx.fillStyle = '#3A3A3A';
      ctx.fillRect(cx + e.dir*r*0.8, cy, r*0.7, 3);
    }
  });
  /* 玩家 */
  if(P && !P.dead){
    var px = P.x*t - CAM.x*t, py = P.y*t - CAM.y*t;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(px+t/2, py+t-3, t*0.36, t*0.16, 0, 0, 6.283); ctx.fill();
    var bob = Math.sin(G.time*4)*1.5;
    var cx = px+t/2, cy = py+t/2+bob;
    ctx.fillStyle = '#2E5A6E'; // 青色夹克
    ctx.beginPath(); ctx.roundRect(cx-9, cy-9, 18, 20, 5); ctx.fill();
    ctx.fillStyle = '#D9C9A8';
    ctx.beginPath(); ctx.arc(cx+P.dir*5, cy-8, 6, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1E3A4A';
    ctx.fillRect(cx-9, cy-12, 18, 4);
    /* 武器 */
    var w = D.weapons[P.weapon];
    if(w){
      ctx.fillStyle = '#6E6250';
      if(w.type==='ranged'){
        ctx.fillRect(cx + P.dir*8, cy-2, 12, 3);
      } else {
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(P.dir*0.7);
        ctx.fillRect(4, -1, 10, 2);
        ctx.restore();
      }
    }
    /* 面向标记(交互目标高亮) */
    if(G.showHint){
      ctx.fillStyle = 'rgba(255,215,122,.9)';
      ctx.font = '12px serif';
      ctx.textAlign = 'center';
      ctx.fillText('E', px+t/2, py-18);
    }
  }
}

</script>
<script>
/* ============================================================
   HanBer EIGHT · 系统：生存 / 对话引擎 / 任务 / 章节 / 存档 / 音效
   ============================================================ */

var G = {
  state:'boot',          // boot/menu/play/dlg/cut/chapter/pop/dead/end
  mode:'story',          // story / free
  chapter:1,
  flags:{},
  quests:{},             // id -> {state:'active'|'done', objs:[{cur,n}]}
  day:1, clock:0,        // 游戏内
  time:0,                // 现实累计秒
  night:false,
  diff:1,
  audio:null, audioStarted:false, muted:false,
  lastArea:'',
  showHint:false,
  paused:false,
  saveTimer:0,
  uiLock:false,
  stats:{kills:0, scav:0, bounties:0, questsDone:0, daysSurvived:0}
};

/* ---- 音效（WebAudio 合成） ---- */
function initAudio(){
  try{
    var AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    G.audio = new AC();
    G.master = G.audio.createGain();
    G.master.gain.value = 0.5;
    G.master.connect(G.audio.destination);
  }catch(e){}
}
function sfx(type){
  if(!G.audio || G.muted || !G.audioStarted) return;
  var ctx = G.audio, t = ctx.currentTime;
  var osc, gain, noise, filter;
  switch(type){
    case 'shot':
      noise = ctx.createBufferSource();
      var buf = ctx.createBuffer(1, ctx.sampleRate*0.12, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length, 2);
      noise.buffer = buf;
      filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=1600;
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.12);
      noise.connect(filter); filter.connect(gain); gain.connect(G.master);
      noise.start();
      break;
    case 'hit':
      osc = ctx.createOscillator(); osc.type='square'; osc.frequency.setValueAtTime(120,t);
      osc.frequency.exponentialRampToValueAtTime(50, t+0.1);
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.25,t);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.12);
      osc.connect(gain); gain.connect(G.master); osc.start(); osc.stop(t+0.13);
      break;
    case 'swing':
      noise = ctx.createBufferSource();
      var buf2 = ctx.createBuffer(1, ctx.sampleRate*0.15, ctx.sampleRate);
      var d2 = buf2.getChannelData(0);
      for(var j=0;j<d2.length;j++) d2[j] = Math.sin(j/8)*0.3*Math.pow(1-j/d2.length,2);
      noise.buffer = buf2;
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.15,t);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
      noise.connect(gain); gain.connect(G.master); noise.start();
      break;
    case 'kill':
      osc = ctx.createOscillator(); osc.type='triangle';
      osc.frequency.setValueAtTime(400,t); osc.frequency.exponentialRampToValueAtTime(80,t+0.15);
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.2,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      osc.connect(gain); gain.connect(G.master); osc.start(); osc.stop(t+0.16);
      break;
    case 'pickup':
      osc = ctx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(520,t); osc.frequency.setValueAtTime(780,t+0.06);
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.15,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      osc.connect(gain); gain.connect(G.master); osc.start(); osc.stop(t+0.13);
      sfx('ui2');
      break;
    case 'ui':
      osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value=640;
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.08,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.07);
      osc.connect(gain); gain.connect(G.master); osc.start(); osc.stop(t+0.08);
      break;
    case 'ui2':
      osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=900;
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.06,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.06);
      osc.connect(gain); gain.connect(G.master); osc.start(); osc.stop(t+0.07);
      break;
    case 'equip':
      osc = ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(200,t);
      osc.frequency.exponentialRampToValueAtTime(400,t+0.1);
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.12,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      osc.connect(gain); gain.connect(G.master); osc.start(); osc.stop(t+0.13);
      break;
    case 'heal':
      osc = ctx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(500,t); osc.frequency.setValueAtTime(700,t+0.1);
      gain = ctx.createGain(); gain.gain.setValueAtTime(0.15,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.18);
      osc.connect(gain); gain.connect(G.master); osc.start(); osc.stop(t+0.2);
      break;
  }
}

/* ---- 生存 ---- */
function survivalTick(dt){
  if(!P || P.dead) return;
  var spd = 1;
  P.hunger -= 0.12*spd*dt;
  P.thirst -= 0.15*spd*dt;
  P.eng -= 0.03*spd*dt;
  if(isRun() && !G.uiLock) P.eng -= 0.35*dt;
  /* 饿/渴掉血 */
  if(P.hunger<=0){ P.hp -= 2.0*dt; P.hunger = 0; }
  if(P.thirst<=0){ P.hp -= 3.0*dt; P.thirst = 0; }
  if(P.hp<=0 && !P.dead){ P.hp = 0; playerDie(); return; }
  /* 缓慢回血 */
  if(P.hunger>60 && P.thirst>60 && P.eng>25 && P.hp>0 && P.hp<P.maxhp && !isRun()){
    P.hp = Math.min(P.maxhp, P.hp + 0.8*dt);
  }
  P.hunger = clamp(P.hunger, 0, CFG.capHunger);
  P.thirst = clamp(P.thirst, 0, CFG.capThirst);
  P.eng = clamp(P.eng, 0, CFG.capEng);
  P.regenT = (P.regenT||0) + dt;
}
function useItem(id){
  var it = D.items[id];
  if(!it || !P.inv[id]) return;
  var used = false;
  if(it.food){ P.hunger = clamp(P.hunger+it.food, 0, 100); used = true; }
  if(it.thirst){ P.thirst = clamp(P.thirst+it.thirst, 0, 100); used = true; }
  if(it.eng){ P.eng = clamp(P.eng+it.eng, 0, 100); used = true; }
  if(it.hp){ P.hp = clamp(P.hp+it.hp, 0, P.maxhp); used = true; }
  if(!used){ toast(D.items[id].name+'不能直接使用'); return; }
  removeItem(id, 1);
  sfx('pickup');
  var s = [];
  if(it.food) s.push('饱食+'+(it.food>0?'':'')+it.food);
  if(it.thirst) s.push('水分+'+(it.thirst>0?'':'')+it.thirst);
  if(it.eng) s.push('体力+'+(it.eng>0?'':'')+it.eng);
  if(it.hp) s.push('生命+'+(it.hp>0?'':'')+it.hp);
  toast('使用'+it.name+'：'+s.join(' '));
}
/* 烹饪：篝火/炉灶——把生肉/生鱼变烤肉 */
function cookFood(){
  var raw = 0;
  if(P.inv.rawmeat) raw += P.inv.rawmeat;
  if(P.inv.fish) raw += P.inv.fish;
  if(raw<=0){ toast('没有可烹饪的生肉/生鱼'); return; }
  removeItem('rawmeat', 1) || removeItem('fish', 1);
  addItem('cooked', 1);
  toast('烤熟了一份肉');
  sfx('heal');
}
function sleep6h(){
  var enemies = ENT.some(function(e){
    return (e.hostile && distP(e) < 10) || (e.guard && e.aggro>0 && hostileTo(e.faction) && distP(e)<10);
  });
  if(enemies){ toast('附近有敌人，无法安心休息！'); return; }
  advanceTime(60); // 游戏内6小时（一天=240现实秒）
  P.hp = Math.min(P.maxhp, P.hp + 25);
  P.eng = 100;
  P.hunger = Math.max(0, P.hunger-8);
  P.thirst = Math.max(0, P.thirst-10);
  toast('你睡了6个小时，恢复了体力');
  sfx('heal');
}
function advanceTime(sec){
  G.clock += sec;
  while(G.clock >= CFG.dayLen){
    G.clock -= CFG.dayLen;
    G.day++;
    G.stats.daysSurvived++;
    if(G.mode==='free') freeDayEvent();
    /* 拾荒点重置 */
    W.loot.forEach(function(l){ if(l.done && G.day > l.t+1) l.done = false; });
    /* 营地敌人重生 */
    if(G.day % 2 === 0) respawnCamp();
  }
}
function respawnCamp(){
  D.wildSpawns.forEach(function(sp){
    if(sp.type!=='bandit') return;
    var count = ENT.filter(function(e){ return e.type==='enemy' && e.enType==='bandit'; }).length;
    if(count < 30){
      spawnEnemyAt('bandit', sp.x + rand(-sp.r,sp.r), sp.y + rand(-sp.r,sp.r));
    }
  });
}

/* ---- 玩家死亡 ---- */
function playerDie(){
  if(!P || P.dead) return;
  P.dead = true;
  sfx('kill');
  G.state = 'dead';
  G.uiLock = true;
  uiShowDeath();
}
function respawnPlayer(){
  var t = D.towns.filter(function(x){return x.id==='saigon';})[0];
  var lose = Math.floor(P.money*0.2);
  P.money -= lose;
  P.hp = Math.max(30, P.maxhp*0.5);

  P.x = t.cx; P.y = t.cy;

}

/* ---- 对话引擎 ---- */
var DLG = null; // {key, nodes, idx, ent, busy}
function getDlgKey(npcId){
  var ch = G.chapter;
  if(G.mode==='free') return 'base_'+npcId;
  if(G.flags['dlgd_'+ch+'_'+npcId]) return 'base_'+npcId;
  return 'base_'+npcId;
}
/* 按章节 talkOrder 顺序取下一个待播放的对话 */
function dlgForObjective(npcId){
  var ch = D.chapters[G.chapter-1];
  if(!ch || G.mode==='free' || !ch.talkOrder) return null;
  var order = ch.talkOrder[npcId];
  if(!order || !order.length) return null;
  var cnt = G.flags['dlgCnt_'+npcId] || 0;
  if(cnt < order.length) return order[cnt];
  return null;
}
function startNpcDlg(ent){
  if(!ent || !ent.npcId) return;
  var key = dlgForObjective(ent.npcId);
  if(!key){
    if(G.chapter===12 && (G.flags.ch11_open||G.flags.ch11_burn||G.flags.ch11_seize)){
      if(ent.npcId==='maya') key = 'ch12_tail';
      else key = 'base_'+ent.npcId;
    } else {
      key = 'base_'+ent.npcId;
      /* 支线交付：giver 已完成任务 → 交付对话 */
      var q = activeQuestByGiver(ent.npcId);
      if(q && questObjsDone(q) && !G.flags['qrew_'+q.id]){
        var dq = findDlg(q.id);
        if(dq){ key = dq; }
      }
    }
  }
  if(!D.dlg[key]){ key = 'base_'+ent.npcId; }
  if(!D.dlg[key]){ startGenericDlg(ent); return; }
  DLG = {key:key, nodes:D.dlg[key], idx:0, ent:ent};
  G.state = 'dlg';
  G.uiLock = true;
  sfx('ui');
  showDlgNode();
}
function activeQuestByGiver(npcId){
  var q = null;
  D.sideQuests.forEach(function(def){
    if(def.giver!==npcId) return;
    if(!q && G.quests[def.id] && G.quests[def.id].state==='active') q = G.quests[def.id];
  });
  return q;
}
function findDlg(qid){
  /* 交付对话键：q_{id}_done? 约定 dlgs 键名与 quest dlgDone 字段一致 */
  var q = D.sideQuests.filter(function(x){return x.id===qid;})[0];
  return q ? q.dlgDone : null;
}
function startGenericDlg(ent){
  var faction = ent.faction;
  var lines = [];
  var r = Math.random();
  if(r < 0.45) lines = D.ambient.civ_greet;
  else if(faction==='civ') lines = r<0.6? D.ambient.civ_greet : D.ambient.civ_rumor;
  else if(faction==='sa') lines = r<0.6? D.ambient.sa_greet : D.ambient.sa_rumor;
  else if(faction==='north') lines = D.ambient.north_greet;
  else if(faction==='guer') lines = D.ambient.guer_greet;
  else if(faction==='free') lines = r<0.6? D.ambient.free_greet : D.ambient.free_greet;
  else lines = D.ambient.bandit_greet;
  var text = pick(lines);
  if(G.night && r>0.75) text = pick(D.ambient.night);
  var opts = [];
  if(ent.shop) opts.push({txt:'【交易】看看你有什么货', fx:'trade'});
  if(ent.healCost) opts.push({txt:'【治疗】请帮我处理伤口', fx:'heal'});
  opts.push({txt:'（离开）', next:'end'});
  DLG = {key:'generic', nodes:[{who:ent.name, txt:text, opts:opts}], idx:0, ent:ent};
  G.state = 'dlg';
  G.uiLock = true;
  sfx('ui');
  showDlgNode();
}
function dlgPick(idx){
  if(!DLG) return;
  var node = DLG.nodes[DLG.idx];
  var opt = node.opts[idx];
  if(!opt) return;
  if(opt.cond && !condOk(opt.cond)) return;
  sfx('ui');
  if(opt.fx) runFx(opt.fx);
  var nxt = opt.next;
  if(nxt==='end' || nxt===undefined){
    closeDlg();
  } else if(typeof nxt==='number'){
    DLG.idx = nxt;
    showDlgNode();
  } else if(typeof nxt==='string'){
    var k = findNodeId(nxt);
    if(k>=0){ DLG.idx = k; showDlgNode(); }
    else if(D.dlg[nxt]){
      var ent = DLG.ent;
      DLG = {key:nxt, nodes:D.dlg[nxt], idx:0, ent:ent};
      showDlgNode();
    }
    else closeDlg();
  }
}
function findNodeId(id){
  for(var i=0;i<DLG.nodes.length;i++) if(DLG.nodes[i].id===id) return i;
  return -1;
}
function dlgContinue(){
  if(!DLG) return;
  var node = DLG.nodes[DLG.idx];
  if(!node.opts || node.opts.length===0){
    sfx('ui');
    if(node.fx) runFx(node.fx);
    if(node.next!==undefined){
      if(node.next==='end'){ closeDlg(); return; }
      if(typeof node.next==='number'){ DLG.idx = node.next; showDlgNode(); return; }
      var k = findNodeId(node.next);
      if(k>=0){ DLG.idx = k; showDlgNode(); }
      else if(D.dlg[node.next]){
        var ent = DLG.ent;
        DLG = {key:node.next, nodes:D.dlg[node.next], idx:0, ent:ent};
        showDlgNode();
      }
      else closeDlg();
    } else closeDlg();
  }
}
function closeDlg(){
  var ent = DLG && DLG.ent;
  DLG = null;
  if(G.state==='dlg') G.state = 'play';
  G.uiLock = false;
  if(ent && ent.npcId && G.mode==='story'){
    emitEvent({type:'talk', who:ent.npcId});
    G.flags['dlgCnt_'+ent.npcId] = (G.flags['dlgCnt_'+ent.npcId]||0)+1;
  }
}
/* 条件 */
function condOk(c){
  var parts = c.split(':');
  var k = parts[0];
  if(k==='flag') return G.flags[parts[1]]===true;
  if(k==='not') return !G.flags[parts[1]];
  if(k==='item') return hasItem(parts[1], parseInt(parts[2])||1);
  if(k==='gold') return P && P.money >= parseInt(parts[1]);
  if(k==='chapter') return G.chapter === parseInt(parts[1]);
  if(k==='level') return P && P.lv >= parseInt(parts[1]);
  return true;
}
/* 执行动作 */
function runFx(fx){
  if(!fx) return;
  fx.split('|').forEach(function(a){
    a = a.trim();
    if(!a) return;
    var p = a.split(':');
    var k = p[0], v = p[1];
    switch(k){
      case 'set': G.flags[v] = true; break;
      case 'unset': G.flags[v] = false; break;
      case 'gold': P.money += parseInt(v); sfx('pickup'); break;
      case 'give': {
        var gp = v.split(',');
        var n = parseInt(gp[1])||1;
        if(addItem(gp[0], n)) toast('获得：'+D.items[gp[0]].name+'×'+n);
        emitEvent({type:'collect', item:gp[0], n:n});
        break;
      }
      case 'take': {
        var tp = v.split(',');
        removeItem(tp[0], parseInt(tp[1])||1);
        break;
      }
      case 'heal':
        if(v==='full'){ P.hp = P.maxhp; toast('治疗完成'); }
        else if(DLG && DLG.ent && DLG.ent.healCost){
          var cost = DLG.ent.healCost;
          if(P.money >= cost){ P.money -= cost; P.hp = P.maxhp; toast('治疗完成（-'+cost+'南元）'); sfx('heal'); }
          else toast('钱不够治疗');
        }
        break;
      case 'trade': if(DLG && DLG.ent && DLG.ent.shop) openShop(DLG.ent); break;
      case 'quest': startQuest(v); break;
      case 'reward': completeQuestDirect(v); break;
      case 'fight': {
        var fp = v.split(',');
        var type = fp[0], n = parseInt(fp[1])||1;
        for(var i=0;i<n;i++){
          spawnEnemyAt(type, P.x + rand(-3,3), P.y + rand(-3,3));
        }
        toast('战斗爆发！');
        break;
      }
      case 'pos': {
        var pp = v.split(',');
        var town = D.towns.filter(function(t){return t.id===pp[1];})[0];
        var ent = ENT.filter(function(e){return e.npcId===pp[0];})[0];
        if(ent && town){ ent.x = town.cx; ent.y = town.cy; ent.town = pp[1]; }
        break;
      }
      case 'addXp': addXp(parseInt(v)); break;
      case 'chapterEnd': finishChapter(); break;
      case 'sound': sfx(v); break;
      case 'hostile': setHostile(v); break;
      case 'reposition': if(DLG&&DLG.ent){ DLG.ent.x = P.x + rand(2,4); DLG.ent.y = P.y + rand(-2,2);} break;
    }
  });
}

/* ---- 任务引擎 ---- */
function startQuest(id){
  if(G.quests[id] && G.quests[id].state==='active'){ toast('任务已在进行中'); return; }
  if(G.quests[id] && G.quests[id].state==='done'){ toast('任务已完成'); return; }
  var def = D.sideQuests.filter(function(q){return q.id===id;})[0];
  if(!def) return;
  G.quests[id] = {state:'active', objs: def.objs.map(function(o){ return {cur:0, n:o.n||1}; })};
  toast('新任务：【'+def.name+'】');
  sfx('ui2');
}
function completeQuestDirect(id){
  var def = D.sideQuests.filter(function(q){return q.id===id;})[0];
  if(!def) return;
  var q = G.quests[id];
  if(q && q.state==='active'){
    q.state = 'done';
    G.stats.questsDone++;
    if(def.reward){
      if(def.reward.gold) P.money += def.reward.gold;
      if(def.reward.items) Object.keys(def.reward.items).forEach(function(k){ addItem(k, def.reward.items[k]); });
    }
    G.flags['qrew_'+id] = true;
    toast('任务完成：【'+def.name+'】 获得报酬');
    sfx('heal');
  }
}
function questObjsDone(q){
  return q.objs.every(function(o){ return o.cur >= o.n; });
}
function emitEvent(ev){
  /* 支线 */
  Object.keys(G.quests).forEach(function(id){
    var q = G.quests[id];
    if(q.state!=='active') return;
    var def = D.sideQuests.filter(function(x){return x.id===id;})[0];
    if(!def) return;
    var all = true;
    def.objs.forEach(function(o, i){
      var obj = q.objs[i];
      if(ev.type==='talk' && o.kind==='talk' && ev.who===o.who) obj.cur++;
      if(ev.type==='kill' && o.kind==='kill' && (o.type==='any'||ev.target.enType===o.type)) obj.cur++;
      if(ev.type==='collect' && o.kind==='collect' && ev.item===o.item && (!o.killCheck || ev.target)) {
        if(!o.killCheck) obj.cur = Math.min(obj.n, obj.cur + ev.n||1);
      }
      if(ev.type==='collect' && o.kind==='collect' && o.killCheck && ev.type==='kill' && ev.target.enType===o.killCheck){
        /* 捕蛇类：用击杀计数 */
      }
      if(ev.type==='goto' && o.kind==='goto' && ev.area===o.area) obj.cur++;
      if(obj.cur < obj.n) all = false;
    });
    /* killCheck 处理 */
    if(ev.type==='kill' && ev.target){
      def.objs.forEach(function(o,i){
        if(o.kind==='collect' && o.killCheck && ev.target.enType===o.killCheck){
          q.objs[i].cur++;
        }
      });
    }
    if(questObjsDone(q)){
      /* 自动完成（无交付对话的）或提示去交付 */
      var gmap = {};
      D.sideQuests.forEach(function(sq){ gmap[sq.id] = sq.giver; });
      var giver = gmap[id];
      var hasDelivery = def.dlgDone && giver;
      if(hasDelivery && !def.special){
        toast('任务目标完成，去找'+giverName(giver)+'交付');
      } else {
        completeQuestDirect(id);
      }
    }
  });
  /* 主线章节目标 */
  if(G.mode==='story' && G.state==='play' && !G.paused){
    chapterEmit(ev);
  }
}
function giverName(npcId){
  var n = D.npcs[npcId];
  return n ? n.name : '交付人';
}

/* ---- 章节引擎 ---- */
var CH_OBJS = [];
function currentChapter(){ return D.chapters[G.chapter-1]; }
function startChapter(n){
  G.chapter = n;
  var ch = currentChapter();
  if(!ch) return;
  CH_OBJS = ch.objectives.map(function(o){ return {def:o, cur:0}; });
  /* 过场 */
  uiCutscene(ch.intro, function(){
    if(G.chapter===12){
      var path = null;
      if(G.flags.ch11_open) path = 'ch12_open';
      else if(G.flags.ch11_burn) path = 'ch12_burn';
      else if(G.flags.ch11_seize) path = 'ch12_seize';
      if(path && D.dlg[path]){
        DLG = {key:path, nodes:D.dlg[path], idx:0, ent:null};
        G.state='dlg'; G.uiLock = true; showDlgNode();
        return;
      }
    }
    if(ch.startDlg && D.dlg[ch.startDlg]){
      DLG = {key:ch.startDlg, nodes:D.dlg[ch.startDlg], idx:0, ent:null};
      G.state='dlg'; G.uiLock = true; showDlgNode();
    } else {
      G.state = 'play';
      G.uiLock = false;
      updateObjective();
    }
  });
}
function chapterEmit(ev){
  var all = CH_OBJS.length>0;
  var ch = currentChapter();
  if(!ch) return;
  CH_OBJS.forEach(function(o){
    var d = o.def;
    if(ev.type==='talk' && d.kind==='talk' && ev.who===d.who){
      if(o.cur<1) o.cur = 1;
    }
    if(ev.type==='goto' && d.kind==='goto' && ev.area===d.area){
      if(o.cur<1) o.cur = 1;
      /* 章节区域事件（进入即播对话） */
      if(ch.areaDlg && ch.areaDlg.area===d.area && !G.flags['aread_'+G.chapter+'_'+d.area]){
        G.flags['aread_'+G.chapter+'_'+d.area] = true;
        if(D.dlg[ch.areaDlg.key]){
          DLG = {key:ch.areaDlg.key, nodes:D.dlg[ch.areaDlg.key], idx:0, ent:null};
          G.state='dlg'; G.uiLock=true; showDlgNode();
        }
      }
    }
    if(ev.type==='collect' && d.kind==='collect' && ev.item===d.item){
      var need = d.n||1;
      var have = Math.min(need, (P.inv[d.item]||0));
      if(o.cur < have) o.cur = have;
    }
    if(ev.type==='kill' && d.kind==='kill'){
      if(d.type==='any' || (ev.target && ev.target.enType===d.type)) o.cur++;
    }
    if(ev.type==='level' && d.kind==='level') o.cur = P.lv;
    if(o.cur < (d.n||1)) all = false;
  });
  /* 特例：第10章 击杀铁塔完成"直面铁塔" */
  if(G.chapter===10 && ev.type==='kill' && ev.target && ev.target.enType==='boss'){
    CH_OBJS.forEach(function(o){
      if(o.def.kind==='talk' && o.def.who==='tieta') o.cur = 1;
    });
  }
  /* 第10章：进入铁塔老巢 → 刷Boss */
  if(G.chapter===10 && ev.type==='goto' && ev.area==='b5' && !G.flags.boss_spawned){
    G.flags.boss_spawned = true;
    spawnEnemyAt('boss', 252, 180);
    toast('铁塔的老巢就在前方！');
  }
  /* 第9章：记忆碎片过场 */
  if(G.chapter===9 && ev.type==='collect' && ev.item==='fragment'){
    var have = P.inv.fragment||0;
    var key = have===1?'ch9_frag':(have===2?'ch9_frag2':'ch9_frag3');
    if(!G.flags['fragDlg_'+have] && D.dlg[key]){
      G.flags['fragDlg_'+have] = true;
      DLG = {key:key, nodes:D.dlg[key], idx:0, ent:null};
      G.state='dlg'; G.uiLock=true; showDlgNode();
    }
  }
  if(all) finishChapterObjs();
  updateObjective();
}
function finishChapterObjs(){
  if(G.flags.ch_finished) return;
  var ch = currentChapter();
  if(!ch) return;
  G.flags.ch_finished = true;
  if(ch.endDlg && D.dlg[ch.endDlg]){
    DLG = {key:ch.endDlg, nodes:D.dlg[ch.endDlg], idx:0, ent:null};
    G.state='dlg'; G.uiLock=true; showDlgNode();
  } else {
    finishChapter();
  }
}
function finishChapter(){
  var ch = currentChapter();
  var next = G.chapter+1;
  if(G.chapter===12){
    /* 结局 */
    uiEndCard();
    save();
    return;
  }
  uiChapterCard(ch, next);
}
function chapterNext(){
  G.flags.ch_finished = false;
  G.state = 'play';
  G.uiLock = false;
  G.flags['ch'+G.chapter+'_cleared'] = true;
  save();
  startChapter(G.chapter+1);
}
function updateObjective(){
  var el = $('objective');
  if(!el) return;
  if(G.mode==='story'){
    var ch = currentChapter();
    if(!ch){ el.classList.add('hidden'); return; }
    var lines = [];
    CH_OBJS.forEach(function(o){
      var d = o.def;
      var ok = o.cur >= (d.n||1);
      var hint = d.hint || '';
      var progress = '';
      if(d.kind==='collect') progress = '（'+o.cur+'/'+(d.n||1)+'）';
      if(d.kind==='kill') progress = '（'+o.cur+'/'+(d.n||1)+'）';
      lines.push((ok?'✅ ':'▢ ')+hint+progress);
    });
    el.textContent = '【第'+G.chapter+'章 · '+ch.title+'】\n'+lines.join('\n');
    el.classList.remove('hidden');
  } else {
    el.textContent = '【自由模式】目标：活下去。已生存 '+G.stats.daysSurvived+' 天';
    el.classList.remove('hidden');
  }
}

/* ---- 自由模式随机事件 ---- */
function freeDayEvent(){
  var r = Math.random();
  if(r < 0.3) return;
  if(r < 0.45){
    /* 难民求助 */
    toast('路边难民向你讨水。');
    setTimeout(function(){
      if(P && !P.dead){
        openFreeEvent('难民饿得发抖："好心人，给口水吧……"',
          [{txt:'【给水】给她一瓶水', fx:'take:water,1|give:silver,1|set:free_event_water'},
           {txt:'【拒绝】走开', fx:'set:free_event_none'}]);
      }
    }, 600);
  } else if(r < 0.6){
    var bandit = rndi(1,3);
    for(var i=0;i<bandit;i++) spawnEnemyAt('bandit', P.x+rand(-6,6), P.y+rand(-6,6));
    toast('伏击！土匪从树丛里冲出来！');
  } else if(r < 0.75){
    toast('夜空中，一架无人机无声掠过——机身上印着一只灰隼。');
  } else {
    toast('界河对岸响了一夜的枪声。');
  }
}

/* ---- 存档 ---- */
function save(){
  try{
    var st = {
      v:1, mode:G.mode, chapter:G.chapter, flags:G.flags,
      day:G.day, clock:G.clock,
      x:P.x, y:P.y,
      hp:P.hp, hunger:P.hunger, thirst:P.thirst, eng:P.eng,
      money:P.money, lv:P.lv, xp:P.xp, xpNext:P.xpNext, maxhp:P.maxhp,
      weapon:P.weapon, inv:P.inv,
      quests:G.quests, stats:G.stats, hostile:F_HOSTILE,
      endCard:G.flags.end_done?1:0
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(st));
  }catch(e){}
}
function hasSave(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function loadState(st){
  G.mode = st.mode||'free';
  G.chapter = st.chapter||1;
  G.flags = st.flags||{};
  G.day = st.day||1;
  G.clock = st.clock||0;
  G.quests = st.quests||{};
  G.stats = st.stats||{kills:0,scav:0,bounties:0,questsDone:0,daysSurvived:0};
  P.x = st.x||P.x; P.y = st.y||P.y;
  P.hp = st.hp||P.maxhp; P.hunger = st.hunger||100; P.thirst = st.thirst||100; P.eng = st.eng||100;
  P.money = st.money||CFG.startMoney;
  P.lv = st.lv||1; P.xp = st.xp||0; P.xpNext = st.xpNext||100;
  P.maxhp = st.maxhp||100;
  P.weapon = st.weapon||'fists';
  P.inv = st.inv||{};
  Object.keys(F_HOSTILE).forEach(function(k){ delete F_HOSTILE[k]; });
  Object.keys(st.hostile||{}).forEach(function(k){ F_HOSTILE[k] = true; });
  if(G.chapter>12) G.chapter = 12;
}
function rebuildWorld(){
  /* 清空实体，重建世界（读取后） */
  ENT.length = 0;
  spawnNamed();
  spawnGeneric();
  respawnCamp();
}
function loadGame(continueMode){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ toast('没有找到存档'); return false; }
    var st = JSON.parse(raw);
    if(st.v!==1){ toast('存档版本不兼容'); return false; }
    initWorld();
    if(!P) createPlayer(0,0);
    loadState(st);
    rebuildWorld();
    G.state = 'play';
    G.uiLock = false;
    G.paused = false;
    CH_OBJS = currentChapter()? currentChapter().objectives.map(function(o){return {def:o, cur:0};}) : [];
    CH_OBJS.forEach(function(o){
      var d = o.def;
      if(d.kind==='talk' && (G.flags['dlgCnt_'+d.who]||0)>0) o.cur = 1;
      if(d.kind==='collect') o.cur = Math.min(d.n||1, P.inv[d.item]||0);
      if(d.kind==='goto') o.cur = (G.flags['go_'+d.area])?1:0;
      if(d.kind==='kill' && G.stats['kill_'+d.type]) o.cur = Math.min(d.n||1, G.stats['kill_'+d.type]||0);
    });
    uiHudShow();
    $('boot').classList.add('hidden');
    updateObjective();
    toast('存档已读取，欢迎回来，EIGHT');
    return true;
  }catch(e){ toast('存档损坏：'+e.message); return false; }
}
function exportSave(){
  save();
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    var blob = new Blob([raw], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'HanBerEIGHT_存档_'+ (G.day||1) +'日.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 100);
    toast('存档已导出为文件');
  }catch(e){ toast('导出失败：'+e.message); }
}
function importSave(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var st = JSON.parse(reader.result);
      if(!st.v){ toast('这不是有效的存档文件'); return; }
      localStorage.setItem(SAVE_KEY, reader.result);
      toast('存档已导入，回到主菜单读取即可');
      sfx('pickup');
    }catch(e){ toast('导入失败：'+e.message); }
  };
  reader.readAsText(file);
}

/* ---- 自由模式随机小事件（对话） ---- */
function openFreeEvent(text, opts){
  DLG = {key:'freeev', nodes:[{who:'（路边）', txt:text, opts:opts}], idx:0, ent:null};
  G.state='dlg'; G.uiLock=true; showDlgNode();
}
