<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>博弈论 · 均衡实验室 | 经典案例人机对战</title>
<meta name="description" content="把《博弈论》中的经典案例做成可交互对战：囚徒困境、智猪、斗鸡、猎鹿、最后通牒、海盗分金……与 AI 自由博弈，亲手验证纳什均衡。">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============ 设计令牌：黑白 · 简洁 · 有棱有角 ============ */
:root{
  --bg:#FFFFFF;
  --bg-soft:#F4F4F2;
  --panel:#FFFFFF;
  --panel-2:#ECECE9;
  --line:#111111;
  --line-soft:#D8D8D4;
  --ink:#111111;
  --ink-dim:#5A5A56;
  --ink-faint:#9C9C98;
  --gold:#111111;
  --gold-soft:rgba(17,17,17,.05);
  --red:#111111;
  --red-soft:rgba(17,17,17,.05);
  --green:#111111;
  --green-soft:rgba(17,17,17,.05);
  --blue:#8A8A86;
  --blue-soft:rgba(138,138,134,.09);
  --radius:0;
  --radius-s:0;
  --font-d:"Noto Serif SC", "Songti SC", "STSong", serif;
  --font-b:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-b);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
button{font-family:var(--font-b)}
::selection{background:var(--ink);color:#fff}

/* ============ 布局 ============ */
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
header.site{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--ink);
}
.hd-inner{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:34px;height:34px;flex:none;
  border:2px solid var(--ink);
  display:grid;place-items:center;
  font-family:var(--font-d);font-weight:900;font-size:16px;color:var(--ink);
}
.brand-name{font-family:var(--font-d);font-weight:700;font-size:17px;letter-spacing:.5px}
.brand-name small{display:block;font-family:var(--font-b);font-weight:400;font-size:10px;color:var(--ink-faint);letter-spacing:2px}
nav.hd-nav{display:flex;gap:0}
.nav-btn{
  background:transparent;border:1px solid transparent;color:var(--ink-dim);
  padding:8px 14px;font-size:14px;cursor:pointer;transition:.15s;
}
.nav-btn:hover{color:var(--ink);background:var(--bg-soft)}
.nav-btn.on{color:#fff;background:var(--ink);border-color:var(--ink)}
main{padding:34px 0 70px}

/* ============ 首页 Hero ============ */
.hero{padding:26px 0 30px;border-bottom:2px solid var(--ink);margin-bottom:26px}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;letter-spacing:3px;color:var(--ink);
  border:1px solid var(--ink);padding:5px 12px;
  background:var(--bg);margin-bottom:18px;
}
.hero h1{
  font-family:var(--font-d);font-weight:900;
  font-size:clamp(30px,4.4vw,48px);line-height:1.22;letter-spacing:1px;
}
.hero h1 em{font-style:normal;border-bottom:4px solid var(--ink)}
.hero p.sub{margin-top:14px;max-width:640px;color:var(--ink-dim);font-size:15.5px}
.hero-stats{display:flex;flex-wrap:wrap;margin-top:24px;border:1px solid var(--ink)}
.stat{
  display:flex;align-items:baseline;gap:8px;
  background:var(--bg);
  padding:12px 18px;
  border-right:1px solid var(--ink);
}
.stat:last-child{border-right:none}
.stat b{font-family:var(--font-d);font-size:22px;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--ink-dim)}

/* ============ 筛选 ============ */
.filters{display:flex;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--ink)}
.chip{
  border:none;border-right:1px solid var(--line-soft);
  background:transparent;color:var(--ink-dim);
  padding:10px 20px;font-size:13.5px;cursor:pointer;transition:.15s;
  min-height:44px;
}
.chip:hover{color:var(--ink);background:var(--bg-soft)}
.chip.on{background:var(--ink);color:#fff}

/* ============ 模式卡片网格 ============ */
.grid-modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.mode-card{
  background:var(--panel);
  border:1px solid var(--ink);
  padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;
  transition:transform .15s,box-shadow .15s;
  position:relative;
}
.mode-card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 0 var(--ink)}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mc-cat{font-size:11px;letter-spacing:1px;color:var(--ink);border:1px solid var(--ink);padding:3px 10px;white-space:nowrap}
.mc-name{font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:.5px}
.mc-en{font-size:11px;color:var(--ink-faint);letter-spacing:1.5px;margin-top:2px}
.mc-body{display:flex;gap:14px;align-items:center}
.mc-tagline{flex:1;font-size:13px;color:var(--ink-dim);line-height:1.6}
.mini-matrix{flex:none;display:grid;gap:1px;width:86px;background:var(--ink);border:1px solid var(--ink);padding:1px}
.mini-matrix .mm-cell{background:var(--bg);display:grid;place-items:center;font-size:9.5px;font-family:var(--font-d)}
.mm-cell.rw{color:var(--ink)}
.mm-cell.cl{color:var(--ink-faint)}
.mc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.mc-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;color:var(--ink-dim);border:1px solid var(--line-soft);padding:2px 9px;background:var(--bg)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  font-weight:500;font-size:14px;padding:11px 20px;
  cursor:pointer;transition:.15s;min-height:44px;
  box-shadow:3px 3px 0 0 rgba(17,17,17,.9);
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.small{padding:7px 14px;min-height:38px;font-size:13px;box-shadow:2px 2px 0 0 rgba(17,17,17,.9)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ============ 对战页 ============ */
.gt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.gt-title h2{font-family:var(--font-d);font-weight:900;font-size:clamp(22px,3vw,30px);letter-spacing:.5px}
.gt-title .en{font-size:11.5px;color:var(--ink-faint);letter-spacing:2px;margin-top:4px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13.5px;padding:8px 12px;border:1px solid var(--ink);cursor:pointer;background:transparent;transition:.15s}
.back-btn:hover{color:var(--ink);background:var(--bg-soft)}
.gt-story{
  background:var(--bg);
  border:1px solid var(--ink);border-left:4px solid var(--ink);
  padding:14px 18px;font-size:14px;color:var(--ink-dim);line-height:1.75;
  margin:14px 0 22px;
}
/* 博弈详解面板 */
.gt-detail{background:var(--bg);border:1px solid var(--ink);margin:-8px 0 22px}
.gt-detail-head{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line-soft)}
.gt-detail-head:hover{background:var(--bg-soft)}
.dt-title{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:1px}
.dt-hint{font-size:11.5px;color:var(--ink-faint);flex:1}
.dt-arrow{color:var(--ink);transition:transform .25s;flex:none}
.gt-detail.collapsed .dt-arrow{transform:rotate(-90deg)}
.gt-detail-body{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;padding:4px 18px 20px}
.dt-sec h4{font-size:12px;color:var(--ink);letter-spacing:1.5px;margin-bottom:6px;display:flex;align-items:center;gap:7px;font-weight:700}
.dt-sec h4::before{content:"";width:7px;height:7px;background:var(--ink);flex:none}
.dt-sec p{font-size:13.5px;color:var(--ink-dim);line-height:1.85}
.dt-sec.full{grid-column:1/-1}
@media(max-width:640px){.gt-detail-body{grid-template-columns:1fr}}
.gt-layout{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:22px;align-items:start}
.gt-col{display:flex;flex-direction:column;gap:18px}

/* 收益矩阵卡 */
.matrix-card{background:var(--panel);border:1px solid var(--ink);padding:18px}
.mc-label{font-size:12px;color:var(--ink-dim);letter-spacing:1.5px;display:flex;justify-content:space-between;margin-bottom:12px}
.matrix{display:grid;gap:1px;background:var(--ink);padding:1px}
.matrix .cell{
  position:relative;background:var(--bg);min-height:86px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;
  transition:background .2s;
}
.matrix .cell::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--line-soft);
}
.matrix .cell .pv-r{position:absolute;left:12px;bottom:9px;font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--ink)}
.matrix .cell .pv-c{position:absolute;right:12px;top:9px;font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--ink-faint)}
.matrix .cell .act{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
.matrix .cell.nash{
  box-shadow:inset 0 0 0 3px var(--ink);
  animation:nashpulse 2.4s ease-in-out infinite;
}
@keyframes nashpulse{
  0%,100%{box-shadow:inset 0 0 0 3px var(--ink)}
  50%{box-shadow:inset 0 0 0 3px var(--ink),0 0 0 6px rgba(17,17,17,.1)}
}
.matrix .cell.hit{background:var(--bg-soft)}
.mx-axis{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--ink-dim)}
.mx-axis .you{color:var(--ink);font-weight:600}
.mx-axis .rival{color:var(--ink-faint)}
.mx-legend{display:flex;gap:18px;margin-top:10px;font-size:11.5px;color:var(--ink-dim)}
.mx-legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;display:inline-block;background:var(--ink)}

/* 控制面板 */
.ctrl-card{background:var(--panel);border:1px solid var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ctrl-row label{font-size:13px;color:var(--ink-dim)}
select,input[type=range]{
  background:var(--bg);border:1px solid var(--ink);color:var(--ink);
  padding:8px 12px;font-size:14px;font-family:var(--font-b);min-height:40px;
}
select:focus{outline:2px solid var(--ink);outline-offset:-2px}
input[type=range]{accent-color:var(--ink);padding:0;border:none;width:100%}
.range-wrap{display:flex;align-items:center;gap:12px;width:100%}
.range-wrap output{font-family:var(--font-d);font-weight:700;color:var(--ink);font-size:17px;min-width:34px;text-align:right}
.ai-hint{font-size:12px;color:var(--ink-faint);line-height:1.6}

/* 选择区 */
.play-card{background:var(--panel);border:1px solid var(--ink);padding:18px}
.play-title{font-size:13px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:14px}
.play-actions{display:flex;gap:12px;flex-wrap:wrap}
.action-btn{
  flex:1;min-width:150px;min-height:60px;
  background:var(--bg);border:1px solid var(--ink);color:var(--ink);
  font-size:16px;font-family:var(--font-d);font-weight:600;letter-spacing:2px;
  cursor:pointer;transition:.15s;position:relative;
}
.action-btn:hover{background:var(--ink);color:#fff}
.action-btn.on{background:var(--ink);color:#fff}
.action-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.action-btn .sub{display:block;font-family:var(--font-b);font-weight:400;font-size:11px;letter-spacing:.5px;color:var(--ink-faint);margin-top:3px}
.action-btn:hover .sub,.action-btn.on .sub{color:rgba(255,255,255,.7)}
.slider-act{width:100%}

/* 结果面板 */
.result-card{background:var(--panel);border:1px solid var(--ink);padding:18px;display:none}
.result-card.show{display:block;animation:fadeup .35s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rs-reveal{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.rs-pick{flex:1;min-width:200px;background:var(--bg-soft);border:1px solid var(--line-soft);padding:12px 14px}
.rs-pick .who{font-size:11px;color:var(--ink-faint);letter-spacing:1.5px;margin-bottom:4px}
.rs-pick .what{font-family:var(--font-d);font-weight:700;font-size:17px}
.rs-pick.you .what{color:var(--ink)}
.rs-pick.rival .what{color:var(--ink-dim)}
.rs-payoff{display:flex;gap:18px;flex-wrap:wrap;background:var(--bg-soft);border:1px solid var(--line-soft);padding:12px 16px;margin-bottom:14px}
.rs-payoff .po{font-size:12.5px;color:var(--ink-dim)}
.rs-payoff .po b{display:block;font-family:var(--font-d);font-size:20px;color:var(--ink)}
.rs-payoff .po.you b{color:var(--ink)}
.rs-payoff .po.rival b{color:var(--ink-dim)}
.rs-ana{font-size:13.5px;color:var(--ink-dim);line-height:1.8;border-top:1px dashed var(--ink);padding-top:12px}
.rs-ana b{color:var(--ink);font-weight:600}
.rs-ana .eq-line{color:var(--ink);margin-top:6px}

/* 记分与图表 */
.score-card{background:var(--panel);border:1px solid var(--ink);padding:18px}
.score-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.score-top .st-label{font-size:12px;color:var(--ink-dim);letter-spacing:1px}
.score-nums{display:flex;gap:24px;font-family:var(--font-d)}
.score-nums .s-you b{color:var(--ink);font-size:26px}
.score-nums .s-rival b{color:var(--ink-dim);font-size:26px}
.score-nums .s-num{font-size:11px;color:var(--ink-faint);display:flex;flex-direction:column}
.chart-box{width:100%;height:120px;margin-top:10px}
.chart-box svg{width:100%;height:100%;display:block}
.round-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rpill{font-size:11px;color:var(--ink-dim);border:1px solid var(--line-soft);padding:3px 8px;background:var(--bg)}
.rpill.you-win{border-color:var(--ink);color:var(--ink)}
.rpill.ai-win{border-color:var(--ink-faint);color:var(--ink-dim)}
.rpill.tie{border-color:var(--line-soft);color:var(--ink-faint)}

/* 结算弹层 */
.modal-mask{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:100;display:grid;place-items:center;padding:20px;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:460px;background:var(--bg);
  border:2px solid var(--ink);
  padding:28px;text-align:center;
  box-shadow:8px 8px 0 0 var(--ink);
  animation:fadeup .35s ease;
}
.modal .m-kicker{font-size:11.5px;letter-spacing:3px;color:var(--ink-faint);margin-bottom:8px}
.modal h3{font-family:var(--font-d);font-weight:900;font-size:26px;letter-spacing:1px;margin-bottom:6px}
.modal .m-rating{font-family:var(--font-d);font-weight:700;color:var(--ink);font-size:18px;margin:6px 0 14px}
.modal .m-score{display:flex;justify-content:center;gap:34px;margin:16px 0}
.modal .m-score .ms{font-size:12px;color:var(--ink-dim)}
.modal .m-score .ms b{display:block;font-family:var(--font-d);font-size:26px;color:var(--ink)}
.modal .m-score .ms.you b{color:var(--ink)}
.modal .m-score .ms.rival b{color:var(--ink-dim)}
.modal .m-best{font-size:12.5px;color:var(--ink-dim);margin-bottom:8px}
.modal .m-best b{color:var(--ink)}
.modal .m-note{font-size:13px;color:var(--ink-dim);line-height:1.8;margin:12px 0 20px}
.modal .m-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ============ 概念手册 ============ */
.learn-intro{max-width:720px;margin-bottom:26px}
.learn-intro h2{font-family:var(--font-d);font-weight:900;font-size:clamp(24px,3.4vw,34px);letter-spacing:1px;margin-bottom:12px}
.learn-intro p{color:var(--ink-dim);font-size:14.5px}
.grid-learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.learn-card{background:var(--bg);border:1px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.learn-card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 0 var(--ink)}
.learn-card .lc-no{font-family:var(--font-d);color:var(--ink);font-size:13px;letter-spacing:2px}
.learn-card h3{font-family:var(--font-d);font-weight:700;font-size:18px;letter-spacing:.5px}
.learn-card p{font-size:13.5px;color:var(--ink-dim);line-height:1.8}
.learn-card .lc-link{font-size:12.5px;color:var(--ink);cursor:pointer;border-top:1px solid var(--ink);padding-top:10px;margin-top:auto}
.learn-card .lc-link:hover{text-decoration:underline}

/* ============ 页脚 ============ */
footer.site{border-top:2px solid var(--ink);padding:26px 0 40px;color:var(--ink-faint);font-size:12.5px}
footer.site .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer b{color:var(--ink-dim);font-weight:600}

/* ============ 响应式 ============ */
@media(max-width:900px){
  .gt-layout{grid-template-columns:1fr}
}
@media(max-width:640px){
  .hd-inner{height:56px}
  .brand-name{font-size:15px}
  .nav-btn{padding:7px 10px;font-size:13px}
  main{padding:24px 0 60px}
  .grid-modes,.grid-learn{grid-template-columns:1fr}
  .action-btn{min-width:130px}
  .modal{padding:22px}
  .hero-stats{display:block}
  .stat{border-right:none;border-bottom:1px solid var(--ink)}
  .stat:last-child{border-bottom:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= 数据层：17 个经典博弈案例 ================= */
const CATS = [
  {id:'matrix', name:'经典矩阵博弈'},
  {id:'seq',    name:'序贯谈判博弈'},
  {id:'social', name:'社会与市场博弈'}
];

const GAMES = {

  /* ---------- 1 囚徒困境 ---------- */
  prisoner:{
    id:'prisoner', name:'囚徒困境', en:"Prisoner's Dilemma", cat:'matrix',
    tagline:'你与同伙被分开审讯：沉默还是坦白？',
    story:'你和同伙因案件被分开审讯，无法串供。警察分别给你们同样的选择：沉默，或坦白并指证对方。判决取决于你们两人各自的选择。',
    type:'matrix',
    matrix:{rows:['沉默','坦白'], cols:['沉默','坦白'], values:[[[1,1],[0,3]],[[3,0],[2,2]]], rowLabel:'你', colLabel:'同伙'},
    nash:[[1,1]],
    ai:[
      {id:'rand',name:'随机',desc:'凭直觉随机出招'},
      {id:'sneaky',name:'狡诈',desc:'总是坦白，利益至上'},
      {id:'honest',name:'老实',desc:'总是沉默，选择信任'},
      {id:'ttt',name:'一报还一报',desc:'模仿你上一轮的选择'}
    ],

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = n => Math.floor(Math.random()*n);
const pick = arr => arr[rand(arr.length)];

const S = {
  route:'home', gameId:null, aiId:null, total:5,
  round:0, p:0, a:0, hist:[], over:false, busy:false,
  role:'proposer',
  auctionType:'first',
  seq:{}
};

function bestScore(id){ try{ return +localStorage.getItem('gt-best-'+id)||0 }catch(e){ return 0 } }
function saveBest(id,v){ try{ if(v>bestScore(id)) localStorage.setItem('gt-best-'+id, v) }catch(e){} }
const g = () => GAMES[S.gameId];
const aiObj = () => g().ai.find(a => a.id === S.aiId);

function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const parts = h.split('/');
  if(parts[0]==='game' && GAMES[parts[1]]) return {route:'game', id:parts[1]};
  if(parts[0]==='learn') return {route:'learn'};
  return {route:'home'};
}

function boot(){
  const r = parseHash();
  if(r.route==='game'){
    if(S.gameId !== r.id) initGame(r.id);
    S.route='game';
  } else { S.route = r.route; }
  render();
}
window.addEventListener('hashchange', boot);

function initGame(id){
  S.gameId=id; S.route='game'; S.aiId=g().ai[0].id; S.total=5; S.role='proposer'; S.auctionType='first';
  resetRound();
}
function resetRound(){
  S.round=0; S.p=0; S.a=0; S.hist=[]; S.over=false; S.busy=false; S.seq={};
  if(S.gameId==='bar') S.seq.types = buildBarCrowd();
}

  const eqTag = gm.matrix ? (gm.nash && gm.nash.length ? '纯策略均衡' : '混合均衡') : (gm.cat==='seq' ? '序贯博弈' : '社会困境');
  const mini = vals ? miniMatrix(vals) : '<div class="mini-matrix" style="grid-template-columns:repeat(2,1fr)"><div class="mm-cell rw" style="grid-column:span 2">'+(gm.cat==='seq'?'回合':'多轮')+'</div></div>';
  const tags = gm.concepts.filter(c => c !== eqTag).slice(0,2);

/* 矩阵 AI 决策 */
function matrixAIMove(){
  const gm = g(), n = gm.matrix.rows.length;
  const ai = aiObj();
  const ph = S.hist.map(h=>h.pi);
  switch(ai.id){
    case 'rand': return rand(n);
    case 'a0': case 'honest': case 'hard': case 'timid': case 'conserv':
    case 'ideal': case 'opera': case 'dove': case 'balance': return 0;
    case 'a1': case 'sneaky': case 'smart': case 'tough': case 'boxing':
    case 'hawkish': return n-1;
    case 'ttt': case 'probing':
      return S.hist.length ? ph[ph.length-1] : (gm.aiInit&&gm.aiInit.ttt!=null ? gm.aiInit.ttt : 0);
    case 'cycle':
      return S.hist.length ? (S.hist.length % n) : 0;
    case 'adapt': case 'reader': {
      if(!S.hist.length) return rand(n);
      const freq = new Array(n).fill(0);
      ph.forEach(i=>freq[i]++);
      let best=0, bv=-Infinity;
      for(let j=0;j<n;j++){
        let ev=0;
        for(let i=0;i<n;i++) ev += (freq[i]/S.hist.length) * gm.matrix.values[i][j][1];
        if(ev>bv){ bv=ev; best=j; }
      }
      return best;
    }
    case 'counter': {
      if(!S.hist.length) return rand(n);
      const last = ph[ph.length-1];
      if(gm.id==='rps') return (last+2)%3;
      if(gm.id==='pennies') return 1-last;
      return rand(n);
    }
    default: return rand(n);
  }
}

/* 最佳应对计算 */
function bestResponses(aiIdx){
  const m = g().matrix;
  const col = m.values.map(r => r[aiIdx][0]);
  const mx = Math.max(...col);
  return col.map((v,i) => v===mx ? i : -1).filter(i => i>=0);
}

/* 矩阵回合结算 */
function matrixChoose(i){
  if(S.busy || S.over) return;
  S.busy = true;
  const btns = document.querySelectorAll('.action-btn');
  btns.forEach(b => b.disabled = true);
  const aiIdx = matrixAIMove();
  setTimeout(() => {
    const cell = g().matrix.values[i][aiIdx];
    S.round++; S.p += cell[0]; S.a += cell[1];
    S.hist.push({r:S.round, pi:i, ai:aiIdx, p:cell[0], a:cell[1], pTot:S.p, aTot:S.a});
    showMatrixResult(i, aiIdx, cell);
    S.busy = false;
    btns.forEach(b => b.disabled = false);
    if(S.total>0 && S.round>=S.total) finishGame();
  }, 500);
}

function drawChart(){
  const box = $('#chartBox'); if(!box) return;
  const h = S.hist;
  if(h.length < 2){
    box.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px">再玩几轮，累计得分曲线就会出现</div>`;
    return;
  }
  const W=560, H=112, pad=8;
  const allV = h.flatMap(x => [x.pTot, x.aTot]);
  const maxV = Math.max(...allV, 1), minV = Math.min(0, ...allV);
  const range = (maxV-minV) || 1;
  const px = i => pad + i*(W-2*pad)/(h.length-1);
  const py = v => H - pad - (v-minV)*(H-2*pad)/range;
  const pts = key => h.map((x,i) => `${px(i).toFixed(1)},${py(x[key]).toFixed(1)}`).join(' ');
  const end = key => [px(h.length-1).toFixed(1), py(h[h.length-1][key]).toFixed(1)];
  box.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${pad}" y1="${py(0)}" x2="${W-pad}" y2="${py(0)}" stroke="var(--line-soft)" stroke-width="1" stroke-dasharray="4 5"/>
      <polyline fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts('pTot')}"/>
      <polyline fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts('aTot')}"/>
      <circle cx="${end('pTot')[0]}" cy="${end('pTot')[1]}" r="3.5" fill="var(--gold)"/>
      <circle cx="${end('aTot')[0]}" cy="${end('aTot')[1]}" r="3.5" fill="var(--blue)"/>
    </svg>`;
}
function drawPills(){
  const box = $('#pills'); if(!box) return;
  box.innerHTML = S.hist.map(h => {
    const cls = h.p > h.a ? 'you-win' : h.p < h.a ? 'ai-win' : 'tie';
    return `<span class="rpill ${cls}">R${h.r} 你${h.p>0?'+':''}${h.p} 对${h.a>0?'+':''}${h.a}</span>`;
  }).join('');
}

function pirateOutcome(k, coins){
  if(k===1) return [coins];
  const cont = pirateOutcome(k-1, coins);
  const need = Math.floor(k/2);
  const idx = [...Array(k-1).keys()].sort((a,b) => cont[a]-cont[b]);
  const chosen = idx.slice(0, need);
  const out = new Array(k).fill(0);
  let keep = coins;
  for(const i of chosen){
    const give = Math.min(cont[i]+1, coins);
    out[i+1] = give; keep -= give;
  }
  out[0] = keep;
  return out;
}

      p = mine === low ? low+2 : low-2;
      a = aiClaim === low ? low+2 : low-2;
      desc = `低者（${lowGuy}）报 ${low}，获赔 ${low}+2=${low+2}；高者报 ${high}，仅获 ${low}-2=${low-2}`;
    }
    showSeqResult(`
      <div class="rs-reveal">
        <div class="rs-pick you"><div class="who">你申报</div><div class="what">${mine} 元</div></div>
        <div class="rs-pick rival"><div class="who">${esc(ai.name)}申报</div><div class="what">${aiClaim} 元</div></div>
      </div>
      <div class="rs-payoff"><span class="po you">你获赔<b>${p}</b></span><span class="po rival">对方获赔<b>${a}</b></span></div>
      <div class="rs-ana">${desc}。${ai.id==='rational'
        ? '对方是逻辑学家：唯一的纳什均衡是双方都报 2——你可以试试用 2 锁死他。'
        : '对方没按纯逻辑来，而这正是真实实验里多数人的行为。'} ${g().eqText}</div>`, p, a);
    if(!S.over) bindGame();
  });
}

/* --- 密封拍卖 --- */
function auctionRightHTML(){
  return `
    <div class="play-card">
      <div class="play-title">第 <b>${S.round+1}</b> 轮 · 你的出价</div>
      <div class="ctrl-row" style="margin-bottom:12px">
        <select id="aucType">
          <option value="first" ${S.auctionType==='first'?'selected':''}>一级价格（付自己的出价）</option>
          <option value="second" ${S.auctionType==='second'?'selected':''}>二级价格（付第二高价）</option>
        </select>
      </div>
      <div class="range-wrap"><input type="range" id="bidA" min="0" max="100" value="90"><output id="bidAOut">90</output></div>
      <div style="font-size:12.5px;color:var(--ink-dim)">你出价 <b id="bidAmt" style="color:var(--gold)">90</b> 元</div>
      <div style="margin-top:12px"><button class="btn" id="submitA" style="width:100%">密封出价</button></div>
    </div>
    ${resultAndScore()}`;
}
function bindAuction(){
  const gm = g();
  const at = $('#aucType');
  at.addEventListener('change', () => { S.auctionType = at.value; bindGame(); });
  const kp = $('#bidA');
  kp.addEventListener('input', () => { $('#bidAOut').textContent = kp.value; $('#bidAmt').textContent = kp.value; });
  $('#submitA').addEventListener('click', () => {
    const mine = +kp.value;
    const ai = aiObj();
    let aiBid;
    switch(ai.id){
      case 'rational': aiBid = S.auctionType==='first' ? 88 : 100; break;
      case 'agg': aiBid = 100; break;
      case 'conserv': aiBid = 70; break;
      case 'rand': aiBid = rand(101); break;
    }
    const v = gm.value;
    let p=0, a=0, desc;
    if(mine === aiBid){
      const win = Math.random() < 0.5;
      const pay = mine;
      if(win){ p = v - pay; desc = `出价相同（${mine}），你抽中得标，支付 ${pay}，净收益 ${p}`; }
      else { a = v - pay; desc = `出价相同（${mine}），对方抽中得标，支付 ${pay}，净收益 ${a}`; }
    } else if(mine > aiBid){
      const pay = S.auctionType==='first' ? mine : aiBid;
      p = v - pay;
      desc = `你以 ${mine} 得标，${S.auctionType==='first' ? `支付自己的 ${pay}` : `只需支付第二高价 ${pay}`}，净收益 ${p}`;
    } else {
      const pay = S.auctionType==='first' ? aiBid : mine;
      a = v - pay;
      desc = `对方以 ${aiBid} 得标，${S.auctionType==='first' ? `支付 ${pay}` : `只需支付第二高价 ${pay}`}，净收益 ${a}`;
    }
    showSeqResult(`
      <div class="rs-reveal">
        <div class="rs-pick you"><div class="who">你出价</div><div class="what">${mine}</div></div>
        <div class="rs-pick rival"><div class="who">${esc(ai.name)}出价</div><div class="what">${aiBid}</div></div>
      </div>
      <div class="rs-payoff"><span class="po you">你净收益<b>${p>0?'+':''}${p}</b></span><span class="po rival">对方净收益<b>${a>0?'+':''}${a}</b></span></div>
      <div class="rs-ana">${desc}。${S.auctionType==='first'
        ? '一级价格下，报得比估值低才有利可图；报 100 赢下来就是 "赢者诅咒"。'
        : '二级价格（Vickrey）下，如实报 100 是占优策略——报价高低都不影响你支付，只影响你能否得标。'} ${g().eqText}</div>`, p, a);
    if(!S.over) bindGame();
  });
}

/* --- 酒吧（少数者）博弈 --- */
function buildBarCrowd(){
  const id = S.aiId || 'mix';
  const mk = t => ({t});
  if(id==='contrarian') return [mk('c'),mk('c'),mk('c'),mk('c'),mk('c'),mk('c'),mk('c'),mk('c'),mk('c')];
  if(id==='follower') return [mk('f'),mk('f'),mk('f'),mk('f'),mk('f'),mk('f'),mk('f'),mk('f'),mk('f')];
  return [mk('c'),mk('c'),mk('c'),mk('f'),mk('f'),mk('f'),mk('r'),mk('r'),mk('r')];
}
function barAIMove(p){
  const crowd = (S.seq.lastCrowd !== undefined) ? S.seq.lastCrowd : -1;
  const go = Math.random() < 0.8;
  if(p.t==='c'){
    if(crowd>5) return go?0:1;
    if(crowd>=0) return go?1:0;
    return Math.random()<0.5?0:1;
  }
  if(p.t==='f'){
    if(crowd>5) return go?1:0;
    if(crowd>=0) return go?0:1;
    return Math.random()<0.5?0:1;
  }
  return Math.random()<0.5?0:1;
}
function barRightHTML(){
  return `
    <div class="play-card">
      <div class="play-title">第 <b>${S.round+1}</b> 轮 · 今晚去不去酒吧</div>
      <div class="play-actions">
        <button class="action-btn" data-bar="1">去酒吧<span class="sub">人少就赚，人多就亏</span></button>
        <button class="action-btn" data-bar="0">不去<span class="sub">人少就亏，人多就赚</span></button>
      </div>
    </div>
    ${resultAndScore()}`;
}
function bindBar(){
  document.querySelectorAll('[data-bar]').forEach(b => b.addEventListener('click', () => {
    if(S.busy || S.over) return;
    S.busy = true;
    const go = +b.dataset.bar;
    const crowd = S.seq.types.map(p => barAIMove(p));
    const goCount = go + crowd.filter(x=>x===1).length;
    const crowded = goCount > 5;
    const p = go ? (crowded ? -1 : 1) : (crowded ? 1 : -1);
    const a = crowd.reduce((s,x) => s + (x ? (crowded?-1:1) : (crowded?1:-1)), 0) / 9;
    S.seq.lastCrowd = goCount;
    setTimeout(() => {
      showSeqResult(`
        <div class="rs-reveal">
          <div class="rs-pick you"><div class="who">你的选择</div><div class="what">${go?'去酒吧':'不去'}</div></div>
          <div class="rs-pick rival"><div class="who">结果</div><div class="what">${goCount} 人去了酒吧（${crowded?'拥挤':'清静'}）</div></div>
        </div>
        <div class="rs-payoff"><span class="po you">你本轮<b>${p>0?'+':''}${p}</b></span><span class="po rival">AI 平均<b>${a>0?'+':''}${a.toFixed(2)}</b></span></div>
        <div class="rs-ana">${crowded
          ? '去的人太多，去的都亏了。多数人猜"会火"时，火已经结束了。'
          : '去的人少，少数派赢了。'} ${g().eqText}</div>`, p, Math.round(a*10)/10);
      S.busy = false;
      if(S.total>0 && S.round>=S.total) finishGame();
    }, 500);
  }));
}

/* ================= 结算 ================= */
function finishGame(){
  S.over = true;
  const gm = g();
  const best = Math.max(bestScore(S.gameId), S.p);
  saveBest(S.gameId, S.p);
  let rate, note;
  if(gm.type==='matrix'){
    const hits = S.hist.filter(h => bestResponses(h.ai).includes(h.pi)).length;
    const hr = S.hist.length ? hits/S.hist.length : 0;
    rate = hr < 0.4 ? '直觉玩家' : hr < 0.65 ? '老练策略家' : hr < 0.85 ? '均衡猎手' : '博弈论宗师';
    note = `你的 ${S.hist.length} 次出招中 ${hits} 次命中最佳应对（${Math.round(hr*100)}%）` + (hr>=0.85 ? '——你已经能稳定读出对手的最优反制。' : '——对手的每个选择都有唯一最优解，去矩阵里找它。');
  } else {
    const net = S.p - S.a;
    rate = net >= 20 ? '收割者' : net > 0 ? '精明玩家' : net > -10 ? '诚实玩家' : '理想主义者';
    note = `净收益 ${net>0?'+':''}${net}（你对 ${S.a} 对方）。` + (net>0 ? '你用策略把好处攥在了手里。' : '你更在意合作与公平——这也是一种博弈观。');
  }
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal">
      <div class="m-kicker">本局结算</div>
      <h3>${gm.name}</h3>
      <div class="m-rating">${rate}</div>
      <div class="m-score">
        <span class="ms you"><b>${S.p}</b>你的累计收益</span>
        <span class="ms rival"><b>${S.a}</b>对手累计收益</span>
      </div>
      <div class="m-best">历史最高分 <b>${best}</b></div>
      <div class="m-note">${note}</div>
      <div class="m-actions">
        <button class="btn" id="again">再来一局</button>
        <button class="btn ghost" id="more">换一个博弈</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  $('#again').addEventListener('click', () => { mask.remove(); resetRound(); render(); });
  $('#more').addEventListener('click', () => { mask.remove(); location.hash = '#/'; });
}

/* ================= 分发绑定 ================= */
function bindMatrix(){
  document.querySelectorAll('.action-btn').forEach(b => b.addEventListener('click', () => matrixChoose(+b.dataset.act)));
}
function bindSeq(){
  switch(g().type){
    case 'ultimatum': bindUltimatum(); break;
    case 'dictator': bindDictator(); break;
    case 'centipede': bindCentipede(); break;
    case 'pirate': bindPirate(); break;
    case 'trust': bindTrust(); break;
    case 'public': bindPublic(); break;
    case 'traveler': bindTraveler(); break;
    case 'auction': bindAuction(); break;
    case 'bar': bindBar(); break;
  }
}

boot();

</script>

    window.YT_USER = u;

    var pre = '_yt_' + u + '_';
    var g = Storage.prototype.getItem, sw = Storage.prototype.setItem, r = Storage.prototype.removeItem;
    Storage.prototype.getItem = function(k){
      if(typeof k !== 'string' || k.indexOf(pre) === 0) return g.call(this, k);
      var scoped = g.call(this, pre + k);
      if(scoped !== null) return scoped;
      var legacy = g.call(this, k);
      if(legacy !== null){ try{ sw.call(this, pre + k, legacy); r.call(this, k); }catch(e){} }
      return legacy;
    };
    Storage.prototype.setItem = function(k, v){
      if(typeof k === 'string' && k.indexOf(pre) !== 0){ try{ sw.call(this, pre + k, v); }catch(e){} }
      else{ try{ sw.call(this, k, v); }catch(e){} }
    };

      else r.call(this, k);
    };

})();
