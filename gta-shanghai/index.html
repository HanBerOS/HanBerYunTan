<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA: 上海像素城 · GTA Shanghai Pixel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-wrap">
  <canvas id="game-canvas" width="1280" height="720"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-money">¥ 0</div>
    <div id="hud-wanted" title="通缉等级"></div>
    <div id="hud-loc"></div>
    <div id="hud-speed" style="display:none">0 km/h</div>
    <div id="hud-hint"></div>
    <div id="hud-notice"></div>
  </div>

  <!-- 遮罩界面 -->
  <div id="overlay" class="hidden">
    <div id="panel"></div>
  </div>

  <!-- 标题界面 -->
  <div id="title-screen" class="screen">
    <h1>GTA · 上海像素城</h1>
    <p class="sub">SHANGHAI PIXEL CITY — 单人开放世界 · 全NPC</p>
    <div class="title-buttons">
      <button id="btn-new" class="btn-main">新 游 戏</button>
      <button id="btn-continue" class="btn-main">继续游戏</button>
    </div>
    <p class="tip">WASD/方向键移动 · E上下车 · F互动 · M总地图 · B产业菜单 · Tab暂停</p>
    <p class="notice">本游戏为虚构像素沙盒，不含任何真实犯罪内容。游戏世界与现实上海仅为地名致敬，无真实还原。</p>
  </div>

  <!-- 死亡/被捕 -->
  <div id="arrest-screen" class="screen hidden">
    <h2>你被警方控制</h2>
    <p id="arrest-msg"></p>
    <button id="btn-respawn" class="btn-main">缴纳罚金继续</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/mapgen.js"></script>
<script src="js/engine.js"></script>
<script src="js/world.js"></script>
<script src="js/systems.js"></script>
<script src="js/main.js"></script>
</body>
</html>
